<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Álgebra de bolsillo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Repaso tipo Duolingo de Álgebra (UDIMA), UD1: vectores, rectas y planos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Concepto: una columna silenciosa sobre papel liso. La tinta azul marca la acción; el verde y el rojo solo corrigen.
   El movimiento lleva el ritmo: muelles cortos al tocar, la barra que se llena y se calienta con las rachas. */
:root, html:root[data-app-theme="light"] {
  --paper: #F4F5F7;
  --card: #FFFFFF;
  --ink: #12151C;
  --ink-2: #5D6476;
  --line: #E3E6EC;
  --line-deep: #CBD0DA;
  --accent: #2B4DDB;
  --accent-deep: #1D3AB0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E9EDFD;
  --ok: #16A34F;
  --ok-hi: #5BE08F;
  --ok-soft: #E3F5E9;
  --ok-ink: #0D7A3A;
  --ok-deep: #0D7A3A;
  --on-ok: #FFFFFF;
  --bad: #DC3B42;
  --bad-soft: #FCEBEC;
  --bad-ink: #BE2C33;
  --on-bad: #FFFFFF;
  --faq: #B5600B;
  --star: #F2A900;
  --faq-soft: #FCEEDC;
  --turn: #6A3FC6;
  --turn-soft: #EEE6FC;
  --dir: #2563EB;
  --nor: #D33A2C;
  --scrim: rgba(12, 16, 28, 0.42);
  --shadow: 0 1px 2px rgba(18, 21, 28, 0.05), 0 10px 30px -14px rgba(18, 21, 28, 0.18);
  --f-display: "Bricolage Grotesque", "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --f-ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-math: "STIX Two Text", "Times New Roman", Georgia, serif;
  --r: 18px;
  --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
  --spring: cubic-bezier(0.34, 1.5, 0.64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D0F14; --card: #171A21; --ink: #E8EBF1; --ink-2: #99A1B3; --line: #262B35; --line-deep: #363D4A;
    --accent: #7F98FF; --accent-deep: #5B77EC; --accent-ink: #0A0F24; --accent-soft: #1B2244;
    --ok: #34D27F; --ok-hi: #9BF5C0; --ok-soft: #0F2A1B; --ok-ink: #5BE79A; --ok-deep: #22B36A; --on-ok: #04140B;
    --bad: #FF6B70; --bad-soft: #321719; --bad-ink: #FF8E92; --on-bad: #2A0709;
    --faq: #F2A54A; --faq-soft: #35260F; --star: #F7C343; --turn: #B597FF; --turn-soft: #261E42; --dir: #6EA2FF; --nor: #FF6E62;
    --scrim: rgba(0, 0, 0, 0.58); --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 30px -14px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"], html:root[data-app-theme="dark"] {
  --paper: #0D0F14; --card: #171A21; --ink: #E8EBF1; --ink-2: #99A1B3; --line: #262B35; --line-deep: #363D4A;
  --accent: #7F98FF; --accent-deep: #5B77EC; --accent-ink: #0A0F24; --accent-soft: #1B2244;
  --ok: #34D27F; --ok-hi: #9BF5C0; --ok-soft: #0F2A1B; --ok-ink: #5BE79A; --ok-deep: #22B36A; --on-ok: #04140B;
  --bad: #FF6B70; --bad-soft: #321719; --bad-ink: #FF8E92; --on-bad: #2A0709;
  --faq: #F2A54A; --faq-soft: #35260F; --star: #F7C343; --turn: #B597FF; --turn-soft: #261E42; --dir: #6EA2FF; --nor: #FF6E62;
  --scrim: rgba(0, 0, 0, 0.58); --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 30px -14px rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}
html:root[data-app-theme="light"] { color-scheme: light; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font: 16px/1.5 var(--f-ui); background: var(--paper);
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
.wrap { max-width: 600px; margin: 0 auto; min-width: 0; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* ---------- fórmulas ---------- */
.m { font-family: var(--f-math); font-size: 1.08em; overflow-wrap: anywhere; }
.m i { font-style: italic; }
.bv { font-family: var(--f-math); font-weight: 700; font-style: normal; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.86em; line-height: 1.15; margin: 0 0.12em; }
.fr-n { border-bottom: 1.3px solid currentColor; padding: 0 0.2em 0.05em; }
.fr-d { padding: 0.05em 0.2em 0; }
.sq { white-space: nowrap; }
.sq-in { border-top: 1.3px solid currentColor; padding: 0 0.12em; margin-left: 0.04em; }
.ar { position: relative; display: inline-block; padding-top: 0.38em; line-height: 1; }
.ar::before { content: ""; position: absolute; left: 0.06em; right: 0.12em; top: 0.16em; border-top: 1.3px solid currentColor; }
.ar::after { content: ""; position: absolute; right: -0.02em; top: calc(0.16em - 0.17em + 0.6px); border-style: solid; border-width: 0.17em 0 0.17em 0.3em; border-color: transparent transparent transparent currentColor; }
.sys { display: inline-flex; vertical-align: middle; margin: 0.15em 0; }
.sys-l { display: flex; flex-direction: column; gap: 0.15em; border-left: 2px solid currentColor; border-radius: 0.7em 0 0 0.7em; padding: 0.1em 0 0.1em 0.55em; }
.mat { position: relative; display: inline-flex; vertical-align: middle; padding: 0 0.32em; margin: 0.15em 0.1em; font-family: var(--f-math); }
.mat::before, .mat::after { content: ""; position: absolute; top: 0; bottom: 0; width: 0.3em; border: 1.5px solid currentColor; }
.mat::before { left: 0; border-right: 0; }
.mat::after { right: 0; border-left: 0; }
.mat table { border-collapse: collapse; }
.mat td { padding: 0.05em 0.42em; text-align: right; font-variant-numeric: tabular-nums; }
.mat.aug td.rhs { border-left: 1.3px solid currentColor; }
.fml { margin: 0.6em 0; padding: 0.7em 0.9em; background: var(--accent-soft); border-radius: 12px; text-align: center; overflow-x: auto; }
.fml .m { font-size: 1.15em; }

/* ---------- dibujos ---------- */
.fig { margin: 0.4em 0 0.8em; }
.fig-svg { width: 100%; max-width: 340px; height: auto; display: block; margin: 0 auto; overflow: visible; }
.fig-svg line, .fig-svg polygon, .fig-svg path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig-svg .ink { stroke: var(--ink); } .fig-svg .mut { stroke: var(--line-deep); stroke-width: 1.6; }
.fig-svg .dir { stroke: var(--dir); } .fig-svg .nor { stroke: var(--nor); } .fig-svg .acc { stroke: var(--accent); } .fig-svg .ok { stroke: var(--ok); } .fig-svg .turn { stroke: var(--turn); }
.fig-svg .grid { stroke: var(--line); stroke-width: 1; }
.fig-svg .hd { stroke: none; }
.fig-svg .ink.hd, .fig-svg .ink.pt { fill: var(--ink); stroke: none; } .fig-svg .dir.hd { fill: var(--dir); } .fig-svg .nor.hd { fill: var(--nor); } .fig-svg .acc.hd, .fig-svg .acc.pt { fill: var(--accent); stroke: none; } .fig-svg .ok.hd { fill: var(--ok); } .fig-svg .turn.hd { fill: var(--turn); }
.fig-svg .soft { fill: var(--accent-soft); fill-opacity: 0.85; } .fig-svg .soft2 { fill: var(--turn-soft); fill-opacity: 0.85; } .fig-svg .soft3 { fill: var(--faq-soft); fill-opacity: 0.85; }
.fig-svg .fillno { fill: none; }
.fig-svg text { fill: var(--ink); font: italic 16px var(--f-math); }
.fig-svg text.bold { font-weight: 700; font-style: normal; }
.fig-svg text.cap { font: 600 12px var(--f-ui); fill: var(--ink-2); text-anchor: middle; font-style: normal; }
.fig-svg .dirt { fill: var(--dir); } .fig-svg .nort { fill: var(--nor); } .fig-svg .acct { fill: var(--accent); } .fig-svg .okt { fill: var(--ok); } .fig-svg .turnt { fill: var(--turn); }
.dirt { color: var(--dir); } .nort { color: var(--nor); }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; border: 1px solid var(--line); border-radius: 14px; padding: 0.7em 1.1em; font-weight: 650; background: var(--card); color: var(--ink); text-decoration: none;
  transition: transform 0.3s var(--spring), background-color 0.2s, border-color 0.2s, color 0.2s; }
.btn:active { transform: scale(0.97); transition-duration: 0.08s; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:disabled { background: var(--line); color: var(--ink-2); cursor: default; transform: none; }
.btn.okb { background: var(--ok); border-color: transparent; color: var(--on-ok); }
.btn.badb { background: var(--bad); border-color: transparent; color: var(--on-bad); }
.btn.big { width: 100%; font-size: 1.05rem; padding: 0.95em 1em; border-radius: 16px; letter-spacing: 0.01em; }
.btn.small { padding: 0.48em 0.85em; font-size: 0.9rem; border-radius: 11px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--ink-2); transition: transform 0.3s var(--spring), background-color 0.2s; }
.icon-btn:active { background: var(--accent-soft); transform: scale(0.92); transition-duration: 0.08s; }
.icon-btn svg, .tab svg, .btn svg { width: 22px; height: 22px; }
.ai-only { display: none !important; }
body.ai-on .ai-only { display: inline-flex !important; }

/* ---------- estructura ---------- */
#view { padding-block: 14px calc(100px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 18px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { width: 40px; height: 40px; flex: none; }
.brand h1, .top h1 { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
.sub { margin: 3px 0 0; color: var(--ink-2); font-size: 0.9rem; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--card) 86%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: transparent; border-radius: 12px; padding: 6px 2px 4px; color: var(--ink-2); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em; transition: color 0.2s; }
.tab.on { color: var(--accent); }
.tab.on::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.tab:not(.on)::after { content: ""; width: 4px; height: 4px; }
.tabs.enter .tab.on svg { animation: tabPop 0.45s var(--spring); }
body.in-ses #view, body.in-ses .tabs { display: none; }

/* ---------- hoy ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
.stat { background: var(--card); border-radius: var(--r); padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; min-width: 0; }
.stat .num { font: 650 1.8rem/1.05 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat .lab { font-size: 0.7rem; color: var(--ink-2); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.ring { width: 44px; height: 44px; }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: var(--line); } .ring .fg { stroke: var(--ok); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: var(--card); border-radius: var(--r); padding: 12px; margin-bottom: 18px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.7rem; font-weight: 600; color: var(--ink-2); }
.wd i { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-deep); display: block; box-sizing: border-box; }
.wd.half i { background: linear-gradient(0deg, var(--ok) 50%, transparent 50%); border-color: var(--ok); }
.wd.full i { background: var(--ok); border-color: var(--ok); }
.wd.today { color: var(--ink); }
.wd.today i { outline: 1.5px solid var(--accent); outline-offset: 2px; }
.cta { width: 100%; text-align: left; border: 0; border-radius: 22px; padding: 20px 18px 18px 20px; background: var(--accent); color: var(--accent-ink); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; margin-bottom: 12px;
  transition: transform 0.35s var(--spring); }
.cta:active { transform: scale(0.98); transition-duration: 0.08s; }
.cta > span:not(.cta-go) { grid-column: 1; }
.cta-k { font-size: 0.72rem; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }
.cta-t { font: 650 1.35rem/1.2 var(--f-display); letter-spacing: -0.015em; }
.cta-s { font-size: 0.88rem; opacity: 0.85; }
.cta-go { grid-column: 2; grid-row: 1 / span 3; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent-ink) 16%, transparent); transition: transform 0.35s var(--spring); }
.cta-go svg { width: 22px; height: 22px; }
.cta:active .cta-go { transform: translateX(4px); }
.row-btn { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 0; background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 8px; transition: transform 0.35s var(--spring); }
.row-btn:active { transform: scale(0.985); transition-duration: 0.08s; }
.row-btn .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.row-btn .ic.warm { background: var(--faq-soft); color: var(--faq); }
.row-btn .ic.violet { background: var(--turn-soft); color: var(--turn); }
.row-btn .ic svg { width: 20px; height: 20px; }
.row-btn b { display: block; font-size: 1rem; font-weight: 650; }
.row-btn small { display: block; color: var(--ink-2); font-size: 0.85rem; }
.row-btn .chev { margin-left: auto; color: var(--line-deep); display: grid; transition: transform 0.35s var(--spring), color 0.2s; }
.row-btn:active .chev { transform: translateX(3px); color: var(--ink-2); }
.row-btn .pill { margin-left: auto; }
.row-btn .pill + .chev { margin-left: 4px; }
.pill { display: inline-block; min-width: 1.6em; padding: 0 0.5em; border-radius: 999px; background: var(--bad); color: var(--on-bad); font-size: 0.78rem; font-weight: 700; text-align: center; }
.note { color: var(--ink-2); font-size: 0.9rem; margin: 8px 2px 0; }

/* ---------- temario ---------- */
.part { margin: 4px 0 26px; }
.part-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 0 0 14px; }
.part-t { min-width: 0; }
.part-n { display: block; font-size: 0.72rem; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.part-h h2 { font-size: 1.25rem; }
.part-h .chip { flex: none; }
.chip { font-size: 0.68rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--ink-2); }
.chip.new { background: var(--accent-soft); color: var(--accent); }
.path { list-style: none; margin: 0; padding: 0; }
.node { position: relative; padding-top: 16px; }
.node:first-child { padding-top: 0; }
.node + .node::before { content: ""; position: absolute; left: 25px; top: -1px; height: 13px; border-left: 1.5px solid var(--line-deep); }
.node + .node::after { content: ""; position: absolute; left: 21.5px; top: 9px; border-style: solid; border-width: 5px 4.25px 0 4.25px; border-color: var(--line-deep) transparent transparent transparent; }
.node button { width: 100%; display: flex; align-items: center; gap: 14px; border: 0; background: transparent; text-align: left; padding: 0; transition: transform 0.35s var(--spring); }
.node button:active { transform: scale(0.98); transition-duration: 0.08s; }
.dot { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 650 1.15rem var(--f-display); background: var(--card); border: 1.5px solid var(--line-deep); color: var(--ink-2); font-variant-numeric: tabular-nums; box-sizing: border-box; }
.node.done .dot { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.node.cur .dot { border: 2px solid var(--accent); color: var(--accent); animation: pulse 2.4s var(--ease) infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 35%, transparent); } 70%, 100% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 0%, transparent); } }
.nt { min-width: 0; }
.nt b { display: block; font-size: 1rem; font-weight: 650; line-height: 1.25; }
.nt small { color: var(--ink-2); font-size: 0.84rem; }
.stars { color: var(--star); letter-spacing: 0.08em; }
.stars .off { color: var(--line-deep); }

/* ---------- tarjetas y teoría ---------- */
.card { background: var(--card); border-radius: var(--r); padding: 18px; margin-bottom: 12px; }
.card h2 { font-size: 1.2rem; margin-bottom: 4px; }
.card h3 { font-size: 1.05rem; margin-bottom: 4px; }
.card p { margin: 0.35em 0; }
.card .btn { margin-top: 10px; }
.card .row-btn { background: var(--paper); }
.tc { background: var(--card); border-radius: var(--r); padding: 18px; margin-bottom: 12px; }
.tc h3 { font-size: 1.12rem; margin-bottom: 8px; }
.tc p { margin: 0.45em 0; }
.ul { margin: 0.3em 0; padding-left: 1.15em; display: grid; gap: 0.45em; }
.box { border-radius: 12px; padding: 0.75em 0.95em; margin: 0.7em 0 0.2em; font-size: 0.95rem; }
.box.key { background: var(--accent-soft); } .box.key b { color: var(--accent); }
.box.faq { background: var(--faq-soft); } .box.faq b { color: var(--faq); }
.box.err { background: var(--bad-soft); } .box.err b { color: var(--bad-ink); }
.box.chk { background: var(--ok-soft); } .box.chk b { color: var(--ok-ink); }
.steps { margin: 0.4em 0; padding-left: 1.3em; display: grid; gap: 0; }
.steps li { padding: 0.5em 0; border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps .why { color: var(--ink-2); font-size: 0.92em; }
.steps .why:empty { display: none; }
.tbl { overflow-x: auto; margin: 0.5em 0; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
.tbl th, .tbl td { text-align: left; padding: 0.45em 0.5em; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { white-space: nowrap; font-family: var(--f-display); font-weight: 650; }
.goal { color: var(--ink-2); margin: 4px 0 12px; }
.theory-h { margin: 6px 0 14px; }
.theory-h .chip { margin-bottom: 8px; display: inline-block; }
.theory-h h2 { font-size: 1.45rem; }

/* ---------- sesión ---------- */
#ses { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--paper); }
#ses[hidden] { display: none !important; }
.ses-top { padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 6px; }
.ses-top .wrap { display: flex; align-items: center; gap: 8px; }
.bar-w { position: relative; flex: 1; min-width: 0; }
.bar { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; transform-origin: 0 50%; }
.bar span { position: relative; display: block; height: 100%; min-width: 0; border-radius: 999px; overflow: hidden;

function parseNum(str) {

    let v = unary();
    for (;;) {
      const c = peek();
      if (c === '*') { i++; v *= unary(); }
      else if (c === '/') { i++; v /= unary(); }

  }

  function atom() {
    const c = peek();
    if (c === '√') { i++; return Math.sqrt(atom()); }
    if (c === '(') { i++; const v = expr(); if (peek() !== ')') throw new Error('par'); i++; return v; }

}

function normSpec(s0, rng) {
  const s = Object.assign({}, s0);
  if (s.type === 'num') {
    s.kind = 'slots';
    s.form = [s.pre ? s.pre + ' ' : '', 0, s.unit ? ' ' + s.unit : ''];
    s.expect = [s.ans];
    if (!s.ansH) s.ansH = (s.pre ? s.pre + ' ' : '') + M(N(s.ans)) + (s.unit || '');
  } else if (s.type === 'vec') {
    s.kind = 'slots';
  } else if (s.type === 'tf') {
    s.kind = 'mc'; s.view = ['Verdadero', 'Falso']; s.correctView = s.correct ? 0 : 1; s.ansH = s.correct ? 'Verdadero' : 'Falso'; s.isTF = true;
  } else if (s.type === 'mc') {
    s.kind = 'mc';
    const order = s.keep ? s.opts.map((_, i) => i) : rng.shuffle(s.opts.map((_, i) => i));
    s.view = order.map(i => s.opts[i]); s.correctView = order.indexOf(s.correct); s.ansH = s.opts[s.correct];
  } else if (s.type === 'spot') {
    s.kind = 'spot'; s.ansH = 'La línea ' + (s.wrong + 1);
  } else if (s.type === 'chain') {
    s.kind = 'chain'; s.steps = s.steps.map(st => normSpec(st, rng));
  }
  if (s.kind === 'slots') s.nslots = s.form.filter(x => typeof x === 'number').length;
  return s;
}

  return it;
}

  const vals = strs.map(parseNum);
  if (vals.some(v => Number.isNaN(v))) return { ok: false, invalid: true, vals };
  if (s.check) return { ok: !!s.check(vals), vals };
  let approx = false;
  const ok = s.expect.every((e, i) => {
    const ev = val(e);
    if (s.tol && s.tol.abs !== undefined) return Math.abs(vals[i] - ev) <= s.tol.abs;
    if (near(vals[i], ev)) return true;

function hexFig(X, Y, base = 0) {

  const pos = k => (k === 'O' ? [cx, cy] : [cx + R * Math.cos(ang[k] * Math.PI / 180), cy - R * Math.sin(ang[k] * Math.PI / 180)]);
  const A0 = ks[base % 6], B0 = ks[(base + 1) % 6];
  // etiqueta junto a la mitad de la flecha: a por el lado de las agujas del reloj, b por el contrario
  const lab = (k, side, d) => { const t = ang[k] * Math.PI / 180, ux = Math.cos(t), uy = -Math.sin(t); return [cx + ux * R * 0.32 - side * uy * d - 4, cy + uy * R * 0.32 + side * ux * d + 5]; };
  let b = poly(ks.map(pos), 'mut fillno');
  b += arw(cx, cy, ...pos(A0), 'dir') + arw(cx, cy, ...pos(B0), 'turn');
  b += tx(...lab(A0, 1, 13), 'a', 'lab bold dirt') + tx(...lab(B0, -1, 13), 'b', 'lab bold turnt');
  for (const k of Object.keys(ang)) { const [x, y] = pos(k), dx = (x - cx) * 0.22, dy = (y - cy) * 0.22; b += dot(x, y) + tx(x + dx - 5, y + dy + 5, k, 'lab'); }
  b += dot(cx, cy) + tx(cx - 16, cy + 5, 'O', 'lab');
  if (X && Y) { const p = pos(X), q = pos(Y); b += arw(p[0], p[1], q[0], q[1], 'acc', 3.4); }
  return svgW(260, 200, b, 'Hexágono regular de centro O con los vectores a y b');
}
function projFig() {
  let b = arw(30, 130, 250, 130, 'dir') + tx(238, 150, 'u', 'lab bold dirt');
  b += arw(30, 130, 160, 40, 'acc') + tx(82, 72, 'v', 'lab bold acct');
  b += arw(30, 130, 160, 130, 'ok', 4) + tx(70, 150, 'proy', 'lab okt');
  b += seg(160, 40, 160, 130, 'nor', 'stroke-dasharray="5 4" stroke-width="2"') + tx(168, 92, 'v − proy', 'lab nort');
  b += `<path d="M150 130 V120 H160" class="mut fillno"/>`;
  return svgW(270, 165, b, 'Proyección de v sobre u: la sombra y la parte perpendicular');
}
function lineFig() {
  let b = '';
  for (let i = 0; i <= 10; i++) b += seg(20 + i * 24, 10, 20 + i * 24, 190, 'grid') + seg(20, 10 + i * 18, 260, 10 + i * 18, 'grid');
  b += seg(30, 175, 250, 30, 'ink', 'stroke-width="2.2"');
  const t =[220, -145], L = Math.hypot(...t), d = [t[0] / L, t[1] / L], n = [-d[1], d[0]];
  const P0 = [30 + 0.4 * 220, 175 - 0.4 * 145];
  b += arw(P0[0], P0[1], P0[0] + 70 * d[0], P0[1] + 70 * d[1], 'dir', 3) + tx(P0[0] + 72 * d[0], P0[1] + 72 * d[1] + 20, 'd', 'lab bold dirt');
  b += arw(P0[0], P0[1], P0[0] - 60 * n[0], P0[1] - 60 * n[1], 'nor', 3) + tx(P0[0] - 62 * n[0] - 16, P0[1] - 62 * n[1], 'n', 'lab bold nort');
  b += dot(P0[0], P0[1]) + tx(P0[0] + 8, P0[1] + 20, 'P', 'lab');
  return svgW(280, 200, b, 'Recta con su vector director d y su vector normal n');
}
function planeFig() {
  let b = poly([[30, 150], [190, 150], [250, 95], [90, 95]], 'mut soft');
  b += arw(110, 128, 180, 128, 'dir') + tx(178, 146, 'u', 'lab bold dirt');
  b += arw(110, 128, 140, 102, 'turn') + tx(146, 104, 'v', 'lab bold turnt');
  b += arw(110, 128, 110, 30, 'nor', 3) + tx(118, 40, 'n', 'lab bold nort');
  b += dot(110, 128) + tx(92, 142, 'P', 'lab');
  return svgW(270, 165, b, 'Plano con dos direcciones u y v y su vector normal n');
}
function threeFig() {
  const W = 104, gap = 8; let b = '';
  const panel = (i, body, cap) => `<g transform="translate(${i * (W + gap)},0)">${body}${tx(W / 2, 128, cap, 'cap')}</g>`;
  const p1 = poly([[10, 92], [64, 92], [94, 70], [40, 70]], 'mut soft') + poly([[40, 70], [40, 18], [94, 18], [94, 70]], 'mut soft2') + poly([[40, 70], [40, 18], [10, 40], [10, 92]], 'mut soft3') + dot(40, 70, 'acc');
  const p2 = seg(52, 12, 52, 104, 'acc', 'stroke-width="3"') + poly([[52, 12], [92, 26], [92, 108], [52, 104]], 'mut soft') + poly([[52, 12], [14, 26], [14, 108], [52, 104]], 'mut soft2') + poly([[52, 12], [70, 40], [70, 112], [52, 104]], 'mut soft3');
  const p3 = poly([[8, 96], [70, 96], [96, 78], [34, 78]], 'mut soft') + poly([[8, 34], [70, 34], [96, 16], [34, 16]], 'mut soft') + poly([[50, 104], [50, 10], [62, 2], [62, 96]], 'mut soft3');
  b += panel(0, p1, 'Un punto') + panel(1, p2, 'Una recta') + panel(2, p3, 'Ningún punto');
  return svgW(3 * W + 2 * gap, 138, b, 'Las tres posiciones de tres planos: un punto, una recta o ningún punto');
}
function dlineFig() {
  let b = seg(20, 140, 260, 110, 'ink', 'stroke-width="2.2"') + tx(232, 104, 'recta', 'cap');
  const P0 = [60, 135], dir = [240, -30], L = Math.hypot(...dir), u = [dir[0] / L, dir[1] / L];
  const Q = [190, 40], v = [Q[0] - P0[0], Q[1] - P0[1]], k = v[0] * u[0] + v[1] * u[1], F0 = [P0[0] + k * u[0], P0[1] + k * u[1]];
  b += arw(P0[0], P0[1], Q[0], Q[1], 'acc') + tx(108, 76, 'v', 'lab bold acct');
  b += arw(P0[0], P0[1], F0[0], F0[1], 'ok', 4) + tx(118, 146, 'sombra', 'lab okt');
  b += seg(Q[0], Q[1], F0[0], F0[1], 'nor', 'stroke-dasharray="5 4" stroke-width="2.4"') + tx(Q[0] + 8, (Q[1] + F0[1]) / 2, 'distancia', 'lab nort');
  b += dot(...P0) + tx(P0[0] - 8, P0[1] + 20, 'P', 'lab') + dot(...Q) + tx(Q[0] - 4, Q[1] - 10, 'Q', 'lab');
  return svgW(290, 165, b, 'Distancia de un punto Q a una recta: parte perpendicular de v');
}
function dplaneFig() {
  let b = poly([[20, 150], [180, 150], [250, 100], [90, 100]], 'mut soft');
  const A = [80, 135], B = [190, 36], H = [190, 126];
  b += arw(A[0], A[1], A[0], A[1] - 70, 'nor', 3) + tx(A[0] - 18, A[1] - 60, 'n', 'lab bold nort');
  b += arw(A[0], A[1], B[0], B[1], 'acc') + tx(128, 78, 'v', 'lab bold acct');
  b += seg(B[0], B[1], H[0], H[1], 'ok', 'stroke-dasharray="5 4" stroke-width="2.4"') + tx(B[0] + 8, 86, 'altura', 'lab okt');
  b += dot(...A) + tx(A[0] - 8, A[1] + 18, 'A', 'lab') + dot(...B) + tx(B[0] + 6, B[1] - 6, 'B', 'lab');
  return svgW(270, 165, b, 'Distancia de un punto B a un plano: la altura, sombra de v sobre el normal');
}
function figHTML(f) {
  if (!f) return '';
  const k = f.k;
  const s = k === 'hex' ? hexFig(f.X, f.Y, f.base) : k === 'proj' ? projFig() : k === 'line' ? lineFig() : k === 'plane' ? planeFig() : k === 'three' ? threeFig() : k === 'dline' ? dlineFig() : k === 'dplane' ? dplaneFig() : '';
  return s ? `<figure class="fig">${s}</figure>` : '';
}

async function initRemote() {

});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }
  if (!session || !$('#sheet').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (session.phase === 'fb' && e.key === 'Enter') { e.preventDefault(); advance(); return; }
  if (session.phase !== 'q') return;
  const sp = curSpec();
  if (sp.kind === 'slots') {
    const map = { '-': '−', '.': ',', ',': ',', '/': '/', r: '√', s: '√' };
    if (/^[0-9]$/.test(e.key)) keyPress(e.key);
    else if (map[e.key]) keyPress(map[e.key]);
    else if (e.key === 'Backspace') keyPress('⌫');
    else if (e.key === 'Tab') keyPress('→');
    else if (e.key === 'Enter') doCheck();
    else return;
    e.preventDefault();
  } else if (/^[1-9]$/.test(e.key) && +e.key <= (sp.view || sp.lines).length) { session.ans.pick = +e.key - 1; renderSession(); }
  else if (e.key === 'Enter') doCheck();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { saveLocal(); flushWrite(); } });

// ---------- arranque (y conservar la sesión si la página se actualiza mientras estudias) ----------
function snap() {
  try {
    if (session && session.phase !== 'end') return { view, session: { mode: session.mode, lessonId: session.lessonId || null, queue: session.queue, idx: session.idx, results: session.results, xp: session.xp, started: session.started } };
  } catch (e) { /* sin sesión que guardar */ }
  return { view };
}
function restore(d) {
  if (!isObj(d)) return;
  if (VIEWS[d.view]) view = d.view;
  const ss = d.session;
  if (isObj(ss) && Array.isArray(ss.queue) && ss.idx < ss.queue.length && ss.queue.every(e => e && G[e.g])) { beginSession(ss); loadItem(); }
}
render(); initAI(); initRemote();
let booted = false;
function boot(data) {
  if (booted) return; booted = true;
  try { restore(data); } catch (e) { session = null; }
  render();
}
const HOT = window.claude && window.claude.hot;
try { if (HOT && typeof HOT.snapshot === 'function') HOT.snapshot(snap); } catch (e) { /* sin recarga en caliente */ }
if (HOT && typeof HOT.ready === 'function') {
  try { HOT.ready(boot); } catch (e) { boot({}); }
  setTimeout(() => boot((HOT && HOT.data) || {}), 1500);
} else boot((HOT && HOT.data) || {});

})();

<script>
const REP = { errors: [], log: [], items: 0, kinds: {} };
window.addEventListener('error', e => REP.errors.push('error: ' + e.message + ' @' + (e.filename||'').slice(-20) + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => REP.errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)));
const oce = console.error; console.error = (...a) => { REP.errors.push('console.error: ' + a.map(String).join(' ')); oce.apply(console, a); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const q = s => document.querySelector(s);
function act(name, data = {}) { const b = document.createElement('button'); b.dataset.act = name; Object.assign(b.dataset, data); b.hidden = true; document.body.appendChild(b); b.click(); b.remove(); }
function click(sel) { const el = q(sel); if (!el) throw new Error('no encuentro ' + sel); el.click(); }
function report() { const pre = document.createElement('pre'); pre.id = 'REPORT'; pre.textContent = JSON.stringify(REP, null, 1); document.body.appendChild(pre); }
async function playSession(maxSteps = 4000) {
  for (let n = 0; n < maxSteps; n++) {
    await sleep(5);
    const ses = q('#ses');
    if (!ses || ses.hidden) return 'cerrada';
    if (q('#ses [data-act="ses-start"]')) { click('#ses [data-act="ses-start"]'); continue; }
    if (q('#ses .end')) return 'fin';
    if (q('#sb > .wrap.leave')) continue;
    const nextB = q('#ses [data-act="next"]');
    if (nextB) {
      if (Math.random() < 0.15) { click('#ses [data-act="sol"]'); await sleep(2); if (q('#sheet').hidden) REP.errors.push('no abre paso a paso'); act('sheet-x'); }
      nextB.click(); continue;
    }
    const slots = document.querySelectorAll('#ses .slot');
    const opts = document.querySelectorAll('#ses .opt, #ses .line');
    REP.items++;
    const tg = q('#ses .kick .tag:not(.sim)'); if (tg && REP.tags) REP.tags.push(tg.textContent);
    const r = Math.random();
    if (r < 0.2 && q('#ses [data-act="dunno"]')) { click('#ses [data-act="dunno"]'); REP.kinds.dunno = (REP.kinds.dunno||0)+1; continue; }
    if (slots.length) {
      REP.kinds.slots = (REP.kinds.slots||0)+1;
      slots.forEach((s, i) => { s.click(); const keys = ['1','−','2','√','/','3',',','0']; const k1 = keys[(i + REP.items) % keys.length]; act('key', { k: k1 === '√' || k1 === '/' || k1 === ',' ? '2' : k1 }); act('key', { k: '1' }); });
    } else if (opts.length) { REP.kinds.opts = (REP.kinds.opts||0)+1; opts[Math.floor(Math.random() * opts.length)].click(); }
    else { REP.errors.push('ejercicio sin entrada: ' + (q('#ses .q') || {}).textContent); act('ses-exit'); return 'roto'; }
    const c = q('#ses [data-act="check"]');
    if (!c || c.disabled) { REP.errors.push('Comprobar desactivado tras responder: ' + (q('#ses .q') || {}).textContent.slice(0, 80)); act('ses-exit'); return 'roto'; }
    c.click();
  }
  return 'demasiados pasos';
}
(async () => { try {
    await sleep(50);
    if (!q('#view .brand')) REP.errors.push('no se ve la pantalla de inicio');
    for (const v of ['mapa','repaso','formulas','hoy']) { act('tab', { v }); await sleep(2); if (!q('#view .top')) REP.errors.push('vista vacía ' + v); }
    act('settings'); await sleep(2); if (!q('#sheet .set-row')) REP.errors.push('ajustes vacíos'); act('goal', { v: '30' }); act('sheet-x');
    for (let i = 1; i <= 21; i++) { act('lesson', { l: 'L' + i }); await sleep(2); act('theory', { l: 'L' + i }); await sleep(2); if (!q('#sheet .tc')) REP.errors.push('sin teoría L' + i); act('sheet-x');
      act('start', { l: 'L' + i }); const res = await playSession(); REP.log.push('L' + i + ': ' + res);
      if (res === 'fin') {
        const nres = document.querySelectorAll('#ses .res').length, nbad = document.querySelectorAll('#ses .res.bad').length;
        if (!nres) REP.errors.push('L' + i + ' sin lista de respuestas');
        const rb = q('#ses [data-act="retry"]');
        if (!!rb !== nbad > 0) REP.errors.push('L' + i + ' botón de reintento incoherente: ' + nbad + ' fallos');
        if (rb && i % 4 === 1) { rb.click(); const rr = await playSession(); REP.log.push('L' + i + ' reintento (' + nbad + '): ' + rr + ' · ' + document.querySelectorAll('#ses .res').length + ' en el resumen'); if (document.querySelectorAll('#ses .res').length !== nbad) REP.errors.push('el reintento no tiene ' + nbad + ' ejercicios'); }
        act('ses-exit');
      } }
    act('review'); REP.log.push('repaso: ' + await playSession()); act('ses-exit');
    act('mix'); REP.log.push('mezcla: ' + await playSession()); act('ses-exit');
    act('sim'); const rs = await playSession(); REP.log.push('simulacro: ' + rs); if (q('#ses .res')) { click('#ses .res'); await sleep(2); if (!q('#sheet .card')) REP.errors.push('sin solución de simulacro'); act('sheet-x'); } act('ses-exit');
    act('start', { l: 'L3' }); await sleep(5); act('ses-close'); await sleep(2); act('ses-exit');
    const st = JSON.parse(localStorage.getItem('algebra-bolsillo-v1'));
    REP.state = { lessons: Object.keys(st.lessons).length, srs: Object.keys(st.srs).length, days: st.days, sim: st.sim, goal: st.settings.goal };
    act('tab', { v: 'hoy' }); await sleep(2); REP.home = q('#view').textContent.replace(/\s+/g, ' ').slice(0, 400);
    act('tab', { v: 'mapa' }); await sleep(2); REP.map = q('#view').textContent.replace(/\s+/g, ' ').slice(0, 300);
  } catch (e) { REP.errors.push('guion: ' + e.message + ' ' + e.stack); } report(); })();</script></body></html>
