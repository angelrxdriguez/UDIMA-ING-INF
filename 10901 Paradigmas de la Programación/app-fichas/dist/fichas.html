":"= no calcula: unifica X con la estructura 2+3, en la que + actúa como functor. is evalúa la expresión de la derecha y liga X con el resultado, 5. Por eso el factorial usa is.","src":"Unidad 4 p. 11; S4 diap. 15","imp":1,"code":"?- X = 2 + 3.\n?- X is 2 + 3.","ficha":"ud4-039"},{"id":"p4-028","ud":4,"tema":"Prolog: operadores","q":"Con esta base, ¿qué responde `?- \\+ listo(pedro).`?","ops":["`true`, porque `listo(pedro)` no se puede demostrar","`false`, porque no hay ningún hecho sobre `pedro`","`false`, porque `\\+` falla cuando su meta falla","Un error, porque `pedro` no aparece en ningún hecho de la base"],"why":"\\+ Meta tiene éxito cuando Meta falla. listo(pedro) exige ingeniero(pedro), que no está en la base; por tanto falla y \\+ listo(pedro) da true. Es la negación como fallo: lo que no se puede demostrar se toma por falso.","src":"Unidad 4 p. 11; Preguntas_1 (EJM0)","imp":1,"code":"ingeniero(juan).\ningeniero(ana).\nlisto(X) :- ingeniero(X).","ficha":"ud4-036"},{"id":"p4-029","ud":4,"tema":"Prolog: operadores","q":"¿Qué hace el corte (`!`) cuando Prolog lo alcanza al resolver una regla?","ops":["Fija las decisiones tomadas hasta ahí e impide el backtracking más allá","Hace fallar la regla en curso y obliga a probar la cláusula siguiente","Niega la meta que le sigue: tiene éxito si esa meta no se puede demostrar","Fuerza la evaluación aritmética de la expresión que aparece a su derecha"],"why":"El corte poda la búsqueda: las alternativas anteriores a ! ya no se exploran. Se usa con cuidado, porque mal colocado hace perder soluciones. Negar una meta es lo que hace \\+, y evaluar una expresión, is.","src":"Unidad 4 p. 11","imp":2,"ficha":"ud4-037"},{"id":"p4-030","ud":4,"tema":"Prolog: operadores","q":"¿Cómo se escribe en Prolog la comparación aritmética «menor o igual que»?","ops":["`X =\u003c Y`","`X \u003c= Y`","`X =:= Y`","`X \\= Y`"],"why":"Los comparadores de la unidad son =:=, =\\=, \u003c, =\u003c, > y >=: en el «menor o igual» el = va delante. \u003c= no está entre ellos; =:= es la igualdad numérica y \\= comprueba que dos términos no unifican.","src":"Unidad 4 p. 11","imp":2,"ficha":"ud4-040"},{"id":"p4-031","ud":4,"tema":"Prolog: operadores","q":"Con esta base, ¿qué responde `?- hermano(beatriz, Y).` pidiendo todas las soluciones?","ops":["`Y = carlos`","`Y = beatriz ; Y = carlos`","`Y = ana`","`false`"],"why":"Z = ana. progenitor(ana, Y) da primero Y = beatriz, pero beatriz \\= beatriz falla y Prolog retrocede; con Y = carlos la condición se cumple. \\= es lo que impide que alguien sea hermano de sí mismo.","src":"Unidad 4 p. 12–13","imp":2,"code":"progenitor(ana, beatriz).\nprogenitor(ana, carlos).\nhermano(X, Y) :- progenitor(Z, X),\n    progenitor(Z, Y), X \\= Y.","ficha":"ud4-041"},{"id":"p4-032","ud":4,"tema":"Prolog: consultas y recursión","q":"Durante la resolución de una consulta, una rama de la búsqueda falla. ¿Qué hace Prolog?","ops":["Retrocede al último punto de decisión válido y prueba la siguiente alternativa","Detiene la consulta y responde `false` sin explorar las demás ramas posibles","Vuelve a empezar la consulta desde el primer hecho de toda la base de conocimiento","Salta a la última cláusula del programa y continúa la búsqueda desde ella"],"why":"Es el backtracking. En ?- abuelo(ana, Z), la rama Y = beatriz falla (Beatriz no tiene hijos); Prolog retrocede, prueba Y = carlos y obtiene Z = elena. Solo responde false cuando se agotan todas las alternativas.","src":"S4 diap. 13–14; Unidad 4 p. 12","imp":1,"ficha":"ud4-042"},{"id":"p4-033","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Qué distingue una consulta de verificación de una de búsqueda en Prolog?","ops":["La de búsqueda lleva variables y Prolog responde con sus valores","La de verificación lleva variables y Prolog responde true o false","La de búsqueda termina en `;` y la de verificación termina en punto","La de verificación consulta hechos y la de búsqueda consulta reglas"],"why":"?- padre(juan, jose). no tiene variables: es de verificación y da true o false. ?- padre(juan, Hijo). tiene una variable: es de búsqueda y Prolog responde Hijo = maria ; Hijo = jose. Las dos terminan en punto.","src":"S4 diap. 10; Unidad 4 p. 17","imp":1,"ficha":"ud4-044"},{"id":"p4-034","ud":4,"tema":"Prolog: consultas y recursión","q":"El intérprete muestra `Hijo = maria` y queda esperando. ¿Qué ocurre si el usuario pulsa `;`?","ops":["Prolog busca la siguiente solución mediante backtracking","Prolog termina la consulta y descarta el resto de soluciones","Prolog niega la última respuesta y muestra `false`","Prolog guarda `Hijo = maria` como hecho nuevo en la base"],"why":"El punto y coma es el «gatillo manual» del backtracking: obliga a buscar otra solución (aquí, Hijo = jose). ENTER termina. Dentro de un programa, findall/3 o bagof/3 recogen todas las soluciones.","src":"S4 diap. 10; Unidad 4 p. 13","imp":2,"ficha":"ud4-045"},{"id":"p4-035","ud":4,"tema":"Prolog: consultas y recursión","q":"En Prolog no hay bucles. ¿Cómo se repite un cálculo?","ops":["Con recursión: una inmersión recursiva hasta llegar a un caso base","Con el corte `!`, que vuelve a ejecutar la regla desde el principio","Con el punto y coma `;`, que repite la meta escrita justo antes","Con `is`, que reasigna la variable en cada vuelta del ciclo"],"why":"Las diapositivas lo resumen así: todo ciclo es una inmersión recursiva hacia un caso base definitivo, como factorial(0, 1). Una variable ligada no se reasigna: cada llamada usa variables nuevas (N1, F1).","src":"S4 diap. 16","imp":1,"ficha":"ud4-046"},{"id":"p4-036","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Qué objetivo debe cerrar la regla para que `?- factorial(3, F).` responda `F = 6`?","ops":["`F is F1 * N`","`F = F1 * N`","`F is N1 * F1`","`F1 is F * N`"],"why":"F se obtiene evaluando con is el factorial de N − 1 (F1) por N. Con = quedaría la estructura sin calcular (1*1*2*3); con N1 * F1 todo daría 0, y F1 is F * N da error porque F aún no tiene valor.","src":"S4 diap. 15; ejm3.pl","imp":1,"code":"factorial(0, 1).\nfactorial(N, F) :- N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    ________.","ficha":"ud4-047"},{"id":"p4-037","ud":4,"tema":"Prolog: consultas y recursión","q":"Con esta base, ¿qué soluciones da `?- abuelo(X, elena).` y en qué orden, pulsando `;`?","ops":["`X = ana ; X = david`","`X = david ; X = ana`","`X = ana`","`X = carlos`"],"why":"Prolog recorre progenitor(X, Y) en el orden de los hechos: con (ana, carlos) se cumple progenitor(carlos, elena) y sale X = ana; al retroceder, con (david, carlos) sale X = david. Carlos es el padre de Elena, no su abuelo.","src":"Unidad 4 p. 12–13; S4 diap. 13","imp":1,"code":"progenitor(ana, beatriz).\nprogenitor(ana, carlos).\nprogenitor(carlos, elena).\nprogenitor(david, carlos).\nprogenitor(david, fernando).\nabuelo(X, Z) :-\n    progenitor(X, Y), progenitor(Y, Z).","ficha":"ud4-042"},{"id":"p4-038","ud":4,"tema":"ASP y Datalog","q":"¿A qué tipo de problemas se orienta ASP (Answer Set Programming)?","ops":["A búsquedas combinatorias (a menudo NP-difíciles): planificación, puzzles","A consultas recursivas optimizadas sobre bases de datos deductivas muy grandes","A cálculos numéricos secuenciales con mucha manipulación de estados cambiantes","A la enseñanza guiada de Prolog, con feedback automático y pruebas unitarias"],"why":"ASP (programación por conjuntos de respuestas) resuelve problemas de búsqueda combinatorios: colorear grafos, planificar, configurar sistemas, puzzles. Las consultas recursivas sobre grandes bases de hechos son el terreno de Datalog.","src":"Unidad 4 p. 15","imp":1,"ficha":"ud4-049"},{"id":"p4-039","ud":4,"tema":"ASP y Datalog","q":"¿Cómo obtiene ASP las soluciones de un problema?","ops":["Un solver (clingo, DLV) calcula los modelos estables; cada uno es una solución","Unifica la consulta con la cabeza de las reglas y retrocede cuando una rama falla","Deduce de abajo arriba todos los hechos y después responde a la consulta","Ejecuta las reglas en el orden escrito, como una secuencia de instrucciones"],"why":"ASP se basa en la semántica de modelos estables: el solver calcula los conjuntos de hechos que satisfacen todas las reglas y restricciones. Unificar y retroceder es lo que hace Prolog; deducir de abajo arriba, Datalog.","src":"Unidad 4 p. 15","imp":2,"ficha":"ud4-050"},{"id":"p4-040","ud":4,"tema":"ASP y Datalog","q":"Un programa concluye algo porque falta un hecho; si después se añade ese hecho, la conclusión cambia. ¿Cómo se llama este conocimiento, que ASP puede expresar?","ops":["Conocimiento no monótono","Conocimiento decidible","Conocimiento bidireccional","Conocimiento proposicional"],"why":"En el conocimiento no monótono, añadir información puede retirar conclusiones que se habían sacado por la ausencia de un hecho. ASP lo expresa con negación fuerte y negación por ausencia; sirve para problemas de sentido común con reglas por defecto.","src":"Unidad 4 p. 15","imp":2,"ficha":"ud4-051"},{"id":"p4-041","ud":4,"tema":"ASP y Datalog","q":"Datalog puede verse como un subconjunto de Prolog. ¿Qué restricción tiene en los términos que admite?","ops":["Solo constantes o variables: nada de funciones ni estructuras anidadas","Solo hechos concretos: no admite reglas que lleven variables","Solo números: no admite átomos simbólicos como `juan`","Solo predicados de aridad 1: no admite relaciones entre dos o más términos"],"why":"Al no admitir funciones ni estructuras anidadas, el dominio de valores es finito y queda acotado por los hechos base. Sí admite reglas con variables, incluso recursivas (alcanzabilidad, jerarquías).","src":"Unidad 4 p. 15","imp":2,"ficha":"ud4-053"},{"id":"p4-042","ud":4,"tema":"ASP y Datalog","q":"¿Cómo infieren Prolog y Datalog?","ops":["Prolog, top-down desde la consulta; Datalog, bottom-up deduciendo todos los hechos","Prolog, bottom-up deduciendo todos los hechos; Datalog, top-down desde la consulta","Los dos top-down: parten de la consulta y retroceden cuando una rama falla","Los dos bottom-up: deducen todos los hechos posibles antes de responder"],"why":"Prolog va de la consulta hacia los hechos, con backtracking. Datalog infiere primero todos los hechos derivables (como un cierre transitivo de las reglas) y después responde consultando ese conjunto.","src":"Unidad 4 p. 15–16","imp":1,"ficha":"ud4-054"},{"id":"p4-043","ud":4,"tema":"ASP y Datalog","q":"¿Por qué todo programa Datalog termina, mientras que Prolog puede no terminar?","ops":["Porque en Datalog los términos no crecen: el dominio está acotado por los hechos","Porque Datalog prohíbe las reglas recursivas, que son las que provocan los bucles","Porque Datalog coloca un corte en cada regla para evitar el backtracking","Porque Datalog busca top-down con un límite fijo de profundidad en cada consulta"],"why":"Sin funciones ni estructuras, los términos no crecen indefinidamente y Datalog es decidible; Prolog es Turing-completo y puede no terminar. Datalog sí admite recursión: las consultas recursivas son justo su punto fuerte.","src":"Unidad 4 p. 15–16","imp":2,"ficha":"ud4-056"},{"id":"p4-044","ud":4,"tema":"ASP y Datalog","q":"Se necesitan consultas recursivas optimizadas (alcanzabilidad, jerarquías) sobre una base de hechos enorme y con terminación garantizada. ¿Qué lenguaje lógico encaja mejor?","ops":["Datalog","ASP (Answer Set Programming)","Prolog","Programación lógica con restricciones (CLP)"],"why":"Datalog se orienta a consultas optimizadas sobre grandes bases de hechos, garantiza la terminación y resuelve consultas recursivas que el SQL estándar no expresaba bien. Prolog puede no terminar y ASP genera soluciones a problemas combinatorios.","src":"Unidad 4 p. 16","imp":1,"ficha":"ud4-057"},{"id":"p4-045","ud":4,"tema":"Ejercicios resueltos","q":"En la base de EJM1 no existe el hecho padre(maria, jose), y `?- padre(maria, jose).` responde `false`. ¿Qué principio explica esa respuesta?","ops":["La asunción del mundo cerrado","La negación como fallo escrita con `\\+`","El corte, que detiene la búsqueda","La direccionalidad de la aritmética"],"why":"Para Prolog, lo que no puede demostrarse con los hechos y reglas de la base se considera falso. No hace falta \\+: la consulta no encuentra ningún hecho ni regla que la demuestre y responde false.","src":"S4 diap. 9; Unidad 4 p. 17","imp":1,"ficha":"ud4-058"},{"id":"p4-046","ud":4,"tema":"Ejercicios resueltos","q":"Con la base de EJM0, ¿qué responde `?- listo(X).`?","ops":["`X = juan`","`true`","`false`, porque `X` no es un átomo","`X = ingeniero`"],"why":"Es una consulta de búsqueda: la cabeza listo(X) unifica y ingeniero(X) se satisface con el hecho ingeniero(juan), así que Prolog responde X = juan. true saldría en una consulta sin variables, como ?- listo(juan).","src":"ejm0.pl; S4 diap. 4","imp":1,"code":"ingeniero(juan).\nlisto(X) :- ingeniero(X).","ficha":"ud4-059"},{"id":"p4-047","ud":4,"tema":"Ejercicios resueltos","q":"Con la base de EJM1, ¿qué soluciones da `?- padre(juan, Hijo).` y en qué orden, pulsando `;`?","ops":["`Hijo = maria ; Hijo = jose`","`Hijo = jose ; Hijo = maria`","`Hijo = maria ; Hijo = jose ; Hijo = alberto`","`Hijo = maria`"],"why":"Prolog recorre los hechos en orden y unifica con los que tienen juan como primer argumento: primero padre(juan, maria) y luego padre(juan, jose). Alberto es nieto de Juan, no hijo.","src":"Preguntas_1 (EJM1); S4 diap. 10","imp":1,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).","ficha":"ud4-062"},{"id":"p4-048","ud":4,"tema":"Ejercicios resueltos","q":"Con la base de EJM2, ¿qué pares (Abuelo, Nieto) obtiene `?- abuelo(Abuelo, Nieto).` pulsando `;` hasta agotar las soluciones?","ops":["(juan, alberto), (carlos, maria), (carlos, jose)","(juan, alberto), (carlos, maria), (carlos, jose), (carlos, alberto)","(juan, alberto), (carlos, maria), (carlos, jose), (carlos, elena)","(juan, maria), (juan, jose), (carlos, juan), (carlos, elena)"],"why":"Prolog prueba padre(X, Z) en el orden de los hechos: (juan, maria) enlaza con padre(maria, alberto); José, Alberto y Elena no tienen hijos; (carlos, juan) da María y José. Elena es hija de Carlos y Alberto, su bisnieto.","src":"Preguntas_1 (EJM2); Unidad 4 p. 18–19","imp":1,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y).","ficha":"ud4-066"},{"id":"p4-049","ud":4,"tema":"Ejercicios resueltos","q":"Con la misma base de EJM2, ¿qué responde `?- abuelo(carlos, alberto).`?","ops":["`false`: ningún hijo de Carlos es padre de Alberto","`true`: Carlos es abuelo de María y María es madre de Alberto","`true`: Carlos es padre de Juan y Juan es abuelo de Alberto","Un error: el segundo argumento tendría que ser una variable"],"why":"La regla exige un Z con padre(carlos, Z) y padre(Z, alberto). Los hijos de Carlos son Juan y Elena, y ninguno es padre de Alberto (lo es María): la respuesta es false. Carlos es su bisabuelo.","src":"ejm2.pl; Unidad 4 p. 19","imp":1,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y).","ficha":"ud4-064"},{"id":"p4-050","ud":4,"tema":"Ejercicios resueltos","q":"En EJM2 se añade el hecho `padre(jose, monica).` ¿Qué más hay que cambiar para que `?- abuelo(A, monica).` responda `A = juan`?","ops":["Nada: la regla abuelo/2 deduce sola los nuevos abuelos","Añadir también el hecho `abuelo(juan, monica).`","Añadir a abuelo/2 una cláusula específica para `monica`","Colocar `padre(jose, monica).` delante de los demás hechos"],"why":"Es la deducción dinámica: la regla vale para cualquier persona, así que con padre(juan, jose) y padre(jose, monica) Prolog deduce abuelo(juan, monica) sin tocar el código. El orden de los hechos solo influye en el orden de las respuestas.","src":"S4 diap. 12; Unidad 4 p. 19","imp":1,"ficha":"ud4-063"},{"id":"p4-051","ud":4,"tema":"Ejercicios resueltos","q":"Al resolver `?- factorial(3, F).` con la definición de EJM3, ¿cuándo y en qué orden se calculan los productos?","ops":["Al volver del caso base: 1·1 = 1, después 1·2 = 2 y al final 2·3 = 6","Al bajar hacia el caso base: 3·2 = 6, después 6·1 = 6 y al final 6·1 = 6","Al bajar hacia el caso base: 3·1 = 3, después 3·2 = 6 y al final 6·1 = 6","Al volver del caso base: 2·3 = 6, después 1·2 = 2 y al final 1·1 = 1"],"why":"F is F1 * N va después de la llamada recursiva, así que no se multiplica nada hasta llegar a factorial(0, 1). Luego, de dentro afuera: N = 1 da 1·1 = 1, N = 2 da 1·2 = 2 y N = 3 da 2·3 = 6.","src":"S4 diap. 16; Unidad 4 p. 19–20","imp":1,"ficha":"ud4-067"},{"id":"p4-052","ud":4,"tema":"Ejercicios resueltos","q":"¿Por qué el factorial de EJM3 no sirve para generar los pares (N, F) con `?- factorial(N, F).`, como haría una relación lógica pura?","ops":["Porque `>` e `is` necesitan que `N` tenga valor: el predicado va de N a F","Porque Prolog no admite consultas que tengan dos variables a la vez","Porque la recursión no termina si el segundo argumento está libre","Porque un predicado recursivo no se puede usar en consultas de búsqueda con variables"],"why":"La aritmética exige variables instanciadas: N > 0 y N1 is N - 1 no pueden evaluarse con N libre. El predicado se vuelve direccional (de N a F), aunque factorial(4, 24) y factorial(5, X) funcionan.","src":"S4 diap. 17; Unidad 4 p. 20–21","imp":1,"ficha":"ud4-069"},{"id":"p4-053","ud":4,"tema":"Conclusión","q":"Según la conclusión de la unidad, ¿cuándo conviene combinar Prolog con módulos imperativos (C, Python)?","ops":["Cuando dominan los cálculos secuenciales y los estados cambiantes","Cuando el conocimiento del dominio se expresa con reglas de diagnóstico","Cuando hay que deducir relaciones implícitas entre los hechos","Cuando hay que justificar cómo se llegó a una conclusión"],"why":"La lógica pura puede no ser lo más eficiente con cálculos secuenciales, mucho estado cambiante o datos enormes: Prolog lleva la lógica de alto nivel y delega lo numérico en C o Python. Las reglas y la explicación son su punto fuerte.","src":"Unidad 4 p. 28","imp":2,"ficha":"ud4-072"},{"id":"p4-054","ud":4,"tema":"Conclusión","q":"¿Por qué la programación lógica interesa hoy para la IA explicable?","ops":["Porque un sistema de reglas puede mostrar la traza de inferencia de su decisión","Porque deduce sus conclusiones a partir de las reglas, sin necesitar ningún hecho","Porque sustituye a las redes neuronales en tareas como el reconocimiento de imágenes","Porque ejecuta los cálculos numéricos más rápido que los lenguajes imperativos"],"why":"Un sistema basado en reglas puede explicar exactamente por qué decidió algo (traza de inferencia), cosa que el deep learning puro no hace con facilidad. No sustituye a las redes: la IA neuro-simbólica las combina con la lógica.","src":"Unidad 4 p. 28","imp":2,"ficha":"ud4-074"},{"id":"p4-055","ud":4,"tema":"Conclusión","q":"¿Qué extensión del paradigma lógico añade la resolución de restricciones aritméticas y se usa en la industria para calendarios, rutas o turnos?","ops":["La programación lógica con restricciones (CLP)","La programación lógica inductiva","La programación lógica probabilística","Datalog extendido con agregados (conteos, mínimos)"],"why":"La CLP extiende Prolog para resolver restricciones aritméticas pesadas (scheduling, asignación de recursos). La programación lógica inductiva aprende reglas a partir de datos y la probabilística maneja la incertidumbre.","src":"Unidad 4 p. 27–28","imp":2,"ficha":"ud4-073"},{"id":"p5-001","ud":5,"tema":"Listas: cabeza/cola","q":"¿Qué responde Prolog a esta consulta?","ops":["`H = a`, `T = []`","`H = a` y `T` queda sin valor","`false`: con un único elemento no hay cola","`H = []`, `T = a`"],"why":"La cola es siempre una lista: la del resto de elementos. Con un solo elemento, el resto es la lista vacía, así que T = []. Solo fallaría con [], que no tiene cabeza.","src":"S5 diap. 4","imp":1,"code":"?- [H|T] = [a].","ficha":"ud5-001"},{"id":"p5-002","ud":5,"tema":"Listas: cabeza/cola","q":"Según el glosario de símbolos de las diapositivas, ¿qué significa el guion bajo `_` en un patrón como `[_|T]`?","ops":["Un comodín: el dato de esa posición no importa y se ignora","El separador estructural estricto que divide la cabeza de la cola","La lista vacía, que marca el final del recorrido de la lista","Una variable que debe tomar el mismo valor en toda la cláusula"],"why":"_ es la variable anónima, un comodín («no me importa este dato, ignóralo y sigue evaluando»): el valor de esa posición no interesa y no se guarda. El separador estructural es la barra |, y cada _ es independiente de los demás.","src":"S5 diap. 4","imp":1,"ficha":"ud5-002"},{"id":"p5-003","ud":5,"tema":"Listas: cabeza/cola","q":"¿Qué responde Prolog si se pulsa `;` tras cada respuesta?","ops":["`X = a ; X = b ; X = c`","`X = a`, y la primera cláusula detiene la búsqueda","`X = c ; X = b ; X = a`","`X = [a, b, c]`"],"why":"Es el modo generación: la 1.ª cláusula da la cabeza (a) y, al pedir otra respuesta, el backtracking prueba la 2.ª, que repite la búsqueda en la cola: b y después c.","src":"S5 diap. 3","imp":1,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T).\n\n?- miembro(X, [a, b, c]).","ficha":"ud5-006"},{"id":"p5-004","ud":5,"tema":"Listas: cabeza/cola","q":"¿Cómo termina la consulta `?- miembro(x, [a, b, c]).`?","ops":["Al llegar a `[]`, que no encaja con ninguna regla: `false`","En el primer paso, al comprobar que x no es igual a a: `false`","Liga x con a, porque x es una variable sin valor: `true`","No termina: sigue recurriendo sin fin sobre la cola vacía"],"why":"x es un átomo (minúscula), no una variable. Se compara con a, b y c, recurriendo cada vez con la cola; [] ya no encaja ni con [X|_] ni con [_|T], y la consulta falla.","src":"S5 diap. 5","imp":2,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T).","ficha":"ud5-007"},{"id":"p5-005","ud":5,"tema":"Listas: cabeza/cola","q":"Se intercambia el orden de las cláusulas de miembro/2. ¿En qué orden salen ahora las respuestas de `?- miembro(X, [a, b, c]).`?","ops":["`X = c ; X = b ; X = a`","`X = a ; X = b ; X = c`, igual que antes","Ninguna: entra en un bucle infinito","`X = c`, y al pedir más, `false`"],"why":"Prolog prueba las cláusulas en orden: ahora baja primero hasta la lista vacía, que falla, y al retroceder el hecho va dando c, luego b y luego a. El orden de las cláusulas decide el de las soluciones.","src":"S5 diap. 3-4 (calculado)","imp":2,"code":"miembro(X, [_|T]) :- miembro(X, T).\nmiembro(X, [X|_]).","ficha":"ud5-003"},{"id":"p5-006","ud":5,"tema":"Listas: cabeza/cola","q":"Este predicado recorre la lista como miembro/2, pero con otro caso base. ¿Qué responde la consulta?","ops":["`U = c`","`U = a`","`U = a ; U = b ; U = c`","`U = [b, c]`"],"why":"[X] solo encaja con una lista de un elemento: con [a, b, c] y [b, c] únicamente vale la regla recursiva, hasta que queda [c] y el caso base da U = c. Con [] ya no encaja nada.","src":"S5 diap. 4-5 (calculado)","imp":2,"code":"ultimo(X, [X]).\nultimo(X, [_|T]) :- ultimo(X, T).\n\n?- ultimo(U, [a, b, c]).","ficha":"ud5-003"},{"id":"p5-007","ud":5,"tema":"Listas: cabeza/cola","q":"`miembro(b, [a, b, c])` responde true y `miembro(X, [a, b, c])` enumera los elementos. ¿Cómo llaman las diapositivas a estos dos usos del mismo predicado?","ops":["Verificación (input instanciado) y generación (input variable)","Caso base (input instanciado) y caso recursivo (input variable)","Ejecución top-down y ejecución bottom-up","Unificación (input instanciado) y resolución (input variable)"],"why":"Un solo predicado, dos comportamientos: con el elemento dado verifica recorriendo la estructura; con una variable, el backtracking genera todos los elementos posibles.","src":"S5 diap. 3","imp":1,"ficha":"ud5-004"},{"id":"p5-008","ud":5,"tema":"Grafos y recursión","q":"¿Cómo resuelve Prolog `?- alcanzable(madrid, granada).`?","ops":["Prueba valencia, esa rama fracasa y retrocede a sevilla: `true`","Va directo por sevilla, el único camino que lleva a granada: `true`","Prueba valencia, esa rama fracasa y la consulta acaba en `false`","No existe conexion(madrid, granada), así que responde `false`"],"why":"Las reglas y los hechos se prueban en orden: conexion(madrid, valencia) va primero. Desde valencia no se llega a granada, así que el backtracking vuelve atrás y prueba sevilla, que sí conecta con granada.","src":"S5 diap. 6, 8 (calculado)","imp":1,"code":"conexion(madrid, valencia).\nconexion(madrid, sevilla).\nconexion(valencia, barcelona).\nconexion(valencia, mallorca).\nconexion(barcelona, zaragoza).\nconexion(sevilla, granada).\nalcanzable(X, Y) :- conexion(X, Y).\nalcanzable(X, Y) :-\n    conexion(X, Z), alcanzable(Z, Y).","ficha":"ud5-013"},{"id":"p5-009","ud":5,"tema":"Grafos y recursión","q":"¿En qué orden da Prolog los destinos de `?- alcanzable(valencia, D).` pulsando `;`?","ops":["`barcelona`, `mallorca` y `zaragoza`","`barcelona`, `zaragoza` y `mallorca`","`barcelona` y `mallorca`","`zaragoza`, `barcelona` y `mallorca`"],"why":"La 1.ª regla se agota antes de pasar a la 2.ª: primero salen los destinos directos (barcelona, mallorca) y después los de la regla recursiva (zaragoza, vía barcelona). Desde mallorca no se llega a ningún sitio.","src":"S5 diap. 6, 8 (calculado)","imp":2,"code":"conexion(madrid, valencia).\nconexion(madrid, sevilla).\nconexion(valencia, barcelona).\nconexion(valencia, mallorca).\nconexion(barcelona, zaragoza).\nconexion(sevilla, granada).\nalcanzable(X, Y) :- conexion(X, Y).\nalcanzable(X, Y) :-\n    conexion(X, Z), alcanzable(Z, Y).","ficha":"ud5-009"},{"id":"p5-010","ud":5,"tema":"Grafos y recursión","q":"En este grafo hay un ciclo entre a y b. ¿Qué ocurre con la consulta?","ops":["No termina: queda atrapado en un bucle a → b → a → …","`false`, tras comprobar que no hay ningún hecho con c","`false`, tras pasar una vez por a y b y detectar el ciclo","`true`, porque a y b están conectados entre sí"],"why":"El modelo básico no recuerda por dónde ha pasado: de a salta a b, de b vuelve a a y repite sin fin, en un bucle infinito recursivo. Para evitarlo se usa un acumulador de nodos visitados.","src":"S5 diap. 6, 8","imp":1,"code":"conexion(a, b).\nconexion(b, a).\nalcanzable(X, Y) :- conexion(X, Y).\nalcanzable(X, Y) :-\n    conexion(X, Z), alcanzable(Z, Y).\n\n?- alcanzable(a, c).","ficha":"ud5-012"},{"id":"p5-011","ud":5,"tema":"Grafos y recursión","q":"Según las diapositivas, ¿qué hace falta en producción para que alcanzable/2 no quede atrapado en un grafo con ciclos?","ops":["Un acumulador con los nodos ya visitados","Escribir la regla recursiva antes que la directa","Añadir cada conexión también en sentido inverso","Quitar la regla directa y conservar la recursiva"],"why":"Con una lista de visitados, la búsqueda no vuelve a pasar por el mismo nodo y termina. Cambiar el orden de las reglas no evita el ciclo, y duplicar las conexiones en sentido inverso crea ciclos nuevos.","src":"S5 diap. 6","imp":1,"ficha":"ud5-012"},{"id":"p5-012","ud":5,"tema":"Grafos y recursión","q":"En la regla `alcanzable(X, Y) :- conexion(X, Z), alcanzable(Z, Y).`, ¿qué representa Z?","ops":["Un nodo intermedio: se salta a Z y desde Z se llega a Y","El destino final de la ruta, que se conoce al acabar la búsqueda","Un contador con el número de saltos realizados hasta Y","La lista de nodos ya visitados, para no repetir ninguno"],"why":"La 1.ª regla dice «llegué directamente»; la 2.ª, «salté a un nodo intermedio Z, y desde Z sé cómo llegar a Y». Así se deducen rutas de varios saltos con hechos de un solo salto.","src":"S5 diap. 7-8","imp":1,"ficha":"ud5-010"},{"id":"p5-013","ud":5,"tema":"Grafos y recursión","q":"Según la nota de ingeniería de las diapositivas, ¿qué algoritmo crean automáticamente las dos reglas de alcanzable/2?","ops":["Una búsqueda exhaustiva en profundidad (DFS)","Una búsqueda en anchura (BFS), nivel a nivel","Una búsqueda del camino más corto entre dos nodos","Una deducción bottom-up de todos los hechos, como Datalog"],"why":"Prolog sigue cada rama hasta el fondo antes de probar la siguiente y retrocede al fallar: recursión + backtracking dan una búsqueda en profundidad (DFS) exhaustiva.","src":"S5 diap. 6","imp":2,"ficha":"ud5-011"},{"id":"p5-014","ud":5,"tema":"Pilares y familia lógica","q":"Según las diapositivas, ¿cuáles son los tres «pilares ocultos» del paradigma lógico?","ops":["Unificación, recursión y backtracking","Hechos, reglas y consultas","Unificación, corte y negación como fallo","Recursión, evaluación perezosa y backtracking"],"why":"Unificación (encajar moldes), recursión (descenso sin bucles) y backtracking (buscar alternativas). Hechos, reglas y consultas son los tipos de cláusula, no los pilares.","src":"S5 diap. 9","imp":1,"ficha":"ud5-014"},{"id":"p5-015","ud":5,"tema":"Pilares y familia lógica","q":"¿Qué pilar del paradigma lógico «asigna valores a variables dinámicamente si los moldes encajan perfectamente»?","ops":["La unificación","El backtracking","La recursión","La negación como fallo"],"why":"Unificar es hacer encajar dos términos ligando las variables necesarias: [H|T] = [a, b, c] da H = a y T = [b, c]. Si los moldes no encajan, falla.","src":"S5 diap. 9","imp":1,"ficha":"ud5-015"},{"id":"p5-016","ud":5,"tema":"Pilares y familia lógica","q":"¿Qué pilar del paradigma lógico permite que sumar_cargas/2 recorra toda la lista sin ningún bucle, llamándose a sí mismo con la cola hasta `[]`?","ops":["La recursión: descenso profundo que evita los bucles estáticos","El backtracking: búsqueda de alternativas cuando algo falla","La unificación: encaje dinámico de moldes entre dos términos","El mundo cerrado: lo que no se demuestra se da por falso"],"why":"Las diapositivas definen la recursión como «el mecanismo de descenso profundo para evadir la necesidad de bucles estáticos». El backtracking solo entra cuando una vía falla y hay que probar otra.","src":"S5 diap. 9, 18","imp":2,"ficha":"ud5-016"},{"id":"p5-017","ud":5,"tema":"Pilares y familia lógica","q":"Buscando una ruta, Prolog prueba `conexion(madrid, valencia)`, esa rama no lleva al destino y vuelve a probar `conexion(madrid, sevilla)`. ¿Qué pilar actúa al volver atrás?","ops":["El backtracking","La unificación","La recursión","El corte"],"why":"El backtracking es «la brújula interna que busca alternativas exhaustivas cuando choca contra una pared»: vuelve al último punto de decisión y prueba la siguiente opción. El corte hace lo contrario: lo impide.","src":"S5 diap. 8-9","imp":2,"ficha":"ud5-017"},{"id":"p5-018","ud":5,"tema":"Pilares y familia lógica","q":"Según la tabla de la familia lógica, ¿qué lenguaje tiene como caso de uso ideal las consultas recursivas en bases de datos gigantes?","ops":["Datalog","Prolog","ASP (Answer Set)","CLP (lógica con restricciones)"],"why":"Datalog ejecuta bottom-up (exhaustivo) y es finito, sin funciones anidadas: encaja con consultas recursivas sobre grandes bases de datos. A Prolog la tabla le asigna los sistemas expertos y la IA simbólica.","src":"S5 diap. 10","imp":1,"ficha":"ud5-022"},{"id":"p5-019","ud":5,"tema":"Pilares y familia lógica","q":"En la tabla de la familia lógica, ¿cuál es el paradigma de ejecución de ASP (Answer Set)?","ops":["Generación de modelos (SAT)","Top-Down, con backtracking","Bottom-Up, de forma exhaustiva","Reducción de expresiones lambda"],"why":"ASP genera modelos que satisfacen las restricciones (SAT); por eso su caso ideal es la optimización NP-difícil y los puzzles lógicos. Top-Down es Prolog y Bottom-Up, Datalog.","src":"S5 diap. 10","imp":2,"ficha":"ud5-021"},{"id":"p5-020","ud":5,"tema":"Pilares y familia lógica","q":"¿Qué fila de la tabla de la familia lógica corresponde a Prolog (ejecución · estructura · caso de uso)?","ops":["Top-Down (backtracking) · Turing completo · sistemas expertos e IA simbólica","Bottom-Up (exhaustivo) · finito · consultas recursivas en bases de datos","Generación de modelos (SAT) · Turing completo · sistemas expertos e IA","Top-Down (backtracking) · finito · optimización NP-difícil y puzzles"],"why":"Prolog ejecuta Top-Down con backtracking, es Turing completo (admite estructuras infinitas) y su uso ideal son los sistemas expertos y la IA simbólica. Finito es Datalog; SAT, ASP.","src":"S5 diap. 10","imp":2,"ficha":"ud5-020"},{"id":"p5-021","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué tres ventajas («acelera») de aplicar lógica pura recogen las diapositivas?","ops":["Transparencia extrema, mantenimiento ortogonal y modelado natural","Eficiencia numérica, mutación de estado y control explícito del flujo","Transparencia extrema, eficiencia numérica y control explícito del flujo","Modelado natural, evaluación perezosa y mutación de estado"],"why":"Acelera: transparencia extrema (trazabilidad), mantenimiento ortogonal (añadir reglas no rompe nada) y modelado natural (ontologías). Lo numérico, el estado mutable y renunciar al control explícito son sus frenos.","src":"S5 diap. 11","imp":1,"ficha":"ud5-023"},{"id":"p5-022","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Cuál de estas **NO** es una limitación («frena») de la lógica pura según las diapositivas?","ops":["Mantenimiento ortogonal","Ineficiencia numérica","Mutación de estado","Curva de abstracción"],"why":"El mantenimiento ortogonal es una ventaja: añadir reglas nuevas no rompe el flujo existente. Los tres frenos son la ineficiencia numérica, la mutación de estado y la curva de abstracción.","src":"S5 diap. 11","imp":1,"ficha":"ud5-027"},{"id":"p5-023","ud":5,"tema":"Ventajas, límites y futuro","q":"Un sistema experto debe justificar ante un auditor por qué tomó cada decisión. ¿Qué ventaja de la lógica pura lo facilita, según las diapositivas?","ops":["La transparencia extrema","El mantenimiento ortogonal","El modelado natural","La curva de abstracción"],"why":"La transparencia extrema es la «trazabilidad exacta de por qué se tomó cada decisión»: la cadena de reglas aplicadas explica el resultado. La curva de abstracción es una limitación, no una ventaja.","src":"S5 diap. 11","imp":2,"ficha":"ud5-024"},{"id":"p5-024","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué significa, según las diapositivas, que la lógica pura ofrece «mantenimiento ortogonal»?","ops":["Que añadir nuevas reglas no rompe el flujo existente","Que cada regla se guarda en un módulo independiente","Que el programador controla el flujo de forma explícita","Que las reglas se ejecutan en paralelo y sin orden"],"why":"Cada regla es una declaración independiente: una nueva añade conocimiento sin reescribir las demás, como una cuarta regla en_riesgo_ED. El control explícito del flujo es justo lo que la lógica pura abandona.","src":"S5 diap. 11","imp":2,"ficha":"ud5-025"},{"id":"p5-025","ud":5,"tema":"Ventajas, límites y futuro","q":"¿En qué consiste la limitación que las diapositivas llaman «curva de abstracción»?","ops":["Exige abandonar el control explícito del flujo de control","Es lenta en cálculos matemáticos puramente secuenciales","Maneja mal las variables que cambian constantemente","Añadir reglas nuevas rompe el flujo ya existente"],"why":"Cuesta dejar de programar el «cómo» y ceder el control del flujo al motor de inferencia. La lentitud numérica y el estado cambiante son las otras dos limitaciones; añadir reglas, en cambio, no rompe nada.","src":"S5 diap. 11","imp":2,"ficha":"ud5-030"},{"id":"p5-026","ud":5,"tema":"Ventajas, límites y futuro","q":"Un programa debe manejar variables que cambian de valor sin parar, como el estado de cada personaje de un videojuego. ¿Qué limitación de la lógica pura señalan las diapositivas?","ops":["La mutación de estado","La ineficiencia numérica","La curva de abstracción","El mantenimiento ortogonal"],"why":"Las diapositivas hablan de «mala manipulación de variables que cambian constantemente»: es la mutación de estado. La ineficiencia numérica se refiere a cálculos matemáticos puramente secuenciales.","src":"S5 diap. 11","imp":2,"ficha":"ud5-029"},{"id":"p5-027","ud":5,"tema":"Ventajas, límites y futuro","q":"En la arquitectura moderna que describen las diapositivas, ¿qué papel tiene el motor lógico?","ops":["Cerebro estratégico que orquesta los submódulos imperativos","Submódulo al que Python o C delegan todos los cálculos numéricos","Sustituto completo de los módulos imperativos (Python, C)","Almacén pasivo de hechos que consultan los módulos de C"],"why":"El motor lógico decide y orquesta; los submódulos imperativos (p. ej., Python o C) se encargan de la ejecución eficiente. Delegarle los cálculos numéricos sería usarlo en su punto débil.","src":"S5 diap. 11","imp":2,"ficha":"ud5-031"},{"id":"p5-028","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué es la IA neuro-simbólica según las diapositivas?","ops":["Redes neuronales y sistemas lógicos unidos: sistemas que predicen, razonan y explican","Redes neuronales entrenadas para sustituir por completo a los sistemas expertos de reglas","Sistemas lógicos que aprenden solos sus reglas y ya no necesitan datos de entrenamiento","Una variante de Prolog que ejecuta sus reglas en procesadores gráficos (GPU)"],"why":"Es la convergencia de dos mundos: las redes neuronales reconocen patrones y los sistemas lógicos aportan razonamiento. El resultado son sistemas autónomos que no solo predicen, sino que razonan y explican.","src":"S5 diap. 12","imp":1,"ficha":"ud5-032"},{"id":"p5-029","ud":5,"tema":"Ventajas, límites y futuro","q":"En la IA neuro-simbólica, ¿qué aporta cada componente según las diapositivas?","ops":["Redes: patrones en datos crudos («caja negra»); lógica: decisiones auditables","Redes: decisiones auditables y explicables; lógica: patrones en datos crudos","Redes: reglas de negocio; lógica: reconocimiento de patrones en imágenes","Redes y lógica aportan lo mismo; unirlas sirve para ganar velocidad"],"why":"Las redes neuronales reconocen patrones en datos crudos, pero son una «caja negra»; los sistemas lógicos aportan razonamiento estructurado, reglas de negocio y decisiones auditables y explicables.","src":"S5 diap. 12","imp":2,"ficha":"ud5-033"},{"id":"p5-030","ud":5,"tema":"Ej. 3: OR implícito","q":"El ejercicio 3 pide programar «en riesgo si se cumple la condición 1, la 2 o la 3» sin usar el operador `;`. ¿Cómo se consigue?","ops":["Con tres reglas homónimas, una por cada condición","Con una regla y las tres condiciones separadas por comas","Con una regla y `\\+` delante de cada condición","Con el corte `!` entre una condición y la siguiente"],"why":"Prolog evalúa las reglas con el mismo nombre como alternativas independientes: el OR es implícito. Separar las tres condiciones con comas daría un AND: habría que cumplirlas todas a la vez.","src":"S5 diap. 14-15","imp":1,"ficha":"ud5-035"},{"id":"p5-031","ud":5,"tema":"Ej. 3: OR implícito","q":"Hay una regla en_riesgo_ED(Nombre) por cada condición, en este orden. ¿Qué responde `?- en_riesgo_ED(X).` pulsando `;`?","ops":["`X = carlos ; X = luis ; X = mario`","`X = luis ; X = mario ; X = carlos`","`X = carlos ; X = luis ; X = mario ; X = ana`","`X = luis ; X = carlos`"],"why":"Prolog agota la regla 1 (recorriendo todos los buceadores) antes de pasar a la 2: carlos (regla 1), luis (regla 2) y mario (regla 3). Ana no cumple ninguna condición, así que no aparece.","src":"S5 diap. 14-15 (calculado)","imp":2,"code":"% buceador(Nombre, Temp, Prof, Tiempo)\nbuceador(luis, 11, 34, 15).\nbuceador(mario, 26, 33, 50).\nbuceador(carlos, 10, 18, 30).\nbuceador(ana, 22, 16, 35).\n% Regla 1: Temp \u003c 12, Tiempo >= 20\n% Regla 2: Temp \u003c 12, Prof > 30\n% Regla 3: Prof > 30, Tiempo >= 40","ficha":"ud5-037"},{"id":"p5-032","ud":5,"tema":"Ej. 3: OR implícito","q":"Con estas reglas y un único buceador, ¿cuántas respuestas da `?- en_riesgo_ED(X).` pulsando `;`?","ops":["Tres: `X = eva`, una vez por cada regla que cumple","Una: Prolog descarta las soluciones repetidas","Una: al cumplir la primera regla se acaba la búsqueda","Ninguna: cumplir varias condiciones a la vez anula el OR"],"why":"Cada regla homónima es un camino independiente, y eva (Temp 10, Prof 35, Tiempo 45) cumple las tres condiciones. Prolog no elimina duplicados: responde X = eva tres veces.","src":"S5 diap. 15 (calculado)","imp":1,"code":"en_riesgo_ED(N) :- buceador(N, T, _, Ti),\n    T \u003c 12, Ti >= 20.\nen_riesgo_ED(N) :- buceador(N, T, P, _),\n    T \u003c 12, P > 30.\nen_riesgo_ED(N) :- buceador(N, _, P, Ti),\n    P > 30, Ti >= 40.\nbuceador(eva, 10, 35, 45).","ficha":"ud5-035"},{"id":"p5-033","ud":5,"tema":"Ej. 3: OR implícito","q":"En la solución del ejercicio 3, ¿cómo quedan expresados el AND y el OR entre condiciones?","ops":["AND con comas dentro de cada regla; OR con varias reglas del mismo nombre","OR con comas dentro de cada regla; AND con varias reglas del mismo nombre","AND con comas y OR con `;`, todo dentro de una única regla","AND y OR con comas; el motor los distingue por el contexto"],"why":"Dentro de una regla, T \u003c 12, Tiempo >= 20 exige las dos cosas (AND). Las tres reglas en_riesgo_ED son alternativas y basta con que se cumpla una (OR implícito). El ejercicio prohíbe usar ;.","src":"S5 diap. 15","imp":2,"ficha":"ud5-036"},{"id":"p5-034","ud":5,"tema":"Ej. 4: conc/3","q":"¿Qué va en el hueco del paso recursivo de conc/3?","ops":["`[H|R]`","`[R|H]`","`[H|T]`","`R`"],"why":"La cabeza H de la primera lista se obliga a encabezar el resultado, y la recursión construye el resto R uniendo T con L2. Con [H|T] el resultado sería la primera lista, sin L2.","src":"S5 diap. 16","imp":2,"code":"% Caso base\nconc([], L, L).\n% Paso recursivo\nconc([H|T], L2, ____) :-\n    conc(T, L2, R).","ficha":"ud5-039"},{"id":"p5-035","ud":5,"tema":"Ej. 4: conc/3","q":"¿Cuántas respuestas da esta consulta pulsando `;`, y cuál sale primero?","ops":["Tres; la primera, `P = [], S = [a, b]`","Tres; la primera, `P = [a, b], S = []`","Dos; la primera, `P = [a], S = [b]`","Una: `P = [a], S = [b]`"],"why":"Es la descomposición: el motor explora todas las particiones con backtracking. El caso base va primero (P = [], S = [a, b]); después salen P = [a], S = [b] y P = [a, b], S = [].","src":"S5 diap. 17 (calculado)","imp":1,"code":"conc([], L, L).\nconc([H|T], L2, [H|R]) :-\n    conc(T, L2, R).\n\n?- conc(P, S, [a, b]).","ficha":"ud5-041"},{"id":"p5-036","ud":5,"tema":"Ej. 4: conc/3","q":"¿Qué responde Prolog a esta consulta?","ops":["`X = [a, b]`","`X = [a, b, c, c]`","`X = [c]`","Error: el primer argumento debe estar instanciado"],"why":"conc/3 no tiene dirección de flujo: aquí busca qué lista, unida a [c], da [a, b, c]. Solo X = [a, b] cumple la relación, así que el mismo predicado sirve para «quitar» un sufijo.","src":"S5 diap. 16-17 (calculado)","imp":1,"code":"conc([], L, L).\nconc([H|T], L2, [H|R]) :-\n    conc(T, L2, R).\n\n?- conc(X, [c], [a, b, c]).","ficha":"ud5-040"},{"id":"p5-037","ud":5,"tema":"Ej. 4: conc/3","q":"¿Por qué el mismo conc/3 sirve tanto para unir dos listas como para descomponer una lista en todas sus particiones?","ops":["Porque es una declaración lógica pura, sin dirección de flujo","Porque usa `is` para calcular por dónde partir la lista","Porque Prolog genera internamente una versión inversa del predicado","Porque el corte decide en cada llamada si unir o separar"],"why":"conc/3 solo describe la relación entre tres listas, sin fijar qué es entrada y qué es salida: el motor la resuelve en el sentido que pida la consulta. Un is rompería esa bidireccionalidad.","src":"S5 diap. 16-17","imp":1,"ficha":"ud5-040"},{"id":"p5-038","ud":5,"tema":"Ej. 5: aritmética (is)","q":"En longitud/2 se ha cambiado `is` por `=`. ¿Qué responde ahora la consulta?","ops":["`N = 0+1+1`","`N = 2`","Error: `NResto` no está instanciado","`false`"],"why":"= solo unifica, no calcula: N queda ligada a la estructura 0+1+1 sin evaluar. Para obtener N = 2 hace falta is, que evalúa la expresión de la derecha.","src":"S5 diap. 18 (calculado)","imp":1,"code":"longitud([], 0).\nlongitud([_|T], N) :-\n    longitud(T, NResto),\n    N = NResto + 1.\n\n?- longitud([a, b], N).","ficha":"ud5-042"},{"id":"p5-039","ud":5,"tema":"Ej. 5: aritmética (is)","q":"En esta versión se ha puesto `is` antes de la llamada recursiva. ¿Qué ocurre con la consulta?","ops":["Error: `SubTotal` aún no tiene valor al evaluar `is`","`T = 30`: el orden de los objetivos de la regla no importa","`T = 0+20+10`: la suma queda como estructura sin evaluar","`false`: la regla falla antes de alcanzar el caso base"],"why":"is exige que la parte derecha esté instanciada, y SubTotal solo recibe valor después de la llamada recursiva. Por eso en las diapositivas is va detrás de la recursión.","src":"S5 diap. 18 (calculado)","imp":1,"code":"sumar_cargas([], 0).\nsumar_cargas([C|Resto], Total) :-\n    Total is SubTotal + C,\n    sumar_cargas(Resto, SubTotal).\n\n?- sumar_cargas([10, 20], T).","ficha":"ud5-044"},{"id":"p5-040","ud":5,"tema":"Ej. 5: aritmética (is)","q":"¿Qué sumas hace el motor para llegar a `Total = 30`, y en qué orden?","ops":["0 + 20 = 20 y luego 20 + 10 = 30, al volver de la recursión","10 + 20 = 30 en el primer paso, antes de bajar por la recursión","0 + 10 = 10 y luego 10 + 20 = 30, al bajar por la lista","Ninguna: Total queda como la estructura 0+20+10 sin evaluar"],"why":"Al bajar, cada is queda suspendido hasta llegar a sumar_cargas([], 0). La suma ocurre de regreso, al desenvolver la pila: primero 0 + 20 (el último elemento) y después 20 + 10.","src":"S5 diap. 19","imp":1,"code":"sumar_cargas([], 0).\nsumar_cargas([C|Resto], Total) :-\n    sumar_cargas(Resto, SubTotal),\n    Total is SubTotal + C.\n\n?- sumar_cargas([10, 20], Total).","ficha":"ud5-045"},{"id":"p5-041","ud":5,"tema":"Ej. 5: aritmética (is)","q":"¿Por qué dicen las diapositivas que el operador `is` rompe la pureza de Prolog?","ops":["Es una llamada imperativa que exige la parte derecha ya instanciada","Obliga a declarar antes el tipo numérico de cada variable que usa","Deshace las unificaciones hechas antes dentro de la misma regla","Impide que la regla en la que aparece pueda ser también recursiva"],"why":"is rompe la bidireccionalidad pura: no describe una relación, ordena a la CPU calcular, y si a la derecha hay variables sin valor da error. conc/3, sin is, funciona en los dos sentidos.","src":"S5 diap. 18","imp":1,"ficha":"ud5-044"},{"id":"p5-042","ud":5,"tema":"Ej. 6: subconjunto/2","q":"¿Qué responde la consulta y por qué?","ops":["`false`: aa está, pero dd no, y la conjunción falla","`true`: basta con que la cabeza aa esté en la lista","`false`: las dos listas no tienen la misma longitud","Error: dd no aparece en ningún hecho del programa"],"why":"miembro(aa, …) tiene éxito y el motor avanza; miembro(dd, …) falla. Es una conjunción (AND): si un solo objetivo falla, la regla entera colapsa y la respuesta es false.","src":"S5 diap. 20-21","imp":1,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T).\nsubconjunto([], _).\nsubconjunto([H|T], Lista) :-\n    miembro(H, Lista),\n    subconjunto(T, Lista).\n\n?- subconjunto([aa, dd], [aa, bb, cc]).","ficha":"ud5-048"},{"id":"p5-043","ud":5,"tema":"Ej. 6: subconjunto/2","q":"¿Qué responde Prolog a esta consulta?","ops":["`true`","`false`, porque el orden no coincide con el de la lista","`false`, porque c está repetido en la sublista","`false`, porque b no aparece en la sublista"],"why":"subconjunto/2 comprueba uno a uno que cada elemento de la sublista es miembro de la lista: c sí, a sí y c otra vez sí; luego llega a [] y acaba. El orden y las repeticiones no importan.","src":"S5 diap. 20 (calculado)","imp":1,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T).\nsubconjunto([], _).\nsubconjunto([H|T], Lista) :-\n    miembro(H, Lista),\n    subconjunto(T, Lista).\n\n?- subconjunto([c, a, c], [a, b, c]).","ficha":"ud5-046"},{"id":"p5-044","ud":5,"tema":"Ej. 6: subconjunto/2","q":"Prolog no logra demostrar `miembro(dd, [aa, bb, cc])` y lo da por falso. ¿Qué principio aplica, según las diapositivas?","ops":["La asunción del mundo cerrado","La negación fuerte de ASP","El mantenimiento ortogonal","La transparencia referencial"],"why":"Según la asunción del mundo cerrado, «lo que no se puede demostrar, es falso». No hace falta un hecho que diga que dd no está: basta con no poder probar que está.","src":"S5 diap. 21","imp":1,"ficha":"ud5-049"},{"id":"p5-045","ud":5,"tema":"Ej. 6: subconjunto/2","q":"En subconjunto/2, ¿qué papel cumple la llamada `miembro(H, Lista)`?","ops":["Predicado auxiliar: busca la cabeza H de la sublista en la lista","Caso base: detiene la recursión cuando la sublista se queda vacía","Ordena la lista para poder compararla después con la sublista","Cuenta cuántas veces aparece la sublista dentro de la lista"],"why":"Se aísla la cabeza H de la sublista y se delega su búsqueda al motor con miembro/2; la recursión sobre T repite lo mismo con el resto. El caso base es subconjunto([], _).","src":"S5 diap. 20","imp":2,"ficha":"ud5-047"}];
  const DOCS = [{"s":"S1 diap. 2","u":1,"t":"El Mapa de los Paradigmas de Programación","x":"Una disección visual de las arquitecturas fundamentales para la resolución de problemas computacionales.\n[Figura: diagrama circular tipo plano con ramas etiquetadas (cortadas en el borde): Procedura[l], Object-ori[ented], Functio[nal], Functiona[l], Declarativ[e]]\nPie: Paradigmas de la Programación · Juntos hacia tu objetivo"},{"s":"S1 diap. 3","u":1,"t":"¿Qué es un Paradigma?","x":"Un paradigma de programación es un modelo de referencia conceptual. Define la filosofía y las directrices arquitectónicas para construir software.\n\nAlgoritmo + Estructuras de Datos = Programa\n\n- **Paradigma:** La forma arquitectónica y visión del mundo. [Figura: brújula]\n- **Metodología:** La secuencia de pasos para construirlo. [Figura: plano enrollado]"},{"s":"S1 diap. 4","u":1,"t":"La Gran Taxonomía de Soluciones de Alto Nivel","x":"[Figura: árbol de izquierda a derecha. «Solución de Alto Nivel» se divide en tres ramas:]\n- **Procedimental** — Describe etapa a etapa CÓMO obtener la solución.\n  - Imperativo\n  - Orientado a Objetos\n- **Declarativa** — Describe QUÉ se desea obtener, sin especificar cómo procesarlo.\n  - Transformación\n  - Formularios\n  - Restricciones\n- **Demostrativa** — Aprende el MÉTODO a partir de ejemplos (Bottom-Up).\n  - Inducción\n  - Redes Neuronales\n  - Genéticos"},{"s":"S1 diap. 5","u":1,"t":"Paradigma Procedimental u Operacional","x":"Basado en una secuencia computacional ejecutada etapa a etapa.\n\n**El concepto clave: Efectos de de Lado (Side Effects)** (sic, «de de» en el original)\n\nLas variables están ligadas a direcciones de memoria. La ejecución del programa actualiza estas celdas repetidamente.\n\nEl valor final en la memoria representa el resultado.\n\n[Figura: «Celda de Memoria X» que recibe «Input: X=1», luego «Sobrescribe: X=5» y «Sobrescribe: X=10», con flecha de tiempo punteada]"},{"s":"S1 diap. 6","u":1,"t":"El Paradigma Imperativo: Arquitectura de Von Neumann","x":"\"Su esencia es el cálculo iterativo paso a paso y la asignación continua.\"\n\nComponentes vitales:\n- **Celdas de Memoria:** Variables que almacenan valores (aliasing).\n- **Asignación:** Operaciones que fuerzan el pensamiento adaptado a la máquina.\n- **Repetición:** Secuencias de pasos elementales repetidos (loops).\n\n[Figura: CPU conectada a Memoria (columna de celdas) mediante flechas bidireccionales rotuladas «Fetch / Execute»]\n\n| Orientado a Expresiones | Orientado a Sentencias |\n|---|---|\n| (matemáticas simples, ej. x > y) | (adaptadas a la máquina, ej. if x>y then v:=true) |"},{"s":"S1 diap. 7","u":1,"t":"Orientación a Objetos: Modelando el Mundo Real","x":"Una filosofía de componentes reutilizables (Objetos Integrados de Software).\nUn objeto es un elemento autónomo con Estado (Atributos) y Servicios (Métodos).\n\nPilares:\n- Tipos Abstractos de Datos (Clases)\n- Herencia\n- Polimorfismo y Enlace Dinámico\n\n[Figura: tarjeta de objeto con tres secciones: «Nombre», «Atributos que posee», «Servicios que proporciona»; junto a un chip y una pieza de puzle]"},{"s":"S1 diap. 8","u":1,"t":"Anatomía Práctica: El Problema de la Carta","x":"El solicitante no necesita conocer cómo el objeto ejecuta la acción, solo qué servicios pedirle mediante mensajes.\n\n[Figura: objeto «Persona» envía mensajes: Consignar_Cabecera() → Papel; (flecha sin rótulo) → Sobre; Poner_Sello() → Sobre; Recibir_Carta() → Buzón. Objetos: Papel, Sobre, Buzón]"},{"s":"S1 diap. 9","u":1,"t":"La Familia Declarativa","x":"El gran cambio: Especificar QUÉ debe tener la solución, no los pasos. Se elimina la necesidad de describir el control de flujo y desaparecen los Efectos de Lado. Las variables almacenan valores intermedios, pero no actualizan estados de información previos.\n\n| x = x + 1 | y = f(x) |\n|---|---|\n| El programador muta el estado. (Cómo) | El sistema resuelve la relación matemática inmutable. (Qué) |"},{"s":"S1 diap. 10","u":1,"t":"Transformación de Estados","x":"Un conjunto de datos iniciales se transforma hasta alcanzar un estado final mediante reglas u operadores. El problema se traduce en encontrar el camino más corto en un grafo de estados generados.\n\n[Figura: Estado Inicial (tablero 3x3: 1 4 8 / 7 X 2 / 6 3 5) → flecha → Estado Final (Meta) (1 2 3 / 4 5 6 / 7 8 X); a la derecha, grafo de nodos (1,1)…(3,3) con un camino resaltado (1,3)–(2,2)–(3,3)]"},{"s":"S1 diap. 11","u":1,"t":"Estrategias de Búsqueda en Grafos","x":"| Profundidad (LIFO) | Amplitud | Backtracking | Mejor Primero (A*) |\n|---|---|---|---|\n| Explora ramas verticalmente hasta el final. | Recorre el árbol horizontalmente por niveles. | Retrocede ante un callejón sin salida. | Heurística: f(n) = g(n) + h(n). |\n\n[Figura: cuatro árboles con el recorrido de cada estrategia: bajada vertical, recorrido por niveles, retroceso con una X en un callejón, y camino óptimo resaltado]"},{"s":"S1 diap. 12","u":1,"t":"Paradigma de Formularios","x":"- Basado en la resolución de sistemas de ecuaciones interdependientes.\n- Dirigido por la demanda: una operación solo se ejecuta si todos sus operandos están disponibles.\n- Es el núcleo del Desarrollo de Usuario Final (EUD).\n\n[Figura: hoja de cálculo (columnas A–H, filas 1–10); las celdas D3 y E3 apuntan con flechas a una celda «Precio Gasolina Super»; nota: «Evaluación perezosa: F7 solo se calcula cuando se demanda.»]"},{"s":"S1 diap. 13","u":1,"t":"Modelado por Restricciones","x":"Las relaciones entre variables se expresan mediante inecuaciones y límites. El sistema busca cualquier estado que satisfaga todas las reglas.\n- Objetivo: Maximizar o minimizar recursos (Programación Lineal).\n- Dominios: Continuos, enteros, finitos o mixtos.\n- Ejemplo: Minimizar costos de transporte dado un inventario limitado.\n\n[Figura: ejes X/Y con varias rectas que delimitan una región factible sombreada; un «Punto Óptimo» en un vértice]"},{"s":"S1 diap. 14","u":1,"t":"El Enfoque Demostrativo (Bottom-Up)","x":"En lugar de abstraer un modelo general (Top-Down), se parte de ejemplos particulares para inferir una regla o comportamiento.\n- **Sistemas que infieren:** Extraen similitudes y generalizan (Redes Neuronales, Algoritmos Genéticos).\n- **Programación Asistida:** El sistema observa acciones repetitivas y genera un programa invisible.\n\n[Figura: embudo de abajo arriba: «Ejemplos y Datos Particulares» → «Razonamiento / Inferencia» → «Solución General (Programa)»]"},{"s":"S1 diap. 15","u":1,"t":"¿Quién dicta la secuencia de control?","x":"El Espectro de los Paradigmas. La clasificación se define por la dependencia del orden de evaluación.\n\n[Figura: barra de degradado de izquierda a derecha]\n| Control Explícito | Ecuaciones / Flujo | Especificación Abstracta |\n|---|---|---|\n| Procedimentales (Imperativo, POO) - Alto acoplamiento a efectos de lado | Seudodeclarativos (Funcional, Lógico) - Secuencia parcialmente requerida | Declarativos Puros (Restricciones) - El orden de evaluación es irrelevante |"},{"s":"S1 diap. 16","u":1,"t":"El Mapa No Es el Territorio, Es la Brújula","x":"Ningún paradigma es inherentemente mejor que otro. Su efectividad radica en su alineación con la naturaleza del problema.\n\nElegir la arquitectura correcta es el paso crítico antes de trazar el plano metodológico.\n\n*La arquitectura del pensamiento computacional.*\n\n[Figura: diagrama de Venn de tres círculos: Procedimental, Declarativo, Demostrativo, con una brújula en la intersección]"},{"s":"Estado del arte p. 1","u":1,"t":"","x":"Estado del arte de los paradigmas de programación (2025–2026)\nLos paradigmas de programación han evolucionado desde un enfoque de “elección única” hacia una integración\npragmática y multiparadigma, donde lenguajes modernos combinan programación funcional, reactiva, orientada\na objetos y declarativa según la capa arquitectónica y el problema específico. Paralelamente, emergen nuevos\nparadigmas ligados a hardware no convencional (neuromórfico, cuántico, computación en memoria) que exigen\nrepensar abstracciones clásicas.[1] [2] [3] [4] [5]\n1. Panorama general: tendencias dominantes\n• Multiparadigma pragmático: Para 2025–2026, la tendencia no es “FP vs OOP”, sino cómo\ncombinarlos: capas de dominio con OOP, lógica de negocio con FP, manejo de eventos con\nprogramación reactiva y consultas con enfoques declarativos (p. ej., SQL).[2] [1]\n• Ascenso de lo funcional y reactivo: La programación funcional (inmutabilidad, funciones puras,\ncomposición) gana terreno en ingeniería de datos, IA y arquitecturas cloud-native; la programación\nreactiva se consolida para flujos asíncronos, alta concurrencia y sistemas en tiempo real.[6] [7] [1]\n• Declaratividad y especialización: Paradigmas declarativos (lógica, restricciones, consultas) y\nenfoques orientados a IA (aprendizaje automático como “programación automatizada”) se integran\nen pipelines y sistemas de decisión.[5] [2]\n2. Paradigmas clásicos: estado actual y evolución\nProgramación orientada a objetos (OOP)\n• Fortalezas vigentes: Modelado de entidades con identidad y ciclo de vida (dominios ricos, sistemas"},{"s":"Estado del arte p. 1","u":1,"t":"","x":"empresariales, motores de juego). Encapsulamiento, polimorfismo y abstracción siguen siendo\npilares arquitectónicos.[1]\n• Limitaciones reconocidas: Acoplamiento por herencia, estado mutable compartido (complejidad en\nconcurrencia) y boilerplate. La práctica moderna favorece composición sobre herencia y combina\nOOP con FP para reducir rigidez.[1]\nProgramación funcional (FP)\n• Principios clave: Inmutabilidad, funciones puras, funciones de primera clase y estilo declarativo. Esto\nfacilita razonamiento, testing y paralelismo.[7] [1]\n• Ámbitos de impacto 2025–2026: Pipelines de transformación de datos, procesamiento de streams,\nlógica de negocio compleja y sistemas distribuidos donde la ausencia de estado mutable compartido\nsimplifica la concurrencia.[6] [1]"},{"s":"Estado del arte p. 2","u":1,"t":"","x":"Programación reactiva\n• Modelo mental: Flujos de datos en el tiempo, composición asíncrona no bloqueante y backpressure\npara evitar saturación.[1]\n• Casos de uso: Microservicios de alta concurrencia, analítica en tiempo real, interfaces reactivas y\nagregación de sensores IoT. No es ideal para CRUD simples o cargas CPU-bound con APIs\nbloqueantes.[1]\nProgramación lógica y por restricciones\n• Enfoque: Especificar “qué” debe cumplirse (hechos y reglas) y dejar que el motor de inferencia\nbusque soluciones (p. ej., Prolog, CLP).[1]\n• Aplicaciones: Sistemas expertos, NLP simbólico, planificación y problemas de satisfacción de\nrestricciones. El rendimiento depende de heurísticas y la depuración requiere entender la estrategia\nde búsqueda.[1]\n3. Paradigmas emergentes ligados a nuevo hardware\nProgramación neuromórfica\n• Motivación: Hardware inspirado en el cerebro (spiking neural networks, eventos, tiempo continuo,\nplasticidad) no encaja bien con supuestos clásicos (digital, determinista, centralizado,\nobservable).[4] [5]\n• Características fundamentales:\no\nDominio físico y tiempo continuo (señales analógicas/mixtas),\no\nPlasticidad (el sustrato cambia durante la ejecución),\no\nEstocasticidad,\no\nDescentralización,\no\nObservabilidad limitada.[5]\n• Enfoques actuales:\no\nCo-diseño hardware-so ware,\no\nMétodos de ML adaptados a SNN (backprop con gradientes sustitutos, conversión\no\nANN→SNN),\no\nAprendizaje en dispositivo (plasticidad local, reglas de aprendizaje emergentes),\no\nMétodos evolutivos (optimizan arquitectura y pesos conjuntamente),"},{"s":"Estado del arte p. 2","u":1,"t":"","x":"o\nAlgoritmos neuromórficos de picos (SNA) y primitivas neurocomputacionales (WTA,\ncampos neuronales dinámicos, osciladores),\no\nAbstracciones de mayor nivel (Neural Engineering Framework, Vector Symbolic\no\nArchitectures, frameworks como Lava y representaciones intermedias como NIR).[5]\n• Desafío abierto: No existe aún una abstracción universalmente aceptada; se avanza hacia\nrepresentaciones intermedias que integren múltiples enfoques y soporten grafos computacionales\nque cambian en el tiempo.[5]"},{"s":"Estado del arte p. 3","u":1,"t":"","x":"Programación cuántica\n• Estado: Lenguajes y runtimes cuánticos avanzan hacia integración con HPC, pero persisten retos en la\ndefinición del QPU y su gestión de tareas asíncronas en entornos científicos.[8] [9]\n• Paradigmas: Se exploran descripciones de alto nivel de algoritmos cuánticos, composición híbrida\nclásico-cuántica y modelos de ejecución compatibles con flujos HPC.[9] [8]\nOtros paradigmas emergentes\n• Computación en memoria y arquitecturas especializadas: Requieren abstracciones que expongan\noperaciones near-data y minimicen movimientos de datos.[3]\n• Paradigmas “no digitales”: Programación analógica, computación de reservorio físico y “evolution in\nmaterio” aprovechan dinámicas del sustrato para computar.[5]\n\n4. Integración multiparadigma: patrones arquitectónicos actuales\nUna arquitectura típica en 2025–2026 combina paradigmas por capa:\n• Dominio: OOP para entidades con identidad (Usuario, Orden, Producto).[1]\n• Lógica de negocio: FP para transformaciones sin estado (validación, reglas, cálculos).[1]\n• Eventos/Streams: Programación reactiva para actualizaciones en tiempo real y backpressure.[1]\n• Datos: Consultas declarativas (SQL, lenguajes de restricciones) para especificar “qué” recuperar.[1]\n• Integración: Mensajería asíncrona entre contextos delimitados.[1]\nEsto refleja un cambio cultural: elegir el paradigma según el problema, no por lealtad ideológica.[2] [1]"},{"s":"Estado del arte p. 4","u":1,"t":"","x":"Referencias:\n1. https://www.javacodegeeks.com/2026/01/paradigm-shi s-in-programming-languages-object-oriented-functional-and -\nbeyond.html\n2. https://usajournals.org/index.php/2/article/view/885\n3. https://www.mdpi.com/2079-9292/14/12/2476\n4. https://ieeexplore.ieee.org/document/10766507/\n5. https://arxiv.org/html/2410.22352v1\n6. https://blog.madrigan.com/en/blog/202510141136/\n7. https://blog.madrigan.com/en/blog/202604110953/\n8. https://ieeexplore.ieee.org/document/10566297/\n9. https://link.springer.com/10.1007/978-3-031-61763-8_8\n10. https://www.sciencedirect.com/science/article/pii/S0925231226019788\n11. https://www.nature.com/articles/s44335-026-00064-6\n12. https://link.springer.com/book/10.1007/978-3-031-99751-8\n13. https://ieeexplore.ieee.org/document/11633693/\n14. https://arxiv.org/pdf/2310.18260.pdf\n15. https://ieeexplore.ieee.org/document/11275564/\n16. https://www.igi-global.com/chapter/quantum-neuromorphic-intelligence/414321\n17. http://oa.upm.es/82008/\n18. https://wjarr.com/node/7395\n19. https://www.worldscientific.com/doi/10.1142/S0217979226300112\n20. https://ieeexplore.ieee.org/document/11556079/\n21. https://nerdleveltech.com/programming-paradigms-compared-from-oop-to-functional-thinking\n22. https://artybondar.github.io/blog/programming-2026.html\n23. https://eajournals.org/ejcsit/wp-content/uploads/sites/21/2025/05/Reactive-Programming.pdf\n24. https://adabeat.com/fp/will-functional-programming-grow-in-2025/\n25. https://entangledfuture.com/learn/quantum-vs-neuromorphic-computing/\nNota: Elaborado con perplexity."},{"s":"Resumen UD1 p. 1","u":1,"t":"","x":"Paradigmas de la Programación\nConceptos clave;\n1.Paradigma de programación\nUn paradigma de programación es un modelo o enfoque que define la forma de pensar y\nestructurar soluciones al implementar un programa. Es una guía conceptual que influye en\ncómo se diseñan los algoritmos, se estructuran los datos y se organiza el código.\nAl comprender los paradigmas imperativo, orientado a objetos, funcional, lógico y otros\nenfoques declarativos o inductivos, es posible elegir el más adecuado para cada caso\npráctico, maximizando la eficiencia y claridad del código.\n2. Lenguajes de bajo nivel vs. alto nivel\n  Lenguajes de bajo nivel:\nSe acercan al hardware, lo que permite un control más directo sobre los recursos del\nsistema (por ejemplo, registros o memoria. Ejemplo: Lenguaje ensamblador.\n  Lenguajes de alto nivel:\nOfrecen abstracción, lo que facilita la escritura, comprensión y mantenimiento del\ncódigo. Ejemplos: Python, Java, C  .\n3. Clasificación de paradigmas (según Floyd)\nSegún Robert W. Floyd, los paradigmas de programación se pueden clasificar en tres\ncategorías principales:\n  Paradigmas que soportan técnicas de bajo nivel (cercanos al hardware).\n  Paradigmas que utilizan métodos o patrones para el diseño de algoritmos.\n  Paradigmas que permiten soluciones de alto nivel, enfocándose en la abstracción."},{"s":"Resumen UD1 p. 2","u":1,"t":"","x":"Paradigmas de alto nivel\n1. Paradigmas procedimentales u operacionales\nImperativo\nEl paradigma imperativo se basa en instrucciones explícitas que modifican el estado del\nprograma mediante asignaciones, bucles y estructuras de control.\nCaracterísticas principales:\n• Uso de variables, punteros y direcciones de memoria.\n• Modificación del estado del programa paso a paso.\nEjemplos: C, Pascal, Modula-2, Fortran.\nOrientado a Objetos\nEste paradigma organiza el código en clases y objetos, promoviendo la modularidad y\nreutilización del software.\nCaracterísticas principales:\n• Abstracción de datos mediante clases y objetos.\n• Gestión automática de memoria (en algunos lenguajes).\n• Soporte para herencia (simple o múltiple) y polimorfismo.\nEjemplos: C  , Java, C#, VB.NET.\nOrientado a agentes\nLos objetos (agentes) actúan autónomamente para alcanzar una solución global o local.\nEjemplo: Modelos multiagente como JADE Java Agent Development Framework),\nAutoGen..."},{"s":"Resumen UD1 p. 3","u":1,"t":"","x":"2. Paradigmas declarativos\nEl paradigma declarativo se centra en qué debe hacerse, en lugar de especificar cómo hacerlo\npaso a paso (como ocurre en el paradigma imperativo). Dentro de este grupo encontramos varios\nsubparadigmas:\n Funcional\nBasado en funciones matemáticas puras.\nCaracterísticas principales:\nNo tiene efectos secundarios (no modifica variables externas).\nSe enfoca en inmutabilidad y composición funcional.\nEjemplos: Haskell, Lisp, Hope.\n Lógico\nSe basa en lógica matemática mediante predicados.\nCaracterísticas principales:\n• Define hechos y reglas para resolver problemas mediante inferencias lógicas.\nEjemplo: Prolog.\n3. Otros paradigmas\nParadigmas demostrativos/inductivos\nEste enfoque busca generalizar soluciones basándose en observaciones particulares o ejemplos\nespecíficos.\nCaracterísticas principales:\n  Uso de técnicas inductivas para aprender patrones o reglas generales.\n  Aplicación frecuente en inteligencia artificial y aprendizaje automático.\nEjemplos:\nRedes neuronales artificiales.,\nProgramación genética,\nAlgoritmos evolutivos.\nBasado en formularios\nEjemplo: Hojas de cálculo como Excel.\nParadigma Dataflow\nEjemplo: Apache Nifi, Pentaho Data Integration..."},{"s":"Resumen UD1 p. 4","u":1,"t":"","x":"Orientado a eventos\nEl estado del sistema está determinado por eventos o sucesos que ocurren y cómo estos\nson manejados.Ejemplo: Hojas de cálculo como Excel, Javascript, c#..."},{"s":"Cap. 2 p. 1","u":2,"t":"","x":"# CAPÍTULO 2. EL PARADIGMA FUNCIONAL\n\n### 2.1 Introducción\n\nEl paradigma funcional es uno de los paradigmas más antiguos y fundamentales de la programación informática. Los orígenes teóricos del modelo funcional se remontan a la década de los 30, más precisamente al año 1934, cuando Alonso Church introdujo un modelo matemático de computación llamado cálculo lambda (o λ-cálculo), una teoría matemática elaborada por él mismo como apoyo a sus estudios sobre computabilidad.\n\nEl objetivo del paradigma funcional es conseguir una programación expresiva y matemáticamente elegante, en la que no sea necesario describir paso a paso la secuencia de computación para implementar informáticamente un problema.\n\nEn esta unidad se presentan, además del concepto de *función* con su especificación procedimental y declarativa, los siguientes conceptos que definen las características del paradigma:\n\n- *Transparencia referencial* de una función, en el sentido de que se comporta como una función matemática; es decir, que si recibe un valor de entrada siempre producirá el mismo valor de salida.\n- *Composición funcional*, que consiste en que un programa es una función compuesta de otras más simples, formando expresiones en que el resultado de una función es argumento de entrada de otra función.\n- *Función de orden superior*, denominada así porque sus argumentos y valor de retorno pueden ser otra función.\n- *Concepto de estado*, en el sentido de que en el paradigma funcional este concepto no existe como concepto de celda de memoria donde se almacenan los datos entrada, se transforman y se almacenan los resultados de salida."},{"s":"Cap. 2 p. 1","u":2,"t":"","x":"- *Función polimórfica*. Es una función que puede asumir diferentes formas o manipular tipos diferentes de objetos. A tal efecto se describen los tres tipos de polimorfismo: sobrecarga, polimorfismo dinámico y polimorfismo paramétrico.\n- *Evaluación retardada*. Este es un tipo de evaluación de una función donde sus argumentos no se evalúan hasta que no se necesitan (*\"call by need\"*). Es decir, los argumentos son evaluados cuando los necesita el cuerpo de la función.\n\nTambién se describen: la *mónada* como elemento encapsulado que proporciona características procedimentales sin perder las propiedades del paradigma funcional, los *tipos de datos* básicos que utiliza el paradigma funcional y el concepto de *programa funcional* como un conjunto compuesto de funciones que juntas definen un objetivo específico de aplicación.\n\n### 2.2 Objetivos\n\nLos objetivos de la unidad son básicamente los siguientes:"},{"s":"Cap. 2 p. 2","u":2,"t":"","x":"- Conocer el concepto de función como elemento básico del paradigma funcional y la diferencia en especificar una función de forma declarativa o de forma procedimental.\n- Conocer qué características principales definen al paradigma funcional: su transparencia referencial, su composición funcional, la utilización de funciones de orden superior, la no existencia del concepto de estado, la utilización de funciones polimórficas y la evaluación retardada o diferida.\n- Conocer las ventajas e inconvenientes que presenta el paradigma funcional en relación con el imperativo.\n\n### 2.3 El Paradigma Funcional. Concepto y Características\n\nEl paradigma funcional está basado en el modelo matemático de composición funcional. En este modelo, el resultado de un cálculo es la entrada del siguiente, y así sucesivamente hasta que la composición produce el resultado deseado. Por ejemplo, para ordenar una lista, se puede diseñar la solución como una concatenación de listas más pequeñas, cada una de las cuales ya está clasificada. Esto reduce el problema a seleccionar las listas más pequeñas."},{"s":"Cap. 2 p. 2","u":2,"t":"","x":"En este paradigma no existe el concepto de celda de memoria para almacenar un dato que es asignado o modificado. Más bien, existen valores intermedios que son el resultado de cálculos anteriores y las entradas a subsiguientes cálculos. Tampoco existen sentencias imperativas y todas las funciones tienen transparencia referencial, en el sentido de que para un mismo dato de entrada a una función ésta proporciona siempre el mismo resultado.\n\nEl paradigma funcional incorpora el concepto de función como objeto de primera clase, lo que significa que las funciones pueden ser tratadas como datos (pueden pasar como parámetros, ser calculadas y devueltas como valores normales y mezcladas en el cálculo con otras formas de datos).\n\n#### 2.3.1 La Función\n\nUn programa funcional es pues una serie de funciones que juntas definen un objeto específico de aplicación.\n\nLa función es una regla de correspondencia (o asociación) de miembros de un conjunto (el dominio) con miembros de otro conjunto (el rango). Por ejemplo, la función \"cubo\":"},{"s":"Cap. 2 p. 2","u":2,"t":"","x":"*cubo(x) = x³     x ∈ [nº. naturales]*\n\nhace corresponder miembros del conjunto de los números naturales: 1,2,3,..., que configuran el dominio con miembros del conjunto de los números naturales: 1, 8, 27, ...., que forman el rango.\n\nUna definición de función especifica el dominio, el rango y la regla de correspondencia de la función. Una vez definida la función, puede ser aplicada a un elemento particular del dominio y esta aplicación produce el elemento asociado dentro del rango.\n\nEl parámetro x en la función *cubo(x)* es una variable matemática que representa cualquier elemento del dominio, lo cual no es lo mismo que una variable de programación que toma diferentes valores durante la ejecución del programa."},{"s":"Cap. 2 p. 3","u":2,"t":"","x":"El concepto de función, desde el punto de vista informático, es una pieza individual de codificación que siempre efectúa el mismo conjunto de operaciones, pero que puede operar con diferentes datos, y proporcionar algún tipo de resultado, que se conoce como \"valor de la función\".\n\nUna función informática se define mediante una rutina que devuelve un valor: la regla de correspondencia de un valor del dominio con un valor del rango se establece en términos de un número de pasos que tienen que ser ejecutados en un orden específico mediante estructuras de control. Por otro lado las funciones matemáticas se definen funcionalmente; es decir, las reglas de correspondencia se definen en términos de aplicación de otras funciones o de ella misma (concepto de recursividad).\n\n***Ejemplo 2.1: Sumar los elementos de una lista L***\n\na) En un lenguaje puramente funcional tipo Function Programming (FP) creado por John Backus se puede definir como:"},{"s":"Cap. 2 p. 3","u":2,"t":"","x":"```\nsumar: L= if null:L then 0 else if null tail:L then first:L\n      else +: \u003cfirst:L, sumar: (tail:L)>\n```\n\n\"Si la lista L está vacía entonces *sumar* es 0 en caso contrario si la cola de la lista L es nula, devolver la cabeza de L; si no sumar la cabeza de la lista con la llamada recursiva a *sumar* tomando como parámetro la cola de L\"\nDada la lista L=\u003c4, 2, 5>, el resultado de *sumar: L* sería 11.\n\nb) En un lenguaje imperativo tipo C/C++ la función sumar se definiría como:\n\n```\nstruct lista { int valor; lista* siguiente;};\n\nint sumar(lista *L)\n{\n   lista *aux =L;\n   int suma=0;\n   while (aux != NULL) {\n      suma += aux->valor;\n      aux = aux->siguiente;\n   }\n   return suma;\n}\n```\n\nSe aprecia en b) el carácter de rutina de la función \"sumar\" con sentencias de asignación de tipo destructivo.\n\n#### 2.3.2 Especificación Procedimental de la Función\n\nLa forma en que se especifica la función puede variar. En particular, se pueden especificar *procedimentalmente*, indicando una secuencia de control, o *matemáticamente* mediante su definición sin secuencia de control. En la solución procedimental u operacional se controla explícitamente el orden en que se efectúa el cálculo. Así, al ordenar una lista, primero debemos determinar si la lista está vacía y realizar el tratamiento en el caso de que no lo esté. Este orden de cálculo origina una *sobrespecificación* que es lo que caracteriza a las soluciones procedimentales. En este estilo procedimental, se define el problema como una construcción en la que se describe una secuencia de etapas que aplicará composición funcional para obtener el resultado deseado."},{"s":"Cap. 2 p. 4","u":2,"t":"","x":"En la práctica, los lenguajes que soportan esta forma procedimental del paradigma funcional a menudo incluyen construcciones imperativas, tal como la asignación, que destruyen el natural no-efecto de lado de este paradigma y obligan a considerar la secuencia del programa en su construcción.\n\nUn ejemplo es COMMONLISP, considerado como el estándar del LISP. COMMONLISP se ha desarrollado como un lenguaje funcional procedimental que admite ambos tipos de construcciones: la composición funcional con transparencia referencial, y la asignación de variables con secuencias de control en la ejecución del programa.\n\n#### 2.3.3 Especificación Declarativa de la Función\n\nEn la solución declarativa, el paradigma se ajusta al modelo matemático de función, definiendo las funciones de la misma forma a como se realiza en el cálculo matemático (Ambler, 92):\n\n```\nf(x) =   cond1(x), expr1(x)\n         cond2(x), expr2(x)\n         ....................\n         condn(x), exprn(x)\n```"},{"s":"Cap. 2 p. 4","u":2,"t":"","x":"Para un valor particular de entrada x se cumplirá una de las condiciones del dominio de entrada y se devolverá el resultado de la expresión correspondiente. Dado este comportamiento, no es necesario especificar el orden de evaluación de las condiciones. Por ejemplo, la función *par(x)* que se describe a continuación es una solución funcional declarativa porque se especifican dos transformaciones disjuntas sin orden de ejecución:\n\n```\npar(x) = { resto(x,2) == 0 → true\n         { resto(x,2) != 0 → false\n\nresto(x,y) = x - (x//y) * y\n```\n\nMientras que la función *par(x)* que se describe a continuación es una solución funcional procedimental porque se indica el orden de ejecución de las sentencias:\n\n*par(x) = if ((x - (x//2) * 2) = = 0) then true **else** false*\n\nEs decir, en el estilo procedimental se define el problema como una construcción, en la que se describe una secuencia de etapas que aplicarán composición funcional para obtener el resultado deseado, mientras que en el estilo declarativo se define el problema como una colección de *transformaciones disjuntas* que, tomadas colectivamente, definen computacionalmente una función."},{"s":"Cap. 2 p. 4","u":2,"t":"","x":"Por otra parte, si se flexibilizan los requerimientos que mantienen las condiciones de las funciones *condi(x)*, y el orden de evaluación es de nuevo importante, se pasa del paradigma funcional declarativo al \"pseudodeclarativo\" y, en este caso, no se puede afirmar si un conjunto particular de condiciones
