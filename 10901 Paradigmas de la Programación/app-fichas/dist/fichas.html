      '<div class="dock wrap">' +
      '<button class="btn" id="go"' + (n ? '' : ' disabled') + '>Empezar · ' + plural(n, 'ficha', 'fichas') + '</button>' +
      '<button class="btn ghost" id="list"' + (n ? '' : ' disabled') + '>Lista</button>' +
      (n ? '' : '<p class="empty-note">' + (P.uds.length ? 'No hay fichas con estos filtros. Prueba con «Todas».' : 'Elige al menos una unidad.') + '</p>') +
      '</div></div>';

    bindShared(one);
    document.getElementById('reset').onclick = () => {
      if (!armed) { armed = true; keepScroll(renderHome); setTimeout(() => { if (armed) { armed = false; if (view === 'home') keepScroll(renderHome); } }, 4000); return; }
      armed = false; S = { v: 1, epoch: Date.now(), cards: {} }; commit(); keepScroll(renderHome);
    };
    document.getElementById('go').onclick = () => {
      const cards = pool(); if (!cards.length) return;
      startSession(queueOf(cards, P.orden === 'mezcla'), describe());
    };
    document.getElementById('list').onclick = () => { view = 'list'; render(); };
  }
  function keepScroll(fn) {
    const sc = app.querySelector('.scroll'), y = sc ? sc.scrollTop : 0;
    fn();
    const sc2 = app.querySelector('.scroll'); if (sc2) sc2.scrollTop = y;
  }
  function describe() {
    const u = P.uds.length === UDS.length ? 'UD1–UD5' : P.uds.map(x => 'UD' + x).join(' · ');
    return u + (P.ess ? ' · esenciales' : '');
  }

  // ================= MODO TEST =================
  const nf = x => (Math.round(x * 10) / 10).toFixed(1).replace('.', ',');
  const fecha = t => { try { return new Date(t).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } };
  const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
  ICON.dash = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg>';
  function qStatus(id) { const e = T.qs[id]; return !e || !e.n ? 'new' : e.r ? 'ok' : 'bad'; }
  const seenN = id => (T.qs[id] && T.qs[id].n) || 0;
  function qRecord(id, right) {
    const e = Object.assign({ n: 0, ok: 0, last: 0, r: 0 }, T.qs[id]);
    e.n++; if (right) e.ok++; e.r = right ? 1 : 0; e.last = Date.now();
    T.qs[id] = e;
  }
  function qTally(list) { const t = { ok: 0, mid: 0, bad: 0, new: 0, total: list.length }; for (const q of list) t[qStatus(q.id)]++; return t; }
  function qPool() {
    const one = singleUd();
    return QS.filter(q => {
      if (!P.uds.includes(q.ud)) return false;
      if (one && P.off.includes(temaKey(q.ud, q.tema))) return false;
      if (P.ess && q.imp !== 1) return false;
      const st = qStatus(q.id);
      if (P.tfiltro === 'pendientes' && st === 'ok') return false;
      if (P.tfiltro === 'falladas' && st !== 'bad') return false;
      return true;
    });
  }
  // Simulacro: cupo de cada unidad proporcional a sus preguntas; dentro de cada unidad, primero las menos vistas
  // y repartidas entre temas. Así cada simulacro nuevo trae sobre todo preguntas que aún no has visto.
  function simPick() {
    const n = SIM_N; if (!n) return [];
    const byUd = UDS.map(u => QS.filter(q => q.ud === u.ud));
    const quota = byUd.map(l => n * l.length / QS.length), take = quota.map(Math.floor);
    let rest = n - take.reduce((a, b) => a + b, 0);
    quota.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { take[i]++; rest--; } });
    const ids = [];
    byUd.forEach((l, i) => {
      const rnd = new Map(l.map(q => [q.id, Math.random()])), used = {}, got = new Set(), mine = [];
      for (let k = 0; k < take[i]; k++) {
        let best = null, bk = null;
        for (const q of l) {
          if (got.has(q.id)) continue;
          const key = [seenN(q.id), used[q.tema] || 0, rnd.get(q.id)];
          if (!bk || key[0] < bk[0] || (key[0] === bk[0] && (key[1] < bk[1] || (key[1] === bk[1] && key[2] < bk[2])))) { best = q; bk = key; }
        }
        if (!best) break;
        got.add(best.id); used[best.tema] = (used[best.tema] || 0) + 1; mine.push(best.id);
      }
      ids.push(...shuffle(mine));
    });
    return ids;
  }

  let tses = null, pendingSim = null, tarmed = false, darmed = false;
  function newTSes(kind, ids, title) {
    const perm = {}; for (const id of ids) perm[id] = shuffle([0, 1, 2, 3]);
    return { kind, ids: ids.slice(), perm, ans: {}, i: 0, title, t0: Date.now(), res: null };
  }
  function validSes(x) {
    if (!isObj(x) || !['sim', 'prac'].includes(x.kind) || !Array.isArray(x.ids) || !x.ids.length || !isObj(x.perm) || !isObj(x.ans)) return null;
    if (!x.ids.every(id => Q_BY.has(id) && Array.isArray(x.perm[id]) && x.perm[id].length === 4 && [0, 1, 2, 3].every(k => x.perm[id].includes(k)))) return null;
    x.i = Math.max(0, Math.min(x.ids.length - 1, +x.i || 0));
    if (x.res != null && !isObj(x.res)) x.res = null;
    return x;
  }
  pendingSim = validSes(parse(LS.get(TSKEY)));
  if (pendingSim && (pendingSim.kind !== 'sim' || pendingSim.res)) pendingSim = null;
  function saveTSes() { LS.set(TSKEY, tses && tses.kind === 'sim' && !tses.res ? JSON.stringify(tses) : ''); }
  function startSim() {
    const ids = simPick(); if (!ids.length) return;
    tses = newTSes('sim', ids, 'Simulacro de examen'); pendingSim = null; saveTSes();
    view = 'quiz'; render();
  }
  function startPrac(ids, title) { if (!ids.length) return; tses = newTSes('prac', ids, title); view = 'quiz'; render(); }
  function startPracFromHome() {
    const list = shuffle(qPool().slice()).sort((a, b) => (qStatus(a.id) === 'new' ? 0 : 1) - (qStatus(b.id) === 'new' ? 0 : 1));
    if (!list.length) return;
    const n = P.tanda ? Math.min(P.tanda, list.length) : list.length;
    startPrac(list.slice(0, n).map(q => q.id), describe() + ' · práctica');
  }
  const codeHTML = c => c ? '<pre' + (Math.max(...c.split(String.fromCharCode(10)).map(l => l.length)) > 38 ? ' class="wide"' : '') + '>' + esc(c) + '</pre>' : '';
  const isRight = (s, id) => s.ans[id] !== undefined && s.ans[id] !== -1 && s.perm[id][s.ans[id]] === 0;

  // ---------- veredicto ----------
  function fullSims() { return T.sims.filter(x => x.n >= SIM_N); }
  function verdict() {
    const all = fullSims(), last = all.slice(-WINDOW);
    if (!last.length) return { st: 'none', all, last };
    const avg = Math.round(last.reduce((a, x) => a + x.nota, 0) / last.length * 10) / 10;
    const min = Math.min(...last.map(x => x.nota));
    const ud = {};
    for (const x of last) for (const [u, v] of Object.entries(x.ud)) { const o = ud[u] || (ud[u] = [0, 0]); o[0] += v[0]; o[1] += v[2]; }
    let weak = null;
    for (const [u, v] of Object.entries(ud)) if (v[1] && (!weak || v[0] / v[1] < weak.r)) weak = { ud: u, r: v[0] / v[1] };
    if (last.length < WINDOW) return { st: 'pending', avg, min, all, last, weak, need: WINDOW - last.length };
    return { st: avg >= GOAL && min >= FLOOR ? 'ok' : avg >= PASS ? 'mid' : 'bad', avg, min, all, last, weak };
  }
  function histHTML(v) {
    const hist = v.all.slice(-8); if (!hist.length) return '';
    const from = hist.length - Math.min(WINDOW, v.last.length);
    const y = [0, 5, 7, 10].map(k => '<span style="bottom:' + (k * 10) + '%">' + k + '</span>').join('');
    const bars = hist.map((x, j) => {
      const counted = j >= from;
      return '<button type="button" data-tip="' + esc(fecha(x.t) + ' · ' + nf(x.nota) + ' (' + x.ok + ' bien, ' + x.bad + ' mal, ' + x.blank + ' en blanco)') + '" data-nota="' + x.nota + '" aria-label="Simulacro del ' + esc(fecha(x.t)) + ': ' + nf(x.nota) + '">' +
        '<i class="b' + (counted ? '' : ' old') + '" style="height:' + Math.max(3, x.nota * 10) + '%">' + (counted ? '<em>' + nf(x.nota) + '</em>' : '') + '</i></button>';
    }).join('');
    return '<div class="hist"><div class="hist-y" aria-hidden="true">' + y + '</div>' +
      '<div class="plot" id="plot"><i class="ref" style="bottom:50%"></i><i class="ref goal" style="bottom:70%"></i>' +
      '<div class="bars">' + bars + '</div><div class="tip" id="tip" hidden></div></div>' +
      '<p class="hist-cap">Resaltados, los que cuentan. Línea continua: objetivo ' + GOAL + '; discontinua: aprobado ' + PASS + '.</p></div>';
  }
  function bindHist() {
    const plot = document.getElementById('plot'), tip = document.getElementById('tip'); if (!plot || !tip) return;
    const show = b => {
      tip.textContent = b.dataset.tip; tip.hidden = false;
      const w = plot.clientWidth, half = tip.offsetWidth / 2 + 2;
      const x = Math.max(half, Math.min(w - half, b.offsetLeft + b.offsetWidth / 2));

      b.addEventListener('pointerenter', () => show(b)); b.addEventListener('pointerleave', hide);
      b.addEventListener('focus', () => show(b)); b.addEventListener('blur', hide);
      b.addEventListener('click', () => (tip.hidden ? show(b) : hide()));
    });
  }
  function verdictHTML() {
    const v = verdict();
    const seen = QS.filter(q => seenN(q.id)).length;
    const weak = v.weak && v.weak.r < .8 ? ' Lo que peor llevas: <b>UD' + v.weak.ud + '</b> (' + Math.round(100 * v.weak.r) + ' % de aciertos).' : '';
    let cls = '', icon = '', title, text;

    } else if (v.st === 'mid') {

      text = (v.avg >= GOAL ? 'Media de <b>' + nf(v.avg) + '</b>, pero uno de los tres bajó de ' + FLOOR + ': aún vas irregular.' : 'Media de <b>' + nf(v.avg) + '</b>: aprobarías por poco. El objetivo es ' + GOAL + ' de media sin bajar de ' + FLOOR + '.') + weak;
    } else {
      cls = 'bad'; icon = ICON.x; title = 'Todavía no';
      text = 'Media de <b>' + nf(v.avg) + '</b> en los tres últimos. Practica por unidades las que fallas y vuelve a probar.' + weak;
    }
    return '<section class="verdict" aria-label="¿Apruebas?"><div class="v-top"><div><h2>¿Apruebas?</h2>' +
      '<p class="v-state ' + cls + '">' + icon + esc(title) + '</p></div>' +
      (v.last.length ? '<div class="v-avg"><b>' + nf(v.avg) + '</b><span>' + (v.last.length === 1 ? 'último' : 'media de ' + v.last.length) + '</span></div>' : '') + '</div>' +
      histHTML(v) +
      '<p class="v-text">' + text + '</p>' +
      '<p class="v-foot">Has visto ' + seen + ' de ' + QS.length + ' preguntas · ' + plural(fullSims().length, 'simulacro hecho', 'simulacros hechos') + '</p></section>';
  }

  // ---------- inicio del modo test ----------
  function renderTestHome() {
    const one = singleUd(), list = qPool(), n = list.length, tn = P.tanda ? Math.min(P.tanda, n) : n;
    const ess = QS.filter(q => P.uds.includes(q.ud) && q.imp === 1).length;

    app.innerHTML =
      '<div class="view"><div class="scroll"><div class="home wrap">' + headerHTML() +
      (pend ? '<section class="resume"><p><b>Tienes un simulacro a medias</b>Vas por la ' + (pendingSim.i + 1) + ' de ' + pendingSim.ids.length + ' · ' + pendDone + ' respondidas</p>' +
        '<div class="row"><button class="btn" id="tresume">Seguir el simulacro</button><button class="reset' + (darmed ? ' armed' : '') + '" id="tdiscard">' + (darmed ? '¿Seguro? Toca otra vez' : 'Descartar') + '</button></div></section>' : '') +
      verdictHTML() +
      '<section class="sec"><div class="sec-head"><h2>Practicar por unidades</h2><button class="link" id="uds-all">' + (P.uds.length === UDS.length ? 'Ninguna' : 'Todas') + '</button></div><div class="uds">' + udRowsHTML(QS, qTally) + '</div></section>' +
      temasHTML(one, QS) +
      '<section class="sec"><h2>Qué preguntas</h2>' +
      seg('tfiltro', [['todas', 'Todas'], ['pendientes', 'Sin acertar'], ['falladas', 'Falladas']]) +
      '<button class="toggle" id="ess" aria-pressed="' + P.ess + '"><span><b>Solo de lo esencial ★</b><small>' + plural(ess, 'pregunta de lo más seguro de examen', 'preguntas de lo más seguro de examen') + '</small></span><i class="sw" aria-hidden="true"></i></button>' +
      '</section>' +
      '<section class="sec"><h2>Preguntas por tanda</h2>' + seg('tanda', [['10', '10'], ['20', '20'], ['0', 'Todas']]) + '</section>' +
      '<section class="howto"><p><b>Simulacro.</b> ' + SIM_N + ' preguntas de UD1–UD5, en proporción a lo que pesa cada unidad. Se corrige como un examen tipo test: acierto +1, fallo −⅓, en blanco 0. No sabes si aciertas hasta entregar, y puedes volver atrás y cambiar respuestas. Cada simulacro saca primero las preguntas que aún no has visto.</p>' +
      '<p><b>Veredicto.</b> Si sacas ' + GOAL + ' o más de media en los tres últimos simulacros, sin ninguno por debajo de ' + FLOOR + ', lo más probable es que apruebes. Se pide más que un 5 porque las preguntas del examen real serán otras y porque, con ' + SIM_N + ' preguntas, la nota de un simulacro sube o baja unos 0,7 puntos solo por azar.</p>' +
      '<p><b>Practicar.</b> Corrige cada pregunta al momento, con la explicación y la ficha que la repasa. Las barras de cada unidad cuentan las preguntas que acertaste la última vez.</p>' +
      '<button class="reset' + (tarmed ? ' armed' : '') + '" id="treset">' + (tarmed ? 'Toca otra vez para borrar los resultados del test' : 'Borrar resultados del test') + '</button></section>' +
      '</div></div>' +
      '<div class="dock two wrap">' +
      '<button class="btn" id="tsim"' + (SIM_N ? '' : ' disabled') + '>' + (pend ? 'Simulacro nuevo' : 'Simulacro · ' + SIM_N) + '</button>' +
      '<button class="btn ghost" id="tprac"' + (n ? '' : ' disabled') + '>Practicar · ' + tn + '</button>' +
      (n ? '' : '<p class="empty-note">' + (P.uds.length ? 'No hay preguntas con estos filtros. Prueba con «Todas».' : 'Elige al menos una unidad para practicar.') + '</p>') +
      '</div></div>';

    bindShared(one);
    bindHist();
    document.getElementById('tsim').onclick = startSim;
    document.getElementById('tprac').onclick = startPracFromHome;
    const rs = document.getElementById('tresume');
    if (rs) rs.onclick = () => { tses = pendingSim; pendingSim = null; darmed = false; view = 'quiz'; render(); };
    const ds = document.getElementById('tdiscard');
    if (ds) ds.onclick = () => {
      if (!darmed) { darmed = true; keepScroll(renderHome); setTimeout(() => { if (darmed) { darmed = false; if (view === 'home') keepScroll(renderHome); } }, 4000); return; }
      darmed = false; pendingSim = null; LS.set(TSKEY, ''); keepScroll(renderHome);
    };
    document.getElementById('treset').onclick = () => {
      if (!tarmed) { tarmed = true; keepScroll(renderHome); setTimeout(() => { if (tarmed) { tarmed = false; if (view === 'home') keepScroll(renderHome); } }, 4000); return; }
      tarmed = false; T = { v: 1, epoch: Date.now(), qs: {}, sims: [] }; tCommit(); keepScroll(renderHome);
    };
  }

  // ---------- pregunta ----------
  function keepStage(fn) {
    const st = app.querySelector('.stage'), y = st ? st.scrollTop : 0;
    fn();
    const st2 = app.querySelector('.stage'); if (st2) st2.scrollTop = y;
  }
  function renderQuiz() {
    const s = tses, id = s.ids[s.i], q = Q_BY.get(id), sim = s.kind === 'sim';
    const a = s.ans[id], shown = !sim && a !== undefined;
    const ops = s.perm[id].map((orig, k) => {
      let cls = 'op';
      if (shown) cls += orig === 0 ? ' right' : k === a ? ' wrong' : ' dim';
      return '<button class="' + cls + '" data-k="' + k + '"' + (sim ? ' aria-pressed="' + (a === k) + '"' : '') + (shown ? ' aria-disabled="true"' : '') + '>' +
        '<span class="lt">' + LETTERS[k] + '</span><span class="ot">' + inline(q.ops[orig]) + '</span></button>';
    }).join('');
    let fb = '';
    if (shown) {
      const right = isRight(s, id), kr = LETTERS[s.perm[id].indexOf(0)];
      const card = q.ficha ? BY_ID.get(q.ficha) : null;
      fb = '<div class="fb ' + (right ? 'ok' : 'bad') + '" id="fb"><p class="fb-h">' + (right ? ICON.check + 'Correcto' : ICON.x + (a === -1 ? 'Era la ' + kr : 'No: la correcta es la ' + kr)) + '</p>' +
        '<p>' + inline(q.why) + '</p>' +
        (card ? '<details><summary>Repasar la ficha</summary><div class="ans"><p class="q-small">' + inline(card.q) + '</p>' + fmt(card.a) + (card.code ? '<pre>' + esc(card.code) + '</pre>' : '') + '</div></details>' : '') +
        (AI ? '<button class="asklink" id="askq">' + ICON.chat + (right ? 'Pregúntale una duda' : 'Pregúntale por qué') + '</button>' : '') +
        '<div class="src"><span>Fuente: ' + esc(q.src || '—') + '</span>' + (card ? '<span>Ficha ' + esc(card.id) + '</span>' : '') + '</div></div>';
    }
    let act;
    if (!sim) act = shown
      ? '<div class="qact one wrap"><button class="btn" id="qnext">' + (s.i + 1 < s.ids.length ? 'Siguiente' : 'Ver resultado') + '</button></div>'
      : '<div class="qact one wrap"><button class="btn ghost" id="qblank">No lo sé</button></div>';
    else {
      const last = s.i + 1 >= s.ids.length;
      act = '<div class="qact wrap"><button class="btn ghost" id="qprev" aria-label="Pregunta anterior"' + (s.i ? '' : ' disabled') + '>' + ICON.back + '</button>' +
        '<button class="btn' + (a === undefined && !last ? ' ghost' : '') + '" id="qnext">' + (last ? 'Terminar' : a === undefined ? 'Dejar en blanco' : 'Siguiente') + '</button></div>';
    }
    const eb = '<div class="eyebrow"><span class="udtag">UD' + q.ud + '</span>' + (sim ? '<span>Pregunta ' + (s.i + 1) + '</span>' : '<span>' + esc(q.tema) + '</span>') +
      (!sim && q.imp === 1 ? '<span class="star" title="Esencial">★ Esencial</span>' : '') + '</div>';
    const done = sim ? s.ids.filter(x => s.ans[x] !== undefined).length : s.i + (shown ? 1 : 0);
    app.innerHTML =
      '<div class="view">' +
      '<div class="studybar wrap"><button class="icon-btn" id="qquit" aria-label="' + (sim ? 'Pausar y volver al inicio' : 'Salir al inicio') + '">' + ICON.x + '</button>' +
      '<div class="prog" aria-hidden="true"><i style="width:' + (100 * done / s.ids.length).toFixed(1) + '%"></i></div>' +
      '<span class="count">' + (s.i + 1) + ' / ' + s.ids.length + '</span></div>' +
      '<div class="stage wrap"><div class="qwrap u' + q.ud + '"><div class="qcard">' + eb + '<p class="qtext">' + inline(q.q) + '</p>' + codeHTML(q.code) + '</div>' +
      '<div class="ops" role="group" aria-label="Opciones">' + ops + '</div>' + fb + '</div></div>' + act + '</div>';

    app.querySelectorAll('.op').forEach(b => b.onclick = () => pick(+b.dataset.k));
    document.getElementById('qquit').onclick = quitQuiz;
    const nx = document.getElementById('qnext'); if (nx) nx.onclick = qNext;
    const pv = document.getElementById('qprev'); if (pv) pv.onclick = qPrev;
    const bl = document.getElementById('qblank'); if (bl) bl.onclick = () => pick(-1);
    const aq = document.getElementById('askq'); if (aq) aq.onclick = () => openAsk({ kind: 'q', id, perm: s.perm[id].slice(), ans: s.ans[id] });
  }
  function pick(k) {
    const s = tses; if (!s) return;
    const id = s.ids[s.i];
    if (s.kind === 'sim') {
      if (k < 0) return;
      if (s.ans[id] === k) delete s.ans[id]; else s.ans[id] = k;
      saveTSes(); keepStage(renderQuiz); return;
    }
    if (s.ans[id] !== undefined) return;
    s.ans[id] = k; qRecord(id, isRight(s, id)); tCommit();
    keepStage(renderQuiz);
    const fb = document.getElementById('fb');
    if (fb) fb.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
  }
  function qNext() {
    const s = tses; if (!s) return;
    if (s.kind === 'prac') {
      if (s.ans[s.ids[s.i]] === undefined) return;
      if (s.i + 1 >= s.ids.length) { finishPrac(); return; }
      s.i++; render(); return;
    }
    if (s.i + 1 >= s.ids.length) { view = 'qconfirm'; render(); return; }
    s.i++; saveTSes(); render();
  }
  function qPrev() { const s = tses; if (s && s.kind === 'sim' && s.i > 0) { s.i--; saveTSes(); render(); } }
  function quitQuiz() {
    if (tses && tses.kind === 'sim' && !tses.res) { pendingSim = tses; saveTSes(); }
    tses = null; view = 'home'; render();
  }

  // ---------- entrega ----------
  function renderConfirm() {
    const s = tses, n = s.ids.length, done = s.ids.filter(id => s.ans[id] !== undefined).length, blank = n - done;
    app.innerHTML =
      '<div class="view"><div class="scroll"><div class="done wrap">' +
      '<div><h2>Simulacro de examen</h2><h1>¿Lo entregas?</h1></div>' +
      '<div class="tiles two"><div class="tile"><b>' + done + '</b><span>respondidas</span></div><div class="tile"><b>' + blank + '</b><span>en blanco</span></div></div>' +
      '<p class="note">Cada fallo resta un tercio de acierto y lo que dejes en blanco no resta. Si en una pregunta puedes descartar al menos una opción, te compensa contestarla.</p>' +
      '<button class="btn" id="deliver">Entregar y ver la nota</button>' +
      (blank ? '<button class="btn ghost" id="toblank">' + (blank === 1 ? 'Ir a la que está en blanco' : 'Ir a la primera en blanco') + '</button>' : '') +
      '<button class="btn ghost" id="toback">Volver a la última pregunta</button>' +
      '</div></div></div>';
    document.getElementById('deliver').onclick = finishSim;
    const tb = document.getElementById('toblank');
    if (tb) tb.onclick = () => { s.i = s.ids.findIndex(id => s.ans[id] === undefined); view = 'quiz'; saveTSes(); render(); };
    document.getElementById('toback').onclick = () => { view = 'quiz'; render(); };
  }
  function finishSim() {
    const s = tses; let ok = 0, bad = 0, blank = 0; const ud = {};
    for (const id of s.ids) {
      const q = Q_BY.get(id), right = isRight(s, id), u = ud[q.ud] || (ud[q.ud] = [0, 0, 0]);
      u[2]++;
      if (s.ans[id] === undefined) blank++; else if (right) { ok++; u[0]++; } else { bad++; u[1]++; }
      qRecord(id, right);
    }
    const n = s.ids.length, nota = Math.round(Math.max(0, (ok - bad * PEN) / n * 10) * 10) / 10;
    const rec = { t: Date.now(), n, ok, bad, blank, nota, ud };
    T.sims.push(rec); T.sims = T.sims.slice(-60); tCommit();
    s.res = rec; pendingSim = null; LS.set(TSKEY, '');
    view = 'qdone'; render();
  }
  function finishPrac() {
    const s = tses, ok = s.ids.filter(id => isRight(s, id)).length;
    s.res = { ok, bad: s.ids.length - ok, n: s.ids.length };
    view = 'qdone'; render();
  }

  // ---------- resultado ----------
  function byUdHTML(ud) {
    const rows = UDS.filter(u => ud[u.ud] && ud[u.ud][2]).map(u => {
      const [ok, bad, n] = ud[u.ud], blank = n - ok - bad;
      const segs = [['s-ok', ok], ['s-bad', bad], ['', blank]].filter(x => x[1]).map(([c, k]) => '<i class="' + c + '" style="flex-grow:' + k + '"></i>').join('');
      return '<div class="byud-row u' + u.ud + '"><span class="udtag">UD' + u.ud + '</span><span class="mbar" role="img" aria-label="' + ok + ' bien, ' + bad + ' mal, ' + blank + ' en blanco">' + segs + '</span><span>' + ok + '/' + n + '</span></div>';
    }).join('');
    return '<section class="sec"><h2>Por unidades</h2><div class="byud">' + rows + '</div>' +
      '<div class="legend"><span class="l-ok">bien</span><span class="l-bad">mal</span><span class="l-blank">en blanco</span></div></section>';
  }
  function reviewHTML(s, id) {
    const q = Q_BY.get(id), a = s.ans[id], blank = a === undefined || a === -1;
    return '<div class="rv u' + q.ud + '"><p class="rv-q"><span class="udtag">UD' + q.ud + '</span>' + inline(q.q) + '</p>' + codeHTML(q.code) +
      (blank ? '<p class="rv-a blank">' + ICON.dash + '<span>En blanco</span></p>' : '<p class="rv-a bad">' + ICON.x + '<span>' + inline(q.ops[s.perm[id][a]]) + '</span></p>') +
      '<p class="rv-a ok">' + ICON.check + '<span>' + inline(q.ops[0]) + '</span></p>' +
      '<p class="rv-why">' + inline(q.why) + '</p>' +
      (AI ? '<button class="asklink" data-askq="' + esc(id) + '">' + ICON.chat + 'Pregúntale por qué</button>' : '') + '</div>';
  }
  function renderQDone() {
    const s = tses, sim = s.kind === 'sim', r = s.res;
    const miss = s.ids.filter(id => !isRight(s, id));
    let top;
    if (sim) {
      const pass = r.nota >= PASS;
      top = '<div><h2>Simulacro · ' + esc(fecha(r.t)) + '</h2></div>' +
        '<div class="score"><b>' + nf(r.nota) + '</b><span>sobre 10</span><span class="tag ' + (pass ? 'ok' : 'bad') + '">' + (pass ? ICON.check + 'Aprobado' : ICON.x + 'Suspenso') + '</span></div>' +
        '<div class="tiles"><div class="tile ok"><b>' + r.ok + '</b><span>bien</span></div><div class="tile bad"><b>' + r.bad + '</b><span>mal</span></div><div class="tile"><b>' + r.blank + '</b><span>en blanco</span></div></div>' +
        '<p class="formula">Nota = (' + r.ok + ' − ' + r.bad + ' ÷ 3) ÷ ' + r.n + ' × 10 = ' + nf(r.nota) + '</p>' +
        verdictHTML();
    } else {
      top = '<div><h2>' + esc(s.title) + '</h2><h1>' + (miss.length ? r.ok + ' de ' + r.n + ' bien' : '¡Todas bien!') + '</h1></div>' +
        '<div class="tiles two"><div class="tile ok"><b>' + r.ok + '</b><span>bien</span></div><div class="tile bad"><b>' + r.bad + '</b><span>mal o «no lo sé»</span></div></div>';
    }
    const redoTxt = miss.length === 1 ? 'Repasar la que fallé' : 'Repasar las ' + miss.length + (sim ? ' que fallé o dejé en blanco' : ' que fallé');
    app.innerHTML =
      '<div class="view"><div class="scroll"><div class="done wrap">' + top +
      (miss.length ? '<button class="btn" id="qredo">' + redoTxt + '</button>' : '') +
      (sim ? '<button class="btn ghost" id="qagain">Otro simulacro</button>' : '') +
      '<button class="btn ghost" id="qhome">Volver al inicio</button>' +
      (sim ? byUdHTML(r.ud) : '') +
      (miss.length ? '<section class="sec"><h2>Revisión · ' + miss.length + '</h2><div class="review">' + miss.map(id => reviewHTML(s, id)).join('') + '</div></section>' : '') +
      '</div></div></div>';
    bindHist();
    const rd = document.getElementById('qredo');
    if (rd) rd.onclick = () => startPrac(shuffle(miss.slice()), 'Repaso de los fallos');
    const ag = document.getElementById('qagain'); if (ag) ag.onclick = startSim;
    app.querySelectorAll('[data-askq]').forEach(b => b.onclick = () => { const id = b.dataset.askq; openAsk({ kind: 'q', id, perm: s.perm[id].slice(), ans: s.ans[id] }); });
    document.getElementById('qhome').onclick = () => { tses = null; view = 'home'; render(); };
  }

  // ---------- sesión de estudio ----------
  function startSession(ids, title) {
    ses = { q: ids.slice(), i: 0, flipped: false, first: {}, requeued: {}, title: title, total: ids.length };
    view = 'study'; render();
  }
  function seriesDots(c) {
    let d = '';
    for (let k = 1; k <= c.total; k++) d += '<i class="' + (k < c.n ? 'on' : k === c.n ? 'on cur' : '') + '"></i>';
    return '<div class="serie"><span class="nt">' + c.n + '/' + c.total + '</span><span>' + esc(c.serie) + '</span><span class="dots" aria-hidden="true">' + d + '</span></div>';
  }
  function eyebrow(c) {
    return '<div class="eyebrow"><span class="udtag">UD' + c.ud + '</span><span>' + esc(c.tema) + '</span>' +
      (c.imp === 1 ? '<span class="star" title="Esencial">★ Esencial</span>' : '') + '</div>';
  }
  function renderStudy() {
    const id = ses.q[ses.i], c = BY_ID.get(id);
    if (!c) { ses.i++; return ses.i < ses.q.length ? renderStudy() : finish(); }
    const pct = 100 * ses.i / ses.q.length;
    const serie = c.serie && c.total > 1 ? seriesDots(c) : '';
    app.innerHTML =
      '<div class="view">' +
      '<div class="studybar wrap"><button class="icon-btn" id="quit" aria-label="Salir al inicio">' + ICON.x + '</button>' +
      '<div class="prog" aria-hidden="true"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<span class="count">' + (ses.i + 1) + ' / ' + ses.q.length + '</span></div>' +
      '<div class="stage wrap"><div class="card in u' + c.ud + (ses.flipped ? ' flipped' : '') + '" id="card" tabindex="0" role="button" aria-label="Ficha. Toca para girarla">' +
      '<div class="inner">' +
      '<div class="face front" aria-hidden="' + ses.flipped + '">' + eyebrow(c) + serie +
      '<p class="q">' + inline(c.q) + '</p><p class="tap">Intenta responder antes de girarla</p></div>' +
      '<div class="face back" aria-hidden="' + !ses.flipped + '">' + eyebrow(c) + serie +
      '<p class="q-small">' + inline(c.q) + '</p>' +
      '<div class="ans">' + fmt(c.a) + (c.code ? '<pre>' + esc(c.code) + '</pre>' : '') + '</div>' +
      '<div class="src"><span>Fuente: ' + esc(c.src || '—') + '</span><span>' + statusLabel(id) + '</span></div></div>' +
      '</div><div class="tint" id="tint"></div></div></div>' +
      actionsHTML() + '</div>';
    bindStudy();
  }
  function statusLabel(id) {
    const st = status(id);
    return { new: 'Primera vez', ok: '<span class="st-dot s-ok"></span>Te la sabías', mid: '<span class="st-dot s-mid"></span>La dudaste', bad: '<span class="st-dot s-bad"></span>La fallaste' }[st];
  }
  function actionsHTML() {
    if (!ses.flipped) return '<div class="actions one wrap"><button class="btn" id="flip">Ver respuesta</button></div>';
    return '<div class="actions wrap">' +
      (AI ? '<button class="asklink" id="askcard">' + ICON.chat + '¿No te queda claro? Pregúntale</button>' : '') +
      '<button class="rate again" data-r="again">Otra vez<small>no me la sé</small></button>' +
      '<button class="rate hard" data-r="hard">Dudé<small>a medias</small></button>' +
      '<button class="rate good" data-r="good">Me la sé<small>bien</small></button></div>';
  }
  function flip() {
    ses.flipped = !ses.flipped;
    const card = document.getElementById('card'); if (!card) return;
    card.classList.remove('in');
    card.classList.toggle('flipped', ses.flipped);
    card.querySelector('.front').setAttribute('aria-hidden', ses.flipped);
    card.querySelector('.back').setAttribute('aria-hidden', !ses.flipped);
    const old = app.querySelector('.actions'); if (old) old.outerHTML = actionsHTML();
    bindActions();
    const st = app.querySelector('.stage'); if (st) st.scrollTop = 0;
  }
  let busy = false;
  function answer(r) {
    if (busy || !ses || !ses.flipped) return;
    busy = true;
    const id = ses.q[ses.i];
    rateCard(id, r);
    if (!(id in ses.first)) ses.first[id] = r;
    if (r === 'again' && (ses.requeued[id] || 0) < 2) {
      ses.requeued[id] = (ses.requeued[id] || 0) + 1;
      ses.q.splice(Math.min(ses.i + 5, ses.q.length), 0, id);
    }
    const card = document.getElementById('card');
    const next = () => { busy = false; ses.i++; ses.flipped = false; if (ses.i >= ses.q.length) finish(); else renderStudy(); };
    if (card && !reduced()) { card.classList.add(r === 'again' ? 'out-l' : 'out-r'); setTimeout(next, 200); } else next();
  }
  function bindActions() {
    const f = document.getElementById('flip'); if (f) f.onclick = flip;
    app.querySelectorAll('.rate').forEach(b => b.onclick = () => answer(b.dataset.r));
    const ak = document.getElementById('askcard'); if (ak) ak.onclick = () => { if (ses) openAsk({ kind: 'card', id: ses.q[ses.i] }); };
  }
  function bindStudy() {
    document.getElementById('quit').onclick = () => { ses = null; view = 'home'; render(); };
    bindActions();
    const card = document.getElementById('card'), tint = document.getElementById('tint');
    let sx = 0, sy = 0, dx = 0, down = false, moved = false;
    card.addEventListener('pointerdown', e => { if (e.button) return; down = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0; });
    card.addEventListener('pointermove', e => {
      if (!down) return;
      dx = e.clientX - sx; const dy = e.clientY - sy;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
      if (!ses.flipped || Math.abs(dy) > Math.abs(dx)) return;
      card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 40) + 'deg)';
      const k = Math.min(1, Math.abs(dx) / 90);
      tint.className = 'tint ' + (dx > 0 ? 'good' : 'again'); tint.textContent = dx > 0 ? 'Me la sé' : 'Otra vez'; tint.style.opacity = k;
    });
    const end = () => {
      if (!down) return; down = false;
      card.style.transform = ''; tint.style.opacity = 0;
      if (ses.flipped && Math.abs(dx) > 90) { answer(dx > 0 ? 'good' : 'again'); return; }
      if (!moved) flip();
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', () => { down = false; card.style.transform = ''; tint.style.opacity = 0; });
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    card.focus({ preventScroll: true });
  }
  document.addEventListener('keydown', e => {
    if (view === 'ask') { if (e.key === 'Escape') closeAsk(); return; }
    if (view === 'quiz' && tses) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.length === 1 ? Math.max('1234'.indexOf(e.key), 'abcd'.indexOf(e.key.toLowerCase())) : -1;
      if (k >= 0) { e.preventDefault(); pick(k); return; }
      if (e.key === 'Escape') { quitQuiz(); return; }
      if (e.key === 'ArrowLeft') { qPrev(); return; }
      if ((e.key === 'Enter' && e.target.tagName !== 'BUTTON') || e.key === 'ArrowRight') { e.preventDefault(); qNext(); }
      return;
    }
    if (view !== 'study' || !ses) return;
    if (e.key === 'Escape') { ses = null; view = 'home'; render(); return; }
    if (!ses.flipped) { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flip(); } return; }
    if (e.key === 'ArrowLeft' || e.key === '1') answer('again');
    else if (e.key === 'ArrowDown' || e.key === '2') answer('hard');
    else if (e.key === 'ArrowRight' || e.key === '3') answer('good');
  });
  function finish() { view = 'done'; render(); }
  function renderDone() {
    const f = ses.first, ids = Object.keys(f);
    const ok = ids.filter(i => f[i] === 'good').length, mid = ids.filter(i => f[i] === 'hard').length, bad = ids.filter(i => f[i] === 'again').length;
    const miss = ses.q.filter((id, k) => ses.q.indexOf(id) === k && f[id] && f[id] !== 'good');
    const head = miss.length === 0 ? '¡Todas a la primera!' : ok >= miss.length ? 'Buen repaso' : 'Repaso hecho';
    app.innerHTML =
      '<div class="view"><div class="scroll"><div class="done wrap">' +
      '<div><h2>' + esc(ses.title) + '</h2><h1>' + head + '</h1></div>' +
      '<div class="tiles"><div class="tile ok"><b>' + ok + '</b><span>me las sé</span></div><div class="tile mid"><b>' + mid + '</b><span>dudé</span></div><div class="tile bad"><b>' + bad + '</b><span>otra vez</span></div></div>' +
      (miss.length ? '<button class="btn" id="redo">' + (miss.length === 1 ? 'Repasar la que no sabía' : 'Repasar las ' + miss.length + ' que no sabía') + '</button>' : '') +
      '<button class="btn ghost" id="home">Volver al inicio</button>' +
      (miss.length ? '<div class="miss"><h2>Para repasar</h2><ul>' + miss.map(id => '<li>' + inline(BY_ID.get(id).q) + '</li>').join('') + '</ul></div>' : '') +
      '</div></div></div>';
    const r = document.getElementById('redo');
    if (r) r.onclick = () => startSession(miss, 'Repaso de las que no sabía');
    document.getElementById('home').onclick = () => { ses = null; view = 'home'; render(); };
  }

  // ---------- lista ----------
  function renderList() {
    const cards = pool();
    let html = '', lastUd = null, lastTema = null;
    for (const c of cards) {
      if (c.ud !== lastUd || c.tema !== lastTema) {
        html += '<h3 class="u' + c.ud + '"><span class="udtag">UD' + c.ud + '</span>' + esc(c.tema) + '</h3>';
        lastUd = c.ud; lastTema = c.tema;
      }
      const st = status(c.id);
      html += '<button class="item u' + c.ud + '" data-id="' + esc(c.id) + '"><span class="iq"><span><span class="st-dot s-' + st + '"></span>' + inline(c.q) + '</span>' +
        '<em>' + (c.serie && c.total > 1 ? c.n + '/' + c.total : '') + (c.imp === 1 ? ' ★' : '') + '</em></span>' +
        '<span class="ia"><span class="ans">' + fmt(c.a) + (c.code ? '<pre>' + esc(c.code) + '</pre>' : '') + '</span></span></button>';
    }

      '<div class="view"><div class="listbar wrap"><button class="icon-btn" id="lback" aria-label="Volver">' + ICON.back + '</button>' +
      '<h2>' + esc(describe()) + ' · ' + cards.length + '</h2>' +
      '<button class="link" id="hideA">' + (P.hideA ? 'Mostrar respuestas' : 'Ocultar respuestas') + '</button></div>' +
      '<div class="scroll"><div class="list wrap' + (P.hideA ? ' hide-a' : '') + '" id="listbox">' + html + '</div></div></div>';
    document.getElementById('lback').onclick = () => { view = 'home'; render(); };
    document.getElementById('hideA').onclick = () => { P.hideA = !P.hideA; savePrefs(); keepScroll(renderList); };
    app.querySelectorAll('.item').forEach(b => b.onclick = () => { if (P.hideA) b.classList.toggle('open'); });
  }

  // ================= PREGÚNTALE =================
  // La app pregunta a Claude con la cuenta de quien la abre (capacidad «sample»). Cada llamada es independiente:
  // con la pregunta van las instrucciones, lo que el alumno tiene delante (ficha o pregunta del test), las últimas
  // preguntas de la conversación y los pasajes del temario y las fichas que más se parecen a la pregunta (BM25).
  // El alumno solo quiere la respuesta: nada de citar unidad, diapositiva, página ni ficha.
  let AI; // undefined: aún no se sabe · null: no disponible · función: sample
  let AI_TIERS = null;
  let AI_IMG = null;     // límites de imágenes si esta vista puede mandar fotos ({maxCount, maxInputBytes, mediaTypes})
  let AI_TOOLS = false;  // si Claude puede llamar a funciones de la página (para buscar en el temario lo que ve en la foto)
  async function initAI() {
    if (!(window.claude && typeof window.claude.use === 'function')) { AI = null; return; }
    try { AI = await window.claude.use('sample'); } catch (e) { AI = null; }
    if (!AI) return;
    try {
      const l = await AI.limits();
      AI_TIERS = (l && Array.isArray(l.modelTiers)) ? l.modelTiers : null;
      AI_IMG = l && l.images && l.images.maxCount > 0 ? l.images : null;
      AI_TOOLS = !!(l && l.tools && l.tools.maxCount > 0);
    } catch (e) { /* sin límites: se asumen los modelos de siempre, sin fotos */ }
    refreshAskEntries();
    if (view === 'ask' && ask) renderAsk();
  }
  function refreshAskEntries() {
    if (view === 'home') keepScroll(renderHome);
    else if (view === 'study' && ses && ses.flipped) { const old = app.querySelector('.actions'); if (old) { old.outerHTML = actionsHTML(); bindActions(); } }
    else if (view === 'quiz' && tses) keepStage(renderQuiz);
    else if (view === 'qdone' && tses && tses.res) keepScroll(renderQDone);
  }
  const tierOk = t => !AI_TIERS || AI_TIERS.includes(t);

  // ---------- búsqueda en el temario ----------
  const STOP = new Set(('a al algo algun alguna ante antes asi como con contra cual cuales cuando de del desde donde dos e el ella ellas ellos en entre era eres es esa ese eso esta estas este esto estos fue ha han hay la las le les lo los mas me mi mis mucho muy ni no nos o otra otro otros para pero poco por porque pues que quien se sea segun ser si sin sobre son su sus tal tambien tanto te tiene tienen todo todos tu un una uno unos unas y ya yo hace hacer puede pueden cada mismo misma ' +
    'explica explicame explicamelo dime dame pon ponme cuentame significa quiere decir sirve usa usar utiliza').split(' '));
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function stem(w) { if (w.length > 4) w = w.replace(/(es|s)$/, ''); if (w.length > 4) w = w.replace(/[aeo]$/, ''); return w.slice(0, 7); }
  function toks(s) { const out = []; for (const w of norm(s).split(/[^a-z0-9]+/)) if (w.length > 1 && !STOP.has(w)) out.push(stem(w)); return out; }
  function mkIndex(items, textOf) {
    const docs = items.map(it => { const tf = new Map(), ts = toks(textOf(it)); for (const t of ts) tf.set(t, (tf.get(t) || 0) + 1); return { tf, len: ts.length }; });
    const df = new Map(); for (const d of docs) for (const t of d.tf.keys()) df.set(t, (df.get(t) || 0) + 1);
    return { docs, df, N: docs.length, avg: docs.reduce((a, d) => a + d.len, 0) / Math.max(1, docs.length) };
  }
  function bm25(ix, q) {
    const out = new Float64Array(ix.N), k1 = 1.2, b = 0.75;
    for (const [t, w] of q) {
      const df = ix.df.get(t); if (!df) continue;
      const idf = Math.log(1 + (ix.N - df + 0.5) / (df + 0.5));
      ix.docs.forEach((d, i) => { const f = d.tf.get(t); if (f) out[i] += w * idf * f * (k1 + 1) / (f + k1 * (1 - b + b * d.len / ix.avg)); });
    }
    return out;
  }
  let IX = null;
  const ixs = () => IX || (IX = { d: mkIndex(DOCS, d => d.t + ' ' + d.t + ' ' + d.x), c: mkIndex(CARDS, c => c.q + ' ' + c.q + ' ' + c.tema + ' ' + c.a + ' ' + (c.code || '')) });
  const best = (sc, n) => [...sc.keys()].filter(i => sc[i] > 0).sort((a, b) => sc[b] - sc[a]).slice(0, n);
  // Pasajes que cita una ficha o pregunta («S4 diap. 6; Unidad 4», «Cap. 2 p. 15 y 26», «Guía Haskell p. 1–2»).
  function srcDocs(src) {
    const out = [];
    for (const piece of String(src || '').split(';')) {
      const m = piece.trim().match(/^(.*?)\s*(diap\.|p\.)\s*(.+)$/); if (!m) continue;
      for (const r of m[3].matchAll(/(\d+)(?:\s*[–-]\s*(\d+))?/g)) {
        const a = +r[1], z = r[2] ? Math.min(+r[2], a + 3) : a;
        for (let k = a; k <= z; k++) for (const d of DOCS) if (d.s === m[1].trim() + ' ' + m[2] + ' ' + k && !out.includes(d)) out.push(d);
      }
    }
    return out.slice(0, 4);
  }
  function ctxItems(c) {
    if (!c) return { card: null, q: null };
    if (c.kind === 'card') return { card: BY_ID.get(c.id) || null, q: null };
    const q = Q_BY.get(c.id) || null;
    return { q, card: q && q.ficha ? BY_ID.get(q.ficha) || null : null };
  }
  function gather(question, deep, prevQ) {
    const ix = ixs(), { card, q } = ctxItems(ask.ctx);
    const qm = new Map(), add = (s, w) => { for (const t of toks(s)) qm.set(t, Math.max(qm.get(t) || 0, w)); };
    // «Ponme un ejemplo», «¿Por qué es la B?»…: con preguntas genéricas manda lo que el alumno tiene delante.
    const generic = (q || card) && (ask.sugs.includes(question) || toks(question).length <= 2);
    if (q) add(q.q + ' ' + q.ops[0] + ' ' + q.why, generic ? 1 : .5);
    if (card) add(card.q + ' ' + card.a, generic ? 1 : .5);
    if (prevQ) add(prevQ, .4);
    add(question, generic ? .3 : 1);
    const sd = bm25(ix.d, qm), sc = bm25(ix.c, qm);
    const um = norm(question).match(/\b(?:ud|unidad|tema)\s*([1-5])\b/), ud = um ? +um[1] : null;
    if (ud) {
      DOCS.forEach((d, i) => { if (d.u === ud) sd[i] = sd[i] * 1.6 + .4; });
      CARDS.forEach((x, i) => { if (x.ud === ud) sc[i] = sc[i] * 1.6 + (x.imp === 1 ? .8 : .2); });
    }
    const cards = []; const addC = x => { if (x && !cards.includes(x)) cards.push(x); };
    addC(card); for (const i of best(sc, deep ? 10 : 6)) addC(CARDS[i]);
    const docs = [], maxLen = deep ? 15000 : 7500, nDocs = deep ? 10 : 6; let len = 0;
    const addD = d => { if (!docs.includes(d) && len + d.x.length <= maxLen && docs.length < nDocs) { docs.push(d); len += d.x.length; } };
    for (const d of srcDocs(q ? q.src : card ? card.src : '')) addD(d);
    if (q && card) for (const d of srcDocs(card.src)) addD(d);
    for (const i of best(sd, nDocs + 6)) addD(DOCS[i]);
    return { cards, docs };
  }

  // ---------- lo que se manda a Claude ----------
  // Las fichas dicen a veces «según las diapositivas» o «según el resumen»: fuera, para que Claude no lo repita.
  function clean(s) {
    const t = String(s).replace(/,?\s*\b[Ss]eg[uú]n (?:las diapositivas|el libro|el resumen|la guía(?: de \w+)?|la clase|el profesor|el temario)\b[,:]?\s*/g, ' ')
      .replace(/\s+([?.,:])/g, '$1').replace(/\s{2,}/g, ' ').trim();
    return t.replace(/^(¿?)([a-záéíóú])/, (m, a, b) => a + b.toUpperCase());
  }
  const RULES = 'Eres el profesor particular de la asignatura «Paradigmas de la Programación» (UDIMA, Grado en Ingeniería Informática). ' +
    'El alumno prepara el examen, tipo test y sobre todo de teoría: introducción a los paradigmas, paradigma funcional (cálculo lambda, Lisp, Hope, Haskell) y paradigma lógico (Prolog).\n\n' +
    'Cómo respondes:\n' +
    '- Solo la respuesta, en español, directa y breve: de 2 a 6 frases o viñetas. Empieza por lo que te pregunta, sin saludos, sin introducciones y sin repetir la pregunta.\n' +
    '- No digas nunca de qué unidad, tema, diapositiva, página, ficha o documento sale algo, ni hables del «material» o del «contexto»: responde como si lo supieras de memoria.\n' +
    '- Básate en el MATERIAL DEL TEMARIO que acompaña a cada pregunta y usa sus términos exactos, que son los del examen. Pon en **negrita** los términos clave (de 1 a 3).\n' +
    '- Si el temario no trata lo que pregunta, dilo en una frase («Esto no está en el temario.») y, si ayuda, añade una explicación general muy breve.\n' +
    '- Si el temario se contradice (fechas, número de características…), da las dos versiones en una sola frase.\n' +
    '- Si pide un ejemplo o código, pon uno corto en un bloque ``` con la sintaxis que usa el temario (Lisp, Hope, Haskell o Prolog).';
  const DEEP = '\n\n(Responde a fondo: explica el porqué y añade un ejemplo si ayuda, en 8–14 frases o viñetas. Sigue sin decir de dónde sale nada.)';
  function ctxBlock(c) {
    const { card, q } = ctxItems(c);
    if (c && c.kind === 'card' && card) return 'El alumno está repasando esta ficha y te pregunta sobre ella:\nFicha: ' + clean(card.q) + '\nRespuesta de la ficha: ' + card.a + (card.code ? '\n```\n' + card.code + '\n```' : '');
    if (!q) return '';
    const ops = c.perm.map((orig, k) => LETTERS[k] + ') ' + q.ops[orig]).join('\n');
    const his = c.ans === undefined || c.ans === -1 ? 'la dejó en blanco' : 'marcó la ' + LETTERS[c.ans] + (c.perm[c.ans] === 0 ? ' (acertó)' : ' (falló)');
    return 'El alumno está con esta pregunta tipo test y te pregunta sobre ella:\n' + clean(q.q) + (q.code ? '\n```\n' + q.code + '\n```' : '') + '\n' + ops +
      '\nCorrecta: la ' + LETTERS[c.perm.indexOf(0)] + '. El alumno ' + his + '.\nExplicación oficial: ' + q.why;
  }
  function materialText(r) {
    return r.cards.map(x => '• ' + clean(x.q) + ' → ' + x.a.replace(/\n+/g, ' ') + (x.code ? '\n```\n' + x.code + '\n```' : '')).join('\n') +
      (r.docs.length ? '\n\n' + r.docs.map(d => '--- ' + (d.t || 'Temario') + '\n' + d.x).join('\n\n') : '');
  }
  const PHOTO = 'FOTO: el alumno adjunta una foto (puede ser un ejercicio, una pregunta de examen, una diapositiva, sus apuntes o código). ' +
    'Léela con atención y responde a lo que pregunta; si no ha escrito nada, resuelve o explica lo que se ve. Si es una pregunta tipo test, empieza por la opción correcta y por qué. ' +
    'Si la foto no se lee bien o no tiene que ver con la asignatura, dilo en una frase.';
  const PHOTO_AGAIN = 'FOTO: va adjunta otra vez la foto que el alumno mandó antes en esta conversación, por si su pregunta se refiere a ella.';
  const TOOL_HINT = ' Antes de responder, usa una vez la herramienta buscar_temario con los términos clave de lo que se ve en la foto; no escribas nada antes de usarla.';
  // img: null | 'new' (foto de esta pregunta) | 'again' (la última foto de la conversación, reenviada)
  function buildInput(ex, deep, img, tools) {
    const done = ask.ex.slice(0, ask.ex.indexOf(ex)).filter(x => x.st === 'ok' && x.a.trim()).slice(-3);
    const turns = [{ role: 'user', content: RULES }];
    for (const x of done) {
      turns.push({ role: 'user', content: (x.q || '¿Qué me dices de esta foto?') + (x.img ? ' [adjuntó una foto]' : '') });
      turns.push({ role: 'assistant', content: x.a.length > 1500 ? x.a.slice(0, 1500) + '…' : x.a });
    }
    const cb = ctxBlock(ask.ctx);
    // Sin texto (solo foto) y con herramienta, el material lo pide Claude al ver la foto.
    const mat = toks(ex.q).length || ask.ctx || !tools ? materialText(gather(ex.q, deep, done.length ? done[done.length - 1].q : '')) : '';
    let last = (cb ? cb + '\n\n' : '') + (mat.trim() ? 'MATERIAL DEL TEMARIO (no lo menciones ni lo cites):\n' + mat + '\n\n' : '');
    if (img) last += (img === 'again' ? PHOTO_AGAIN : PHOTO + (tools ? TOOL_HINT : '')) + '\n\n';
    last += 'PREGUNTA DEL ALUMNO: ' + (ex.q || '(no ha escrito nada: responde a lo que se ve en la foto)') + (deep ? DEEP : '');
    turns.push({ role: 'user', content: last });
    return turns;
  }

  // ---------- estado y errores ----------
  let ask = null; // { ctx, ex: [{q, a, st: wait|stream|ok|stop|err, deep, err, code, cut}], busy, ctl, draft, sugs, from }
  const ERR = {
    not_granted: 'No has dado permiso para que la app pregunte a Claude. Puedes darlo en el menú Permisos del artifact o al volver a abrirlo.',
    sampling_disabled: 'Claude no está disponible para tu cuenta desde aquí.',
    capability_disabled: 'Desde esta vista no se puede preguntar a Claude.',
    not_declared: 'Esta versión de la app no puede preguntar a Claude.',
    capability_removed: 'Esta versión de la app no puede preguntar a Claude.',
    rate_limited: 'Has llegado al límite de uso de tu plan o van muchas seguidas. Prueba dentro de un rato.',
    session_expired: 'Tu sesión de Claude ha caducado: vuelve a iniciar sesión.',
    refused: 'Claude no ha contestado a eso. Prueba a preguntarlo de otra forma.',
    prompt_too_large: 'La pregunta es demasiado larga: acórtala.',
    empty_completion: 'No ha llegado respuesta. Prueba a reformularla.',
    upstream_error: 'Se ha cortado la conexión.',
    image_rejected: 'Esa foto no se ha podido usar. Prueba a hacerla de nuevo o elige otra.',
    images_unavailable: 'Desde aquí no se pueden mandar fotos; escribe la pregunta.',
  };
  const HIDE = new Set(['not_granted', 'sampling_disabled', 'capability_disabled', 'not_declared', 'capability_removed']);
  const RETRY = new Set(['upstream_error', 'rate_limited', 'empty_completion']);
  function sugsFor(c) {
    if (c && c.kind === 'card') return ['Explícamelo con otras palabras', 'Ponme un ejemplo', '¿Con qué se suele confundir?', '¿Cómo me lo pueden preguntar en el test?'];
    if (c && c.kind === 'q') {
      const failed = c.ans !== undefined && c.ans !== -1 && c.perm[c.ans] !== 0;
      return ['¿Por qué es la ' + LETTERS[c.perm.indexOf(0)] + '?', ...(failed ? ['¿Por qué no es la ' + LETTERS[c.ans] + '?'] : []), 'Explícame cada opción', 'Ponme otra pregunta parecida'];
    }
    return shuffle(CARDS.filter(x => x.imp === 1 && !x.serie && x.q.length <= 80 && /^¿.*\?$/.test(x.q) && !/\b(diap|ficha|fuente)/i.test(x.q))).slice(0, 4).map(x => clean(x.q));
  }
  const sameCtx = (a, b) => (!a && !b) || (!!a && !!b && a.kind === b.kind && a.id === b.id);
  function openAsk(ctx) {
    if (!AI) return;
    const sc = app.querySelector('.stage') || app.querySelector('.scroll');
    const from = { view, y: sc ? sc.scrollTop : 0 };
    if (!ask || !sameCtx(ask.ctx, ctx)) ask = { ctx, ex: [], busy: false, ctl: null, draft: '', sugs: sugsFor(ctx) };
    else if (ctx) ask.ctx = ctx; // misma pregunta, quizá con la respuesta del alumno ya puesta
    ask.from = from; view = 'ask'; render();
    const box = document.getElementById('askbox');
    let fine = false; try { fine = matchMedia('(pointer: fine)').matches; } catch (e) { /* sin media queries */ }
    if (box && fine) box.focus();
  }
  function closeAsk() {
    if (!ask) { view = 'home'; render(); return; }
    const f = ask.from || { view: 'home', y: 0 };
    view = f.view === 'ask' ? 'home' : f.view; render();
    const sc = app.querySelector('.stage') || app.querySelector('.scroll'); if (sc) sc.scrollTop = f.y;
  }

  // ---------- respuesta en Markdown sencillo (sin HTML de Claude: todo se escapa) ----------
  function inlineA(s) {
    return String(s).split('`').map((part, i) => i % 2
      ? '<code>' + esc(part) + '</code>'
      : esc(part).replace(/\*\*([^*]+)\*\*/g, '<mark>$1</mark>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  }
  function md(s) {
    let html = '', list = null, code = null;
    const close = () => { if (list) { html += '</' + list + '>'; list = null; } };
    for (const raw of String(s || '').replace(/\r/g, '').split('\n')) {
      if (code) { if (/^\s*```/.test(raw)) { html += '<pre>' + esc(code.join('\n')) + '</pre>'; code = null; } else code.push(raw); continue; }
      if (/^\s*```/.test(raw)) { close(); code = []; continue; }
      const l = raw.trim(); if (!l) { close(); continue; }
      let m;
      if ((m = l.match(/^[-•*]\s+(.*)$/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += '<li>' + inlineA(m[1]) + '</li>'; continue; }
      if ((m = l.match(/^\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += '<li>' + inlineA(m[1]) + '</li>'; continue; }
      close();
      if ((m = l.match(/^#{1,4}\s+(.*)$/))) { html += '<p class="mh">' + inlineA(m[1].replace(/\*\*/g, '')) + '</p>'; continue; }
      html += '<p>' + inlineA(l) + '</p>';
    }
    close();
    if (code) html += '<pre>' + esc(code.join('\n')) + '</pre>';
    return html;
  }

  // ---------- pantalla ----------
  // La conversación se pinta por partes (lista de mensajes y botones) sin tocar la caja de texto ni el desplazamiento:
  // redibujarlo todo devolvía el scroll arriba del todo y, en el iPhone, cerraba el teclado de golpe.
  const thinkHTML = x => '<p class="think" role="status"><i></i><i></i><i></i>' + (x.st === 'search' ? 'Buscando en el temario…' : x.img ? 'Mirando la foto…' : 'Pensando…') + '</p>';
  function exHTML(x, i) {
    const act = i === ask.ex.length - 1 && AI && !ask.busy; // los botones, solo en la última respuesta
    const body = x.a ? md(x.a) : ['wait', 'search', 'stream'].includes(x.st) ? thinkHTML(x) : '';
    const user = x.prev ? '<div class="msg-u has-img"><canvas class="msg-img" data-img="' + i + '" role="img" aria-label="Tu foto"></canvas>' + (x.q ? '<span>' + esc(x.q) + '</span>' : '') + '</div>'
      : '<div class="msg-u">' + esc(x.q) + '</div>';
    let foot = '';
    if (x.st === 'err') foot += '<p class="msg-err">' + esc(x.err) + '</p>' + (act && RETRY.has(x.code) ? '<button class="asklink" data-retry="' + i + '">Reintentar</button>' : '');
    if (x.st === 'stop') foot += '<span>Detenida</span>' + (act ? '<button class="asklink" data-retry="' + i + '">Volver a preguntar</button>' : '');
    if (x.st === 'ok' && x.cut) foot += '<span>Se cortó por larga</span>';
    if (x.st === 'ok' && !x.deep && act) foot += '<button class="asklink" data-deep="' + i + '">Más a fondo</button>';
    if (x.st === 'ok' && x.deep) foot += '<span>Respuesta a fondo</span>';
    return '<div class="exch">' + user + '<div class="msg-a" data-i="' + i + '">' + body + '</div>' + (foot ? '<div class="msg-foot">' + foot + '</div>' : '') + '</div>';
  }
  function ctxHTML(c) {
    const { card, q } = ctxItems(c);
    if (c && c.kind === 'card' && card) return '<div class="ctx u' + card.ud + '"><span>Sobre esta ficha</span><p>' + inline(clean(card.q)) + '</p></div>';
    if (q) { const t = clean(q.q); return '<div class="ctx u' + q.ud + '"><span>Sobre esta pregunta</span><p>' + inline(t.length > 160 ? t.slice(0, 157) + '…' : t) + '</p>' + codeHTML(q.code) + '</div>'; }
    return '';
  }
  function renderAsk() {
    const a = ask;
    app.innerHTML =
      '<div class="view">' +
      '<div class="askbar wrap"><button class="icon-btn" id="askback" aria-label="Volver">' + ICON.back + '</button>' +
      '<p class="ttl">Pregúntale al temario</p><span id="asknewslot"></span></div>' +
      '<div class="scroll" id="chatsc"><div class="chat wrap" id="chat"></div></div>' +
      '<div class="composer wrap' + (AI_IMG ? ' has-photo' : '') + '"><div class="att" id="attrow" hidden></div>' +
      (AI_IMG ? '<button class="clip" id="askphoto" aria-label="Añadir una foto">' + ICON.camera + '</button><input type="file" id="askfile" accept="image/*" capture="environment" hidden>' : '') +
      '<textarea id="askbox" rows="1" aria-label="Tu pregunta" enterkeyhint="send"></textarea><span id="sendslot"></span></div></div>';
    const box = document.getElementById('askbox');
    box.value = a.draft || '';
    const ph = document.getElementById('askphoto'), file = document.getElementById('askfile');
    if (ph && file) {
      ph.onclick = () => file.click();
      file.addEventListener('change', async () => {
        const f = file.files && file.files[0]; file.value = ''; if (!f) return;
        a.att = { busy: true }; paintAtt();
        let p = null;
        try { p = await loadPhoto(f); } catch (e) { p = null; }
        if (ask !== a) return;
        if (!p) { a.att = { err: 'No he podido abrir la foto. Prueba a hacerla otra vez.' }; if (view === 'ask') paintAtt(); return; }
        a.att = p;
        if (view !== 'ask') return;
        // Se envía sola nada más hacerla, con lo que hubiera escrito en la caja como pregunta.
        if (AI && !a.busy) submitAsk(); else paintAtt();
      });
    }
    box.addEventListener('input', () => { a.draft = box.value; growBox(); });
    box.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submitAsk(); } });
    box.addEventListener('blur', unshift);
    document.getElementById('askback').onclick = closeAsk;
    paintChat(); paintControls(); paintAtt();
    if (a.ex.length) pinLast(); // al volver a una conversación, su última pregunta arriba
  }

  // ---------- fotos ----------
  // Se reducen a 1600 px y se pasan a JPEG en la página (también las HEIC del iPhone): suben antes y gastan menos.
  async function loadPhoto(file) {
    let src = null;
    try { src = await createImageBitmap(file); } catch (e) { src = null; }
    if (!src) src = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = fr.result; };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
    const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
    if (!w0 || !h0) throw new Error('imagen vacía');
    const k = Math.min(1, 1600 / Math.max(w0, h0)), w = Math.round(w0 * k), h = Math.round(h0 * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(src, 0, 0, w, h);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
    const kp = Math.min(1, 480 / Math.max(w, h)), prev = document.createElement('canvas');
    prev.width = Math.round(w * kp); prev.height = Math.round(h * kp);
    prev.getContext('2d').drawImage(cv, 0, 0, prev.width, prev.height);
    if (src.close) try { src.close(); } catch (e) { /* nada */ }
    return { blob: blob || file, prev };
  }
  function paintAtt() {
    const row = document.getElementById('attrow'); if (!row || !ask) return;
    const at = ask.att;
    if (!at) { row.hidden = true; row.innerHTML = ''; growBox(); return; }
    row.hidden = false; row.className = 'att' + (at.busy ? ' busy' : '');
    row.innerHTML = (at.prev ? '<canvas width="112" height="112"></canvas>' : '') +
      '<span>' + (at.busy ? 'Preparando la foto' : at.err ? esc(at.err) : 'Foto lista. Escribe qué quieres saber o envíala tal cual.') + '</span>' +
      (at.busy ? '' : '<button id="attx">Quitar</button>');
    const cv = row.querySelector('canvas');
    if (cv && at.prev) { const s = Math.min(at.prev.width, at.prev.height); cv.getContext('2d').drawImage(at.prev, (at.prev.width - s) / 2, (at.prev.height - s) / 2, s, s, 0, 0, 112, 112); }
    const bx = document.getElementById('attx'); if (bx) bx.onclick = () => { ask.att = null; paintAtt(); };
    growBox();
  }
  function takeAtt() { const at = ask && ask.att && ask.att.blob ? ask.att : null; if (at) { ask.att = null; paintAtt(); } return at; }
  function paintChat() {
    const chat = document.getElementById('chat'), sc = document.getElementById('chatsc'); if (!chat || !sc || !ask) return;
    const a = ask, y = sc.scrollTop;
    const intro = a.ex.length ? '' : '<p class="ask-intro">' + (a.ctx ? 'Pregunta lo que no te quede claro o toca una sugerencia.'
      : AI_IMG ? 'Escribe cualquier duda del temario, haz una foto (un ejercicio, una pregunta, tus apuntes…) o toca una sugerencia. La foto se envía sola; si antes escribes algo, va como pregunta.' : 'Escribe cualquier duda del temario o toca una sugerencia.') + '</p>' +
      '<div class="sugs">' + a.sugs.map((t, k) => '<button class="sug" data-sug="' + k + '">' + inlineA(t) + '</button>').join('') + '</div>';
    chat.innerHTML = ctxHTML(a.ctx) + intro + a.ex.map(exHTML).join('');
    chat.querySelectorAll('canvas[data-img]').forEach(c => {
      const x = a.ex[+c.dataset.img]; if (!x || !x.prev) return;
      c.width = x.prev.width; c.height = x.prev.height; c.getContext('2d').drawImage(x.prev, 0, 0);
    });
    fitLast();
    sc.scrollTop = y; // pintar no mueve lo que estás leyendo
    chat.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => sendAsk(a.sugs[+b.dataset.sug], takeAtt()));
    chat.querySelectorAll('[data-deep]').forEach(b => b.onclick = () => runAsk(a.ex[+b.dataset.deep], true));
    chat.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => { const x = a.ex[+b.dataset.retry]; runAsk(x, x.deep); });
  }
  function paintControls() {
    if (view !== 'ask' || !ask) return;
    const a = ask, box = document.getElementById('askbox'), slot = document.getElementById('sendslot'), ns = document.getElementById('asknewslot');
    if (box) box.disabled = !AI;
    const ph = document.getElementById('askphoto');
    if (ph) { ph.hidden = !AI_IMG; ph.disabled = !AI || a.busy; ph.parentNode.classList.toggle('has-photo', !!AI_IMG); }
    if (slot) {
      slot.innerHTML = a.busy ? '<button class="send" id="askstop" aria-label="Detener">' + ICON.stop + '</button>'
        : '<button class="send" id="asksend" aria-label="Enviar">' + ICON.send + '</button>';
      const st = document.getElementById('askstop'); if (st) st.onclick = () => { if (a.ctl) a.ctl.abort(); };
      const sb = document.getElementById('asksend'); if (sb) sb.onclick = submitAsk;
    }
    if (ns) {
      ns.innerHTML = a.ex.length && !a.busy ? '<button class="link" id="asknew">Nueva</button>' : '';
      const nw = document.getElementById('asknew');
      if (nw) nw.onclick = () => { ask = { ctx: a.ctx, ex: [], busy: false, ctl: null, draft: (box && box.value) || '', sugs: sugsFor(a.ctx), from: a.from }; renderAsk(); };
    }
    growBox();
  }
  function growBox() {
    const box = document.getElementById('askbox'); if (!box) return;
    const att = !!(ask && ask.att && ask.att.blob);
    box.placeholder = !AI ? 'No disponible' : att ? 'Tu pregunta (opcional)…' : 'Escribe tu duda…';
    box.style.height = 'auto'; box.style.height = Math.min(140, box.scrollHeight + 3) + 'px';
    const sb = document.getElementById('asksend'); if (sb) sb.disabled = !(box.value.trim() || att) || !AI;
  }
  // La última pregunta tiene sitio para subir hasta arriba aunque su respuesta sea corta: se lee desde el
  // principio mientras se escribe debajo, y nada salta al terminar.
  function fitLast() {
    const sc = document.getElementById('chatsc'); if (!sc) return;
    const all = sc.querySelectorAll('.exch'); all.forEach(e => { e.style.minHeight = ''; });
    if (all.length) all[all.length - 1].style.minHeight = Math.max(0, sc.clientHeight - 30) + 'px';
  }
  function pinLast() {
    const sc = document.getElementById('chatsc'), all = sc ? sc.querySelectorAll('.exch') : [];
    if (!all.length) return;
    sc.scrollTop += all[all.length - 1].getBoundingClientRect().top - sc.getBoundingClientRect().top - 8;
  }
  // iOS deja a veces la página desplazada hacia arriba al cerrarse el teclado: se recoloca.
  function unshift() {
    setTimeout(() => {
      if (document.activeElement && document.activeElement.id === 'askbox') return;
      try { window.scrollTo(0, 0); if (document.scrollingElement) document.scrollingElement.scrollTop = 0; } catch (e) { /* nada */ }
      if (view === 'ask') fitLast();
    }, 80);
  }
  const onResize = () => { if (view === 'ask') fitLast(); };
  window.addEventListener('resize', onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
  function paintEx(x) {
    if (view !== 'ask' || !ask || !ask.ex.includes(x)) return;
    const el = app.querySelector('.msg-a[data-i="' + ask.ex.indexOf(x) + '"]'); if (el) el.innerHTML = x.a ? md(x.a) : thinkHTML(x);
  }
  const coarse = () => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } };
  function submitAsk() {
    const box = document.getElementById('askbox'); if (!box || !ask) return;
    const t = box.value.trim(), has = !!(ask.att && ask.att.blob);
    if ((!t && !has) || !AI || ask.busy) return;
    ask.draft = ''; box.value = '';
    const at = takeAtt(); growBox();
    if (coarse()) box.blur(); // en el móvil se cierra el teclado para leer la respuesta a pantalla completa
    sendAsk(t, at);
  }
  function sendAsk(text, at) {
    if (!AI || !ask || ask.busy) return;
    const x = { q: String(text || '').slice(0, 2000), a: '', st: 'wait', deep: false };
    if (at) { x.img = at.blob; x.prev = at.prev; }
    ask.ex.push(x); runAsk(x, false);
  }
  let NO_TOOLS = false;
  async function runAsk(x, deep) {
    if (!AI || !ask || ask.busy) return;
    const mine = ask, tier = deep || !tierOk('quick') ? 'default' : 'quick';
    // Foto: la de esta pregunta o, si no trae, la última de la conversación (Claude no recuerda las de antes).
    const prevImg = x.img ? null : mine.ex.slice(0, mine.ex.indexOf(x)).reverse().find(e => e.img);
    const blob = AI_IMG ? (x.img || (prevImg && prevImg.img) || null) : null;
    const img = blob ? (x.img ? 'new' : 'again') : null;
    const tools = img === 'new' && AI_TOOLS && !NO_TOOLS;
    Object.assign(x, { a: '', st: 'wait', deep: !!deep, err: '', code: '', cut: false });
    const ctl = new AbortController(); mine.ctl = ctl; mine.busy = true;
    if (view === 'ask' && ask === mine) { paintChat(); paintControls(); pinLast(); } // sin animación: una respuesta rápida la cortaba a medias
    // Con herramienta, lo que Claude escriba antes de buscar (si escribe algo) no se enseña: solo la respuesta.
    let raw = '', pre = 0;
    const opts = { modelTier: tier, signal: ctl.signal, onText: u => {
      raw = u.text; x.a = raw.slice(pre).replace(/^\s+/, '');
      if (x.a && x.st !== 'stream') x.st = 'stream';
      paintEx(x);
    } };
    if (tier !== 'quick') opts.effort = 'low';
    if (blob) opts.images = [blob];
    if (tools) opts.tools = [{
      name: 'buscar_temario',
      description: 'Busca en el temario de la asignatura (diapositivas, libro, guías y fichas del alumno) y devuelve los fragmentos más relacionados. Úsala una vez, con los términos clave de lo que se ve en la foto, antes de responder.',
      inputSchema: { type: 'object', properties: { consulta: { type: 'string', description: 'Términos clave en español, p. ej. «corte prolog backtracking» o «evaluación perezosa haskell».' } }, required: ['consulta'] },
      execute: inp => {
        pre = raw.length; x.a = ''; x.st = 'search'; paintEx(x);
        const t = materialText(gather(String((inp && inp.consulta) || '').slice(0, 300), deep, ''));
        return t.trim() ? t : 'No hay nada en el temario sobre eso.';
      },
    }];
    try {
      const r = await AI(buildInput(x, !!deep, img, tools), opts);
      x.a = r.text.slice(pre).trim(); x.st = 'ok'; x.cut = !!r.truncated;
    } catch (e) {
      const code = e && ERR[e.code] ? e.code : (e && e.code === 'cancelled' ? 'cancelled' : e && e.code === 'tools_unavailable' ? 'tools_unavailable' : 'upstream_error');
      if (code === 'tools_unavailable' && !NO_TOOLS) { NO_TOOLS = true; mine.busy = false; mine.ctl = null; return runAsk(x, deep); } // una sola vez: sin herramienta
      x.a = code === 'refused' ? '' : ((e && e.text) || '').slice(pre).trim();
      if (code === 'cancelled') x.st = 'stop';
      else {
        x.st = 'err'; x.code = code; x.err = ERR[code] || ERR.upstream_error;
        if (HIDE.has(code)) AI = null;
        if (code === 'images_unavailable') AI_IMG = null;
      }
    }
    mine.busy = false; mine.ctl = null;
    if (view === 'ask' && ask === mine) { paintChat(); paintControls(); }
  }

  // ---------- arranque (conserva la sesión si la página se actualiza mientras estudias) ----------
  function boot(data) {
    if (isObj(data) && isObj(data.ses) && Array.isArray(data.ses.q) && data.ses.q.every(id => BY_ID.has(id))) {
      ses = data.ses; view = data.view === 'done' ? 'done' : 'study'; ses.flipped = false;
    }
    if (isObj(data)) {
      const ts = validSes(data.tses);
      if (ts && ['quiz', 'qconfirm', 'qdone'].includes(data.view) && (data.view !== 'qdone' || ts.res)) { tses = ts; view = data.view; }
      const ps = validSes(data.pendingSim);
      if (ps && ps.kind === 'sim' && !ps.res && !tses) pendingSim = ps;
    }
    render();
    initRemote();
    initAI();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ ses: ses, view: view, tses: tses, pendingSim: pendingSim })); } catch (e) { /* sin hot */ } }
  if (hot && typeof hot.ready === 'function') { try { hot.ready(boot); } catch (e) { boot({}); } }
  else boot((hot && hot.data) || {});
})();
</script>
