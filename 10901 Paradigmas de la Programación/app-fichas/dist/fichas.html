"total":4},{"id":"ud3-021","ud":3,"tema":"Capacidades","q":"Capacidad 3, funciones de orden superior: ¿en qué consiste?","a":"Las funciones son **ciudadanos de primera clase**: se pasan como variables o se insertan como lógica intercambiable, p. ej. una **lambda** (lógica anónima).","src":"S3 diap. 12","imp":2,"serie":"Tres capacidades","n":4,"total":4},{"id":"ud3-022","ud":3,"tema":"Capacidades","q":"Factorial: ¿cómo distingue el caso base cada lenguaje?","a":"• LISP: **condicional explícito** (if)\n• Hope: **reglas de deconstrucción** directas\n• Haskell: **enrutamiento implícito por forma**","src":"S3 diap. 9","imp":1,"code":"--- fact 0 \u003c= 1;                   ! Hope\n--- fact n \u003c= n * fact(n-1);\nfactorial 0 = 1                    -- Haskell\nfactorial n = n * factorial (n-1)"},{"id":"ud3-023","ud":3,"tema":"Capacidades","q":"Cabeza y cola de una lista: ¿cómo se separan en cada lenguaje?","a":"• LISP: funciones históricas **car** (cabeza) y **cdr** (cola)\n• Hope: operador **::** (x :: xs)\n• Haskell: operador **:** (x : xs)","src":"S3 diap. 10 y 11","imp":1,"code":"--- sumarDiez (x::xs) \u003c= (x+10) :: xs;  ! Hope\nsumarDiez (x:xs) = (x + 10) : xs       -- Haskell"},{"id":"ud3-024","ud":3,"tema":"Capacidades","q":"¿Cómo se escribe una función lambda en LISP, Hope y Haskell?","a":"• LISP: (lambda (x) (+ x 5))\n• Hope: lambda x => x+5\n• Haskell: \\x -> x + 5 (la barra invertida emula la λ)","src":"S3 diap. 13; Guía Haskell p. 2–3","imp":2,"code":"(\\base altura -> base * altura) 10 5   -- 50"},{"id":"ud3-025","ud":3,"tema":"Capacidades","q":"Map & Reduce: ¿qué ocurre con [1, 2, 3] y λx → x+5?","a":"**map** transforma: [6, 7, 8]; **reduce (+)** los combina: **21**. En LISP el map es **mapcar**; en Haskell el reduce es **foldl**.","src":"S3 diap. 13","imp":2,"code":"(reduce #'+ (mapcar (lambda (x) (+ x 5)) lista))\nreduce( +, map( lambda x => x+5, lista ) )\nfoldl (+) 0 (map (\\x -> x + 5) lista)"},{"id":"ud3-026","ud":3,"tema":"Síntesis","q":"¿Qué legado funcional aprovecha hoy el Big Data?","a":"La **inmutabilidad** de 1958 (LISP) y los **patrones** de los años 70 (Hope) garantizan la seguridad del procesamiento distribuido, p. ej. **Apache Spark**.","src":"S3 diap. 14","imp":2},{"id":"ud3-027","ud":3,"tema":"Síntesis","q":"¿Por qué map/reduce puede repartirse entre miles de servidores?","a":"Al no tener **efectos secundarios**, las evaluaciones perezosas de map/reduce se distribuyen entre nodos; **sin estado compartido** no hay colisiones.","src":"S3 diap. 14","imp":1},{"id":"ud3-028","ud":3,"tema":"Síntesis","q":"Eligiendo el dialecto funcional: ¿qué etiqueta resume cada lenguaje?","a":"• Hope: el **pionero académico**\n• LISP/Scheme: **dinámico y maleable**\n• Haskell: la **fortaleza matemática**","src":"S3 diap. 15","imp":1,"serie":"Eligiendo el dialecto funcional","n":1,"total":4},{"id":"ud3-029","ud":3,"tema":"Síntesis","q":"Hope, «el pionero académico»: ¿cómo lo describe la diapositiva?","a":"Estricto, explícito y el **inventor del encaje de patrones**. Ideal para comprender la teoría pura de **estructuras de datos**.","src":"S3 diap. 15","imp":2,"serie":"Eligiendo el dialecto funcional","n":2,"total":4},{"id":"ud3-030","ud":3,"tema":"Síntesis","q":"LISP/Scheme, «dinámico y maleable»: ¿cómo lo describe la diapositiva?","a":"**El código escribe código** (macros). El lenguaje programable supremo, impulsado por **listas**.","src":"S3 diap. 15","imp":2,"serie":"Eligiendo el dialecto funcional","n":3,"total":4},{"id":"ud3-031","ud":3,"tema":"Síntesis","q":"Haskell, «la fortaleza matemática»: ¿cómo lo describe la diapositiva?","a":"**Tipado estático seguro** y **evaluación perezosa**. Su lema: «Si compila, funciona».","src":"S3 diap. 15","imp":2,"serie":"Eligiendo el dialecto funcional","n":4,"total":4},{"id":"ud3-032","ud":3,"tema":"Síntesis","q":"Conclusión de la UD3: ¿qué nos enseña el paradigma funcional?","a":"«Más que un lenguaje, una forma de pensar»: diseñar sistemas **predecibles, inmutables y matemáticamente puros** (en Hope, LISP, Haskell o Python).","src":"S3 diap. 16","imp":2},{"id":"ud3-033","ud":3,"tema":"Haskell","q":"¿Cómo define la guía a Haskell?","a":"Lenguaje funcional **puro**, con tipado **estático fuerte e inferido** y **evaluación diferida** (perezosa). Sintaxis inspirada en el cálculo lambda y la notación matemática.","src":"Guía Haskell p. 1","imp":1},{"id":"ud3-034","ud":3,"tema":"Haskell","q":"¿Qué es la evaluación diferida o perezosa (call-by-need)?","a":"No evalúa los argumentos al invocar la función (eso hace la **ansiosa**, call-by-value): **pospone el cálculo** hasta que el resultado es estrictamente necesario.","src":"Guía Haskell p. 1","imp":1},{"id":"ud3-035","ud":3,"tema":"Haskell","q":"¿Qué ventajas da la evaluación perezosa en Haskell?","a":"• Permite **listas infinitas** sin desbordar memoria ni bucles infinitos: solo calcula lo que se pide\n• **Desacopla** la generación de datos de su consumo","src":"Guía Haskell p. 1","imp":1,"code":"enteros = [1..]                 -- lista infinita\nprimerosCinco = take 5 enteros  -- [1,2,3,4,5]"},{"id":"ud3-036","ud":3,"tema":"Haskell","q":"Haskell: ¿qué es una firma de tipo y cómo se escribe?","a":"Declara el tipo con **::** y separa argumentos y resultado con **->**. El compilador podría inferirlo, pero la convención es escribirla.","src":"Guía Haskell p. 1","imp":2,"code":"sumar :: Int -> Int -> Int\nsumar a b = a + b"},{"id":"ud3-037","ud":3,"tema":"Haskell","q":"¿Qué es la currificación (currying) en Haskell?","a":"Toda función toma formalmente **un solo argumento** a la vez y devuelve otra función hasta agotar los parámetros. Por eso la firma encadena flechas: Int -> Int -> Int.","src":"Guía Haskell p. 1 y 4","imp":1},{"id":"ud3-038","ud":3,"tema":"Haskell","q":"Trampa: ¿qué significa «::» en Hope y en Haskell?","a":"• Hope: **cons**, une cabeza y cola (x :: xs)\n• Haskell: **firma de tipo** (sumar :: Int -> Int -> Int); su cons es «:»","src":"S3 diap. 10; Guía Haskell p. 1","imp":2},{"id":"ud3-039","ud":3,"tema":"Haskell","q":"¿Cómo hace Haskell la entrada/salida sin perder la pureza?","a":"Prohíbe funciones impuras: toda E/S va **encapsulada en la mónada IO**, que modela la acción con el mundo exterior; el resto del código sigue siendo puro.","src":"Guía Haskell p. 1–2","imp":1,"code":"main :: IO ()\nmain = do\n  putStrLn \"Hola mundo desde Haskell!\"\n  print (sumar 10 5)"},{"id":"ud3-040","ud":3,"tema":"Haskell","q":"Haskell: ¿en qué se diferencian let … in y where?","a":"Ambos crean **ligaduras locales inmutables** (no hay globales mutables como defvar de LISP). let … in va antes de la expresión; where, **al final** de la función.","src":"Guía Haskell p. 2","imp":2,"code":"area1 base altura = let p = base * altura in p / 2\narea2 base altura = p / 2\n  where p = base * altura"},{"id":"ud3-041","ud":3,"tema":"Haskell","q":"Haskell: ¿qué son las guardas y a qué equivalen en LISP?","a":"Condiciones en cascada con la barra **|**; equivalen a **cond** de LISP. **otherwise** es el caso por defecto (como t en LISP).","src":"Guía Haskell p. 2","imp":2,"code":"clasificarNota nota\n  | nota >= 19 = \"Excelente\"\n  | nota >= 14 = \"Aprobado\"\n  | nota >= 11 = \"Suficiente\"\n  | otherwise  = \"Reprobado\""},{"id":"ud3-042","ud":3,"tema":"Haskell","q":"¿Cómo son las listas en Haskell?","a":"**Homogéneas** (elementos del mismo tipo), con dos constructores: **[]** (vacía; NIL en LISP, nil en Hope) y **:** (cons, añade por la cabeza).","src":"Guía Haskell p. 3","imp":2,"code":"miLista = [10, 20, 30]  -- = 10 : (20 : (30 : []))"},{"id":"ud3-043","ud":3,"tema":"Pilares en Haskell","q":"¿Cuáles son los 5 pilares del paradigma funcional en la guía de Haskell?","a":"1 Transparencia referencial y funciones puras · 2 Sin estado mutable y recursividad · 3 Orden superior · 4 Composición funcional · 5 Polimorfismo y typeclasses","src":"Guía Haskell p. 3–5","imp":1,"serie":"Pilares en Haskell","n":1,"total":6},{"id":"ud3-044","ud":3,"tema":"Pilares en Haskell","q":"Pilar 1 (transparencia referencial): ¿cómo se cumple en Haskell?","a":"Con **funciones puras**: deterministas y sin efectos secundarios, así que una llamada puede sustituirse por su valor (**razonamiento ecuacional**).","src":"Guía Haskell p. 3","imp":2,"serie":"Pilares en Haskell","n":2,"total":6,"code":"sumarPuro :: Int -> Int -> Int\nsumarPuro a b = a + b"},{"id":"ud3-045","ud":3,"tema":"Pilares en Haskell","q":"Pilar 2 (sin estado mutable): ¿cómo itera Haskell sin x = x + 1 ni bucles?","a":"Con **recursión pura** y **pattern matching**: caso base para [] y caso recursivo para (x:xs). Variante: acumulador en una función auxiliar (recursión de cola).","src":"Guía Haskell p. 3–4","imp":2,"serie":"Pilares en Haskell","n":3,"total":6,"code":"sumarLista :: [Int] -> Int\nsumarLista [] = 0\nsumarLista (x:xs) = x + sumarLista xs"},{"id":"ud3-046","ud":3,"tema":"Pilares en Haskell","q":"Pilar 3 (orden superior): ¿qué herramientas ofrece Haskell?","a":"• **Currificación**\n• **map**: transforma cada elemento\n• **filter**: deja los que cumplen un predicado\n• **foldr / foldl**: reducen la lista a un valor","src":"Guía Haskell p. 4","imp":2,"serie":"Pilares en Haskell","n":4,"total":6,"code":"map (\\x -> x * x) [1, 2, 3, 4]  -- [1,4,9,16]\nfilter even [1, 2, 3, 4, 5, 6]   -- [2,4,6]\nfoldr (+) 0 [1, 4, 9, 16]        -- 30"},{"id":"ud3-047","ud":3,"tema":"Pilares en Haskell","q":"Pilar 4 (composición): ¿cómo compone funciones Haskell?","a":"Con el operador **punto (.)**: (f ∘ g)(x) = f(g(x)). La salida de una función alimenta a la siguiente sin variables intermedias.","src":"Guía Haskell p. 4–5","imp":2,"serie":"Pilares en Haskell","n":5,"total":6,"code":"sumaCuadrados :: [Int] -> Int\nsumaCuadrados = sum . map (\\x -> x * x)\n-- sumaCuadrados [2, 3, 4] = 29"},{"id":"ud3-048","ud":3,"tema":"Pilares en Haskell","q":"Pilar 5 (polimorfismo): ¿cómo lo consigue Haskell?","a":"• **Polimorfismo paramétrico**: variables de tipo (a, b) para funciones genéricas\n• **Clases de tipos** (typeclasses): sobrecarga controlada; Eq a => exige igualdad (==)","src":"Guía Haskell p. 5","imp":1,"serie":"Pilares en Haskell","n":6,"total":6,"code":"tomarN :: Int -> [a] -> [a]\npertenece :: Eq a => a -> [a] -> Bool"},{"id":"ud3-049","ud":3,"tema":"Mónadas y equivalencias","q":"¿Qué es una mónada en Haskell?","a":"Encapsula un valor en un **contexto computacional** (secuencias de cómputo, efectos) **sin romper** la transparencia referencial ni la pureza.","src":"Guía Haskell p. 5","imp":1},{"id":"ud3-050","ud":3,"tema":"Mónadas y equivalencias","q":"¿Qué tres elementos forman una mónada?","a":"• **Constructor de tipo m**: envuelve a en m a (IO a, Maybe a, [a])\n• **return**: mete un valor en la mónada\n• **bind (>>=)**: encadena dos cómputos","src":"Guía Haskell p. 5","imp":1,"code":"return :: a -> m a\n(>>=)  :: m a -> (a -> m b) -> m b"},{"id":"ud3-051","ud":3,"tema":"Mónadas y equivalencias","q":"¿Qué es la notación do en Haskell?","a":"**Azúcar sintáctico** para no encadenar muchos >>=: permite escribir código secuencial legible sin perder la pureza funcional de fondo.","src":"Guía Haskell p. 6","imp":2,"code":"conversacion :: IO ()\nconversacion = do\n  putStrLn \"Ingrese su nombre:\"\n  nombre \u003c- getLine\n  putStrLn (\"Bienvenido a Haskell, \" ++ nombre ++ \"!\")"},{"id":"ud3-052","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo es el flujo de ejecución en cada enfoque?","a":"• Imperativo: sentencias secuenciales, bucles for/while\n• Common LISP: expresiones recursivas / bucles híbridos (loop, dotimes)\n• Haskell: expresiones recursivas puras y evaluación diferida","src":"Guía Haskell p. 6","imp":2,"serie":"Imperativo, LISP y Haskell","n":1,"total":5},{"id":"ud3-053","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo son las variables en cada enfoque?","a":"• Imperativo: celdas de memoria mutables reasignables (x++)\n• Common LISP: ligaduras léxicas (let) y variables especiales mutables (setf)\n• Haskell: ligaduras inmutables puras (**let, where**)","src":"Guía Haskell p. 6","imp":2,"serie":"Imperativo, LISP y Haskell","n":2,"total":5},{"id":"ud3-054","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo es el sistema de tipos en cada enfoque?","a":"• Imperativo: estático, comprobado por el compilador (débil/medio en C)\n• Common LISP: dinámico (en tiempo de ejecución)\n• Haskell: estático, fuerte e inferido (**Hindley-Milner**)","src":"Guía Haskell p. 6","imp":1,"serie":"Imperativo, LISP y Haskell","n":3,"total":5},{"id":"ud3-055","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo son las colecciones en cada enfoque?","a":"• Imperativo: arreglos indexados arr[i]\n• Common LISP: celdas cons enlazadas (car, cdr)\n• Haskell: listas algebraicas **homogéneas** (head, tail, :) e **infinitas**","src":"Guía Haskell p. 6","imp":2,"serie":"Imperativo, LISP y Haskell","n":4,"total":5},{"id":"ud3-056","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo se maneja la entrada/salida en cada enfoque?","a":"• Imperativo: sentencias impuras directas (printf, cin)\n• Common LISP: salidas impuras directas (print, format t)\n• Haskell: aislada y encapsulada en la **mónada IO**","src":"Guía Haskell p. 6–7","imp":2,"serie":"Imperativo, LISP y Haskell","n":5,"total":5},{"id":"ud4-001","ud":4,"tema":"Paradigma lógico","q":"¿En qué se basa la programación lógica?","a":"En la **lógica formal** (matemática y de predicados): el problema se describe con **hechos y reglas**, no con secuencias de pasos.","src":"Unidad 4 p. 1","imp":1},{"id":"ud4-002","ud":4,"tema":"Paradigma lógico","q":"Imperativo vs declarativo: ¿en qué se diferencian?","a":"• Imperativo: secuencia de pasos; el programador controla el flujo y el estado → el **CÓMO**\n• Declarativo: verdades y relaciones; el motor de inferencia deduce → el **QUÉ**","src":"S4 diap. 3","imp":1},{"id":"ud4-003","ud":4,"tema":"Paradigma lógico","q":"¿De qué se compone un sistema de programación lógica?","a":"**Base de conocimiento** (hechos + reglas) + **motor de inferencia**, que aplica modus ponens y unificación para deducir conclusiones.","src":"S4 diap. 4; Unidad 4 p. 1","imp":1},{"id":"ud4-004","ud":4,"tema":"Paradigma lógico","q":"¿En qué cuatro dominios de ingeniería destaca la programación lógica?","a":"• Sistemas expertos (diagnóstico, decisiones)\n• Bases de datos deductivas (Datalog)\n• Procesamiento de lenguaje natural\n• Verificación de modelos","src":"S4 diap. 5; Unidad 4 p. 1","imp":2},{"id":"ud4-005","ud":4,"tema":"Paradigma lógico","q":"¿Qué ventajas tiene el paradigma lógico en ingeniería?","a":"• **Claridad declarativa**: qué deducir, no cómo\n• Fácil modificación: añadir hechos o reglas no altera los existentes\n• Cercanía a la lógica matemática → validación formal","src":"Unidad 4 p. 2","imp":2},{"id":"ud4-006","ud":4,"tema":"Lógica tradicional","q":"¿Qué dos sistemas forman la lógica tradicional?","a":"La **lógica proposicional** y la **lógica de primer orden** (o de predicados). Son la base teórica de la programación lógica.","src":"Unidad 4 p. 3","imp":2},{"id":"ud4-007","ud":4,"tema":"Lógica tradicional","q":"¿Cómo es la lógica proposicional?","a":"Proposiciones atómicas **sin estructura interna**, unidas por conectores (AND, OR, NOT, →). Ej.: P → Q.","src":"Unidad 4 p. 3","imp":2},{"id":"ud4-008","ud":4,"tema":"Lógica tradicional","q":"¿Qué añade la lógica de primer orden a la proposicional?","a":"**Predicados con argumentos** y **cuantificadores**: universal (∀) y existencial (∃). Ej.: ∀X: ingeniero(X) → listo(X).","src":"Unidad 4 p. 3","imp":2},{"id":"ud4-009","ud":4,"tema":"Lógica tradicional","q":"¿Qué es el modus ponens?","a":"De una **regla general** y un **hecho** concreto se deduce una conclusión concreta: ingeniero(X) → listo(X) + ingeniero(juan) ⇒ listo(juan).","src":"Unidad 4 p. 3; S4 diap. 4","imp":1},{"id":"ud4-010","ud":4,"tema":"Lógica tradicional","q":"¿Qué es una cláusula de Horn?","a":"Una fórmula **A ← B1 ∧ … ∧ Bn**: A es la cabeza (lo que se deduce) y B1…Bn el cuerpo (las condiciones). Prolog se restringe a ellas.","src":"Unidad 4 p. 3–4; S4 diap. 7","imp":1},{"id":"ud4-011","ud":4,"tema":"Lógica tradicional","q":"¿Quién propuso el método de resolución y cuándo?","a":"**J. A. Robinson**, en **1965**. Sistematiza la deducción automática.","src":"Unidad 4 p. 4","imp":2},{"id":"ud4-012","ud":4,"tema":"Lógica tradicional","q":"¿Cómo infiere Prolog sobre cláusulas de Horn?","a":"Con un método similar a la resolución: **unifica** el objetivo con la cabeza de un hecho o regla, resuelve el cuerpo y retrocede si falla.","src":"Unidad 4 p. 4","imp":2},{"id":"ud4-013","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Qué es la ingeniería del conocimiento?","a":"Área de la informática que construye **sistemas basados en conocimiento** (SBC); si emulan a especialistas humanos se llaman **sistemas expertos**.","src":"Unidad 4 p. 4","imp":2},{"id":"ud4-014","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Qué fue CommonKADS?","a":"Una metodología **europea estándar** para desarrollar SBC en los años 90; descompone el conocimiento en modelos (de tarea, de dominio, de inferencia…).","src":"Unidad 4 p. 4, 7","imp":2},{"id":"ud4-015","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Cuáles son los 6 pasos de la ingeniería del conocimiento?","a":"1 Identificación · 2 Adquisición · 3 Formalización\n4 Implementación · 5 Verificación · 6 Mantenimiento\nY vuelta al inicio: **iteración declarativa**.","src":"S4 diap. 6; Unidad 4 p. 4–7","imp":1,"serie":"Pasos de la ingeniería del conocimiento","n":1,"total":7},{"id":"ud4-016","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 1 (identificación): ¿qué se hace?","a":"Definir el problema y el conocimiento necesario: **síntomas y conceptos**. Ej.: «la lámpara no enciende» y sus causas posibles.","src":"S4 diap. 6; Unidad 4 p. 4","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":2,"total":7},{"id":"ud4-017","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 2 (adquisición): ¿qué se hace?","a":"Extraer el conocimiento de las fuentes (expertos, manuales, datos) como **reglas empíricas** si-entonces, y fijar los hechos necesarios.","src":"S4 diap. 6; Unidad 4 p. 5","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":3,"total":7},{"id":"ud4-018","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 3 (formalización): ¿qué se hace?","a":"Traducir el conocimiento a una representación **formal y no ambigua**: predicados y fórmulas lógicas (modelos).","src":"S4 diap. 6; Unidad 4 p. 5","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":4,"total":7},{"id":"ud4-019","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 4 (implementación): ¿qué se hace?","a":"Codificar el modelo formal en un lenguaje lógico ejecutable, normalmente **Prolog**, y probarlo con hechos de ejemplo.","src":"S4 diap. 6; Unidad 4 p. 5–6","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":5,"total":7},{"id":"ud4-020","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 5 (verificación): ¿qué se hace?","a":"Probar muchos casos y comprobar que el sistema es **completo y consistente** (sin contradicciones) y razona como el experto.","src":"S4 diap. 6; Unidad 4 p. 7","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":6,"total":7},{"id":"ud4-021","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 6 (mantenimiento): ¿qué se hace?","a":"**Evolución continua**: añadir nuevas reglas o casos. Una regla nueva no rompe las existentes, pero hay que revalidar.","src":"S4 diap. 6; Unidad 4 p. 7","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":7,"total":7},{"id":"ud4-022","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Cómo se traduce a Prolog ∀L: no_enciende(L) ∧ ¬enchufada(L) → causa(L, desenchufada)?","a":"Uno a uno: la conclusión pasa a la **cabeza**, ∧ se escribe con coma y ¬ con \\+ (**negación como fallo**).","src":"S4 diap. 7; Unidad 4 p. 5","imp":1,"code":"causa(L, desenchufada) :-\n    no_enciende(L),\n    \\+ enchufada(L)."},{"id":"ud4-023","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Qué es GUPU?","a":"Entorno **educativo** de inicios de los 2000 para enseñar Prolog: guía todas las fases con feedback automático, **pruebas unitarias** y depuración declarativa.","src":"S4 diap. 6; Unidad 4 p. 7–8","imp":1},{"id":"ud4-024","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué significa «Prolog» y quién lo creó?","a":"**Programmation en Logique** (francés). Lo desarrollaron **Alain Colmerauer**, Robert Kowalski y otros a comienzos de los **años 70**.","src":"Unidad 4 p. 9","imp":1},{"id":"ud4-025","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué tipos de cláusula tiene Prolog y qué es una consulta?","a":"• **Hecho**: cláusula sin cuerpo (afirmación incondicional)\n• **Regla**: cabeza + cuerpo con condiciones\n• **Consulta**: objetivo que hay que demostrar\nToda cláusula termina en punto.","src":"Unidad 4 p. 9, 11","imp":1},{"id":"ud4-026","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué tipos de términos hay en Prolog?","a":"• Átomos (los números son átomos numéricos)\n• Variables\n• Estructuras (functores)\n• Listas","src":"S4 diap. 8; Unidad 4 p. 9–10","imp":1,"serie":"Términos de Prolog","n":1,"total":5},{"id":"ud4-027","ud":4,"tema":"Prolog: términos y sintaxis","q":"Términos de Prolog: ¿qué es un átomo y cómo se escribe?","a":"Una constante simbólica; empieza por **minúscula** (o va entre comillas simples). Ej.: juan, rosa, 'BuenosDias'.","src":"S4 diap. 8; Unidad 4 p. 9","imp":1,"serie":"Términos de Prolog","n":2,"total":5},{"id":"ud4-028","ud":4,"tema":"Prolog: términos y sintaxis","q":"Términos de Prolog: ¿qué es una variable y cómo se escribe?","a":"Una incógnita por determinar; empieza por **mayúscula** o **guion bajo**. Ej.: X, Persona, _temp. En una regla vale «para todo».","src":"S4 diap. 8; Unidad 4 p. 9","imp":1,"serie":"Términos de Prolog","n":3,"total":5},{"id":"ud4-029","ud":4,"tema":"Prolog: términos y sintaxis","q":"Términos de Prolog: ¿qué es una estructura?","a":"Un objeto compuesto: un **functor** con argumentos, functor(arg1, …, argN). Se pueden anidar. Ej.: punto(3,5).","src":"S4 diap. 8; Unidad 4 p. 9","imp":2,"serie":"Términos de Prolog","n":4,"total":5},{"id":"ud4-030","ud":4,"tema":"Prolog: términos y sintaxis","q":"Términos de Prolog: ¿cómo es una lista?","a":"Colección ordenada entre corchetes, [1,2,3]; vacía: []. Se descompone con **[Cabeza|Cola]**: [X|Y] con [a,b,c] da X = a, Y = [b,c].","src":"S4 diap. 8; Unidad 4 p. 10","imp":2,"serie":"Términos de Prolog","n":5,"total":5},{"id":"ud4-031","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué es la variable anónima _?","a":"Una variable cuyo valor **no interesa**. Cada _ es una variable distinta e independiente.","src":"Unidad 4 p. 9","imp":2},{"id":"ud4-032","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué es un predicado y qué indica el /2 de progenitor/2?","a":"Un nombre de relación o propiedad, definido por una o varias cláusulas. /2 es su **aridad**: el número de argumentos.","src":"Unidad 4 p. 10","imp":2},{"id":"ud4-033","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué partes tiene una regla de Prolog?","a":"• **Cabeza**: la conclusión que se intenta demostrar\n• **Cuello** (:-): implicación inversa, se lee «si»\n• **Cuerpo**: premisas separadas por comas (AND)\n• Variable puente (Y): conecta las premisas","src":"S4 diap. 11; Unidad 4 p. 10","imp":1,"code":"abuelo(X, Z) :-\n    progenitor(X, Y), progenitor(Y, Z)."},{"id":"ud4-034","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Cómo se expresa la disyunción (OR) en Prolog?","a":"Con **punto y coma** (;) en el cuerpo o en una consulta. Suele ser más claro escribir varias cláusulas con la misma cabeza.","src":"Unidad 4 p. 11","imp":2},{"id":"ud4-035","ud":4,"tema":"Prolog: operadores","q":"¿Qué hace el operador = en Prolog?","a":"**Unificación**: intenta igualar dos términos, ligando variables si hace falta. Si no son compatibles, falla.","src":"Unidad 4 p. 11","imp":1,"code":"?- punto(X, Y) = punto(3, 4).\nX = 3, Y = 4."},{"id":"ud4-036","ud":4,"tema":"Prolog: operadores","q":"¿Qué es la negación como fallo (\\+)?","a":"\\+ Meta tiene éxito si Meta **falla**, y falla si Meta tiene éxito. Es negación por falta de prueba (negación débil).","src":"Unidad 4 p. 11","imp":1},{"id":"ud4-037","ud":4,"tema":"Prolog: operadores","q":"¿Qué hace el corte (!)?","a":"Fija las decisiones tomadas hasta ese punto e **impide el backtracking** más allá. Poda la búsqueda; mal usado, se pierden soluciones.","src":"Unidad 4 p. 11","imp":2},{"id":"ud4-038","ud":4,"tema":"Prolog: operadores","q":"¿Para qué sirve is en Prolog?","a":"Para **evaluar** una expresión aritmética y unir el resultado: X is 2 + 3 da X = 5. Es la «asignación forzada» del cálculo.","src":"Unidad 4 p. 11; S4 diap. 15","imp":1},{"id":"ud4-039","ud":4,"tema":"Prolog: operadores","q":"¿Qué resultado da X = 2 + 3?","a":"No calcula: unifica X con la **estructura** 2+3 (el + actúa como functor). Para obtener 5 hace falta is.","src":"Unidad 4 p. 11; S4 diap. 15","imp":2},{"id":"ud4-040","ud":4,"tema":"Prolog: operadores","q":"¿Qué comparadores aritméticos tiene Prolog?","a":"=:= (igual), =\\= (distinto), \u003c, **=\u003c**, >, >=. Evalúan las expresiones de ambos lados antes de comparar.","src":"Unidad 4 p. 11","imp":2},{"id":"ud4-041","ud":4,"tema":"Prolog: operadores","q":"¿Qué hace X \\= Y en una regla?","a":"Comprueba que X e Y **no unifican** (desigualdad). En hermano/2 evita que alguien sea hermano de sí mismo.","src":"Unidad 4 p. 12","imp":2,"code":"hermano(X, Y) :- progenitor(Z, X),\n    progenitor(Z, Y), X \\= Y."},{"id":"ud4-042","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Qué es el backtracking?","a":"Retroceso automático: si una rama falla, Prolog vuelve al **último punto de decisión** válido y prueba la siguiente alternativa.","src":"S4 diap. 13–14; Unidad 4 p. 12","imp":1,"code":"?- abuelo(ana, Z).\n% Y = beatriz: falla, retrocede\n% Y = carlos: Z = elena"},{"id":"ud4-043","ud":4,"tema":"Prolog: consultas y recursión","q":"¿En qué orden explora Prolog las soluciones?","a":"**Top-down**: desde la consulta hacia los hechos, en el orden de las cláusulas y en profundidad, retrocediendo cuando falla.","src":"S4 diap. 13; Unidad 4 p. 13, 26","imp":2},{"id":"ud4-044","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Qué dos tipos de consulta hay en Prolog?","a":"• **Verificación** (booleana): sin variables → true o false\n• **Búsqueda** (generación): con variables → Prolog da sus valores","src":"S4 diap. 10; Unidad 4 p. 17","imp":1,"code":"?- padre(juan, jose).\n?- padre(juan, Hijo)."},{"id":"ud4-045","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Para qué sirve pulsar ; tras una respuesta de Prolog?","a":"Obliga a buscar la **siguiente solución** (backtracking); ENTER termina. En un programa, findall/3 o bagof/3 recogen todas.","src":"S4 diap. 10; Unidad 4 p. 13","imp":2},{"id":"ud4-046","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Cómo se repite un cálculo en Prolog si no hay bucles?","a":"Con **recursión**: todo ciclo es una inmersión recursiva hasta un **caso base**.","src":"S4 diap. 16","imp":1},{"id":"ud4-047","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Cómo se define el factorial en Prolog?","a":"• Caso base (hecho): factorial(0, 1)\n• Regla: si N > 0, calcula N1 = N − 1, su factorial F1 y F = F1 · N","src":"S4 diap. 15; ejm3.pl; Unidad 4 p. 13–14","imp":1,"code":"factorial(0, 1).\nfactorial(N, F) :- N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    F is F1 * N."},{"id":"ud4-048","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Cómo se define miembro/2 (pertenencia a una lista)?","a":"• X es miembro si es la **cabeza** de la lista\n• Si no, lo es si está en la **cola** (recursión)\nSirve para comprobar y para generar elementos.","src":"Unidad 4 p. 14, 21–23","imp":2,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T)."},{"id":"ud4-049","ud":4,"tema":"ASP y Datalog","q":"¿Qué es ASP (Answer Set Programming)?","a":"Programación por **conjuntos de respuestas**: enfoque lógico para problemas de búsqueda **combinatorios** (a menudo NP-difíciles): planificación, configuración, puzzles.","src":"Unidad 4 p. 15","imp":1},{"id":"ud4-050","ud":4,"tema":"ASP y Datalog","q":"¿Cómo obtiene ASP las soluciones?","a":"Por la semántica de **modelos estables**: un solver (clingo, DLV) calcula los conjuntos de hechos que satisfacen las reglas; cada uno es una solución.","src":"Unidad 4 p. 15","imp":2},{"id":"ud4-051","ud":4,"tema":"ASP y Datalog","q":"¿Qué es el conocimiento no monótono, que ASP puede expresar?","a":"Lo que se concluye por la ausencia de un hecho **cambia** si luego se añade ese hecho. ASP lo logra con negación fuerte y por ausencia.","src":"Unidad 4 p. 15","imp":2},{"id":"ud4-052","ud":4,"tema":"ASP y Datalog","q":"¿Qué es Datalog?","a":"Un lenguaje lógico para **consultas y bases de datos deductivas**; puede verse como un **subconjunto de Prolog** con restricciones.","src":"Unidad 4 p. 15","imp":1},{"id":"ud4-053","ud":4,"tema":"ASP y Datalog","q":"¿Qué términos admite Datalog?","a":"Solo **constantes o variables**: sin funciones ni estructuras anidadas. Así el dominio es finito y acotado por los hechos.","src":"Unidad 4 p. 15","imp":2},{"id":"ud4-054","ud":4,"tema":"ASP y Datalog","q":"¿Cómo infieren Prolog y Datalog?","a":"• Prolog: **top-down**, desde la consulta y con backtracking\n• Datalog: **bottom-up**, deduce todos los hechos posibles y luego responde","src":"Unidad 4 p. 15–16","imp":1},{"id":"ud4-055","ud":4,"tema":"ASP y Datalog","q":"¿Para qué se usa Datalog?","a":"Para consultas **recursivas** que el SQL estándar no expresaba bien (alcanzabilidad en grafos, jerarquías) y para análisis estático de programas.","src":"Unidad 4 p. 16","imp":2},{"id":"ud4-056","ud":4,"tema":"ASP y Datalog","q":"¿Qué diferencia a Datalog de Prolog en cuanto a terminación?","a":"Datalog **siempre termina** (es decidible: los términos no crecen). Prolog es **Turing-completo** y puede no terminar.","src":"Unidad 4 p. 16","imp":2},{"id":"ud4-057","ud":4,"tema":"ASP y Datalog","q":"Prolog, ASP y Datalog: ¿a qué se orienta cada uno?","a":"• Prolog: deducción por unificación y backtracking\n• ASP: generar soluciones a problemas combinatorios\n• Datalog: consultas optimizadas sobre grandes bases de hechos","src":"Unidad 4 p. 16","imp":1},{"id":"ud4-058","ud":4,"tema":"Ejercicios resueltos","q":"¿Qué es la asunción del mundo cerrado?","a":"Lo que **no puede demostrarse** con los hechos y reglas de la base se considera **falso**.","src":"S4 diap. 9; Unidad 4 p. 17","imp":1},{"id":"ud4-059","ud":4,"tema":"Ejercicios resueltos","q":"EJM0: ¿qué responde ?- listo(juan).?","a":"**true**: la regla unifica X = juan y ingeniero(juan) es un hecho (modus ponens).","src":"Preguntas_1 (EJM0); S4 diap. 4","imp":1,"code":"ingeniero(juan).\nlisto(X) :- ingeniero(X)."},{"id":"ud4-060","ud":4,"tema":"Ejercicios resueltos","q":"EJM0: ¿qué responde ?- \\+ listo(jose).?","a":"**true**: listo(jose) no se puede demostrar (no hay ingeniero(jose)), así que \\+ tiene éxito. Es el mundo cerrado.","src":"Preguntas_1 (EJM0)","imp":1,"code":"ingeniero(juan).\nlisto(X) :- ingeniero(X)."},{"id":"ud4-061","ud":4,"tema":"Ejercicios resueltos","q":"EJM1: ¿qué responden padre(juan, jose), padre(juan, alberto) y padre(maria, jose)?","a":"• padre(juan, jose) → **true**\n• padre(juan, alberto) → false (Juan es su abuelo)\n• padre(maria, jose) → false (no está en la base)","src":"Preguntas_1 (EJM1); Unidad 4 p. 17","imp":2,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena)."},{"id":"ud4-062","ud":4,"tema":"Ejercicios resueltos","q":"EJM1: ¿qué responden ?- padre(juan, Hijo). y ?- padre(Padre, juan).?","a":"• padre(juan, Hijo) → Hijo = maria ; Hijo = jose\n• padre(Padre, juan) → Padre = carlos","src":"Preguntas_1 (EJM1); S4 diap. 10","imp":1,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena)."},{"id":"ud4-063","ud":4,"tema":"Ejercicios resueltos","q":"EJM2: ¿cómo se define abuelo/2 a partir de padre/2?","a":"X es abuelo de Y si X es padre de algún Z y Z es padre de Y. Si se añaden padres, deduce los nuevos abuelos **sin tocar la regla**.","src":"S4 diap. 12; ejm2.pl","imp":1,"code":"abuelo(X, Y) :- padre(X, Z), padre(Z, Y)."},{"id":"ud4-064","ud":4,"tema":"Ejercicios resueltos","q":"EJM2: ¿qué responde ?- abuelo(carlos, Z).?","a":"Z = maria ; Z = jose (vía Juan). La rama de Elena falla porque no tiene hijos, y Prolog retrocede.","src":"Preguntas_1 (EJM2); S4 diap. 14","imp":1,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y)."},{"id":"ud4-065","ud":4,"tema":"Ejercicios resueltos","q":"EJM2: ¿qué responde ?- abuelo(Z, alberto).?","a":"Z = juan: Juan es padre de María y María es madre de Alberto.","src":"Preguntas_1 (EJM2)","imp":2,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y)."},{"id":"ud4-066","ud":4,"tema":"Ejercicios resueltos","q":"EJM2: ¿qué responde ?- abuelo(Abuelo, Nieto).?","a":"• Abuelo = juan, Nieto = alberto\n• Abuelo = carlos, Nieto = maria\n• Abuelo = carlos, Nieto = jose","src":"Preguntas_1 (EJM2); Unidad 4 p. 18–19","imp":2,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y)."},{"id":"ud4-067","ud":4,"tema":"Ejercicios resueltos","q":"EJM3: ¿qué responde ?- factorial(3, F). y cómo lo calcula?","a":"F = 6. Baja 3 → 2 → 1 → 0 hasta el caso base factorial(0, 1) y vuelve multiplicando: 1·1 = 1, 1·2 = 2, 2·3 = 6.","src":"Preguntas_1 (EJM3); S4 diap. 16","imp":2,"code":"factorial(0, 1).\nfactorial(N, F) :- N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    F is F1 * N."},{"id":"ud4-068","ud":4,"tema":"Ejercicios resueltos","q":"EJM3: ¿qué responden ?- factorial(5, X). y ?- factorial(4, 24).?","a":"• factorial(5, X) → X = 120\n• factorial(4, 24) → true (comprueba que 4! = 24)","src":"Preguntas_1 (EJM3); S4 diap. 17","imp":2,"code":"factorial(0, 1).\nfactorial(N, F) :- N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    F is F1 * N."},{"id":"ud4-069","ud":4,"tema":"Ejercicios resueltos","q":"EJM3: ¿qué pasa con ?- factorial(N, F). y por qué?","a":"Primero da N = 0, F = 1; al pedir más, **ERROR**: N > 0 e is necesitan N con valor. El predicado es **direccional** (N → F).","src":"Preguntas_1 (EJM3); S4 diap. 17; Unidad 4 p. 21","imp":1,"code":"factorial(0, 1).\nfactorial(N, F) :- N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    F is F1 * N."},{"id":"ud4-070","ud":4,"tema":"Ejercicios resueltos","q":"Ejercicio 5: ¿cómo se define alcanzable/2 en un grafo?","a":"• Base: hay conexión directa de X a Y\n• Recursiva: X conecta con Z e Y es alcanzable desde Z\nCon ciclos puede no terminar: llevar una lista de visitados.","src":"Unidad 4 p. 23–26","imp":2,"code":"alcanzable(X, Y) :- conexion(X, Y).\nalcanzable(X, Y) :-\n    conexion(X, Z), alcanzable(Z, Y)."},{"id":"ud4-071","ud":4,"tema":"Conclusión","q":"¿Qué virtudes tiene Prolog en problemas expresables con reglas?","a":"Desarrollo rápido y **transparencia**: reglas legibles, fáciles de mantener y que explican cómo se llegó a la conclusión.","src":"Unidad 4 p. 27","imp":2},{"id":"ud4-072","ud":4,"tema":"Conclusión","q":"¿Cuándo no conviene la programación lógica pura?","a":"Con cálculos **secuenciales**, mucha manipulación de **estados cambiantes** o volúmenes de datos enormes. Se combina con módulos imperativos (C, Python).","src":"Unidad 4 p. 28","imp":2},{"id":"ud4-073","ud":4,"tema":"Conclusión","q":"¿Qué extensiones del paradigma lógico se citan?","a":"• Programación lógica con restricciones (**CLP**)\n• Programación lógica inductiva\n• Programación lógica probabilística","src":"Unidad 4 p. 27","imp":2},{"id":"ud4-074","ud":4,"tema":"Conclusión","q":"¿Dónde tiene hoy aplicación o futuro la programación lógica?","a":"• IA explicable (traza de inferencia)\n• IA **neuro-simbólica** (redes neuronales + lógica)\n• Web semántica: ontologías, OWL\n• Planificación: STRIPS, PDDL","src":"Unidad 4 p. 28","imp":2},{"id":"ud5-001","ud":5,"tema":"Listas: cabeza/cola","q":"¿Qué es el patrón cabeza/cola de una lista en Prolog?","a":"El separador **|** parte la lista: [Cabeza|Cola]. La cabeza es el primer elemento; la cola, la lista con el resto.","src":"S5 diap. 4","imp":1,"code":"?- [H|T] = [a, b, c].\nH = a, T = [b, c]."},{"id":"ud5-002","ud":5,"tema":"Listas: cabeza/cola","q":"¿Qué significa la variable anónima _ (guion bajo)?","a":"Es un **comodín**: «no me importa este dato, ignóralo y sigue evaluando».","src":"S5 diap. 4","imp":1},{"id":"ud5-003","ud":5,"tema":"Listas: cabeza/cola","q":"¿Cómo se define miembro/2 en las diapositivas?","a":"• Caso base: X es la **cabeza** de la lista\n• Caso recursivo: si no, se busca X en la **cola**","src":"S5 diap. 3-4","imp":1,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T)."},{"id":"ud5-004","ud":5,"tema":"Listas: cabeza/cola","q":"¿Qué dos comportamientos tiene el mismo predicado miembro/2?","a":"• **Verificación** (input instanciado)\n• **Generación** (input variable)","src":"S5 diap. 3","imp":1,"serie":"miembro/2: dos usos","n":1,"total":3},{"id":"ud5-005","ud":5,"tema":"Listas: cabeza/cola","q":"miembro/2 en modo verificación: ¿qué hace?","a":"Con el elemento dado, comprueba si la afirmación es correcta **recorriendo la estructura**: responde true o false.","src":"S5 diap. 3, 5","imp":2,"serie":"miembro/2: dos usos","n":2,"total":3,"code":"?- miembro(b, [a, b, c]).\ntrue."},{"id":"ud5-006","ud":5,"tema":"Listas: cabeza/cola","q":"miembro/2 en modo generación: ¿qué hace?","a":"Con una **variable**, el **backtracking** extrae e itera todos los elementos posibles automáticamente.","src":"S5 diap. 3, 5","imp":2,"serie":"miembro/2: dos usos","n":3,"total":3,"code":"?- miembro(X, [a, b, c]).\nX = a ; X = b ; X = c."},{"id":"ud5-007","ud":5,"tema":"Listas: cabeza/cola","q":"¿Por qué ?- miembro(x, [a, b, c]) devuelve false?","a":"Compara x con cada cabeza (a, b, c) y recurre con la cola. Al llegar a **[]** no unifica con ninguna regla: falla y retorna **false**.","src":"S5 diap. 5","imp":2},{"id":"ud5-008","ud":5,"tema":"Grafos y recursión","q":"En el ejemplo de grafos, ¿qué representan los hechos conexion/2?","a":"Caminos directos de **un solo salto**. El reto: que Prolog deduzca rutas multidestino (Madrid → Zaragoza) que no están explícitas en sus datos.","src":"S5 diap. 6-7","imp":2,"code":"conexion(madrid, valencia).\nconexion(valencia, barcelona)."},{"id":"ud5-009","ud":5,"tema":"Grafos y recursión","q":"alcanzable/2: ¿qué dice la primera regla?","a":"«**Llegué directamente**»: Y es alcanzable desde X si existe conexion(X, Y).","src":"S5 diap. 6, 8","imp":1,"serie":"alcanzable/2","n":1,"total":2,"code":"alcanzable(X, Y) :- conexion(X, Y)."},{"id":"ud5-010","ud":5,"tema":"Grafos y recursión","q":"alcanzable/2: ¿qué dice la segunda regla (la recursiva)?","a":"«Salté a un **nodo intermedio Z**, y desde Z sé cómo llegar a Y».","src":"S5 diap. 6, 8","imp":1,"serie":"alcanzable/2","n":2,"total":2,"code":"alcanzable(X, Y) :-\n    conexion(X, Z),\n    alcanzable(Z, Y)."},{"id":"ud5-011","ud":5,"tema":"Grafos y recursión","q":"¿Qué algoritmo crean automáticamente las dos reglas de alcanzable/2?","a":"Una búsqueda exhaustiva **en profundidad (DFS)**: el «algoritmo definitivo» de **recursión + backtracking**.","src":"S5 diap. 6, 8","imp":2},{"id":"ud5-012","ud":5,"tema":"Grafos y recursión","q":"¿Qué peligro tiene alcanzable/2 si el grafo es circular?","a":"**Ciclos**: Prolog quedaría atrapado en un bucle infinito recursivo. En producción se usan acumuladores de **nodos visitados**.","src":"S5 diap. 6, 8","imp":1},{"id":"ud5-013","ud":5,"tema":"Grafos y recursión","q":"¿Cómo deduce Prolog alcanzable(madrid, zaragoza)?","a":"Madrid → Valencia → Barcelona → Zaragoza (3 saltos): regla 2, regla 2 y cierra con la regla 1. Si una rama no lleva, retrocede (backtracking).","src":"S5 diap. 8","imp":2},{"id":"ud5-014","ud":5,"tema":"Pilares y familia lógica","q":"¿Cuáles son los tres pilares ocultos del paradigma lógico?","a":"• Unificación\n• Recursión\n• Backtracking","src":"S5 diap. 9","imp":1,"serie":"Los tres pilares","n":1,"total":4},{"id":"ud5-015","ud":5,"tema":"Pilares y familia lógica","q":"Pilar «unificación»: ¿qué hace?","a":"Asigna valores a variables **dinámicamente** si los moldes **encajan perfectamente**.","src":"S5 diap. 9","imp":1,"serie":"Los tres pilares","n":2,"total":4},{"id":"ud5-016","ud":5,"tema":"Pilares y familia lógica","q":"Pilar «recursión»: ¿qué aporta?","a":"Es el mecanismo de **descenso profundo** para evadir la necesidad de bucles estáticos.","src":"S5 diap. 9","imp":2,"serie":"Los tres pilares","n":3,"total":4},{"id":"ud5-017","ud":5,"tema":"Pilares y familia lógica","q":"Pilar «backtracking»: ¿qué es?","a":"La **brújula interna** que busca alternativas exhaustivas cuando choca contra una pared.","src":"S5 diap. 9","imp":2,"serie":"Los tres pilares","n":4,"total":4},{"id":"ud5-018","ud":5,"tema":"Pilares y familia lógica","q":"¿Qué se consigue al combinar unificación, recursión y backtracking?","a":"Programas de **5 líneas** que resuelven laberintos enteros. «El programador describe la realidad; Prolog encuentra la verdad».","src":"S5 diap. 9","imp":2},{"id":"ud5-019","ud":5,"tema":"Pilares y familia lógica","q":"¿Qué lenguajes forman la familia lógica según las diapositivas?","a":"• Prolog\n• ASP (Answer Set)\n• Datalog","src":"S5 diap. 10","imp":1,"serie":"Familia lógica","n":1,"total":4},{"id":"ud5-020","ud":5,"tema":"Pilares y familia lógica","q":"Familia lógica: ¿cómo es Prolog?","a":"• Ejecución: **Top-Down** (backtracking)\n• Turing completo (estructuras infinitas)\n• Uso: sistemas expertos e IA simbólica","src":"S5 diap. 10","imp":2,"serie":"Familia lógica","n":2,"total":4},{"id":"ud5-021","ud":5,"tema":"Pilares y familia lógica","q":"Familia lógica: ¿cómo es ASP (Answer Set)?","a":"• Ejecución: generación de modelos (**SAT**)\n• Restricciones combinatorias (negación fuerte)\n• Uso: optimización NP-difícil y puzzles lógicos","src":"S5 diap. 10","imp":2,"serie":"Familia lógica","n":3,"total":4},{"id":"ud5-022","ud":5,"tema":"Pilares y familia lógica","q":"Familia lógica: ¿cómo es Datalog?","a":"• Ejecución: **Bottom-Up** (exhaustivo)\n• Finito (sin funciones anidadas)\n• Uso: consultas recursivas en bases de datos gigantes","src":"S5 diap. 10","imp":2,"serie":"Familia lógica","n":4,"total":4},{"id":"ud5-023","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué tres ventajas («acelera») tiene aplicar lógica pura?","a":"• Transparencia extrema\n• Mantenimiento ortogonal\n• Modelado natural","src":"S5 diap. 11","imp":1,"serie":"Ventajas de la lógica pura","n":1,"total":4},{"id":"ud5-024","ud":5,"tema":"Ventajas, límites y futuro","q":"Ventaja «transparencia extrema»: ¿en qué consiste?","a":"**Trazabilidad exacta** de por qué se tomó cada decisión.","src":"S5 diap. 11","imp":2,"serie":"Ventajas de la lógica pura","n":2,"total":4},{"id":"ud5-025","ud":5,"tema":"Ventajas, límites y futuro","q":"Ventaja «mantenimiento ortogonal»: ¿en qué consiste?","a":"Añadir nuevas reglas **no rompe el flujo** existente.","src":"S5 diap. 11","imp":2,"serie":"Ventajas de la lógica pura","n":3,"total":4},{"id":"ud5-026","ud":5,"tema":"Ventajas, límites y futuro","q":"Ventaja «modelado natural»: ¿en qué consiste?","a":"Representación directa de **ontologías** y relaciones matemáticas.","src":"S5 diap. 11","imp":2,"serie":"Ventajas de la lógica pura","n":4,"total":4},{"id":"ud5-027","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué tres limitaciones («frena») tiene aplicar lógica pura?","a":"• Ineficiencia numérica\n• Mutación de estado\n• Curva de abstracción","src":"S5 diap. 11","imp":1,"serie":"Limitaciones de la lógica pura","n":1,"total":4},{"id":"ud5-028","ud":5,"tema":"Ventajas, límites y futuro","q":"Limitación «ineficiencia numérica»: ¿en qué consiste?","a":"Es **lento** en cálculos matemáticos puramente secuenciales.","src":"S5 diap. 11","imp":2,"serie":"Limitaciones de la lógica pura","n":2,"total":4},{"id":"ud5-029","ud":5,"tema":"Ventajas, límites y futuro","q":"Limitación «mutación de estado»: ¿en qué consiste?","a":"Mala manipulación de **variables que cambian** constantemente.","src":"S5 diap. 11","imp":2,"serie":"Limitaciones de la lógica pura","n":3,"total":4},{"id":"ud5-030","ud":5,"tema":"Ventajas, límites y futuro","q":"Limitación «curva de abstracción»: ¿en qué consiste?","a":"Exige abandonar el **control explícito** del flujo de control.","src":"S5 diap. 11","imp":2,"serie":"Limitaciones de la lógica pura","n":4,"total":4},{"id":"ud5-031","ud":5,"tema":"Ventajas, límites y futuro","q":"En la arquitectura moderna, ¿qué papel tiene el motor lógico?","a":"Es el «**cerebro estratégico**»: orquesta submódulos imperativos (ej. Python, C) encargados de la ejecución eficiente.","src":"S5 diap. 11","imp":2},{"id":"ud5-032","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué es la IA neuro-simbólica?","a":"La convergencia de **redes neuronales** y **sistemas lógicos**: sistemas autónomos que no solo predicen, sino que **razonan y explican**.","src":"S5 diap. 12","imp":1},{"id":"ud5-033","ud":5,"tema":"Ventajas, límites y futuro","q":"Redes neuronales vs. sistemas lógicos: ¿qué aporta cada uno?","a":"• Redes: reconocimiento de patrones, datos crudos, «**caja negra**»\n• Lógicos: razonamiento estructurado, reglas de negocio, decisiones **auditables y explicables**","src":"S5 diap. 12","imp":2},{"id":"ud5-034","ud":5,"tema":"Ej. 3: OR implícito","q":"Ejercicio 3 (buceadores): ¿qué se pide?","a":"Reglas de riesgo descompresivo **sin el OR (;)**:\n• 1: Temp \u003c 12 y Tiempo ≥ 20\n• 2: Temp \u003c 12 y Prof > 30\n• 3: Prof > 30 y Tiempo ≥ 40","src":"S5 diap. 14","imp":2,"code":"% buceador(Nombre, Temp, Prof, Tiempo)\nbuceador(luis, 11, 34, 15)."},{"id":"ud5-035","ud":5,"tema":"Ej. 3: OR implícito","q":"¿Cómo se programa un OR sin usar «;» en Prolog?","a":"Con **reglas homónimas**: una regla con el mismo nombre por cada condición. Prolog las evalúa como alternativas independientes: el OR es **implícito**.","src":"S5 diap. 15","imp":1,"code":"% condición 1\nen_riesgo_ED(Nombre) :-\n  buceador(Nombre, T, _, Tiempo),\n  T \u003c 12, Tiempo >= 20."},{"id":"ud5-036","ud":5,"tema":"Ej. 3: OR implícito","q":"En el cuerpo de una regla, ¿qué significa la coma?","a":"**AND** lógico (conjunción): deben cumplirse todas las condiciones, p. ej. T \u003c 12, Tiempo >= 20.","src":"S5 diap. 15, 21","imp":2},{"id":"ud5-037","ud":5,"tema":"Ej. 3: OR implícito","q":"Ejercicio 3: ¿qué buceadores devuelve la consulta en_riesgo_ED(X)?","a":"Por orden de reglas: carlos (cond. 1), luis (cond. 2), mario (cond. 3). **ana** no cumple ninguna, así que no aparece.","src":"S5 diap. 14-15 (calculado)","imp":2,"code":"?- en_riesgo_ED(X).\nX = carlos ;\nX = luis ;\nX = mario ;\nfalse."},{"id":"ud5-038","ud":5,"tema":"Ej. 4: conc/3","q":"conc/3: ¿qué dice el caso base?","a":"Unir una **lista vacía** con cualquier lista L deja la lista **intacta**.","src":"S5 diap. 16","imp":2,"serie":"conc/3","n":1,"total":2,"code":"conc([], L, L)."},{"id":"ud5-039","ud":5,"tema":"Ej. 4: conc/3","q":"conc/3: ¿qué hace el paso recursivo (desacople estructural)?","a":"La cabeza **H** se extrae de la 1.ª lista y se obliga a **encabezar el resultado**; la recursión se encarga de la cola T.","src":"S5 diap. 16","imp":2,"serie":"conc/3","n":2,"total":2,"code":"conc([H|T], L2, [H|R]) :-\n    conc(T, L2, R)."},{"id":"ud5-040","ud":5,"tema":"Ej. 4: conc/3","q":"¿Por qué conc/3 es tan poderoso?","a":"Porque es una **declaración lógica pura**, carente de dirección de flujo: el mismo predicado **une** listas y las **descompone**.","src":"S5 diap. 16-17","imp":1},{"id":"ud5-041","ud":5,"tema":"Ej. 4: conc/3","q":"¿Qué dos usos de conc/3 muestran las diapositivas?","a":"• Unión: conc([aa, bb], [cc], Total) da Total = [aa, bb, cc]\n• Descomposición: el motor explora **todas las particiones** con backtracking","src":"S5 diap. 17","imp":2,"code":"?- conc(P, S, [a, b, c]).\nP = [], S = [a, b, c] ;\nP = [a], S = [b, c] ;\nP = [a, b], S = [c] ;\nP = [a, b, c], S = []."},{"id":"ud5-042","ud":5,"tema":"Ej. 5: aritmética (is)","q":"Ejercicio 5: ¿cómo se define longitud/2?","a":"• [] mide 0\n• [_|T] mide lo que mida T, más 1\n• **is** va tras la recursión, cuando NResto ya tiene valor","src":"S5 diap. 18","imp":2,"code":"longitud([], 0).\nlongitud([_|T], N) :-\n    longitud(T, NResto),\n    N is NResto + 1."},{"id":"ud5-043","ud":5,"tema":"Ej. 5: aritmética (is)","q":"Ejercicio 5: ¿cómo se define sumar_cargas/2?","a":"• [] suma 0\n• [C|Resto] suma el SubTotal del resto más C","src":"S5 diap. 18","imp":2,"code":"sumar_cargas([], 0).\nsumar_cargas([C|Resto], Total) :-\n    sumar_cargas(Resto, SubTotal),\n    Total is SubTotal + C."},{"id":"ud5-044","ud":5,"tema":"Ej. 5: aritmética (is)","q":"¿Por qué el operador is «rompe la pureza»?","a":"Rompe la **bidireccionalidad pura**: es una llamada imperativa a la CPU que exige que los valores de la derecha **estén instanciados**.","src":"S5 diap. 18","imp":1,"code":"?- X is Y + 1.   % Y sin valor\n→ ERROR (no instanciado)"},{"id":"ud5-045","ud":5,"tema":"Ej. 5: aritmética (is)","q":"En sumar_cargas([10, 20], Total), ¿cuándo ocurre la suma?","a":"**De regreso**: el motor desciende hasta sumar_cargas([], 0) con las operaciones suspendidas y, al desenvolver: 0 + 20 = 20, 20 + 10 = 30.","src":"S5 diap. 19","imp":1},{"id":"ud5-046","ud":5,"tema":"Ej. 6: subconjunto/2","q":"Ejercicio 6: ¿cómo se define subconjunto/2?","a":"Comprueba que **TODOS** los elementos de la sublista están en la lista:\n• [] es subconjunto de cualquier lista\n• H es miembro y la cola T también es subconjunto","src":"S5 diap. 20","imp":1,"code":"subconjunto([], _).\nsubconjunto([H|T], Lista) :-\n    miembro(H, Lista),\n    subconjunto(T, Lista)."},{"id":"ud5-047","ud":5,"tema":"Ej. 6: subconjunto/2","q":"En subconjunto/2, ¿qué papel cumple miembro/2?","a":"Es un **predicado auxiliar**: aislamos la cabeza de la sublista y delegamos la búsqueda de ese elemento al motor lógico.","src":"S5 diap. 20","imp":2},{"id":"ud5-048","ud":5,"tema":"Ej. 6: subconjunto/2","q":"¿Por qué subconjunto([aa, dd], [aa, bb, cc]) devuelve false?","a":"aa se encuentra y el motor avanza; **dd no** está: falla la premisa, la conjunción (AND) se quiebra y la regla completa colapsa.","src":"S5 diap. 21","imp":1},{"id":"ud5-049","ud":5,"tema":"Ej. 6: subconjunto/2","q":"¿Qué dice la asunción del mundo cerrado?","a":"«Lo que **no se puede demostrar**, es falso».","src":"S5 diap. 21","imp":1}];
  const UDS = [{"ud":1,"glyph":"{ }","name":"Introducción a los paradigmas"},{"ud":2,"glyph":"( )","name":"Paradigma funcional y Lisp"},{"ud":3,"glyph":"λ","name":"Funcional: Hope y Haskell"},{"ud":4,"glyph":":-","name":"Paradigma lógico y Prolog"},{"ud":5,"glyph":"?-","name":"Prolog: listas, grafos y ejercicios"}];
  const QS = [{"id":"p1-001","ud":1,"tema":"Qué es un paradigma","q":"Según las diapositivas, ¿qué es un paradigma de programación?","ops":["Un modelo de referencia conceptual: la filosofía y las directrices arquitectónicas del software","La secuencia ordenada de pasos que sigue un equipo de desarrollo para construir un programa concreto","Un lenguaje concreto, con su sintaxis, su compilador y sus bibliotecas estándar","El conjunto de estructuras de datos que un programa guarda en la memoria"],"why":"La diap. 3 lo define como un modelo de referencia conceptual que fija la filosofía y las directrices arquitectónicas para construir software. La secuencia de pasos para construirlo es la metodología, no el paradigma.","src":"S1 diap. 3","imp":1,"ficha":"ud1-001"},{"id":"p1-002","ud":1,"tema":"Qué es un paradigma","q":"¿Qué diferencia establecen las diapositivas entre paradigma y metodología?","ops":["Paradigma: forma arquitectónica y visión del mundo; metodología: secuencia de pasos para construirlo","Paradigma: secuencia de pasos para construirlo; metodología: forma arquitectónica y visión del mundo","Paradigma: el lenguaje en que se escribe; metodología: el compilador que lo traduce a la máquina","Paradigma: el algoritmo del programa; metodología: las estructuras de datos que utiliza"],"why":"En la diap. 3 el paradigma (la brújula) es la forma arquitectónica y visión del mundo, y la metodología (el plano), la secuencia de pasos para construirlo. La opción que los intercambia es la trampa típica.","src":"S1 diap. 3","imp":1,"ficha":"ud1-003"},{"id":"p1-003","ud":1,"tema":"Qué es un paradigma","q":"Completa la fórmula que recoge la diapositiva «¿Qué es un paradigma?»: ___ + ___ = Programa.","ops":["Algoritmo + Estructuras de datos","Paradigma + Metodología","Algoritmo + Metodología de desarrollo","Lenguaje de programación + Compilador"],"why":"La diap. 3 resume que Algoritmo + Estructuras de Datos = Programa. Paradigma y metodología son las dos ideas que se distinguen debajo de la fórmula, no sus sumandos.","src":"S1 diap. 3","imp":1,"ficha":"ud1-002"},{"id":"p1-004","ud":1,"tema":"Qué es un paradigma","q":"Robert W. Floyd clasifica los paradigmas en tres categorías. ¿Cuál **NO** es una de ellas?","ops":["Los que aprenden el método a partir de ejemplos particulares","Los que soportan técnicas de bajo nivel, cercanas al hardware","Los que usan métodos o patrones para el diseño de algoritmos","Los que permiten soluciones de alto nivel centradas en la abstracción"],"why":"Las tres categorías de Floyd son: técnicas de bajo nivel, métodos o patrones de diseño de algoritmos y soluciones de alto nivel. Aprender el método a partir de ejemplos describe la solución demostrativa, una rama de la taxonomía de alto nivel.","src":"Resumen UD1 p. 1","imp":1,"ficha":"ud1-006"},{"id":"p1-005","ud":1,"tema":"Qué es un paradigma","q":"Un programador necesita controlar directamente los registros y la memoria del procesador. Según el resumen, ¿qué tipo de lenguaje le conviene?","ops":["Uno de bajo nivel, como el ensamblador","Uno de alto nivel, como Python","Uno declarativo, como Prolog","Uno funcional de alto nivel, como Haskell"],"why":"Según el resumen, los lenguajes de bajo nivel se acercan al hardware y dan control directo sobre registros o memoria; su ejemplo es el ensamblador. Los de alto nivel, como Python o Java, ofrecen abstracción a cambio de ese control.","src":"Resumen UD1 p. 1","imp":2,"ficha":"ud1-005"},{"id":"p1-006","ud":1,"tema":"Taxonomía de alto nivel","q":"En «La gran taxonomía de soluciones de alto nivel» de las diapositivas, ¿en qué tres familias se dividen las soluciones?","ops":["Procedimental, declarativa y demostrativa","Imperativa, funcional y lógica","De bajo nivel, de patrones de diseño y de alto nivel","Procedimental, declarativa y orientada a objetos"],"why":"La diap. 4 divide la solución de alto nivel en procedimental (cómo), declarativa (qué) y demostrativa (aprende de ejemplos). Bajo nivel, patrones y alto nivel es la clasificación de Floyd, y la orientación a objetos es una hoja de la rama procedimental.","src":"S1 diap. 4","imp":1,"ficha":"ud1-007"},{"id":"p1-007","ud":1,"tema":"Taxonomía de alto nivel","q":"Según la taxonomía de las diapositivas, ¿qué paradigmas cuelgan de la rama declarativa?","ops":["Transformación, formularios y restricciones","Imperativo, orientado a objetos y restricciones","Inducción, redes neuronales y genéticos","Transformación, formularios e inducción"],"why":"En la diap. 4 la rama declarativa agrupa transformación, formularios y restricciones. La inducción es demostrativa, y el imperativo y la OO, procedimentales. El resumen llama declarativos al funcional y al lógico, pero no figuran en esta taxonomía.","src":"S1 diap. 4","imp":1,"ficha":"ud1-009"},{"id":"p1-008","ud":1,"tema":"Taxonomía de alto nivel","q":"En la taxonomía de alto nivel, ¿qué describe la solución procedimental y qué paradigmas incluye?","ops":["Describe etapa a etapa cómo obtener la solución; incluye el imperativo y la orientación a objetos","Describe qué se desea obtener sin decir cómo; incluye el imperativo y la orientación a objetos","Describe etapa a etapa cómo obtener la solución; incluye la transformación y las restricciones","Aprende el método a partir de ejemplos particulares; incluye la inducción y los algoritmos genéticos"],"why":"La rama procedimental describe etapa a etapa CÓMO obtener la solución, y de ella cuelgan el imperativo y el orientado a objetos. Describir QUÉ se desea es lo propio de la declarativa, de la que cuelgan transformación, formularios y restricciones.","src":"S1 diap. 4","imp":1,"ficha":"ud1-008"},{"id":"p1-009","ud":1,"tema":"Taxonomía de alto nivel","q":"Las redes neuronales y los algoritmos genéticos aparecen en la taxonomía de las diapositivas. ¿En qué rama y por qué?","ops":["En la demostrativa, porque aprenden el método a partir de ejemplos (bottom-up)","En la declarativa, porque describen qué se desea obtener sin decir cómo","En la procedimental, porque describen etapa a etapa cómo hay que obtener la solución","En la de restricciones, porque buscan un estado que cumpla todas las reglas"],"why":"La rama demostrativa «aprende el MÉTODO a partir de ejemplos (Bottom-Up)» e incluye inducción, redes neuronales y genéticos. Restricciones no es una rama, sino una de las hojas de la declarativa.","src":"S1 diap. 4","imp":1,"ficha":"ud1-010"},{"id":"p1-010","ud":1,"tema":"Paradigma imperativo","q":"En el paradigma procedimental, las variables están ligadas a direcciones de memoria que la ejecución sobrescribe, y el valor final es el resultado. ¿Qué concepto clave es este?","ops":["Los efectos de lado (side effects)","La evaluación perezosa (lazy evaluation)","El enlace dinámico","La inmutabilidad"],"why":"La diap. 5 lo llama el concepto clave del procedimental: los efectos de lado. La celda X recibe 1, se sobrescribe con 5 y luego con 10, y ese valor final es el resultado. La inmutabilidad es lo contrario: la relación inmutable de lo declarativo.","src":"S1 diap. 5","imp":1,"ficha":"ud1-012"},{"id":"p1-011","ud":1,"tema":"Paradigma imperativo","q":"La diapositiva del paradigma imperativo dibuja una CPU que lee y escribe en la memoria con un ciclo fetch/execute. ¿Qué arquitectura representa?","ops":["La arquitectura de Von Neumann","La arquitectura neuromórfica","La arquitectura de flujo de datos (dataflow)","La arquitectura multiagente"],"why":"El imperativo se apoya en la arquitectura de Von Neumann: la CPU trae y ejecuta instrucciones que leen y escriben celdas de memoria. Por eso su esencia es «el cálculo iterativo paso a paso y la asignación continua».","src":"S1 diap. 6","imp":1,"ficha":"ud1-013"},{"id":"p1-012","ud":1,"tema":"Paradigma imperativo","q":"¿Cuáles son los tres componentes vitales del paradigma imperativo según las diapositivas?","ops":["Celdas de memoria, asignación y repetición","Clases, herencia y polimorfismo","Hechos, reglas e inferencia lógica","Celdas de memoria, asignación y evaluación perezosa"],"why":"La diap. 6 da tres componentes vitales: celdas de memoria (variables, aliasing), asignación y repetición (loops). La evaluación perezosa pertenece al paradigma de formularios, y clases y herencia, a la orientación a objetos.","src":"S1 diap. 6","imp":1,"ficha":"ud1-015"},{"id":"p1-013","ud":1,"tema":"Paradigma imperativo","q":"Entre los componentes vitales del imperativo, ¿cuál describen las diapositivas como «operaciones que fuerzan el pensamiento adaptado a la máquina»?","ops":["La asignación","La repetición","Las celdas de memoria","El enlace dinámico"],"why":"Así define la diap. 6 la asignación. Las celdas de memoria son variables que almacenan valores (aliasing) y la repetición, secuencias de pasos elementales repetidos (loops). El enlace dinámico es un pilar de la orientación a objetos.","src":"S1 diap. 6","imp":2,"ficha":"ud1-017"},{"id":"p1-014","ud":1,"tema":"Paradigma imperativo","q":"Las diapositivas del imperativo comparan `x > y` con `if x>y then v:=true`. ¿Qué distinción ilustran?","ops":["Orientado a expresiones (matemáticas simples) frente a orientado a sentencias (adaptadas a la máquina)","Orientado a sentencias (matemáticas simples) frente a orientado a expresiones (adaptadas a la máquina)","Declarativo puro frente a demostrativo, según quién dicta el orden de evaluación","Una restricción que se satisface frente a una regla lógica que se demuestra"],"why":"En la diap. 6, `x > y` es una expresión (matemáticas simples) y `if x>y then v:=true`, una sentencia adaptada a la máquina, que asigna un valor a la variable `v`.","src":"S1 diap. 6","imp":2,"ficha":"ud1-019"},{"id":"p1-015","ud":1,"tema":"Paradigma imperativo","q":"¿Qué grupo de lenguajes pone el resumen de la unidad como ejemplo del paradigma imperativo?","ops":["C, Pascal, Modula-2 y Fortran","Haskell, Lisp y Hope","Java, C# y VB.NET","Pascal, Prolog, Modula-2 y Hope"],"why":"El resumen cita C, Pascal, Modula-2 y Fortran: instrucciones explícitas que modifican el estado con asignaciones, bucles y estructuras de control. Haskell, Lisp y Hope son funcionales; Java, C# y VB.NET, orientados a objetos.","src":"Resumen UD1 p. 2","imp":1,"ficha":"ud1-020"},{"id":"p1-016","ud":1,"tema":"Paradigma imperativo","q":"¿A qué paradigma pertenece este fragmento en C y qué concepto clave del procedimental ilustra?","ops":["Imperativo: efectos de lado; la celda `suma` se sobrescribe y su valor final es el resultado","Funcional: composición de funciones puras que no modifican ninguna variable externa","Lógico: hechos y reglas de los que se deduce el valor de `suma` por inferencia","Formularios: `suma` se calcula únicamente cuando alguien la demanda, por evaluación perezosa"],"why":"El resumen pone C como ejemplo de imperativo: asignaciones y bucles que cambian el estado. La celda `suma` pasa por 0, 1, 3, 6 y 10, y ese valor final es el resultado: los efectos de lado de la diap. 5.","src":"S1 diap. 5; Resumen UD1 p. 2","imp":1,"code":"int suma = 0;\nfor (int i = 1; i \u003c= 4; i++) {\n    suma = suma + i;\n}\n/* al terminar, suma vale 10 */","ficha":"ud1-012"},{"id":"p1-017","ud":1,"tema":"Orientación a objetos","q":"Según las diapositivas, ¿qué es un objeto?","ops":["Un elemento autónomo con nombre, estado (atributos) y servicios (métodos)","Una función matemática pura que no modifica variables externas","Un hecho o una regla que el motor de inferencia usa para deducir respuestas","Una celda de memoria que la ejecución sobrescribe paso a paso"],"why":"La diap. 7 define el objeto como un elemento autónomo con estado (atributos) y servicios (métodos), y lo dibuja como una caja con su nombre, los atributos que posee y los servicios que proporciona.","src":"S1 diap. 7","imp":1,"ficha":"ud1-022"},{"id":"p1-018","ud":1,"tema":"Orientación a objetos","q":"¿Qué pilares de la orientación a objetos enumeran las diapositivas?","ops":["Tipos abstractos de datos (clases), herencia, y polimorfismo y enlace dinámico","Celdas de memoria, asignación continua y repetición de pasos elementales (loops)","Inmutabilidad, funciones puras y composición funcional","Tipos abstractos de datos (clases), herencia y evaluación perezosa"],"why":"La diap. 7 da como pilares los tipos abstractos de datos (clases), la herencia y el polimorfismo con enlace dinámico. Celdas, asignación y repetición son los componentes vitales del imperativo; la evaluación perezosa es de formularios.","src":"S1 diap. 7","imp":1,"ficha":"ud1-023"},{"id":"p1-019","ud":1,"tema":"Orientación a objetos","q":"En el «problema de la carta», la Persona envía `Poner_Sello()` al Sobre y `Recibir_Carta()` al Buzón. ¿Qué idea ilustra?","ops":["Quien pide la acción solo necesita saber qué servicios pedir con mensajes, no cómo se ejecutan","La Persona hereda del Sobre y del Buzón todos los métodos que necesita para poder enviar la carta","El Sobre calcula su estado únicamente cuando la Persona lo demanda, por evaluación perezosa","La Persona aprende a enviar cartas observando ejemplos y generaliza después una regla"],"why":"La diap. 8 lo resume así: el solicitante no necesita conocer cómo el objeto ejecuta la acción, solo qué servicios pedirle mediante mensajes. No hay herencia: Persona, Sobre y Buzón son objetos distintos que se comunican.","src":"S1 diap. 8","imp":2,"ficha":"ud1-024"},{"id":"p1-020","ud":1,"tema":"Orientación a objetos","q":"¿Cuál de estos lenguajes pone el resumen de la unidad como ejemplo de lenguaje orientado a objetos?","ops":["VB.NET","Modula-2","Hope","Fortran"],"why":"El resumen cita como orientados a objetos, entre otros, Java, C# y VB.NET. Modula-2 y Fortran aparecen como ejemplos del imperativo, y Hope, del funcional.","src":"Resumen UD1 p. 2","imp":1,"ficha":"ud1-026"},{"id":"p1-021","ud":1,"tema":"Orientación a objetos","q":"Según el resumen, ¿qué ejemplos tiene el paradigma orientado a agentes, en el que los objetos actúan de forma autónoma?","ops":["JADE y AutoGen","Apache NiFi y Pentaho Data Integration","Haskell y Hope","Excel y JavaScript"],"why":"En el orientado a agentes los objetos actúan autónomamente para alcanzar una solución global o local; el resumen cita modelos multiagente como JADE (Java Agent Development Framework) y AutoGen. NiFi y Pentaho son ejemplos de dataflow.","src":"Resumen UD1 p. 2","imp":2,"ficha":"ud1-027"},{"id":"p1-022","ud":1,"tema":"Orientación a objetos","q":"¿A qué paradigma pertenece este fragmento Java y qué es la llamada `s.ponerSello()`?","ops":["Orientado a objetos: un mensaje que pide un servicio al objeto `s`","Funcional: una función pura que no cambia ningún estado del programa","Lógico: una consulta que el motor de inferencia intenta demostrar","Restricciones: una regla que el sistema debe satisfacer"],"why":"El resumen da Java como lenguaje orientado a objetos: `Sobre` tiene estado (`sellado`) y un servicio (`ponerSello`), y la Persona se lo pide con un mensaje, como en el problema de la carta. No es una función pura: cambia `sellado`.","src":"Resumen UD1 p. 2; S1 diap. 8","imp":1,"code":"class Sobre {\n    private boolean sellado = false;\n    void ponerSello() { sellado = true; }\n}\n\nclass Persona {\n    void enviar(Sobre s) {\n        s.ponerSello();\n    }\n}","ficha":"ud1-026"},{"id":"p1-023","ud":1,"tema":"Familia declarativa","q":"Según las diapositivas, ¿cuál es «el gran cambio» que introduce la familia declarativa?","ops":["Se especifica qué debe tener la solución, no los pasos, y desaparecen los efectos de lado","Se siguen describiendo los pasos etapa a etapa, pero sin usar variables ni celdas de memoria","Se parte de ejemplos particulares para inferir una regla general, de abajo arriba (bottom-up)","Se agrupan los datos y sus métodos en objetos autónomos que se comunican mediante mensajes"],"why":"La diap. 9: especificar QUÉ debe tener la solución, no los pasos; se elimina la necesidad de describir el control de flujo y desaparecen los efectos de lado. Las variables siguen existiendo, pero no actualizan estados previos.","src":"S1 diap. 9","imp":1,"ficha":"ud1-028"},{"id":"p1-024","ud":1,"tema":"Familia declarativa","q":"La diapositiva de la familia declarativa enfrenta `x = x + 1` con `y = f(x)`. ¿Qué contraste muestra?","ops":["`x = x + 1`: el programador muta el estado (cómo); `y = f(x)`: relación matemática inmutable (qué)","`x = x + 1`: relación matemática inmutable (qué); `y = f(x)`: el programador muta el estado (cómo)","Las dos expresiones mutan el estado de la misma celda; difieren únicamente en la sintaxis","`x = x + 1`: una restricción que se satisface; `y = f(x)`: una regla aprendida de ejemplos"],"why":"En `x = x + 1` la misma celda cambia de valor: el programador muta el estado y dice cómo. En `y = f(x)` el sistema resuelve una relación matemática inmutable: se dice qué. Es el paso de lo procedimental a lo declarativo.","src":"S1 diap. 9","imp":1,"ficha":"ud1-030"},{"id":"p1-025","ud":1,"tema":"Familia declarativa","q":"Según el resumen, ¿qué características principales tiene el paradigma funcional?","ops":["No tiene efectos secundarios y se centra en la inmutabilidad y la composición funcional","Define hechos y reglas para resolver problemas mediante inferencias lógicas","Organiza el código en clases y objetos con herencia (simple o múltiple) y polimorfismo","Usa variables, punteros y direcciones de memoria que modifica paso a paso"],"why":"El funcional se basa en funciones matemáticas puras: no modifica variables externas (sin efectos secundarios) y se centra en la inmutabilidad y la composición funcional. Definir hechos y reglas es lo propio del lógico.","src":"Resumen UD1 p. 3","imp":2,"ficha":"ud1-033"},{"id":"p1-026","ud":1,"tema":"Familia declarativa","q":"¿Cuál de estos lenguajes **NO** aparece en el resumen como ejemplo del paradigma funcional?","ops":["Prolog","Haskell","Lisp","Hope"],"why":"El resumen da Haskell, Lisp y Hope como ejemplos del funcional, basado en funciones matemáticas puras. Prolog es el ejemplo del paradigma lógico, basado en predicados, hechos y reglas.","src":"Resumen UD1 p. 3","imp":1,"ficha":"ud1-032"},{"id":"p1-027","ud":1,"tema":"Familia declarativa","q":"¿A qué paradigma pertenece este fragmento y cómo obtiene la respuesta a la consulta?","ops":["Lógico: deduce Q a partir de los hechos y la regla por inferencia","Funcional: evalúa una composición de funciones matemáticas puras sin estado","Imperativo: asigna valores a Q dentro de un bucle paso a paso","Orientado a objetos: envía el mensaje abuelo al objeto juan"],"why":"Es Prolog, el ejemplo de paradigma lógico del resumen: define hechos (`padre`) y una regla (`abuelo`), y la respuesta (`Q = luis`) se obtiene por inferencia lógica, sin indicar los pasos.","src":"Resumen UD1 p. 3","imp":1,"code":"padre(juan, ana).\npadre(ana, luis).\nabuelo(X, Z) :- padre(X, Y), padre(Y, Z).\n\n?- abuelo(juan, Q).","ficha":"ud1-034"},{"id":"p1-028","ud":1,"tema":"Familia declarativa","q":"Según el resumen de la unidad, ¿a qué paradigma pertenece este fragmento Lisp?","ops":["Funcional: aplica una función pura a cada elemento sin modificar variables","Lógico: demuestra el objetivo `cuadrado` a partir de hechos y reglas","Imperativo: recorre la lista sobrescribiendo una celda de memoria","Orientado a objetos: envía el mensaje `cuadrado` a cada objeto de la lista"],"why":"El resumen pone Lisp, junto a Haskell y Hope, como ejemplo del funcional, basado en funciones matemáticas puras. `cuadrado` no cambia ningún estado y `mapcar` la aplica a cada elemento: (1 4 9).","src":"Resumen UD1 p. 3","imp":1,"code":"(defun cuadrado (x)\n  (* x x))\n\n(mapcar #'cuadrado '(1 2 3))\n;; => (1 4 9)","ficha":"ud1-032"},{"id":"p1-029","ud":1,"tema":"Transformación de estados","q":"En el paradigma de transformación de estados, ¿a qué se traduce resolver un problema?","ops":["A encontrar el camino más corto en un grafo de estados generados","A resolver un sistema de ecuaciones interdependientes entre celdas","A buscar cualquier estado que satisfaga inecuaciones y límites","A inferir una regla general a partir de ejemplos particulares"],"why":"Unos datos iniciales se transforman hasta un estado final mediante reglas u operadores, y el problema es hallar el camino más corto en el grafo de estados (el puzle 3×3 de la diap. 10). Las ecuaciones interdependientes son de formularios.","src":"S1 diap. 10","imp":1,"ficha":"ud1-035"},{"id":"p1-030","ud":1,"tema":"Transformación de estados","q":"¿Qué estrategia de búsqueda en grafos recorre el árbol horizontalmente, nivel a nivel?","ops":["Amplitud","Profundidad (LIFO)","Backtracking","Mejor primero (A*)"],"why":"La búsqueda en amplitud recorre el árbol horizontalmente, por niveles. La de profundidad (LIFO), en cambio, baja verticalmente por una rama hasta el final antes de pasar a otra.","src":"S1 diap. 11","imp":2,"ficha":"ud1-038"},{"id":"p1-031","ud":1,"tema":"Transformación de estados","q":"¿Qué pareja estrategia–descripción es correcta según la diapositiva de búsqueda en grafos?","ops":["Profundidad (LIFO): explora las ramas verticalmente hasta el final","Amplitud: retrocede cuando llega a un callejón sin salida","Backtracking: recorre el árbol horizontalmente por niveles","Profundidad (LIFO): elige el nodo con mejor valor heurístico"],"why":"En la diap. 11, profundidad (LIFO) explora las ramas verticalmente; amplitud recorre por niveles; backtracking retrocede ante un callejón sin salida, y mejor primero (A*) usa la heurística f(n) = g(n) + h(n).","src":"S1 diap. 11","imp":2,"ficha":"ud1-037"},{"id":"p1-032","ud":1,"tema":"Transformación de estados","q":"En la estrategia Mejor primero (A*), ¿qué guía la elección del siguiente nodo?","ops":["Una heurística: f(n) = g(n) + h(n)","El orden LIFO de una pila, sin heurística","El nivel del árbol, de izquierda a derecha","La vuelta atrás cada vez que halla un callejón sin salida"],"why":"Mejor primero (A*) se guía por la heurística f(n) = g(n) + h(n). El orden LIFO es el de la búsqueda en profundidad, recorrer por niveles es la amplitud y volver atrás ante un callejón sin salida es el backtracking.","src":"S1 diap. 11","imp":2,"ficha":"ud1-040"},{"id":"p1-033","ud":1,"tema":"Formularios y restricciones","q":"¿En qué se basa el paradigma de formularios según las diapositivas?","ops":["En la resolución de sistemas de ecuaciones interdependientes","En una secuencia de asignaciones ejecutada etapa a etapa","En hallar el camino más corto en un grafo de estados","En generalizar una regla a partir de ejemplos observados"],"why":"La diap. 12 lo define como basado en la resolución de sistemas de ecuaciones interdependientes, como las celdas de una hoja de cálculo que dependen unas de otras. El camino más corto en un grafo es la transformación de estados.","src":"S1 diap. 12","imp":1,"ficha":"ud1-041"},{"id":"p1-034","ud":1,"tema":"Formularios y restricciones","q":"En una hoja de cálculo, la celda F7 depende de D3 y E3 y solo se calcula cuando se necesita su valor. ¿Cómo llaman a esto las diapositivas?","ops":["Evaluación perezosa","Efecto de lado (side effect)","Backtracking","Enlace dinámico"],"why":"La diap. 12 lo anota sobre la hoja: «Evaluación perezosa: F7 solo se calcula cuando se demanda». Encaja con que el paradigma de formularios está dirigido por la demanda.","src":"S1 diap. 12","imp":2,"ficha":"ud1-043"},{"id":"p1-035","ud":1,"tema":"Formularios y restricciones","q":"¿Qué significa que el paradigma de formularios esté «dirigido por la demanda»?","ops":["Que una operación solo se ejecuta si todos sus operandos están disponibles","Que las celdas se recalculan en un orden fijo, de arriba abajo y por filas","Que el usuario escribe el control de flujo de cada fórmula paso a paso","Que el sistema genera las fórmulas observando las acciones del usuario"],"why":"Dirigido por la demanda: una operación solo se ejecuta si todos sus operandos están disponibles; no hay un orden fijo escrito por el usuario. Generar programas observando acciones repetitivas es la programación asistida, del enfoque demostrativo.","src":"S1 diap. 12","imp":2,"ficha":"ud1-042"},{"id":"p1-036","ud":1,"tema":"Formularios y restricciones","q":"Según las diapositivas, ¿de qué es núcleo el paradigma de formularios, cuyo ejemplo típico es una hoja de cálculo como Excel?","ops":["Del Desarrollo de Usuario Final (EUD)","De la programación lineal con inecuaciones","De la arquitectura de Von Neumann","De la programación asistida"],"why":"La diap. 12 dice que el paradigma de formularios «es el núcleo del Desarrollo de Usuario Final (EUD)». La programación lineal es el objetivo típico del modelado por restricciones, y la programación asistida, del enfoque demostrativo.","src":"S1 diap. 12; Resumen UD1 p. 3","imp":2,"ficha":"ud1-044"},{"id":"p1-037","ud":1,"tema":"Formularios y restricciones","q":"Hay que minimizar costes de transporte con un inventario limitado, expresando las relaciones entre variables con inecuaciones y límites. ¿Qué paradigma de las diapositivas lo modela?","ops":["El modelado por restricciones","La transformación de estados","El paradigma de formularios","El enfoque demostrativo (bottom-up)"],"why":"Es el ejemplo de la diap. 13: con inecuaciones y límites, el sistema busca cualquier estado que satisfaga todas las reglas y, como en la programación lineal, maximiza o minimiza recursos hasta el punto óptimo.","src":"S1 diap. 13","imp":1,"ficha":"ud1-045"},{"id":"p1-038","ud":1,"tema":"Demostrativo y otros","q":"¿En qué consiste el enfoque demostrativo (bottom-up) según las diapositivas?","ops":["En partir de ejemplos particulares para inferir una regla o comportamiento","En abstraer primero un modelo general y refinarlo después (top-down)","En describir etapa a etapa cómo obtener la solución con asignaciones","En expresar la solución mediante inecuaciones y buscar después el punto óptimo"],"why":"La diap. 14: en lugar de abstraer un modelo general (top-down), se parte de ejemplos particulares para inferir una regla o comportamiento. Abajo están los datos particulares y arriba, la solución general (el programa).","src":"S1 diap. 14","imp":1,"ficha":"ud1-048"},{"id":"p1-039","ud":1,"tema":"Demostrativo y otros","q":"Un sistema observa que el usuario repite una y otra vez las mismas acciones y genera por su cuenta un programa invisible que las automatiza. ¿Qué es, según las diapositivas?","ops":["Programación asistida","Transformación de estados","Modelado por restricciones","Orientación a objetos"],"why":"La diap. 14 incluye en el enfoque demostrativo la programación asistida: el sistema observa acciones repetitivas y genera un programa invisible. La otra variante son los sistemas que infieren, como las redes neuronales.","src":"S1 diap. 14","imp":2,"ficha":"ud1-050"},{"id":"p1-040","ud":1,"tema":"Demostrativo y otros","q":"Según el resumen, ¿a qué paradigma pertenecen Apache NiFi y Pentaho Data Integration?","ops":["Al paradigma dataflow","Al orientado a eventos","Al orientado a agentes","Al basado en formularios"],"why":"El resumen, en «Otros paradigmas», pone Apache NiFi y Pentaho Data Integration como ejemplos del paradigma dataflow. Para los agentes cita JADE y AutoGen, y para formularios, las hojas de cálculo.","src":"Resumen UD1 p. 3","imp":2,"ficha":"ud1-052"},{"id":"p1-041","ud":1,"tema":"Demostrativo y otros","q":"Según el resumen, ¿en qué paradigma el estado del sistema lo determinan los sucesos que ocurren y cómo se manejan?","ops":["En el orientado a eventos","En el dataflow","En el orientado a agentes","En el de transformación de estados"],"why":"El resumen define así el orientado a eventos y da como ejemplos Excel, JavaScript y C#. En la transformación de estados el estado cambia por reglas u operadores hasta una meta, no por sucesos que haya que manejar.","src":"Resumen UD1 p. 4","imp":2,"ficha":"ud1-053"},{"id":"p1-042","ud":1,"tema":"Espectro y elección","q":"En la diapositiva «¿Quién dicta la secuencia de control?», ¿qué criterio ordena el espectro de los paradigmas?","ops":["La dependencia del orden de evaluación","La cercanía del lenguaje al hardware","El número de componentes reutiliz
