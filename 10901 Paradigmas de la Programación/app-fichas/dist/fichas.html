ables","La capacidad de aprender de ejemplos"],"why":"La diap. 15: «La clasificación se define por la dependencia del orden de evaluación». Va del control explícito (procedimentales) a la especificación abstracta (declarativos puros), pasando por ecuaciones/flujo.","src":"S1 diap. 15","imp":1,"ficha":"ud1-054"},{"id":"p1-043","ud":1,"tema":"Espectro y elección","q":"En el espectro de los paradigmas, ¿dónde se sitúan el imperativo y la POO y qué los caracteriza?","ops":["En el control explícito, con alto acoplamiento a efectos de lado","En la especificación abstracta, donde el orden de evaluación es irrelevante","En ecuaciones/flujo, con la secuencia de control parcialmente requerida","En el control explícito, donde el orden de evaluación es irrelevante"],"why":"Los procedimentales (imperativo, POO) ocupan el extremo del control explícito: el programador dicta la secuencia y hay alto acoplamiento a efectos de lado. Que el orden sea irrelevante es lo propio de los declarativos puros.","src":"S1 diap. 15","imp":1,"ficha":"ud1-055"},{"id":"p1-044","ud":1,"tema":"Espectro y elección","q":"¿Por qué el espectro de las diapositivas llama «seudodeclarativos» al funcional y al lógico?","ops":["Porque en ellos la secuencia de control sigue siendo parcialmente requerida","Porque mantienen un alto acoplamiento a los efectos de lado","Porque en ellos el orden de evaluación es del todo irrelevante","Porque aprenden el método de control a partir de ejemplos particulares (bottom-up)"],"why":"Funcional y lógico están en el tramo central (ecuaciones/flujo): son seudodeclarativos porque la secuencia de control aún está parcialmente requerida. Solo en los declarativos puros (restricciones) el orden de evaluación es irrelevante.","src":"S1 diap. 15","imp":1,"ficha":"ud1-056"},{"id":"p1-045","ud":1,"tema":"Espectro y elección","q":"Según el espectro de las diapositivas, ¿qué paradigma es un «declarativo puro», en el que el orden de evaluación es irrelevante?","ops":["El de restricciones","El funcional","El lógico","El orientado a objetos"],"why":"En el extremo de la especificación abstracta, la diap. 15 pone los declarativos puros: las restricciones. Aunque el resumen llame declarativos al funcional y al lógico, el espectro los sitúa en el tramo central, como seudodeclarativos.","src":"S1 diap. 15","imp":1,"ficha":"ud1-057"},{"id":"p1-046","ud":1,"tema":"Espectro y elección","q":"Según la diapositiva «El mapa no es el territorio, es la brújula», ¿de qué depende la efectividad de un paradigma?","ops":["De su alineación con la naturaleza del problema","De su cercanía al hardware de la máquina","De lo reciente que sea el lenguaje que lo implementa","De cuántos efectos de lado consiga eliminar"],"why":"La diap. 16: ningún paradigma es inherentemente mejor que otro; su efectividad radica en su alineación con la naturaleza del problema. Por eso elegir la arquitectura correcta es el paso crítico antes de trazar el plano metodológico.","src":"S1 diap. 16","imp":1,"ficha":"ud1-058"},{"id":"p1-047","ud":1,"tema":"Estado del arte 2025–26","q":"Según el documento «Estado del arte de los paradigmas de programación (2025–2026)», ¿cuál es la tendencia dominante?","ops":["Combinar paradigmas según la capa y el problema: un multiparadigma pragmático","Sustituir la orientación a objetos por la programación funcional en todo el sistema","Volver a elegir un único paradigma por proyecto para simplificar el diseño","Abandonar los enfoques declarativos en favor de la programación reactiva"],"why":"El documento dice que la tendencia no es «FP vs OOP», sino cómo combinarlos: OOP en el dominio, FP en la lógica de negocio, reactiva para los eventos y enfoques declarativos para las consultas. Se elige según el problema, no por lealtad ideológica.","src":"Estado del arte p. 1","imp":2,"ficha":"ud1-060"},{"id":"p1-048","ud":1,"tema":"Estado del arte 2025–26","q":"En la arquitectura multiparadigma típica que describe el estado del arte 2025–2026, ¿qué reparto por capas es el correcto?","ops":["Dominio con OOP, lógica de negocio con FP y eventos/streams con programación reactiva","Dominio con FP, lógica de negocio con OOP y eventos/streams con programación reactiva","Dominio con OOP, lógica de negocio con programación reactiva y eventos/streams con FP","Dominio con programación reactiva, lógica de negocio con OOP y eventos/streams con FP"],"why":"El documento asigna la OOP al dominio (entidades con identidad, como Usuario u Orden), la FP a la lógica de negocio (transformaciones sin estado) y la reactiva a eventos y streams. Los datos van con consultas declarativas como SQL.","src":"Estado del arte p. 3","imp":2,"ficha":"ud1-061"},{"id":"p1-049","ud":1,"tema":"Estado del arte 2025–26","q":"¿Qué limitaciones de la orientación a objetos reconoce el documento del estado del arte 2025–2026?","ops":["El acoplamiento por herencia, el estado mutable compartido y el boilerplate","La falta de encapsulamiento, de polimorfismo y de abstracción","La dificultad para modelar entidades con identidad y ciclo de vida en dominios ricos","La ausencia de estado, que complica los sistemas empresariales"],"why":"El documento reconoce el acoplamiento por herencia, el estado mutable compartido (que complica la concurrencia) y el boilerplate; por eso hoy se favorece la composición sobre la herencia. Encapsulamiento, polimorfismo y abstracción siguen siendo fortalezas.","src":"Estado del arte p. 1","imp":2,"ficha":"ud1-062"},{"id":"p1-050","ud":1,"tema":"Estado del arte 2025–26","q":"Según el documento del estado del arte, ¿con qué enfoque se clasifica una consulta como esta?","ops":["Declarativo: se especifica qué datos recuperar, no cómo buscarlos","Imperativo: se indica paso a paso cómo recorrer la tabla","Orientado a objetos: se envía un mensaje al objeto producto","Demostrativo: el sistema aprende la consulta a partir de ejemplos"],"why":"El documento pone SQL como ejemplo de enfoque declarativo: en la capa de datos, las consultas declarativas especifican «qué» recuperar. La consulta no dice cómo recorrer la tabla.","src":"Estado del arte pp. 1 y 3","imp":2,"code":"SELECT nombre, precio\nFROM producto\nWHERE precio \u003c 20\nORDER BY precio;","ficha":"ud1-061"},{"id":"p2-001","ud":2,"tema":"Origen y enfoque","q":"¿Qué modelo matemático, creado para estudiar la computabilidad, es la base teórica del paradigma funcional?","ops":["El cálculo lambda de Alonzo Church","La arquitectura de von Neumann","La lógica de predicados de primer orden","El álgebra de Boole"],"why":"El funcional nace del cálculo lambda de Alonzo Church: programar es evaluar expresiones. La arquitectura de von Neumann (un procesador y memoria) es el modelo del procedimental, y la lógica de predicados, la base del paradigma lógico.","src":"Libro cap. 2 p. 1; Clase UD2 min. 01:52","imp":1,"ficha":"ud2-001"},{"id":"p2-002","ud":2,"tema":"Origen y enfoque","q":"¿Qué pregunta responde cada enfoque: el procedimental (imperativo) y el declarativo (funcional)?","ops":["Procedimental: cómo resolver el problema; declarativo: qué se quiere conseguir","Procedimental: qué se quiere conseguir; declarativo: cómo resolver el problema","Procedimental: con qué datos se trabaja; declarativo: en qué orden se ejecuta","Los dos responden a cómo resolverlo, pero con una sintaxis distinta"],"why":"El procedimental fija paso a paso cómo resolver el problema (if, while, for, gestión de la memoria). El declarativo describe qué se quiere obtener y evalúa expresiones en lugar de ejecutar comandos.","src":"Clase UD2 min. 03:24; Libro cap. 2 p. 1","imp":1,"ficha":"ud2-002"},{"id":"p2-003","ud":2,"tema":"Origen y enfoque","q":"Según la clase, ¿por qué el paradigma procedimental se impuso al principio y hoy se está retomando el funcional?","ops":["El hardware inicial era limitado y el funcional pide más; hoy hay multinúcleo y más memoria","Al principio el funcional no tenía lenguajes propios; hoy ya existen Lisp, Hope y Haskell","El funcional necesitaba punteros a función, que el hardware antiguo no admitía","El procedimental evitaba los efectos laterales; hoy ya no hace falta evitarlos"],"why":"Los primeros ordenadores seguían el modelo de von Neumann (un procesador, poca memoria), que encaja con el procedimental; el funcional demanda más hardware. Hoy, con varios núcleos y mucha memoria, esa limitación ya no existe.","src":"Clase UD2 min. 03:24 y 04:55","imp":2,"ficha":"ud2-003"},{"id":"p2-004","ud":2,"tema":"Origen y enfoque","q":"Según el libro, ¿en qué estriba fundamentalmente la diferencia entre especificar una función de forma procedimental o de forma declarativa?","ops":["En si se especifica explícitamente la secuencia de ejecución","En si la función devuelve el resultado por su nombre o por un argumento","En si el problema se resuelve con recursividad o con bucles","En si los argumentos se evalúan antes o después de la llamada"],"why":"La distinción estriba en si se especifica explícitamente la secuencia de ejecución: en el estilo procedimental el desarrollador fija el orden; en el declarativo la función es un conjunto de transformaciones sin orden de ejecución.","src":"Libro cap. 2 p. 5 y 25","imp":1,"ficha":"ud2-004"},{"id":"p2-005","ud":2,"tema":"Origen y enfoque","q":"El libro considera procedimental la especificación `par(x) = if ((x - (x//2)*2) == 0) then true else false`. ¿Por qué?","ops":["Porque indica el orden de ejecución de las sentencias","Porque usa la división entera // en lugar de la función resto","Porque modifica el valor de x durante el cálculo","Porque devuelve el resultado a través de un argumento"],"why":"Indica el orden: primero se evalúa la condición y luego una rama; ese orden impuesto origina una sobrespecificación. La versión declarativa son dos transformaciones disjuntas sin orden: resto(x,2)==0 → true; resto(x,2)!=0 → false.","src":"Libro cap. 2 p. 3–4","imp":2,"ficha":"ud2-006"},{"id":"p2-006","ud":2,"tema":"Pilares del paradigma","q":"¿Cuál de los siguientes conceptos **NO** es una de las características (pilares) del paradigma funcional?","ops":["Las mónadas","La transparencia referencial","Las funciones de orden superior","La composición funcional"],"why":"Las mónadas no son una característica básica: son elementos encapsulados que aportan rasgos procedimentales (como la E/S) sin perder los beneficios del paradigma. Las otras tres son pilares en el libro, en la clase y en la guía.","src":"Libro cap. 2 p. 5 y 26; Clase UD2 min. 06:30","imp":1,"ficha":"ud2-042"},{"id":"p2-007","ud":2,"tema":"Pilares del paradigma","q":"¿Cómo se denomina la característica por la que una función, para unos mismos valores de entrada, solo puede producir un único valor de salida?","ops":["Transparencia referencial","Evaluación diferida","Polimorfismo paramétrico","Composición funcional"],"why":"Es la transparencia referencial: la función se comporta como una función matemática, una caja negra determinista. La evaluación diferida trata de cuándo se evalúan los argumentos, no de qué devuelve la función.","src":"Libro cap. 2 p. 5 y 26; Clase UD2 min. 09:42","imp":1,"ficha":"ud2-008"},{"id":"p2-008","ud":2,"tema":"Pilares del paradigma","q":"Si y = f(x) y z = g(y), el programa calcula z = g(f(x)): el resultado de una función es el argumento de entrada de otra. ¿Qué característica es?","ops":["La composición funcional","Las funciones de orden superior","La currificación","La evaluación diferida"],"why":"Componer es encadenar funciones: la salida de f es la entrada de g. No es orden superior, porque g recibe el valor que devuelve f, no la propia función f.","src":"Libro cap. 2 p. 8; Clase UD2 min. 14:26","imp":1,"ficha":"ud2-009"},{"id":"p2-009","ud":2,"tema":"Pilares del paradigma","q":"¿Qué caracteriza a una función de orden superior?","ops":["Que sus argumentos y su valor de retorno pueden ser otras funciones","Que se llama a sí misma hasta llegar a un caso base","Que admite argumentos de distintos tipos manteniendo la misma ejecución","Que evalúa sus argumentos cuando el cuerpo los necesita"],"why":"Una función de orden superior (o de primera clase) recibe funciones como argumento o devuelve una función. Llamarse a sí misma es recursividad, y aceptar distintos tipos con la misma ejecución es polimorfismo paramétrico.","src":"Libro cap. 2 p. 9 y 26","imp":1,"ficha":"ud2-010"},{"id":"p2-010","ud":2,"tema":"Pilares del paradigma","q":"En el paradigma funcional «no existe el concepto de estado». ¿Qué significa?","ops":["Que no hay celdas de memoria que se modifiquen; los cálculos intermedios son valores locales","Que el programa no guarda datos en memoria: los cálculos se hacen en los registros del procesador","Que las variables pueden cambiar de valor dentro de un bucle for o while","Que cada función conserva su último resultado en una variable static entre llamadas"],"why":"No hay celda de memoria donde los datos se almacenen y se transformen: hay valores locales que guardan los cálculos intermedios. Por eso no hay asignaciones destructivas (a ← b) ni procesos iterativos (do, while, for).","src":"Libro cap. 2 p. 11; Clase UD2 min. 18:11","imp":1,"ficha":"ud2-011"},{"id":"p2-011","ud":2,"tema":"Transparencia referencial","q":"¿Qué imprime este código y qué propiedad incumple `sumar-a-total`?","ops":["`5` y `10`: incumple la transparencia referencial","`5` y `5`: es una función pura, sin efectos laterales","`0` y `5`: incumple la transparencia referencial","`5` y `10`: incumple el polimorfismo paramétrico"],"why":"`setf` modifica la global `*total*` y devuelve el valor nuevo: 5 y luego 10. La misma llamada con el mismo argumento da resultados distintos por un efecto lateral, así que no hay transparencia referencial.","src":"Guía Lisp p. 5; Libro cap. 2 p. 5","imp":1,"code":"(defvar *total* 0)\n(defun sumar-a-total (x)\n  (setf *total* (+ *total* x)))\n(print (sumar-a-total 5))\n(print (sumar-a-total 5))","ficha":"ud2-015"},{"id":"p2-012","ud":2,"tema":"Transparencia referencial","q":"En C++, `void cuadrado(int x, int &y) { y = x*x; }` siempre calcula lo mismo y, aun así, el libro dice que no tiene transparencia referencial. ¿Por qué?","ops":["Porque devuelve el resultado mediante un argumento y no por el nombre de la función","Porque usa una variable static que cambia de valor entre una llamada y la siguiente","Porque la multiplicación de enteros no es una función pura en C++","Porque no tiene caso base y la recursión no terminaría"],"why":"Con transparencia referencial, el resultado se devuelve únicamente por el nombre de la función. Aquí se devuelve modificando y, un argumento pasado por referencia; debería ser cuadrado(x) = x*x.","src":"Libro cap. 2 p. 6","imp":1,"ficha":"ud2-008"},{"id":"p2-013","ud":2,"tema":"Transparencia referencial","q":"¿Cuál de estas situaciones **NO** provoca un efecto lateral?","ops":["Calcular el resultado solo a partir de los argumentos y devolverlo","Modificar una variable global dentro de la función","Modificar un argumento pasado por referencia","Usar una variable static que conserva su valor de una llamada a otra"],"why":"Una función que solo depende de sus argumentos y devuelve el resultado es pura. Modificar globales o argumentos por referencia, las variables static y la E/S son los casos de efecto lateral que dan el libro y la clase.","src":"Libro cap. 2 p. 5–7; Clase UD2 min. 12:51","imp":1,"ficha":"ud2-015"},{"id":"p2-014","ud":2,"tema":"Transparencia referencial","q":"En el ejemplo del libro, `fun` usa la variable global `sw` y `fun(2)+fun(3)` no da lo mismo que `fun(3)+fun(2)`. ¿Cuál es la causa?","ops":["La asignación `sw = !sw`, que cambia la global en cada llamada","Que la suma de enteros no es conmutativa en C++","Que `fun` es recursiva y va acumulando las llamadas en la pila del programa","Que `fun` está sobrecargada para int y para float"],"why":"El libro lo atribuye a `sw = !sw`: cada llamada cambia la global y, con ella, el resultado de la siguiente. Es un efecto lateral: `fun` no tiene transparencia referencial y la suma deja de ser conmutativa.","src":"Libro cap. 2 p. 5–6; Clase UD2 min. 11:15","imp":2,"ficha":"ud2-017"},{"id":"p2-015","ud":2,"tema":"Composición y orden superior","q":"¿Qué devuelve esta expresión, en la que la salida de una función es la entrada de otra?","ops":["`14`","`36`","`(1 4 9)`","`6`"],"why":"mapcar eleva al cuadrado cada elemento: (1 4 9). reduce los combina con + hasta un único valor: 1 + 4 + 9 = 14. 36 sería (1 + 2 + 3)², es decir, sumar primero y elevar después.","src":"Guía Lisp p. 6–7","imp":2,"code":"(reduce #'+\n        (mapcar (lambda (x) (* x x))\n                '(1 2 3)))","ficha":"ud2-020"},{"id":"p2-016","ud":2,"tema":"Composición y orden superior","q":"Los lenguajes imperativos también admiten expresiones como `suma(cuadrado(mayor(x,y)))`. ¿Qué hace falta para que esa composición dé resultados adecuados?","ops":["Que las funciones tengan transparencia referencial","Que las funciones sean recursivas","Que las funciones tengan polimorfismo paramétrico","Que los argumentos se evalúen de forma diferida"],"why":"El libro lo dice expresamente: la composición solo da resultados adecuados si las funciones tienen transparencia referencial, porque así se pueden sustituir iguales por iguales.","src":"Libro cap. 2 p. 8–9; Clase UD2 min. 14:26","imp":1,"ficha":"ud2-019"},{"id":"p2-017","ud":2,"tema":"Composición y orden superior","q":"¿Sería válido utilizar un puntero en el paradigma funcional?","ops":["No, porque un puntero incorpora el concepto de estado de memoria","Sí, porque es la forma natural de pasar funciones como argumento","Sí, cuando apunta a una función y no a un dato","No, porque un puntero impide usar la recursividad"],"why":"Es una pregunta de autocomprobación del libro: el puntero incorpora el estado de memoria, que no es válido en el paradigma. En C el orden superior se simula con punteros a función; en los lenguajes funcionales es nativo.","src":"Libro cap. 2 p. 10 y 26; Clase UD2 min. 16:23","imp":1,"ficha":"ud2-022"},{"id":"p2-018","ud":2,"tema":"Composición y orden superior","q":"Una función cuyos parámetros y valor de retorno no son funciones se denomina…","ops":["Función de primer orden","Función de orden superior","Función de primera clase","Función funcional"],"why":"El libro llama función de primer orden a la que no recibe ni devuelve funciones. «De orden superior», «de primera clase» y «funcional» son tres nombres de lo contrario: la que sí admite funciones como argumento o resultado.","src":"Libro cap. 2 p. 9","imp":1,"ficha":"ud2-010"},{"id":"p2-019","ud":2,"tema":"Estado y recursividad","q":"¿Qué devuelve la última llamada?","ops":["`(2 4 6)`","`(1 3 5)`","`(2)`","`12`"],"why":"Caso base: lista vacía → nil. Si la cabeza es par, se conserva con cons y se sigue con la cola; si no, se salta. Recorre toda la lista sin parar en el primer par: filtra (2 4 6).","src":"Guía Lisp p. 5–6; Clase UD2 min. 20:00","imp":1,"code":"(defun f (l)\n  (cond ((null l) nil)\n        ((evenp (car l))\n         (cons (car l) (f (cdr l))))\n        (t (f (cdr l)))))\n(f '(1 2 3 4 5 6))","ficha":"ud2-024"},{"id":"p2-020","ud":2,"tema":"Estado y recursividad","q":"¿Qué imprime este código y por qué no sigue el paradigma funcional?","ops":["`6`, porque `setq` hace una asignación destructiva","`5`, porque en Lisp las variables no se pueden modificar","`6`, porque `setq` crea una ligadura local nueva, como `let`","Da error, porque `setq` tiene que ir dentro de un `loop`"],"why":"`setq` sustituye el valor de `*x*` por 6: es una asignación destructiva, como x = x + 1. El libro dice que SET y SETQ no son declarativas; Lisp las admite porque es un lenguaje híbrido.","src":"Libro cap. 2 p. 11 y 22","imp":1,"code":"(defparameter *x* 5)\n(setq *x* (+ *x* 1))\n(print *x*)","ficha":"ud2-023"},{"id":"p2-021","ud":2,"tema":"Estado y recursividad","q":"El factorial en C++ del libro usa `while (x > 0) { total *= x; x--; }`. ¿Qué dos elementos lo alejan del paradigma funcional?","ops":["La asignación destructiva y el proceso iterativo","La recursividad y el caso base","La evaluación ansiosa y la sobrecarga","El tipo long y la función main"],"why":"`total *= x` y `x--` mutan variables (asignación destructiva) dentro de un while (proceso iterativo): justo lo que el funcional no permite. La versión funcional es recursiva: x * factorial(x-1), con caso base 1.","src":"Libro cap. 2 p. 11","imp":1,"ficha":"ud2-023"},{"id":"p2-022","ud":2,"tema":"Estado y recursividad","q":"Una función recursiva debe devolver la posición del primer número par de una lista sin mutar ningún contador. ¿Cómo lo resuelve la guía de Lisp?","ops":["Con un parámetro acumulador que se pasa incrementado en cada llamada","Con una variable global que se va incrementando con `setf` en cada llamada","Con un bucle `loop` que recorre la lista","Con una variable static dentro de la función"],"why":"primer-par-pos usa `&optional (pos 1)`: cada llamada recursiva recibe `(+ pos 1)`, así que el contador viaja como argumento y no se modifica nada. Una global con setf sería un efecto lateral.","src":"Guía Lisp p. 3 y 6","imp":2,"ficha":"ud2-026"},{"id":"p2-023","ud":2,"tema":"Polimorfismo","q":"¿Qué devuelve la última llamada y qué tipo de polimorfismo muestra `primeros`?","ops":["`((1 2) \"hola\")`: polimorfismo paramétrico","`((1 2) \"hola\")`: polimorfismo de sobrecarga","`(1 2 \"hola\")`: polimorfismo paramétrico","Error, porque la lista mezcla tipos de datos"],"why":"Toma los 2 primeros elementos sin mirar su tipo: una sublista y una cadena. Una sola definición sirve para cualquier tipo: polimorfismo paramétrico, natural en el funcional. Sobrecarga sería tener varias versiones con el mismo nombre.","src":"Guía Lisp p. 7; Libro cap. 2 p. 14–15","imp":1,"code":"(defun primeros (n l)\n  (if (or (\u003c= n 0) (null l))\n      nil\n      (cons (car l)\n            (primeros (- n 1) (cdr l)))))\n(primeros 2 '((1 2) \"hola\" b))","ficha":"ud2-031"},{"id":"p2-024","ud":2,"tema":"Polimorfismo","q":"¿Cuáles son los tres tipos de polimorfismo que describe el libro?","ops":["Sobrecarga, polimorfismo dinámico y paramétrico","Sobrecarga, herencia múltiple y encapsulación de datos","Polimorfismo paramétrico, ansioso y diferido","Polimorfismo estático, dinámico y monomórfico"],"why":"Son la sobrecarga (ad hoc), el polimorfismo dinámico (o inclusión paramétrica) y el paramétrico (genericidad). Ansioso y diferido son tipos de evaluación, y monomórfico es lo contrario del polimorfismo: lenguajes como Pascal.","src":"Libro cap. 2 p. 12; Clase UD2 min. 22:45","imp":1,"ficha":"ud2-027"},{"id":"p2-025","ud":2,"tema":"Polimorfismo","q":"`imprimir(int)`, `imprimir(char)` e `imprimir(int, float)` son versiones de una misma función según el número o el tipo de sus argumentos. ¿Qué polimorfismo es?","ops":["Sobrecarga","Polimorfismo paramétrico","Polimorfismo dinámico","Currificación"],"why":"Mismo nombre y varias versiones según el número o el tipo de argumentos: es la sobrecarga, el polimorfismo «ad hoc» de Strachey. El paramétrico, en cambio, tiene una sola definición (plantilla) que sirve para cualquier tipo.","src":"Libro cap. 2 p. 12","imp":2,"ficha":"ud2-028"},{"id":"p2-026","ud":2,"tema":"Polimorfismo","q":"En C++ se escribe `template \u003cclass T> void imprimir(T x)` y en Hope se declaran tipos con las variables `alpha` y `beta`. ¿Qué tipo de polimorfismo permiten?","ops":["Paramétrico o genericidad","Sobrecarga o polimorfismo ad hoc","Dinámico, por jerarquía de clases","De orden superior"],"why":"Una plantilla implementa la misma ejecución admitiendo argumentos de distintos tipos: es el polimorfismo paramétrico o genericidad. El dinámico decide el método en ejecución según la clase del objeto (Empleado usado como Persona).","src":"Libro cap. 2 p. 14 y 26","imp":1,"ficha":"ud2-030"},{"id":"p2-027","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Qué tipo de llamada se realiza en la evaluación ansiosa y cuál en la diferida?","ops":["Ansiosa: llamada por valor; diferida: llamada por necesidad","Ansiosa: llamada por necesidad; diferida: llamada por valor","Ansiosa: llamada por referencia; diferida: llamada por valor","Ansiosa: llamada por valor; diferida: llamada por referencia"],"why":"Ansiosa (eager): los argumentos se evalúan antes de pasarlos, «call by value». Diferida (lazy): se pasan sin evaluar y se evalúan cuando el cuerpo los necesita, «call by need».","src":"Libro cap. 2 p. 15 y 26","imp":1,"ficha":"ud2-032"},{"id":"p2-028","ud":2,"tema":"Evaluación diferida y mónadas","q":"Los argumentos se pasan al cuerpo de la función sin evaluar y solo se evalúan cuando este los necesita. ¿Qué evaluación es y qué hace posible?","ops":["La diferida; permite trabajar con estructuras de datos infinitas","La ansiosa; permite trabajar con estructuras de datos infinitas","La diferida; abarata la implementación frente a la llamada por valor","La ansiosa; evita evaluar argumentos que luego no se usan"],"why":"Es la evaluación diferida (call by need). Como solo evalúa lo que hace falta, permite estructuras infinitas; a cambio, su implementación es más cara, porque pasa expresiones sin evaluar en lugar de valores.","src":"Libro cap. 2 p. 15–16; Clase UD2 min. 25:10","imp":1,"ficha":"ud2-033"},{"id":"p2-029","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Cuál es el inconveniente de la evaluación ansiosa según el libro?","ops":["Evalúa argumentos innecesariamente si al final no se requieren","Su implementación es cara porque pasa expresiones sin evaluar","Impide que una función reciba otras funciones como argumento","Obliga a hacer asignaciones destructivas sobre los argumentos"],"why":"La ansiosa es fácil de implementar eficientemente, pero evalúa argumentos aunque luego no se usen. Pasar expresiones sin evaluar, que es más caro, es el inconveniente de la diferida.","src":"Libro cap. 2 p. 15; Clase UD2 min. 24:54","imp":2,"ficha":"ud2-034"},{"id":"p2-030","ud":2,"tema":"Evaluación diferida y mónadas","q":"`lista(n)` construye la lista infinita n, n+1, n+2… y `primerimpar` devuelve su primer número impar. ¿Qué ocurre con `primerimpar(lista(8))`?","ops":["Con evaluación ansiosa no termina; con diferida devuelve 9","Con evaluación ansiosa devuelve 9; con diferida no termina","Con las dos evaluaciones devuelve 9","Con evaluación ansiosa devuelve 8; con diferida, 9"],"why":"La ansiosa intenta construir la lista entera antes de usarla y entra en una iteración infinita. La diferida solo pide elementos cuando hacen falta: 8 es par, pide el siguiente, 9, y termina.","src":"Libro cap. 2 p. 16; Clase UD2 min. 25:10","imp":2,"ficha":"ud2-036"},{"id":"p2-031","ud":2,"tema":"Evaluación diferida y mónadas","q":"Con `cuadrado(n) = n*n`, se llama a `cuadrado(getint(f))` y el fichero f contiene 2, 5, 6… ¿Qué resultado da con evaluación diferida?","ops":["10, porque `getint(f)` se evalúa dos veces y lee 2 y 5","4, porque `getint(f)` se evalúa una sola vez, antes de la llamada","25, porque `getint(f)` lee dos veces el mismo valor, 5","49, porque suma 2 y 5 y eleva el resultado al cuadrado"],"why":"En la diferida, n se sustituye por la expresión: getint(f) * getint(f) = 2 * 5 = 10; la ansiosa daría 2 * 2 = 4. Por este efecto lateral, la evaluación diferida encaja mal en el paradigma procedimental.","src":"Libro cap. 2 p. 16","imp":2,"ficha":"ud2-037"},{"id":"p2-032","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Qué es una mónada?","ops":["Un elemento encapsulado que aporta rasgos procedimentales sin perder los beneficios funcionales","Una función de orden superior que aplica otra a cada elemento de una lista y devuelve otra","Un tipo de polimorfismo en el que la función o el método se eligen en tiempo de ejecución","Un tipo de evaluación en el que los argumentos se evalúan cuando el cuerpo de la función los necesita"],"why":"Es la definición del libro: un elemento encapsulado que proporciona características procedimentales (E/S, estado) sin perder la transparencia referencial, el orden superior ni la evaluación diferida.","src":"Libro cap. 2 p. 17 y 26; Clase UD2 min. 26:36","imp":1,"ficha":"ud2-039"},{"id":"p2-033","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Qué lenguaje incorpora las mónadas y para qué usa la mónada IO?","ops":["Haskell, para la entrada/salida sin perder la pureza funcional","Lisp, para permitir la asignación destructiva con `setq`","Hope, para construir listas infinitas con evaluación diferida","Haskell, para evaluar los argumentos antes de cada llamada"],"why":"Haskell, modelo del funcional moderno, encierra las acciones impuras de E/S en la mónada IO, y así las funciones siguen siendo puras. También usa mónadas para el estado mutable (un parser) y las excepciones.","src":"Libro cap. 2 p. 17–18","imp":1,"ficha":"ud2-040"},{"id":"p2-034","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Por qué Haskell necesita funciones como `>>=` para secuenciar las llamadas a funciones?","ops":["Porque con la evaluación diferida no se sabe en qué orden se harán las llamadas","Porque con la evaluación ansiosa las llamadas se ejecutan a la vez, en paralelo","Porque Haskell no admite la composición de funciones","Porque sin `>>=` no se pueden definir funciones recursivas"],"why":"Haskell usa evaluación diferida, así que no se puede decidir en qué orden se ejecutarán las llamadas. La función >>= (bind) de la mónada enlaza dos funciones monádicas pasando el resultado de la primera a la segunda.","src":"Libro cap. 2 p. 17–18","imp":2,"ficha":"ud2-041"},{"id":"p2-035","ud":2,"tema":"Evaluación diferida y mónadas","q":"Según el libro, ¿cuál de estos lenguajes realiza evaluación diferida?","ops":["Haskell","Lisp","ML","C++"],"why":"El libro dice que Haskell realiza evaluación diferida (también el dialecto Lazy ML). Lisp no la tiene, ML usa evaluación ansiosa y C++, como la mayoría de los imperativos, también evalúa de forma ansiosa.","src":"Libro cap. 2 p. 17; Clase UD2 min. 24:23","imp":2,"ficha":"ud2-038"},{"id":"p2-036","ud":2,"tema":"Programa funcional y lenguajes","q":"¿Cuáles son los elementos fundamentales de un programa funcional?","ops":["Las funciones, la recursividad y las listas","Las variables, los bucles y los arrays","Los hechos, las reglas y las consultas","Las clases, los objetos y los mensajes"],"why":"Según el libro: las funciones (de orden superior y con transparencia referencial), la recursividad (iteración con asignación no destructiva) y las listas. Hechos, reglas y consultas son del paradigma lógico.","src":"Libro cap. 2 p. 21 y 26","imp":1,"ficha":"ud2-044"},{"id":"p2-037","ud":2,"tema":"Programa funcional y lenguajes","q":"Según el libro de la unidad, ¿qué ecuación define un programa funcional?","ops":["Funciones + Estructuras de datos = Programa","Hechos + Reglas = Programa","Objetos + Mensajes = Programa","Variables + Sentencias de control = Programa"],"why":"Un programa funcional es «un conjunto compuesto de funciones que juntas definen un objetivo específico de aplicación», y el libro lo resume en la ecuación Funciones + Estructuras de datos = Programa.","src":"Libro cap. 2 p. 21","imp":1,"ficha":"ud2-043"},{"id":"p2-038","ud":2,"tema":"Programa funcional y lenguajes","q":"Tratar una función de n argumentos como una concatenación de n funciones de un solo argumento, `f x y z ⇒ (((f x) y) z)`, se llama…","ops":["Currificación","Composición funcional","Evaluación diferida","Sobrecarga"],"why":"Es la currificación, uno de los mecanismos para aplicar los argumentos. La composición encadena funciones distintas pasando el resultado de una como argumento de otra; aquí es la misma función la que recibe los argumentos de uno en uno.","src":"Libro cap. 2 p. 21","imp":2,"ficha":"ud2-046"},{"id":"p2-039","ud":2,"tema":"Programa funcional y lenguajes","q":"¿Qué afirmación sobre Hope y Haskell es correcta según la clase?","ops":["Los dos nacieron para el funcional, pero Hope es académico y Haskell se usa fuera de ese ámbito","Los dos se adaptaron al paradigma funcional después de existir, como le ocurrió a Lisp","Hope tiene muchas aplicaciones reales, mientras que Haskell se queda en el ámbito académico","Los dos son dialectos de Common Lisp que mantienen la notación prefija de las S-expresiones"],"why":"En clase: Lisp no nació funcional (el paradigma se le añadió después). Hope y Haskell sí nacieron para él, pero Hope en un entorno académico, con pocas aplicaciones reales, y Haskell para usarse fuera de ese ámbito.","src":"Clase UD2 min. 28:11 y 1:12:44","imp":2,"ficha":"ud2-047"},{"id":"p2-040","ud":2,"tema":"Ventajas e inconvenientes","q":"¿Cuál de estas **NO** es una ventaja del paradigma funcional frente al imperativo?","ops":["Mayor eficiencia en ejecución","Concisión","Paralelismo","Posibilidad de razonamiento formal"],"why":"Las ventajas son simplicidad, razonamiento formal, concisión, abstracción y paralelismo. La eficiencia es justo un inconveniente: el funcional es de 3 a 5 veces más lento y la recursividad consume más memoria.","src":"Libro cap. 2 p. 25–26","imp":1,"ficha":"ud2-048"},{"id":"p2-041","ud":2,"tema":"Ventajas e inconvenientes","q":"Según el libro, ¿cuál de estos es un inconveniente del paradigma funcional en relación con el imperativo?","ops":["Es de 3 a 5 veces más lento en ejecución","Dificulta la programación paralela por los efectos laterales","Necesita más líneas de código para resolver el mismo problema","Impide verificar formalmente la corrección de los programas"],"why":"Los inconvenientes son la dificultad (es poco intuitivo), la ineficiencia (de 3 a 5 veces más lento) y no ser apropiado para la programación a gran escala. Las otras opciones contradicen sus ventajas: paralelismo, concisión y razonamiento formal.","src":"Libro cap. 2 p. 25; Clase UD2 min. 34:56","imp":1,"ficha":"ud2-054"},{"id":"p2-042","ud":2,"tema":"Ventajas e inconvenientes","q":"La transparencia referencial permite el razonamiento ecuacional: sustituir iguales por iguales. ¿A qué tiene que recurrir el paradigma imperativo para razonar formalmente?","ops":["A la lógica de predicados","Al cálculo lambda de Church","A la currificación","A las mónadas"],"why":"Es la ventaja «posibilidad de razonamiento formal»: el funcional razona con ecuaciones gracias a la transparencia referencial, mientras que en el paradigma imperativo ha de utilizarse la lógica de predicados.","src":"Libro cap. 2 p. 25","imp":2,"ficha":"ud2-050"},{"id":"p2-043","ud":2,"tema":"Ventajas e inconvenientes","q":"Según el libro, la relación de líneas de código entre el imperativo y el funcional es de 10 a 1. ¿Qué ventaja es y qué consecuencia tiene?","ops":["Concisión: un programa más reducido es más fiable","Simplicidad: el manual del lenguaje es más corto","Abstracción: el código es más reutilizable","Paralelismo: el código se reparte entre más hilos"],"why":"Es la concisión: con un código más reducido, el programa es más conciso y, por tanto, más fiable. La simplicidad se refiere a otra cosa: a que el lenguaje tiene menos comandos e identificadores.","src":"Libro cap. 2 p. 25; Clase UD2 min. 33:55","imp":2,"ficha":"ud2-051"},{"id":"p2-044","ud":2,"tema":"Ventajas e inconvenientes","q":"Haskell tiene 23 identificadores y un manual de 80 páginas; Ada, 62 identificadores y uno de 200. ¿Qué ventaja del funcional ilustra el libro con este dato?","ops":["Simplicidad","Concisión","Abstracción","Paralelismo"],"why":"Es la simplicidad: el modelo de cómputo funcional y sus lenguajes son más simples, con menos comandos. La concisión, en cambio, se mide en las líneas del programa (de 10 a 1).","src":"Libro cap. 2 p. 25; Clase UD2 min. 32:24","imp":2,"ficha":"ud2-049"},{"id":"p2-045","ud":2,"tema":"Ventajas e inconvenientes","q":"¿Por qué el paradigma funcional es ideal para la programación paralela y concurrente?","ops":["Porque la ausencia de efectos laterales facilita el cálculo paralelo","Porque la evaluación ansiosa reparte los argumentos entre los núcleos","Porque las mónadas sincronizan automáticamente los distintos hilos","Porque la recursividad consume menos memoria que los bucles"],"why":"Sin efectos laterales, las funciones no comparten un estado que se modifique, así que pueden ejecutarse en paralelo sin conflictos (varios procesadores, hilos). Ojo: la recursividad consume más memoria, no menos.","src":"Libro cap. 2 p. 25; Clase UD2 min. 33:55","imp":2,"ficha":"ud2-053"},{"id":"p2-046","ud":2,"tema":"Ventajas e inconvenientes","q":"El paradigma funcional se ajusta mejor al modelo del problema, y peor al del computador, que el imperativo. ¿Qué ventaja es y qué permite?","ops":["Abstracción: obtener un código más reutilizable","Simplicidad: trabajar con menos identificadores","Concisión: escribir menos líneas de código","Razonamiento formal: sustituir iguales por iguales"],"why":"Es la abstracción: al acercarse al modelo del problema y alejarse del de la máquina, el código resulta más reutilizable. Las otras tres son ventajas reales, pero describen otra cosa.","src":"Libro cap. 2 p. 25","imp":2,"ficha":"ud2-052"},{"id":"p2-047","ud":2,"tema":"Lisp","q":"¿Qué expresión de Common Lisp calcula (3 + 4) · 2?","ops":["`(* (+ 3 4) 2)`","`(+ 3 (* 4 2))`","`((3 + 4) * 2)`","`(* 3 (+ 4 2))`"],"why":"Lisp usa notación prefija (polaca): primero el operador y luego los argumentos. `(+ 3 4)` da 7 y `(* 7 2)`, 14. `(+ 3 (* 4 2))` da 11, y `((3 + 4) * 2)` es un error: el primer elemento de la lista debe ser el operador.","src":"Guía Lisp p. 1; Clase UD2 min. 45:24","imp":2,"ficha":"ud2-060"},{"id":"p2-048","ud":2,"tema":"Lisp","q":"¿Qué imprime este código?","ops":["`18` y después `(* 2 (+ 4 5))`","`18` y después `18`","`(* 2 (+ 4 5))` y después `18`","`18` y después un error por no evaluar la lista"],"why":"La primera lista se evalúa como llamada a función: 2 · 9 = 18. El apóstrofe (quote) suprime la evaluación, así que la segunda lista se imprime tal cual, como dato literal.","src":"Guía Lisp p. 1; Clase UD2 min. 46:56","imp":2,"code":"(print (* 2 (+ 4 5)))\n(print '(* 2 (+ 4 5)))","ficha":"ud2-061"},{"id":"p2-049","ud":2,"tema":"Lisp","q":"¿Qué devuelve esta expresión?","ops":["`(1 5 6)`","`(1 4 5 6)`","`(1 (5 6))`","`((1) 5 6)`"],"why":"car devuelve la cabeza, 1; cdr devuelve la cola, (5 6); y cons añade el 1 al inicio de esa lista: (1 5 6). (1 4 5 6) sería añadirlo a la lista entera, sin quitarle la cabeza.","src":"Guía Lisp p. 4–5; Libro cap. 2 p. 22","imp":1,"code":"(cons (car '(1 2 3)) (cdr '(4 5 6)))","ficha":"ud2-067"},{"id":"p2-050","ud":2,"tema":"Lisp","q":"¿Cuál de estas expresiones devuelve la lista `(5 10 20)`?","ops":["`(cons 5 '(10 20))`","`(list 5 '(10 20))`","`(list '(10 20) 5)`","`(cons '(10 20) 5)`"],"why":"cons añade un elemento al inicio de una lista existente: (5 10 20). list agrupa sus argumentos tal cual en una lista nueva, así que `(list 5 '(10 20))` da (5 (10 20)), con la sublista dentro.","src":"Guía Lisp p. 4; Clase UD2 min. 1:09:39","imp":2,"ficha":"ud2-065"},{"id":"p2-051","ud":2,"tema":"Lisp","q":"¿Qué muestra este código por pantalla?","ops":["Suficiente","Aprobado","Suficiente y después Reprobado","Reprobado"],"why":"cond evalúa las ramas en orden y ejecuta solo la primera cuyo predicado es cierto: 12 no llega a 19 ni a 14, pero sí a 11. La rama (t …) hace de else y solo se usa si no se cumple ninguna anterior.","src":"Guía Lisp p. 3–4; Clase UD2 min. 1:03:06","imp":2,"code":"(defparameter *nota* 12)\n(cond\n  ((>= *nota* 19) (format t \"Excelente\"))\n  ((>= *nota* 14) (format t \"Aprobado\"))\n  ((>= *nota* 11) (format t \"Suficiente\"))\n  (t (format t \"Reprobado\")))","ficha":"ud2-063"},{"id":"p2-052","ud":2,"tema":"Lisp","q":"¿Qué devuelve esta expresión?","ops":["`6`","`-6`","`14`","Un error, porque una lambda necesita nombre para llamarla"],"why":"lambda define una función anónima con parámetros x e y, que se aplica en el acto a 10 y 4: (- 10 4) = 6. No hace falta darle nombre con defun: por eso se llama función anónima.","src":"Guía Lisp p. 4; Clase UD2 min. 1:06:21","imp":1,"code":"((lambda (x y) (- x y)) 10 4)","ficha":"ud2-064"},{"id":"p2-053","ud":2,"tema":"Lisp","q":"¿Qué ocurre al ejecutar este código?","ops":["Imprime `6` y después da error: `a` no existe fuera del `let`","Imprime `6` y después `2`","Imprime `6` y después `NIL`","Da error en la primera línea, porque `let` no devuelve valor"],"why":"let crea ligaduras locales: a y b solo existen dentro de sus paréntesis, y let devuelve el valor de su cuerpo, 6. Fuera del let, a no está definida y Lisp da un error de variable no ligada.","src":"Guía Lisp p. 2; Clase UD2 min. 54:41","imp":2,"code":"(print (let ((a 2) (b 3))\n         (* a b)))\n(print a)"},{"id":"p2-054","ud":2,"tema":"Lisp","q":"¿Por qué Lisp no se considera un lenguaje funcional puro?","ops":["Porque es híbrido: tiene asignación destructiva, bucles, arrays y globales","Porque no admite la recursividad y obliga a iterar con bucles","Porque no permite pasar funciones como argumento ni devolverlas como resultado","Porque evalúa los argumentos de forma diferida"],"why":"Lisp no nació funcional: el paradigma se le añadió después. Es híbrido (funcional y procedimental) porque tiene setq, loop, arrays y globales. Sí admite recursividad y orden superior, y no tiene evaluación diferida.","src":"Libro cap. 2 p. 22–25; Clase UD2 min. 51:22","imp":1,"ficha":"ud2-059"},{"id":"p2-055","ud":2,"tema":"Lisp","q":"En Common Lisp, `(funcall #'+ 1 2 3)` y `(apply #'+ '(1 2 3))` devuelven 6. ¿Qué diferencia hay entre `funcall` y `apply`?","ops":["`funcall` recibe los argumentos uno a uno; `apply`, dentro de una lista","`funcall` se usa con lambdas; `apply`, con funciones definidas con `defun`","`funcall` evalúa de forma diferida; `apply`, de forma ansiosa","`funcall` devuelve una lista; `apply`, un único valor"],"why":"Las dos invocan una función recibida como dato (#' referencia el objeto función). funcall le pasa los argumentos de forma explícita; apply los toma de una lista.","src":"Guía Lisp p. 6","imp":2,"ficha":"ud2-069"},{"id":"p3-001","ud":3,"tema":"Orígenes","q":"Ordena de más antiguo a más reciente los cuatro hitos de «La evolución de la lógica pura» que presenta la clase.","ops":["Cálculo lambda → LISP → Hope → Haskell","LISP → cálculo lambda → Hope → Haskell","Cálculo lambda → Hope → LISP → Haskell","Cálculo lambda → LISP → Haskell → Hope"],"why":"Primero la base matemática (el cálculo lambda de Church); después LISP, de McCarthy, que se apoya en él; luego Hope, nacido en Edimburgo en los años 70, y por último Haskell, del Comité Haskell.","src":"S3 diap. 3","imp":1,"ficha":"ud3-001"},{"id":"p3-002","ud":3,"tema":"Orígenes","q":"En la línea temporal de la clase, Hope aparece como «el pionero». ¿Qué introduce?","ops":["El encaje de patrones y los tipos de datos algebraicos","La notación prefija y la idea de que «el código es dato»","La evaluación perezosa y el tipado estático inferido","La encapsulación de la entrada/salida en mónadas"],"why":"Hope, nacido en la Universidad de Edimburgo, introduce el encaje de patrones y los tipos de datos algebraicos. La notación prefija y «el código es dato» son de LISP; la evaluación perezosa y las mónadas, de Haskell.","src":"S3 diap. 3","imp":1,"ficha":"ud3-004"},{"id":"p3-003","ud":3,"tema":"Orígenes","q":"Según la línea temporal de la clase, ¿quién está detrás de Haskell y qué rasgos lo definen?","ops":["El Comité Haskell: pureza estricta, tipado estático y evaluación perezosa","John McCarthy: el código es dato, estructuras de listas y notación prefija","La Universidad de Edimburgo: encaje de patrones y tipos algebraicos","Alonzo Church: la base matemática fundamental del paradigma"],"why":"Haskell es obra del Comité Haskell y se define por su pureza estricta, tipado estático y evaluación perezosa. Las otras tres opciones describen, por este orden, LISP, Hope y el cálculo lambda.","src":"S3 diap. 3","imp":1,"ficha":"ud3-005"},{"id":"p3-004","ud":3,"tema":"Orígenes","q":"Hope y Haskell nacieron para el paradigma funcional. Según el profesor, ¿qué los diferencia?","ops":["Hope nació en el ámbito académico; Haskell, para usarse fuera de él","Hope usa evaluación perezosa; Haskell, una evaluación estricta clásica","Hope infiere los tipos; Haskell obliga a declararlos con `dec`","Hope carece de encaje de patrones; Haskell fue el primero en tenerlo"],"why":"El profesor presenta Hope como lenguaje académico, con pocas aplicaciones reales (hay que instalar un binario), y Haskell como pensado para usarse fuera de la academia. Las demás están invertidas: Hope es estricto, declara tipos con dec y fue pionero del encaje de patrones.","src":"Clase UD2 min. 28 y 72","imp":1,"ficha":"ud3-006"},{"id":"p3-005","ud":3,"tema":"Orígenes","q":"¿Qué idea resume la aportación de LISP (John McCarthy) en la línea temporal de la clase?","ops":["«El código es dato»: listas y notación prefija","«Si compila, funciona»: tipado estático seguro","El encaje de patrones y los tipos algebraicos","La base matemática fundamental de todo el paradigma"],"why":"La diapositiva resume LISP como «el código es dato»: estructuras de listas y notación prefija. «Si compila, funciona» es el lema de Haskell, el encaje de patrones lo introduce Hope y la base matemática es el cálculo lambda.","src":"S3 diap. 3","imp":2,"ficha":"ud3-003"},{"id":"p3-006","ud":3,"tema":"Hope","q":"En este fragmento de Hope, ¿cómo decide la función qué resultado devolver?","ops":["Por encaje de patrones, según la forma del dato","Con un `cond` que comprueba la forma en varias ramas anidadas","Con guardas `|` que se prueban en cascada hasta `otherwise`","Con un bucle que recorre las formas hasta dar con la buscada"],"why":"Cada línea --- es una ecuación para una forma del dato (circulo, cuadrado_con_triangulo): Hope evalúa según la forma de los datos y se ahorra los condicionales complejos. cond es de LISP y las guardas |, de Haskell.","src":"S3 diap. 5","imp":1,"code":"dec clasificar : forma -> texto;\n--- clasificar (circulo) \u003c= texto1;\n--- clasificar (cuadrado_con_triangulo)\n      \u003c= texto2;","ficha":"ud3-008"},{"id":"p3-007","ud":3,"tema":"Hope","q":"En Hope, ¿qué hace una línea como `dec fact : num -> num;`?","ops":["Declara explícitamente el tipo de la función","Define la ecuación del caso base de `fact`","Crea una variable global `fact` de tipo numérico","Indica que `fact` se evaluará de forma perezosa"],"why":"dec declara el tipo (argumento -> resultado); las ecuaciones van después, cada una abierta con ---. Por eso la Matriz de Rosetta dice que Hope tiene declaración explícita de tipos, mientras que Haskell los infiere.","src":"S3 diap. 7 y 9","imp":2,"ficha":"ud3-010"},{"id":"p3-008","ud":3,"tema":"Hope","q":"En `dec suma : num # num -> num;` y `--- suma(a,b) \u003c= a + b;`, ¿qué indican `#` y `\u003c=`?","ops":["`#` une los tipos de los argumentos; `\u003c=` separa el patrón del resultado","`#` abre un comentario; `\u003c=` compara si un valor es menor o igual","`#` separa las alternativas de un tipo; `\u003c=` asigna un valor a una variable","`#` marca una función de orden superior; `\u003c=` declara el tipo de retorno"],"why":"num # num es el par de argumentos de suma, y \u003c= separa el lado izquierdo de la ecuación (el patrón suma(a,b)) del resultado. En Hope los comentarios empiezan por ! y las alternativas de un tipo se unen con ++.","src":"S3 diap. 7","imp":2,"ficha":"ud3-009"},{"id":"p3-009","ud":3,"tema":"Hope","q":"Hope define la lista con `data list alpha == nil ++ alpha :: list alpha;`. ¿Qué expresa esta línea?","ops":["Un tipo algebraico: una lista es `nil` o una cabeza unida a otra lista","Una función que concatena dos listas cuyos elementos son de tipo `alpha`","Una lista concreta formada por los elementos `nil` y `alpha`","Una variable global `list` a la que se asigna el valor `alpha`"],"why":"data define un tipo de datos algebraico con alternativas separadas por ++: nil (lista vacía) o alpha :: list alpha (cabeza y resto). alpha es una variable de tipo, así que la lista vale para cualquier tipo de elemento.","src":"Standard.hop","imp":2,"ficha":"ud3-012"},{"id":"p3-010","ud":3,"tema":"Hope","q":"Con estas ecuaciones de Hope, ¿qué devuelve `longitud(4 :: 5 :: 6 :: nil)`?","ops":["`3`","`15`","`0`","`4`"],"why":"Cada ecuación encaja con una forma: (x::xs) suma 1 y sigue con la cola, y nil (caso base) da 0. Hay tres elementos: 1 + 1 + 1 + 0 = 3. Saldría 15 si se sumaran los valores en lugar de contarlos; nil no cuenta como elemento.","src":"S3 diap. 9 y 11","imp":2,"code":"dec longitud : list(num) -> num;\n--- longitud nil \u003c= 0;\n--- longitud (x::xs) \u003c= 1 + longitud(xs);","ficha":"ud3-011"},{"id":"p3-011","ud":3,"tema":"Sintaxis comparada","q":"Matriz de Rosetta funcional: ¿qué sistema de tipado corresponde a LISP, Hope y Haskell, en este orden?","ops":["Dinámico; estricto y polimórfico; estático e inferido","Estático e inferido; dinámico; estricto y polimórfico","Estricto y polimórfico; estático e inferido; dinámico","Dinámico; estático e inferido; estricto y polimórfico"],"why":"LISP comprueba los tipos en tiempo de ejecución (dinámico); Hope es estricto y polimórfico, con declaración explícita (dec); Haskell es estático e inferido: el tipo se deduce aunque no se escriba.","src":"S3 diap. 7","imp":1,"ficha":"ud3-016"},{"id":"p3-012","ud":3,"tema":"Sintaxis comparada","q":"Un programador sustituye un `cond` anidado por varias ecuaciones que empiezan por `---`, una por cada forma del dato. ¿Qué cambio de lenguaje ha hecho?","ops":["De LISP a Hope","De Hope a Haskell","De Haskell a LISP","De Hope a LISP"],"why":"La anidación con if y cond es el control de flujo de LISP; las ecuaciones --- son el encaje de patrones de Hope. Haskell usa encaje de patrones y guardas |, pero sin ---.","src":"S3 diap. 7","imp":1,"ficha":"ud3-017"},{"id":"p3-013","ud":3,"tema":"Sintaxis comparada","q":"Estas son las tres definiciones de `suma` de la Matriz de Rosetta, sin etiquetar. ¿A qué lenguaje corresponde cada una?","ops":["(1) LISP, (2) Haskell, (3) Hope","(1) LISP, (2) Hope, (3) Haskell","(1) Haskell, (2) LISP, (3) Hope","(1) Hope, (2) Haskell, (3) LISP"],"why":"(1) es LISP: defun y notación prefija. (2) es Haskell: una sola ecuación, con el tipo inferido. (3) es Hope: dec declara el tipo (num # num -> num) y --- abre la ecuación con \u003c=.","src":"S3 diap. 7","imp":2,"code":"(1) (defun suma (a b) (+ a b))\n(2) suma a b = a + b\n(3) dec suma : num # num -> num;\n    --- suma(a,b) \u003c= a + b;","ficha":"ud3-015"},{"id":"p3-014","ud":3,"tema":"Sintaxis comparada","q":"En la diapositiva del árbol de ejecución, Hope y Haskell escriben igual `2 + (3 * 4)`. ¿Qué rasgo atribuye la diapositiva a Hope?","ops":["Notación infija con tipos y evaluación estricta clásica","Notación prefija, en la que la función precede a los argumentos","Notación infija «matemáticamente pura» y evaluación perezosa","Notación posfija, en la que los argumentos preceden a la función"],"why":"La diapositiva presenta a Hope como notación infija con tipos y evaluación estricta clásica; a Haskell, como infija y «matemáticamente pura»; y a LISP, como prefija: (+ 2 (* 3 4)).","src":"S3 diap. 6","imp":2,"ficha":"ud3-013"},{"id":"p3-015","ud":3,"tema":"Capacidades","q":"¿Qué tres capacidades funcionales compara la clase en LISP, Hope y Haskell?","ops":["Recursividad, deconstrucción de estructuras y orden superior","Evaluación perezosa, encapsulación en mónadas y clases de tipos","Unificación, vuelta atrás (backtracking) y cláusulas de Horn","Herencia, encapsulación del estado y polimorfismo de subtipos"],"why":"Son la capacidad 1 (recursividad como motor de iteración), la 2 (separar cabeza y cola de datos inmutables) y la 3 (funciones como ciudadanos de primera clase). Unificación y backtracking son del paradigma lógico; la herencia, de la orientación a objetos.","src":"S3 diap. 8, 10 y 12","imp":1,"ficha":"ud3-018"},{"id":"p3-016","ud":3,"tema":"Capacidades","q":"Factoriales de la diapositiva en LISP y en Hope. ¿Qué diferencia hay en cómo detectan el caso base?","ops":["LISP, un condicional explícito (`if`); Hope, una ecuación por patrón","LISP, encaje de patrones; Hope, un condicional `cond` anidado","LISP infiere el caso base a partir del tipo; Hope lo declara en `dec`","LISP, un bucle hasta llegar a 0; Hope, una guarda `otherwise`"],"why":"La diapositiva lo resume: LISP, «uso de condicional explícito (if)»; Hope, «reglas de deconstrucción directas»: fact 0 encaja con el caso base y fact n con el resto. La línea dec solo declara el tipo.","src":"S3 diap. 9","imp":1,"code":"(defun factorial (n)\n  (if (= n 0)\n      1\n      (* n (factorial (- n 1)))))\n\ndec fact : num -> num;\n--- fact 0 \u003c= 1;\n--- fact n \u003c= n * fact(n-1);","ficha":"ud3-022"},{"id":"p3-017","ud":3,"tema":"Capacidades","q":"Con esta definición de Haskell de la diapositiva, ¿qué devuelve `sumarDiez [1, 2, 3]`?","ops":["`[11, 2, 3]`","`[11, 12, 13]`","`[1, 2, 13]`","`16`"],"why":"El patrón (x:xs) separa la cabeza 1 de la cola [2, 3]; se suma 10 solo a la cabeza y se vuelve a unir con «:». No hay llamada recursiva, así que la cola queda igual: no es un map.","src":"S3 diap. 11","imp":1,"code":"sumarDiez [] = []\nsumarDiez (x:xs) = (x + 10) : xs","ficha":"ud3-023"},{"id":"p3-018","ud":3,"tema":"Capacidades","q":"Para separar la cabeza de la cola de una lista, LISP usa `car` y `cdr`. ¿Qué operador usan Hope y Haskell, respectivamente?","ops":["`::` en Hope y `:` en Haskell","`:` en Hope y `::` en Haskell","`++` en Hope y `:` en Haskell","`#` en Hope y `|` en Haskell"],"why":"Hope escribe x :: xs y Haskell, x : xs. La trampa: en Haskell :: no separa listas, sino que introduce la firma de tipo (sumar :: Int -> Int -> Int).","src":"S3 diap. 10; Guía Haskell p. 1","imp":1,"ficha":"ud3-023"},{"id":"p3-019","ud":3,"tema":"Capacidades","q":"¿Qué devuelve esta expresión de LISP, tomada de la diapositiva Map & Reduce?","ops":["`21`","`(6 7 8)`","`11`","`6`"],"why":"mapcar aplica la lambda a cada elemento y da (6 7 8); reduce con + los combina: 6 + 7 + 8 = 21. Saldría 11 si se sumara primero la lista (6) y luego 5 una sola vez.","src":"S3 diap. 13","imp":2,"code":"(reduce #'+\n  (mapcar (lambda (x) (+ x 5)) '(1 2 3)))","ficha":"ud3-025"},{"id":"p3-020","ud":3,"tema":"Capacidades","q":"¿Cuál de estas funciones anónimas, que suman 5 a su argumento, está escrita en Haskell?","ops":["`\\x -> x + 5`","`lambda x => x+5`","`(lambda (x) (+ x 5))`","`\\x => x + 5`"],"why":"Haskell escribe la lambda con la barra invertida \\, que emula la λ, y la flecha ->. lambda x => x+5 es la forma de Hope de la diapositiva y (lambda (x) (+ x 5)), la de LISP; en Haskell => no separa parámetros y cuerpo.","src":"S3 diap. 13; Guía Haskell p. 2–3","imp":2,"ficha":"ud3-024"},{"id":"p3-021","ud":3,"tema":"Síntesis","q":"Según la diapositiva del legado funcional en Big Data, ¿por qué map/reduce puede repartirse entre miles de servidores sin colisiones?","ops":["Porque no hay efectos secundarios ni estado compartido entre los nodos","Porque cada nodo bloquea la memoria compartida mientras escribe en ella","Porque todos los nodos actualizan a la vez una misma variable global","Porque cada servidor ejecuta en orden un bucle `for` del programa"],"why":"Al carecer de efectos secundarios, las evaluaciones de map/reduce se distribuyen entre nodos (Apache Spark) y, sin estado compartido, no hay colisiones. Bloquear memoria compartida es la solución imperativa a un problema que el funcional no tiene.","src":"S3 diap. 14","imp":1,"ficha":"ud3-027"},{"id":"p3-022","ud":3,"tema":"Síntesis","q":"¿Qué dos legados funcionales garantizan, según la clase, la seguridad del procesamiento distribuido moderno, como Apache Spark?","ops":["La inmutabilidad de LISP y los patrones de Hope","Las macros de LISP y las mónadas de Haskell","La notación prefija de LISP y las guardas de Haskell","Las variables globales de LISP y los tipos de Hope"],"why":"La diapositiva atribuye esa seguridad a la inmutabilidad heredada de LISP y a los patrones de Hope: sin datos que cambien, los nodos pueden trabajar en paralelo. Las macros y la notación prefija son de LISP, pero no son lo que cita.","src":"S3 diap. 14","imp":2,"ficha":"ud3-026"},{"id":"p3-023","ud":3,"tema":"Síntesis","q":"En «Eligiendo el dialecto funcional», ¿qué etiqueta recibe cada lenguaje: Hope, LISP/Scheme y Haskell, en este orden?","ops":["Pionero académico; dinámico y maleable; fortaleza matemática","Fortaleza matemática; pionero académico; dinámico y maleable","Dinámico y maleable; fortaleza matemática; pionero académico","Pionero académico; fortaleza matemática; dinámico y maleable"],"why":"Hope es el pionero académico (estricto, explícito, inventor del encaje de patrones); LISP/Scheme, dinámico y maleable (el código escribe código); Haskell, la fortaleza matemática (tipado estático seguro y evaluación perezosa).","src":"S3 diap. 15","imp":1,"ficha":"ud3-028"},{"id":"p3-024","ud":3,"tema":"Síntesis","q":"Según la clase, ¿para qué resulta ideal Hope, «el pionero académico»?","ops":["Para comprender la teoría pura de las estructuras de datos","Para escribir macros con las que el propio código genera código","Para garantizar que, si el programa compila, funciona","Para repartir el procesamiento de datos masivos en Spark"],"why":"La diapositiva describe Hope como estricto, explícito e inventor del encaje de patrones, «ideal para comprender la teoría pura de estructuras de datos». Las macros son de LISP/Scheme y «si compila, funciona» es el lema de Haskell.","src":"S3 diap. 15","imp":2,"ficha":"ud3-029"},{"id":"p3-025","ud":3,"tema":"Síntesis","q":"Según la conclusión de la unidad, ¿qué enseña el paradigma funcional, ya sea en Hope, LISP, Haskell o Python?","ops":["A diseñar sistemas predecibles, inmutables y matemáticamente puros","A modelar el problema con objetos que encapsulan su propio estado","A describir hechos y reglas para que un motor deduzca la respuesta","A controlar paso a paso cómo cambia la memoria del programa"],"why":"«Más que un lenguaje, una forma de pensar»: diseñar sistemas predecibles, inmutables y matemáticamente puros. Los objetos con estado son de la orientación a objetos; los hechos y reglas, del paradigma lógico; la memoria paso a paso, del imperativo.","src":"S3 diap. 16","imp":2,"ficha":"ud3-032"},{"id":"p3-026","ud":3,"tema":"Haskell","q":"¿Qué combinación de rasgos atribuye la guía de estudio a Haskell?","ops":["Funcional puro, tipado estático e inferido y evaluación perezosa","Funcional impuro, tipado dinámico y evaluación ansiosa (call-by-value)","Multiparadigma, tipado débil y evaluación estricta clásica","Lógico, tipado dinámico y resolución por vuelta atrás"],"why":"La guía lo define como funcional puro, con tipado estático fuerte e inferido y evaluación diferida o perezosa. El tipado dinámico es el de LISP, y la evaluación ansiosa (call-by-value) es justo la contraria de la de Haskell.","src":"Guía Haskell p. 1","imp":1,"ficha":"ud3-033"},{"id":"p3-027","ud":3,"tema":"Haskell","q":"Hope usa una evaluación estricta clásica; Haskell, la evaluación diferida (call-by-need). ¿Qué hace esta última con los argumentos de una función?","ops":["Pospone su cálculo hasta que el resultado es estrictamente necesario","Los calcula todos al invocar la función, antes de entrar en ella","Los evalúa todos en paralelo, cada uno en un hilo distinto","Retrasa la comprobación de sus tipos hasta el tiempo de ejecución"],"why":"Haskell no evalúa los argumentos al invocar la función, sino cuando hace falta su valor. Calcularlos todos al entrar es la evaluación ansiosa (call-by-value). Comprobar los tipos al ejecutar es tipado dinámico, otra cosa distinta.","src":"Guía Haskell p. 1; S3 diap. 6","imp":1,"ficha":"ud3-034"},{"id":"p3-028","ud":3,"tema":"Haskell","q":"¿Qué ocurre al pedir el valor de `primerosCinco` en Haskell?","ops":["Da `[1,2,3,4,5]`: solo se calculan los elementos que se piden","Nunca termina: antes hay que construir entera la lista `enteros`","Da error de compilación: Haskell no admite listas infinitas","Da `5`, el quinto elemento de la lista infinita `enteros`"],"why":"Por la evaluación perezosa, [1..] es una lista infinita que nunca se construye entera: take 5 solo fuerza los cinco primeros elementos. Es la ventaja de desacoplar la generación de los datos de su consumo.","src":"Guía Haskell p. 1","imp":1,"code":"enteros = [1..]\nprimerosCinco = take 5 enteros","ficha":"ud3-035"},{"id":"p3-029","ud":3,"tema":"Haskell","q":"En Haskell, ¿qué significa `::` en la línea `sumar :: Int -> Int -> Int`?","ops":["Introduce la firma de tipo de la función `sumar`","Une una cabeza con su cola, como en las listas de Hope","Separa el patrón de la ecuación de su resultado","Declara que `sumar` es una lista de enteros"],"why":"En Haskell :: declara el tipo (la firma) y -> separa argumentos y resultado. La trampa: en Hope :: es el cons de las listas (x :: xs), que en Haskell se escribe con un solo «:» (x : xs).","src":"Guía Haskell p. 1; S3 diap. 10","imp":1,"ficha":"ud3-038"},{"id":"p3-030","ud":3,"tema":"Haskell","q":"Por la currificación, ¿cómo hay que leer la firma `sumar :: Int -> Int -> Int`?","ops":["Toma un `Int` y devuelve una función que toma otro `Int` y da un `Int`","Toma a la vez un par de `Int`, como `num # num` en Hope, y da un `Int`","Toma tres valores `Int` seguidos y no devuelve ningún resultado","Toma un `Int` y devuelve dos resultados `Int` encadenados"],"why":"En Haskell toda función toma formalmente un solo argumento y devuelve otra función hasta agotar los parámetros; por eso la firma encadena flechas. Recibir el par de golpe es lo que expresa num # num -> num en Hope.","src":"Guía Haskell p. 1 y 4","imp":1,"ficha":"ud3-037"},{"id":"p3-031","ud":3,"tema":"Haskell","q":"Con esta función de la guía, ¿qué devuelve `clasificarNota 14`?","ops":["`\"Aprobado\"`","`\"Suficiente\"`","`\"Excelente\"`","`\"Reprobado\"`"],"why":"Las guardas | se prueban de arriba abajo y gana la primera que se cumple: 14 >= 19 falla y 14 >= 14 se cumple, así que ya no se mira 14 >= 11. Funcionan como cond en LISP, con otherwise como caso por defecto (t).","src":"Guía Haskell p. 2","imp":1,"code":"clasificarNota :: Int -> String\nclasificarNota nota\n  | nota >= 19 = \"Excelente\"\n  | nota >= 14 = \"Aprobado\"\n  | nota >= 11 = \"Suficiente\"\n  | otherwise  = \"Reprobado\"","ficha":"ud3-041"},{"id":"p3-032","ud":3,"tema":"Haskell","q":"En Haskell, ¿qué tienen en común y en qué se diferencian `let … in` y `where`?","ops":["Ambos ligan nombres locales inmutables; `let` va delante y `where`, detrás","Ambos crean variables globales; `let` las hace mutables y `where`, inmutables","Ambos declaran tipos; `let` los fija al compilar y `where`, al ejecutar","Ambos crean ligaduras locales, pero `let` permite reasignarlas y `where`, no"],"why":"let … in y where asocian valores inmutables a nombres locales (en Haskell no hay globales mutables como defvar o setf de LISP). Solo cambia la posición: let delante de la expresión; where, al final de la función.","src":"Guía Haskell p. 2","imp":2,"ficha":"ud3-040"},{"id":"p3-033","ud":3,"tema":"Haskell","q":"¿Por qué Haskell rechaza una lista como `[1, \"dos\", 3]`?","ops":["Porque sus listas son homogéneas: elementos de un mismo tipo","Porque los elementos de una lista deben unirse con `:` y no con comas","Porque las listas literales deben terminar en `nil`, como en Hope","Porque las cadenas de texto deben ir dentro de la mónada IO"],"why":"Las listas de Haskell son homogéneas. Los corchetes son solo una abreviatura: [10, 20, 30] equivale a 10 : (20 : (30 : [])), donde [] es la lista vacía (nil en Hope, NIL en LISP) y «:» añade por la cabeza.","src":"Guía Haskell p. 3","imp":2,"ficha":"ud3-042"},{"id":"p3-034","ud":3,"tema":"Pilares en Haskell","q":"Como `sumarPuro 2 3` da siempre `5` y no tiene efectos laterales, puede sustituirse por `5` sin alterar el programa. ¿Cómo se llama este razonamiento?","ops":["Razonamiento ecuacional, fruto de la transparencia referencial","Evaluación diferida, fruto de la estrategia de evaluación call-by-need","Currificación, fruto de encadenar flechas en la firma","Polimorfismo paramétrico, fruto de las variables de tipo"],"why":"Una función pura da siempre la misma salida para la misma entrada y no tiene efectos laterales, así que cualquier llamada puede sustituirse por su valor: es el razonamiento ecuacional que permite la transparencia referencial.","src":"Guía Haskell p. 3","imp":1,"ficha":"ud3-044"},{"id":"p3-035","ud":3,"tema":"Pilares en Haskell","q":"¿Qué expresión completa el caso recursivo de `sumarLista`?","ops":["`x + sumarLista xs`","`x + xs`","`sumarLista x + xs`","`x : sumarLista xs`"],"why":"Sin bucles ni x = x + 1, se suma la cabeza x al resultado de aplicar la función a la cola xs. x + xs no cuadra en tipos (Int + [Int]) y x : … construiría una lista, no el Int que pide la firma.","src":"Guía Haskell p. 4","imp":2,"code":"sumarLista :: [Int] -> Int\nsumarLista [] = 0\nsumarLista (x:xs) = ________","ficha":"ud3-045"},{"id":"p3-036","ud":3,"tema":"Pilares en Haskell","q":"¿Qué valor da esta expresión, que combina dos funciones de orden superior de la guía?","ops":["`12`","`[2, 4, 6]`","`21`","`9`"],"why":"filter even deja los pares [2, 4, 6] y foldr (+) 0 los reduce sumándolos: 2 + 4 + 6 = 12. 21 sería la suma de toda la lista y 9, la de los impares.","src":"Guía Haskell p. 4","imp":1,"code":"foldr (+) 0 (filter even [1, 2, 3, 4, 5, 6])","ficha":"ud3-046"},{"id":"p3-037","ud":3,"tema":"Pilares en Haskell","q":"Con esta definición por composición, ¿qué devuelve `sumaCuadrados [1, 2, 3]`?","ops":["`14`","`36`","`[1, 4, 9]`","`6`"],"why":"(f . g) x = f (g x): primero actúa map, que eleva al cuadrado ([1, 4, 9]), y después sum: 1 + 4 + 9 = 14. Saldría 36 si se sumara primero (6) y se elevara al cuadrado después.","src":"Guía Haskell p. 4–5","imp":2,"code":"sumaCuadrados :: [Int] -> Int\nsumaCuadrados = sum . map (\\x -> x * x)","ficha":"ud3-047"},{"id":"p3-038","ud":3,"tema":"Pilares en Haskell","q":"En la firma `pertenece :: Eq a => a -> [a] -> Bool`, ¿qué aporta `Eq a =>`?","ops":["Restringe `a` a tipos que admiten la igualdad `==`","Obliga a que `a` sea un número entero para poder operar con él","Indica que la función evaluará sus argumentos de forma ansiosa","Declara que `a` es una variable mutable dentro de la función"],"why":"a es una variable de tipo (polimorfismo paramétrico, como alpha en Hope), y la clase de tipos Eq a exige que ese tipo implemente ==, que pertenece necesita para comparar. Es la sobrecarga controlada de las typeclasses.","src":"Guía Haskell p. 5","imp":1,"ficha":"ud3-048"},{"id":"p3-039","ud":3,"tema":"Mónadas y equivalencias","q":"¿Con qué concepto encapsula Haskell un valor en un contexto computacional (secuencias de cómputo, efectos) sin romper la transparencia referencial?","ops":["La mónada","La currificación","El encaje de patrones","La evaluación diferida"],"why":"La mónada encapsula un valor en un contexto computacional sin vulnerar la pureza; IO es la que aísla la entrada/salida. La evaluación diferida trata de cuándo se calcula algo, no de encapsular efectos.","src":"Guía Haskell p. 5","imp":1,"ficha":"ud3-049"},{"id":"p3-040","ud":3,"tema":"Mónadas y equivalencias","q":"¿Qué tres piezas forman una mónada, según la guía de Haskell?","ops":["Un constructor de tipo `m`, `return` y el operador bind `>>=`","Una cabeza, una cola y la lista vacía `[]` como caso base","Las funciones `map`, `filter` y `foldr` aplicadas sobre una lista","Las ligaduras `let` y `where` y las guardas con `|`"],"why":"El constructor m envuelve un dato a en m a (IO a, Maybe a, [a]); return :: a -> m a mete un valor en la mónada; y >>= encadena dos cómputos pasando el resultado del primero al segundo.","src":"Guía Haskell p. 5","imp":1,"ficha":"ud3-050"},{"id":"p3-041","ud":3,"tema":"Mónadas y equivalencias","q":"Ejemplo de la guía con `>>=`. Si las dos lecturas devuelven `'a'` y `'b'`, por este orden, ¿qué escribe el programa?","ops":["`ba`","`ab`","`a`","`bb`"],"why":"bind (>>=) encadena las acciones y pasa cada resultado a la siguiente: c1 = 'a' y c2 = 'b'. Después se escribe primero c2 y luego c1, así que el programa escribe ba.","src":"Guía Haskell p. 5","imp":1,"code":"leerEImprimir :: IO ()\nleerEImprimir =\n  getChar >>= \\c1 ->\n  getChar >>= \\c2 ->\n  putChar c2 >>= \\_ ->\n  putChar c1","ficha":"ud3-050"},{"id":"p3-042","ud":3,"tema":"Mónadas y equivalencias","q":"En Haskell, ¿qué es la notación `do` con la que se escriben acciones como `main` o `conversacion`?","ops":["Azúcar sintáctico para escribir en secuencia lo que serían varios `>>=`","Un bucle que repite las acciones hasta que se cumple una condición, como do-while","Una forma de declarar variables globales mutables para la entrada/salida","Una orden que ejecuta a la vez, en paralelo, todas las líneas del bloque"],"why":"do es azúcar sintáctico: permite escribir acciones IO una tras otra (putStrLn, nombre \u003c- getLine…) sin encadenar a mano los >>= y sin perder la pureza funcional de fondo. No es un bucle: no repite nada.","src":"Guía Haskell p. 6","imp":2,"ficha":"ud3-051"},{"id":"p3-043","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias de la guía: ¿cómo es el sistema de tipos de Common LISP y el de Haskell?","ops":["LISP: dinámico, en tiempo de ejecución; Haskell: estático, fuerte e inferido","LISP: estático, comprobado al compilar; Haskell: dinámico e inferido al ejecutar","LISP: estático y débil, como en C; Haskell: dinámico y declarado con `dec`","LISP: estricto y polimórfico; Haskell: dinámico y comprobado al ejecutar"],"why":"Common LISP verifica los tipos en tiempo de ejecución (dinámico); Haskell los fija al compilar y puede deducirlos sin que se escriban (sistema Hindley-Milner). «Estricto y polimórfico» es como la clase describe el tipado de Hope.","src":"Guía Haskell p. 6","imp":1,"ficha":"ud3-054"},{"id":"p3-044","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: donde C transforma lotes de datos con bucles manuales y acumuladores mutables, ¿qué usa Haskell?","ops":["`map`, `filter`, `foldr` y la composición `(.)`","`mapcar` y `reduce` sobre celdas cons","Bucles `loop` y `dotimes` con `setf`","Arreglos indexados `arr[i]` dentro de la mónada IO"],"why":"En la fila «Transformación de lotes», Haskell usa map, filter, foldr y composición (.). mapcar y reduce son la versión de Common LISP, y loop y dotimes, sus bucles híbridos.","src":"Guía Haskell p. 6","imp":2,"ficha":"ud3-046"},{"id":"p3-045","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo se maneja la entrada/salida en C, en Common LISP y en Haskell?","ops":["C y LISP, con sentencias impuras directas; Haskell la aísla en la mónada IO","C, con sentencias impuras directas; LISP y Haskell la aíslan en la mónada IO","Haskell la prohíbe por impura; C y LISP la hacen con printf y print","Los tres la encapsulan en mónadas para no romper la pureza"],"why":"C (printf, cin) y Common LISP (print, format t) hacen E/S impura directa. Haskell prohíbe las funciones impuras, pero no la E/S: la encapsula en la mónada IO y el resto del código sigue siendo puro.","src":"Guía Haskell p. 1–2 y 6–7","imp":1,"ficha":"ud3-056"},{"id":"p4-001","ud":4,"tema":"Paradigma lógico","q":"Un equipo describe un problema con hechos y reglas y deja que el motor de inferencia deduzca la solución, sin fijar la secuencia de pasos. ¿Qué enfoque sigue?","ops":["Declarativo, orientado al **qué**","Imperativo, orientado al **cómo**","Imperativo, orientado al **qué**","Declarativo, orientado al **cómo**"],"why":"Las diapositivas oponen el enfoque imperativo (pasos, control del flujo y del estado: el cómo) al declarativo (verdades y relaciones de las que el motor de inferencia deduce la solución: el qué).","src":"S4 diap. 3","imp":1,"ficha":"ud4-002"},{"id":"p4-002","ud":4,"tema":"Paradigma lógico","q":"Según las diapositivas, ¿qué aplica el motor de inferencia de un sistema lógico para deducir conclusiones a partir de la base de conocimiento?","ops":["Modus ponens, mediante unificación","Evaluación diferida, mediante reducción","Herencia, mediante paso de mensajes","Asignación de estado, mediante bucles"],"why":"Sistema lógico = base de conocimiento (hechos + reglas) + motor de inferencia, que aplica lógica de primer orden (modus ponens) y deduce mediante unificación. Los demás mecanismos son del funcional, la orientación a objetos y el imperativo.","src":"S4 diap. 4","imp":1,"ficha":"ud4-003"},{"id":"p4-003","ud":4,"tema":"Paradigma lógico","q":"Un programa diagnostica averías de un circuito eléctrico a partir de los síntomas, emulando el razonamiento de un electricista. ¿En qué dominio de la programación lógica encaja?","ops":["Sistemas expertos","Bases de datos deductivas","Verificación de modelos","Procesamiento de lenguaje natural"],"why":"Los sistemas expertos emulan a especialistas humanos para diagnosticar y decidir (la diapositiva cita fallos eléctricos o medicina). La verificación de modelos no diagnostica averías: comprueba formalmente que un diseño es correcto.","src":"S4 diap. 5; Unidad 4 p. 1","imp":2,"ficha":"ud4-004"},{"id":"p4-004","ud":4,"tema":"Paradigma lógico","q":"Según la unidad, ¿por qué resulta fácil modificar un programa lógico?","ops":["Añadir un hecho o una regla no altera los existentes: solo amplía el conocimiento","El programador fija el flujo exacto y decide en qué orden se aplica cada regla","El motor de inferencia reescribe por sí mismo las reglas que se han quedado obsoletas","Las variables pueden cambiar de valor durante la ejecución sin efectos laterales"],"why":"Es una de las ventajas del paradigma, junto a la claridad declarativa y la cercanía a la lógica matemática: una regla nueva añade otra vía de deducción sin tocar las demás. Fijar el flujo exacto es propio del enfoque imperativo.","src":"Unidad 4 p. 2","imp":2,"ficha":"ud4-005"},{"id":"p4-005","ud":4,"tema":"Lógica tradicional","q":"La fórmula ∀X: ingeniero(X) → listo(X) no puede escribirse en lógica proposicional. ¿Qué aporta la lógica de primer orden para expresarla?","ops":["Predicados con argumentos y cuantificadores (∀, ∃)","Conectores lógicos para unir proposiciones: AND, OR y NOT","La implicación (→) para encadenar una condición y su consecuencia","Proposiciones atómicas verdaderas o falsas"],"why":"La lógica proposicional ya tiene conectores, implicación y proposiciones atómicas, pero sin estructura interna. La de primer orden añade predicados con argumentos, como ingeniero(X), y los cuantificadores universal (∀) y existencial (∃).","src":"Unidad 4 p. 3","imp":2,"ficha":"ud4-008"},{"id":"p4-006","ud":4,"tema":"Lógica tradicional","q":"De la regla «todo ingeniero es listo» y del hecho «Juan es ingeniero» se deduce «Juan es listo». ¿Cómo se llama este razonamiento?","ops":["Modus ponens","Negación como fallo","Asunción del mundo cerrado","Backtracking"],"why":"El modus ponens obtiene una conclusión concreta a partir de una regla general y un hecho concreto. Es la base de los sistemas expertos y lo que hace el motor de inferencia con listo(X) :- ingeniero(X).","src":"Unidad 4 p. 3; S4 diap. 4","imp":1,"ficha":"ud4-009"},{"id":"p4-007","ud":4,"tema":"Lógica tradicional","q":"En una cláusula de Horn A ← B1 ∧ … ∧ Bn, ¿a qué parte de una regla Prolog corresponde A?","ops":["A la cabeza: lo que se quiere deducir","Al cuerpo: las condiciones que deben cumplirse","Al cuello `:-`, que se lee «si»","A la consulta que escribe el usuario tras `?-`"],"why":"A es la cabeza (la conclusión) y B1…Bn forman el cuerpo (las condiciones). Por eso en Prolog se escribe A :- B1, …, Bn: lo que se deduce va a la izquierda de :- y las condiciones, separadas por comas, a la derecha.","src":"Unidad 4 p. 3–4; S4 diap. 7","imp":1,"ficha":"ud4-010"},{"id":"p4-008","ud":4,"tema":"Lógica tradicional","q":"¿Quién propuso en 1965 el método de resolución, que sistematiza la deducción automática?","ops":["J. A. Robinson","Alain Colmerauer","Robert Kowalski","John McCarthy"],"why":"El método de resolución es de J. A. Robinson (1965). Colmerauer y Kowalski desarrollaron Prolog a comienzos de los años 70, y McCarthy es el creador de Lisp.","src":"Unidad 4 p. 4","imp":2,"ficha":"ud4-011"},{"id":"p4-009","ud":4,"tema":"Lógica tradicional","q":"¿Cómo trata Prolog un objetivo, según el algoritmo similar a la resolución que aplica sobre cláusulas de Horn?","ops":["Lo unifica con la cabeza de una cláusula, resuelve su cuerpo y retrocede si falla","Deduce antes todos los hechos posibles de la base y luego busca en ellos el objetivo","Calcula todos los modelos estables que satisfacen las reglas y devuelve uno","Recorre las reglas de arriba abajo y responde false en cuanto una de ellas falla"],"why":"Prolog unifica el objetivo con la cabeza de un hecho o regla, intenta satisfacer el cuerpo y, si una ruta falla, retrocede (backtracking). Deducir antes todos los hechos es lo que hace Datalog (bottom-up); los modelos estables son de ASP.","src":"Unidad 4 p. 4","imp":2,"ficha":"ud4-012"},{"id":"p4-010","ud":4,"tema":"Ingeniería del conocimiento","q":"La ingeniería del conocimiento construye sistemas basados en conocimiento (SBC). ¿Qué nombre reciben cuando emulan a especialistas humanos?","ops":["Sistemas expertos","Bases de datos deductivas","Solvers de ASP","Sistemas de verificación de modelos"],"why":"Un SBC que emula a un especialista humano (un médico, un electricista) es un sistema experto. Las bases de datos deductivas y los solvers de ASP también son lógicos, pero no se definen por imitar a un experto.","src":"Unidad 4 p. 4","imp":2,"ficha":"ud4-013"},{"id":"p4-011","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Cuál es el orden de los seis pasos de la ingeniería del conocimiento según las diapositivas?","ops":["Identificación, adquisición, formalización, implementación, verificación, mantenimiento","Adquisición, identificación, formalización, implementación, mantenimiento, verificación","Identificación, formalización, adquisición, implementación, verificación, mantenimiento","Identificación, adquisición, implementación, formalización, verificación, mantenimiento"],"why":"Se define el problema (identificación), se extraen las reglas (adquisición), se pasan a lógica (formalización), se codifican en Prolog (implementación), se prueban (verificación) y se mantienen; después se vuelve al inicio (iteración declarativa).","src":"S4 diap. 6; Unidad 4 p. 4–7","imp":1,"ficha":"ud4-015"},{"id":"p4-012","ud":4,"tema":"Ingeniería del conocimiento","q":"En el sistema de la lámpara, las reglas C1–C3 se reescriben como fórmulas lógicas no ambiguas (∀L: no_enciende(L) ∧ … → causa(L, …)), aún sin código. ¿Qué paso es?","ops":["Formalización","Adquisición","Implementación","Identificación"],"why":"Formalizar es traducir el conocimiento recopilado a una representación formal y no ambigua: predicados y fórmulas lógicas. La implementación viene después, al codificar esas fórmulas en Prolog.","src":"S4 diap. 6; Unidad 4 p. 5","imp":2,"ficha":"ud4-018"},{"id":"p4-013","ud":4,"tema":"Ingeniería del conocimiento","q":"Se entrevista a un electricista y se anotan reglas empíricas como «si la lámpara no enciende y no está enchufada, la causa es que está desenchufada». ¿Qué paso es?","ops":["Adquisición","Formalización","Verificación","Identificación"],"why":"La adquisición extrae el conocimiento de las fuentes (expertos, manuales, datos) como reglas si-entonces en lenguaje natural. La identificación es anterior: define el problema y los conceptos (síntomas, causas posibles).","src":"S4 diap. 6; Unidad 4 p. 5","imp":2,"ficha":"ud4-017"},{"id":"p4-014","ud":4,"tema":"Ingeniería del conocimiento","q":"Se descubre una causa nueva de avería («interruptor dañado») y se añade una regla al sistema de la lámpara. ¿Qué paso es y qué hay que tener en cuenta?","ops":["Mantenimiento: la regla nueva no rompe las existentes, pero hay que revalidar","Mantenimiento: hay que reescribir las reglas existentes para que no entren en conflicto","Adquisición: la regla nueva sustituye a las anteriores y no hace falta volver a probar","Verificación: antes de añadir la regla hay que eliminar una de las reglas antiguas"],"why":"El mantenimiento es la evolución continua de la base. Por su
