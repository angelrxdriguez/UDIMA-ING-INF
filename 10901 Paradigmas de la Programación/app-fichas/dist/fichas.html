binario. Es útil para ver fundamentos que Lisp no tiene.\nHaskell\nNació para el paradigma funcional y se usa fuera del ámbito académico. Tiene evaluación diferida y\nmónadas. Es el modelo de la programación funcional moderna.\nOtros\nPython, Java, C#, Scala, Kotlin, F#, Rust… soportan varios paradigmas. Valen para la AEC solo si se programa\ncon enfoque funcional, sin mutar variables.\n5 Ventajas e inconvenientes frente al imperativo min. 33:00\nVentajas\nInconvenientes\nSimplicidad: menos comandos. Haskell tiene 23\nidentificadores y un manual de 80 páginas; Ada, 62\nidentificadores y 200 páginas.\nDificultad: es poco intuitivo, porque estamos\nacostumbrados a pensar de forma procedimental y con\nbucles. Se consigue con práctica.\nRazonamiento formal: la transparencia referencial permite\nel razonamiento ecuacional (sustituir iguales por iguales).\nIneficiencia: es de 3 a 5 veces más lento y la recursividad\nconsume más memoria.\nConcisión: hasta 10 a 1 en líneas de código. Menos código\nimplica más fiabilidad.\nGran escala: no es apropiado para la programación a gran\nescala, aunque sí para investigar. Haskell, Standard ML y\nMiranda están mejorando.\nAbstracción: se ajusta al modelo del problema, no al del\ncomputador. El código es más reutilizable.\nParalelismo: sin efectos laterales es ideal para la\nprogramación paralela y concurrente (multinúcleo, hilos)."},{"s":"Resumen clase UD2 p. 7","u":2,"t":"","x":"Paradigmas de la Programación  ·  UD2  ·  El paradigma funcional\n7\n6 Common Lisp: chuleta de lo visto en clase\nPara probar el código sin instalar nada se puede usar un intérprete de Common Lisp en línea, como el de la clase.\nTodo se escribe como S-expresiones: entre paréntesis y en notación prefija o polaca, con el operador primero:\n(operador arg1 arg2 ...) min. 43:29\nConcepto\nSintaxis\nEjemplo → resultado\nOperación\n(op a b)\n(+ 2 3) → 5; (* 2 (+ 4 5)) → 18\nNo evaluar (dato\nliteral)\n'x o (quote x)\n'(1 2 3) → (1 2 3)\nImprimir\n(print x)\n(print '(+ 2 3)) → (+ 2 3), sin calcular\nImprimir con formato\n(format t \"~A~%\" x)\nt = terminal, ~A = valor legible, ~% = salto de línea\nComentarios\n; ;; ;;;\ncorto · línea completa · título de bloque. No es fin de\nsentencia como en C\nVariable global\n(defparameter *x* 10)\nConvención de asteriscos (earmuffs). También defvar\nVariable local\n(let ((a 1) (b 2)) cuerpo)\nSolo existe dentro de los paréntesis del let\nFunción\n(defun nombre (params) cuerpo)\n(defun sumar (a b) (+ a b))\nParámetro opcional\n&optional (p valor)\nÚtil para acumuladores y contadores\nCondicional simple\n(if test si-no)\nUna condición, una rama verdadera y una falsa\nCondicional múltiple\n(cond (t1 e1) (t2 e2) (t eN))\nVarias ramas en orden. (t ...) = else\nFunción anónima\n(lambda (params) cuerpo)\n((lambda (b h) (* b h)) 10 5) → 50\nConstruir listas\n(cons x l), (list a b c)\n(cons 5 '(10 20)) → (5 10 20)\nCabeza / cola\n(car l), (cdr l)\n(car '(10 20 30)) → 10; cdr → (20 30)\nLista vacía\n(null l)\nT si está vacía y NIL si no: sirve de caso base"},{"s":"Resumen clase UD2 p. 7","u":2,"t":"","x":"Par / impar\n(evenp n), (oddp n)\n(evenp 4) → T\nFunción como dato\n#'f, funcall, apply\n(funcall #'+ 10 5) → 15; (apply #'+ '(1 2\n3)) → 6\nMap / reduce\n(mapcar f l), (reduce f l)\n(mapcar (lambda (x) (* 2 x)) '(1 2)) → (2 4)\nif y cond (ejemplos de la guía, min. 59:14)\n(defparameter *edad* 20)\n(if (>= *edad* 18)\n    (format t \"Eres mayor de edad.~%\")     ; si es verdadero\n    (format t \"Eres menor de edad.~%\"))    ; si es falso (nil)\n(defparameter *nota* 15)\n(cond\n  ((>= *nota* 19) (format t \"Excelente~%\"))\n  ((>= *nota* 14) (format t \"Aprobado~%\"))      ; \u003c- se imprime este\n  ((>= *nota* 11) (format t \"Suficiente~%\"))\n  (t              (format t \"Reprobado~%\")))    ; t = rama por defecto (else)"},{"s":"Resumen clase UD2 p. 8","u":2,"t":"","x":"Paradigmas de la Programación  ·  UD2  ·  El paradigma funcional\n8\nlet, defun y lambda (min. 51:22, 56:01 y 1:06:21)\n(print (let ((base 10)\n             (altura 5))\n         (/ (* base altura) 2)))          ; 25. base y altura no existen fuera del let\n(defun saludar-usuario (usuario)\n  (print (concatenate 'string \"hola \" usuario \", como estas?\")))\n(saludar-usuario \"Antonio\")              ; \"hola Antonio, como estas?\"\n(print ((lambda (base altura) (* base altura)) 10 5))   ; 50, función anónima\nListas y recursión: el patrón que más vas a usar (ejemplo 2.19 del libro en Common Lisp actual)\n;; Lista '(10 20 30) en memoria: cada celda cons tiene car (dato) y cdr (resto)\n;;   [10 | •]→[20 | •]→[30 | NIL]\n(defun sumar-lista (l)\n  (if (null l)\n      0                                    ; caso base: lista vacía\n      (+ (car l) (sumar-lista (cdr l)))))  ; cabeza + suma de la cola\n(print (sumar-lista '(4 8 5 10)))         ; 27\nErrores típicos en Lisp\n• Olvidar que todo va entre paréntesis y que el operador va primero: (>= edad 18), no (edad >= 18).\n• Olvidar el apóstrofe en las listas de datos: (car '(1 2 3)). Sin él, Lisp intenta ejecutar 1 como si fuera una\nfunción.\n• La t de format indica la salida por terminal; la t final de cond hace de else.\n• En el intérprete en línea de la clase, print no muestra bien las tildes ni el ¿.\n• Lisp permite setf/setq, loop y variables globales porque no nació funcional. Si los usas, pierdes el enfoque\nfuncional (y puntos en la AEC).\nConcepto\nImperativo (C / Java)"},{"s":"Resumen clase UD2 p. 8","u":2,"t":"","x":"Funcional (Common Lisp)\nFlujo de ejecución\nSentencias secuenciales, for, while\nEvaluación de expresiones recursivas\nVariables\nCeldas de memoria mutables (i++)\nLigaduras inmutables (let, argumentos)\nFunciones\nSubrutinas con posibles efectos laterales\nFunciones puras (caja negra matemática)\nRecorrer colecciones\nÍndices: array[i]\nCabeza y cola: car / cdr\nTransformar en lote\nBucles con acumuladores manuales\nmapcar y reduce\n7 Preguntas tipo examen (con respuesta)\n1.\n¿De qué dos formas se suele especificar una función?\nDeclarativamente (matemáticamente) o procedimentalmente.\n2.\n¿Cómo se llama la propiedad por la que una función, con los mismos datos de entrada, solo puede producir un\núnico valor de salida?\nTransparencia referencial.\n3.\n¿Qué caracteriza a una función de orden superior?\nQue sus argumentos y su valor de retorno pueden ser otras funciones.\n4.\n¿Sería válido utilizar un puntero en este paradigma?\nNo, porque un puntero incorpora el concepto de estado de memoria, que no es válido en el paradigma."},{"s":"Resumen clase UD2 p. 9","u":2,"t":"","x":"Paradigmas de la Programación  ·  UD2  ·  El paradigma funcional\n9\n5.\n¿Qué es una función con polimorfismo paramétrico?\nLa que implementa una misma ejecución admitiendo argumentos de distintos tipos de datos.\n6.\n¿Qué tipo de llamada se realiza en la evaluación ansiosa y en la diferida?\nEn la ansiosa, una llamada por valor (call by value); en la diferida, una llamada por necesidad (call by need).\n7.\n¿Qué es una mónada?\nUn elemento encapsulado que proporciona características procedimentales sin perder los beneficios del\nparadigma funcional.\n8.\n¿Cuáles son los elementos fundamentales de un programa funcional?\nLas funciones, la recursividad y las listas.\n9.\n¿Son las mónadas una característica básica de la programación funcional?\nNo. Son elementos encapsulados que aportan características procedimentales.\n10. Enumera las ventajas del paradigma funcional frente al imperativo.\nSimplicidad, posibilidad de razonamiento formal, concisión, abstracción y paralelismo.\n11. ¿Qué es un efecto lateral? Pon ejemplos.\nQue una función modifique o dependa de algo externo a ella, de modo que la misma llamada dé resultados\ndistintos. Ejemplos: variables globales, parámetros por referencia, variables static y operaciones de E/S.\n12. Si no hay bucles, ¿cómo se itera?\nCon recursividad: un caso base que detiene la recursión y un caso recursivo que reduce el problema (en listas,\navanzando con cdr).\n13. ¿Por qué la evaluación diferida encaja mal en el paradigma procedimental?\nPorque el programador pierde el control del orden de evaluación y, con efectos laterales, los resultados cambian"},{"s":"Resumen clase UD2 p. 9","u":2,"t":"","x":"(cuadrado(getint(f)): 4 con evaluación ansiosa y 10 con diferida).\n14. ¿Es Lisp un lenguaje funcional puro?\nNo. Es híbrido: tiene asignación destructiva (setq), bucles (loop), arrays y variables globales, y no tiene\nevaluación diferida.\n15. ¿Qué diferencia hay entre if y cond en Lisp?\nif evalúa una sola condición con una rama verdadera y otra falsa. cond evalúa varias ramas en orden, y (t ...)\nactúa como else.\n16. ¿Por qué Hadoop o Spark usan map y reduce en vez de un bucle for? (AEC1, ejercicio 10)\nmap aplica una función pura a cada elemento de forma independiente y sin estado compartido, así que el trabajo\nse puede repartir entre muchos nodos en paralelo. reduce combina después los resultados parciales. Sin efectos\nlaterales no hay conflictos entre los nodos.\n17. ¿Por qué el paradigma funcional vuelve a estar de moda?\nPorque las limitaciones de hardware que lo frenaron (poca memoria y un solo procesador) ya no existen, y la\nausencia de efectos laterales facilita aprovechar los procesadores multinúcleo y la concurrencia.\n8 Relación con la AEC1\nEn clase se presentó la AEC1 sobre el paradigma funcional min. 38:09. Datos clave del enunciado:\n• Se puede hacer en Lisp, Hope, Haskell… o en Python, Java, etc., siempre que el enfoque sea funcional, usando los\npilares y sin mutar variables.\n• Se entrega un fichero de código (.lsp, .hop, .hs…) llamado nombre_apellido1_apellido2_AEC1.lsp. Debe\nllevar una cabecera en comentarios (; Paradigmas de la Programación, ; AEC1, ; Nombre: ...), cada ejercicio\nmarcado (; Ejercicio 2) y las respuestas teóricas como comentarios."},{"s":"Resumen clase UD2 p. 10","u":2,"t":"","x":"Paradigmas de la Programación  ·  UD2  ·  El paradigma funcional\n10\n• Se valoran la explicación de las soluciones, que sean correctas, la entrega en plazo y con el formato pedido, y usar\nexactamente los nombres de función del enunciado.\nEjercicio\nConcepto que pone a prueba\n1 imprimir_bienvenida\nSalida por pantalla (format / print)\n2 longitud_lista\nRecursividad pura sin length: caso base con null y avance con cdr\n3-4 encontrar_minimo (y posición)\nRecursión sobre listas; posición con acumulador &optional, como\nprimer-par-pos\n5 sumar_max_y_min\nReutilizar y generalizar funciones: orden superior (pasar #'\u003c o #'>)\n6-7 obtener_caracter_n / trinomio_n\nRecorrer con contador y polimorfismo paramétrico (¿se puede generalizar?)\n8 duplicar_lista\nRecursividad y mapcar + lambda. Qué es una lambda y sus ventajas\n9 repetir_accion_n\nFunción como parámetro (funcall) y recursión en lugar de bucles\n10 map/reduce y tipado\nTeoría: paralelismo sin efectos laterales y tipado del lenguaje (Lisp: dinámico)\n9 Mapa de la clase (para buscar en el vídeo)\nMinuto\nTema\nMinuto\nTema\n00:26\nPresentación de la UD2: el paradigma funcional\n34:56\nInconvenientes y dificultad de pensar en\nfuncional\n01:52\nOrígenes (Church, λ-cálculo) y procedimental\nfrente a declarativo\n37:51\nMaterial del aula virtual y AEC1\n06:30\nLos pilares del paradigma\n39:41\nEntorno en línea para probar Lisp\n09:42\nTransparencia referencial y efectos laterales\n(ejemplo en C++)\n43:29\nS-expresiones y notación polaca\n14:26\nComposición funcional\n45:24\nprint, apóstrofe y quote"},{"s":"Resumen clase UD2 p. 10","u":2,"t":"","x":"16:23\nFunciones como objetos de primera clase\n48:15\nOperaciones anidadas y comentarios\n18:11\nAusencia de estado\n51:22\nVariables globales y locales (let)\n20:00\nRecursividad en lugar de bucles\n56:01\nDefinir funciones con defun\n22:45\nPolimorfismo: sobrecarga, dinámico y\nparamétrico\n59:14\nCondicionales: if y cond\n24:23\nEvaluación ansiosa y diferida; listas infinitas\n1:06:21\nFunciones lambda\n26:36\nMónadas\n1:09:39\nListas: cons y list\n29:00\nLenguajes: Lisp, Hope y Haskell\n1:10:40\ncar, cdr, null y evenp/oddp\n33:00\nVentajas del paradigma\n1:12:44\nRecomendaciones; la semana que viene, los\nmismos ejemplos en Hope y Haskell"},{"s":"introduccion.lisp parte 1","u":2,"t":"","x":"```lisp\n;\n; Introducción a LISP\n; \n; Profesor: \n;        Antonio Martín Garre\n;\n;\n; Origen: \n;\n;        1958, John McCarthy (MIT)\n;        1957-Fortran, 1958-LISP, 1959-COBOL\n;        Basado en el cálculo lambda de Alonzo Church (1936), que fue profesor de Alan Turing.\n;\n;\n; Características: \n;\n;        LISP=LISt Processing        \n;        Paradigma: Programación declarativa/funcional.\n;        Incluye Expresiones lambda, liberación automática de memoria, tipos dinámicos...\n;        Notación prefija o polaca: + 2 2 en lugar de 2 + 2\n;        Todo se representa como listas con términos. \n;        Las listas son inmutables (operaciones no destructivas)\n;        Se procura que no haya efectos laterales -> más cercano a las matemáticas.\n;        Hay varios dialectos, principalmente Scheme y Common Lisp\n;        Usaremos Common LISP (CL), concretamente su implementación opensource llamada SBCL (Steel Bank Common LISP)\n;        Uso habitual en IA.\n;\n;\n; Entorno de desarrollo: \n; Se suele usar el IDE Emacs, integrado con el interprete de LISP. \n; Mi instalación: Docker y Visual Studio Code. \n;\n;        docker pull wshito/sbcl-swank\n;        docker run -it --rm -p 4005:4005 wshito/sbcl-swank\n;        Extensión 'alive' para Visual Studio Code.\n; \n\n\n```"},{"s":"introduccion.lisp parte 2","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n; Conceptos básicos en LISP\n```"},{"s":"introduccion.lisp parte 3","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n\n\n; Notación prefija o polaca en LISP\n\n(+ 2 3) ; 2 + 3\n(* 2 (+ 4 5)) ; 2 * (4 + 5)\n\n; Entrada y salida básicos\n; Imprimiendo el resultado\n\n(print (+ 2 3))\n(print (* 2 (+ 4 5)))\n\n; Imprimiendo el valor de entrada del usuario\n\n(print(read))\n\n;\n; El clásico \"Hola mundo\" \n; La forma especial 'defun' permite definir una función.\n;\n(\n    defun saludar()\n          (print \"Hola mundo!\")\n)\n\n(saludar)\n\n;\n; Funcion que suma dos números \n;\n(\n    defun sumar (a b)\n          (+ a b)\n)\n\n(print(sumar 2 3))\n\n;\n; Saludar a \u003cnombre de usuario> \n;\n(\n     defun saludarUsuario(usuario)\n           (print (concatenate 'string \"hola \" usuario \", cómo estás?\"))\n)\n\n\n(saludarUsuario \"Antonio\")\n\n;\n; Usando quote o ', para no evaluar una lista\n; De otra manera, cualquier lista siempre se evalua\n;\n(print (1 2 3)) ; da error, pues trata de evaluar (1 2 3)\n(print '(1 2 3)); imprime la lista (1 2 3)\n(print (quote(1 2 3))); es lo mismo que la expresión anterior\n\n```"},{"s":"introduccion.lisp parte 4","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n; Valores lógicos en LISP\n```"},{"s":"introduccion.lisp parte 5","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n(= 2 3) ; FALSO en LISP, se evalua como NIL\n(= 2 2) ; VERDADERO en LISP, se evalua como T\n(NOT T) ; NO T => NIL\n(NOT NIL); NO NIL => T\n\n() ; se evalua como NIL\nT ; se evalua como T (true)\n\n```"},{"s":"introduccion.lisp parte 6","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n; Declaración de variables en LISP\n```"},{"s":"introduccion.lisp parte 7","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n\n\n; globales: con setf. Son visibles en todo el programa\n; locales; con let. Son visibles sólo en el ámbito declarado.\n;\n(\n    setf *profesor* \"Antonio Martin\"\n)\n\n(saludarUsuario *profesor*)\n\n(\n    let (\n          (alumno1 \"Alejandro\")\n          (alumno3 \"Beatriz\")\n          (alumno2 \"Juanito\")\n        )\n\n        ; codigo que usa las variables, aquí\n         (saludarUsuario alumno1)\n         (saludarUsuario alumno2)\n         (saludarUsuario alumno3)\n             \n)\n\n(print '(1 2 3 4 5))\n\n```"},{"s":"introduccion.lisp parte 8","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n; Estructuras de control en LISP\n```"},{"s":"introduccion.lisp parte 9","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n\n\n; Funcion recursiva: cálculo del factorial \n; En LISP existe IF y COND para expresiones condicionales. \n;\n; Sintaxis de IF:\n; \n; (if (predicado) (entonces_hacer_esto) (en_otro_caso_hacer_esto))\n;\n; Sintaxis de COND:\n;\n;(cond ((predicado1) (entonces_hacer_esto1))    \n;      ((predicado2) (entonces_hacer_esto2))  \n;      (T (en_otro_caso_hacer_esto))                    \n;)\n;\n(\n    defun factorial(n)\n    (\n        if (= n 0) 1\n           (* n (factorial (- n 1)))\n    )      \n\n)\n\n(print (factorial 6))\n(trace factorial)\n(untrace factorial)\n\n\n\n\n```"},{"s":"introduccion.lisp parte 10","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n; Manipulación de listas en LISP\n```"},{"s":"introduccion.lisp parte 11","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n\n(first '(A E I O U)) ; A \n(car '(A E I O U)) ; A, es lo mismo que first\n\n(rest '(A E I O U)) ; E I O U\n(cdr '(A E I O U)) ; E I O U, es lo mismo que rest\n\n; Explicación de los nombres CAR y CDR\n;   CAR abreviación de \"Contents of the Address part of Register number\" (Contenido de la parte dirección del número de registro),\n;   CDR \"Contents of the Decrement part of Register number\" (contenido de la parte decremento del número de registro),\n\n; Accediendo a los elementos de una lista\n(second '(A E I O U)); E\n(third '(A E I O U)); I\n(nth 4 '(A E I O U)); U\n\n; Construyendo cadenas:\n(cons 'A '(E I)); (A E I) - Concatena el primer elemento al segundo\n(cons '(A E) '(I O)); ((A E) I O) - Otro ejemplo\n(append '(A E) '(I O)) ; (A E I O) - Concatena ambas listas\n(list '(A E I O U)) ; (A E I O U) - devuelve la lista de la expresión\n(last '(A E I O U)) ; (U) - devuelve una lista con el último elemento\n(reverse '(A E I O U)) ; (U O I E A) - devuelve la lista invertida\n(length '(A E I O U))  ; 5 - devuelve la longitud de la lista\n(subst 'X 'E '(A E I O U)) ; A X I O U ; sustituye 'viejo' por 'nuevo' en 'lista': subst nuevo viejo lista\n(remove 'b '(a b c d) :test #'eql); devuelve una lista sin el elemento seleccionado (A C D) \n\n; MEMBER: Comprueba si existe una ocurrencia de elemento en lista. Si no existe ocurrencia devuelve NIL\n; si existe, devuelve su primera aparición junto al resto de la lista\n(member 'b '(a b c d) :test #'equal) ;  (b c d)\n(member 'b '(a (b c) d) :test #'eql) ;  NIL\n(member '(b c) '(a (b c) d) :test #'equal) ; ((b c) d)\n \n```"},{"s":"introduccion.lisp parte 12","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n; Estructuras en LISP\n```"},{"s":"introduccion.lisp parte 13","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n; Permite definir estructuras de datos.\n \n\n (defstruct rectangle\n  (height)\n  (width 5))\n\n(defvar rectangle-1)\n\n(setf rectangle-1\n      (make-rectangle :height 10 :width 15))\n\n(print rectangle-1)\n(rectangle-height rectangle-1)\n\n```"},{"s":"introduccion.lisp parte 14","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n; Ejecución de sentencias en LISP\n```"},{"s":"introduccion.lisp parte 15","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n; progn: evalua por orden cada sentencia. Devuelve el valor de la última sentencia.\n; Existen tambien prog1, prog2...\n(progn  \n    (+ 1 4) \n    (* 5 3)\n    (+ 2 2)) \n\n```"},{"s":"introduccion.lisp parte 16","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n; Funciones Lambda en LISP\n```"},{"s":"introduccion.lisp parte 17","u":2,"t":"","x":"```lisp\n;--------------------------------------------------------------------\n \n; Funcion que incrementa cada elemento de una lista.\n; MAPCAR: (map) Aplica a cada elemento x de una lista, la función lambda x->x+1\n(\n     defun incrementar(lista)\n        (mapcar (lambda (x) (+ x 1)) lista)\n)\n\n(print (incrementar '(1 2 3 4 5 6)))\n\n; Factorial de 4\n; FUNCALL: Invoca a una función dinámicamente\n; Se usa #'factorial para referirnos a una función (si bien, sin # también funciona)\n\n(print (funcall #'factorial '4))\n(print (funcall #'sumar 8 3))\n\n; Factorial de 4\n; APPLY: Invoca a una función dinámicamente. \n; Igual que Funcall, pero con los parámetros en una lista\n\n(print (apply #'sumar '(8 3)))\n\n;\n; Funcion que suma todos los elementos de una lista\n; REDUCE: Aplica a cada 2 elementos la función lambda indicada (sumar), devolviendo un valor\n;\n(\n     defun sumarLista(lista)\n        (reduce 'sumar lista)\n)\n\n(sumarLista '(1 2 3 4 5 6))\n\n;\n; El carácter especial # tiene diferentes usos:\n;\n(print (funcall #'factorial '4))   ; para indicar (function functionname) #'\n(print #(1 2 3))         ; vector con elementos 1 2 3 #(\n(print #c(1 2))          ; número complejo #c\n(print #xFFFF)           ; número hexadecimal #x\n(print #b1111)           ; número binario #b\n\n;\n; Como en cualquier otro lenguaje funcional, es común anidar funciones\n; Ojo con los parentesis en estos casos!\n\n(print (mapcar #'factorial '(1 2 3 4))) ; (1 2 6 24) \n(print (reduce #'sumar (mapcar #'factorial '(1 2 3 4)))) ; 33\n\n; estas expresiones son equivalentes\n(print (reduce #'sumar '(1 2 3 4))); 10\n(print (reduce #'+ '(1 2 3 4))); 10\n\n \nCL-USER> \n; número hexadecimal #x\n; No value\nCL-USER> \n```"},{"s":"S3 diap. 2","u":3,"t":"El Lenguaje Hope y el Paradigma Funcional","x":"Una anatomía comparativa: Hope, LISP y Haskell\n\n[Figura: tres cintas de colores (azul, roja, verde) que se entrecruzan alrededor de una λ y bajan a una cuadrícula de bloques; representa los tres lenguajes a comparar]\n\nPie: Paradigmas de la Programación · Juntos hacia tu objetivo"},{"s":"S3 diap. 3","u":3,"t":"La Evolución de la Lógica Pura","x":"[Figura: línea de tiempo con cuatro hitos]\n\n- **1936: Cálculo Lambda** — Alonzo Church. La base matemática fundamental.\n- **1958: LISP** — John McCarthy. El código es dato. Estructuras de listas y notación prefija.\n- **Años 70: Hope** — Universidad de Edimburgo. El pionero. Introduce el encaje de patrones y tipos de datos algebraicos.\n- **1990: Haskell** — Comité Haskell. Pureza estricta, tipado estático y evaluación perezosa."},{"s":"S3 diap. 4","u":3,"t":"El Cambio de Paradigma: Pensar como un Matemático","x":"[Figura: comparación de dos columnas; a la izquierda engranajes y una caja «Memoria: X» con el valor 1 tachado y 2 escrito debajo; a la derecha un diagrama X → f(x) → Y]\n\n**Imperativo (Tradicional)**\n- Efectos secundarios y mutación.\n- Variables que cambian de estado.\n- Control mediante bucles (for/while).\n\n**Funcional (Matemático)**\n- Inmutabilidad y pureza.\n- Sin estados alterados.\n- Solo depende de entradas y salidas."},{"s":"S3 diap. 5","u":3,"t":"Anatomía de Hope: El Pionero del Encaje de Patrones","x":"Hope revolucionó la programación funcional al introducir la evaluación basada en la forma de los datos, eliminando la necesidad de condicionales complejos.\n\n[Figura: una pieza con forma de casa/triángulo sobre rectángulo se clasifica hacia uno de tres huecos: Slot 1 (círculo), Slot 2 (la misma forma de la pieza, «cuadrado con triángulo») y Slot 3 (rectángulo); ilustra el encaje de patrones por la forma del dato]\n\n```\ndec clasificar : forma -> texto;\n\n--- clasificar (circulo) \u003c= texto1;\n--- clasificar (cuadrado_con_triangulo) \u003c= texto2;\n```"},{"s":"S3 diap. 6","u":3,"t":"El Árbol de Ejecución: Sintaxis Comparada","x":"Toda operación matemática es un árbol. Los lenguajes funcionales difieren en cómo lo escriben.\n\n[Figura: árbol de expresión con + en la raíz; hijos 2 y *; el * tiene hijos 3 y 4]\n\n**Notación Prefija**\n```\n(+ 2 (* 3 4))\n```\nLa función precede a los argumentos.\n\n**Notación Infija con Tipos**\n```\n2 + (3 * 4)\n```\nInt -> Int -> Int\nEvaluación estricta clásica.\n\n**Notación Infija**\n```\n2 + (3 * 4)\n```\nMatemáticamente puro."},{"s":"S3 diap. 7","u":3,"t":"La Matriz de Rosetta Funcional","x":"| | LISP | Hope | Haskell |\n|---|---|---|---|\n| Definición de Función | `(defun suma (a b)`\u003cbr>`  (+ a b))` | `dec suma : num`\u003cbr>`  # num -> num;`\u003cbr>\u003cbr>`--- suma(a,b) \u003c= a + b;` | `suma a b = a + b` |\n| Sistema de Tipado | Dinámico (Evaluación en tiempo de ejecución) | Estricto y Polimórfico (Declaración explícita) | Estático e Inferido (Matemáticamente derivado) |\n| Control de Flujo | Anidación (if, cond) | Encaje de Patrones (---) | Encaje de Patrones y Guardas (\\|) |"},{"s":"S3 diap. 8","u":3,"t":"Capacidad 1: Recursividad como Motor de Iteración","x":"Sin bucles tradicionales, los lenguajes funcionales iteran descomponiendo el problema hasta un caso base.\n\n[Figura: cadena de cajas apiladas «3 * Factorial(2)», «2 * Factorial(1)», «1 * Factorial(0)» y «1 (Caso Base / Condición de Parada)»; flechas de vuelta desde el caso base devuelven los valores 1, 1, 2 y 6, es decir, el resultado se propaga hacia arriba hasta 6]"},{"s":"S3 diap. 9","u":3,"t":"Código Comparativo: Factorial","x":"**LISP**\n```\n(defun factorial (n)\n  (if (= n 0)\n      1\n      (* n (factorial (- n 1))))\n```\nUso de condicional explícito (if).\n\n**Hope**\n```\ndec fact : num -> num;\n\n--- fact 0 \u003c= 1;\n--- fact n \u003c= n * fact(n-1);\n```\nReglas de deconstrucción directas.\n\n**Haskell**\n```\nfactorial 0 = 1\nfactorial n = n * factorial (n-1)\n```\nEnrutamiento implícito por forma."},{"s":"S3 diap. 10","u":3,"t":"Capacidad 2: Deconstrucción de Estructuras","x":"Los datos inmutables no se modifican en memoria. Se procesan separando el primer elemento del resto de la lista.\n\n[Figura: tren; la locomotora está rotulada «Cabeza (Primer Elemento)» y los tres vagones «Cola (Resto de la Lista)»]\n\n- **LISP**: Usa funciones históricas 'car' (cabeza) y 'cdr' (cola).\n- **Hope**: Usa el operador '::' (ej. x :: xs).\n- **Haskell**: Usa el operador ':' (ej. x : xs)."},{"s":"S3 diap. 11","u":3,"t":"Código Comparativo: Recorriendo Listas","x":"Ejemplo: Sumar 10 al primer elemento de una lista estructurada.\n\n**LISP**\n```\n(cons (+ 10 (car lista))\n              (cdr lista))\n```\n[Figura: flechas desde `(car lista)` hacia «Extrae la cabeza» y desde `(cdr lista)` hacia «Extrae la cola»]\n\n**Hope**\n```\ndec sumarDiez : list(num) -> list(num);\n\n--- sumarDiez nil \u003c= nil;\n--- sumarDiez (x::xs) \u003c= (x+10) :: xs;\n```\n[Figura: flecha hacia «Destructuración en patrón»]\n\n**Haskell**\n```\nsumarDiez [] = []\nsumarDiez (x:xs) = (x + 10) : xs\n```\n[Figura: flecha hacia «Separación automática»]"},{"s":"S3 diap. 12","u":3,"t":"Capacidad 3: Funciones de Orden Superior","x":"Las funciones son ciudadanos de primera clase. Pueden ser pasadas como variables o insertadas como lógica intercambiable.\n\n[Figura: una caja «Procesador Principal» recibe [Datos] por la izquierda y entrega [Datos Transformados] por la derecha; una pieza «Función Lambda (λ) - Lógica Anónima» se inserta por una ranura superior]"},{"s":"S3 diap. 13","u":3,"t":"Transformación y Reducción: Map & Reduce","x":"[Figura: cinta transportadora; entra la lista [1, 2, 3], pasa por una máquina con «link: (λ x -> x+5)» y sale [6, 7, 8], que cae a un embudo «REDUCE: (+)» cuyo resultado es 21]\n\n- **LISP**: `(reduce #'+ (mapcar (lambda (x) (+ x 5)) lista))`\n- **Hope**: `reduce( +, map( lambda x => x+5, lista ) )`\n- **Haskell**: `foldl (+) 0 (map (\\x -> x + 5) lista)`"},{"s":"S3 diap. 14","u":3,"t":"La Síntesis: El Legado Funcional en Big Data","x":"La inmutabilidad de 1958 y los patrones de los años 70 garantizan la seguridad del procesamiento distribuido moderno.\n\n[Figura: «Dataset Masivo (Apache Spark)» se reparte en tres nodos, «Nodo Servidor A», «Nodo Servidor B» y «Nodo Servidor C», cada uno con «Map -> Reduce»; los tres convergen en «Resultado Agregado Seguro»]\n\nAl carecer de efectos secundarios, las evaluaciones perezosas de funciones map/reduce pueden distribuirse a través de miles de servidores. Sin estado compartido, no existen colisiones."},{"s":"S3 diap. 15","u":3,"t":"Eligiendo el Dialecto Funcional","x":"[Figura: diagrama de Venn de tres círculos solapados]\n\n**HOPE**: El pionero académico. Estricto, explícito, y el inventor del encaje de patrones. Ideal para comprender la teoría pura de estructuras de datos.\n\n**LISP / Scheme**: Dinámico y maleable. El código escribe código (macros). El lenguaje programable supremo impulsado por listas.\n\n**HASKELL**: La fortaleza matemática. Tipado estático seguro y evaluación perezosa. \"Si compila, funciona\"."},{"s":"S3 diap. 16","u":3,"t":"Más que un Lenguaje, una Forma de Pensar","x":"[Figura: símbolo λ grande]\n\nYa sea estructurando reglas en Hope, manipulando listas en LISP, infiriendo tipos en Haskell o procesando datos en Python, el paradigma funcional nos enseña a diseñar sistemas predecibles, inmutables y matemáticamente puros."},{"s":"Guía Haskell p. 1","u":3,"t":"","x":"Guía de Estudio: Haskell y los Fundamentos del\nParadigma Funcional\nEsta guía articula la sintaxis fundamental de Haskell con los conceptos nucleares\ndel paradigma funcional.\n1. Fundamentos de Haskell: Sintaxis, Evaluación y Memoria\nHaskell utiliza una sintaxis limpia inspirada directamente en el cálculo lambda y la\nnotación matemática. Haskell es un lenguaje funcional puro, con tipado estático\nfuerte e inferido, y evaluación diferida o perezosa (lazy evaluation).\nEvaluación Diferida (Lazy Evaluation o Call-by-Need)\nHaskell no evalúa los argumentos de una función al momento de ser invocada\n(como sí lo hace la evaluación ansiosa o call-by-value). En su lugar, posterga el\ncómputo hasta que el resultado sea estrictamente necesario para la ejecución:\n• Permite definir y manipular estructuras y listas infinitas sin provocar\ndesbordamientos de memoria ni bucles infinitos, ya que solo se calcula la\nporción requerida.\n• Desacopla la generación de datos de su consumo real.\n-- Generador de una lista infinita de enteros a partir de 1\nenteros :: [Integer]\nenteros = [1..]"},{"s":"Guía Haskell p. 1","u":3,"t":"","x":"-- Solo se calculan los primeros 5 elementos al consumirlos\nprimerosCinco :: [Integer]\nprimerosCinco = take 5 enteros  -- Resultado: [1, 2, 3, 4, 5]\n\nFirmas y Declaración de Tipos (::)\nEn Haskell, las funciones y los valores poseen tipos definidos en tiempo de\ncompilación. Aunque el compilador puede inferirlos, la convención didáctica y formal\nexige declarar la firma de tipo separando los argumentos mediante la flecha (->),\nreflejando el principio de currificación (currying):\n-- Declaración de tipo (firma): toma dos enteros y produce un entero\nsumar :: Int -> Int -> Int\nsumar a b = a + b\n\nEntrada y Salida con Pureza Referencial (Mónada IO)\nHaskell prohíbe funciones impuras que alteren la memoria de forma arbitraria o\nproduzcan efectos colaterales descontrolados en pantalla. Toda acción de\nentrada/salida queda encapsulada dentro de la mónada IO, la cual modela una"},{"s":"Guía Haskell p. 2","u":3,"t":"","x":"acción que interactúa con el mundo exterior manteniendo el resto del código\npuramente referencial:\n-- putStrLn imprime una cadena y añade un salto de línea\n-- print imprime cualquier dato con formato legible\nmain :: IO ()\nmain = do\n    putStrLn \"Hola mundo desde Haskell!\"\n    print (sumar 10 5)\n\nÁmbito y Ligaduras Locales (let y where)\nEn Haskell no existen variables globales mutables reasignables (a diferencia de\ndefparameter o defvar en LISP). Los valores son inmutables y se asocian mediante\nligaduras léxicas locales acotadas a la expresión:\n-- 1. Ligadura local con 'let ... in'\nareaTrianguloLet :: Double -> Double -> Double\nareaTrianguloLet base altura =\n    let producto = base * altura\n    in producto / 2\n\n-- 2. Cláusula 'where' (declara definiciones auxiliares al final de la función)\nareaTrianguloWhere :: Double -> Double -> Double\nareaTrianguloWhere base altura = producto / 2\n    where producto = base * altura"},{"s":"Guía Haskell p. 2","u":3,"t":"","x":"Bifurcaciones Condicionales: if-then-else, Guardas y Pattern Matching\nHaskell no tiene sentencias de control imperativas; cada bifurcación es una\nexpresión matemática que debe devolver un valor en todas sus ramas:\n-- 1. Expresión if-then-else (ambas ramas son obligatorias y del mismo tipo)\nesMayorDeEdad :: Int -> String\nesMayorDeEdad edad = if edad >= 18 then \"Mayor de edad\" else \"Menor de edad\"\n\n-- 2. Guardas con '|' (análogo a 'cond' en LISP)\nclasificarNota :: Int -> String\nclasificarNota nota\n    | nota >= 19 = \"Excelente\"\n    | nota >= 14 = \"Aprobado\"\n    | nota >= 11 = \"Suficiente\"\n    | otherwise  = \"Reprobado\"  -- 'otherwise' actúa como el caso por defecto (t en LISP)\n\nFunciones Anónimas (Expresiones Lambda \\)\nSe definen utilizando la barra invertida \\ (que emula la letra griega 𝜆), seguida de los\nparámetros y la flecha ->:\n-- Función anónima para calcular el área de un rectángulo aplicada de inmediato:\nareaRectangulo :: Int"},{"s":"Guía Haskell p. 3","u":3,"t":"","x":"areaRectangulo = (\\base altura -> base * altura) 10 5  -- Evalúa a 50\n\n2. Anatomía de las Listas en Haskell\nLas listas en Haskell son colecciones homogéneas (todos sus elementos deben ser\ndel mismo tipo) y están construidas recursivamente mediante dos constructores\nfundamentales:\n• []: Lista vacía (equivalente a NIL en LISP o nil en Hope).\n• : (Operador cons): Añade un elemento a la cabeza de una lista existente.\n-- La lista [10, 20, 30] es una abreviación de: 10 : (20 : (30 : []))\nmiLista :: [Int]\nmiLista = [10, 20, 30]\n\nOperaciones Estructurales y Descomposición:\n• head (Cabeza / car en LISP): Extrae el primer elemento.\n• tail (Cola / cdr en LISP): Devuelve el resto de la lista sin su cabeza.\n• null: Predicado que devuelve True si la lista está vacía ([]), indispensable para\nidentificar casos base recursivos.\n\nprimerElemento = head [10, 20, 30]  -- 10\nrestoLista     = tail [10, 20, 30]  -- [20, 30]\nestaVacia      = null []            -- True"},{"s":"Guía Haskell p. 3","u":3,"t":"","x":"3. Los 5 Pilares del Paradigma Funcional en Haskell\nPilar 1: Transparencia Referencial y Funciones Puras\nUna función pura carece de efectos laterales y satisface la propiedad de que, ante\nlos mismos argumentos de entrada, siempre devolverá exactamente la misma\nsalida. Esto permite sustituir cualquier llamada por su valor sin alterar el\ncomportamiento global del sistema (razonamiento ecuacional).\n-- Puro: determinista y sin efectos secundarios\nsumarPuro :: Int -> Int -> Int\nsumarPuro a b = a + b\n\nPilar 2: Ausencia de Estado Mutable y Recursividad\nEn Haskell no existen celdas de memoria reasignables (x = x + 1) ni bucles de\ncontrol imperativo (for, while). El flujo se gestiona mediante recursión pura y\nemparejamiento de patrones (pattern matching):"},{"s":"Guía Haskell p. 4","u":3,"t":"","x":"-- Recorrido recursivo con pattern matching sobre una lista\nsumarLista :: [Int] -> Int\nsumarLista []     = 0                   -- Caso base: lista vacía\nsumarLista (x:xs) = x + sumarLista xs   -- Caso recursivo: cabeza + llamada sobre cola\n\nPatrón con acumulador (recursión de cola / función auxiliar):\n-- Retorna el primer valor par y su posición (1-based)\nprimerParPos :: [Int] -> Maybe (Int, Int)\nprimerParPos lista = helper lista 1\n  where\n    helper [] _ = Nothing\n    helper (x:xs) pos\n        | even x    = Just (x, pos)\n        | otherwise = helper xs (pos + 1)\n\nPilar 3: Funciones como Ciudadanos de Primera Clase y Orden Superior\nLas funciones pueden asignarse a variables, pasarse como argumentos y\ndevolverse como resultados de cómputo.\n• Currificación: En Haskell toda función toma formalmente un solo argumento\na la vez y devuelve otra función hasta agotar los parámetros.\n• map: Aplica una función transformadora sobre cada elemento de una lista\nproduciendo una nueva lista.\n• filter: Selecciona únicamente los elementos que cumplen un predicado\nbooleano.\n• foldr / foldl (Reducción / reduce): Combina los elementos de una lista\nmediante una función binaria hasta reducirlos a un único valor."},{"s":"Guía Haskell p. 4","u":3,"t":"","x":"-- Aplicación de función de orden superior:\ncuadrados :: [Int]\ncuadrados = map (\\x -> x * x) [1, 2, 3, 4]  -- [1, 4, 9, 16]\n\npares :: [Int]\npares = filter even [1, 2, 3, 4, 5, 6]      -- [2, 4, 6]\n\nsumatoria :: Int\nsumatoria = foldr (+) 0 [1, 4, 9, 16]       -- 30\n\nPilar 4: Composición Funcional (.)\nPermite encadenar transformaciones de datos directamente, de modo que la salida\nde una función alimenta la entrada de la siguiente sin necesidad de almacenar\nvariables intermedias mutables:\n(𝑓∘𝑔)(𝑥) = 𝑓(𝑔(𝑥))"},{"s":"Guía Haskell p. 5","u":3,"t":"","x":"-- Elevar al cuadrado los números de una lista y sumarlos mediante composición\nsumaCuadrados :: [Int] -> Int\nsumaCuadrados = sum . map (\\x -> x * x)\n\n-- Uso: sumaCuadrados [2, 3, 4] -> 4 + 9 + 16 = 29\n\nPilar 5: Polimorfismo Paramétrico y Clases de Tipos (Typeclasses)\nHaskell proporciona polimorfismo paramétrico estricto mediante variables de tipo\n(a, b), permitiendo escribir funciones genéricas independientes de la representación\nde los datos:\n-- Extrae los primeros n elementos de cualquier lista (polimórfica en 'a')\ntomarN :: Int -> [a] -> [a]\ntomarN n _  | n \u003c= 0 = []\ntomarN _ []          = []\ntomarN n (x:xs)      = x : tomarN (n - 1) xs\n\nCuando una operación exige ciertas capacidades sobre el tipo (por ejemplo,\ncomparar igualdad o realizar operaciones aritméticas), Haskell utiliza Clases de\nTipos (Typeclasses) para lograr sobrecarga controlada:\n-- 'Eq a' restringe 'a' a tipos que implementan igualdad (==)\npertenece :: Eq a => a -> [a] -> Bool\npertenece _ []     = False\npertenece e (x:xs) = (e == x) || pertenece e xs"},{"s":"Guía Haskell p. 5","u":3,"t":"","x":"4. Encapsulación de Efectos: El Concepto de Mónada en Haskell\nHaskell formaliza el manejo de secuencias de cómputo y efectos laterales a través\ndel concepto de Mónada. Una mónada encapsula un valor en un contexto\ncomputacional sin vulnerar la transparencia referencial ni la pureza funcional:\n1. Constructor de tipo unario (m): Envuelve un dato de tipo a en un contexto\nmonádico m a (por ejemplo, IO a, Maybe a, [a]).\n2. return: Inyecta un valor ordinario en la mónada (return :: a -> m a).\n3. Operador de enlace (bind, >>=): Encadena dos cómputos monádicos,\nextrayendo el resultado del primero y pasándolo como entrada al segundo:\n>>=: : 𝑚 𝑎→(𝑎→𝑚 𝑏) →𝑚 𝑏\n\n-- Lectura y encadenamiento monádico explícito con (>>=):\nleerEImprimir :: IO ()\nleerEImprimir =\n    getChar >>= \\c1 ->\n    getChar >>= \\c2 ->\n    putChar c2 >>= \\_ ->\n    putChar c1"},{"s":"Guía Haskell p. 6","u":3,"t":"","x":"Notación do\nHaskell provee azúcar sintáctico para evitar el encadenamiento extenso de\noperadores >>=, permitiendo escribir código secuencial legible sin perder la pureza\nfuncional de fondo:\nconversacion :: IO ()\nconversacion = do\n    putStrLn \"Ingrese su nombre:\"\n    nombre \u003c- getLine\n    putStrLn (\"Bienvenido a Haskell, \" ++ nombre ++ \"!\")\n\n5. Tabla de Equivalencias: Imperativo vs. Common LISP vs.\nHaskell\nConcepto\nEnfoque\nImperativo (C /\nC++)\nCommon LISP\nHaskell\nFlujo de\nEjecución\nSentencias\nsecuenciales,\nbucles for, while\nExpresiones\nrecursivas /\nbucles híbridos\n(loop, dotimes)\nEvaluación de\nexpresiones\nrecursivas puras y\nevaluación diferida\n(lazy)\nVariables\nCeldas de\nmemoria\nmutables\nreasignables\n(x++)\nLigaduras\nléxicas (let),\nvariables\nespeciales\nmutables (setf)\nLigaduras\ninmutables puras\n(let, where)\nSistema de\nTipos\nEstático y\ncomprobado por\ncompilador\n(débil/medio en C)\nDinámico\n(verificación de\ntipos en tiempo\nde ejecución)\nEstático, fuerte e\ninferido (sistema\nHindley-Milner)\nColecciones\nArreglos\nindexados arr[i]\nCeldas cons\nenlazadas (car,\ncdr)\nListas algebraicas\nhomogéneas\n(head, tail, :) e\ninfinitas\nTransformación\nde Lotes\nBucles manuales\ncon acumuladores\nmutables\nmapcar y reduce\nnativos sobre\nlistas\nmap, filter, foldr y\ncomposición (.)\nManejo de\nEntrada/Salida\nSentencias\nimpuras directas\n(printf, cin)\nSalidas impuras\ndirectas (print,\nformat t)\nAislada y\nencapsulada"},{"s":"Guía Haskell p. 7","u":3,"t":"","x":"Concepto\nEnfoque\nImperativo (C /\nC++)\nCommon LISP\nHaskell\nestrictamente en la\nMónada IO"},{"s":"S4 diap. 2","u":4,"t":"El Paradigma Lógico: Programando con la Razón","x":"De la secuencia algorítmica a la deducción automatizada: fundamentos, metodologías y aplicaciones de la programación lógica."},{"s":"S4 diap. 3","u":4,"t":"El Cambio de Mentalidad Declarativa","x":"Caja central: En programación lógica, no describes cómo calcular la respuesta; cómo luce la respuesta.\n\n**Enfoque Imperativo** (lado izquierdo, icono de engranajes)\nSecuencia de pasos algorítmicos. El programador controla el flujo exacto de ejecución y la mutación del estado. Orientado al CÓMO.\n\n**Enfoque Declarativo** (lado derecho, icono de chip/red)\nDeclaración de verdades y relaciones. El motor de inferencia deduce la solución de forma autónoma. Orientado al QUÉ.\n\n[Figura: dos columnas enfrentadas, imperativo (CÓMO) frente a declarativo (QUÉ), con la frase central entre ambas]"},{"s":"S4 diap. 4","u":4,"t":"La Arquitectura del Razonamiento Automatizado","x":"[Figura: tres bloques unidos por «+» y «=»: Base de Conocimiento + Motor de Inferencia = Deducción]\n\n**Base de Conocimiento**\n\n- Hechos: Verdades atómicas asumidas inmutables.\n```prolog\ningeniero(juan).\n```\n- Reglas: Relaciones lógicas condicionales.\n```prolog\nlisto(X) :- ingeniero(X).\n```\n\n**Motor de Inferencia**\nMecanismo subyacente que aplica aplica lógica de primer orden (Modus Ponens) para deducir conclusiones mediante unificación.\n\n**Deducción**\n```prolog\n?- listo(juan).\n```\n↓\nTRUE"},{"s":"S4 diap. 5","u":4,"t":"Dominios de Ingeniería para la Deducción Formal","x":"[Figura: cuadrícula de 4 recuadros con iconos]\n\n- **Sistemas Expertos**: Diagnóstico y toma de decisiones basadas en reglas complejas, emulando el razonamiento de especialistas (ej. fallos eléctricos o medicina).\n- **Bases de Datos Deductivas**: Consultas analíticas complejas sobre relaciones implícitas masivas, utilizando lenguajes acotados como Datalog.\n- **Procesamiento de Lenguaje Natural**: Modelado de gramáticas formales y extracción de significado semántico estructurado.\n- **Verificación de Modelos**: Garantizar la corrección formal estricta y auditoría de sistemas de hardware o software crítico."},{"s":"S4 diap. 6","u":4,"t":"El Pipeline de la Ingeniería del Conocimiento","x":"[Figura: seis cajas en secuencia con flechas de izquierda a derecha; una flecha de retorno desde la 6 hasta la 1 rotulada «Iteración Declarativa»]\n\n1. Identificación: Definir síntomas y conceptos.\n2. Adquisición: Extraer reglas empíricas.\n3. Formalización: Traducir a modelos.\n4. Implementación: Codificar en Prolog.\n5. Verificación: Probar consistencia.\n6. Mantenimiento: Evolución continua.\n\nFlecha de retorno (de 6 a 1): Iteración Declarativa\n\nCaja inferior: **Metodologías Asistidas (ej. GUPU):** Entornos educativos que guían el desarrollo metódico interactivo basado en la depuración declarativa y pruebas unitarias."},{"s":"S4 diap. 7","u":4,"t":"De la Lógica de Primer Orden a las Cláusulas de Horn","x":"[Figura: dos paneles, «Lógica Formal» a la izquierda y «Sintaxis Prolog» a la derecha, con líneas que unen cada parte de la fórmula con su equivalente en Prolog (∧ con la coma, ¬ con \\+, → con :-)]\n\n**Lógica Formal**\n```\n∀ L: no_enciende(L) ∧\n ¬ enchufada(L)\n → causa(L, desenchufada)\n```\n\n**Sintaxis Prolog**\n```prolog\ncausa(L, desenchufada) :-\n    no_enciende(L),\n    \\+ enchufada(L).\n```\n(En la imagen la segunda línea del código aparece como «, no_enciende(L),» por el cruce con una línea del diagrama.)\n\nPie: La notación matemática rigurosa se traduce de forma uno-a-uno a código limpio, auditable y directamente ejecutable."},{"s":"S4 diap. 8","u":4,"t":"Taxonomía del Lenguaje Prolog","x":"[Figura: árbol con «Términos» arriba y cuatro ramas]\n\n- **Átomos**: Constantes simbólicas en minúscula. Ejemplo: `juan, rosa`\n- **Variables**: Incógnitas dinámicas (mayúscula o guion bajo). Ejemplo: `X, Persona, _`\n- **Estructuras**: Objetos complejos jerárquicos (Functores). Ejemplo: `punto(3,5)`\n- **Listas**: Colecciones ordenadas con deconstrucción. Ejemplo: `[Cabeza| Cola]`"},{"s":"S4 diap. 9","u":4,"t":"Nivel 1: Definiendo la Realidad con Átomos de Conocimiento","x":"[Figura: árbol familiar con flechas rotuladas padre/2: Carlos → Juan, Carlos → Elena, Juan → María, Juan → José, María → Alberto]\n\n```prolog\npadre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\n```\n\nCaja: **Asunción del Mundo Cerrado:** Para Prolog, cualquier relación que no pueda demostrarse explícitamente con estos hechos de la base de conocimiento se considera automáticamente falsa."},{"s":"S4 diap. 10","u":4,"t":"Anatomía de una Consulta: Constantes vs. Variables","x":"[Figura: dos paneles; el izquierdo con ilustración de dos piezas encajando y un check, el derecho con una antena parabólica emitiendo hacia una malla de puntos]\n\n**Tipo 1: Verificación (Booleana)**\n```prolog\n?- padre(juan, jose).\n```\nEl Motor de Inferencia busca un match exacto con un hecho existente. Retorna true o false.\n\n**Tipo 2: Búsqueda (Generación)**\n```prolog\n?- padre(juan, Hijo).\n```\nLas variables (en mayúscula) actúan como comodines. Prolog unifica 'Hijo' con cada match válido en la base.\n```\nHijo = maria ; Hijo = jose.\n```\n\nBanda inferior: **El poder del Backtracking:** El punto y coma (;) es el gatillo manual, obligando a Prolog a buscar la siguiente solución alternativa."},{"s":"S4 diap. 11","u":4,"t":"Anatomía de una Regla Condicional","x":"```prolog\nabuelo(X, Z) :- progenitor(X, Y), progenitor(Y, Z).\n```\n[Figura: la regla con cuatro llamadas señalando sus partes]\n\n- **Cabeza (Conclusión)** (señala `abuelo(X, Z)`): Lo que el sistema intentará demostrar.\n- **Cuerpo (Premisas)** (señala `progenitor(X, Y), progenitor(Y, Z).`): Condiciones necesarias. Separadas por coma (AND lógico).\n- **Cuello** (señala `:-`): Operador de implicación inversa; se lee como \"SI\".\n- **Variable Puente** (señala `Y`, que aparece en las dos premisas): Se unifica internamente para conectar la relación generacional."},{"s":"S4 diap. 12","u":4,"t":"Nivel 2: Construyendo Puentes de Deducción (Reglas)","x":"[Figura: tres nodos, X (carlos), Z (juan), Y (maria); flecha padre(X, Z) de X a Z, flecha padre(Z, Y) de Z a Y, y un arco grande abuelo(X, Y) de X a Y]\n\n```prolog\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y).\n```\n- Flecha que señala `:-`: Se lee como 'SI' (condición lógica)\n- Flecha que señala la coma: Se lee como 'Y' (conjunción)\n\nPie: **Deducción Dinámica:** Si ampliamos la base de datos de padres mañana, esta regla automáticamente inferirá los nuevos abuelos sin modificar el código."},{"s":"S4 diap. 13","u":4,"t":"El Motor en Acción: Unificación y Backtracking","x":"[Figura: árbol de búsqueda. Raíz `?- abuelo(ana, Z).` con dos ramas: «Y = beatriz», que termina en una X, «Fallo de premisa (Callejón sin salida)», con flecha discontinua de retorno al nodo raíz rotulada «Backtracking (Retroceso)»; y «Y = carlos», que lleva a «Z = elena» y a un check, «Éxito (Solución Encontrada)»]\n\nPie: El motor explora el árbol lógico de forma top-down. Si una ruta de inferencia falla, Prolog retrocede automáticamente al último punto de decisión válido y evalúa la siguiente alternativa."},{"s":"S4 diap. 14","u":4,"t":"Radiografía del Motor de Inferencia en Acción","x":"Consulta:\n```prolog\n?- abuelo(carlos, Nieto).\n```\n[Figura: árbol. Nodo `padre(carlos, Z)` con dos ramas: «Z = juan», que se bifurca en «Y = maria» (check, «Éxito: Nieto = maria») y «Y = jose» (check, «Éxito: Nieto = jose»); y «Z = elena», que acaba en una X con el texto «Fallo. No hay hechos. Retrocede.» y flecha discontinua de retroceso]\n\nRecuadro **Backtracking Automático**: Ocurre cuando una rama falla, obligando al motor a retroceder al último punto de decisión válido para explorar alternativas."},{"s":"S4 diap. 15","u":4,"t":"El Poder de la Recursividad Matemática","x":"**Definición Declarativa**\n```prolog\nfactorial(0, 1).\nfactorial(N, F) :-\n    N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    F is F1 * N.\n```\n\n**Pila de Inferencia (Consulta: 5!)**\n[Figura: dos columnas de cajas. Columna descendente, rotulada «Buscando el caso base»: N=5, N=4, N=3, N=2, N=1, N=0. Columna ascendente, rotulada «Resolviendo la multiplicación»: F=1 (junto a N=0), F=1, F=2, F=6, F=24, F=120 (de abajo arriba)]\n\nPie: Insight: En lógica formal, la aritmética requiere asignación forzada (operador 'is') para ejecutar el cálculo numérico, diferenciándose de la unificación estructural pura."},{"s":"S4 diap. 16","u":4,"t":"Nivel 3: Inmersión Recursiva (El Reemplazo de los Bucles)","x":"```prolog\nfactorial(0, 1).\nfactorial(N, F) :- N > 0,\n                   N1 is N - 1,\n                   factorial(N1, F1),\n                   F is F1 * N.\n```\n[Figura: escalera en forma de V. Bajada: «Llamada: 3», «N1=2», «Llamada: 2», «N1=1», «Llamada: 1», «N1=0», «Match con Caso Base: factorial(0, 1)». Subida: «Retorna 1 * 1 = 1», «Retorna 1 * 2 = 2», «Retorna 2 * 3 = 6», «Resultado: F = 6»]\n\nPie: En Prolog no existen los bucles. Todo ciclo es una inmersión recursiva hacia un caso base definitivo."},{"s":"S4 diap. 17","u":4,"t":"Alerta Arquitectónica: La Direccionalidad de la Aritmética","x":"[Figura: dos paneles. Izquierdo con flecha doble entre dos nodos (bidireccional); derecho con flecha de un nodo a otro pasando por un bloque rotulado «>, is» (unidireccional)]\n\n**Panel de Pureza — Relación Bidireccional (Pura)**\n```\n?- factorial(4, 24). -> true\n?- factorial(5, X). -> X = 120\n```\n\n**Panel de Ruptura — Función Direccional (Aritmética)**\n```\n?- factorial(N, F). -> ERROR\n```\n\nPie: **Insight:** La evaluación matemática en Prolog requiere variables instanciadas. Al usar operadores aritméticos, la pureza lógica bidireccional se rompe, forzando al predicado a actuar como una función tradicional de entrada-salida."},{"s":"Unidad 4 p. 1","u":4,"t":"","x":"Unidad 4: Programación Lógica\n1. Introducción y Objetivos\nLa programación lógica es un paradigma de programación basado en la lógica formal,\nespecialmente en la lógica matemática y de predicados .\nA diferencia de los enfoques imperativos u orientados a objetos, en la programación lógica los\nproblemas se formulan declarativamente mediante hechos y reglas que describen relaciones y\nconocimiento, en lugar de secuencias de pasos algorítmicos. Un programa lógico consiste\nesencialmente en una base de conocimiento (un conjunto de hechos que se suponen verdaderos) y\nun conjunto de reglas lógicas; a partir de ellos, un motor de inferencia puede deducir nuevas\nconclusiones aplicando las reglas de la lógica.\nEste paradigma es el punto donde confluyen la lógica y la informática, pues utiliza el razonamiento\nlógico automatizado para inferir conclusiones a partir de datos. Por ejemplo, en lógica de primer\norden podemos formalizar un razonamiento clásico: \"Todos los ingenieros son listos; Juan es\ningeniero; por lo tanto, Juan es listo\". En un programa lógico, este conocimiento se representaría\nmediante un hecho (ingeniero(juan).) y una regla general para cualquier persona\n(listo(X) :- ingeniero(X).), de modo que una consulta o pregunta al sistema (?-\nlisto(juan).) permitiría inferir la nueva información de que Juan es listo basándose en la\nregla. Gracias a esta capacidad de representación y deducción, el paradigma lógico resulta\nespecialmente útil en aplicaciones donde el razonamiento formal y la manipulación de relaciones"},{"s":"Unidad 4 p. 1","u":4,"t":"","x":"complejas son centrales.\nImportancia en la ingeniería: La programación lógica tiene importantes aplicaciones en múltiples\ncampos de la ingeniería y la informática que requieren gestionar conocimiento y reglas complejas\nde decisión. Algunas áreas destacadas incluyen:\n• Sistemas basados en conocimiento (Sistemas Expertos): en dominios como la medicina,\nla ingeniería o el derecho, se construyen sistemas que emulan el razonamiento de expertos\nhumanos mediante reglas lógicas, permitiendo diagnosticar fallos, recomendar soluciones o\ntomar decisiones fundamentadas en un conjunto complejo de conocimientos. Por ejemplo,\nun sistema experto en ingeniería eléctrica podría contener reglas para diagnosticar averías en\nun circuito a partir de síntomas observados.\n• Inteligencia Artificial y Lógica Difusa: muchos métodos de IA simbólica utilizan lógica\nformal; la ingeniería del conocimiento se apoya en representación de conocimiento\nmediante hechos y reglas. Asimismo, extensiones como la lógica difusa permiten razonar\ncon incertidumbre (utilizadas en control de sistemas, clasificación, etc.).\n• Procesamiento de Lenguaje Natural (PLN): la lógica se emplea para modelar gramáticas\nformales y extraer significado semántico. Por ejemplo, un analizador sintáctico puede usar\nreglas lógicas para identificar la estructura de una oración, o un sistema de chatbots puede\nbasarse en hechos y reglas para entender y generar respuestas.\n• Bases de Datos Deductivas: lenguajes lógicos como Datalog (que veremos más adelante)\npermiten realizar consultas complejas y deducciones sobre grandes conjuntos de datos, lo\ncual es útil en la gestión de bases de datos y sistemas de información. Un motor de base de"},{"s":"Unidad 4 p. 2","u":4,"t":"","x":"datos deductiva puede almacenar hechos (datos) y aplicar reglas lógicas para inferir datos\nderivados o responder consultas que implican relaciones implícitas.\n• Verificación y Comprobación de Modelos: en la ingeniería de software y hardware, la\nlógica se usa para especificar formalmente propiedades de sistemas (por ejemplo, usando\nlógica temporal) y verificar automáticamente que un diseño cumple ciertas condiciones.\nAunque esto va más allá de Prolog, comparte la idea de utilizar lógica para garantizar\ncorrección (común en verificación de protocolos, circuitos, etc.).\nLas ventajas del paradigma lógico, relevantes para la ingeniería, incluyen la claridad declarativa\n(se escribe qué se desea deducir, no cómo calcularlo), la facilidad de modificación (agregar un\nnuevo hecho o regla no altera las existentes, simplemente amplía el conocimiento), y la cercanía\ncon la lógica matemática que facilita la validación formal de los programas. Esto último, al igual\nque en el lenguaje funcional, es fundamental en contextos de ingeniería donde la corrección y\nconfiabilidad del software son primordiales.\nLos objetivos de esta unidad son:\n1. Comprender los fundamentos de la lógica en computación – Se explicarán los principios\nde la lógica tradicional (proposicional y de primer orden) y cómo estos sirven de base para\nrepresentar conocimiento y razonar de forma automatizada.\n2. Conocer metodologías de ingeniería del conocimiento – Se describirán metodologías\nempleadas para desarrollar sistemas basados en conocimiento, es decir, cómo pasar del"},{"s":"Unidad 4 p. 2","u":4,"t":"","x":"conocimiento de un experto o de un problema del mundo real a una representación lógica\nformal y a una implementación ejecutable. Se hará hincapié en cada paso del proceso,\nilustrándolo con ejemplos prácticos y código. Además, se mencionarán\nherramientas/metodologías clásicas como GUPU y su relevancia en la actualidad.\n3. Aprender el lenguaje Prolog – Se introducirá el lenguaje de programación lógica Prolog,\ncubriendo su sintaxis, elementos clave (términos, predicados, reglas, consultas), operadores\ny estructuras de datos (incluyendo listas). Se proporcionarán ejemplos prácticos de código\nProlog para resolver problemas sencillos, reforzando la comprensión de la semántica lógica.\n4. Explorar otros lenguajes lógicos – Brevemente se presentarán otros lenguajes dentro del\nparadigma lógico, como Answer Set Programming (ASP) y Datalog, resaltando en qué se\ndiferencian de Prolog y en qué tipos de aplicaciones se utilizan, para brindar una visión más\namplia del campo.\n5. Desarrollar habilidades de resolución de problemas en Prolog – A través de una serie de\nejercicios resueltos, de dificultad incremental, el estudiante podrá ver la aplicación práctica\nde Prolog en diversos tipos de problemas. Cada ejercicio vendrá acompañado de una\nexplicación detallada de la solución, para consolidar los conceptos aprendidos (desde\nconsultas básicas y definiciones de reglas, hasta recursión y búsqueda de soluciones)."},{"s":"Unidad 4 p. 3","u":4,"t":"","x":"2. Metodologías\nUna vez entendidos los fundamentos del paradigma lógico, es importante conocer cómo se aplica en\nla práctica, especialmente en el contexto de la ingeniería del conocimiento. En este capítulo\nabordaremos dos aspectos complementarios: primero, la lógica tradicional como base teórica para\nrepresentar conocimiento; segundo, las metodologías de desarrollo empleadas para construir\nsistemas basados en conocimiento (incluyendo la mención de la herramienta educativa GUPU). A lo\nlargo de la sección, detallaremos cada paso de una metodología típica con ejemplos prácticos y\ncódigo ilustrativo.\n2.1 Lógica tradicional\nLa lógica tradicional se refiere a los sistemas formales de lógica que han sido desarrollados por la\nmatemática y la filosofía, principalmente la lógica proposicional y la lógica de primer orden (o\nlógica de predicados). Estos sistemas proveen la base teórica sobre la cual se construye la\nprogramación lógica. A continuación, resumimos los elementos clave de la lógica tradicional\nrelevantes para la ingeniería del conocimiento:\n• Lógica proposicional: modelo lógico donde las fórmulas (enunciados lógicos) no tienen\nestructura interna analizable, sino que se consideran proposiciones atómicas unidas por\nconectores lógicos. Por ejemplo, proposiciones como P: \"El sensor está activado\" o Q: \"Se\nenciende la alarma\", y reglas como P → Q  (implicación: si P entonces Q). La lógica\nproposicional permite razonar sobre combinaciones de proposiciones (usando AND, OR,\nNOT, etc.) y derivar conclusiones lógicamente válidas. En ingeniería, puede servir para"},{"s":"Unidad 4 p. 3","u":4,"t":"","x":"modelar sistemas simples de condiciones (e.g., circuitos lógicos, donde P  Q activa un\n∧\nresultado).\n• Lógica de primer orden: extiende la lógica proposicional introduciendo la idea de\npredicados con argumentos y cuantificadores lógicos (universal\n y\n∀\nexistencial ). Esto\n∃\npermite expresar relaciones entre objetos y propiedades individuales. Por ejemplo, podemos\ntener un predicado ingeniero(X) que afirma \"X es ingeniero\", y otro listo(X) que\nafirma \"X es inteligente\". Una fórmula de primer orden\nX:ingeniero(X)→listo(X)\n∀\n expresa \"para todo X, si X es ingeniero entonces X es listo\". Combinado con un hecho\nsingular como ingeniero(juan) (Juan es ingeniero), un mecanismo de inferencia\npuede deducir listo(juan) (Juan es listo) mediante la aplicación de la regla general.\nEste tipo de razonamiento, conocido como modus ponens, es fundamental en sistemas\nexpertos: de una regla general y un hecho específico se obtiene una conclusión específica.\nLos sistemas de programación lógica (como Prolog) se basan en la lógica de primer orden, pero\nsuelen restringirse a una forma particular llamada forma clausal. En particular, usan cláusulas de\nHorn, que son fórmulas lógicas de la forma A←B1 B2\nBn, donde A y cada B_i son literales\n∧\n∧⋯∧\natómicos (predicados posiblemente con variables). Esta notación corresponde directamente a la\nrepresentación de reglas en Prolog: el literal A es la cabeza de la regla (lo que se quiere deducir) y\nB_1, ..., B_n conforman el cuerpo (las condiciones necesarias) Las cláusulas de Horn son lo"},{"s":"Unidad 4 p. 4","u":4,"t":"","x":"suficientemente expresivas para representar una gran variedad de conocimiento (implicaciones\nlógicas simples), a la vez que permiten algoritmos de inferencia eficientes (basados en resolución\nunificada y búsqueda).\nEn la lógica tradicional, la inferencia se puede llevar a cabo mediante métodos de prueba como el\ncitado método de resolución (propuesto por J. A. Robinson en 1965) que sistematiza el proceso de\ndeducción automática. Sin entrar en detalles formales, vale mencionar que Prolog implementa un\nalgoritmo de inferencia similar a resolución sobre cláusulas de Horn: dado un objetivo (consulta),\nintenta unificarlo con la cabeza de alguna regla o hecho, y recursivamente satisface las condiciones\ndel cuerpo de la regla, retrocediendo si alguna ruta de inferencia falla. Este mecanismo de\nunificación y backtracking (retroceso) es lo que permite a un programa lógico explorar las posibles\nconclusiones que se derivan de su base de conocimiento.\nConclusión de esta sección: La lógica tradicional proporciona el lenguaje y las herramientas\nformales para expresar conocimiento de forma declarativa. Para que dicho conocimiento resulte útil\nen ingeniería, debemos complementarlo con metodologías prácticas que nos guíen en cómo\nadquirir, representar e implementar el conocimiento de un dominio específico usando estas formas\nlógicas. A continuación, veremos cómo se estructura el proceso de construcción de un sistema\nbasado en conocimiento, desde la captación del conocimiento experto hasta su codificación en un"},{"s":"Unidad 4 p. 4","u":4,"t":"","x":"lenguaje lógico.\n2.2 Metodologías en la Ingeniería del Conocimiento\nLa Ingeniería del Conocimiento es el área de la informática que se ocupa de la construcción de\nsistemas basados en conocimiento (SBC), también conocidos como sistemas expertos cuando\nemulan a especialistas humanos. Una metodología de ingeniería del conocimiento define un\nconjunto de fases o pasos sistemáticos para transferir y formalizar el conocimiento desde las\nfuentes (generalmente, expertos humanos o datos) hacia un sistema software. El objetivo es crear\nuna base de conocimiento bien estructurada y efectiva que permita a un programa resolver\nproblemas en un dominio específico utilizando reglas lógicas.\nAunque existen varias metodologías propuestas (por ejemplo, CommonKADS fue una metodología\neuropea estándar para desarrollo de SBC en los 90s), la mayoría comparten etapas similares.\nA continuación presentamos un proceso típico, dividido en pasos, para desarrollar una solución\nbasada en el paradigma lógico.\nCada paso se ilustrará con un ejemplo práctico sencillo y fragmentos de código Prolog, para\nconcretar cómo se podría llevar a cabo en la práctica. El ejemplo que usaremos es el desarrollo de\nun mini sistema experto de diagnóstico para una lámpara que no funciona (un problema cotidiano\ny simple, pero suficiente para ejemplificar las etapas):\nPaso 1: Identificación del problema y del conocimiento relevante – En esta fase se define\nclaramente cuál es el problema a resolver y qué tipo de conocimiento se necesita. Por ejemplo,"},{"s":"Unidad 4 p. 4","u":4,"t":"","x":"enunciado del problema: \"La lámpara no enciende\". Como ingenieros, debemos identificar las\nposibles causas de esta falla. Aquí la fuente de conocimiento podría ser un electricista o nuestro\npropio razonamiento técnico. Determinamos, por sentido común técnico, que las causas típicas de\nque una lámpara no funcione pueden ser: (a) que no esté enchufada, (b) que la bombilla (foco) esté"},{"s":"Unidad 4 p. 5","u":4,"t":"","x":"fundida, o (c) que haya una falla eléctrica más seria en el circuito. Este paso produce una lista de\nconceptos y relaciones relevantes: lámpara, enchufada o no, bombilla fundida o no, corriente\neléctrica, etc., así como la formulación precisa del objetivo: diagnosticar por qué la lámpara no\nenciende.\nPaso 2: Adquisición y recopilación del conocimiento – Implica extraer el conocimiento de las\nfuentes (expertos, documentación, experiencia) y organizarlo. Continuando con el ejemplo,\nrecopilamos las reglas empíricas de diagnóstico:\n• Regla C1: \"Si la lámpara no enciende y no está enchufada, entonces la causa es que está\ndesenchufada\".\n• Regla C2: \"Si la lámpara no enciende, está enchufada y la bombilla está fundida, entonces\nla causa es la bombilla fundida\".\n• Regla C3: \"Si la lámpara no enciende, está enchufada y no está fundida la bombilla,\nentonces la causa es alguna falla eléctrica (cableado, circuito)\".\nObsérvese que estamos obteniendo conocimiento en forma de reglas si-entonces (que luego\npodremos traducir a la forma lógica). Además de reglas, identificamos los hechos o datos que\nnecesitaremos: por ejemplo, saber si la lámpara está enchufada o no, y si la bombilla está en buen\nestado o no, serán datos de entrada para el sistema. En sistemas más complejos, esta fase podría\nimplicar entrevistas con expertos, revisión de manuales, o análisis de datos históricos para extraer\npatrones. El resultado de la fase 2 es un conjunto inicial de hechos y reglas en lenguaje natural o\nsemiformal, que cubren el conocimiento del dominio."},{"s":"Unidad 4 p. 5","u":4,"t":"","x":"Paso 3: Formalización (modelado conceptual y representación lógica) – Este paso consiste en\nllevar el conocimiento recopilado a una representación formal, no ambigua, apta para ser procesada\npor un programa. En nuestro caso, traducimos las reglas C1–C3 a reglas lógicas (predicados\nlógicos), definiendo los predicados necesarios. Primero, definimos cómo representaremos los\nhechos: por ejemplo, usaremos enchufada(Lamp) para indicar que una lámpara Lamp está\nenchufada a la corriente, y fundida(Lamp) para indicar que la bombilla de Lamp está quemada.\nTambién necesitaremos representar el síntoma \"no enciende\", que podemos llamar\nno_enciende(Lamp). Finalmente, definiremos un predicado para la causa diagnosticada, por\nejemplo causa(Lamp, Causa) donde Causa podría ser algo como \"desenchufada\",\n\"bombilla\" o \"electrica\". Con estos predicados, las reglas se formalizan así:\n• C1 en lógica:\nL:  no_enciende(L) ¬enchufada(L)→causa(L,\"desenchufada\").\n∀\n∧\n• C2 en lógica:\nL:  no_enciende(L) enchufada(L) fundida(L)→causa(L,\"bombilla\").\n∀\n∧\n∧\n• C3 en lógica:\nL:  no_enciende(L) enchufada(L) ¬fundida(L)→causa(L,\"electrica\").\n∀\n∧\n∧\nHemos usado aquí notación matemática con cuantificadores universales implícitos (\"para todo\nLámpara si... entonces...\"). En la práctica, estas fórmulas lógicas se implementarán como reglas de\nHorn en Prolog. Nótese también que aparece la negación (por ejemplo ¬ enchufada(L)); en un\nprograma lógico como Prolog utilizaremos la negación como falla (\\+ enchufada(L)) para\nrepresentar la falta de evidencia de que L está enchufada.\nPaso 4: Implementación en un lenguaje lógico (codificación) – Llegados a este punto, se traduce\nel modelo formal a código ejecutable en el lenguaje escogido (usualmente Prolog para sistemas\nbasados en lógica tradicional). Siguiendo el ejemplo, escribiremos un pequeño programa Prolog con"},{"s":"Unidad 4 p. 6","u":4,"t":"","x":"las reglas de diagnóstico y probaremos su funcionamiento. A continuación se muestra cómo\nquedarían nuestras reglas C1–C3 en Prolog, junto con algunos hechos de prueba:\n% Hechos de ejemplo (situaciones conocidas):\nno_enciende(lamp1).\nenchufada(lamp1).      % lamp1 está enchufada\nfundida(lamp1).        % lamp1 tiene la bombilla fundida\nno_enciende(lamp2).\nenchufada(lamp2).      % lamp2 enchufada\n% (No declaramos fundida(lamp2), implicando que la bombilla NO\nestá fundida)\nno_enciende(lamp3).\n% (No declaramos enchufada(lamp3), implicando que NO está\nenchufada)\n% Reglas de diagnóstico:\ncausa(L, \"desenchufada\") :- no_enciende(L), \\+ enchufada(L).\ncausa(L, \"bombilla fundida\") :- no_enciende(L), enchufada(L),\nfundida(L).\ncausa(L, \"falla electrica\") :- no_enciende(L), enchufada(L), \\+\nfundida(L).\nEn este código, hemos incluido algunos hechos de ejemplo para tres lámparas (lamp1, lamp2,\nlamp3) que representan diferentes situaciones iniciales, y luego las reglas que implementan la\nlógica de diagnóstico explicada. Veamos en lenguaje natural qué expresa cada regla Prolog:\n• La primera regla dice: \"Para cualquier lámpara L, L tiene como causa 'desenchufada' si no\nenciende y no se puede demostrar que está enchufada\". (En Prolog, \\+ enchufada(L)\nsignifica que la premisa enchufada(L) falla, es decir, no hay hecho que indique que L\nestá enchufada). Esta regla corresponde a la situación de que la lámpara esté desenchufada.\n• La segunda regla: \"L tiene como causa 'bombilla fundida' si no enciende, está enchufada y"},{"s":"Unidad 4 p. 6","u":4,"t":"","x":"además su bombilla está fundida\". Esto cubre la causa de la bombilla quemada.\n• La tercera regla: \"L tiene como causa 'falla electrica' si no enciende, está enchufada y no se\npuede demostrar que esté fundida\". Esta última condición significa que la bombilla no está\nfundida (en nuestro programa, ausencia de hecho fundida(L) equivale a suponer que no\nestá fundida). Entonces, estando enchufada y con bombilla buena, cualquier otro problema\ndebe ser eléctrico (cableado, circuito).\nAhora nuestro programa lógico puede inferir la causa de la falla para distintos casos. Por ejemplo,\nsi consultamos en Prolog: ?- causa(lamp1, C). (¿cuál es la causa para lamp1?), el sistema\nintentará satisfacer el objetivo usando las reglas. En lamp1 sabemos que\nno_enciende(lamp1), enchufada(lamp1) y fundida(lamp1) son verdaderos. Al\nevaluar las reglas:\n• Regla1: no_enciende(lamp1) es verdad, pero \\+ enchufada(lamp1) es falso\n(porque enchufada(lamp1) es cierto), así que Regla1 no aplica."},{"s":"Unidad 4 p. 7","u":4,"t":"","x":"• Regla2: no_enciende(lamp1) true, enchufada(lamp1) true, fundida(lamp1)\ntrue, por tanto se satisface la cabeza causa(lamp1, \"bombilla fundida\"). El\nsistema encontraría esta solución.\n• Regla3 no se necesitaría evaluar una vez encontrada la regla2, pero conceptualmente:\nno_enciende(lamp1) true, enchufada(lamp1) true, \\+ fundida(lamp1)\nfallaría porque fundida(lamp1) es cierto; por tanto Regla3 no aplica para lamp1.\nEl resultado de la consulta sería: C = \"bombilla fundida\". En efecto, el programa\ndiagnostica que para lamp1 la causa es la bombilla fundida, acorde con los hechos que ingresamos.\nProbando las otras situaciones de ejemplo: para lamp2 (no enciende, enchufada, bombilla no\nfundida) la regla3 sería la que se cumple, produciendo C = \"falla electrica\". Para lamp3\n(no enciende, no enchufada) aplicaría la regla1 y obtendríamos C = \"desenchufada\". Así\nhemos implementado con éxito un pequeño sistema de diagnóstico usando programación lógica.\nPaso 5: Verificación y validación – Una vez codificado el conocimiento, se debe comprobar que el\nsistema funciona correctamente, es completo y consistente. En sistemas expertos reales, esta fase es\ncrucial: involucra probar muchos casos (ejemplos conocidos, casos de esquina) y verificar que las\nconclusiones del programa concuerdan con las que daría un experto humano. También implica\nrevisar que no haya contradicciones en la base de conocimiento. En nuestro ejemplo, ya hicimos\npruebas con lámparas lamp1, lamp2, lamp3. Si quisiéramos validar más, podríamos agregar un caso"},{"s":"Unidad 4 p. 7","u":4,"t":"","x":"donde todo está correcto para comprobar que el sistema tal vez no infiere ninguna causa (por\nejemplo, una lamp4 que enciende correctamente no tendría no_enciende(lamp4) en la base de\nconocimiento, por lo que ninguna regla deduciría causa, lo cual es deseado). Para un sistema más\ncomplejo, podríamos implicar al experto (el electricista) para confirmar que las reglas\nimplementadas cubren todos los escenarios posibles y que las deducciones son válidas.\nPaso 6: Mantenimiento y evolución – El conocimiento en muchos dominios no es estático: pueden\naparecer nuevos casos, reglas o excepciones. La metodología contempla la actualización continua\nde la base de conocimiento. Por ejemplo, si en nuestro sistema de la lámpara descubriéramos otra\ncausa posible (digamos, \"el interruptor está dañado\" como nueva causa), podríamos extender la\nbase de conocimiento agregando una nueva regla (y hechos asociados, como un predicado\ninterruptor_malo(L) si fuera comprobable). Una ventaja de la programación lógica es que\nsu naturaleza declarativa facilita este mantenimiento: agregar una regla nueva no rompe la lógica de\nlas existentes, simplemente agrega una vía adicional de deducción. Sin embargo, habrá que\nrevalidar el sistema tras cambios importantes.\nEn resumen, la metodología de ingeniería del conocimiento guía el proceso desde el conocimiento\ninformal hasta un sistema lógico operativo, asegurando rigor en cada paso: primero comprender y\nestructurar el problema, luego formalizarlo y codificarlo, y finalmente probarlo y refinarlo. Para"},{"s":"Unidad 4 p. 7","u":4,"t":"","x":"problemas de mayor escala, existen metodologías más formales (como la mencionada\nCommonKADS) que descomponen el conocimiento en modelos (de tarea, de dominio, de\ninferencia, etc.) antes de llegar al código, pero la esencia es similar a este proceso simple que\ndescribimos.\nAntes de cerrar esta sección, vale la pena mencionar GUPU, tal como se ha indicado. GUPU es un\nentorno educativo desarrollado a inicios de los 2000 para apoyar la enseñanza de la programación\nlógica (Prolog) de forma metódica. Se trata de un sistema interactivo que guía al estudiante por"},{"s":"Unidad 4 p. 8","u":4,"t":"","x":"todas las fases del desarrollo declarativo, desde la especificación del problema hasta la\nimplementación y depuración del programa, proporcionando retroalimentación automática. GUPU\nofrece características innovadoras como ejecuciones de referencia con diagnósticos, feedback\ninmediato de pruebas unitarias, herramientas de visualización de la ejecución y técnicas de slicing\npara localizar errores, todo ello integrado en un entorno unificado. En cierto modo, GUPU actúa\ncomo un tutor experto: verifica continuamente el progreso del alumno, marcando qué partes del\nproblema ya fueron resueltas correctamente y cuáles requieren atención.\nAunque GUPU fue concebido para contextos académicos (para cursos de Prolog en la Universidad\nde Viena, por ejemplo), sus conceptos siguen siendo relevantes. Representa una metodología\nasistida por herramienta: enfatiza la importancia de una buena especificación (definir claramente\nla relación lógica que el programa debe capturar), promueve la implementación incremental (ir\nconstruyendo el programa mientras se comprueban casos de prueba) y facilita la depuración\ndeclarativa (encontrar errores basándose en las intenciones lógicas del programa más que en\nrastrear instrucciones). Si bien hoy en día GUPU no es ampliamente usado en la industria, la\nfilosofía detrás de él —guiar el desarrollo de programas lógicos de manera estructurada y con\nretroalimentación— es valiosa en la ingeniería del conocimiento. En la práctica profesional, no es\nraro que se adopten metodologías análogas (por ejemplo, escribir primero casos de prueba que"},{"s":"Unidad 4 p. 8","u":4,"t":"","x":"sirvan como especificación de comportamiento, algo parecido a Test-Driven Development adaptado\na lógica, o usar depuradores de Prolog que ayudan a rastrear la unificación y el backtracking).\nLas metodologías en la ingeniería del conocimiento proporcionan un mapa de ruta para construir\nsistemas basados en el paradigma lógico, asegurando que usamos la lógica tradicional de forma\neficaz para modelar problemas reales. Herramientas como GUPU ejemplifican cómo apoyar\ndidácticamente este proceso. En el siguiente capítulo nos enfocaremos en el lenguaje por excelencia\nde este paradigma, Prolog, profundizando en sus elementos y sintaxis, lo que nos permitirá\nmaterializar cualquier conjunto de hechos y reglas como un programa ejecutable."},{"s":"Unidad 4 p. 9","u":4,"t":"","x":"3. El lenguaje Prolog\nProlog (cuyo nombre proviene de Programmation en Logique, francés para \"programación en\nlógica\") es el lenguaje de programación lógica más conocido y utilizado. Fue desarrollado a\ncomienzos de la década de 1970 por Alain Colmerauer, Robert Kowalski y otros, y desde entonces\nha sido aplicado extensamente en inteligencia artificial, sistemas expertos, procesamiento de\nlenguajes naturales y otras áreas. Prolog es un lenguaje declarativo: un programa Prolog se\ncompone de declaraciones de hechos y reglas lógicas (cláusulas) que describen relaciones, y las\nrespuestas se obtienen mediante un proceso de inferencia automática, no por ejecución de\nsecuencias de comandos imperativos.\nFormalmente, Prolog está basado en la lógica de primer orden, restringida a cláusulas de Horn.\nCada sentencia en Prolog es una cláusula que puede ser de dos tipos: un hecho (cláusula sin cuerpo,\nsimplemente una afirmación incondicional) o una regla (que tiene un cuerpo con condiciones).\nAdemás, las consultas que hacemos al programa corresponden a objetivos lógicos a demostrar a\npartir de los hechos y reglas. A continuación, se detallan los elementos principales del lenguaje\nProlog: sus tipos de términos, sintaxis de predicados, uso de operadores y estructuras de datos,\nacompañados de ejemplos prácticos.\n3.1 Términos básicos y sintaxis\nEn Prolog, todo dato es un término. Los términos pueden ser de diferentes tipos:\n• Átomos: son constantes simbólicas, que representan objetos individuales o valores"},{"s":"Unidad 4 p. 9","u":4,"t":"","x":"constantes. En la sintaxis de Prolog, un átomo se escribe típicamente comenzando con letra\nminúscula (o bien entre comillas simples si contiene caracteres especiales o empieza con\nmayúscula). Ejemplos de átomos: juan, rosa, foo, 'BuenosDias' (átomo con\nmayúsculas y espacio, por eso entre comillas). Los átomos suelen denotar nombres de\nhechos o valores fijos, como nombres de personas, etiquetas, etc.\n• Números: Prolog soporta números (enteros, reales de doble precisión) como un tipo especial\nde átomo numérico. Se escriben de la forma habitual: 0, 42, 3.14, etc. Por ejemplo, 7 es\nun término numérico.\n• Variables: representan terminos desconocidos o por determinar. Por convención sintáctica,\nen Prolog las variables se escriben comenzando con letra mayúscula o con guión bajo _.\nEjemplos: X, Persona, _temp. Una variable en una regla Prolog es universalmente\ncuantificada (significa \"para todo valor que la haga verdadera...\"). Durante la resolución de\nuna consulta, las variables se intentan unificar con átomos u otros términos para encontrar\nsoluciones. Cabe destacar que el guión bajo solo (_) se usa para denotar una variable\nanónima, cuando su valor no nos interesa; cada ocurrencia de _ se trata como una variable\ndistinta independiente.\n• Estructuras compuestas (functores): Son términos construidos mediante un functor\n(átomo) y una secuencia de uno o más términos como argumentos. Tienen la forma\nfunctor(arg1, arg2, ..., argN). Las estructuras permiten crear objetos\ncomplejos jerárquicos. Por ejemplo, padre(juan, maria) es una estructura compuesta\nque podríamos interpretar como \"Juan es padre de María\". Aquí padre es el functor (y"},{"s":"Unidad 4 p. 10","u":4,"t":"","x":"típicamente se considera un predicado lógico) y juan, maria son sus dos argumentos.\nOtro ejemplo: una estructura para representar un punto en el plano podría ser punto(3,5)\n(coordenadas x=3, y=5).
