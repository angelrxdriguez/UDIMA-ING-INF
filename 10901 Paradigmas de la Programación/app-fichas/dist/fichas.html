typeclasses): sobrecarga controlada; Eq a => exige igualdad (==)","src":"Guía Haskell p. 5","imp":1,"serie":"Pilares en Haskell","n":6,"total":6,"code":"tomarN :: Int -> [a] -> [a]\npertenece :: Eq a => a -> [a] -> Bool"},{"id":"ud3-049","ud":3,"tema":"Mónadas y equivalencias","q":"¿Qué es una mónada en Haskell?","a":"Encapsula un valor en un **contexto computacional** (secuencias de cómputo, efectos) **sin romper** la transparencia referencial ni la pureza.","src":"Guía Haskell p. 5","imp":1},{"id":"ud3-050","ud":3,"tema":"Mónadas y equivalencias","q":"¿Qué tres elementos forman una mónada?","a":"• **Constructor de tipo m**: envuelve a en m a (IO a, Maybe a, [a])\n• **return**: mete un valor en la mónada\n• **bind (>>=)**: encadena dos cómputos","src":"Guía Haskell p. 5","imp":1,"code":"return :: a -> m a\n(>>=)  :: m a -> (a -> m b) -> m b"},{"id":"ud3-051","ud":3,"tema":"Mónadas y equivalencias","q":"¿Qué es la notación do en Haskell?","a":"**Azúcar sintáctico** para no encadenar muchos >>=: permite escribir código secuencial legible sin perder la pureza funcional de fondo.","src":"Guía Haskell p. 6","imp":2,"code":"conversacion :: IO ()\nconversacion = do\n  putStrLn \"Ingrese su nombre:\"\n  nombre \u003c- getLine\n  putStrLn (\"Bienvenido a Haskell, \" ++ nombre ++ \"!\")"},{"id":"ud3-052","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo es el flujo de ejecución en cada enfoque?","a":"• Imperativo: sentencias secuenciales, bucles for/while\n• Common LISP: expresiones recursivas / bucles híbridos (loop, dotimes)\n• Haskell: expresiones recursivas puras y evaluación diferida","src":"Guía Haskell p. 6","imp":2,"serie":"Imperativo, LISP y Haskell","n":1,"total":5},{"id":"ud3-053","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo son las variables en cada enfoque?","a":"• Imperativo: celdas de memoria mutables reasignables (x++)\n• Common LISP: ligaduras léxicas (let) y variables especiales mutables (setf)\n• Haskell: ligaduras inmutables puras (**let, where**)","src":"Guía Haskell p. 6","imp":2,"serie":"Imperativo, LISP y Haskell","n":2,"total":5},{"id":"ud3-054","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo es el sistema de tipos en cada enfoque?","a":"• Imperativo: estático, comprobado por el compilador (débil/medio en C)\n• Common LISP: dinámico (en tiempo de ejecución)\n• Haskell: estático, fuerte e inferido (**Hindley-Milner**)","src":"Guía Haskell p. 6","imp":1,"serie":"Imperativo, LISP y Haskell","n":3,"total":5},{"id":"ud3-055","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo son las colecciones en cada enfoque?","a":"• Imperativo: arreglos indexados arr[i]\n• Common LISP: celdas cons enlazadas (car, cdr)\n• Haskell: listas algebraicas **homogéneas** (head, tail, :) e **infinitas**","src":"Guía Haskell p. 6","imp":2,"serie":"Imperativo, LISP y Haskell","n":4,"total":5},{"id":"ud3-056","ud":3,"tema":"Mónadas y equivalencias","q":"Tabla de equivalencias: ¿cómo se maneja la entrada/salida en cada enfoque?","a":"• Imperativo: sentencias impuras directas (printf, cin)\n• Common LISP: salidas impuras directas (print, format t)\n• Haskell: aislada y encapsulada en la **mónada IO**","src":"Guía Haskell p. 6–7","imp":2,"serie":"Imperativo, LISP y Haskell","n":5,"total":5},{"id":"ud4-001","ud":4,"tema":"Paradigma lógico","q":"¿En qué se basa la programación lógica?","a":"En la **lógica formal** (matemática y de predicados): el problema se describe con **hechos y reglas**, no con secuencias de pasos.","src":"Unidad 4 p. 1","imp":1},{"id":"ud4-002","ud":4,"tema":"Paradigma lógico","q":"Imperativo vs declarativo: ¿en qué se diferencian?","a":"• Imperativo: secuencia de pasos; el programador controla el flujo y el estado → el **CÓMO**\n• Declarativo: verdades y relaciones; el motor de inferencia deduce → el **QUÉ**","src":"S4 diap. 3","imp":1},{"id":"ud4-003","ud":4,"tema":"Paradigma lógico","q":"¿De qué se compone un sistema de programación lógica?","a":"**Base de conocimiento** (hechos + reglas) + **motor de inferencia**, que aplica modus ponens y unificación para deducir conclusiones.","src":"S4 diap. 4; Unidad 4 p. 1","imp":1},{"id":"ud4-004","ud":4,"tema":"Paradigma lógico","q":"¿En qué cuatro dominios de ingeniería destaca la programación lógica?","a":"• Sistemas expertos (diagnóstico, decisiones)\n• Bases de datos deductivas (Datalog)\n• Procesamiento de lenguaje natural\n• Verificación de modelos","src":"S4 diap. 5; Unidad 4 p. 1","imp":2},{"id":"ud4-005","ud":4,"tema":"Paradigma lógico","q":"¿Qué ventajas tiene el paradigma lógico en ingeniería?","a":"• **Claridad declarativa**: qué deducir, no cómo\n• Fácil modificación: añadir hechos o reglas no altera los existentes\n• Cercanía a la lógica matemática → validación formal","src":"Unidad 4 p. 2","imp":2},{"id":"ud4-006","ud":4,"tema":"Lógica tradicional","q":"¿Qué dos sistemas forman la lógica tradicional?","a":"La **lógica proposicional** y la **lógica de primer orden** (o de predicados). Son la base teórica de la programación lógica.","src":"Unidad 4 p. 3","imp":2},{"id":"ud4-007","ud":4,"tema":"Lógica tradicional","q":"¿Cómo es la lógica proposicional?","a":"Proposiciones atómicas **sin estructura interna**, unidas por conectores (AND, OR, NOT, →). Ej.: P → Q.","src":"Unidad 4 p. 3","imp":2},{"id":"ud4-008","ud":4,"tema":"Lógica tradicional","q":"¿Qué añade la lógica de primer orden a la proposicional?","a":"**Predicados con argumentos** y **cuantificadores**: universal (∀) y existencial (∃). Ej.: ∀X: ingeniero(X) → listo(X).","src":"Unidad 4 p. 3","imp":2},{"id":"ud4-009","ud":4,"tema":"Lógica tradicional","q":"¿Qué es el modus ponens?","a":"De una **regla general** y un **hecho** concreto se deduce una conclusión concreta: ingeniero(X) → listo(X) + ingeniero(juan) ⇒ listo(juan).","src":"Unidad 4 p. 3; S4 diap. 4","imp":1},{"id":"ud4-010","ud":4,"tema":"Lógica tradicional","q":"¿Qué es una cláusula de Horn?","a":"Una fórmula **A ← B1 ∧ … ∧ Bn**: A es la cabeza (lo que se deduce) y B1…Bn el cuerpo (las condiciones). Prolog se restringe a ellas.","src":"Unidad 4 p. 3–4; S4 diap. 7","imp":1},{"id":"ud4-011","ud":4,"tema":"Lógica tradicional","q":"¿Quién propuso el método de resolución y cuándo?","a":"**J. A. Robinson**, en **1965**. Sistematiza la deducción automática.","src":"Unidad 4 p. 4","imp":2},{"id":"ud4-012","ud":4,"tema":"Lógica tradicional","q":"¿Cómo infiere Prolog sobre cláusulas de Horn?","a":"Con un método similar a la resolución: **unifica** el objetivo con la cabeza de un hecho o regla, resuelve el cuerpo y retrocede si falla.","src":"Unidad 4 p. 4","imp":2},{"id":"ud4-013","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Qué es la ingeniería del conocimiento?","a":"Área de la informática que construye **sistemas basados en conocimiento** (SBC); si emulan a especialistas humanos se llaman **sistemas expertos**.","src":"Unidad 4 p. 4","imp":2},{"id":"ud4-014","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Qué fue CommonKADS?","a":"Una metodología **europea estándar** para desarrollar SBC en los años 90; descompone el conocimiento en modelos (de tarea, de dominio, de inferencia…).","src":"Unidad 4 p. 4, 7","imp":2},{"id":"ud4-015","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Cuáles son los 6 pasos de la ingeniería del conocimiento?","a":"1 Identificación · 2 Adquisición · 3 Formalización\n4 Implementación · 5 Verificación · 6 Mantenimiento\nY vuelta al inicio: **iteración declarativa**.","src":"S4 diap. 6; Unidad 4 p. 4–7","imp":1,"serie":"Pasos de la ingeniería del conocimiento","n":1,"total":7},{"id":"ud4-016","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 1 (identificación): ¿qué se hace?","a":"Definir el problema y el conocimiento necesario: **síntomas y conceptos**. Ej.: «la lámpara no enciende» y sus causas posibles.","src":"S4 diap. 6; Unidad 4 p. 4","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":2,"total":7},{"id":"ud4-017","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 2 (adquisición): ¿qué se hace?","a":"Extraer el conocimiento de las fuentes (expertos, manuales, datos) como **reglas empíricas** si-entonces, y fijar los hechos necesarios.","src":"S4 diap. 6; Unidad 4 p. 5","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":3,"total":7},{"id":"ud4-018","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 3 (formalización): ¿qué se hace?","a":"Traducir el conocimiento a una representación **formal y no ambigua**: predicados y fórmulas lógicas (modelos).","src":"S4 diap. 6; Unidad 4 p. 5","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":4,"total":7},{"id":"ud4-019","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 4 (implementación): ¿qué se hace?","a":"Codificar el modelo formal en un lenguaje lógico ejecutable, normalmente **Prolog**, y probarlo con hechos de ejemplo.","src":"S4 diap. 6; Unidad 4 p. 5–6","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":5,"total":7},{"id":"ud4-020","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 5 (verificación): ¿qué se hace?","a":"Probar muchos casos y comprobar que el sistema es **completo y consistente** (sin contradicciones) y razona como el experto.","src":"S4 diap. 6; Unidad 4 p. 7","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":6,"total":7},{"id":"ud4-021","ud":4,"tema":"Ingeniería del conocimiento","q":"Ingeniería del conocimiento, paso 6 (mantenimiento): ¿qué se hace?","a":"**Evolución continua**: añadir nuevas reglas o casos. Una regla nueva no rompe las existentes, pero hay que revalidar.","src":"S4 diap. 6; Unidad 4 p. 7","imp":2,"serie":"Pasos de la ingeniería del conocimiento","n":7,"total":7},{"id":"ud4-022","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Cómo se traduce a Prolog ∀L: no_enciende(L) ∧ ¬enchufada(L) → causa(L, desenchufada)?","a":"Uno a uno: la conclusión pasa a la **cabeza**, ∧ se escribe con coma y ¬ con \\+ (**negación como fallo**).","src":"S4 diap. 7; Unidad 4 p. 5","imp":1,"code":"causa(L, desenchufada) :-\n    no_enciende(L),\n    \\+ enchufada(L)."},{"id":"ud4-023","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Qué es GUPU?","a":"Entorno **educativo** de inicios de los 2000 para enseñar Prolog: guía todas las fases con feedback automático, **pruebas unitarias** y depuración declarativa.","src":"S4 diap. 6; Unidad 4 p. 7–8","imp":1},{"id":"ud4-024","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué significa «Prolog» y quién lo creó?","a":"**Programmation en Logique** (francés). Lo desarrollaron **Alain Colmerauer**, Robert Kowalski y otros a comienzos de los **años 70**.","src":"Unidad 4 p. 9","imp":1},{"id":"ud4-025","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué tipos de cláusula tiene Prolog y qué es una consulta?","a":"• **Hecho**: cláusula sin cuerpo (afirmación incondicional)\n• **Regla**: cabeza + cuerpo con condiciones\n• **Consulta**: objetivo que hay que demostrar\nToda cláusula termina en punto.","src":"Unidad 4 p. 9, 11","imp":1},{"id":"ud4-026","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué tipos de términos hay en Prolog?","a":"• Átomos (los números son átomos numéricos)\n• Variables\n• Estructuras (functores)\n• Listas","src":"S4 diap. 8; Unidad 4 p. 9–10","imp":1,"serie":"Términos de Prolog","n":1,"total":5},{"id":"ud4-027","ud":4,"tema":"Prolog: términos y sintaxis","q":"Términos de Prolog: ¿qué es un átomo y cómo se escribe?","a":"Una constante simbólica; empieza por **minúscula** (o va entre comillas simples). Ej.: juan, rosa, 'BuenosDias'.","src":"S4 diap. 8; Unidad 4 p. 9","imp":1,"serie":"Términos de Prolog","n":2,"total":5},{"id":"ud4-028","ud":4,"tema":"Prolog: términos y sintaxis","q":"Términos de Prolog: ¿qué es una variable y cómo se escribe?","a":"Una incógnita por determinar; empieza por **mayúscula** o **guion bajo**. Ej.: X, Persona, _temp. En una regla vale «para todo».","src":"S4 diap. 8; Unidad 4 p. 9","imp":1,"serie":"Términos de Prolog","n":3,"total":5},{"id":"ud4-029","ud":4,"tema":"Prolog: términos y sintaxis","q":"Términos de Prolog: ¿qué es una estructura?","a":"Un objeto compuesto: un **functor** con argumentos, functor(arg1, …, argN). Se pueden anidar. Ej.: punto(3,5).","src":"S4 diap. 8; Unidad 4 p. 9","imp":2,"serie":"Términos de Prolog","n":4,"total":5},{"id":"ud4-030","ud":4,"tema":"Prolog: términos y sintaxis","q":"Términos de Prolog: ¿cómo es una lista?","a":"Colección ordenada entre corchetes, [1,2,3]; vacía: []. Se descompone con **[Cabeza|Cola]**: [X|Y] con [a,b,c] da X = a, Y = [b,c].","src":"S4 diap. 8; Unidad 4 p. 10","imp":2,"serie":"Términos de Prolog","n":5,"total":5},{"id":"ud4-031","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué es la variable anónima _?","a":"Una variable cuyo valor **no interesa**. Cada _ es una variable distinta e independiente.","src":"Unidad 4 p. 9","imp":2},{"id":"ud4-032","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué es un predicado y qué indica el /2 de progenitor/2?","a":"Un nombre de relación o propiedad, definido por una o varias cláusulas. /2 es su **aridad**: el número de argumentos.","src":"Unidad 4 p. 10","imp":2},{"id":"ud4-033","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué partes tiene una regla de Prolog?","a":"• **Cabeza**: la conclusión que se intenta demostrar\n• **Cuello** (:-): implicación inversa, se lee «si»\n• **Cuerpo**: premisas separadas por comas (AND)\n• Variable puente (Y): conecta las premisas","src":"S4 diap. 11; Unidad 4 p. 10","imp":1,"code":"abuelo(X, Z) :-\n    progenitor(X, Y), progenitor(Y, Z)."},{"id":"ud4-034","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Cómo se expresa la disyunción (OR) en Prolog?","a":"Con **punto y coma** (;) en el cuerpo o en una consulta. Suele ser más claro escribir varias cláusulas con la misma cabeza.","src":"Unidad 4 p. 11","imp":2},{"id":"ud4-035","ud":4,"tema":"Prolog: operadores","q":"¿Qué hace el operador = en Prolog?","a":"**Unificación**: intenta igualar dos términos, ligando variables si hace falta. Si no son compatibles, falla.","src":"Unidad 4 p. 11","imp":1,"code":"?- punto(X, Y) = punto(3, 4).\nX = 3, Y = 4."},{"id":"ud4-036","ud":4,"tema":"Prolog: operadores","q":"¿Qué es la negación como fallo (\\+)?","a":"\\+ Meta tiene éxito si Meta **falla**, y falla si Meta tiene éxito. Es negación por falta de prueba (negación débil).","src":"Unidad 4 p. 11","imp":1},{"id":"ud4-037","ud":4,"tema":"Prolog: operadores","q":"¿Qué hace el corte (!)?","a":"Fija las decisiones tomadas hasta ese punto e **impide el backtracking** más allá. Poda la búsqueda; mal usado, se pierden soluciones.","src":"Unidad 4 p. 11","imp":2},{"id":"ud4-038","ud":4,"tema":"Prolog: operadores","q":"¿Para qué sirve is en Prolog?","a":"Para **evaluar** una expresión aritmética y unir el resultado: X is 2 + 3 da X = 5. Es la «asignación forzada» del cálculo.","src":"Unidad 4 p. 11; S4 diap. 15","imp":1},{"id":"ud4-039","ud":4,"tema":"Prolog: operadores","q":"¿Qué resultado da X = 2 + 3?","a":"No calcula: unifica X con la **estructura** 2+3 (el + actúa como functor). Para obtener 5 hace falta is.","src":"Unidad 4 p. 11; S4 diap. 15","imp":2},{"id":"ud4-040","ud":4,"tema":"Prolog: operadores","q":"¿Qué comparadores aritméticos tiene Prolog?","a":"=:= (igual), =\\= (distinto), \u003c, **=\u003c**, >, >=. Evalúan las expresiones de ambos lados antes de comparar.","src":"Unidad 4 p. 11","imp":2},{"id":"ud4-041","ud":4,"tema":"Prolog: operadores","q":"¿Qué hace X \\= Y en una regla?","a":"Comprueba que X e Y **no unifican** (desigualdad). En hermano/2 evita que alguien sea hermano de sí mismo.","src":"Unidad 4 p. 12","imp":2,"code":"hermano(X, Y) :- progenitor(Z, X),\n    progenitor(Z, Y), X \\= Y."},{"id":"ud4-042","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Qué es el backtracking?","a":"Retroceso automático: si una rama falla, Prolog vuelve al **último punto de decisión** válido y prueba la siguiente alternativa.","src":"S4 diap. 13–14; Unidad 4 p. 12","imp":1,"code":"?- abuelo(ana, Z).\n% Y = beatriz: falla, retrocede\n% Y = carlos: Z = elena"},{"id":"ud4-043","ud":4,"tema":"Prolog: consultas y recursión","q":"¿En qué orden explora Prolog las soluciones?","a":"**Top-down**: desde la consulta hacia los hechos, en el orden de las cláusulas y en profundidad, retrocediendo cuando falla.","src":"S4 diap. 13; Unidad 4 p. 13, 26","imp":2},{"id":"ud4-044","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Qué dos tipos de consulta hay en Prolog?","a":"• **Verificación** (booleana): sin variables → true o false\n• **Búsqueda** (generación): con variables → Prolog da sus valores","src":"S4 diap. 10; Unidad 4 p. 17","imp":1,"code":"?- padre(juan, jose).\n?- padre(juan, Hijo)."},{"id":"ud4-045","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Para qué sirve pulsar ; tras una respuesta de Prolog?","a":"Obliga a buscar la **siguiente solución** (backtracking); ENTER termina. En un programa, findall/3 o bagof/3 recogen todas.","src":"S4 diap. 10; Unidad 4 p. 13","imp":2},{"id":"ud4-046","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Cómo se repite un cálculo en Prolog si no hay bucles?","a":"Con **recursión**: todo ciclo es una inmersión recursiva hasta un **caso base**.","src":"S4 diap. 16","imp":1},{"id":"ud4-047","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Cómo se define el factorial en Prolog?","a":"• Caso base (hecho): factorial(0, 1)\n• Regla: si N > 0, calcula N1 = N − 1, su factorial F1 y F = F1 · N","src":"S4 diap. 15; ejm3.pl; Unidad 4 p. 13–14","imp":1,"code":"factorial(0, 1).\nfactorial(N, F) :- N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    F is F1 * N."},{"id":"ud4-048","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Cómo se define miembro/2 (pertenencia a una lista)?","a":"• X es miembro si es la **cabeza** de la lista\n• Si no, lo es si está en la **cola** (recursión)\nSirve para comprobar y para generar elementos.","src":"Unidad 4 p. 14, 21–23","imp":2,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T)."},{"id":"ud4-049","ud":4,"tema":"ASP y Datalog","q":"¿Qué es ASP (Answer Set Programming)?","a":"Programación por **conjuntos de respuestas**: enfoque lógico para problemas de búsqueda **combinatorios** (a menudo NP-difíciles): planificación, configuración, puzzles.","src":"Unidad 4 p. 15","imp":1},{"id":"ud4-050","ud":4,"tema":"ASP y Datalog","q":"¿Cómo obtiene ASP las soluciones?","a":"Por la semántica de **modelos estables**: un solver (clingo, DLV) calcula los conjuntos de hechos que satisfacen las reglas; cada uno es una solución.","src":"Unidad 4 p. 15","imp":2},{"id":"ud4-051","ud":4,"tema":"ASP y Datalog","q":"¿Qué es el conocimiento no monótono, que ASP puede expresar?","a":"Lo que se concluye por la ausencia de un hecho **cambia** si luego se añade ese hecho. ASP lo logra con negación fuerte y por ausencia.","src":"Unidad 4 p. 15","imp":2},{"id":"ud4-052","ud":4,"tema":"ASP y Datalog","q":"¿Qué es Datalog?","a":"Un lenguaje lógico para **consultas y bases de datos deductivas**; puede verse como un **subconjunto de Prolog** con restricciones.","src":"Unidad 4 p. 15","imp":1},{"id":"ud4-053","ud":4,"tema":"ASP y Datalog","q":"¿Qué términos admite Datalog?","a":"Solo **constantes o variables**: sin funciones ni estructuras anidadas. Así el dominio es finito y acotado por los hechos.","src":"Unidad 4 p. 15","imp":2},{"id":"ud4-054","ud":4,"tema":"ASP y Datalog","q":"¿Cómo infieren Prolog y Datalog?","a":"• Prolog: **top-down**, desde la consulta y con backtracking\n• Datalog: **bottom-up**, deduce todos los hechos posibles y luego responde","src":"Unidad 4 p. 15–16","imp":1},{"id":"ud4-055","ud":4,"tema":"ASP y Datalog","q":"¿Para qué se usa Datalog?","a":"Para consultas **recursivas** que el SQL estándar no expresaba bien (alcanzabilidad en grafos, jerarquías) y para análisis estático de programas.","src":"Unidad 4 p. 16","imp":2},{"id":"ud4-056","ud":4,"tema":"ASP y Datalog","q":"¿Qué diferencia a Datalog de Prolog en cuanto a terminación?","a":"Datalog **siempre termina** (es decidible: los términos no crecen). Prolog es **Turing-completo** y puede no terminar.","src":"Unidad 4 p. 16","imp":2},{"id":"ud4-057","ud":4,"tema":"ASP y Datalog","q":"Prolog, ASP y Datalog: ¿a qué se orienta cada uno?","a":"• Prolog: deducción por unificación y backtracking\n• ASP: generar soluciones a problemas combinatorios\n• Datalog: consultas optimizadas sobre grandes bases de hechos","src":"Unidad 4 p. 16","imp":1},{"id":"ud4-058","ud":4,"tema":"Ejercicios resueltos","q":"¿Qué es la asunción del mundo cerrado?","a":"Lo que **no puede demostrarse** con los hechos y reglas de la base se considera **falso**.","src":"S4 diap. 9; Unidad 4 p. 17","imp":1},{"id":"ud4-059","ud":4,"tema":"Ejercicios resueltos","q":"EJM0: ¿qué responde ?- listo(juan).?","a":"**true**: la regla unifica X = juan y ingeniero(juan) es un hecho (modus ponens).","src":"Preguntas_1 (EJM0); S4 diap. 4","imp":1,"code":"ingeniero(juan).\nlisto(X) :- ingeniero(X)."},{"id":"ud4-060","ud":4,"tema":"Ejercicios resueltos","q":"EJM0: ¿qué responde ?- \\+ listo(jose).?","a":"**true**: listo(jose) no se puede demostrar (no hay ingeniero(jose)), así que \\+ tiene éxito. Es el mundo cerrado.","src":"Preguntas_1 (EJM0)","imp":1,"code":"ingeniero(juan).\nlisto(X) :- ingeniero(X)."},{"id":"ud4-061","ud":4,"tema":"Ejercicios resueltos","q":"EJM1: ¿qué responden padre(juan, jose), padre(juan, alberto) y padre(maria, jose)?","a":"• padre(juan, jose) → **true**\n• padre(juan, alberto) → false (Juan es su abuelo)\n• padre(maria, jose) → false (no está en la base)","src":"Preguntas_1 (EJM1); Unidad 4 p. 17","imp":2,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena)."},{"id":"ud4-062","ud":4,"tema":"Ejercicios resueltos","q":"EJM1: ¿qué responden ?- padre(juan, Hijo). y ?- padre(Padre, juan).?","a":"• padre(juan, Hijo) → Hijo = maria ; Hijo = jose\n• padre(Padre, juan) → Padre = carlos","src":"Preguntas_1 (EJM1); S4 diap. 10","imp":1,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena)."},{"id":"ud4-063","ud":4,"tema":"Ejercicios resueltos","q":"EJM2: ¿cómo se define abuelo/2 a partir de padre/2?","a":"X es abuelo de Y si X es padre de algún Z y Z es padre de Y. Si se añaden padres, deduce los nuevos abuelos **sin tocar la regla**.","src":"S4 diap. 12; ejm2.pl","imp":1,"code":"abuelo(X, Y) :- padre(X, Z), padre(Z, Y)."},{"id":"ud4-064","ud":4,"tema":"Ejercicios resueltos","q":"EJM2: ¿qué responde ?- abuelo(carlos, Z).?","a":"Z = maria ; Z = jose (vía Juan). La rama de Elena falla porque no tiene hijos, y Prolog retrocede.","src":"Preguntas_1 (EJM2); S4 diap. 14","imp":1,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y)."},{"id":"ud4-065","ud":4,"tema":"Ejercicios resueltos","q":"EJM2: ¿qué responde ?- abuelo(Z, alberto).?","a":"Z = juan: Juan es padre de María y María es madre de Alberto.","src":"Preguntas_1 (EJM2)","imp":2,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y)."},{"id":"ud4-066","ud":4,"tema":"Ejercicios resueltos","q":"EJM2: ¿qué responde ?- abuelo(Abuelo, Nieto).?","a":"• Abuelo = juan, Nieto = alberto\n• Abuelo = carlos, Nieto = maria\n• Abuelo = carlos, Nieto = jose","src":"Preguntas_1 (EJM2); Unidad 4 p. 18–19","imp":2,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y)."},{"id":"ud4-067","ud":4,"tema":"Ejercicios resueltos","q":"EJM3: ¿qué responde ?- factorial(3, F). y cómo lo calcula?","a":"F = 6. Baja 3 → 2 → 1 → 0 hasta el caso base factorial(0, 1) y vuelve multiplicando: 1·1 = 1, 1·2 = 2, 2·3 = 6.","src":"Preguntas_1 (EJM3); S4 diap. 16","imp":2,"code":"factorial(0, 1).\nfactorial(N, F) :- N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    F is F1 * N."},{"id":"ud4-068","ud":4,"tema":"Ejercicios resueltos","q":"EJM3: ¿qué responden ?- factorial(5, X). y ?- factorial(4, 24).?","a":"• factorial(5, X) → X = 120\n• factorial(4, 24) → true (comprueba que 4! = 24)","src":"Preguntas_1 (EJM3); S4 diap. 17","imp":2,"code":"factorial(0, 1).\nfactorial(N, F) :- N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    F is F1 * N."},{"id":"ud4-069","ud":4,"tema":"Ejercicios resueltos","q":"EJM3: ¿qué pasa con ?- factorial(N, F). y por qué?","a":"Primero da N = 0, F = 1; al pedir más, **ERROR**: N > 0 e is necesitan N con valor. El predicado es **direccional** (N → F).","src":"Preguntas_1 (EJM3); S4 diap. 17; Unidad 4 p. 21","imp":1,"code":"factorial(0, 1).\nfactorial(N, F) :- N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    F is F1 * N."},{"id":"ud4-070","ud":4,"tema":"Ejercicios resueltos","q":"Ejercicio 5: ¿cómo se define alcanzable/2 en un grafo?","a":"• Base: hay conexión directa de X a Y\n• Recursiva: X conecta con Z e Y es alcanzable desde Z\nCon ciclos puede no terminar: llevar una lista de visitados.","src":"Unidad 4 p. 23–26","imp":2,"code":"alcanzable(X, Y) :- conexion(X, Y).\nalcanzable(X, Y) :-\n    conexion(X, Z), alcanzable(Z, Y)."},{"id":"ud4-071","ud":4,"tema":"Conclusión","q":"¿Qué virtudes tiene Prolog en problemas expresables con reglas?","a":"Desarrollo rápido y **transparencia**: reglas legibles, fáciles de mantener y que explican cómo se llegó a la conclusión.","src":"Unidad 4 p. 27","imp":2},{"id":"ud4-072","ud":4,"tema":"Conclusión","q":"¿Cuándo no conviene la programación lógica pura?","a":"Con cálculos **secuenciales**, mucha manipulación de **estados cambiantes** o volúmenes de datos enormes. Se combina con módulos imperativos (C, Python).","src":"Unidad 4 p. 28","imp":2},{"id":"ud4-073","ud":4,"tema":"Conclusión","q":"¿Qué extensiones del paradigma lógico se citan?","a":"• Programación lógica con restricciones (**CLP**)\n• Programación lógica inductiva\n• Programación lógica probabilística","src":"Unidad 4 p. 27","imp":2},{"id":"ud4-074","ud":4,"tema":"Conclusión","q":"¿Dónde tiene hoy aplicación o futuro la programación lógica?","a":"• IA explicable (traza de inferencia)\n• IA **neuro-simbólica** (redes neuronales + lógica)\n• Web semántica: ontologías, OWL\n• Planificación: STRIPS, PDDL","src":"Unidad 4 p. 28","imp":2},{"id":"ud5-001","ud":5,"tema":"Listas: cabeza/cola","q":"¿Qué es el patrón cabeza/cola de una lista en Prolog?","a":"El separador **|** parte la lista: [Cabeza|Cola]. La cabeza es el primer elemento; la cola, la lista con el resto.","src":"S5 diap. 4","imp":1,"code":"?- [H|T] = [a, b, c].\nH = a, T = [b, c]."},{"id":"ud5-002","ud":5,"tema":"Listas: cabeza/cola","q":"¿Qué significa la variable anónima _ (guion bajo)?","a":"Es un **comodín**: «no me importa este dato, ignóralo y sigue evaluando».","src":"S5 diap. 4","imp":1},{"id":"ud5-003","ud":5,"tema":"Listas: cabeza/cola","q":"¿Cómo se define miembro/2 en las diapositivas?","a":"• Caso base: X es la **cabeza** de la lista\n• Caso recursivo: si no, se busca X en la **cola**","src":"S5 diap. 3-4","imp":1,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T)."},{"id":"ud5-004","ud":5,"tema":"Listas: cabeza/cola","q":"¿Qué dos comportamientos tiene el mismo predicado miembro/2?","a":"• **Verificación** (input instanciado)\n• **Generación** (input variable)","src":"S5 diap. 3","imp":1,"serie":"miembro/2: dos usos","n":1,"total":3},{"id":"ud5-005","ud":5,"tema":"Listas: cabeza/cola","q":"miembro/2 en modo verificación: ¿qué hace?","a":"Con el elemento dado, comprueba si la afirmación es correcta **recorriendo la estructura**: responde true o false.","src":"S5 diap. 3, 5","imp":2,"serie":"miembro/2: dos usos","n":2,"total":3,"code":"?- miembro(b, [a, b, c]).\ntrue."},{"id":"ud5-006","ud":5,"tema":"Listas: cabeza/cola","q":"miembro/2 en modo generación: ¿qué hace?","a":"Con una **variable**, el **backtracking** extrae e itera todos los elementos posibles automáticamente.","src":"S5 diap. 3, 5","imp":2,"serie":"miembro/2: dos usos","n":3,"total":3,"code":"?- miembro(X, [a, b, c]).\nX = a ; X = b ; X = c."},{"id":"ud5-007","ud":5,"tema":"Listas: cabeza/cola","q":"¿Por qué ?- miembro(x, [a, b, c]) devuelve false?","a":"Compara x con cada cabeza (a, b, c) y recurre con la cola. Al llegar a **[]** no unifica con ninguna regla: falla y retorna **false**.","src":"S5 diap. 5","imp":2},{"id":"ud5-008","ud":5,"tema":"Grafos y recursión","q":"En el ejemplo de grafos, ¿qué representan los hechos conexion/2?","a":"Caminos directos de **un solo salto**. El reto: que Prolog deduzca rutas multidestino (Madrid → Zaragoza) que no están explícitas en sus datos.","src":"S5 diap. 6-7","imp":2,"code":"conexion(madrid, valencia).\nconexion(valencia, barcelona)."},{"id":"ud5-009","ud":5,"tema":"Grafos y recursión","q":"alcanzable/2: ¿qué dice la primera regla?","a":"«**Llegué directamente**»: Y es alcanzable desde X si existe conexion(X, Y).","src":"S5 diap. 6, 8","imp":1,"serie":"alcanzable/2","n":1,"total":2,"code":"alcanzable(X, Y) :- conexion(X, Y)."},{"id":"ud5-010","ud":5,"tema":"Grafos y recursión","q":"alcanzable/2: ¿qué dice la segunda regla (la recursiva)?","a":"«Salté a un **nodo intermedio Z**, y desde Z sé cómo llegar a Y».","src":"S5 diap. 6, 8","imp":1,"serie":"alcanzable/2","n":2,"total":2,"code":"alcanzable(X, Y) :-\n    conexion(X, Z),\n    alcanzable(Z, Y)."},{"id":"ud5-011","ud":5,"tema":"Grafos y recursión","q":"¿Qué algoritmo crean automáticamente las dos reglas de alcanzable/2?","a":"Una búsqueda exhaustiva **en profundidad (DFS)**: el «algoritmo definitivo» de **recursión + backtracking**.","src":"S5 diap. 6, 8","imp":2},{"id":"ud5-012","ud":5,"tema":"Grafos y recursión","q":"¿Qué peligro tiene alcanzable/2 si el grafo es circular?","a":"**Ciclos**: Prolog quedaría atrapado en un bucle infinito recursivo. En producción se usan acumuladores de **nodos visitados**.","src":"S5 diap. 6, 8","imp":1},{"id":"ud5-013","ud":5,"tema":"Grafos y recursión","q":"¿Cómo deduce Prolog alcanzable(madrid, zaragoza)?","a":"Madrid → Valencia → Barcelona → Zaragoza (3 saltos): regla 2, regla 2 y cierra con la regla 1. Si una rama no lleva, retrocede (backtracking).","src":"S5 diap. 8","imp":2},{"id":"ud5-014","ud":5,"tema":"Pilares y familia lógica","q":"¿Cuáles son los tres pilares ocultos del paradigma lógico?","a":"• Unificación\n• Recursión\n• Backtracking","src":"S5 diap. 9","imp":1,"serie":"Los tres pilares","n":1,"total":4},{"id":"ud5-015","ud":5,"tema":"Pilares y familia lógica","q":"Pilar «unificación»: ¿qué hace?","a":"Asigna valores a variables **dinámicamente** si los moldes **encajan perfectamente**.","src":"S5 diap. 9","imp":1,"serie":"Los tres pilares","n":2,"total":4},{"id":"ud5-016","ud":5,"tema":"Pilares y familia lógica","q":"Pilar «recursión»: ¿qué aporta?","a":"Es el mecanismo de **descenso profundo** para evadir la necesidad de bucles estáticos.","src":"S5 diap. 9","imp":2,"serie":"Los tres pilares","n":3,"total":4},{"id":"ud5-017","ud":5,"tema":"Pilares y familia lógica","q":"Pilar «backtracking»: ¿qué es?","a":"La **brújula interna** que busca alternativas exhaustivas cuando choca contra una pared.","src":"S5 diap. 9","imp":2,"serie":"Los tres pilares","n":4,"total":4},{"id":"ud5-018","ud":5,"tema":"Pilares y familia lógica","q":"¿Qué se consigue al combinar unificación, recursión y backtracking?","a":"Programas de **5 líneas** que resuelven laberintos enteros. «El programador describe la realidad; Prolog encuentra la verdad».","src":"S5 diap. 9","imp":2},{"id":"ud5-019","ud":5,"tema":"Pilares y familia lógica","q":"¿Qué lenguajes forman la familia lógica según las diapositivas?","a":"• Prolog\n• ASP (Answer Set)\n• Datalog","src":"S5 diap. 10","imp":1,"serie":"Familia lógica","n":1,"total":4},{"id":"ud5-020","ud":5,"tema":"Pilares y familia lógica","q":"Familia lógica: ¿cómo es Prolog?","a":"• Ejecución: **Top-Down** (backtracking)\n• Turing completo (estructuras infinitas)\n• Uso: sistemas expertos e IA simbólica","src":"S5 diap. 10","imp":2,"serie":"Familia lógica","n":2,"total":4},{"id":"ud5-021","ud":5,"tema":"Pilares y familia lógica","q":"Familia lógica: ¿cómo es ASP (Answer Set)?","a":"• Ejecución: generación de modelos (**SAT**)\n• Restricciones combinatorias (negación fuerte)\n• Uso: optimización NP-difícil y puzzles lógicos","src":"S5 diap. 10","imp":2,"serie":"Familia lógica","n":3,"total":4},{"id":"ud5-022","ud":5,"tema":"Pilares y familia lógica","q":"Familia lógica: ¿cómo es Datalog?","a":"• Ejecución: **Bottom-Up** (exhaustivo)\n• Finito (sin funciones anidadas)\n• Uso: consultas recursivas en bases de datos gigantes","src":"S5 diap. 10","imp":2,"serie":"Familia lógica","n":4,"total":4},{"id":"ud5-023","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué tres ventajas («acelera») tiene aplicar lógica pura?","a":"• Transparencia extrema\n• Mantenimiento ortogonal\n• Modelado natural","src":"S5 diap. 11","imp":1,"serie":"Ventajas de la lógica pura","n":1,"total":4},{"id":"ud5-024","ud":5,"tema":"Ventajas, límites y futuro","q":"Ventaja «transparencia extrema»: ¿en qué consiste?","a":"**Trazabilidad exacta** de por qué se tomó cada decisión.","src":"S5 diap. 11","imp":2,"serie":"Ventajas de la lógica pura","n":2,"total":4},{"id":"ud5-025","ud":5,"tema":"Ventajas, límites y futuro","q":"Ventaja «mantenimiento ortogonal»: ¿en qué consiste?","a":"Añadir nuevas reglas **no rompe el flujo** existente.","src":"S5 diap. 11","imp":2,"serie":"Ventajas de la lógica pura","n":3,"total":4},{"id":"ud5-026","ud":5,"tema":"Ventajas, límites y futuro","q":"Ventaja «modelado natural»: ¿en qué consiste?","a":"Representación directa de **ontologías** y relaciones matemáticas.","src":"S5 diap. 11","imp":2,"serie":"Ventajas de la lógica pura","n":4,"total":4},{"id":"ud5-027","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué tres limitaciones («frena») tiene aplicar lógica pura?","a":"• Ineficiencia numérica\n• Mutación de estado\n• Curva de abstracción","src":"S5 diap. 11","imp":1,"serie":"Limitaciones de la lógica pura","n":1,"total":4},{"id":"ud5-028","ud":5,"tema":"Ventajas, límites y futuro","q":"Limitación «ineficiencia numérica»: ¿en qué consiste?","a":"Es **lento** en cálculos matemáticos puramente secuenciales.","src":"S5 diap. 11","imp":2,"serie":"Limitaciones de la lógica pura","n":2,"total":4},{"id":"ud5-029","ud":5,"tema":"Ventajas, límites y futuro","q":"Limitación «mutación de estado»: ¿en qué consiste?","a":"Mala manipulación de **variables que cambian** constantemente.","src":"S5 diap. 11","imp":2,"serie":"Limitaciones de la lógica pura","n":3,"total":4},{"id":"ud5-030","ud":5,"tema":"Ventajas, límites y futuro","q":"Limitación «curva de abstracción»: ¿en qué consiste?","a":"Exige abandonar el **control explícito** del flujo de control.","src":"S5 diap. 11","imp":2,"serie":"Limitaciones de la lógica pura","n":4,"total":4},{"id":"ud5-031","ud":5,"tema":"Ventajas, límites y futuro","q":"En la arquitectura moderna, ¿qué papel tiene el motor lógico?","a":"Es el «**cerebro estratégico**»: orquesta submódulos imperativos (ej. Python, C) encargados de la ejecución eficiente.","src":"S5 diap. 11","imp":2},{"id":"ud5-032","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué es la IA neuro-simbólica?","a":"La convergencia de **redes neuronales** y **sistemas lógicos**: sistemas autónomos que no solo predicen, sino que **razonan y explican**.","src":"S5 diap. 12","imp":1},{"id":"ud5-033","ud":5,"tema":"Ventajas, límites y futuro","q":"Redes neuronales vs. sistemas lógicos: ¿qué aporta cada uno?","a":"• Redes: reconocimiento de patrones, datos crudos, «**caja negra**»\n• Lógicos: razonamiento estructurado, reglas de negocio, decisiones **auditables y explicables**","src":"S5 diap. 12","imp":2},{"id":"ud5-034","ud":5,"tema":"Ej. 3: OR implícito","q":"Ejercicio 3 (buceadores): ¿qué se pide?","a":"Reglas de riesgo descompresivo **sin el OR (;)**:\n• 1: Temp \u003c 12 y Tiempo ≥ 20\n• 2: Temp \u003c 12 y Prof > 30\n• 3: Prof > 30 y Tiempo ≥ 40","src":"S5 diap. 14","imp":2,"code":"% buceador(Nombre, Temp, Prof, Tiempo)\nbuceador(luis, 11, 34, 15)."},{"id":"ud5-035","ud":5,"tema":"Ej. 3: OR implícito","q":"¿Cómo se programa un OR sin usar «;» en Prolog?","a":"Con **reglas homónimas**: una regla con el mismo nombre por cada condición. Prolog las evalúa como alternativas independientes: el OR es **implícito**.","src":"S5 diap. 15","imp":1,"code":"% condición 1\nen_riesgo_ED(Nombre) :-\n  buceador(Nombre, T, _, Tiempo),\n  T \u003c 12, Tiempo >= 20."},{"id":"ud5-036","ud":5,"tema":"Ej. 3: OR implícito","q":"En el cuerpo de una regla, ¿qué significa la coma?","a":"**AND** lógico (conjunción): deben cumplirse todas las condiciones, p. ej. T \u003c 12, Tiempo >= 20.","src":"S5 diap. 15, 21","imp":2},{"id":"ud5-037","ud":5,"tema":"Ej. 3: OR implícito","q":"Ejercicio 3: ¿qué buceadores devuelve la consulta en_riesgo_ED(X)?","a":"Por orden de reglas: carlos (cond. 1), luis (cond. 2), mario (cond. 3). **ana** no cumple ninguna, así que no aparece.","src":"S5 diap. 14-15 (calculado)","imp":2,"code":"?- en_riesgo_ED(X).\nX = carlos ;\nX = luis ;\nX = mario ;\nfalse."},{"id":"ud5-038","ud":5,"tema":"Ej. 4: conc/3","q":"conc/3: ¿qué dice el caso base?","a":"Unir una **lista vacía** con cualquier lista L deja la lista **intacta**.","src":"S5 diap. 16","imp":2,"serie":"conc/3","n":1,"total":2,"code":"conc([], L, L)."},{"id":"ud5-039","ud":5,"tema":"Ej. 4: conc/3","q":"conc/3: ¿qué hace el paso recursivo (desacople estructural)?","a":"La cabeza **H** se extrae de la 1.ª lista y se obliga a **encabezar el resultado**; la recursión se encarga de la cola T.","src":"S5 diap. 16","imp":2,"serie":"conc/3","n":2,"total":2,"code":"conc([H|T], L2, [H|R]) :-\n    conc(T, L2, R)."},{"id":"ud5-040","ud":5,"tema":"Ej. 4: conc/3","q":"¿Por qué conc/3 es tan poderoso?","a":"Porque es una **declaración lógica pura**, carente de dirección de flujo: el mismo predicado **une** listas y las **descompone**.","src":"S5 diap. 16-17","imp":1},{"id":"ud5-041","ud":5,"tema":"Ej. 4: conc/3","q":"¿Qué dos usos de conc/3 muestran las diapositivas?","a":"• Unión: conc([aa, bb], [cc], Total) da Total = [aa, bb, cc]\n• Descomposición: el motor explora **todas las particiones** con backtracking","src":"S5 diap. 17","imp":2,"code":"?- conc(P, S, [a, b, c]).\nP = [], S = [a, b, c] ;\nP = [a], S = [b, c] ;\nP = [a, b], S = [c] ;\nP = [a, b, c], S = []."},{"id":"ud5-042","ud":5,"tema":"Ej. 5: aritmética (is)","q":"Ejercicio 5: ¿cómo se define longitud/2?","a":"• [] mide 0\n• [_|T] mide lo que mida T, más 1\n• **is** va tras la recursión, cuando NResto ya tiene valor","src":"S5 diap. 18","imp":2,"code":"longitud([], 0).\nlongitud([_|T], N) :-\n    longitud(T, NResto),\n    N is NResto + 1."},{"id":"ud5-043","ud":5,"tema":"Ej. 5: aritmética (is)","q":"Ejercicio 5: ¿cómo se define sumar_cargas/2?","a":"• [] suma 0\n• [C|Resto] suma el SubTotal del resto más C","src":"S5 diap. 18","imp":2,"code":"sumar_cargas([], 0).\nsumar_cargas([C|Resto], Total) :-\n    sumar_cargas(Resto, SubTotal),\n    Total is SubTotal + C."},{"id":"ud5-044","ud":5,"tema":"Ej. 5: aritmética (is)","q":"¿Por qué el operador is «rompe la pureza»?","a":"Rompe la **bidireccionalidad pura**: es una llamada imperativa a la CPU que exige que los valores de la derecha **estén instanciados**.","src":"S5 diap. 18","imp":1,"code":"?- X is Y + 1.   % Y sin valor\n→ ERROR (no instanciado)"},{"id":"ud5-045","ud":5,"tema":"Ej. 5: aritmética (is)","q":"En sumar_cargas([10, 20], Total), ¿cuándo ocurre la suma?","a":"**De regreso**: el motor desciende hasta sumar_cargas([], 0) con las operaciones suspendidas y, al desenvolver: 0 + 20 = 20, 20 + 10 = 30.","src":"S5 diap. 19","imp":1},{"id":"ud5-046","ud":5,"tema":"Ej. 6: subconjunto/2","q":"Ejercicio 6: ¿cómo se define subconjunto/2?","a":"Comprueba que **TODOS** los elementos de la sublista están en la lista:\n• [] es subconjunto de cualquier lista\n• H es miembro y la cola T también es subconjunto","src":"S5 diap. 20","imp":1,"code":"subconjunto([], _).\nsubconjunto([H|T], Lista) :-\n    miembro(H, Lista),\n    subconjunto(T, Lista)."},{"id":"ud5-047","ud":5,"tema":"Ej. 6: subconjunto/2","q":"En subconjunto/2, ¿qué papel cumple miembro/2?","a":"Es un **predicado auxiliar**: aislamos la cabeza de la sublista y delegamos la búsqueda de ese elemento al motor lógico.","src":"S5 diap. 20","imp":2},{"id":"ud5-048","ud":5,"tema":"Ej. 6: subconjunto/2","q":"¿Por qué subconjunto([aa, dd], [aa, bb, cc]) devuelve false?","a":"aa se encuentra y el motor avanza; **dd no** está: falla la premisa, la conjunción (AND) se quiebra y la regla completa colapsa.","src":"S5 diap. 21","imp":1},{"id":"ud5-049","ud":5,"tema":"Ej. 6: subconjunto/2","q":"¿Qué dice la asunción del mundo cerrado?","a":"«Lo que **no se puede demostrar**, es falso».","src":"S5 diap. 21","imp":1}];
  const UDS = [{"ud":1,"glyph":"{ }","name":"Introducción a los paradigmas"},{"ud":2,"glyph":"( )","name":"Paradigma funcional y Lisp"},{"ud":3,"glyph":"λ","name":"Funcional: Hope y Haskell"},{"ud":4,"glyph":":-","name":"Paradigma lógico y Prolog"},{"ud":5,"glyph":"?-","name":"Prolog: listas, grafos y ejercicios"}];
  const BY_ID = new Map(CARDS.map(c => [c.id, c]));
  const UD_OF = new Map(UDS.map(u => [u.ud, u]));
  const app = document.getElementById('app');

  // ---------- utilidades ----------
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  function inline(s) {
    return String(s).split('`').map((part, i) => i % 2
      ? '<code>' + esc(part) + '</code>'
      : esc(part).replace(/\*\*([^*]+)\*\*/g, '<mark>$1</mark>')).join('');
  }
  function fmt(s) {
    let html = '', list = false;
    for (const raw of String(s || '').split('\n')) {
      const l = raw.trim(); if (!l) continue;
      const m = l.match(/^(?:•|-)\s+(.*)$/);
      if (m) { if (!list) { html += '<ul>'; list = true; } html += '<li>' + inline(m[1]) + '</li>'; }
      else { if (list) { html += '</ul>'; list = false; } html += '<p>' + inline(l) + '</p>'; }
    }
    return html + (list ? '</ul>' : '');
  }
  const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
  const ICON = {
    x: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  };
  const reduced = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

  // ---------- almacenamiento ----------
  const KEY = 'fichas-paradigmas-v1', PKEY = 'fichas-paradigmas-prefs';
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } },
  };
  const parse = t => { try { return JSON.parse(t); } catch (e) { return null; } };
  const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
  function sanitize(s) {
    const o = { v: 1, epoch: 0, cards: {} };
    if (!isObj(s)) return o;
    o.epoch = +s.epoch || 0;
    if (isObj(s.cards)) for (const [k, e] of Object.entries(s.cards)) {
      if (isObj(e)) o.cards[k] = { b: Math.max(0, Math.min(3, +e.b || 0)), n: +e.n || 0, ok: +e.ok || 0, last: +e.last || 0 };
    }
    return o;
  }
  function merge(a, b) {
    if (!b) return a; if (!a) return b;
    if (a.epoch !== b.epoch) return a.epoch > b.epoch ? a : b;
    const o = { v: 1, epoch: a.epoch, cards: {} };
    for (const k of new Set([...Object.keys(a.cards), ...Object.keys(b.cards)])) {
      const x = a.cards[k], y = b.cards[k];
      o.cards[k] = !x ? y : !y ? x : (y.last > x.last ? y : x);
    }
    return o;
  }
  function stable(x) {
    if (Array.isArray(x)) return '[' + x.map(stable).join(',') + ']';
    if (isObj(x)) return '{' + Object.keys(x).sort().map(k => JSON.stringify(k) + ':' + stable(x[k])).join(',') + '}';
    return JSON.stringify(x === undefined ? null : x);
  }
  let S = sanitize(parse(LS.get(KEY)));
  const DEF_PREFS = { uds: UDS.map(u => u.ud), off: [], filtro: 'todas', ess: false, orden: 'temario', hideA: false };
  let P = Object.assign({}, DEF_PREFS, isObj(parse(LS.get(PKEY))) ? parse(LS.get(PKEY)) : {});
  if (!Array.isArray(P.uds)) P.uds = DEF_PREFS.uds.slice();
  P.uds = P.uds.filter(u => UD_OF.has(u));
  if (!Array.isArray(P.off)) P.off = [];
  const savePrefs = () => LS.set(PKEY, JSON.stringify(P));

  // ---------- sincronización con la cuenta (capacidad db) ----------
  const Remote = { ref: null, status: 'local', writing: false, again: false, last: null, t: 0 };
  const SYNC_TXT = { local: ['', 'Progreso guardado en este dispositivo'], connecting: ['', 'Conectando con tu cuenta…'], ok: ['ok', 'Progreso sincronizado con tu cuenta'], error: ['err', 'Sin conexión; se guardará al volver'] };
  function syncHTML() { const m = SYNC_TXT[Remote.status]; return '<span class="sync ' + m[0] + '" id="sync-st"><i></i>' + m[1] + '</span>'; }
  function setSync(st) { Remote.status = st; const el = document.getElementById('sync-st'); if (el) el.outerHTML = syncHTML(); }
  async function initRemote() {
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    try {
      const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
      if (!user || !db) return;
      const id = await user.id(); if (!id) return;
      Remote.ref = db.doc('data/users/' + id + '/fichas-paradigmas');
      setSync('connecting');
      const timer = setTimeout(() => { if (Remote.status === 'connecting') setSync('error'); }, 10000);
      Remote.ref.onSnapshot(snap => {
        if (!snap.metadata || !snap.metadata.fromCache) clearTimeout(timer);
        const remote = snap.exists ? sanitize(snap.data()) : null;
        Remote.last = remote ? stable(remote) : null;
        if (remote) {
          const m = merge(S, remote);
          if (stable(m) !== stable(S)) { S = m; LS.set(KEY, JSON.stringify(S)); if (view === 'home') render(); }
        }
        setSync('ok');
        if (stable(S) !== Remote.last && (Object.keys(S.cards).length || S.epoch)) scheduleWrite(1200);
      }, () => { clearTimeout(timer); Remote.ref = null; setSync('local'); });
    } catch (e) { setSync('local'); }
  }
  function scheduleWrite(ms) { if (!Remote.ref) return; clearTimeout(Remote.t); Remote.t = setTimeout(flushWrite, ms || 600); }
  async function flushWrite() {
    if (!Remote.ref) return;
    if (Remote.writing) { Remote.again = true; return; }
    const body = stable(S); if (body === Remote.last) return;
    Remote.writing = true;
    try { await Remote.ref.set(JSON.parse(body)); Remote.last = body; setSync('ok'); }
    catch (e) { if (e && e.code === 'invalid_argument') { Remote.ref = null; setSync('local'); } else setSync('error'); }
    finally { Remote.writing = false; if (Remote.again) { Remote.again = false; scheduleWrite(800); } }
  }
  function commit() { LS.set(KEY, JSON.stringify(S)); scheduleWrite(700); }

  // ---------- estado de cada ficha ----------
  const rec = id => S.cards[id];
  function status(id) { const e = rec(id); if (!e || !e.n) return 'new'; return e.b >= 2 ? 'ok' : e.b === 1 ? 'mid' : 'bad'; }
  function rateCard(id, r) {
    const e = Object.assign({ b: 0, n: 0, ok: 0, last: 0 }, rec(id));
    e.n++;
    if (r === 'good') { e.ok++; e.b = e.n === 1 ? 2 : Math.min(3, e.b + 1); }
    else if (r === 'hard') e.b = 1;
    else e.b = 0;
    e.last = Date.now();
    S.cards[id] = e; commit();
  }
  function tally(cards) {
    const t = { ok: 0, mid: 0, bad: 0, new: 0, total: cards.length };
    for (const c of cards) t[status(c.id)]++;
    return t;
  }
  const bar = t => t.total ? ['ok', 'mid', 'bad'].map(k => '<i class="s-' + k + '" style="width:' + (100 * t[k] / t.total).toFixed(2) + '%"></i>').join('') : '';

  // ---------- selección de fichas ----------
  const singleUd = () => P.uds.length === 1 ? P.uds[0] : null;
  const temaKey = (ud, tema) => ud + '|' + tema;
  function temasOf(ud) { const seen = []; for (const c of CARDS) if (c.ud === ud && !seen.includes(c.tema)) seen.push(c.tema); return seen; }
  function pool() {
    const one = singleUd();
    return CARDS.filter(c => {
      if (!P.uds.includes(c.ud)) return false;
      if (one && P.off.includes(temaKey(c.ud, c.tema))) return false;
      if (P.ess && c.imp !== 1) return false;
      const st = status(c.id);
      if (P.filtro === 'pendientes' && st === 'ok') return false;
      if (P.filtro === 'falladas' && (st === 'ok' || st === 'new')) return false;
      return true;
    });
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  // Las fichas de una misma serie van siempre juntas y en orden (1/5, 2/5…), también al mezclar.
  function queueOf(cards, mix) {
    const groups = [];
    for (const c of cards) {
      const g = groups[groups.length - 1];
      if (c.serie && g && g[0].serie === c.serie && g[0].ud === c.ud) g.push(c); else groups.push([c]);
    }
    if (mix) shuffle(groups);
    return groups.flat().map(c => c.id);
  }

  // ---------- vistas ----------
  let view = 'home', ses = null, armed = false;

  function render() {
    if (view === 'study' && ses) return renderStudy();
    if (view === 'done' && ses) return renderDone();
    if (view === 'list') return renderList();
    view = 'home'; renderHome();
  }

  function renderHome() {
    const all = tally(CARDS);
    const one = singleUd();
    const n = pool().length;
    const udRows = UDS.map(u => {
      const cs = CARDS.filter(c => c.ud === u.ud), t = tally(cs), on = P.uds.includes(u.ud);
      return '<button class="ud" data-ud="' + u.ud + '" aria-pressed="' + on + '">' +
        '<span class="ud-glyph" aria-hidden="true">' + esc(u.glyph) + '</span>' +
        '<span class="ud-txt"><span class="ud-name"><small>UD' + u.ud + '</small>' + esc(u.name) + '</span>' +
        '<span class="ud-bar">' + bar(t) + '</span></span>' +
        '<span class="ud-num">' + t.ok + '/' + t.total + '<span class="ud-check">' + ICON.check + '</span></span></button>';
    }).join('');
    let temas = '';
    if (one) {
      temas = '<section class="sec"><div class="sec-head"><h2>Temas de la UD' + one + '</h2>' +
        '<button class="link" id="temas-all">' + (P.off.some(k => k.startsWith(one + '|')) ? 'Todos' : 'Ninguno') + '</button></div><div class="chips">' +
        temasOf(one).map(tm => {
          const k = temaKey(one, tm), cnt = CARDS.filter(c => c.ud === one && c.tema === tm).length;
          return '<button class="chip" data-tema="' + esc(k) + '" aria-pressed="' + !P.off.includes(k) + '">' + esc(tm) + '<small>' + cnt + '</small></button>';
        }).join('') + '</div></section>';
    }
    const seg = (name, opts) => '<div class="seg" role="group">' + opts.map(([v, l]) =>
      '<button data-' + name + '="' + v + '" aria-pressed="' + (P[name] === v) + '">' + l + '</button>').join('') + '</div>';
    const ess = CARDS.filter(c => P.uds.includes(c.ud) && c.imp === 1).length;
    app.innerHTML =
      '<div class="view"><div class="scroll"><div class="home wrap">' +
      '<header><div class="brand"><span class="brand-mark" aria-hidden="true">λ</span><div><h1>Fichas de Paradigmas</h1>' +
      '<p class="sub"><span>10901 · UD1–UD5 · ' + CARDS.length + ' fichas</span>' + syncHTML() + '</p></div></div></header>' +
      '<section class="global" aria-label="Progreso"><div class="big"><b>' + all.ok + '</b><span>de ' + all.total + ' fichas dominadas</span></div>' +
      '<div class="stack">' + bar(all) + '</div>' +
      '<div class="legend"><span class="l-ok">' + all.ok + ' me las sé</span><span class="l-mid">' + all.mid + ' dudosas</span><span class="l-bad">' + all.bad + ' falladas</span><span>' + all.new + ' sin ver</span></div></section>' +
      '<section class="sec"><div class="sec-head"><h2>Unidades</h2><button class="link" id="uds-all">' + (P.uds.length === UDS.length ? 'Ninguna' : 'Todas') + '</button></div><div class="uds">' + udRows + '</div></section>' +
      temas +
      '<section class="sec"><h2>Qué fichas</h2>' +
      seg('filtro', [['todas', 'Todas'], ['pendientes', 'Sin dominar'], ['falladas', 'Falladas']]) +
      '<button class="toggle" id="ess" aria-pressed="' + P.ess + '"><span><b>Solo esenciales ★</b><small>' + plural(ess, 'ficha de lo más seguro de examen', 'fichas de lo más seguro de examen') + '</small></span><i class="sw" aria-hidden="true"></i></button>' +
      '</section>' +
      '<section class="sec"><h2>Orden</h2>' + seg('orden', [['temario', 'Como el temario'], ['mezcla', 'Mezcladas']]) + '</section>' +
      '<section class="howto"><p><b>Cómo se usa.</b> Toca la ficha para girarla. Luego elige: <b>Otra vez</b> (vuelve a salir en unos minutos), <b>Dudé</b> o <b>Me la sé</b>. También puedes deslizar: → me la sé, ← otra vez.</p>' +
      '<p>Cuando un mismo tema ocupa varias fichas verás <b>1/5, 2/5…</b> y salen siempre seguidas. La fuente (diapositiva o página) va al pie de cada respuesta.</p>' +
      '<button class="reset' + (armed ? ' armed' : '') + '" id="reset">' + (armed ? 'Toca otra vez para borrar todo el progreso' : 'Borrar progreso') + '</button></section>' +
      '</div></div>' +
      '<div class="dock wrap">' +
      '<button class="btn" id="go"' + (n ? '' : ' disabled') + '>Empezar · ' + plural(n, 'ficha', 'fichas') + '</button>' +
      '<button class="btn ghost" id="list"' + (n ? '' : ' disabled') + '>Lista</button>' +
      (n ? '' : '<p class="empty-note">' + (P.uds.length ? 'No hay fichas con estos filtros. Prueba con «Todas».' : 'Elige al menos una unidad.') + '</p>') +
      '</div></div>';

    app.querySelectorAll('.ud').forEach(b => b.onclick = () => {
      const u = +b.dataset.ud;
      P.uds = P.uds.includes(u) ? P.uds.filter(x => x !== u) : [...P.uds, u].sort();
      savePrefs(); keepScroll(renderHome);
    });
    const ua = document.getElementById('uds-all');
    ua.onclick = () => { P.uds = P.uds.length === UDS.length ? [] : UDS.map(u => u.ud); savePrefs(); keepScroll(renderHome); };
    app.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      const k = b.dataset.tema; P.off = P.off.includes(k) ? P.off.filter(x => x !== k) : [...P.off, k];
      savePrefs(); keepScroll(renderHome);
    });
    const ta = document.getElementById('temas-all');
    if (ta) ta.onclick = () => {
      const mine = temasOf(one).map(t => temaKey(one, t));
      P.off = P.off.some(k => k.startsWith(one + '|')) ? P.off.filter(k => !k.startsWith(one + '|')) : [...P.off, ...mine];
      savePrefs(); keepScroll(renderHome);
    };
    app.querySelectorAll('[data-filtro]').forEach(b => b.onclick = () => { P.filtro = b.dataset.filtro; savePrefs(); keepScroll(renderHome); });
    app.querySelectorAll('[data-orden]').forEach(b => b.onclick = () => { P.orden = b.dataset.orden; savePrefs(); keepScroll(renderHome); });
    document.getElementById('ess').onclick = () => { P.ess = !P.ess; savePrefs(); keepScroll(renderHome); };
    document.getElementById('reset').onclick = () => {
      if (!armed) { armed = true; keepScroll(renderHome); setTimeout(() => { if (armed) { armed = false; if (view === 'home') keepScroll(renderHome); } }, 4000); return; }
      armed = false; S = { v: 1, epoch: Date.now(), cards: {} }; commit(); keepScroll(renderHome);
    };
    document.getElementById('go').onclick = () => {
      const cards = pool(); if (!cards.length) return;
      startSession(queueOf(cards, P.orden === 'mezcla'), describe());
    };
    document.getElementById('list').onclick = () => { view = 'list'; render(); };
  }
  function keepScroll(fn) {
    const sc = app.querySelector('.scroll'), y = sc ? sc.scrollTop : 0;
    fn();
    const sc2 = app.querySelector('.scroll'); if (sc2) sc2.scrollTop = y;
  }
  function describe() {
    const u = P.uds.length === UDS.length ? 'UD1–UD5' : P.uds.map(x => 'UD' + x).join(' · ');
    return u + (P.ess ? ' · esenciales' : '');
  }

  // ---------- sesión de estudio ----------
  function startSession(ids, title) {
    ses = { q: ids.slice(), i: 0, flipped: false, first: {}, requeued: {}, title: title, total: ids.length };
    view = 'study'; render();
  }
  function seriesDots(c) {
    let d = '';
    for (let k = 1; k <= c.total; k++) d += '<i class="' + (k < c.n ? 'on' : k === c.n ? 'on cur' : '') + '"></i>';
    return '<div class="serie"><span class="nt">' + c.n + '/' + c.total + '</span><span>' + esc(c.serie) + '</span><span class="dots" aria-hidden="true">' + d + '</span></div>';
  }
  function eyebrow(c) {
    return '<div class="eyebrow"><span class="udtag">UD' + c.ud + '</span><span>' + esc(c.tema) + '</span>' +
      (c.imp === 1 ? '<span class="star" title="Esencial">★ Esencial</span>' : '') + '</div>';
  }
  function renderStudy() {
    const id = ses.q[ses.i], c = BY_ID.get(id);
    if (!c) { ses.i++; return ses.i < ses.q.length ? renderStudy() : finish(); }
    const pct = 100 * ses.i / ses.q.length;
    const serie = c.serie && c.total > 1 ? seriesDots(c) : '';
    app.innerHTML =
      '<div class="view">' +
      '<div class="studybar wrap"><button class="icon-btn" id="quit" aria-label="Salir al inicio">' + ICON.x + '</button>' +
      '<div class="prog" aria-hidden="true"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<span class="count">' + (ses.i + 1) + ' / ' + ses.q.length + '</span></div>' +
      '<div class="stage wrap"><div class="card in' + (ses.flipped ? ' flipped' : '') + '" id="card" tabindex="0" role="button" aria-label="Ficha. Toca para girarla">' +
      '<div class="inner">' +
      '<div class="face front" aria-hidden="' + ses.flipped + '">' + eyebrow(c) + serie +
      '<p class="q">' + inline(c.q) + '</p><p class="tap">Toca para ver la respuesta</p></div>' +
      '<div class="face back" aria-hidden="' + !ses.flipped + '">' + eyebrow(c) + serie +
      '<p class="q-small">' + inline(c.q) + '</p>' +
      '<div class="ans">' + fmt(c.a) + (c.code ? '<pre>' + esc(c.code) + '</pre>' : '') + '</div>' +
      '<div class="src"><span>Fuente: ' + esc(c.src || '—') + '</span><span>' + statusLabel(id) + '</span></div></div>' +
      '</div><div class="tint" id="tint"></div></div></div>' +
      actionsHTML() + '</div>';
    bindStudy();
  }
  function statusLabel(id) {
    const st = status(id);
    return { new: 'Primera vez', ok: '<span class="st-dot s-ok"></span>Te la sabías', mid: '<span class="st-dot s-mid"></span>La dudaste', bad: '<span class="st-dot s-bad"></span>La fallaste' }[st];
  }
  function actionsHTML() {
    if (!ses.flipped) return '<div class="actions one wrap"><button class="btn" id="flip">Ver respuesta</button></div>';
    return '<div class="actions wrap">' +
      '<button class="rate again" data-r="again">Otra vez<small>no me la sé</small></button>' +
      '<button class="rate hard" data-r="hard">Dudé<small>a medias</small></button>' +
      '<button class="rate good" data-r="good">Me la sé<small>bien</small></button></div>';
  }
  function flip() {
    ses.flipped = !ses.flipped;
    const card = document.getElementById('card'); if (!card) return;
    card.classList.remove('in');
    card.classList.toggle('flipped', ses.flipped);
    card.querySelector('.front').setAttribute('aria-hidden', ses.flipped);
    card.querySelector('.back').setAttribute('aria-hidden', !ses.flipped);
    const old = app.querySelector('.actions'); if (old) old.outerHTML = actionsHTML();
    bindActions();
    const st = app.querySelector('.stage'); if (st) st.scrollTop = 0;
  }
  let busy = false;
  function answer(r) {
    if (busy || !ses || !ses.flipped) return;
    busy = true;
    const id = ses.q[ses.i];
    rateCard(id, r);
    if (!(id in ses.first)) ses.first[id] = r;
    if (r === 'again' && (ses.requeued[id] || 0) < 2) {
      ses.requeued[id] = (ses.requeued[id] || 0) + 1;
      ses.q.splice(Math.min(ses.i + 5, ses.q.length), 0, id);
    }
    const card = document.getElementById('card');
    const next = () => { busy = false; ses.i++; ses.flipped = false; if (ses.i >= ses.q.length) finish(); else renderStudy(); };
    if (card && !reduced()) { card.classList.add(r === 'again' ? 'out-l' : 'out-r'); setTimeout(next, 200); } else next();
  }
  function bindActions() {
    const f = document.getElementById('flip'); if (f) f.onclick = flip;
    app.querySelectorAll('.rate').forEach(b => b.onclick = () => answer(b.dataset.r));
  }
  function bindStudy() {
    document.getElementById('quit').onclick = () => { ses = null; view = 'home'; render(); };
    bindActions();
    const card = document.getElementById('card'), tint = document.getElementById('tint');
    let sx = 0, sy = 0, dx = 0, down = false, moved = false;
    card.addEventListener('pointerdown', e => { if (e.button) return; down = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0; });
    card.addEventListener('pointermove', e => {
      if (!down) return;
      dx = e.clientX - sx; const dy = e.clientY - sy;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
      if (!ses.flipped || Math.abs(dy) > Math.abs(dx)) return;
      card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 40) + 'deg)';
      const k = Math.min(1, Math.abs(dx) / 90);
      tint.className = 'tint ' + (dx > 0 ? 'good' : 'again'); tint.textContent = dx > 0 ? 'Me la sé' : 'Otra vez'; tint.style.opacity = k;
    });
    const end = () => {
      if (!down) return; down = false;
      card.style.transform = ''; tint.style.opacity = 0;
      if (ses.flipped && Math.abs(dx) > 90) { answer(dx > 0 ? 'good' : 'again'); return; }
      if (!moved) flip();
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', () => { down = false; card.style.transform = ''; tint.style.opacity = 0; });
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    card.focus({ preventScroll: true });
  }
  document.addEventListener('keydown', e => {
    if (view !== 'study' || !ses) return;
    if (e.key === 'Escape') { ses = null; view = 'home'; render(); return; }
    if (!ses.flipped) { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flip(); } return; }
    if (e.key === 'ArrowLeft' || e.key === '1') answer('again');
    else if (e.key === 'ArrowDown' || e.key === '2') answer('hard');
    else if (e.key === 'ArrowRight' || e.key === '3') answer('good');
  });
  function finish() { view = 'done'; render(); }
  function renderDone() {
    const f = ses.first, ids = Object.keys(f);
    const ok = ids.filter(i => f[i] === 'good').length, mid = ids.filter(i => f[i] === 'hard').length, bad = ids.filter(i => f[i] === 'again').length;
    const miss = ses.q.filter((id, k) => ses.q.indexOf(id) === k && f[id] && f[id] !== 'good');
    const head = miss.length === 0 ? '¡Todas a la primera!' : ok >= miss.length ? 'Buen repaso' : 'Repaso hecho';
    app.innerHTML =
      '<div class="view"><div class="scroll"><div class="done wrap">' +
      '<div><h2>' + esc(ses.title) + '</h2><h1>' + head + '</h1></div>' +
      '<div class="tiles"><div class="tile ok"><b>' + ok + '</b><span>me las sé</span></div><div class="tile mid"><b>' + mid + '</b><span>dudé</span></div><div class="tile bad"><b>' + bad + '</b><span>otra vez</span></div></div>' +
      (miss.length ? '<button class="btn" id="redo">' + (miss.length === 1 ? 'Repasar la que no sabía' : 'Repasar las ' + miss.length + ' que no sabía') + '</button>' : '') +
      '<button class="btn ghost" id="home">Volver al inicio</button>' +
      (miss.length ? '<div class="miss"><h2>Para repasar</h2><ul>' + miss.map(id => '<li>' + inline(BY_ID.get(id).q) + '</li>').join('') + '</ul></div>' : '') +
      '</div></div></div>';
    const r = document.getElementById('redo');
    if (r) r.onclick = () => startSession(miss, 'Repaso de las que no sabía');
    document.getElementById('home').onclick = () => { ses = null; view = 'home'; render(); };
  }

  // ---------- lista ----------
  function renderList() {
    const cards = pool();
    let html = '', lastUd = null, lastTema = null;
    for (const c of cards) {
      if (c.ud !== lastUd || c.tema !== lastTema) {
        html += '<h3><small>UD' + c.ud + '</small>' + esc(c.tema) + '</h3>';
        lastUd = c.ud; lastTema = c.tema;
      }
      const st = status(c.id);
      html += '<button class="item" data-id="' + esc(c.id) + '"><span class="iq"><span><span class="st-dot s-' + st + '"></span>' + inline(c.q) + '</span>' +
        '<em>' + (c.serie && c.total > 1 ? c.n + '/' + c.total : '') + (c.imp === 1 ? ' ★' : '') + '</em></span>' +
        '<span class="ia"><span class="ans">' + fmt(c.a) + (c.code ? '<pre>' + esc(c.code) + '</pre>' : '') + '</span></span></button>';
    }
    app.innerHTML =
      '<div class="view"><div class="listbar wrap"><button class="icon-btn" id="lback" aria-label="Volver">' + ICON.back + '</button>' +
      '<h2>' + esc(describe()) + ' · ' + cards.length + '</h2>' +
      '<button class="link" id="hideA">' + (P.hideA ? 'Mostrar respuestas' : 'Ocultar respuestas') + '</button></div>' +
      '<div class="scroll"><div class="list wrap' + (P.hideA ? ' hide-a' : '') + '" id="listbox">' + html + '</div></div></div>';
    document.getElementById('lback').onclick = () => { view = 'home'; render(); };
    document.getElementById('hideA').onclick = () => { P.hideA = !P.hideA; savePrefs(); keepScroll(renderList); };
    app.querySelectorAll('.item').forEach(b => b.onclick = () => { if (P.hideA) b.classList.toggle('open'); });
  }

  // ---------- arranque (conserva la sesión si la página se actualiza mientras estudias) ----------
  function boot(data) {
    if (isObj(data) && isObj(data.ses) && Array.isArray(data.ses.q) && data.ses.q.every(id => BY_ID.has(id))) {
      ses = data.ses; view = data.view === 'done' ? 'done' : 'study'; ses.flipped = false;
    }
    render();
    initRemote();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ ses: ses, view: view })); } catch (e) { /* sin hot */ } }
  if (hot && typeof hot.ready === 'function') { try { hot.ready(boot); } catch (e) { boot({}); } }
  else boot((hot && hot.data) || {});
})();
</script>
