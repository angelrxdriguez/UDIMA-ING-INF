es disjunto; por lo que la mayor parte de los lenguajes funcionales definen el orden de evaluación y dejan al programador que compruebe que las condiciones son disjuntas o que están ordenadas apropiadamente."},{"s":"Cap. 2 p. 5","u":2,"t":"","x":"La distinción procedimental o declarativa de la función estriba fundamentalmente en si está especificada explícitamente la *secuencia* de ejecución. Con el estilo procedimental el desarrollador del software es responsable de definir la secuencia de instrucciones, incluido el fin de la ejecución. Por contraste, el estilo declarativo prevé la terminación sin requerir un control explícito de la ejecución. Esta diferencia es significativa para diferenciar ambos modelos de programación.\n\n#### 2.3.4 Características del Paradigma Funcional\n\nLas características principales que definen este paradigma y que describiremos a continuación son:\n\n- Aplica funciones con *Transparencia Referencial*\n- Aplica la *Composición Funcional*\n- Utiliza funciones de *Orden Superior*\n- No existe el concepto de *Estado*\n- Utiliza funciones con *Polimorfismo Paramétrico*\n- Utiliza evaluación *Retardada o Diferida*\n\n### 2.4 Transparencia Referencial"},{"s":"Cap. 2 p. 5","u":2,"t":"","x":"La diferencia más importante entre una función matemática y una función informática proviene de la noción de *variable modificable*. Los parámetros de una función matemática simplemente representan valores que se fijan en el tiempo de aplicación, donde su aplicación origina otro valor. Mientras que los parámetros de una función informática son nombres de celdas de memoria que pueden ser cambiados o no en la ejecución de la función, produciendo un efecto lateral. Como consecuencia de este efecto lateral, las funciones informáticas, a diferencia de las matemáticas, no siempre pueden ser combinadas como *expresiones*.\n\nCuando no existe efecto lateral se dice que la función tiene *transparencia referencial*. Ésta es una propiedad fundamental de las funciones matemáticas, ya que permite considerarlas como cajas negras y utilizarlas en composición funcional. Se cumple que cada expresión proporciona un *único* valor que no puede cambiar por la forma de evaluar la expresión o por permitir que diferentes partes de un programa compartan la expresión. La evaluación de la expresión simplemente cambia la forma de la expresión pero nunca su valor."},{"s":"Cap. 2 p. 5","u":2,"t":"","x":"Es decir, una función tiene transparencia referencial si se comporta como una función matemática, en el sentido de que si recibe un valor de entrada siempre producirá el mismo valor de salida, y que el resultado del cálculo de la función únicamente se devuelve por el nombre de la función y no por alguno de sus argumentos.\n\nSe va a ver esto con algunos ejemplos que aclaren este concepto.\n\n***Ejemplo 2.2: El mismo valor de entrada no produce un mismo valor de la función***\n\nSupóngase que se tiene la función *fun(x)* con un conmutador o switch *sw* que cambia de valor de cierto a falso cada vez que se ejecuta la función y que afecta al resultado que devuelve la función, de acuerdo con los siguientes términos:\n\n```\nfun (x): x, si sw= cierto\n```"},{"s":"Cap. 2 p. 6","u":2,"t":"","x":"```\n         x², si sw= falso\n```\ny que está codificada en C con el siguiente código:\n\n```\n#include\u003ciostream>\nusing namespace std;\nint sw;\nint fun (int n);\n\nvoid main()\n{\n   sw=0;\n   cout \u003c\u003c fun(2)+fun(3) \u003c\u003c endl;\n   cout \u003c\u003c fun(3)+fun(2) \u003c\u003c endl;\n}\n\nint fun (int n)\n{\n    int v;\n    if (sw) v=n; else v=n*n;\n    sw= !sw;\n    return v;\n}\n```\n\nEvidentemente esta función no tiene transparencia referencial, porque la primera vez muestra el valor 11 (2+3\\*3) y la segunda el valor 7 (3+2\\*2), lo que sería muy sorprendente para cualquier matemático que no tuviera idea de informática, pues la suma tiene la propiedad conmutativa por lo que para él sería totalmente sustituible fun(2)+ fun(3) por fun (3)+ fun (2).\n\nLa base del problema radica en la instrucción de asignación \"sw = !sw\" que en cada ejecución de la función cambia el valor de sw.\n\nOtro ejemplo de falta de transparencia referencial sería la función \"Cuadrado\" que se define a continuación:\n\n***Ejemplo 2.3: Retorna el valor de la función por un argumento***\n\n*Cuadrado(x,y) = {y=x\\*x, ∀x ∈ ℜ}*\n\n*Cuadrado* no tiene transparencia referencial porque el \"valor de retorno\" de la función se devuelve mediante la variable *y*, y no mediante el nombre de la función. Realmente, debería ser *Cuadrado (x)= x \\* x*. Su codificación en C++ es:\n\n```\n#include \u003ciostream>\n\nvoid cuadrado (int x, int &y)\n{\n   y = x*x;\n}\n```"},{"s":"Cap. 2 p. 7","u":2,"t":"","x":"```\nint main()\n{\n   using namespace std;\n   int a;\n   cuadrado(3,a);\n   cout \u003c\u003c a \u003c\u003c endl;\n   cuadrado(5,a);\n   cout \u003c\u003c a \u003c\u003c endl;\n}\n\nResultado: 9 y 25\n```\n\nPara finalizar, se presenta otra variante de falta de transparencia referencial de una función. Es el caso en que existe dentro de la función una variable fija, es decir, estática, que se incrementa en cada ejecución de la función.\n\n***Ejemplo 2.4: Retorna el valor de la función usando una variable global***\n\n*fun (x)= { 2(x+y), ∀x,y ∈ ℜ, siendo y una variable estática }.*\n\nCuya codificación en C++ sería:\n\n```\n#include \u003ciostream>\n\nint fun (int x)\n{\n   static int y=0;\n   y=y+1;\n   return 2* (x+y);\n}\n\nint main()\n{\n   using namespace std;\n   cout \u003c\u003c fun(3) \u003c\u003c endl;\n   cout \u003c\u003c fun(3) \u003c\u003c endl;\n   cout \u003c\u003c fun(3) \u003c\u003c endl;\n}\n\nResultado: 8, 10, 12\n```\n\nLa primera vez que se llama a *fun*, la variable *y* se inicializa a 0, pero esta acción no se vuelve a realizar en las próximas llamadas donde *y* conserva su último valor.\n\nDesde el punto de vista matemático resulta incomprensible que la misma llamada a la función *fun* con el mismo argumento x=3, dé resultados diferentes. Ello se debe a que no existe transparencia referencial y *fun* realiza acciones diferentes en cada llamada.\n\nSe ve pues, que la transparencia referencial es muy importante para no distorsionar el carácter de una función, de modo que se sepa que al llamarla con los mismos valores de los parámetros"},{"s":"Cap. 2 p. 8","u":2,"t":"","x":"siempre va a obtener el mismo valor de resultado, y este valor, única y exclusivamente, va a ser devuelto directamente por la función.\n\nLa transparencia referencial es indispensable para la *composición* de funciones ya que reemplaza \"valores por valores\", sustituyendo iguales por iguales, permitiendo con ello su transformación automática en formas equivalentes que son más eficientes para el computador. También permite *verificar la corrección* de los programas facilitando la construcción y prueba de asertos para comprobar su corrección.\n\n### 2.5 Composición Funcional\n\nComo se ha señalado al principio, el paradigma funcional se basa en el modelo matemático de composición funcional, que consiste en formar expresiones en que el resultado de una función es argumento de entrada de otra función y así sucesivamente. Un programa es una función (o grupo de funciones), normalmente compuestas de otras más simples. La relación entre funciones es muy simple: una función puede llamar a otra, o el resultado de una función se puede usar como un argumento de otra función [Watt, 1990]."},{"s":"Cap. 2 p. 8","u":2,"t":"","x":"Para que exista composición funcional es necesario que las funciones tengan transparencia referencial, hecho que ocurre en el paradigma funcional.\n\nSupongamos, como ejemplo, que se quiere calcular \"la suma de los números comprendidos entre 0 y el cuadrado del número mayor leído *x* o *y*, utilizando tres funciones: una que halle el mayor, otra el cuadrado y otra que obtenga la suma\". Matemáticamente, la función \"sumarnumeros\" sería de la forma:\n\n```\nsumarnumeros(x,y) = | x≥y →  Σ i   (i desde 0 hasta x)\n                    | x\u003cy →  Σ i   (i desde 0 hasta y)\n```\n\nY codificada funcionalmente en Hope sería el ejemplo 2.5, en que se han definido las funciones: *mayor(x,y)* que proporciona el valor mayor entre x e y; *cuadado(x)* que obtiene x²; *suma(x)* que de modo recursivo obtiene la suma 1+2+3+...+x; y *sumarnumeros(x,y)* como composición funcional de las tres funciones anteriores.\n\n***Ejemplo 2.5: Función sumar números en Hope***"},{"s":"Cap. 2 p. 8","u":2,"t":"","x":"```\ndec  mayor:  num # num -> num ;\n---  mayor ( x, y) \u003c= if ( x >= y) then  x  else  y;\n\ndec  cuadrado:  num-> num ;\n---  cuadrado( x ) \u003c= x*x ;\n\ndec  suma: num-> num;\n---  suma (0) \u003c= 0;\n---  suma (x) \u003c= suma (x-1) +x;\n\ndec sumarnumeros: num # num  -> num ;\n--- sumarnumeros(x,y) \u003c= suma (cuadrado(mayor(x,y)));\n```"},{"s":"Cap. 2 p. 9","u":2,"t":"","x":"```\nEjecución: >> sumarnumeros(12,5);\nResultado: >>: 10440\n```\n\nEn la programación funcional la ejecución es interpretativa, de forma que cada vez que el usuario introduce una acción, ejemplo *sumarnumero(12,5)*, el sistema la ejecuta, traduciendo las funciones que implican esa acción, hasta producir el resultado correspondiente, en este caso 10440.\n\nLos lenguajes imperativos también aceptan composición funcional, pudiendo escribirse expresiones del tipo *suma (cuadrado(mayor(x,y)))*, pero para que ello proporcione resultados adecuados es necesario que estas funciones tengan transparencia referencial.\n\nEn resumen, la *composición funcional* es la forma de programar funcionalmente: Se tiene una serie de funciones y se compone un programa construyendo *otra función* más compleja que utiliza las anteriores, de forma que el resultado de una sea la entrada de otra. La ejecución del programa es la ejecución de esta función compuesta."},{"s":"Cap. 2 p. 9","u":2,"t":"","x":"Debido a esta forma de programar, y de ejecutar el programa, ello plantea (aunque no es necesario) una ejecución *interactiva* entre el usuario y el programa. El usuario pide la ejecución de la función compuesta dando un valor a los argumentos de entrada y el programa le responde con el resultado de esa ejecución.\n\n### 2.6 Funciones de Orden Superior\n\nHemos comentado que la programación funcional incorpora el concepto de función como objeto de primera clase, indicando con ello que las funciones pueden ser tratadas como datos (pueden pasarse como parámetros, ser calculadas y devueltas como valores normales, y mezcladas en el cálculo con otras formas de datos).\n\nUna función cuyos parámetros y valores de retorno no son funciones se denomina *función de primer orden*, mientras que la que admite dichas características se denomina *función de orden superior o de primera clase* o también *función funcional*."},{"s":"Cap. 2 p. 9","u":2,"t":"","x":"A continuación se presentan dos ejemplos que aclaran este concepto.\n\nSupongamos que se quiere diseñar la función \"Calcularrec\" que permite aplicar un cálculo determinado (por ejemplo el área o el perímetro) a un rectángulo a partir de los valores de sus lados.\n\nEn un lenguaje funcional tipo *Hope* se declararían y definirían las funciones de primer orden *area(x,y)* y *perimetro(x,y)* que recibirían como argumentos dos números enteros y devolverían el valor del área o del perímetro respectivamente; y la función de orden superior *calcularrec(x,y,f)* que recibiría el valor de los lados *x* e *y* y una función *f* que sería el *área* o el *perímetro* a calcular, devolviendo el resultado de la función incorporada como argumento. El ejemplo 2.6 proporciona la codificación en Hope de este ejemplo.\n\n***Ejemplo 2.6: Cálculo del área o el perímetro de un rectángulo mediante una función de orden superior, codificada en Hope***\n```\ndec area: num # num -> num;\n--- area(x,y) \u003c= x*y;\n```"},{"s":"Cap. 2 p. 10","u":2,"t":"","x":"```\ndec perimetro: num # num -> num;\n--- perimetro(x,y) \u003c= 2*(x+y);\ndec calcularrec: num # num # (num # num -> num) -> num;\n--- calcularrec(x,y,f) \u003c= f(x,y);\n\n>> calcularrec(3,4,area);\n>>: 12\n>> calcularrec(3,4,perimetro);\n>>: 14\n```\n\nEn programación procedimental u operacional no se definen funciones de orden superior en sentido estricto pero se pueden utilizar aplicando punteros. Y el ejemplo anterior quedaría codificado en C++ como se indica en el ejemplo 2.7.\n\n***Ejemplo 2.7: Cálculo del área o el perímetro de un rectángulo mediante una función de orden superior, codificada en C++***\n\n```\n#include\u003ciostream>\n// Tipo que representa funciones de dos argumentos que devuelven\nentero\ntypedef long (* TFuncion) (int, int);\nlong area (int x, int y) { return x*y; }\nlong perimetro( int x, int y) { return 2*(x+y);}\nlong calcularrec ( int a, int b, TFuncion pf) { return pf(a ,b); }\n\n// Programa principal\nint main() {\n   using namespace std;\n   int i, a, b; cin>>i>>a>>b;\n // si i!=0 calcula el  área, si no el perímetro.\n   if ( i )\n      cout\u003c\u003c calcularrec (a, b, area) \u003c\u003cendl;\n   else\n      cout\u003c\u003ccalcularrec (a, b, perimetro)\u003c\u003cendl;\n}\nEntrada: 1 3 4 / 0 3 4                Resultado: 12 / 14\n```"},{"s":"Cap. 2 p. 10","u":2,"t":"","x":"En este caso, la función *calcularrec* se comporta como una función de orden superior con la diferencia básica de que su tercer argumento *pf* no es una función \"real\" sino un *puntero* a una función.\n\nEl carácter de orden superior es una característica fundamental que tienen que tener las funciones que participen en la construcción de un *programa funcional*.\n\nNormalmente se utilizan funciones de orden superior para hacer un código reutilizable y para representar datos de un modo primario (Watt, 1990).\n\nPermitir que una función retorne otra función como su resultado abre interesantes posibilidades que son utilizadas con intensidad en la programación funcional. Así, el modo más simple de crear un nueva función es componiendo dos funciones ya existentes utilizando esta propiedad de funciones de orden superior."},{"s":"Cap. 2 p. 11","u":2,"t":"","x":"Esta capacidad se puede utilizar para expresar *modelos comunes* de recursión y permitir que las funciones recursivas sean expresadas utilizando aplicaciones no recursivas de funciones de orden superior. Esta técnica conduce a programas concisos y abstractos que son sorprendentemente cortos teniendo en cuenta la compleja computación que realizan.\n\n### 2.7 Concepto de Estado\n\nEn el paradigma funcional no existe el concepto de *estado* como concepto de celda de memoria, donde se almacenan los datos de entrada, se realizan transformaciones sobre ellos y se almacenan los resultados de salida. Lo que existen son valores locales que almacenan los resultados de cálculos intermedios.\n\nComo consecuencia de ello:\n\n- No se pueden realizar *asignaciones destructivas* del tipo a ← b.\n- No se pueden realizar *procesos iterativos* del tipo: do, while, for,..etc.\n\nA continuación se presenta el ejemplo de la función *factorial* codificada procedimentalmente con estructura iterativa y funcionalmente con estructura recursiva."},{"s":"Cap. 2 p. 11","u":2,"t":"","x":"***Ejemplo 2.8: Función factorial procedimental en C++***\n\n```\n/* Función factorial en C++ */\n#include\u003ciostream>\nlong factorial (int x) {\n      long total =1;\n      while(x>0){\n            total *= x;\n            x--;\n            }\n      return total;\n}\nint main() {\n      using namespace std;\n      int dat;\n      cin >> dat;\n      cout \u003c\u003c factorial(dat) \u003c\u003c endl;\n}\n```\n\nVemos que la función factorial utiliza la variable *total* para, mediante asignación destructiva, ir almacenando el valor del *factorial(x)*. Por otra parte, utiliza la estructura iterativa *while* para disminuir el valor de x.\n\n***Ejemplo 2.9: Función factorial declarativa en Hope***\n\n```\n!Función factorial en Hope\ndec factorial: num -> num;\n--- factorial (x) \u003c= if x=\u003c0 then 1 else x * factorial (x-1);\n```"},{"s":"Cap. 2 p. 12","u":2,"t":"","x":"Vemos, en este caso, la forma más simple y elegante de definir la función factorial utilizando una estructura recursiva.\n\n### 2.8 Funciones Polimórficas\n\nDe acuerdo con el diccionario de la Real Academia Española, la palabra \"polimorfismo\" representa \"la calidad o estado de un elemento de asumir diferentes formas\"; es decir, es la capacidad de una entidad de tomar varias formas.\n\nEn programación el polimorfismo indica que el mismo componente del lenguaje puede asumir diferentes tipos o manipular tipos diferentes de objetos. Como Cardelli y Wegner señalan [Cardelli, 1985], \"los lenguajes convencionales, tales como Pascal, están basados en la idea de que las funciones, los procedimientos y los operandos tienen un único tipo. Tales lenguajes se dice que son *monomórficos*, en el sentido de que cada valor y variable es interpretada para pertenecer a un único tipo. Los lenguajes de programación monomórficos se pueden contrastar con los lenguajes polimórficos en que algunos valores y variables pueden tener más de un tipo."},{"s":"Cap. 2 p. 12","u":2,"t":"","x":"Se pueden considerar tres tipos de polimorfismo (sobrecarga, inclusión paramétrica o polimorfismo dinámico y polimorfismo paramétrico) que se describen a continuación.\n\na) *Sobrecarga:* Según Booch [Booch, 1994], este tipo de polimorfismo fue inicialmente descrito por Strachey [Harland, 1985] quien hablaba de un polimorfismo \"ad hoc\", por el cual símbolos tales como \"+\", \"-\", \"\\*\", etc., se podrían definir con varios significados.\n\nHoy en día, en los lenguajes de programación actuales este concepto recibe el nombre de *sobrecarga*, en que una función admite diferente número de argumentos y se pueden definir tantas versiones de dicha función como posibles valores pueda tener.\n\n***Ejemplo 2.10: Funciones \"arearectángulo\" e \"imprimir\" sobrecargadas***\n\n```\nEj1:  arearectangulo (x0,y0,x1,y1) = (x1-x0)*(y1-y0)\n      arearectangulo (x,y) = x*y\nEj2:  void imprimir (int);\n      void imprimir (char);\n      void imprimir (int, float);\n```"},{"s":"Cap. 2 p. 12","u":2,"t":"","x":"*El uso de la función imprimir sería el siguiente:*\n\n```\nvoid main()\n{\n   int i;\n   float f;\n   char c;\n   ...\n   imprimir(i);\n   imprimir(c);\n   imprimir(i,f);\n}\n```\n\nb) *Polimorfismo dinámico o inclusión paramétrica:* Un objeto, función o método viene determinado dinámicamente dependiendo de la clase de objeto que recibe el mensaje."},{"s":"Cap. 2 p. 13","u":2,"t":"","x":"Se aplica cuando existe una clase (por ejemplo, \"Empleado\") que es una subclase de otra (\"Persona\"). En este caso, se podrá utilizar un objeto de la clase derivada de la misma forma que un objeto de la clase padre.\n\nPor ejemplo, en la figura 2-1, la clase \"Empleado\" define un subtipo de \"Persona\" ya que un empleado cumple con todo el comportamiento de una persona (lo que sucede es que tiene un comportamiento adicional debido a que es un empleado de una empresa). Y se podrán utilizar objetos de tipo \"Empleado\" en cualquier sitio que admita objetos del tipo principal (\"Persona\").\n\n[Figura: diagrama de clases con la caja \"Persona\" arriba y la caja \"Empleado\" debajo, unidas por una flecha de herencia (triángulo vacío) que apunta hacia Persona.]\n\n*Figura 2-1. Clase Empleado (subclase de Persona)*\n\n***Ejemplo 2.11: Polimorfismo dinámico entre Persona y Empleado***\n\n```\nclass Persona {\nprotected:\n   char* nombre, docimilio, estado;\npublic:\n   Persona(char* nombre, char* domicilio, char* estado) {......}\n      virtual char* Nombre() {return nombre; }\n   ...................................................\n};\nclass Empleado: public Persona {\n   char* empresa;\npublic:\n   Empleado(char* nombre, char* domicilio, char* estado,\n      char* empresa){........}\n      char* Nombre() {return nombre; }\n   ......................................................\n};\n```"},{"s":"Cap. 2 p. 13","u":2,"t":"","x":"Aplicando polimorfismo dinámico se podrá crear un Empleado y utilizarlo como si fuera una Persona.\n\n```\nPersona per (\"Juan\",\"Mayor,36\",soltero); // Crea Persona per\nEmpleado emp(\"Luis\",\"Arenal,4\",\"casado\", \"Movistar\");//Crea\nEmpleado emp\nper.Nombre()// Obtiene \"Juan\"\nemp.Nombre()// Obtiene \"Luis\"\nPersona *pr=&emp; // puntero de tipo Personona que apunta al\nEmpleado emp\n```"},{"s":"Cap. 2 p. 14","u":2,"t":"","x":"```\npr->Nombre() ; //Obtiene Luis\n```\n\nc) *Polimorfismo paramétrico o genericidad:* Strachy también define este tipo de polimorfismo, por el cual un elemento (una función, un operador, una clase, etc.) se define como una plantilla que implementa la misma ejecución pero admitiendo diferentes tipos de datos. En el caso de una función, sus argumentos se pueden aplicar a más de un tipo de dato\n\nEn C++ se podría definir la función *imprimir* mediante polimorfismo paramétrico de la siguiente manera:\n\n***Ejemplo 2.12: Definición de la función imprimir mediante polimorfismo paramétrico***\n\n```\ntemplate \u003cclass T>\nvoid imprimir (T x) {\n   // Código de la función, que usa el dato \"x\" que\n   // puede ser de cualquier tipo.\n}\n```\n\nLa utilización de esta función consistiría en llamarla con un parámetro apropiado a la función pero de cualquier tipo:\n\n```\n...\nimprimir(20); // llamada con un entero\nimprimir(3.4); // Número real\nimprimir(true); // Valor booleano\n...\n```"},{"s":"Cap. 2 p. 14","u":2,"t":"","x":"El polimorfismo de este tipo permite compartir código, ya que basta con definir una única vez el cuerpo de la función para que esa función pueda aplicarse a cualquier tipo de datos (siempre y cuando las operaciones que se necesiten en el cuerpo de la función sean aplicables a datos de ese tipo).\n\nEl polimorfismo paramétrico se conoce también con el nombre de ***genericidad*** que es \"la capacidad que tiene un lenguaje de programación de formar funciones o clases paramétricas (arrays, listas, árboles, etc.) que describen estructuras de datos genéricas\".\n\nEn el ejemplo anterior en C++, la función \"imprimir\" sería una función con polimorfismo paramétrico y el argumento \"x\" es un parámetro genérico formal.\n\nEl ejemplo 2.13 describe, en el lenguaje funcional Hope, la función con polimorfismo paramétrico \"arearectangulo\". En este lenguaje *alpha* y *beta* son variables genéricas.\n\n***Ejemplo 2.13: Definición de la función \"arearectángulo\" mediante polimorfismo paramétrico***\n```\ndec arearectangulo: alpha#alpha -> alpha\n--- arearectangulo (x,y) \u003c= x*y;\nEjecución: >> arearectangulo(12,5); Resultado: >>: 60\nEjecución: >> arearectangulo(23.2,12.7); Resultado: >>: 294.64\n```"},{"s":"Cap. 2 p. 15","u":2,"t":"","x":"En el ejemplo 2.14 se codifica en Hope: a) la función no polimórfica *pertenecenum* que indica si un número pertenece o no una lista de números; b) la función *pertenece* con polimorfismo paramétrico que realiza la misma función pero con diferentes tipos de datos.\n\n***Ejemplo 2.14: Definición de las funciones \"pertenecenum\" y \"pertenece\"***\n\na) *Función \"pertenecenum\" que indica si un número pertenece a una lista de números*\n\n```\ndec pertenecenum: num # list(num) -> truval;\n--- pertenecenum(x,nil) \u003c= false;\n--- pertenecenum(x,a::l) \u003c= if x=a then true else\n                            pertenecenum(x,l);\n\nEjecución:>> pertenece(6,[2, 3, 4, 5]); Resultado>>: false\n```\n\nb) *Función \"pertenece\" que indica si un dato pertenece a una lista de elementos del mismo tipo*\n\n```\ndec pertenece: alpha # list(alpha) -> truval;\n--- pertenece(x,nil) \u003c= false;\n--- pertenece(x,a::l) \u003c= if x=a then true else pertenece(x,l);\n\nEjecución:>> pertenece(4,[2, 3, 4, 5]; Resultado: >>: trae\n\nEjecución:>> pertenece ('e', \"hola\"); Resultado: >>: false\n```"},{"s":"Cap. 2 p. 15","u":2,"t":"","x":"Como podemos comprobar con los ejemplos anteriores, el polimorfismo paramétrico es una característica natural del paradigma funcional mientras que su inclusión en el paradigma procedimental resulta más forzada.\n\n### 2.9 Evaluación Retardada o Diferida\n\nAl evaluar una función existen dos tipos de evaluación:\n\na) *Evaluación ansiosa (\"eager evaluation\").-* En este tipo de evaluación se evalúan los argumentos actuales y se sustituye su valor por cada ocurrencia de los formales. La aplicación de una función a un argumento se realiza evaluando previamente el argumento antes de pasarlo a la función, lo que se denomina *llamada por valor* (*\"call by value\"*). Este es el tipo de evaluación convencional y es una evaluación de *1er orden*.\n\n   La ventaja que tiene es que es fácil de implementar eficientemente, mientras que presenta el inconveniente de que se evalúen innecesariamente los argumentos si por alguna circunstancia no son requeridos en la ejecución de la función."},{"s":"Cap. 2 p. 15","u":2,"t":"","x":"b) *Evaluación retardada o diferida (\"lazy evaluation\").-* En este tipo de evaluación los argumentos de las funciones no se evalúan hasta que no se necesitan. Es la *llamada por necesidad* (*\"call by need\"*) en la que todos los argumentos de la función son pasados al cuerpo de la función sin evaluación previa, y sólo son evaluados cuando el cuerpo de la función los necesita. Es una evaluación de *2º orden*.\n   Esta alternativa presenta la desventaja de que su implementación es más cara porque se debe pasar a la función una expresión sin evaluar en lugar de un valor simple como en el caso de la *llamada por valor*. Pero presenta otras potencialidades como la creación de estructuras infinitas que veremos más adelante."},{"s":"Cap. 2 p. 16","u":2,"t":"","x":"El hecho de que el paradigma funcional utilice como elemento fundamental de la iteración la *recursividad* es lo que provoca la conveniencia (y en algunos casos la necesidad) del modelo de evaluación diferida.\n\nPor otro lado, la evaluación diferida se ajusta mal al paradigma procedimental debido al efecto de lado. Así, en el ejemplo 2.15 se describe la función *\"cuadrado\"* que en el caso a) se comporta igual con ambos tipos de evaluación, pero en el caso b) los resultados son diferentes porque cuando se lee el fichero f se produce un efecto de lado al pasar de un registro al siguiente.\n\n***Ejemplo 2.15: Evaluación de la función \"cuadrado\" con ambos tipos de evaluación***\n\n***cuadrado (n) = n\\*n***\n\n```\na) cuadrado(p+q);  p=2, q=5\n   Evaluación ansiosa: cuadrado (2+5) = 7*7 = 49\n   Evaluación diferida: cuadrado(2+5) = (2+5) *(2+5) =7*(2+5) =7*7 = 49\nb) cuadrado(getint(f));  f= 2, 5, 6, ....\n   Evaluación ansiosa: cuadrado (2) = 2*2 = 4\n   Evaluación diferida: cuadrado(getint(f)) = getint(f)* getint(f) = 2\n   * getint(f) = 2* 5 = 10\n```"},{"s":"Cap. 2 p. 16","u":2,"t":"","x":"La razón por la que la evaluación diferida no se ajusta bien al paradigma procedimental es que el programador tiene poco control sobre el orden de evaluación. Una función que construye un valor compuesto a partir de componentes simples no incide en el orden en que sus componentes son evaluados, ello viene determinado por el proceso de cálculo que *usa* el valor compuesto. Pero una falta de control en el orden de la evaluación puede producir graves consecuencias si como en el ejemplo anterior, existe efecto de lado, como ocurre en el paradigma procedimental.\n\nPor otra parte, el procesamiento de estructuras de datos infinitos no sería posible sin aplicar la evaluación diferida.\n\nEl ejemplo 2.16 presenta en Hope dos funciones: *\"lista\"* que forma una lista infinita de números; y *\"primerimpar\"* que obtiene el primer número impar de una lista. Como se vé, *primerimpar(lista(8))* produce, con evaluación ansiosa, una iteración infinita, mientras que obtiene el valor 9 al aplicar evaluación diferida."},{"s":"Cap. 2 p. 16","u":2,"t":"","x":"***Ejemplo 2.16: Obtener el primer número impar de una lista infinita***\n\n```\ndec lista: num  -> list (num) ;\n--- lista (n) \u003c= n::lista(n+1);\n\ndec primerimpar: list (num) -> num;\n--- primerimpar (nil) \u003c= 0 ;\n--- primerimpar (x::l) \u003c= if x  mod  2 /=  0 then x else\n                          primerimpar ( l ) ;\n\n>> primerimpar(lista(8));\nEvaluación ansiosa: pi(8::lista(9)) = pi(8::9::lista(10) = ....\nEvaluación diferida: pi(lista  (8)  )  =  pi  (8::  lista  (9)  )=\npi(lista (9)) = pi (9:: lista (10) ) = 9\n```"},{"s":"Cap. 2 p. 17","u":2,"t":"","x":"La evaluación diferida suele ser necesaria cuando se utilizan funciones constructoras como en el ejemplo anterior.\n\nNo todos los lenguajes de programación funcional aplican la evaluación diferida. El lenguaje Hope tiene dos implementaciones: una estándar en la que las funciones constructoras son *llamadas por necesidad* y el resto de las funciones *por valor*, y otra diferida en que todas las funciones son *llamadas por necesidad*. Mientras que el lenguaje Lisp no tiene evaluación diferida, por lo que no se podría codificar el ejemplo anterior en este lenguaje. El lenguaje ML usa evaluación ansiosa, mientras que el dialecto \"Lazy ML\" soporta evaluación diferida. El lenguaje Haskell también realiza evaluación diferida.\n\nUn beneficio de la evaluación diferida es el hecho de soportar una nueva clase de modularidad: la separación del *control* del *cálculo*. La idea es romper un cálculo iterativo o recursivo en una parte de cálculo puro, que computa todos los valores necesarios y construye un valor compuesto (ej. una lista infinita o diferida), y otra parte que recorre todo o parte de ese valor compuesto determinando así el flujo de control. A menudo, se puede expresar el cálculo de una forma más simple una vez que la información de control ha sido eliminada. A menudo, la misma parte de cálculo se puede reusar con diferentes partes de control, o una parte de control se puede reusar con diferentes partes de cálculo (Watt, 1990)."},{"s":"Cap. 2 p. 17","u":2,"t":"","x":"### 2.10 Mónadas\n\nEl lenguaje Haskell, modelo del paradigma funcional moderno, incorpora el concepto de mónada. Las mónadas son elementos encapsulados que proporcionan características procedimentales sin perder los beneficios del paradigma funcional: transparencia referencial, funciones de orden superior y evaluación diferida. Y proporcionan un desarrollo estructurado y secuencial.\n\nSu estructura simple consta de un *constructor de tipo unario* (m) y dos funciones polimórficas:\n\n- Una función (ej. return, result, etc.) toma un valor de un tipo *a* y crea un ítem mónadico *ma*. Es decir, una función que inyecta el tipo de data *a* en la mónada *ma*:\n\n  ```\n  Ej.- return:: a -> ma\n  ```\n\n- Otra función (ej. (>>=), then, bind, etc.) toma el item *ma* y una función que transforma un valor del tipo *a* a otro tipo mónadico *mb*, y retorna un item mónadico del tipo *mb*. Es decir, enlaza dos funciones mónadicas, pasando el resultado de la primera a la segunda y devolviendo el resultado de la segunda"},{"s":"Cap. 2 p. 17","u":2,"t":"","x":"```\n  Ej.- (>>=):: ma -> (a-> mb) -> mb\n  ```\n\nResumiendo tenemos, un tipo de dato *a*, que puede contener cualquier tipo de dato, una función (>>=) que combina dos funciones que procesan el tipo mónadico, devolviendo como resultado otra instancia del tipo mónadico y una función (*return*) que, dado un tipo, nos devuelve el tipo encerrado en la mónada.\n\nAdemás, el tipo y funciones definidos en la mónada deben cumplir las 3 leyes monádicas, que vienen a decir, de manera informal, que las funciones (>>=) y (*return*) deben comportarse bien con el elemento identidad y ser asociativas.\n\nEl desarrollo monádico permite una estrategia de evaluación secuencial. Y sustituyen funciones del tipo *\"values to values\"* por funciones *\"values to computations\"*."},{"s":"Cap. 2 p. 18","u":2,"t":"","x":"***Ejemplo 2.17: Mónada que obtiene el cuadrado de cada elemento de una lista de enteros incrementados en 10***\n\n```\nCuadradoListaMasDiez:: [Int] -> [Int]\nCuadradoListaMasDiez xl\n      = xl              >>=\\ x ->\n      return (square x)       >>=\\ y ->\n      return (y+10)\nEntrada: CuadradoListaMasDiez [2, 3, 4, 5]     Salida:\n=>[14,19,26,35]\n```\n\nLas mónadas se usan en Haskell: para modelar la entrada/salida sin perder pureza funcional, para modelar computaciones con estado mutable como las de un parser, para las excepciones, etc..\n\nHaskell encierra las acciones impuras de entrada/salida en una mónada especial, *la mónada IO*. De esta manera, las funciones que usan esta mónada siguen siendo puras, recibiendo y devolviendo valores de la mónada IO que describen una \"acción de entrada salida\", pero sin que su pureza se vea afectada por los efectos laterales. Además la mónada permite que la programación funcional sea interactiva."},{"s":"Cap. 2 p. 18","u":2,"t":"","x":"***Ejemplo 2.18: Mónada IO que lee dos caracteres y los imprime***\n\n```\nexIO:: IO()\nexIO =      getChar     >>=\\ c1 ->\ngetChar           >>=\\ c2 ->\nputChar c2        >>=\\ _\nputChar c1\n```\n\nEn la definición de mónada vimos que se definía también la función (>>=) para enlazar dos funciones. Esto es muy útil porque en Haskell se usa la \"evaluación diferida\", por lo que no se puede decidir en qué orden se van a ejecutar las llamadas a las funciones. Por ejemplo en (20 \\* (12 + 8)), no se sabe si se va a usar la propiedad distributiva o no, así que para secuenciar llamadas a funciones hay que utilizar funciones como (>>=) que permiten enlazar la ejecución secuencial de una serie de funciones.\n\n### 2.11 Tipos de Datos en el Paradigma Funcional\n\nEn general, el paradigma funcional utiliza muy pocos tipos de datos *primarios o básicos*. Los más usuales son:\n\na) *Datos atómicos*, que son números enteros, reales, booleanos y caracteres. Ejemplo: 28, 43.76, T (cierto) ó NIL (falso), Programación, 'h'.\nb) *Identificadores*, que son los nombres de las variables y de las funciones.\n\n   Ejemplo: x, suma(x).\n\nc) *Listas*. Conjuntos de elementos que corresponden a un tema común. Las cadenas de caracteres se consideran en general como listas de caracteres."},{"s":"Cap. 2 p. 19","u":2,"t":"","x":"Ejemplo: La lista de alumnos de una clase (Luis_Pérez, Andrés_Martínez, Rosa_Gómez....), la cadena \"hola\" (equivalente a la lista ('h', 'o', 'l', 'a').\n\nAl ser una *lista* un conjunto de elementos en el que va uno detrás de otro, su acceso siempre será al primer elemento de la lista, denominado la *cabeza*; siendo el resto de los elementos la cola de la lista.\n\nComo el paradigma funcional maneja mucho las listas, sus lenguajes tienen funciones ya definidas que obtienen la *cabeza* o la *cola* de una lista. Esto se puede comprobar en lenguajes funcionales tales como Lisp y Hope donde se describe el problema de: *\"Programar* la función *Sumar* que suma todos los números existentes en una lista L que recibe como argumento\"\n\n***Ejemplo 2.19: Función sumar que suma todos los números existentes en una lista L***\n\n***Codificación en Lisp:***\n\n```\n(DEFUN SUMAR(L)\n       (COND ((NULL (CDR L)) (CAR L))\n            (T (PLUS (CAR L) (SUMAR (CDR L))))))\n```"},{"s":"Cap. 2 p. 19","u":2,"t":"","x":"**NOTA:**\n\n- DEFUN: Define una función.\n- COND: Es la función condición: if ... then ... else.\n- CAR: Obtiene la cabeza de la lista.\n- CDR: Obtiene la cola de la lista.\n- PLUS: Es la función +\n\nSi se define L= (4,8,5,10), al ejecutar Sumar (L) mostrará por pantalla el valor 27.\n\nLa conversación entre el usuario y el programador sería:\n\n```\n? L = (4,8,5,10)\n? Sumar (L)\n27\n```\n\n***Codificación en Hope:***\n\n```\ndec Sumar: list(num)-> num;\n--- Sumar(nil) \u003c= 0;\n--- Sumar(x::l) \u003c= x + Sumar(l);\n```\n\n- de números y proporciona como resultado un número.\n- *x::l*: define una lista cuya cabeza es x y la cola l."},{"s":"Cap. 2 p. 21","u":2,"t":"","x":"### 2.12 Programas Funcionales\n\nUn programa funcional es pues, *\"un conjunto compuesto de funciones que juntas definen un objetivo específico de aplicación\"*.\n\nUn programa funcional viene definido por la ecuación:\n\n*Funciones + Estructuras de Datos = Programa*\n\nSiendo sus elementos fundamentales:\n\na) **Las funciones**, elementos básicos del paradigma. Poseen las propiedades de ser de orden superior y con transparencia referencial.\n\nb) **La recursividad**, que es la iteración con asignación no destructiva. El carácter recursivo de esta programación exige disponer de este mecanismo, especialmente utilizado en la construcción de funciones.\n\nc) **Las listas**, que como se ha indicado anteriormente, son las estructuras básicas de almacenamiento de la información. Aunque la programación funcional utiliza también otros tipos de estructuras, se fundamenta básicamente en el manejo de información simbólica con estructura en lista. En este tipo de programación, la expresión algebraica carece de la relevancia que tiene en la programación imperativa."},{"s":"Cap. 2 p. 21","u":2,"t":"","x":"Peter Bishop [Bishop, 1986] señala que los lenguajes funcionales son aplicativos porque aplican funciones, y pertenecen al conjunto de los denominados lenguajes de programación funcional surgidos del cálculo de la función lambda de Church. Un programa en un lenguaje funcional es considerado como un conjunto de *descripciones* de objetos de datos, más que como un conjunto de *almacenamientos* que proporciona los resultados del cómputo de estos datos.\n\nEn concreto, los lenguajes funcionales, tipo Lisp, Hope, Haskel, etc. constan de:\n\n- *Funciones primitivas* predefinidas en el lenguaje: de control, de estructuras, aritméticas...\n- *Formas funcionales* para crear y combinar funciones.\n- *Mecanismos para aplicar los argumentos* y producir valores de funciones; uno de estos mecanismos es la currificación [Curry, 1958] que consiste en tratar una función de n argumentos como una concatenación de n funciones con un solo argumento. Ej.: *f x y z => (((f x) y) z)*.\n- *Objetos de datos* del tipo átomos, listas, etc.\n- Los primeros lenguajes eran *interpretados* (no generan un ejecutable), el intérprete va interpretando (traduciendo) el código, línea a línea, excepto aquellas funciones ya compiladas en lenguaje máquina que directamente son llamadas sin necesidad de traducción. Actualmente suelen ser lenguajes compilados porque la compilación ahorra tiempo de ejecución al optimizar su ejecución.\n- Son *aplicativos*, ya que se fundamentan en la aplicación progresiva de estas funciones."},{"s":"Cap. 2 p. 22","u":2,"t":"","x":"### LISP\n\nComo lenguaje pionero de la programación funcional vamos a describir brevemente este lenguaje. Lenguajes actuales de tipo funcional como el Haskell y el Hope se describirán en la siguiente unidad.\n\nEl lenguaje LISP (\"List Processing\") diseñado por John McCarthy, en 1959, en el Instituto Tecnológico de Massachusetts es un lenguaje híbrido (funcional y procedimental) que incorpora en su expresión más simple los siguientes elementos:\n\na) *Funciones primitivas predefinidas.-* Fundamentalmente son las siguientes:\n\n- *Tratamiento de* listas:\n- CAR (devuelve la cabeza de la lista); CDR (devuelve la cola de la lista); CONS (construye una lista a partir de dos parámetros: cabeza y cola); LIST (construye una lista a partir de varias sublistas).\n\n  Ejemplos:\n\n  ```\n  (CAR ' ((A B) C))→ (A B)\n  (CDR ' ((A B) C))→ ( C )\n  (CADDR ' ((A B C) D E))→ E\n  (CONS ' A  ' (B C))→ (A • (B C)) → (A B C)\n  (LIST ' A  ' B  ' C)→ (A B C)\n  ```"},{"s":"Cap. 2 p. 22","u":2,"t":"","x":"**NOTA:** CADDR es un CDR, CDR y CAR en la misma instrucción\n\n- *Asignación, relaciones booleanas y predicados*\n  - SET y SETQ.- Evalúa sus argumentos, (en el caso de SETQ sólo evalúa el 2º argumento) y asigna el valor del segundo argumento al primero. Son dos funciones no declarativas, porque realizan una asignación destructiva.\n  - EQ.- Comprueba si dos argumentos son iguales\n  - GREATERP y LESSP.- Comparan si el primer argumento es mayor/menor que el segundo\n  - NULL.- Comprueba si la lista es nula\n  - ATOM, LISTP y NUMBERP.- Averiguan el tipo (átomo, lista o número) de un objeto\n  - OR, AND y NOT.- Predicados de suma, multiplicación y negación booleana.\n\n  Ejemplos:\n\n  ```\n  (SETQ X 'programacion) → Asigna \"programación\" a la\n  variable X\n  (EQ X 'programacion)→ T\n  (NULL X)→ F\n  (ATOM X)→ T\n  (NOT (OR (EQ 3  4) (EQ X  'programacion)))→ NIL\n  ```\n\n- *Aritméticas*"},{"s":"Cap. 2 p. 23","u":2,"t":"","x":"- PLUS, DIFFERENCE, TIMES, QUOTIENT, REMAINDER (suma, resta, multiplicación, cociente, resto)\n\n  Ejemplos:\n\n  ```\n  (PLUS 3  4)→ 7\n  (DIFFERENCE 10  20)→ -10\n  (TIMES 3 - 15)→ -45\n  (QUOTIENT 17  3)→ 5\n  (REMAINDER 17  3)→ 2\n  ```\n\n- *Condicionales e iterativas*\n  - COND.- Función condicional con varios predicados. Su formato es:\n    (COND (predicado1 exp1) ... (predicadon expn) )\n    - Si se verifica un predicado se ejecuta la expresión y finaliza la función condicional\n  - LOOP.- Función iterativa, que se incorporó posteriormente. Sus formatos son:\n    (LOOP secuencia-operaciones)\n    (LOOP (UNTIL predicado exp) secuencia-operaciones) )\n    - Hasta que el *predicado* no sea igual a la *exp* se ejecuta *la secuencia-operaciones*. La pregunta del UNTIL se realiza al finalizar cada iteración\n    (LOOP (WHILE predicado exp) (secuencia-operaciones) )\n    - Mientras el *predicado* verifique la *exp* se ejecuta la *secuencia-operaciones*. La pregunta del WHILE se realiza al principio de cada iteración."},{"s":"Cap. 2 p. 23","u":2,"t":"","x":"Ejemplo:\n  ```\n  (COND ((EQ A B) 20) (T 30)\n  equivale a: si A = B entonces 20 si no 30.\n  ```\n\n  Ejemplo:\n  ```\n  (SETQ Y 0)\n  (LOOP (UNTIL (GREATERP Y 100)\n          (SETQ Y (PLUS  Y  5))\n          (PRINT Y))\n  ```\n  En lenguaje C sería:\n  ```\n  y = 0;\n  do{\n      y = y + 5;\n      cout \u003c\u003c y;\n  }while (y \u003c= 100);\n  Imprime 5  10  15 ... 100  105\n  ```\n\nb) *Formas funcionales para crear y combinar funciones*\n\n- DEFUN.- Función que permite crear otras funciones. Su formato es:\n  (DEFUN nombre-función (lista-argumentos)  cuerpo-función)\n  Ejemplo: función Doble(x)=x\\*2"},{"s":"Cap. 2 p. 24","u":2,"t":"","x":"```\n(DEFUN DOBLE (X) (TIMES X 2) )\n> (DOBLE 14)→ 28\n```\n\nc) *Objetos de datos*\n\n   LISP, como lenguaje orientado a listas, dispone de esta estructura como fundamental.\n\n   En general, un programa en LISP utiliza:\n\n   - *Átomos*: números y combinación de caracteres y dígitos.\n     Ej.: 28, programación, -27, valor_total\n   - *Identificadores*: nombres de variables o de funciones\n     Ej.: X, DOBLE, Y25\n   - *Listas*: son átomos y/o sublistas encerrados entre paréntesis\n     Ej.: (20 4 35)(X Y (A B( C ) D E))\n\nA continuación se presentan dos ejemplos en LISP. El primero permite comprobar si un número es primo o no; y el segundo ordena ascendentemente una lista de datos.\n\n***Ejemplo 2.20: Primo***\n\n```\n;; Determinar si un número es primo o no\n(DEFUN PRIMO (N)\n   (COND ((EQ N 2) T)  ((EQ N 3)  T)\n         (T (PRIMO1 N (QUOTIENT N 2)))))\n(DEFUN PRIMO1 (N  I)\n   (COND ((EQ (REMAINDER  N  I)  0)  NIL)\n        ((EQ I  2) T)\n        (T (PRIMO1  N (DIFFERENCE  I 1)))))\n```"},{"s":"Cap. 2 p. 24","u":2,"t":"","x":"Ejecución:\n\n```\n(PRIMO 3)→ T\n(PRIMO 8)→ NIL\n```\n\n***Ejemplo 2.21: Ordenar***\n\n```\n;; Ordenar ascendentemente los elementos de una lista\n;; INSERCIÓN: Dividir la lista en el 1º elemento y el resto\n;; A continuación, insertar el primero en lo ordenado del resto\n   ( DEFUN  ORDENAR (LISTA)\n      (COND (( NULL LISTA ) NIL)\n         (T ( INSERTAR ( CAR LISTA )\n                ( ORDENAR ( CDR LISTA )))))\n   ( DEFUN INSERTAR ( X LISTA )\n      ( COND (( NULL LISTA ) X )\n      ( T ( COND (( \u003c= X ( CAR LISTA ))(CONS X LISTA ))\n            ( T ( CONS ( CAR LISTA )\n                  ( INSERTAR X ( CDR LISTA ))))))))\n```\n\nEjecución:"},{"s":"Cap. 2 p. 25","u":2,"t":"","x":"```\n(ORDENAR ( 4  3  8  7  20) ) → ( 3  4  7  8  20 )\n```\n\nAunque el lenguaje LISP fue el primer lenguaje que implementa la programación funcional, no es un lenguaje paradigmático de este modelo de programación ya que incluye conceptos no funcionales tales como: efecto de lado con modificación destructiva de su contenido, tipos de datos con almacenamiento fijo (arrays y otros objetos manipulados básicamente con efecto de lado), constructores del flujo de control (por ejemplo, iteraciones y manejo de excepciones), etc. que lo hacen un lenguaje híbrido (declarativo y procedimental) en el que la secuencia de control juega un papel importante.\n\n### 2.13 Ventajas e Inconvenientes del Paradigma Funcional en Relación con el Imperativo\n\nLas ventajas del paradigma funcional son:\n\n- *Simplicidad*: el modelo de cómputo funcional y sus lenguajes son más simples que los imperativos. Por ejemplo, el lenguaje Haskell tiene 23 identificadores y el manual 80 páginas, mientras que Ada tiene 62 identificadores y el manual 200 páginas.\n- *Posibilidad de razonamiento formal*: la transparencia referencial permite razonamiento ecuacional (sustituir iguales por iguales) en el paradigma funcional. En el paradigma imperativo ha de utilizarse la lógica de predicados.\n- *Concisión*: la relación del número de líneas de código entre el paradigma imperativo y el paradigma funcional es de 10 a 1. Lo que indica que un código más reducido permite obtener un programa más conciso y por lo tanto más fiable.\n- *Abstracción*: El paradigma funcional se ajusta mejor al modelo del problema y peor al modelo del computador que el paradigma imperativo, lo que permite obtener un código más reutilizable."},{"s":"Cap. 2 p. 25","u":2,"t":"","x":"- *Paralelismo*: la ausencia de efecto de lado del paradigma funcional facilita el cálculo paralelo, por ello el este paradigma es ideal para la programación paralela y concurrente.\n\nPor otro lado, el paradigma funcional presenta los siguientes inconvenientes:\n\n- *Dificultad del Modelo Funcional*: el paradigma funcional es poco intuitivo para el programador cuya línea de pensamiento está más en cómo opera el computador que es la forma de ejecución del paradigma imperativo.\n- *Ineficiencia*: el paradigma funcional es de 3 a 5 veces más lento en su ejecución que el paradigma imperativo.\n- Actualmente el paradigma funcional no es apropiado para la *programación en gran escala*. Sí que es bueno para investigar. Aunque los lenguajes Haskell, Standar ML y Miranda empiezan a ser bastante eficientes, especialmente Haskell.\n\n### 2.14 Ejercicios de Autocomprobación\n\n1. ¿De qué dos formas se suele especificar una función? *Declarativamente (matemáticamente) o procedimentalmente.*"},{"s":"Cap. 2 p. 26","u":2,"t":"","x":"2. ¿Cómo se denomina en el paradigma funcional la característica de que una función para unos mismos valores de entrada sólo pueda producir un único valor de salida? *Transparencia referencial.*\n\n3. ¿Qué características definen a una función de orden superior? *Que sus argumentos y su valor de retorno pueden ser otra función.*\n\n4. ¿Sería válido utilizar un puntero en este paradigma? *No, porque un puntero incorpora el concepto de estado de memoria, lo que no es válido en el paradigma.*\n\n5. ¿Qué se entiende por una función con polimorfismo paramétrico? *Que implementa la misma ejecución pero admitiendo para sus argumentos diferentes tipos de datos.*\n\n6. ¿Qué tipos de llamadas se realizan en las evaluaciones ansiosa y diferida? *En la evaluación ansiosa se realiza una \"llamada por valor\"(call by value), mientras que en la diferida se realiza \"llamada por necesidad\" (call by need).*\n\n7. ¿Qué es una mónada? *Es un elemento encapsulado que proporciona características procedimentales sin perder los beneficios del paradigma funcional.*"},{"s":"Cap. 2 p. 26","u":2,"t":"","x":"8. ¿Cuáles son los elementos fundamentales de un programa funcional? *Las funciones, la recursividad y las listas.*\n\n9. Las mónadas son una característica básica de la programación funcional? *No. Las mónadas son elementos encapsulados que proporcionan características procedimentales sin perder los beneficios del paradigma funcional.*\n\n10. ¿Enumera las ventajas del paradigma funcional en relación con el imperativo? *Simplicidad, posibilidad de razonamiento formal, concisión, abstracción y paralelismo.*\n\n### 2.15 Conclusiones\n\nLas conclusiones más importantes que se deducen del tema son las siguientes:\n\n- El modelo de cómputo del paradigma funcional (PF) está basado en la lógica ecuacional: \"un programa funcional consiste en un conjunto de definición de funciones cuyos patrones son disjuntos\".\n- El PF incorpora el concepto de función como objeto de primera clase lo que significa que las funciones pueden ser tratadas como datos.\n- Para que puedan ser tratadas como datos es preciso que tengan transparencia referencial, es decir, sin efecto de lado.\n- La transparencia referencial es indispensable para la composición de funciones. Reemplaza \"valores por valores\", es decir, sustituye iguales por iguales y permite verificar la corrección de programas.\n- El PF utiliza funciones de orden superior: aceptan como parámetros otras funciones, pueden retornar como resultado otra función y se pueden evaluar como un objeto.\n- En el PF no existe el concepto de estado (celda de memoria) por lo que: utiliza valores locales para los resultado de cálculos intermedios, no se puede utilizar la asignación destructiva (a← b) y no se pueden realizar procesos iterativos (do, while, for,..)"},{"s":"Cap. 2 p. 27","u":2,"t":"","x":"- El PF admite funciones con polimorfismo de sobrecarga, mediante la utilización de patrones disjuntos para la definición de las funciones, y con polimorfismo paramétrico, en que sus argumentos se pueden aplicar a más de un tipo de dato.\n- El PF admite la evaluación diferida o perezosa donde los argumentos de las funciones no se evalúan hasta que no se necesitan. La evaluación diferida permite crear y tratar listas infinitas. La evaluación diferida se ajusta mal a los lenguajes imperativos debido al efecto de lado\n- El lenguaje Haskell implementa las mónadas que son elementos encapsulados que proporcionan a la programación funcional un desarrollo estructurado y secuencial.\n\n### 2.16 Bibliografía\n\n- ALONSO, F.; MARTÍNEZ, L.; SEGOVIA, F.J.: *Introducción a la Ingeniería del Software.- Modelos de Desarrollo de Programas.* Delta Publicaciones, 2005.\n- AMBLER, A.L.; BURNETT, M.; ZIMMERMAN, B.: *\"Operational Versus Definitional: A Perspective on Programming Paradigms\".* Sept./1992, IEEE Computer.\n- BAILEY R.: **\"A Hope Tutorial\"** http://www.soi.city.ac.uk/~ross/Hope/hope_tut/hope_tut.html.\n- BISHOP, P.: *\"Fifth generation computers: Concepts, Implementation and Uses\".* Ellis Horwood, 1986.\n- BOOCH, G.: *\"Object-Oriented Analysis and Design with Applications\".* Benjamin Cummings, 1994.\n- CURRY, H.B.; FEYS, R.: *\"Combinatory Logic\".* Vol 1. North Holland. 1958.\n- FIELD, A.J; HARRISON, P.G.: *\"Functional Programming\".* Addison-Wesley Publishing, 1993.\n- GRAHAM P.: *\"ANSI Common Lisp\".* Prentice Hall, 1995."},{"s":"Cap. 2 p. 27","u":2,"t":"","x":"- HARLAND, D. et al.: *\"An Alternative View of Polymorphism\".* SIGPLAN Notices, vol. 20. October, 1985.\n- PEYTON S. J.: *\"Haskell 98 Language and Libraries: The Revised Report\".* Microsoft Research, Cambridge. 2002.\n- RUIZ, BALS C.: *\"Razonando Con Haskell: Un Curso Sobre Programación Funcional\".* S.A. Thomson Paraninfo, 2004.\n- WATT, D. A.: *\"Programming Language. Concepts and Paradigms\".* Ed. Prentice-Hall, 1990."},{"s":"Guía Lisp p. 1","u":2,"t":"","x":"Guía de Estudio: Common LISP y los Fundamentos del\nParadigma Funcional\nEsta guía articula la sintaxis fundamental de Common LISP con los conceptos nucleares del\nparadigma funcional.\n 1. Fundamentos de Common LISP: Sintaxis, Evaluación y Memoria\nCommon LISP utiliza notación prefija (polaca) basada en S-expresiones (S-expressions),\ndonde el operador precede a sus operandos (operador arg1 arg2 ...).\nEvaluación y Supresión de Evaluación (quote)\nEl entorno evalúa por defecto cualquier lista considerándola una llamada a función. Si se\nrequiere tratar la lista o un símbolo como dato literal, se debe suprimir su evaluación\nutilizando el operador especial quote o su forma abreviada ':\n(+ 2 3)   ; 2 + 3\n(* 2 (+ 4 5))   ; 2 * (4 + 5)\n(quote (1 2 3))   ; Equivalente a '(1 2 3)\nSalida por pantalla (print, format):\n• print: Imprime el objeto evaluado en una nueva línea precedido de un salto de línea.\n• format: Permite salidas estructuradas. (format t \"~A~%\" valor) imprime el valor\nseguido de salto de línea sin comillas de escape.\n(print (+ 2 3))\n(print '(+ 2 3))\n(print (quote (+ 2 3)))\n(format t \"~A~%\" (+ 2 3))\n(format t \"~A~%\" '(+ 2 3))\nLa función format es la herramienta nativa de Lisp para estructurar y mostrar texto. Funciona\nmediante parámetros fijos:\n• format: Invoca la función de formateo de cadenas.\n• t : (Abreviatura de Terminal / True). Indica el destino de la salida. Al poner t, le\nordenas a Lisp que imprima directamente en la salida estándar (pantalla/consola) en\nlugar de guardar el texto en una variable."},{"s":"Guía Lisp p. 2","u":2,"t":"","x":"• \"~A~%\": Es la cadena de control (la plantilla). Los caracteres que empiezan con ~\nson directivas especiales:\no ~A (Aesthetic): Es un marcador de posición dinámico. Le dice a Lisp: \"Toma\nel siguiente argumento disponible (en este caso, el 5) e imprímelo en un\nformato estéticamente legible para humanos\" (sin comillas ni decoraciones).\no ~%: Es la directiva para un salto de línea (equivalente al \\n de otros lenguajes).\nÁmbito de Variables: Global vs. Local\n• Variables globales/especiales: Definidas con defvar o defparameter (habitualmente\nnombradas mediante earmuffs, e.g., *mi-global*).\n• Ligaduras locales (let): Introducen un entorno léxico acotado. Los nombres solo\nexisten dentro del cuerpo de la expresión:\n\n;; 1. Declaración de variables globales (Especiales)\n;; Usamos asteriscos (*...*) por convención (\"earmuffs\") para indicar que son globales.\n(defparameter *base* 10)\n(defparameter *altura* 5)\n;; 2. Operación utilizando las variables globales\n(format t \"~A~%\" (/ (* *base* *altura*) 2)) ; Devuelve 25.\n;; A diferencia de 'let', estas variables SÍ existen y mantienen su valor fuera.\n(format t \"La base global sigue siendo: ~A~%\" *base*)"},{"s":"Guía Lisp p. 2","u":2,"t":"","x":"(print (let ((base 10)\n      (altura 5))\n  (/ (* base altura) 2))) ; Devuelve 25. 'base' y 'altura' no existen fuera.\n\nDefinición de funciones (defun)\nDeclara una función estableciendo su nombre, lista de parámetros y cuerpo de evaluación.\n(defun nombre-funcion (param1 param2)\ncuerpo-de-la-funcion)\n\n( defun saludar()\n          (print \"Hola mundo!\")  )\n(saludar)"},{"s":"Guía Lisp p. 3","u":2,"t":"","x":";; Funcion que suma dos números\n( defun sumar (a b)\n    (+ a b) )\n\n(print(sumar 2 3))\n\n;; Saludar a \u003cnombre de usuario>\n( defun saludarUsuario(usuario)\n    (print (concatenate 'string \"hola \" usuario \", como estas?\")) )\n\n(saludarUsuario \"Antonio\")\n\nParámetros opcionales (&optional): Permite declarar argumentos con valor por defecto, ideal\npara acumuladores o contadores de posición sin obligar al usuario a pasarlos en la llamada\ninicial:\n(defun funcion (lista &optional (contador 1)) ...)\n\nBifurcaciones condicionales (if vs. cond)\n• if: Recibe exactamente una condición, una cláusula verdadera y una falsa (if test\nthen else).\n• cond: Permite evaluar múltiples casos ordenados; evalúa ramas (predicado accion)\nsecuencialmente. La rama (t accion) actúa como caso por defecto o else.\n\n;;; --- EJEMPLO CON 'IF' ---\n\n(defparameter *edad* 20)\n\n(if (>= *edad* 18)\n    (format t \"Eres mayor de edad.~%\")    ; Se ejecuta si es verdadero\n    (format t \"Eres menor de edad.~%\"))   ; Se ejecuta si es falso (nil)"},{"s":"Guía Lisp p. 4","u":2,"t":"","x":";;; --- EJEMPLO CON 'COND' ---\n\n(defparameter *nota* 15)\n\n(cond\n  ((>= *nota* 19) (format t \"Excelente~%\"))\n  ((>= *nota* 14) (format t \"Aprobado~%\"))\n  ((>= *nota* 11) (format t \"Suficiente~%\"))\n  (t                        (format t \"Reprobado~%\"))) ; El 't' al final actúa como el 'else' por defecto\n\nFormas Lambda (lambda):\nFunciones anónimas que se definen sin ligarse a un nombre mediante (lambda (params)\ncuerpo).\n\n;;; --- CALCULAR EL ÁREA DE UN RECTÁNGULO INMEDIATAMENTE ---\n(print ((lambda (base altura) (* base altura)) 10 5))\n;; Salida en consola: 50\n\n2. Anatomía de las Listas:\nEn LISP, toda lista se construye mediante pares enlazados denominados celdas cons.\n• cons: Agrega un elemento al inicio de una lista existente (cons elemento lista).\n• list: Agrupa los argumentos dados en una nueva lista (list 1 2 3) → '(1 2 3).\n\n(print (cons 5 '(10 20)) )    ; (5 10 20) -> construye una nueva celda\n\n(print (list 1 2 3) )  ; '(1 2 3)\n\nCada celda consta de dos punteros:\n• car (Contents of Address part of Register / Cabeza): Primer elemento.\n• cdr (Contents of Decrement part of Register / Cola): Resto de la lista.\nLista '(10 20 30):"},{"s":"Guía Lisp p. 5","u":2,"t":"","x":"[ car: 10 | cdr: ---> [ car: 20 | cdr: ---> [ car: 30 | cdr: NIL ] ] ]\n\n(print (car '(10 20 30)) )    ; 10  (sinónimo: first)\n(print (cdr '(10 20 30)) )    ; (20 30) (sinónimo: rest)\nPredicados de lista y paridad:\n• null: Devuelve T si el argumento es la lista vacía () o NIL, y NIL en caso contrario.\nEsencial para comprobar el caso base de una recursión.\n• evenp / oddp: Devuelven T si un entero es par o impar, respectivamente.\n\n3. Los 5 Pilares del Paradigma Funcional en LISP\n\nPilar 1: Transparencia Referencial y Funciones Puras\nUna función bajo el paradigma funcional carece de efectos laterales y satisface la propiedad\nde que, ante los mismos argumentos, siempre genera la misma salida. Esto permite sustituir\ncualquier llamada por su valor sin alterar el comportamiento global.\n;; Impuro: depende y muta un estado externo\n(defvar *acumulador* 0)\n(defun acumular-impuro (x)\n  (setf *acumulador* (+ *acumulador* x)))"},{"s":"Guía Lisp p. 5","u":2,"t":"","x":";; Puro: determinista y sin efectos secundarios\n(defun sumar-puro (a b)\n  (+ a b))\n\n(print (sumar-puro 2 3) )\n\nPilar 2: Ausencia de Estado Mutable y Recursividad\nEn el modelo puramente funcional no se emplean celdas de memoria reasignables (x = x +\n1) ni bucles de control de flujo imperativo (for, while). El control de flujo se modela mediante\nrecursividad pura, avanzando sobre la lista con cdr y reduciendo el problema hasta un caso\nbase.\n\nPatrón con Acumulador (Recursión de Cola / Helper): Al devolver pares o valores\ndependientes de un índice sin mutar contadores, se emplea un parámetro auxiliar acumulado:"},{"s":"Guía Lisp p. 6","u":2,"t":"","x":";; Retorna el primer valor par y el índice (1-based) donde se encontró\n(defun primer-par-pos (lista &optional (pos 1))\n  (cond\n    ((null lista) nil)\n    ((evenp (car lista)) (list (car lista) pos))\n    (t (primer-par-pos (cdr lista) (+ pos 1)))))\n\n;; (primer-par-pos '(1 3 8 7)) -> (8 3)\n(print (primer-par-pos '(1 3 8 7)))\n\nExplicación:\n• (cond ...): Inicia la estructura de control de condiciones.\n• ((null lista) nil): Caso base 1. Si recorremos toda la lista y se queda vacía (nil) sin\nhaber encontrado ningún número par, la función se rinde y devuelve nil.\n• ((evenp (car lista)) (list (car lista) pos)): Caso de éxito. Evaluamos el primer\nelemento actual (car lista). Si es par, la función se detiene inmediatamente y construye\nuna lista de dos elementos: el número par encontrado y la posición actual (pos).\n• (t (primer-par-pos (cdr lista) (+ pos 1))): Caso recursivo. Si el número es impar,\navanzamos al resto de la lista (cdr lista) y le sumamos 1 al contador (+ pos 1) para la\nsiguiente llamada."},{"s":"Guía Lisp p. 6","u":2,"t":"","x":"Pilar 3: Funciones como Ciudadanos de Primera Clase y Orden Superior\nLas funciones pueden asignarse a variables, pasarse como argumentos y devolverse como\nvalores de retorno. Common LISP diferencia el espacio de nombres de funciones y variables,\npor lo que para referenciar un objeto función se utiliza la forma especial #' (lectura de la celda\nde función):\n• funcall: Invoca una función recibiendo sus argumentos de manera explícita.\n• apply: Invoca una función pasando sus argumentos contenidos en una lista.\n\n(defun aplicar-operacion (fn a b)\n  (funcall fn a b))\n\n(print (aplicar-operacion #'+ 10 5) )   ; 15\n(print (aplicar-operacion #'* 10 5) )   ; 50\n(print (apply #'+ '(1 2 3 4 5))         )   ; 15\n\nMapeo y Transformación (mapcar, reduce y lambdas):\n\n• mapcar: Toma una función y una lista. Aplica esa función a cada elemento uno por\nuno y genera una nueva lista con los resultados.\n• reduce: Toma una función binaria (que acepta dos argumentos) y una lista. Combina\ntodos los elementos de la lista aplicando esa función de manera acumulativa hasta\nreducir la lista a un único valor."},{"s":"Guía Lisp p. 7","u":2,"t":"","x":";; mapcar aplica una función a cada elemento (equivalente a map)\n(print (mapcar (lambda (x) (* x x)) '(1 2 3 4)) ) ; '(1 4 9 16)\n\n;; reduce combina pares sucesivos usando un operador binario\n(print (reduce #'+ '(1 4 9 16)) )\n\nPilar 4: Composición Funcional\nLos programas complejos se diseñan encadenando transformaciones atómicas: la salida de\n𝑓1 alimenta directamente a 𝑓2 sin almacenar estructuras temporales en variables mutables\nintermedias.\n;; Elevar al cuadrado los números y sumar el resultado (composición directa)\n(defun suma-cuadrados (lista)\n  (reduce #'+ (mapcar (lambda (x) (* x x)) lista)))\n\n;; (suma-cuadrados '(2 3 4)) -> 4 + 9 + 16 = 29\n(print (suma-cuadrados '(2 3 4)) )\n\nPilar 5: Polimorfismo y Abstracción\nLISP posee tipado dinámico y funciones paramétricamente polimórficas respecto a\nestructuras. Operaciones estructurales como car, cdr o funciones recursivas que no ejecutan\naritmética sobre los elementos pueden operar sobre listas de números, símbolos, cadenas u\notras sublistas sin restricción de tipo.\n;; Definición: extrae los primeros N elementos de cualquier lista (sin importar el tipo de datos)\n(defun tomar-n (n lista)\n  (cond\n    ((or (\u003c= n 0) (null lista)) nil)                      ; Caso base: n agotado o lista vacía\n    (t (cons (car lista) (tomar-n (- n 1) (cdr lista)))))); Construye lista con cabeza y recursión"},{"s":"Guía Lisp p. 7","u":2,"t":"","x":";; Ejecución e impresión en pantalla con diferentes tipos de datos\n(print \"=== Pilar 5: Polimorfismo Estructural ===\")\n(print (tomar-n 2 '(10 20 30 40)))                        ; Lista de enteros -> Salida: (10 20)\n(print (tomar-n 2 '(\"alfa\" \"beta\" \"gamma\")))              ; Lista de cadenas -> Salida: (\"alfa\" \"beta\")\n(print (tomar-n 2 '((1 2) (3 4) (5 6))))                  ; Lista de sublistas/tuplas -> Salida: ((1 2) (3 4))"},{"s":"Guía Lisp p. 8","u":2,"t":"","x":"4. Tabla de Equivalencias: Imperativo vs. Declarativo/Funcional\n\nConcepto\nEnfoque Imperativo (C /\nJava)\nEnfoque Funcional (Common\nLISP)\nFlujo de Ejecución\nSentencias secuenciales for,\nwhile\nEvaluación de expresiones\nrecursivas\nVariables\nCeldas de memoria mutables\n(i++)\nLigaduras léxicas inmutables\n(let, argumentos)\nFunciones\nSubrutinas con posibles\nefectos colaterales\nFunciones puras (caja negra\nmatemática)\nIteración sobre\ncolecciones\nIndexación por arreglos\narray[i]\nProcesamiento de cabezas y\ncolas (car / cdr)\nTransformación en\nlote\nBucles con acumuladores\nmanuales\nmapcar y reduce sobre listas"},{"s":"Resumen clase UD2 p. 1","u":2,"t":"","x":"Paradigmas de la Programación  ·  UD2  ·  El paradigma funcional\n1\nPARADIGMAS DE LA PROGRAMACIÓN · UNIDAD 2\nEl paradigma funcional\nResumen de la clase para preparar el examen\nElaborado a partir de la clase grabada de la UD2, el Capítulo 2. El paradigma funcional del temario y la Guía de Common Lisp del\naula virtual. Las marcas min. 09:42 indican en qué minuto del vídeo se explica cada tema.\nSi solo tienes 5 minutos: lo esencial\n1. Nace del cálculo lambda (λ-cálculo) de Alonzo Church, 1934. Programar es evaluar expresiones (funciones\nmatemáticas), no ejecutar órdenes paso a paso.\n2. Es declarativo: describe qué se quiere obtener. El procedimental/imperativo describe cómo (modelo de von\nNeumann).\n3. Transparencia referencial: con la misma entrada, siempre la misma salida; no hay efectos laterales. Es la base\nde todo lo demás.\n4. Composición funcional: el programa es una cadena de funciones; la salida de una es la entrada de otra:\ng(f(x)).\n5. Funciones de orden superior (funciones como objetos de primera clase): se pasan como argumento y se\ndevuelven como resultado.\n6. No existe el estado: ni asignaciones destructivas (a ← b) ni bucles (for, while). Se itera con recursividad:\ncaso base + caso recursivo.\n7. Polimorfismo: de sobrecarga, dinámico (de inclusión) y paramétrico (genericidad). El paramétrico es el más\nnatural en programación funcional.\n8. Evaluación ansiosa (llamada por valor) frente a diferida o perezosa (llamada por necesidad). La diferida\npermite trabajar con estructuras infinitas."},{"s":"Resumen clase UD2 p. 1","u":2,"t":"","x":"9. Las mónadas (Haskell) encapsulan lo procedimental, como la E/S o el estado, sin perder la pureza.\n10. Ventajas: simplicidad, razonamiento formal, concisión (10 a 1), abstracción y paralelismo. Inconvenientes:\npoco intuitivo, menos eficiente (de 3 a 5 veces más lento) y poco apropiado para gran escala.\n1 Origen y enfoque del paradigma\nOrígenes min. 01:52\nEs uno de los paradigmas más antiguos y fundamentales de la informática. Sus orígenes teóricos son el cálculo\nlambda, un modelo matemático de computación que Alonzo Church introdujo en 1934 para sus estudios sobre\ncomputabilidad. Su objetivo es una programación expresiva y matemáticamente elegante, en la que no haga falta\ndescribir paso a paso la secuencia de computación: se basa en la evaluación de expresiones en lugar de en la\nejecución de comandos.\nEspecificación procedimental y declarativa de una función\nUna misma función se puede especificar de dos formas (pregunta de autocomprobación del tema):\n• Declarativa (matemática): un conjunto de transformaciones disjuntas (condición → expresión) sin orden de\nejecución. Ejemplo: par(x) = { resto(x,2) == 0 → true ; resto(x,2) != 0 → false }\n• Procedimental: se indica el orden en que se evalúa. Ejemplo: par(x) = if ((x - (x//2)*2) == 0) then true\nelse false. Ese orden impuesto se llama sobrespecificación.\n• Diferencia clave: si se especifica o no de forma explícita la secuencia de ejecución. Common Lisp admite ambos\nestilos."},{"s":"Resumen clase UD2 p. 2","u":2,"t":"","x":"Paradigmas de la Programación  ·  UD2  ·  El paradigma funcional\n2\nProcedimental frente a declarativo: resumen\nProcedimental (imperativo)\nDeclarativo (funcional)\nPregunta que\nresponde\n¿Cómo resolver el problema?\n¿Qué se quiere conseguir?\nModelo\nMáquina de von Neumann: un procesador y\nacceso a memoria\nFunción matemática y composición de\nfunciones\nControl\nEl programador fija la secuencia: if, while,\nfor\nSin orden explícito: transformaciones que se\nencadenan\nMemoria\nVariables que se actualizan constantemente\n(celdas modificables)\nValores que no se modifican\nHistoria\nDominó al principio porque aprovechaba el\nhardware escaso de la época\nPedía más hardware. Hoy, con multinúcleo y\nmucha memoria, se está retomando\n2 Las características (pilares) del paradigma\nOjo con la numeración\nEn clase y en la guía de Lisp se habla de 5 pilares, y el libro enumera 6 características porque separa el\npolimorfismo de la evaluación diferida. Los conceptos son los mismos. Apréndete los seis: transparencia\nreferencial · composición funcional · orden superior · sin estado (recursividad) · polimorfismo · evaluación\ndiferida.\n2.1 Transparencia referencial min. 09:42\nUna función tiene transparencia referencial si se comporta como una función matemática, como una caja negra: si\nrecibe el mismo valor de entrada, siempre produce el mismo valor de salida (es determinista). Además, el resultado\nse devuelve solo a través del nombre de la función, no mediante alguno de sus argumentos.\nSe pierde cuando hay efectos laterales (también llamados efectos de lado o colaterales), por ejemplo al:"},{"s":"Resumen clase UD2 p. 2","u":2,"t":"","x":"• modificar variables globales dentro de la función;\n• modificar argumentos pasados por referencia, como void cuadrado(int x, int &y);\n• usar variables static que conservan su valor entre llamadas: fun(3) devuelve 8, luego 10 y luego 12;\n• hacer entrada/salida o consultar el hardware o el estado del sistema.\nEjemplo del libro y de la clase (C++): la misma expresión da resultados distintos\nint sw;                       // variable global\nint fun(int n) {\n    int v;\n    if (sw) v = n; else v = n * n;\n    sw = !sw;                 // efecto lateral: cambia la global\n    return v;\n}\nint main() {\n    sw = 0;\n    cout \u003c\u003c fun(2) + fun(3) \u003c\u003c endl;   // 11\n    cout \u003c\u003c fun(3) + fun(2) \u003c\u003c endl;   // 7  -> ¡la suma deja de ser conmutativa!\n}\nProblemas de los efectos laterales: la función deja de devolver siempre lo mismo y los errores son difíciles de\ndepurar. Por qué importa la transparencia: permite sustituir iguales por iguales (razonamiento ecuacional), es\nindispensable para la composición de funciones y facilita verificar la corrección de los programas."},{"s":"Resumen clase UD2 p. 3","u":2,"t":"","x":"Paradigmas de la Programación  ·  UD2  ·  El paradigma funcional\n3\nEn Lisp (guía)\n;; Impura: depende de un estado externo y lo modifica\n(defvar *acumulador* 0)\n(defun acumular-impuro (x)\n  (setf *acumulador* (+ *acumulador* x)))\n;; Pura: misma entrada -> misma salida, sin efectos laterales\n(defun sumar-puro (a b)\n  (+ a b))\n2.2 Composición funcional min. 14:26\nEl programa no se ve como una lista de tareas, sino como una función compuesta de otras más simples: el resultado\nde una función es el argumento de entrada de la siguiente. Si y = f(x) y z = g(y), entonces z = g(f(x)).\nRequisito: transparencia referencial.\nEjemplo de clase: dada una lista, una función selecciona los pares y su resultado pasa a otra que los suma. Es la\nforma típica de manipular listas (ordenar, filtrar, operar sobre cada elemento).\nEn Lisp (guía)\n;; Elevar al cuadrado y sumar: la salida de mapcar alimenta a reduce\n(defun suma-cuadrados (lista)\n  (reduce #'+ (mapcar (lambda (x) (* x x)) lista)))\n(print (suma-cuadrados '(2 3 4)))   ; 4 + 9 + 16 = 29\nEn Hope (libro)\ndec sumarnumeros : num # num -> num;\n--- sumarnumeros(x, y) \u003c= suma(cuadrado(mayor(x, y)));\n! sumarnumeros(12, 5): mayor = 12, cuadrado = 144, suma 1+2+...+144 = 10440\n2.3 Funciones de orden superior (objetos de primera clase) min. 16:23\n• Las funciones se tratan como cualquier otro dato: se pasan como parámetros, se devuelven como resultado, se\nasignan y se mezclan con otros datos.\n• Una función de primer orden no recibe ni devuelve funciones. Una función de orden superior sí (se llama"},{"s":"Resumen clase UD2 p. 3","u":2,"t":"","x":"también de primera clase o funcional).\n• En C se simula con punteros a función. En los lenguajes funcionales es nativo y da un código reutilizable y\nabstracto. Está muy ligado a la composición.\nEn Hope (libro)\ndec calcularrec : num # num # (num # num -> num) -> num;\n--- calcularrec(x, y, f) \u003c= f(x, y);\n! calcularrec(3, 4, area) = 12      calcularrec(3, 4, perimetro) = 14\nEn Lisp (guía)\n(defun aplicar-operacion (fn a b)\n  (funcall fn a b))                              ; llama a la función recibida\n(print (aplicar-operacion #'+ 10 5))             ; 15\n(print (apply #'+ '(1 2 3 4 5)))                 ; 15  (argumentos en una lista)\n(print (mapcar (lambda (x) (* x x)) '(1 2 3 4))) ; (1 4 9 16)  aplica a cada elemento\n(print (reduce #'+ '(1 4 9 16)))                 ; 30  combina hasta un solo valor\nPregunta trampa\n¿Es válido usar un puntero en el paradigma funcional? No, porque un puntero incorpora el concepto de estado de\nmemoria, que en este paradigma no existe."},{"s":"Resumen clase UD2 p. 4","u":2,"t":"","x":"Paradigmas de la Programación  ·  UD2  ·  El paradigma funcional\n4\n2.4 No existe el estado: recursividad en lugar de bucles min. 18:11\nNo existe la celda de memoria modificable. Los resultados intermedios se guardan como valores locales nuevos y el\nflujo siempre avanza. En consecuencia:\n• no hay asignaciones destructivas: a ← b, x = x + 1, i++;\n• no hay procesos iterativos (for, while, do), porque necesitan mutar una variable de control y un acumulador.\nLa solución es la recursividad min. 20:00: la función se llama a sí misma con un problema más pequeño (caso general\no recursivo) hasta llegar a un valor conocido que la detiene (caso base). Sin caso base, la recursión sería infinita.\nFactorial: iterativo frente a recursivo\n// Imperativo (C++)\nlong factorial(int x) {\n    long total = 1;\n    while (x > 0) {     // bucle\n        total *= x;     // asignación destructiva\n        x--;            // mutación\n    }\n    return total;\n}\n;; Funcional (Lisp)\n(defun factorial (n)\n  (if (\u003c= n 0)\n      1                           ; caso base\n      (* n (factorial (- n 1))))) ; recursivo\n;; En Hope (libro):\n;; factorial(x) \u003c= if x =\u003c 0 then 1\n;;                 else x * factorial(x-1);\nPatrón con acumulador (guía): el contador viaja como parámetro opcional\n;; Primer número par y su posición (desde 1), sin mutar ningún contador\n(defun primer-par-pos (lista &optional (pos 1))\n  (cond\n    ((null lista) nil)                            ; caso base: no hay pares\n    ((evenp (car lista)) (list (car lista) pos))  ; éxito: (valor posición)"},{"s":"Resumen clase UD2 p. 4","u":2,"t":"","x":"(t (primer-par-pos (cdr lista) (+ pos 1)))))  ; recursión sobre la cola\n(print (primer-par-pos '(1 3 8 7)))   ; (8 3)\n2.5 Polimorfismo min. 22:45\nEs la capacidad de una función u operador de trabajar con distintos tipos de datos. Los lenguajes monomórficos,\ncomo Pascal, asignan un único tipo a cada valor. Hay tres tipos de polimorfismo:\nTipo\nIdea\nEjemplo\nSobrecarga (ad hoc,\nStrachey)\nMismo nombre, varias versiones según el número\no el tipo de los argumentos\nimprimir(int), imprimir(char),\nimprimir(int, float)\nDinámico o de inclusión\nEl método se decide en ejecución según la clase\ndel objeto (jerarquías de clases)\nEmpleado es subclase de Persona y se\nusa donde se espera una Persona\nParamétrico o genericidad\nUna sola definición (plantilla) que sirve para\ncualquier tipo\ntemplate \u003cclass T> void\nimprimir(T x). En Hope, con alpha\nEl polimorfismo paramétrico es natural en el paradigma funcional y resulta más forzado en el procedimental.\nEjemplo de clase: una función que trabaja con listas sirve para listas de enteros, de decimales o de palabras.\nEn Lisp (guía)\n(defun tomar-n (n lista)                      ; primeros n elementos de CUALQUIER lista\n  (cond\n    ((or (\u003c= n 0) (null lista)) nil)\n    (t (cons (car lista) (tomar-n (- n 1) (cdr lista))))))\n(print (tomar-n 2 '(10 20 30 40)))            ; (10 20)\n(print (tomar-n 2 '(\"alfa\" \"beta\" \"gamma\")))  ; (\"alfa\" \"beta\")"},{"s":"Resumen clase UD2 p. 5","u":2,"t":"","x":"Paradigmas de la Programación  ·  UD2  ·  El paradigma funcional\n5\n2.6 Evaluación ansiosa frente a diferida min. 24:23\nAnsiosa (eager)\nDiferida o perezosa (lazy)\nCuándo evalúa los\nargumentos\nAntes de llamar a la función\nSolo cuando el cuerpo los necesita\nTipo de llamada\nPor valor (call by value)\nPor necesidad (call by need)\nOrden\nEvaluación de 1.er orden\nEvaluación de 2.º orden\nVentaja\nFácil de implementar, eficiente y rápida\nPermite estructuras infinitas y separa el control\ndel cálculo\nInconveniente\nEvalúa argumentos que quizá no se usen\nImplementación más cara (pasa expresiones sin\nevaluar)\nLenguajes\nLisp, ML y la mayoría de los imperativos\nHaskell, Lazy ML y Hope (una de sus\nimplementaciones)\nLista infinita (Hope, libro). En clase: «una lista infinita de pares de la que solo uso los 3 primeros»\ndec lista : num -> list(num);\n--- lista(n) \u003c= n :: lista(n + 1);          ! lista infinita: n, n+1, n+2, ...\ndec primerimpar : list(num) -> num;\n--- primerimpar(nil)    \u003c= 0;\n--- primerimpar(x :: l) \u003c= if x mod 2 /= 0 then x else primerimpar(l);\n! primerimpar(lista(8)):  ansiosa -> intenta construir la lista entera: NO TERMINA\n!                         diferida -> 8 es par, pide el siguiente -> 9\nPor qué la evaluación diferida encaja mal con el paradigma procedimental: el programador pierde el control del\norden de evaluación y, si hay efectos laterales, el resultado cambia. Con cuadrado(getint(f)) y un fichero que\ncontiene 2, 5, …, la evaluación ansiosa da 2*2 = 4, pero la diferida da getint(f) * getint(f) = 2*5 = 10."},{"s":"Resumen clase UD2 p. 5","u":2,"t":"","x":"3 Mónadas\nEl problema de la entrada/salida min. 26:36\nInteractuar con la consola, el teclado o la pantalla produce efectos laterales. Una mónada es un elemento\nencapsulado que proporciona características procedimentales sin perder los beneficios del paradigma funcional:\nla transparencia referencial, el orden superior y la evaluación diferida. Así el programa sigue siendo puro y además\npermite un desarrollo estructurado y secuencial.\n• Aparecen en Haskell. Se usan para la E/S (la mónada IO), el estado mutable (por ejemplo, en un parser) y las\nexcepciones.\n• Su estructura es un constructor de tipo unario m y dos funciones: return :: a -> m a, que mete un valor en la\nmónada, y >>= :: m a -> (a -> m b) -> m b (bind), que encadena acciones pasando el resultado de una a la\nsiguiente. Deben cumplir las 3 leyes monádicas.\n• Son necesarias en Haskell porque, con evaluación diferida, no se sabe en qué orden se ejecutarán las llamadas:\n>>= impone la secuencia.\nMónada IO en Haskell (libro)\nexIO :: IO ()\nexIO = getChar    >>= \\c1 ->\n       getChar    >>= \\c2 ->\n       putChar c2 >>= \\_  ->\n       putChar c1               -- lee dos caracteres y los escribe en orden inverso"},{"s":"Resumen clase UD2 p. 6","u":2,"t":"","x":"Paradigmas de la Programación  ·  UD2  ·  El paradigma funcional\n6\nPregunta trampa\n¿Son las mónadas una característica básica de la programación funcional? No. Son elementos encapsulados que\nañaden características procedimentales, no uno de los pilares del paradigma.\n4 Programa funcional, tipos de datos y lenguajes\nUn programa funcional es «un conjunto compuesto de funciones que juntas definen un objetivo específico de\naplicación». Se resume en la ecuación Funciones + Estructuras de datos = Programa.\n• Elementos fundamentales: las funciones, la recursividad (iteración con asignación no destructiva) y las listas.\n• Tipos de datos básicos: átomos (28, 43.76, T, NIL, 'h'), identificadores (nombres de variables y funciones) y\nlistas. Una cadena es una lista de caracteres: \"hola\" = ('h' 'o' 'l' 'a'). Se accede a la cabeza (primer\nelemento) y a la cola (el resto).\n• Currificación: una función de n argumentos se trata como una cadena de n funciones de un argumento: f x y z\n= (((f x) y) z).\n• Los lenguajes funcionales son aplicativos (aplican funciones de forma progresiva). Los primeros eran\ninterpretados; hoy suelen ser compilados.\nLenguajes vistos en la asignatura min. 29:00\nLenguaje\nLo que hay que saber\nLisp\n1959, John McCarthy, MIT (List Processing). Es el primero que implementa la programación funcional, pero\nes híbrido (funcional y procedimental): no nació funcional y el paradigma se le añadió después. Tiene\nsetq/setf, loop, arrays y variables globales. No tiene evaluación diferida. Su estándar es Common Lisp."},{"s":"Resumen clase UD2 p. 6","u":2,"t":"","x":"Hope\nNació para el paradigma funcional, en un entorno académico. Tiene pocas aplicaciones reales y no hay\nintérpretes en línea: hay que instalar un
