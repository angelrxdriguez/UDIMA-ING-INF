 naturaleza declarativa, una regla nueva solo añade otra vía de deducción sin romper las demás; aun así, tras cambios importantes hay que revalidar.","src":"S4 diap. 6; Unidad 4 p. 7","imp":2,"ficha":"ud4-021"},{"id":"p4-015","ud":4,"tema":"Ingeniería del conocimiento","q":"¿Qué cláusula Prolog traduce la fórmula ∀L: no_enciende(L) ∧ ¬enchufada(L) → causa(L, desenchufada)?","ops":["`causa(L, desenchufada) :- no_enciende(L), \\+ enchufada(L).`","`no_enciende(L), \\+ enchufada(L) :- causa(L, desenchufada).`","`causa(L, desenchufada) :- no_enciende(L); \\+ enchufada(L).`","`causa(L, desenchufada) :- no_enciende(L), enchufada(L).`"],"why":"La conclusión (lo que va tras →) pasa a la cabeza, a la izquierda de :-. El ∧ se escribe con coma (el ; sería OR) y la negación ¬ con \\+, la negación como fallo. Es la traducción uno a uno de la diapositiva.","src":"S4 diap. 7; Unidad 4 p. 5–6","imp":1,"ficha":"ud4-022"},{"id":"p4-016","ud":4,"tema":"Ingeniería del conocimiento","q":"La unidad menciona GUPU dentro de las metodologías de ingeniería del conocimiento. ¿Qué es?","ops":["Un entorno educativo para aprender Prolog, con feedback automático y pruebas unitarias","Una metodología europea estándar de los años 90 que descompone el conocimiento en modelos","Un solver que calcula los modelos estables de un programa lógico combinatorio","Un lenguaje lógico para consultas recursivas sobre bases de datos deductivas"],"why":"GUPU (inicios de los 2000) guía al estudiante de Prolog por todas las fases, con pruebas unitarias, feedback inmediato y depuración declarativa. La metodología europea de los 90 es CommonKADS; el solver sería clingo o DLV (ASP).","src":"S4 diap. 6; Unidad 4 p. 7–8","imp":1,"ficha":"ud4-023"},{"id":"p4-017","ud":4,"tema":"Ingeniería del conocimiento","q":"Con esta base de conocimiento, ¿qué responde `?- causa(lamp2, C).`?","ops":["`C = electrica`","`C = bombilla`","`C = desenchufada`","`false`"],"why":"lamp2 está enchufada, así que la 1.ª regla falla. No existe fundida(lamp2): la 2.ª falla y \\+ fundida(lamp2) tiene éxito (mundo cerrado), de modo que la 3.ª regla da C = electrica.","src":"Unidad 4 p. 6–7","imp":1,"code":"no_enciende(lamp1).\nno_enciende(lamp2).\nno_enciende(lamp3).\nenchufada(lamp1).\nenchufada(lamp2).\nfundida(lamp1).\ncausa(L, desenchufada) :-\n    no_enciende(L), \\+ enchufada(L).\ncausa(L, bombilla) :- no_enciende(L),\n    enchufada(L), fundida(L).\ncausa(L, electrica) :- no_enciende(L),\n    enchufada(L), \\+ fundida(L).","ficha":"ud4-036"},{"id":"p4-018","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿De dónde viene el nombre «Prolog» y cuándo se desarrolló el lenguaje?","ops":["De «Programmation en Logique»; a inicios de los 70","De «Programming Logic»; a finales de los años 50","De «Programmation en Logique»; a mediados de los 60","De «Procedural Logic»; a comienzos de los años 80"],"why":"Prolog viene del francés Programmation en Logique («programación en lógica»). Lo desarrollaron Alain Colmerauer, Robert Kowalski y otros a comienzos de los años 70.","src":"Unidad 4 p. 9","imp":1,"ficha":"ud4-024"},{"id":"p4-019","ud":4,"tema":"Prolog: términos y sintaxis","q":"En la cláusula siguiente, ¿qué tipo de término es cada argumento?","ops":["`Pedro` es una variable y `maria` es un átomo","`Pedro` y `maria` son dos átomos: dos nombres de persona","`Pedro` es un átomo y `maria` es una variable","`Pedro` y `maria` son dos variables de la cláusula"],"why":"En Prolog todo lo que empieza por mayúscula (o por guion bajo) es una variable, aunque parezca un nombre propio; lo que empieza por minúscula es un átomo. Para que Pedro fuera un átomo habría que escribir pedro o 'Pedro'.","src":"S4 diap. 8; Unidad 4 p. 9","imp":1,"code":"quiere(Pedro, maria).","ficha":"ud4-028"},{"id":"p4-020","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Cuál de estos términos de Prolog es un **átomo**?","ops":["`'BuenosDias'`","`Persona`","`_Resultado`","`punto(3,5)`"],"why":"Un átomo empieza por minúscula o va entre comillas simples, como 'BuenosDias' (ejemplo de la unidad). Persona y _Resultado son variables (mayúscula o guion bajo) y punto(3,5) es una estructura con functor.","src":"S4 diap. 8; Unidad 4 p. 9","imp":1,"ficha":"ud4-027"},{"id":"p4-021","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué caracteriza a la variable anónima `_` de Prolog?","ops":["Su valor no interesa, y cada `_` es una variable distinta de las demás","Todas las `_` de una misma cláusula toman obligatoriamente el mismo valor","Es un átomo especial reservado para los argumentos que van vacíos","Obliga a que ese argumento tenga valor antes de lanzar la consulta"],"why":"Se usa _ cuando el valor no interesa, como en tiene_hijos(X) :- padre(X, _). Cada aparición es independiente: padre(_, _) no exige que los dos argumentos sean iguales.","src":"Unidad 4 p. 9","imp":2,"ficha":"ud4-031"},{"id":"p4-022","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué indica el `/2` de la notación `progenitor/2`?","ops":["La aridad: el predicado tiene dos argumentos","Que el predicado está definido por dos cláusulas","Que la consulta admite dos soluciones como máximo","Que el segundo argumento es el de salida"],"why":"Nombre/N identifica un predicado por su nombre y su aridad, es decir, su número de argumentos. progenitor/2 puede tener tantas cláusulas (hechos o reglas) como se quiera.","src":"Unidad 4 p. 10","imp":2,"ficha":"ud4-032"},{"id":"p4-023","ud":4,"tema":"Prolog: términos y sintaxis","q":"En esta regla, ¿qué papel cumple la variable `Y`?","ops":["Es la variable puente: conecta las dos premisas del cuerpo","Es el valor que Prolog muestra como respuesta a la consulta","Es una variable anónima, porque no aparece en la cabeza","Es un átomo que debe existir como hecho en la base"],"why":"Y aparece en las dos premisas: Prolog busca un Y que sea hijo de X y progenitor de Z, y así enlaza la relación generacional. No es anónima (esa es _) y, como no está en la cabeza, no forma parte de la respuesta.","src":"S4 diap. 11; Unidad 4 p. 10","imp":1,"code":"abuelo(X, Z) :-\n    progenitor(X, Y), progenitor(Y, Z).","ficha":"ud4-033"},{"id":"p4-024","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Qué distingue un hecho de una regla en Prolog?","ops":["El hecho no tiene cuerpo: es una afirmación incondicional","El hecho no termina en punto y la regla sí, tras su cuerpo","El hecho solo admite variables y la regla solo átomos","El hecho se escribe tras `?-` y la regla tras `:-`"],"why":"Un hecho, como ingeniero(juan)., es una cláusula sin cuerpo; una regla tiene cabeza, :- y un cuerpo con condiciones. Toda cláusula termina en punto, y lo que se escribe tras ?- es una consulta.","src":"Unidad 4 p. 9, 11","imp":1,"ficha":"ud4-025"},{"id":"p4-025","ud":4,"tema":"Prolog: términos y sintaxis","q":"¿Con qué símbolo se expresa la disyunción (OR) en el cuerpo de una regla o en una consulta?","ops":["Con punto y coma: `;`","Con coma: `,`","Con el cuello: `:-`","Con barra vertical: `|`"],"why":"La coma es la conjunción (AND) y el punto y coma, la disyunción (OR). Aun así, suele ser más claro escribir varias cláusulas con la misma cabeza, que funcionan como alternativas. La barra | separa cabeza y cola en las listas.","src":"Unidad 4 p. 11","imp":2,"ficha":"ud4-034"},{"id":"p4-026","ud":4,"tema":"Prolog: operadores","q":"¿Qué responde Prolog a esta consulta?","ops":["`X = 3, Y = 4`","`X = 4, Y = 3`","`false`, porque cada lado tiene una variable distinta","`true`, sin ligar ninguna variable"],"why":"= unifica: mismo functor y aridad, y después argumento a argumento: X toma el valor 3 y la variable Y, el 4. Solo fallaría si los términos fueran incompatibles (otro functor, otra aridad o dos átomos distintos).","src":"Unidad 4 p. 11","imp":1,"code":"?- punto(X, 4) = punto(3, Y).","ficha":"ud4-035"},{"id":"p4-027","ud":4,"tema":"Prolog: operadores","q":"¿Qué responde Prolog a cada una de estas dos consultas?","ops":["`X = 2+3` y `X = 5`","`X = 5` en las dos consultas","`X = 5` y `X = 2+3`","`false` y `X = 5`"],"why":"= no calcula: unifica X con la estructura 2+3, en la que + actúa como functor. is evalúa la expresión de la derecha y liga X con el resultado, 5. Por eso el factorial usa is.","src":"Unidad 4 p. 11; S4 diap. 15","imp":1,"code":"?- X = 2 + 3.\n?- X is 2 + 3.","ficha":"ud4-039"},{"id":"p4-028","ud":4,"tema":"Prolog: operadores","q":"Con esta base, ¿qué responde `?- \\+ listo(pedro).`?","ops":["`true`, porque `listo(pedro)` no se puede demostrar","`false`, porque no hay ningún hecho sobre `pedro`","`false`, porque `\\+` falla cuando su meta falla","Un error, porque `pedro` no aparece en ningún hecho de la base"],"why":"\\+ Meta tiene éxito cuando Meta falla. listo(pedro) exige ingeniero(pedro), que no está en la base; por tanto falla y \\+ listo(pedro) da true. Es la negación como fallo: lo que no se puede demostrar se toma por falso.","src":"Unidad 4 p. 11; Preguntas_1 (EJM0)","imp":1,"code":"ingeniero(juan).\ningeniero(ana).\nlisto(X) :- ingeniero(X).","ficha":"ud4-036"},{"id":"p4-029","ud":4,"tema":"Prolog: operadores","q":"¿Qué hace el corte (`!`) cuando Prolog lo alcanza al resolver una regla?","ops":["Fija las decisiones tomadas hasta ahí e impide el backtracking más allá","Hace fallar la regla en curso y obliga a probar la cláusula siguiente","Niega la meta que le sigue: tiene éxito si esa meta no se puede demostrar","Fuerza la evaluación aritmética de la expresión que aparece a su derecha"],"why":"El corte poda la búsqueda: las alternativas anteriores a ! ya no se exploran. Se usa con cuidado, porque mal colocado hace perder soluciones. Negar una meta es lo que hace \\+, y evaluar una expresión, is.","src":"Unidad 4 p. 11","imp":2,"ficha":"ud4-037"},{"id":"p4-030","ud":4,"tema":"Prolog: operadores","q":"¿Cómo se escribe en Prolog la comparación aritmética «menor o igual que»?","ops":["`X =\u003c Y`","`X \u003c= Y`","`X =:= Y`","`X \\= Y`"],"why":"Los comparadores de la unidad son =:=, =\\=, \u003c, =\u003c, > y >=: en el «menor o igual» el = va delante. \u003c= no está entre ellos; =:= es la igualdad numérica y \\= comprueba que dos términos no unifican.","src":"Unidad 4 p. 11","imp":2,"ficha":"ud4-040"},{"id":"p4-031","ud":4,"tema":"Prolog: operadores","q":"Con esta base, ¿qué responde `?- hermano(beatriz, Y).` pidiendo todas las soluciones?","ops":["`Y = carlos`","`Y = beatriz ; Y = carlos`","`Y = ana`","`false`"],"why":"Z = ana. progenitor(ana, Y) da primero Y = beatriz, pero beatriz \\= beatriz falla y Prolog retrocede; con Y = carlos la condición se cumple. \\= es lo que impide que alguien sea hermano de sí mismo.","src":"Unidad 4 p. 12–13","imp":2,"code":"progenitor(ana, beatriz).\nprogenitor(ana, carlos).\nhermano(X, Y) :- progenitor(Z, X),\n    progenitor(Z, Y), X \\= Y.","ficha":"ud4-041"},{"id":"p4-032","ud":4,"tema":"Prolog: consultas y recursión","q":"Durante la resolución de una consulta, una rama de la búsqueda falla. ¿Qué hace Prolog?","ops":["Retrocede al último punto de decisión válido y prueba la siguiente alternativa","Detiene la consulta y responde `false` sin explorar las demás ramas posibles","Vuelve a empezar la consulta desde el primer hecho de toda la base de conocimiento","Salta a la última cláusula del programa y continúa la búsqueda desde ella"],"why":"Es el backtracking. En ?- abuelo(ana, Z), la rama Y = beatriz falla (Beatriz no tiene hijos); Prolog retrocede, prueba Y = carlos y obtiene Z = elena. Solo responde false cuando se agotan todas las alternativas.","src":"S4 diap. 13–14; Unidad 4 p. 12","imp":1,"ficha":"ud4-042"},{"id":"p4-033","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Qué distingue una consulta de verificación de una de búsqueda en Prolog?","ops":["La de búsqueda lleva variables y Prolog responde con sus valores","La de verificación lleva variables y Prolog responde true o false","La de búsqueda termina en `;` y la de verificación termina en punto","La de verificación consulta hechos y la de búsqueda consulta reglas"],"why":"?- padre(juan, jose). no tiene variables: es de verificación y da true o false. ?- padre(juan, Hijo). tiene una variable: es de búsqueda y Prolog responde Hijo = maria ; Hijo = jose. Las dos terminan en punto.","src":"S4 diap. 10; Unidad 4 p. 17","imp":1,"ficha":"ud4-044"},{"id":"p4-034","ud":4,"tema":"Prolog: consultas y recursión","q":"El intérprete muestra `Hijo = maria` y queda esperando. ¿Qué ocurre si el usuario pulsa `;`?","ops":["Prolog busca la siguiente solución mediante backtracking","Prolog termina la consulta y descarta el resto de soluciones","Prolog niega la última respuesta y muestra `false`","Prolog guarda `Hijo = maria` como hecho nuevo en la base"],"why":"El punto y coma es el «gatillo manual» del backtracking: obliga a buscar otra solución (aquí, Hijo = jose). ENTER termina. Dentro de un programa, findall/3 o bagof/3 recogen todas las soluciones.","src":"S4 diap. 10; Unidad 4 p. 13","imp":2,"ficha":"ud4-045"},{"id":"p4-035","ud":4,"tema":"Prolog: consultas y recursión","q":"En Prolog no hay bucles. ¿Cómo se repite un cálculo?","ops":["Con recursión: una inmersión recursiva hasta llegar a un caso base","Con el corte `!`, que vuelve a ejecutar la regla desde el principio","Con el punto y coma `;`, que repite la meta escrita justo antes","Con `is`, que reasigna la variable en cada vuelta del ciclo"],"why":"Las diapositivas lo resumen así: todo ciclo es una inmersión recursiva hacia un caso base definitivo, como factorial(0, 1). Una variable ligada no se reasigna: cada llamada usa variables nuevas (N1, F1).","src":"S4 diap. 16","imp":1,"ficha":"ud4-046"},{"id":"p4-036","ud":4,"tema":"Prolog: consultas y recursión","q":"¿Qué objetivo debe cerrar la regla para que `?- factorial(3, F).` responda `F = 6`?","ops":["`F is F1 * N`","`F = F1 * N`","`F is N1 * F1`","`F1 is F * N`"],"why":"F se obtiene evaluando con is el factorial de N − 1 (F1) por N. Con = quedaría la estructura sin calcular (1*1*2*3); con N1 * F1 todo daría 0, y F1 is F * N da error porque F aún no tiene valor.","src":"S4 diap. 15; ejm3.pl","imp":1,"code":"factorial(0, 1).\nfactorial(N, F) :- N > 0,\n    N1 is N - 1,\n    factorial(N1, F1),\n    ________.","ficha":"ud4-047"},{"id":"p4-037","ud":4,"tema":"Prolog: consultas y recursión","q":"Con esta base, ¿qué soluciones da `?- abuelo(X, elena).` y en qué orden, pulsando `;`?","ops":["`X = ana ; X = david`","`X = david ; X = ana`","`X = ana`","`X = carlos`"],"why":"Prolog recorre progenitor(X, Y) en el orden de los hechos: con (ana, carlos) se cumple progenitor(carlos, elena) y sale X = ana; al retroceder, con (david, carlos) sale X = david. Carlos es el padre de Elena, no su abuelo.","src":"Unidad 4 p. 12–13; S4 diap. 13","imp":1,"code":"progenitor(ana, beatriz).\nprogenitor(ana, carlos).\nprogenitor(carlos, elena).\nprogenitor(david, carlos).\nprogenitor(david, fernando).\nabuelo(X, Z) :-\n    progenitor(X, Y), progenitor(Y, Z).","ficha":"ud4-042"},{"id":"p4-038","ud":4,"tema":"ASP y Datalog","q":"¿A qué tipo de problemas se orienta ASP (Answer Set Programming)?","ops":["A búsquedas combinatorias (a menudo NP-difíciles): planificación, puzzles","A consultas recursivas optimizadas sobre bases de datos deductivas muy grandes","A cálculos numéricos secuenciales con mucha manipulación de estados cambiantes","A la enseñanza guiada de Prolog, con feedback automático y pruebas unitarias"],"why":"ASP (programación por conjuntos de respuestas) resuelve problemas de búsqueda combinatorios: colorear grafos, planificar, configurar sistemas, puzzles. Las consultas recursivas sobre grandes bases de hechos son el terreno de Datalog.","src":"Unidad 4 p. 15","imp":1,"ficha":"ud4-049"},{"id":"p4-039","ud":4,"tema":"ASP y Datalog","q":"¿Cómo obtiene ASP las soluciones de un problema?","ops":["Un solver (clingo, DLV) calcula los modelos estables; cada uno es una solución","Unifica la consulta con la cabeza de las reglas y retrocede cuando una rama falla","Deduce de abajo arriba todos los hechos y después responde a la consulta","Ejecuta las reglas en el orden escrito, como una secuencia de instrucciones"],"why":"ASP se basa en la semántica de modelos estables: el solver calcula los conjuntos de hechos que satisfacen todas las reglas y restricciones. Unificar y retroceder es lo que hace Prolog; deducir de abajo arriba, Datalog.","src":"Unidad 4 p. 15","imp":2,"ficha":"ud4-050"},{"id":"p4-040","ud":4,"tema":"ASP y Datalog","q":"Un programa concluye algo porque falta un hecho; si después se añade ese hecho, la conclusión cambia. ¿Cómo se llama este conocimiento, que ASP puede expresar?","ops":["Conocimiento no monótono","Conocimiento decidible","Conocimiento bidireccional","Conocimiento proposicional"],"why":"En el conocimiento no monótono, añadir información puede retirar conclusiones que se habían sacado por la ausencia de un hecho. ASP lo expresa con negación fuerte y negación por ausencia; sirve para problemas de sentido común con reglas por defecto.","src":"Unidad 4 p. 15","imp":2,"ficha":"ud4-051"},{"id":"p4-041","ud":4,"tema":"ASP y Datalog","q":"Datalog puede verse como un subconjunto de Prolog. ¿Qué restricción tiene en los términos que admite?","ops":["Solo constantes o variables: nada de funciones ni estructuras anidadas","Solo hechos concretos: no admite reglas que lleven variables","Solo números: no admite átomos simbólicos como `juan`","Solo predicados de aridad 1: no admite relaciones entre dos o más términos"],"why":"Al no admitir funciones ni estructuras anidadas, el dominio de valores es finito y queda acotado por los hechos base. Sí admite reglas con variables, incluso recursivas (alcanzabilidad, jerarquías).","src":"Unidad 4 p. 15","imp":2,"ficha":"ud4-053"},{"id":"p4-042","ud":4,"tema":"ASP y Datalog","q":"¿Cómo infieren Prolog y Datalog?","ops":["Prolog, top-down desde la consulta; Datalog, bottom-up deduciendo todos los hechos","Prolog, bottom-up deduciendo todos los hechos; Datalog, top-down desde la consulta","Los dos top-down: parten de la consulta y retroceden cuando una rama falla","Los dos bottom-up: deducen todos los hechos posibles antes de responder"],"why":"Prolog va de la consulta hacia los hechos, con backtracking. Datalog infiere primero todos los hechos derivables (como un cierre transitivo de las reglas) y después responde consultando ese conjunto.","src":"Unidad 4 p. 15–16","imp":1,"ficha":"ud4-054"},{"id":"p4-043","ud":4,"tema":"ASP y Datalog","q":"¿Por qué todo programa Datalog termina, mientras que Prolog puede no terminar?","ops":["Porque en Datalog los términos no crecen: el dominio está acotado por los hechos","Porque Datalog prohíbe las reglas recursivas, que son las que provocan los bucles","Porque Datalog coloca un corte en cada regla para evitar el backtracking","Porque Datalog busca top-down con un límite fijo de profundidad en cada consulta"],"why":"Sin funciones ni estructuras, los términos no crecen indefinidamente y Datalog es decidible; Prolog es Turing-completo y puede no terminar. Datalog sí admite recursión: las consultas recursivas son justo su punto fuerte.","src":"Unidad 4 p. 15–16","imp":2,"ficha":"ud4-056"},{"id":"p4-044","ud":4,"tema":"ASP y Datalog","q":"Se necesitan consultas recursivas optimizadas (alcanzabilidad, jerarquías) sobre una base de hechos enorme y con terminación garantizada. ¿Qué lenguaje lógico encaja mejor?","ops":["Datalog","ASP (Answer Set Programming)","Prolog","Programación lógica con restricciones (CLP)"],"why":"Datalog se orienta a consultas optimizadas sobre grandes bases de hechos, garantiza la terminación y resuelve consultas recursivas que el SQL estándar no expresaba bien. Prolog puede no terminar y ASP genera soluciones a problemas combinatorios.","src":"Unidad 4 p. 16","imp":1,"ficha":"ud4-057"},{"id":"p4-045","ud":4,"tema":"Ejercicios resueltos","q":"En la base de EJM1 no existe el hecho padre(maria, jose), y `?- padre(maria, jose).` responde `false`. ¿Qué principio explica esa respuesta?","ops":["La asunción del mundo cerrado","La negación como fallo escrita con `\\+`","El corte, que detiene la búsqueda","La direccionalidad de la aritmética"],"why":"Para Prolog, lo que no puede demostrarse con los hechos y reglas de la base se considera falso. No hace falta \\+: la consulta no encuentra ningún hecho ni regla que la demuestre y responde false.","src":"S4 diap. 9; Unidad 4 p. 17","imp":1,"ficha":"ud4-058"},{"id":"p4-046","ud":4,"tema":"Ejercicios resueltos","q":"Con la base de EJM0, ¿qué responde `?- listo(X).`?","ops":["`X = juan`","`true`","`false`, porque `X` no es un átomo","`X = ingeniero`"],"why":"Es una consulta de búsqueda: la cabeza listo(X) unifica y ingeniero(X) se satisface con el hecho ingeniero(juan), así que Prolog responde X = juan. true saldría en una consulta sin variables, como ?- listo(juan).","src":"ejm0.pl; S4 diap. 4","imp":1,"code":"ingeniero(juan).\nlisto(X) :- ingeniero(X).","ficha":"ud4-059"},{"id":"p4-047","ud":4,"tema":"Ejercicios resueltos","q":"Con la base de EJM1, ¿qué soluciones da `?- padre(juan, Hijo).` y en qué orden, pulsando `;`?","ops":["`Hijo = maria ; Hijo = jose`","`Hijo = jose ; Hijo = maria`","`Hijo = maria ; Hijo = jose ; Hijo = alberto`","`Hijo = maria`"],"why":"Prolog recorre los hechos en orden y unifica con los que tienen juan como primer argumento: primero padre(juan, maria) y luego padre(juan, jose). Alberto es nieto de Juan, no hijo.","src":"Preguntas_1 (EJM1); S4 diap. 10","imp":1,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).","ficha":"ud4-062"},{"id":"p4-048","ud":4,"tema":"Ejercicios resueltos","q":"Con la base de EJM2, ¿qué pares (Abuelo, Nieto) obtiene `?- abuelo(Abuelo, Nieto).` pulsando `;` hasta agotar las soluciones?","ops":["(juan, alberto), (carlos, maria), (carlos, jose)","(juan, alberto), (carlos, maria), (carlos, jose), (carlos, alberto)","(juan, alberto), (carlos, maria), (carlos, jose), (carlos, elena)","(juan, maria), (juan, jose), (carlos, juan), (carlos, elena)"],"why":"Prolog prueba padre(X, Z) en el orden de los hechos: (juan, maria) enlaza con padre(maria, alberto); José, Alberto y Elena no tienen hijos; (carlos, juan) da María y José. Elena es hija de Carlos y Alberto, su bisnieto.","src":"Preguntas_1 (EJM2); Unidad 4 p. 18–19","imp":1,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y).","ficha":"ud4-066"},{"id":"p4-049","ud":4,"tema":"Ejercicios resueltos","q":"Con la misma base de EJM2, ¿qué responde `?- abuelo(carlos, alberto).`?","ops":["`false`: ningún hijo de Carlos es padre de Alberto","`true`: Carlos es abuelo de María y María es madre de Alberto","`true`: Carlos es padre de Juan y Juan es abuelo de Alberto","Un error: el segundo argumento tendría que ser una variable"],"why":"La regla exige un Z con padre(carlos, Z) y padre(Z, alberto). Los hijos de Carlos son Juan y Elena, y ninguno es padre de Alberto (lo es María): la respuesta es false. Carlos es su bisabuelo.","src":"ejm2.pl; Unidad 4 p. 19","imp":1,"code":"padre(juan, maria).\npadre(juan, jose).\npadre(maria, alberto).\npadre(carlos, juan).\npadre(carlos, elena).\nabuelo(X, Y) :- padre(X, Z), padre(Z, Y).","ficha":"ud4-064"},{"id":"p4-050","ud":4,"tema":"Ejercicios resueltos","q":"En EJM2 se añade el hecho `padre(jose, monica).` ¿Qué más hay que cambiar para que `?- abuelo(A, monica).` responda `A = juan`?","ops":["Nada: la regla abuelo/2 deduce sola los nuevos abuelos","Añadir también el hecho `abuelo(juan, monica).`","Añadir a abuelo/2 una cláusula específica para `monica`","Colocar `padre(jose, monica).` delante de los demás hechos"],"why":"Es la deducción dinámica: la regla vale para cualquier persona, así que con padre(juan, jose) y padre(jose, monica) Prolog deduce abuelo(juan, monica) sin tocar el código. El orden de los hechos solo influye en el orden de las respuestas.","src":"S4 diap. 12; Unidad 4 p. 19","imp":1,"ficha":"ud4-063"},{"id":"p4-051","ud":4,"tema":"Ejercicios resueltos","q":"Al resolver `?- factorial(3, F).` con la definición de EJM3, ¿cuándo y en qué orden se calculan los productos?","ops":["Al volver del caso base: 1·1 = 1, después 1·2 = 2 y al final 2·3 = 6","Al bajar hacia el caso base: 3·2 = 6, después 6·1 = 6 y al final 6·1 = 6","Al bajar hacia el caso base: 3·1 = 3, después 3·2 = 6 y al final 6·1 = 6","Al volver del caso base: 2·3 = 6, después 1·2 = 2 y al final 1·1 = 1"],"why":"F is F1 * N va después de la llamada recursiva, así que no se multiplica nada hasta llegar a factorial(0, 1). Luego, de dentro afuera: N = 1 da 1·1 = 1, N = 2 da 1·2 = 2 y N = 3 da 2·3 = 6.","src":"S4 diap. 16; Unidad 4 p. 19–20","imp":1,"ficha":"ud4-067"},{"id":"p4-052","ud":4,"tema":"Ejercicios resueltos","q":"¿Por qué el factorial de EJM3 no sirve para generar los pares (N, F) con `?- factorial(N, F).`, como haría una relación lógica pura?","ops":["Porque `>` e `is` necesitan que `N` tenga valor: el predicado va de N a F","Porque Prolog no admite consultas que tengan dos variables a la vez","Porque la recursión no termina si el segundo argumento está libre","Porque un predicado recursivo no se puede usar en consultas de búsqueda con variables"],"why":"La aritmética exige variables instanciadas: N > 0 y N1 is N - 1 no pueden evaluarse con N libre. El predicado se vuelve direccional (de N a F), aunque factorial(4, 24) y factorial(5, X) funcionan.","src":"S4 diap. 17; Unidad 4 p. 20–21","imp":1,"ficha":"ud4-069"},{"id":"p4-053","ud":4,"tema":"Conclusión","q":"Según la conclusión de la unidad, ¿cuándo conviene combinar Prolog con módulos imperativos (C, Python)?","ops":["Cuando dominan los cálculos secuenciales y los estados cambiantes","Cuando el conocimiento del dominio se expresa con reglas de diagnóstico","Cuando hay que deducir relaciones implícitas entre los hechos","Cuando hay que justificar cómo se llegó a una conclusión"],"why":"La lógica pura puede no ser lo más eficiente con cálculos secuenciales, mucho estado cambiante o datos enormes: Prolog lleva la lógica de alto nivel y delega lo numérico en C o Python. Las reglas y la explicación son su punto fuerte.","src":"Unidad 4 p. 28","imp":2,"ficha":"ud4-072"},{"id":"p4-054","ud":4,"tema":"Conclusión","q":"¿Por qué la programación lógica interesa hoy para la IA explicable?","ops":["Porque un sistema de reglas puede mostrar la traza de inferencia de su decisión","Porque deduce sus conclusiones a partir de las reglas, sin necesitar ningún hecho","Porque sustituye a las redes neuronales en tareas como el reconocimiento de imágenes","Porque ejecuta los cálculos numéricos más rápido que los lenguajes imperativos"],"why":"Un sistema basado en reglas puede explicar exactamente por qué decidió algo (traza de inferencia), cosa que el deep learning puro no hace con facilidad. No sustituye a las redes: la IA neuro-simbólica las combina con la lógica.","src":"Unidad 4 p. 28","imp":2,"ficha":"ud4-074"},{"id":"p4-055","ud":4,"tema":"Conclusión","q":"¿Qué extensión del paradigma lógico añade la resolución de restricciones aritméticas y se usa en la industria para calendarios, rutas o turnos?","ops":["La programación lógica con restricciones (CLP)","La programación lógica inductiva","La programación lógica probabilística","Datalog extendido con agregados (conteos, mínimos)"],"why":"La CLP extiende Prolog para resolver restricciones aritméticas pesadas (scheduling, asignación de recursos). La programación lógica inductiva aprende reglas a partir de datos y la probabilística maneja la incertidumbre.","src":"Unidad 4 p. 27–28","imp":2,"ficha":"ud4-073"},{"id":"p5-001","ud":5,"tema":"Listas: cabeza/cola","q":"¿Qué responde Prolog a esta consulta?","ops":["`H = a`, `T = []`","`H = a` y `T` queda sin valor","`false`: con un único elemento no hay cola","`H = []`, `T = a`"],"why":"La cola es siempre una lista: la del resto de elementos. Con un solo elemento, el resto es la lista vacía, así que T = []. Solo fallaría con [], que no tiene cabeza.","src":"S5 diap. 4","imp":1,"code":"?- [H|T] = [a].","ficha":"ud5-001"},{"id":"p5-002","ud":5,"tema":"Listas: cabeza/cola","q":"Según el glosario de símbolos de las diapositivas, ¿qué significa el guion bajo `_` en un patrón como `[_|T]`?","ops":["Un comodín: el dato de esa posición no importa y se ignora","El separador estructural estricto que divide la cabeza de la cola","La lista vacía, que marca el final del recorrido de la lista","Una variable que debe tomar el mismo valor en toda la cláusula"],"why":"_ es la variable anónima, un comodín («no me importa este dato, ignóralo y sigue evaluando»): el valor de esa posición no interesa y no se guarda. El separador estructural es la barra |, y cada _ es independiente de los demás.","src":"S5 diap. 4","imp":1,"ficha":"ud5-002"},{"id":"p5-003","ud":5,"tema":"Listas: cabeza/cola","q":"¿Qué responde Prolog si se pulsa `;` tras cada respuesta?","ops":["`X = a ; X = b ; X = c`","`X = a`, y la primera cláusula detiene la búsqueda","`X = c ; X = b ; X = a`","`X = [a, b, c]`"],"why":"Es el modo generación: la 1.ª cláusula da la cabeza (a) y, al pedir otra respuesta, el backtracking prueba la 2.ª, que repite la búsqueda en la cola: b y después c.","src":"S5 diap. 3","imp":1,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T).\n\n?- miembro(X, [a, b, c]).","ficha":"ud5-006"},{"id":"p5-004","ud":5,"tema":"Listas: cabeza/cola","q":"¿Cómo termina la consulta `?- miembro(x, [a, b, c]).`?","ops":["Al llegar a `[]`, que no encaja con ninguna regla: `false`","En el primer paso, al comprobar que x no es igual a a: `false`","Liga x con a, porque x es una variable sin valor: `true`","No termina: sigue recurriendo sin fin sobre la cola vacía"],"why":"x es un átomo (minúscula), no una variable. Se compara con a, b y c, recurriendo cada vez con la cola; [] ya no encaja ni con [X|_] ni con [_|T], y la consulta falla.","src":"S5 diap. 5","imp":2,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T).","ficha":"ud5-007"},{"id":"p5-005","ud":5,"tema":"Listas: cabeza/cola","q":"Se intercambia el orden de las cláusulas de miembro/2. ¿En qué orden salen ahora las respuestas de `?- miembro(X, [a, b, c]).`?","ops":["`X = c ; X = b ; X = a`","`X = a ; X = b ; X = c`, igual que antes","Ninguna: entra en un bucle infinito","`X = c`, y al pedir más, `false`"],"why":"Prolog prueba las cláusulas en orden: ahora baja primero hasta la lista vacía, que falla, y al retroceder el hecho va dando c, luego b y luego a. El orden de las cláusulas decide el de las soluciones.","src":"S5 diap. 3-4 (calculado)","imp":2,"code":"miembro(X, [_|T]) :- miembro(X, T).\nmiembro(X, [X|_]).","ficha":"ud5-003"},{"id":"p5-006","ud":5,"tema":"Listas: cabeza/cola","q":"Este predicado recorre la lista como miembro/2, pero con otro caso base. ¿Qué responde la consulta?","ops":["`U = c`","`U = a`","`U = a ; U = b ; U = c`","`U = [b, c]`"],"why":"[X] solo encaja con una lista de un elemento: con [a, b, c] y [b, c] únicamente vale la regla recursiva, hasta que queda [c] y el caso base da U = c. Con [] ya no encaja nada.","src":"S5 diap. 4-5 (calculado)","imp":2,"code":"ultimo(X, [X]).\nultimo(X, [_|T]) :- ultimo(X, T).\n\n?- ultimo(U, [a, b, c]).","ficha":"ud5-003"},{"id":"p5-007","ud":5,"tema":"Listas: cabeza/cola","q":"`miembro(b, [a, b, c])` responde true y `miembro(X, [a, b, c])` enumera los elementos. ¿Cómo llaman las diapositivas a estos dos usos del mismo predicado?","ops":["Verificación (input instanciado) y generación (input variable)","Caso base (input instanciado) y caso recursivo (input variable)","Ejecución top-down y ejecución bottom-up","Unificación (input instanciado) y resolución (input variable)"],"why":"Un solo predicado, dos comportamientos: con el elemento dado verifica recorriendo la estructura; con una variable, el backtracking genera todos los elementos posibles.","src":"S5 diap. 3","imp":1,"ficha":"ud5-004"},{"id":"p5-008","ud":5,"tema":"Grafos y recursión","q":"¿Cómo resuelve Prolog `?- alcanzable(madrid, granada).`?","ops":["Prueba valencia, esa rama fracasa y retrocede a sevilla: `true`","Va directo por sevilla, el único camino que lleva a granada: `true`","Prueba valencia, esa rama fracasa y la consulta acaba en `false`","No existe conexion(madrid, granada), así que responde `false`"],"why":"Las reglas y los hechos se prueban en orden: conexion(madrid, valencia) va primero. Desde valencia no se llega a granada, así que el backtracking vuelve atrás y prueba sevilla, que sí conecta con granada.","src":"S5 diap. 6, 8 (calculado)","imp":1,"code":"conexion(madrid, valencia).\nconexion(madrid, sevilla).\nconexion(valencia, barcelona).\nconexion(valencia, mallorca).\nconexion(barcelona, zaragoza).\nconexion(sevilla, granada).\nalcanzable(X, Y) :- conexion(X, Y).\nalcanzable(X, Y) :-\n    conexion(X, Z), alcanzable(Z, Y).","ficha":"ud5-013"},{"id":"p5-009","ud":5,"tema":"Grafos y recursión","q":"¿En qué orden da Prolog los destinos de `?- alcanzable(valencia, D).` pulsando `;`?","ops":["`barcelona`, `mallorca` y `zaragoza`","`barcelona`, `zaragoza` y `mallorca`","`barcelona` y `mallorca`","`zaragoza`, `barcelona` y `mallorca`"],"why":"La 1.ª regla se agota antes de pasar a la 2.ª: primero salen los destinos directos (barcelona, mallorca) y después los de la regla recursiva (zaragoza, vía barcelona). Desde mallorca no se llega a ningún sitio.","src":"S5 diap. 6, 8 (calculado)","imp":2,"code":"conexion(madrid, valencia).\nconexion(madrid, sevilla).\nconexion(valencia, barcelona).\nconexion(valencia, mallorca).\nconexion(barcelona, zaragoza).\nconexion(sevilla, granada).\nalcanzable(X, Y) :- conexion(X, Y).\nalcanzable(X, Y) :-\n    conexion(X, Z), alcanzable(Z, Y).","ficha":"ud5-009"},{"id":"p5-010","ud":5,"tema":"Grafos y recursión","q":"En este grafo hay un ciclo entre a y b. ¿Qué ocurre con la consulta?","ops":["No termina: queda atrapado en un bucle a → b → a → …","`false`, tras comprobar que no hay ningún hecho con c","`false`, tras pasar una vez por a y b y detectar el ciclo","`true`, porque a y b están conectados entre sí"],"why":"El modelo básico no recuerda por dónde ha pasado: de a salta a b, de b vuelve a a y repite sin fin, en un bucle infinito recursivo. Para evitarlo se usa un acumulador de nodos visitados.","src":"S5 diap. 6, 8","imp":1,"code":"conexion(a, b).\nconexion(b, a).\nalcanzable(X, Y) :- conexion(X, Y).\nalcanzable(X, Y) :-\n    conexion(X, Z), alcanzable(Z, Y).\n\n?- alcanzable(a, c).","ficha":"ud5-012"},{"id":"p5-011","ud":5,"tema":"Grafos y recursión","q":"Según las diapositivas, ¿qué hace falta en producción para que alcanzable/2 no quede atrapado en un grafo con ciclos?","ops":["Un acumulador con los nodos ya visitados","Escribir la regla recursiva antes que la directa","Añadir cada conexión también en sentido inverso","Quitar la regla directa y conservar la recursiva"],"why":"Con una lista de visitados, la búsqueda no vuelve a pasar por el mismo nodo y termina. Cambiar el orden de las reglas no evita el ciclo, y duplicar las conexiones en sentido inverso crea ciclos nuevos.","src":"S5 diap. 6","imp":1,"ficha":"ud5-012"},{"id":"p5-012","ud":5,"tema":"Grafos y recursión","q":"En la regla `alcanzable(X, Y) :- conexion(X, Z), alcanzable(Z, Y).`, ¿qué representa Z?","ops":["Un nodo intermedio: se salta a Z y desde Z se llega a Y","El destino final de la ruta, que se conoce al acabar la búsqueda","Un contador con el número de saltos realizados hasta Y","La lista de nodos ya visitados, para no repetir ninguno"],"why":"La 1.ª regla dice «llegué directamente»; la 2.ª, «salté a un nodo intermedio Z, y desde Z sé cómo llegar a Y». Así se deducen rutas de varios saltos con hechos de un solo salto.","src":"S5 diap. 7-8","imp":1,"ficha":"ud5-010"},{"id":"p5-013","ud":5,"tema":"Grafos y recursión","q":"Según la nota de ingeniería de las diapositivas, ¿qué algoritmo crean automáticamente las dos reglas de alcanzable/2?","ops":["Una búsqueda exhaustiva en profundidad (DFS)","Una búsqueda en anchura (BFS), nivel a nivel","Una búsqueda del camino más corto entre dos nodos","Una deducción bottom-up de todos los hechos, como Datalog"],"why":"Prolog sigue cada rama hasta el fondo antes de probar la siguiente y retrocede al fallar: recursión + backtracking dan una búsqueda en profundidad (DFS) exhaustiva.","src":"S5 diap. 6","imp":2,"ficha":"ud5-011"},{"id":"p5-014","ud":5,"tema":"Pilares y familia lógica","q":"Según las diapositivas, ¿cuáles son los tres «pilares ocultos» del paradigma lógico?","ops":["Unificación, recursión y backtracking","Hechos, reglas y consultas","Unificación, corte y negación como fallo","Recursión, evaluación perezosa y backtracking"],"why":"Unificación (encajar moldes), recursión (descenso sin bucles) y backtracking (buscar alternativas). Hechos, reglas y consultas son los tipos de cláusula, no los pilares.","src":"S5 diap. 9","imp":1,"ficha":"ud5-014"},{"id":"p5-015","ud":5,"tema":"Pilares y familia lógica","q":"¿Qué pilar del paradigma lógico «asigna valores a variables dinámicamente si los moldes encajan perfectamente»?","ops":["La unificación","El backtracking","La recursión","La negación como fallo"],"why":"Unificar es hacer encajar dos términos ligando las variables necesarias: [H|T] = [a, b, c] da H = a y T = [b, c]. Si los moldes no encajan, falla.","src":"S5 diap. 9","imp":1,"ficha":"ud5-015"},{"id":"p5-016","ud":5,"tema":"Pilares y familia lógica","q":"¿Qué pilar del paradigma lógico permite que sumar_cargas/2 recorra toda la lista sin ningún bucle, llamándose a sí mismo con la cola hasta `[]`?","ops":["La recursión: descenso profundo que evita los bucles estáticos","El backtracking: búsqueda de alternativas cuando algo falla","La unificación: encaje dinámico de moldes entre dos términos","El mundo cerrado: lo que no se demuestra se da por falso"],"why":"Las diapositivas definen la recursión como «el mecanismo de descenso profundo para evadir la necesidad de bucles estáticos». El backtracking solo entra cuando una vía falla y hay que probar otra.","src":"S5 diap. 9, 18","imp":2,"ficha":"ud5-016"},{"id":"p5-017","ud":5,"tema":"Pilares y familia lógica","q":"Buscando una ruta, Prolog prueba `conexion(madrid, valencia)`, esa rama no lleva al destino y vuelve a probar `conexion(madrid, sevilla)`. ¿Qué pilar actúa al volver atrás?","ops":["El backtracking","La unificación","La recursión","El corte"],"why":"El backtracking es «la brújula interna que busca alternativas exhaustivas cuando choca contra una pared»: vuelve al último punto de decisión y prueba la siguiente opción. El corte hace lo contrario: lo impide.","src":"S5 diap. 8-9","imp":2,"ficha":"ud5-017"},{"id":"p5-018","ud":5,"tema":"Pilares y familia lógica","q":"Según la tabla de la familia lógica, ¿qué lenguaje tiene como caso de uso ideal las consultas recursivas en bases de datos gigantes?","ops":["Datalog","Prolog","ASP (Answer Set)","CLP (lógica con restricciones)"],"why":"Datalog ejecuta bottom-up (exhaustivo) y es finito, sin funciones anidadas: encaja con consultas recursivas sobre grandes bases de datos. A Prolog la tabla le asigna los sistemas expertos y la IA simbólica.","src":"S5 diap. 10","imp":1,"ficha":"ud5-022"},{"id":"p5-019","ud":5,"tema":"Pilares y familia lógica","q":"En la tabla de la familia lógica, ¿cuál es el paradigma de ejecución de ASP (Answer Set)?","ops":["Generación de modelos (SAT)","Top-Down, con backtracking","Bottom-Up, de forma exhaustiva","Reducción de expresiones lambda"],"why":"ASP genera modelos que satisfacen las restricciones (SAT); por eso su caso ideal es la optimización NP-difícil y los puzzles lógicos. Top-Down es Prolog y Bottom-Up, Datalog.","src":"S5 diap. 10","imp":2,"ficha":"ud5-021"},{"id":"p5-020","ud":5,"tema":"Pilares y familia lógica","q":"¿Qué fila de la tabla de la familia lógica corresponde a Prolog (ejecución · estructura · caso de uso)?","ops":["Top-Down (backtracking) · Turing completo · sistemas expertos e IA simbólica","Bottom-Up (exhaustivo) · finito · consultas recursivas en bases de datos","Generación de modelos (SAT) · Turing completo · sistemas expertos e IA","Top-Down (backtracking) · finito · optimización NP-difícil y puzzles"],"why":"Prolog ejecuta Top-Down con backtracking, es Turing completo (admite estructuras infinitas) y su uso ideal son los sistemas expertos y la IA simbólica. Finito es Datalog; SAT, ASP.","src":"S5 diap. 10","imp":2,"ficha":"ud5-020"},{"id":"p5-021","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué tres ventajas («acelera») de aplicar lógica pura recogen las diapositivas?","ops":["Transparencia extrema, mantenimiento ortogonal y modelado natural","Eficiencia numérica, mutación de estado y control explícito del flujo","Transparencia extrema, eficiencia numérica y control explícito del flujo","Modelado natural, evaluación perezosa y mutación de estado"],"why":"Acelera: transparencia extrema (trazabilidad), mantenimiento ortogonal (añadir reglas no rompe nada) y modelado natural (ontologías). Lo numérico, el estado mutable y renunciar al control explícito son sus frenos.","src":"S5 diap. 11","imp":1,"ficha":"ud5-023"},{"id":"p5-022","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Cuál de estas **NO** es una limitación («frena») de la lógica pura según las diapositivas?","ops":["Mantenimiento ortogonal","Ineficiencia numérica","Mutación de estado","Curva de abstracción"],"why":"El mantenimiento ortogonal es una ventaja: añadir reglas nuevas no rompe el flujo existente. Los tres frenos son la ineficiencia numérica, la mutación de estado y la curva de abstracción.","src":"S5 diap. 11","imp":1,"ficha":"ud5-027"},{"id":"p5-023","ud":5,"tema":"Ventajas, límites y futuro","q":"Un sistema experto debe justificar ante un auditor por qué tomó cada decisión. ¿Qué ventaja de la lógica pura lo facilita, según las diapositivas?","ops":["La transparencia extrema","El mantenimiento ortogonal","El modelado natural","La curva de abstracción"],"why":"La transparencia extrema es la «trazabilidad exacta de por qué se tomó cada decisión»: la cadena de reglas aplicadas explica el resultado. La curva de abstracción es una limitación, no una ventaja.","src":"S5 diap. 11","imp":2,"ficha":"ud5-024"},{"id":"p5-024","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué significa, según las diapositivas, que la lógica pura ofrece «mantenimiento ortogonal»?","ops":["Que añadir nuevas reglas no rompe el flujo existente","Que cada regla se guarda en un módulo independiente","Que el programador controla el flujo de forma explícita","Que las reglas se ejecutan en paralelo y sin orden"],"why":"Cada regla es una declaración independiente: una nueva añade conocimiento sin reescribir las demás, como una cuarta regla en_riesgo_ED. El control explícito del flujo es justo lo que la lógica pura abandona.","src":"S5 diap. 11","imp":2,"ficha":"ud5-025"},{"id":"p5-025","ud":5,"tema":"Ventajas, límites y futuro","q":"¿En qué consiste la limitación que las diapositivas llaman «curva de abstracción»?","ops":["Exige abandonar el control explícito del flujo de control","Es lenta en cálculos matemáticos puramente secuenciales","Maneja mal las variables que cambian constantemente","Añadir reglas nuevas rompe el flujo ya existente"],"why":"Cuesta dejar de programar el «cómo» y ceder el control del flujo al motor de inferencia. La lentitud numérica y el estado cambiante son las otras dos limitaciones; añadir reglas, en cambio, no rompe nada.","src":"S5 diap. 11","imp":2,"ficha":"ud5-030"},{"id":"p5-026","ud":5,"tema":"Ventajas, límites y futuro","q":"Un programa debe manejar variables que cambian de valor sin parar, como el estado de cada personaje de un videojuego. ¿Qué limitación de la lógica pura señalan las diapositivas?","ops":["La mutación de estado","La ineficiencia numérica","La curva de abstracción","El mantenimiento ortogonal"],"why":"Las diapositivas hablan de «mala manipulación de variables que cambian constantemente»: es la mutación de estado. La ineficiencia numérica se refiere a cálculos matemáticos puramente secuenciales.","src":"S5 diap. 11","imp":2,"ficha":"ud5-029"},{"id":"p5-027","ud":5,"tema":"Ventajas, límites y futuro","q":"En la arquitectura moderna que describen las diapositivas, ¿qué papel tiene el motor lógico?","ops":["Cerebro estratégico que orquesta los submódulos imperativos","Submódulo al que Python o C delegan todos los cálculos numéricos","Sustituto completo de los módulos imperativos (Python, C)","Almacén pasivo de hechos que consultan los módulos de C"],"why":"El motor lógico decide y orquesta; los submódulos imperativos (p. ej., Python o C) se encargan de la ejecución eficiente. Delegarle los cálculos numéricos sería usarlo en su punto débil.","src":"S5 diap. 11","imp":2,"ficha":"ud5-031"},{"id":"p5-028","ud":5,"tema":"Ventajas, límites y futuro","q":"¿Qué es la IA neuro-simbólica según las diapositivas?","ops":["Redes neuronales y sistemas lógicos unidos: sistemas que predicen, razonan y explican","Redes neuronales entrenadas para sustituir por completo a los sistemas expertos de reglas","Sistemas lógicos que aprenden solos sus reglas y ya no necesitan datos de entrenamiento","Una variante de Prolog que ejecuta sus reglas en procesadores gráficos (GPU)"],"why":"Es la convergencia de dos mundos: las redes neuronales reconocen patrones y los sistemas lógicos aportan razonamiento. El resultado son sistemas autónomos que no solo predicen, sino que razonan y explican.","src":"S5 diap. 12","imp":1,"ficha":"ud5-032"},{"id":"p5-029","ud":5,"tema":"Ventajas, límites y futuro","q":"En la IA neuro-simbólica, ¿qué aporta cada componente según las diapositivas?","ops":["Redes: patrones en datos crudos («caja negra»); lógica: decisiones auditables","Redes: decisiones auditables y explicables; lógica: patrones en datos crudos","Redes: reglas de negocio; lógica: reconocimiento de patrones en imágenes","Redes y lógica aportan lo mismo; unirlas sirve para ganar velocidad"],"why":"Las redes neuronales reconocen patrones en datos crudos, pero son una «caja negra»; los sistemas lógicos aportan razonamiento estructurado, reglas de negocio y decisiones auditables y explicables.","src":"S5 diap. 12","imp":2,"ficha":"ud5-033"},{"id":"p5-030","ud":5,"tema":"Ej. 3: OR implícito","q":"El ejercicio 3 pide programar «en riesgo si se cumple la condición 1, la 2 o la 3» sin usar el operador `;`. ¿Cómo se consigue?","ops":["Con tres reglas homónimas, una por cada condición","Con una regla y las tres condiciones separadas por comas","Con una regla y `\\+` delante de cada condición","Con el corte `!` entre una condición y la siguiente"],"why":"Prolog evalúa las reglas con el mismo nombre como alternativas independientes: el OR es implícito. Separar las tres condiciones con comas daría un AND: habría que cumplirlas todas a la vez.","src":"S5 diap. 14-15","imp":1,"ficha":"ud5-035"},{"id":"p5-031","ud":5,"tema":"Ej. 3: OR implícito","q":"Hay una regla en_riesgo_ED(Nombre) por cada condición, en este orden. ¿Qué responde `?- en_riesgo_ED(X).` pulsando `;`?","ops":["`X = carlos ; X = luis ; X = mario`","`X = luis ; X = mario ; X = carlos`","`X = carlos ; X = luis ; X = mario ; X = ana`","`X = luis ; X = carlos`"],"why":"Prolog agota la regla 1 (recorriendo todos los buceadores) antes de pasar a la 2: carlos (regla 1), luis (regla 2) y mario (regla 3). Ana no cumple ninguna condición, así que no aparece.","src":"S5 diap. 14-15 (calculado)","imp":2,"code":"% buceador(Nombre, Temp, Prof, Tiempo)\nbuceador(luis, 11, 34, 15).\nbuceador(mario, 26, 33, 50).\nbuceador(carlos, 10, 18, 30).\nbuceador(ana, 22, 16, 35).\n% Regla 1: Temp \u003c 12, Tiempo >= 20\n% Regla 2: Temp \u003c 12, Prof > 30\n% Regla 3: Prof > 30, Tiempo >= 40","ficha":"ud5-037"},{"id":"p5-032","ud":5,"tema":"Ej. 3: OR implícito","q":"Con estas reglas y un único buceador, ¿cuántas respuestas da `?- en_riesgo_ED(X).` pulsando `;`?","ops":["Tres: `X = eva`, una vez por cada regla que cumple","Una: Prolog descarta las soluciones repetidas","Una: al cumplir la primera regla se acaba la búsqueda","Ninguna: cumplir varias condiciones a la vez anula el OR"],"why":"Cada regla homónima es un camino independiente, y eva (Temp 10, Prof 35, Tiempo 45) cumple las tres condiciones. Prolog no elimina duplicados: responde X = eva tres veces.","src":"S5 diap. 15 (calculado)","imp":1,"code":"en_riesgo_ED(N) :- buceador(N, T, _, Ti),\n    T \u003c 12, Ti >= 20.\nen_riesgo_ED(N) :- buceador(N, T, P, _),\n    T \u003c 12, P > 30.\nen_riesgo_ED(N) :- buceador(N, _, P, Ti),\n    P > 30, Ti >= 40.\nbuceador(eva, 10, 35, 45).","ficha":"ud5-035"},{"id":"p5-033","ud":5,"tema":"Ej. 3: OR implícito","q":"En la solución del ejercicio 3, ¿cómo quedan expresados el AND y el OR entre condiciones?","ops":["AND con comas dentro de cada regla; OR con varias reglas del mismo nombre","OR con comas dentro de cada regla; AND con varias reglas del mismo nombre","AND con comas y OR con `;`, todo dentro de una única regla","AND y OR con comas; el motor los distingue por el contexto"],"why":"Dentro de una regla, T \u003c 12, Tiempo >= 20 exige las dos cosas (AND). Las tres reglas en_riesgo_ED son alternativas y basta con que se cumpla una (OR implícito). El ejercicio prohíbe usar ;.","src":"S5 diap. 15","imp":2,"ficha":"ud5-036"},{"id":"p5-034","ud":5,"tema":"Ej. 4: conc/3","q":"¿Qué va en el hueco del paso recursivo de conc/3?","ops":["`[H|R]`","`[R|H]`","`[H|T]`","`R`"],"why":"La cabeza H de la primera lista se obliga a encabezar el resultado, y la recursión construye el resto R uniendo T con L2. Con [H|T] el resultado sería la primera lista, sin L2.","src":"S5 diap. 16","imp":2,"code":"% Caso base\nconc([], L, L).\n% Paso recursivo\nconc([H|T], L2, ____) :-\n    conc(T, L2, R).","ficha":"ud5-039"},{"id":"p5-035","ud":5,"tema":"Ej. 4: conc/3","q":"¿Cuántas respuestas da esta consulta pulsando `;`, y cuál sale primero?","ops":["Tres; la primera, `P = [], S = [a, b]`","Tres; la primera, `P = [a, b], S = []`","Dos; la primera, `P = [a], S = [b]`","Una: `P = [a], S = [b]`"],"why":"Es la descomposición: el motor explora todas las particiones con backtracking. El caso base va primero (P = [], S = [a, b]); después salen P = [a], S = [b] y P = [a, b], S = [].","src":"S5 diap. 17 (calculado)","imp":1,"code":"conc([], L, L).\nconc([H|T], L2, [H|R]) :-\n    conc(T, L2, R).\n\n?- conc(P, S, [a, b]).","ficha":"ud5-041"},{"id":"p5-036","ud":5,"tema":"Ej. 4: conc/3","q":"¿Qué responde Prolog a esta consulta?","ops":["`X = [a, b]`","`X = [a, b, c, c]`","`X = [c]`","Error: el primer argumento debe estar instanciado"],"why":"conc/3 no tiene dirección de flujo: aquí busca qué lista, unida a [c], da [a, b, c]. Solo X = [a, b] cumple la relación, así que el mismo predicado sirve para «quitar» un sufijo.","src":"S5 diap. 16-17 (calculado)","imp":1,"code":"conc([], L, L).\nconc([H|T], L2, [H|R]) :-\n    conc(T, L2, R).\n\n?- conc(X, [c], [a, b, c]).","ficha":"ud5-040"},{"id":"p5-037","ud":5,"tema":"Ej. 4: conc/3","q":"¿Por qué el mismo conc/3 sirve tanto para unir dos listas como para descomponer una lista en todas sus particiones?","ops":["Porque es una declaración lógica pura, sin dirección de flujo","Porque usa `is` para calcular por dónde partir la lista","Porque Prolog genera internamente una versión inversa del predicado","Porque el corte decide en cada llamada si unir o separar"],"why":"conc/3 solo describe la relación entre tres listas, sin fijar qué es entrada y qué es salida: el motor la resuelve en el sentido que pida la consulta. Un is rompería esa bidireccionalidad.","src":"S5 diap. 16-17","imp":1,"ficha":"ud5-040"},{"id":"p5-038","ud":5,"tema":"Ej. 5: aritmética (is)","q":"En longitud/2 se ha cambiado `is` por `=`. ¿Qué responde ahora la consulta?","ops":["`N = 0+1+1`","`N = 2`","Error: `NResto` no está instanciado","`false`"],"why":"= solo unifica, no calcula: N queda ligada a la estructura 0+1+1 sin evaluar. Para obtener N = 2 hace falta is, que evalúa la expresión de la derecha.","src":"S5 diap. 18 (calculado)","imp":1,"code":"longitud([], 0).\nlongitud([_|T], N) :-\n    longitud(T, NResto),\n    N = NResto + 1.\n\n?- longitud([a, b], N).","ficha":"ud5-042"},{"id":"p5-039","ud":5,"tema":"Ej. 5: aritmética (is)","q":"En esta versión se ha puesto `is` antes de la llamada recursiva. ¿Qué ocurre con la consulta?","ops":["Error: `SubTotal` aún no tiene valor al evaluar `is`","`T = 30`: el orden de los objetivos de la regla no importa","`T = 0+20+10`: la suma queda como estructura sin evaluar","`false`: la regla falla antes de alcanzar el caso base"],"why":"is exige que la parte derecha esté instanciada, y SubTotal solo recibe valor después de la llamada recursiva. Por eso en las diapositivas is va detrás de la recursión.","src":"S5 diap. 18 (calculado)","imp":1,"code":"sumar_cargas([], 0).\nsumar_cargas([C|Resto], Total) :-\n    Total is SubTotal + C,\n    sumar_cargas(Resto, SubTotal).\n\n?- sumar_cargas([10, 20], T).","ficha":"ud5-044"},{"id":"p5-040","ud":5,"tema":"Ej. 5: aritmética (is)","q":"¿Qué sumas hace el motor para llegar a `Total = 30`, y en qué orden?","ops":["0 + 20 = 20 y luego 20 + 10 = 30, al volver de la recursión","10 + 20 = 30 en el primer paso, antes de bajar por la recursión","0 + 10 = 10 y luego 10 + 20 = 30, al bajar por la lista","Ninguna: Total queda como la estructura 0+20+10 sin evaluar"],"why":"Al bajar, cada is queda suspendido hasta llegar a sumar_cargas([], 0). La suma ocurre de regreso, al desenvolver la pila: primero 0 + 20 (el último elemento) y después 20 + 10.","src":"S5 diap. 19","imp":1,"code":"sumar_cargas([], 0).\nsumar_cargas([C|Resto], Total) :-\n    sumar_cargas(Resto, SubTotal),\n    Total is SubTotal + C.\n\n?- sumar_cargas([10, 20], Total).","ficha":"ud5-045"},{"id":"p5-041","ud":5,"tema":"Ej. 5: aritmética (is)","q":"¿Por qué dicen las diapositivas que el operador `is` rompe la pureza de Prolog?","ops":["Es una llamada imperativa que exige la parte derecha ya instanciada","Obliga a declarar antes el tipo numérico de cada variable que usa","Deshace las unificaciones hechas antes dentro de la misma regla","Impide que la regla en la que aparece pueda ser también recursiva"],"why":"is rompe la bidireccionalidad pura: no describe una relación, ordena a la CPU calcular, y si a la derecha hay variables sin valor da error. conc/3, sin is, funciona en los dos sentidos.","src":"S5 diap. 18","imp":1,"ficha":"ud5-044"},{"id":"p5-042","ud":5,"tema":"Ej. 6: subconjunto/2","q":"¿Qué responde la consulta y por qué?","ops":["`false`: aa está, pero dd no, y la conjunción falla","`true`: basta con que la cabeza aa esté en la lista","`false`: las dos listas no tienen la misma longitud","Error: dd no aparece en ningún hecho del programa"],"why":"miembro(aa, …) tiene éxito y el motor avanza; miembro(dd, …) falla. Es una conjunción (AND): si un solo objetivo falla, la regla entera colapsa y la respuesta es false.","src":"S5 diap. 20-21","imp":1,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T).\nsubconjunto([], _).\nsubconjunto([H|T], Lista) :-\n    miembro(H, Lista),\n    subconjunto(T, Lista).\n\n?- subconjunto([aa, dd], [aa, bb, cc]).","ficha":"ud5-048"},{"id":"p5-043","ud":5,"tema":"Ej. 6: subconjunto/2","q":"¿Qué responde Prolog a esta consulta?","ops":["`true`","`false`, porque el orden no coincide con el de la lista","`false`, porque c está repetido en la sublista","`false`, porque b no aparece en la sublista"],"why":"subconjunto/2 comprueba uno a uno que cada elemento de la sublista es miembro de la lista: c sí, a sí y c otra vez sí; luego llega a [] y acaba. El orden y las repeticiones no importan.","src":"S5 diap. 20 (calculado)","imp":1,"code":"miembro(X, [X|_]).\nmiembro(X, [_|T]) :- miembro(X, T).\nsubconjunto([], _).\nsubconjunto([H|T], Lista) :-\n    miembro(H, Lista),\n    subconjunto(T, Lista).\n\n?- subconjunto([c, a, c], [a, b, c]).","ficha":"ud5-046"},{"id":"p5-044","ud":5,"tema":"Ej. 6: subconjunto/2","q":"Prolog no logra demostrar `miembro(dd, [aa, bb, cc])` y lo da por falso. ¿Qué principio aplica, según las diapositivas?","ops":["La asunción del mundo cerrado","La negación fuerte de ASP","El mantenimiento ortogonal","La transparencia referencial"],"why":"Según la asunción del mundo cerrado, «lo que no se puede demostrar, es falso». No hace falta un hecho que diga que dd no está: basta con no poder probar que está.","src":"S5 diap. 21","imp":1,"ficha":"ud5-049"},{"id":"p5-045","ud":5,"tema":"Ej. 6: subconjunto/2","q":"En subconjunto/2, ¿qué papel cumple la llamada `miembro(H, Lista)`?","ops":["Predicado auxiliar: busca la cabeza H de la sublista en la lista","Caso base: detiene la recursión cuando la sublista se queda vacía","Ordena la lista para poder compararla después con la sublista","Cuenta cuántas veces aparece la sublista dentro de la lista"],"why":"Se aísla la cabeza H de la sublista y se delega su búsqueda al motor con miembro/2; la recursión sobre T repite lo mismo con el resto. El caso base es subconjunto([], _).","src":"S5 diap. 20","imp":2,"ficha":"ud5-047"}];
  const BY_ID = new Map(CARDS.map(c => [c.id, c]));
  const Q_BY = new Map(QS.map(q => [q.id, q]));
  // Simulacro: 40 preguntas; acierto +1, fallo −1/3, en blanco 0. Veredicto: media de los 3 últimos ≥ 7 y ninguno < 6.
  const SIM_N = Math.min(40, QS.length), PEN = 1 / 3, GOAL = 7, FLOOR = 6, PASS = 5, WINDOW = 3;

  const app = document.getElementById('app');

  // ---------- utilidades ----------
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  function inline(s) {
    return String(s).split('`').map((part, i) => i % 2
      ? '<code>' + esc(part) + '</code>'
      : esc(part).replace(/\*\*([^*]+)\*\*/g, '<mark>$1</mark>')).join('');
  }
  function fmt(s) {
    let html = '', list = false;
    for (const raw of String(s || '').split('\n')) {
      const l = raw.trim(); if (!l) continue;
      const m = l.match(/^(?:•|-)\s+(.*)$/);
      if (m) { if (!list) { html += '<ul>'; list = true; } html += '<li>' + inline(m[1]) + '</li>'; }
      else { if (list) { html += '</ul>'; list = false; } html += '<p>' + inline(l) + '</p>'; }
    }
    return html + (list ? '</ul>' : '');
  }
  const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
  const ICON = {
    x: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  };
  const reduced = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

  // ---------- almacenamiento ----------
  const KEY = 'fichas-paradigmas-v1', PKEY = 'fichas-paradigmas-prefs';
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } },
  };
  const parse = t => { try { return JSON.parse(t); } catch (e) { return null; } };
  const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
  function sanitize(s) {
    const o = { v: 1, epoch: 0, cards: {} };
    if (!isObj(s)) return o;
    o.epoch = +s.epoch || 0;
    if (isObj(s.cards)) for (const [k, e] of Object.entries(s.cards)) {
      if (isObj(e)) o.cards[k] = { b: Math.max(0, Math.min(3, +e.b || 0)), n: +e.n || 0, ok: +e.ok || 0, last: +e.last || 0 };
    }
    return o;
  }
  function merge(a, b) {
    if (!b) return a; if (!a) return b;
    if (a.epoch !== b.epoch) return a.epoch > b.epoch ? a : b;
    const o = { v: 1, epoch: a.epoch, cards: {} };
    for (const k of new Set([...Object.keys(a.cards), ...Object.keys(b.cards)])) {
      const x = a.cards[k], y = b.cards[k];
      o.cards[k] = !x ? y : !y ? x : (y.last > x.last ? y : x);
    }
    return o;
  }
  function stable(x) {
    if (Array.isArray(x)) return '[' + x.map(stable).join(',') + ']';
    if (isObj(x)) return '{' + Object.keys(x).sort().map(k => JSON.stringify(k) + ':' + stable(x[k])).join(',') + '}';
    return JSON.stringify(x === undefined ? null : x);
  }
  let S = sanitize(parse(LS.get(KEY)));
  const DEF_PREFS = { uds: UDS.map(u => u.ud), off: [], filtro: 'todas', ess: false, orden: 'temario', hideA: false, modo: 'fichas', tfiltro: 'todas', tanda: 20 };
  let P = Object.assign({}, DEF_PREFS, isObj(parse(LS.get(PKEY))) ? parse(LS.get(PKEY)) : {});
  if (!Array.isArray(P.uds)) P.uds = DEF_PREFS.uds.slice();
  P.uds = P.uds.filter(u => UD_OF.has(u));
  if (!Array.isArray(P.off)) P.off = [];
  if (P.modo !== 'test' || !QS.length) P.modo = 'fichas';
  if (!['todas', 'pendientes', 'falladas'].includes(P.tfiltro)) P.tfiltro = 'todas';
  if (![10, 20, 0].includes(P.tanda)) P.tanda = 20;
  const savePrefs = () => LS.set(PKEY, JSON.stringify(P));

  // ---------- progreso del test (preguntas vistas y simulacros) ----------
  const TKEY = 'test-paradigmas-v1', TSKEY = 'test-paradigmas-sesion';
  function udMap(x) {
    const o = {};
    if (isObj(x)) for (const u of UDS) { const v = x[u.ud]; if (Array.isArray(v)) o[u.ud] = [0, 1, 2].map(i => Math.max(0, +v[i] || 0)); }
    return o;
  }
  function tSanitize(s) {
    const o = { v: 1, epoch: 0, qs: {}, sims: [] };
    if (!isObj(s)) return o;
    o.epoch = +s.epoch || 0;
    if (isObj(s.qs)) for (const [k, e] of Object.entries(s.qs)) {
      if (isObj(e)) o.qs[k] = { n: +e.n || 0, ok: +e.ok || 0, last: +e.last || 0, r: e.r === 1 ? 1 : 0 };
    }
    if (Array.isArray(s.sims)) o.sims = s.sims.filter(isObj).map(x => ({
      t: +x.t || 0, n: +x.n || 0, ok: +x.ok || 0, bad: +x.bad || 0, blank: +x.blank || 0,
      nota: Math.max(0, Math.min(10, +x.nota || 0)), ud: udMap(x.ud),
    })).filter(x => x.t && x.n).sort((a, b) => a.t - b.t).slice(-60);
    return o;
  }
  function tMerge(a, b) {
    if (!b) return a; if (!a) return b;
    if (a.epoch !== b.epoch) return a.epoch > b.epoch ? a : b;
    const o = { v: 1, epoch: a.epoch, qs: {}, sims: [] };
    for (const k of new Set([...Object.keys(a.qs), ...Object.keys(b.qs)])) {
      const x = a.qs[k], y = b.qs[k];
      o.qs[k] = !x ? y : !y ? x : (y.last > x.last ? y : x);
    }
    const byT = new Map(); for (const x of [...a.sims, ...b.sims]) byT.set(x.t, x);
    o.sims = [...byT.values()].sort((p, q) => p.t - q.t).slice(-60);
    return o;
  }
  let T = tSanitize(parse(LS.get(TKEY)));

  // ---------- sincronización con la cuenta (capacidad db): un documento para las fichas y otro para el test ----------
  const SYNCS = [];
  function makeSync(name, store) { const R = { name, store, ref: null, status: 'local', writing: false, again: false, last: null, t: 0 }; SYNCS.push(R); return R; }
  const SF = makeSync('fichas-paradigmas', { get: () => S, set: v => { S = v; LS.set(KEY, JSON.stringify(S)); }, sanitize, merge, empty: () => !(Object.keys(S.cards).length || S.epoch) });
  const STT = makeSync('test-paradigmas', { get: () => T, set: v => { T = v; LS.set(TKEY, JSON.stringify(T)); }, sanitize: tSanitize, merge: tMerge, empty: () => !(Object.keys(T.qs).length || T.sims.length || T.epoch) });
  const SYNC_TXT = { local: ['', 'Progreso guardado en este dispositivo'], connecting: ['', 'Conectando con tu cuenta…'], ok: ['ok', 'Progreso sincronizado con tu cuenta'], error: ['err', 'Sin conexión; se guardará al volver'] };
  function syncState() { const st = SYNCS.map(r => r.status); return st.includes('error') ? 'error' : st.includes('connecting') ? 'connecting' : st.includes('ok') ? 'ok' : 'local'; }
  function syncHTML() { const m = SYNC_TXT[syncState()]; return '<span class="sync ' + m[0] + '" id="sync-st"><i></i>' + m[1] + '</span>'; }
  function setSync(R, st) { R.status = st; const el = document.getElementById('sync-st'); if (el) el.outerHTML = syncHTML(); }
  function listen(R, db, uid) {
    R.ref = db.doc('data/users/' + uid + '/' + R.name);
    setSync(R, 'connecting');
    const timer = setTimeout(() => { if (R.status === 'connecting') setSync(R, 'error'); }, 10000);
    R.ref.onSnapshot(snap => {
      if (!snap.metadata || !snap.metadata.fromCache) clearTimeout(timer);
      const remote = snap.exists ? R.store.sanitize(snap.data()) : null;
      R.last = remote ? stable(remote) : null;
      if (remote) {
        const cur = R.store.get(), m = R.store.merge(cur, remote);
        if (stable(m) !== stable(cur)) { R.store.set(m); if (view === 'home') keepScroll(renderHome); }
      }
      setSync(R, 'ok');
      if (stable(R.store.get()) !== R.last && !R.store.empty()) scheduleWrite(R, 1200);
    }, () => { clearTimeout(timer); R.ref = null; setSync(R, 'local'); });
  }
  async function initRemote() {
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    try {
      const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
      if (!user || !db) return;
      const id = await user.id(); if (!id) return;
      for (const R of SYNCS) listen(R, db, id);
    } catch (e) { for (const R of SYNCS) setSync(R, 'local'); }
  }
  function scheduleWrite(R, ms) { if (!R.ref) return; clearTimeout(R.t); R.t = setTimeout(() => flushWrite(R), ms || 600); }
  async function flushWrite(R) {
    if (!R.ref) return;
    if (R.writing) { R.again = true; return; }
    const body = stable(R.store.get()); if (body === R.last) return;
    R.writing = true;
    try { await R.ref.set(JSON.parse(body)); R.last = body; setSync(R, 'ok'); }
    catch (e) { if (e && e.code === 'invalid_argument') { R.ref = null; setSync(R, 'local'); } else setSync(R, 'error'); }
    finally { R.writing = false; if (R.again) { R.again = false; scheduleWrite(R, 800); } }
  }

  // ---------- estado de cada ficha ----------
  const rec = id => S.cards[id];

  function rateCard(id, r) {

    e.last = Date.now();

  }

  const singleUd = () => P.uds.length === 1 ? P.uds[0] : null;

  function pool() {

  // Las fichas de una misma serie van siempre juntas y en orden (1/5, 2/5…), también al mezclar.
  function queueOf(cards, mix) {

  function udRowsHTML(items, t2) {

  function temasHTML(one, items) {

  function bindShared(one) {

  function describe() {

  // ================= MODO TEST =================
  const nf = x => (Math.round(x * 10) / 10).toFixed(1).replace('.', ',');
  const fecha = t => { try { return new Date(t).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } };
  const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
  ICON.dash = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg>';
  function qStatus(id) { const e = T.qs[id]; return !e || !e.n ? 'new' : e.r ? 'ok' : 'bad'; }
  const seenN = id => (T.qs[id] && T.qs[id].n) || 0;
  function qRecord(id, right) {
    const e = Object.assign({ n: 0, ok: 0, last: 0, r: 0 }, T.qs[id]);
    e.n++; if (right) e.ok++; e.r = right ? 1 : 0; e.last = Date.now();
    T.qs[id] = e;
  }
  function qTally(list) { const t = { ok: 0, mid: 0, bad: 0, new: 0, total: list.length }; for (const q of list) t[qStatus(q.id)]++; return t; }
  function qPool() {
    const one = singleUd();
    return QS.filter(q => {
      if (!P.uds.includes(q.ud)) return false;
      if (one && P.off.includes(temaKey(q.ud, q.tema))) return false;
      if (P.ess && q.imp !== 1) return false;
      const st = qStatus(q.id);
      if (P.tfiltro === 'pendientes' && st === 'ok') return false;

  }
  // Simulacro: cupo de cada unidad proporcional a sus preguntas; dentro de cada unidad, primero las menos vistas
  // y repartidas entre temas. Así cada simulacro nuevo trae sobre todo preguntas que aún no has visto.
  function simPick() {
    const n = SIM_N; if (!n) return [];
    const byUd = UDS.map(u => QS.filter(q => q.ud === u.ud));
    const quota = byUd.map(l => n * l.length / QS.length), take = quota.map(Math.floor);
    let rest = n - take.reduce((a, b) => a + b, 0);
    quota.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { take[i]++; rest--; } });
    const ids = [];
    byUd.forEach((l, i) => {
      const rnd = new Map(l.map(q => [q.id, Math.random()])), used = {}, got = new Set(), mine = [];
      for (let k = 0; k < take[i]; k++) {
        let best = null, bk = null;
        for (const q of l) {
          if (got.has(q.id)) continue;
          const key = [seenN(q.id), used[q.tema] || 0, rnd.get(q.id)];
          if (!bk || key[0] < bk[0] || (key[0] === bk[0] && (key[1] < bk[1] || (key[1] === bk[1] && key[2] < bk[2])))) { best = q; bk = key; }
        }
        if (!best) break;
        got.add(best.id); used[best.tema] = (used[best.tema] || 0) + 1; mine.push(best.id);
      }
      ids.push(...shuffle(mine));
    });
    return ids;
  }

  let tses = null, pendingSim = null, tarmed = false, darmed = false;
  function newTSes(kind, ids, title) {

    return { kind, ids: ids.slice(), perm, ans: {}, i: 0, title, t0: Date.now(), res: null };
  }
  function validSes(x) {
    if (!isObj(x) || !['sim', 'prac'].includes(x.kind) || !Array.isArray(x.ids) || !x.ids.length || !isObj(x.perm) || !isObj(x.ans)) return null;
    if (!x.ids.every(id => Q_BY.has(id) && Array.isArray(x.perm[id]) && x.perm[id].length === 4 && [0, 1, 2, 3].every(k => x.perm[id].includes(k)))) return null;
    x.i = Math.max(0, Math.min(x.ids.length - 1, +x.i || 0));
    if (x.res != null && !isObj(x.res)) x.res = null;
    return x;
  }
  pendingSim = validSes(parse(LS.get(TSKEY)));
  if (pendingSim && (pendingSim.kind !== 'sim' || pendingSim.res)) pendingSim = null;
  function saveTSes() { LS.set(TSKEY, tses && tses.kind === 'sim' && !tses.res ? JSON.stringify(tses) : ''); }
  function startSim() {
    const ids = simPick(); if (!ids.length) return;

  function startPrac(ids, title) { if (!ids.length) return; tses = newTSes('prac', ids, title); view = 'quiz'; render(); }
  function startPracFromHome() {
    const list = shuffle(qPool().slice()).sort((a, b) => (qStatus(a.id) === 'new' ? 0 : 1) - (qStatus(b.id) === 'new' ? 0 : 1));
    if (!list.length) return;
    const n = P.tanda ? Math.min(P.tanda, list.length) : list.length;
    startPrac(list.slice(0, n).map(q => q.id), describe() + ' · práctica');

  const codeHTML = c => c ? '<pre' + (Math.max(...c.split(String.fromCharCode(10)).map(l => l.length)) > 38 ? ' class="wide"' : '') + '>' + esc(c) + '</pre>' : '';
  const isRight = (s, id) => s.ans[id] !== undefined && s.ans[id] !== -1 && s.perm[id][s.ans[id]] === 0;

  // ---------- veredicto ----------
  function fullSims() { return T.sims.filter(x => x.n >= SIM_N); }
  function verdict() {
    const all = fullSims(), last = all.slice(-WINDOW);
    if (!last.length) return { st: 'none', all, last };
    const avg = Math.round(last.reduce((a, x) => a + x.nota, 0) / last.length * 10) / 10;
    const min = Math.min(...last.map(x => x.nota));
    const ud = {};
    for (const x of last) for (const [u, v] of Object.entries(x.ud)) { const o = ud[u] || (ud[u] = [0, 0]); o[0] += v[0]; o[1] += v[2]; }
    let weak = null;
    for (const [u, v] of Object.entries(ud)) if (v[1] && (!weak || v[0] / v[1] < weak.r)) weak = { ud: u, r: v[0] / v[1] };
    if (last.length < WINDOW) return { st: 'pending', avg, min, all, last, weak, need: WINDOW - last.length };
    return { st: avg >= GOAL && min >= FLOOR ? 'ok' : avg >= PASS ? 'mid' : 'bad', avg, min, all, last, weak };
  }
  function histHTML(v) {
    const hist = v.all.slice(-8); if (!hist.length) return '';
    const from = hist.length - Math.min(WINDOW, v.last.length);
    const y = [0, 5, 7, 10].map(k => '<span style="bottom:' + (k * 10) + '%">' + k + '</span>').join('');
    const bars = hist.map((x, j) => {

      return '<button type="button" data-tip="' + esc(fecha(x.t) + ' · ' + nf(x.nota) + ' (' + x.ok + ' bien, ' + x.bad + ' mal, ' + x.blank + ' en blanco)') + '" data-nota="' + x.nota + '" aria-label="Simulacro del ' + esc(fecha(x.t)) + ': ' + nf(x.nota) + '">' +
        '<i class="b' + (counted ? '' : ' old') + '" style="height:' + Math.max(3, x.nota * 10) + '%">' + (counted ? '<em>' + nf(x.nota) + '</em>' : '') + '</i></button>';
    }).join('');
    return '<div class="hist"><div class="hist-y" aria-hidden="true">' + y + '</div>' +
      '<div class="plot" id="plot"><i class="ref" style="bottom:50%"></i><i class="ref goal" style="bottom:70%"></i>' +
      '<div class="bars">' + bars + '</div><div class="tip" id="tip" hidden></div></div>' +
      '<p class="hist-cap">Resaltados, los que cuentan. Línea continua: objetivo ' + GOAL + '; discontinua: aprobado ' + PASS + '.</p></div>';
  }
  function bindHist() {
    const plot = document.getElementById('plot'), tip = document.getElementById('tip'); if (!plot || !tip) return;

  function verdictHTML() {

      '<button class="btn ghost" id="tprac"' + (n ? '' : ' disabled') + '>Practicar · ' + tn + '</button>' +
      (n ? '' : '<p class="empty-note">' + (P.uds.length ? 'No hay preguntas con estos filtros. Prueba con «Todas».' : 'Elige al menos una unidad para practicar.') + '</p>') +

  function renderQuiz() {
