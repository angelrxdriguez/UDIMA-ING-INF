<title>Fichas de Paradigmas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..800;1,400&family=Atkinson+Hyperlegible+Mono:wght@400..700&display=swap">
<style>
/* Layout: app de una pantalla; inicio desplazable con botón fijo abajo; estudio = ficha que se gira.
   Diseño para sesiones largas de memoria: papel cálido (sin blanco puro) y tinta casi negra; de noche, carbón cálido
   y tinta marfil (sin negro ni blanco puros). El color solo significa algo: gris = introducción, turquesa = funcional,
   violeta = lógico (cada ficha lleva el de su paradigma) y verde/ámbar/rojo = cómo te la sabías. Una sola marca de
   subrayador para los términos clave. */
:root {
  --bg: #F3EEE5;
  --surface: #FCFAF6;
  --ink: #211D18;
  --muted: #675F54;
  --line: #DFD7CA;
  --chip: #EDE6DA;
  --raised: #FCFAF6;
  --primary: #211D18;
  --primary-ink: #FCFAF6;
  --accent: #2E4C8F;
  --hi: #FFDF7A;
  --hi-ink: #211D18;
  --ok: #3F7F1F;
  --mid: #9C5E0E;
  --bad: #C0392B;
  --on-status: #FFFFFF;
  --p0: #6B6358; --p0-ink: #FFFFFF;
  --p1: #0A7F8F; --p1-ink: #FFFFFF;
  --p2: #7A4FC9; --p2-ink: #FFFFFF;
  --u: var(--muted); --u-ink: var(--surface);
  --shadow: 0 1px 2px rgba(60, 45, 25, .06), 0 8px 24px rgba(60, 45, 25, .07);
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", -apple-system, system-ui, "Segoe UI", sans-serif;
  --f-display: var(--f-body);
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-num: -apple-system, system-ui, "Segoe UI", sans-serif; /* cifras grandes: Atkinson tacha el cero y «0,0» parecía «Ø,Ø» */
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151412; --surface: #1F1D1A; --ink: #E9E3D8; --muted: #A69E91; --line: #34312C; --chip: #2A2824; --raised: #3A3731;
    --primary: #DDD5C6; --primary-ink: #151412; --accent: #A9BBF0; --hi: rgba(240, 196, 80, .2); --hi-ink: #F4D27E;
    --ok: #82C45C; --mid: #E0A240; --bad: #F0735F; --on-status: #151412;
    --p0: #A39A8E; --p0-ink: #151412; --p1: #3AA9B5; --p1-ink: #151412; --p2: #A48CF0; --p2-ink: #151412;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151412; --surface: #1F1D1A; --ink: #E9E3D8; --muted: #A69E91; --line: #34312C; --chip: #2A2824; --raised: #3A3731;
  --primary: #DDD5C6; --primary-ink: #151412; --accent: #A9BBF0; --hi: rgba(240, 196, 80, .2); --hi-ink: #F4D27E;
  --ok: #82C45C; --mid: #E0A240; --bad: #F0735F; --on-status: #151412;
  --p0: #A39A8E; --p0-ink: #151412; --p1: #3AA9B5; --p1-ink: #151412; --p2: #A48CF0; --p2-ink: #151412;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
.u1 { --u: var(--p0); --u-ink: var(--p0-ink); }
.u2, .u3 { --u: var(--p1); --u-ink: var(--p1-ink); }
.u4, .u5 { --u: var(--p2); --u-ink: var(--p2-ink); }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible, .card:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- inicio ---------- */
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.home { display: flex; flex-direction: column; gap: 22px; padding-block: 18px 24px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 44px; height: 44px; border-radius: 12px; background: var(--primary); color: var(--primary-ink);
  display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 19px; flex: none;
}
h1 { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.sub { margin: 3px 0 0; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.sync { display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.ok i { background: var(--ok); }
.sync.err i { background: var(--bad); }
h2 {
  font-family: var(--f-body); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin: 0;
}
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-size: 15px; font-weight: 700; cursor: pointer; }

.global { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.big b { font-family: var(--f-num); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); font-size: 16px; }
.stack { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--chip); }
.stack i { display: block; height: 100%; }
.stack .s-ok { background: var(--ok); } .stack .s-mid { background: var(--mid); } .stack .s-bad { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; background: var(--chip); vertical-align: -1px; }
.legend .l-ok::before { background: var(--ok); } .legend .l-mid::before { background: var(--mid); } .legend .l-bad::before { background: var(--bad); }

.uds { display: flex; flex-direction: column; gap: 8px; }
.plegend { margin: -2px 0 2px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--muted); }
.plegend span { display: inline-flex; align-items: center; gap: 6px; }
.plegend i { width: 10px; height: 10px; border-radius: 3px; background: var(--u); display: inline-block; }
.ud {
  display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 12px; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 11px 12px; cursor: pointer;
  transition: border-color .15s, background-color .15s;
}
.ud[aria-pressed="true"] { border-color: color-mix(in srgb, var(--u) 60%, var(--line)); }
.ud[aria-pressed="false"] { opacity: .6; }
.ud-glyph {
  width: 46px; height: 46px; border-radius: 11px; display: grid; place-items: center; background: var(--chip);
  font-family: var(--f-mono); font-weight: 700; font-size: 17px; color: var(--ink);
}
.ud[aria-pressed="true"] .ud-glyph { background: var(--u); color: var(--u-ink); }
.ud-txt { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ud-name { font-weight: 700; font-size: 16px; line-height: 1.25; }
.ud-name small { font-family: var(--f-mono); font-weight: 700; font-size: 12.5px; color: var(--muted); margin-right: 6px; }
.ud-bar { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; display: flex; }
.ud-bar i { display: block; height: 100%; }
.ud-num { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ud-check {
  width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; margin-left: auto; margin-top: 4px;
}
.ud[aria-pressed="true"] .ud-check { background: var(--primary); border-color: var(--primary); }
.ud-check svg { width: 13px; height: 13px; stroke: var(--primary-ink); opacity: 0; }
.ud[aria-pressed="true"] .ud-check svg { opacity: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 15px;
  cursor: pointer; line-height: 1.2; text-align: left;
}
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.chip small { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 9px 6px; font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 12px; padding: 11px 14px; cursor: pointer; text-align: left; width: 100%;
}
.toggle span { display: flex; flex-direction: column; gap: 2px; }
.toggle small { color: var(--muted); font-size: 14px; }
.sw { width: 44px; height: 26px; border-radius: 13px; background: var(--chip); position: relative; flex: none; transition: background-color .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s; }
.toggle[aria-pressed="true"] .sw { background: var(--primary); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(18px); }

.howto { color: var(--muted); font-size: 14.5px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.howto p { margin: 0; }
.howto b { color: var(--ink); }
.reset { align-self: flex-start; background: none; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 14px; color: var(--muted); cursor: pointer; }
.reset.armed { border-color: var(--bad); color: var(--bad); font-weight: 700; }

.dock { border-top: 1px solid var(--line); background: var(--bg); padding-block: 12px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.btn {
  border: 0; border-radius: 14px; padding: 15px 18px; font-weight: 700; font-size: 17px; cursor: pointer;
  background: var(--primary); color: var(--primary-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.empty-note { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--bad); }

/* ---------- estudio ---------- */
.studybar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding-block: 10px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; stroke: var(--ink); }
.prog { height: 6px; border-radius: 4px; background: var(--chip); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ink); opacity: .75; border-radius: 4px; transition: width .25s; }
.count { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); font-weight: 700; min-width: 4.5em; text-align: right; }
.stage { flex: 1; min-height: 0; overflow-y: auto; padding-block: 6px 14px; perspective: 1400px; }
.card { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; outline: none; border-radius: 18px; cursor: pointer; }
.inner { display: grid; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2, .7, .2, 1); }
.card.flipped .inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface);
  border: 1px solid var(--line); border-top: 6px solid var(--u); border-radius: 18px; box-shadow: var(--shadow); min-height: min(62vh, 520px);
  display: flex; flex-direction: column; padding: 16px 20px 16px; gap: 16px;
}
.back { transform: rotateY(180deg); }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14px; color: var(--muted); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.udtag { font-family: var(--f-mono); font-weight: 700; font-size: 12.5px; background: var(--u); color: var(--u-ink); padding: 2px 7px; border-radius: 6px; line-height: 1.4; white-space: nowrap; }
.eyebrow .star { color: var(--ink); font-weight: 700; margin-left: auto; }
.serie { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; font-weight: 700; color: var(--ink); }
.serie .dots { display: inline-flex; gap: 4px; }
.serie .dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--u); display: block; }
.serie .dots i.on { background: var(--u); }
.serie .dots i.cur { transform: scale(1.3); }
.serie .nt { font-family: var(--f-mono); font-size: 12.5px; background: var(--chip); color: var(--ink); padding: 2px 7px; border-radius: 6px; }
.q { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 6.7vw, 29px); line-height: 1.25; margin: 0; text-wrap: pretty; flex: 1; display: flex; align-items: center; }
.tap { font-size: 14px; color: var(--muted); text-align: center; margin: 0; }
.q-small { font-weight: 700; font-size: 16px; color: var(--muted); margin: 0; line-height: 1.35; }
.ans { font-size: 20px; line-height: 1.5; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.ans p { margin: 0; }
.ans ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.ans li { padding-left: 20px; position: relative; }
.ans li::before { content: ""; position: absolute; left: 3px; top: .6em; width: 8px; height: 8px; border-radius: 2px; background: var(--u); }
mark { background: linear-gradient(transparent 50%, var(--hi) 50%, var(--hi) 94%, transparent 94%); color: var(--hi-ink); font-weight: 700; padding: 0 1px; border-radius: 1px; }
code, pre { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--chip); padding: 1px 5px; border-radius: 5px; }
pre {
  margin: 0; font-family: var(--f-mono); font-size: 14.5px; line-height: 1.55; background: var(--chip); border-radius: 10px;
  padding: 11px 12px; overflow-x: auto; white-space: pre; -webkit-user-select: text; user-select: text;
}
.src { font-size: 13.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.tint { position: absolute; inset: 0; border-radius: 18px; pointer-events: none; opacity: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 26px; }
.tint.good { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.tint.again { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.card.out-r { transition: transform .22s ease-in, opacity .22s; transform: translateX(110%) rotate(6deg); opacity: 0; }
.card.out-l { transition: transform .22s ease-in, opacity .22s; transform: translateX(-110%) rotate(-6deg); opacity: 0; }
.card.in { animation: cardin .22s ease-out; }
@keyframes cardin { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.actions { padding-block: 10px 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--line); }
.actions.one { grid-template-columns: 1fr; }
.rate {
  --c: var(--ok); border: 1.5px solid color-mix(in srgb, var(--c) 70%, var(--surface)); background: color-mix(in srgb, var(--c) 14%, var(--surface));
  border-radius: 14px; padding: 12px 6px; font-weight: 700; font-size: 16px; cursor: pointer; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.rate::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-bottom: 2px; }
.rate small { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.rate.again { --c: var(--bad); } .rate.hard { --c: var(--mid); } .rate.good { --c: var(--ok); }

/* ---------- resumen ---------- */
.done { display: flex; flex-direction: column; gap: 18px; padding-block: 28px 24px; }
.done h1 { font-size: 30px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.tile b { font-family: var(--f-num); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
.tile span { font-size: 14px; color: var(--muted); }
.tile.ok b { color: var(--ok); } .tile.mid b { color: var(--mid); } .tile.bad b { color: var(--bad); }
.done .btn { width: 100%; }
.miss { display: flex; flex-direction: column; gap: 6px; }
.miss li { font-size: 15.5px; }
.miss ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* ---------- lista ---------- */
.listbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.listbar h2 { font-size: 13px; }
.list { display: flex; flex-direction: column; gap: 10px; padding-block: 14px 28px; }
.list h3 { font-family: var(--f-display); font-size: 19px; font-weight: 800; margin: 14px 0 2px; display: flex; align-items: center; gap: 8px; }
.list h3 .udtag { font-size: 12px; }
.item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--u); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; cursor: pointer; text-align: left; width: 100%; }
.item .iq { font-weight: 700; font-size: 16px; line-height: 1.35; display: flex; gap: 8px; justify-content: space-between; }
.item .iq em { font-style: normal; font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.item .ans { font-size: 16px; gap: 6px; }
.item .ans li { padding-left: 17px; }
.item .ans li::before { width: 7px; height: 7px; }
.item pre { font-size: 13.5px; }
.list.hide-a .item:not(.open) .ia { display: none; }
.st-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--chip); vertical-align: 1px; }
.st-dot.s-ok { background: var(--ok); } .st-dot.s-mid { background: var(--mid); } .st-dot.s-bad { background: var(--bad); }

/* ---------- modo test: inicio ---------- */
.seg.modes { border-radius: 13px; padding: 4px; gap: 4px; }
.seg.modes button { padding: 10px 6px; font-size: 16px; border-radius: 10px; }
.seg.modes small { font-weight: 400; font-size: 13px; margin-left: 5px; font-variant-numeric: tabular-nums; }
.verdict { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.v-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.v-top > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.v-state { font-family: var(--f-display); font-weight: 800; font-size: 25px; line-height: 1.15; margin: 0; text-wrap: balance; display: flex; align-items: center; gap: 8px; }
.v-state svg { width: 22px; height: 22px; stroke: currentColor; flex: none; }
.v-state.ok { color: var(--ok); } .v-state.mid { color: var(--mid); } .v-state.bad { color: var(--bad); }
.v-avg { text-align: right; flex: none; display: flex; flex-direction: column; gap: 2px; }
.v-avg b { font-family: var(--f-num); font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.v-avg span { font-size: 13px; color: var(--muted); }
.v-text { margin: 0; font-size: 15.5px; color: var(--muted); }
.v-text b { color: var(--ink); }
.v-foot { margin: 0; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; font-variant-numeric: tabular-nums; }
.hist { display: grid; grid-template-columns: 20px 1fr; gap: 0 8px; padding-top: 16px; }

<script>
(function () {
  'use strict';
  const CARDS = [{"id":"ud1-001","ud":1,"tema":"Qué es un paradigma","q":"¿Qué es un paradigma de programación según las diapositivas?","a":"Un **modelo de referencia conceptual**: define la **filosofía** y las **directrices arquitectónicas** para construir software.","src":"S1 diap. 3","imp":1},{"id":"ud1-002","ud":1,"tema":"Qué es un paradigma","q":"¿Qué fórmula resume de qué se compone un programa?","a":"**Algoritmo + Estructuras de Datos = Programa**.","src":"S1 diap. 3","imp":1},{"id":"ud1-003","ud":1,"tema":"Qué es un paradigma","q":"¿Qué diferencia hay entre paradigma y metodología?","a":"• **Paradigma**: la forma arquitectónica y visión del mundo.\n• **Metodología**: la secuencia de pasos para construirlo.","src":"S1 diap. 3","imp":1},{"id":"ud1-004","ud":1,"tema":"Qué es un paradigma","q":"Según el resumen, ¿qué es un paradigma y en qué influye?","a":"Un modelo o enfoque que define la **forma de pensar** y estructurar soluciones. Influye en cómo se diseñan los algoritmos, se estructuran los datos y se organiza el código.","src":"Resumen UD1 p. 1","imp":2},{"id":"ud1-005","ud":1,"tema":"Qué es un paradigma","q":"¿Qué diferencia a los lenguajes de bajo nivel de los de alto nivel?","a":"• **Bajo nivel**: cerca del hardware, control directo de registros y memoria. Ej.: ensamblador.\n• **Alto nivel**: abstracción; fáciles de escribir, entender y mantener. Ej.: Python, Java, C++.","src":"Resumen UD1 p. 1","imp":2},{"id":"ud1-006","ud":1,"tema":"Qué es un paradigma","q":"¿En qué tres categorías clasifica Robert W. Floyd los paradigmas?","a":"• Los que soportan técnicas de **bajo nivel** (cerca del hardware)\n• Los que usan **métodos o patrones** de diseño de algoritmos\n• Los que permiten soluciones de **alto nivel** (abstracción)","src":"Resumen UD1 p. 1","imp":1},{"id":"ud1-007","ud":1,"tema":"Taxonomía de alto nivel","q":"¿En qué tres familias se dividen las soluciones de alto nivel?","a":"• **Procedimental**\n• **Declarativa**\n• **Demostrativa**","src":"S1 diap. 4","imp":1,"serie":"Taxonomía de soluciones de alto nivel","n":1,"total":4},{"id":"ud1-008","ud":1,"tema":"Taxonomía de alto nivel","q":"Taxonomía: ¿qué describe la solución procedimental y qué paradigmas incluye?","a":"Describe **etapa a etapa CÓMO** obtener la solución.\nIncluye: **imperativo** y **orientado a objetos**.","src":"S1 diap. 4","imp":1,"serie":"Taxonomía de soluciones de alto nivel","n":2,"total":4},{"id":"ud1-009","ud":1,"tema":"Taxonomía de alto nivel","q":"Taxonomía: ¿qué describe la solución declarativa y qué incluye?","a":"Describe **QUÉ** se desea obtener, sin especificar cómo procesarlo.\nIncluye: transformación, formularios y restricciones.","src":"S1 diap. 4","imp":1,"serie":"Taxonomía de soluciones de alto nivel","n":3,"total":4},{"id":"ud1-010","ud":1,"tema":"Taxonomía de alto nivel","q":"Taxonomía: ¿qué hace la solución demostrativa y qué incluye?","a":"Aprende el **MÉTODO** a partir de ejemplos (**Bottom-Up**).\nIncluye: inducción, redes neuronales y genéticos.","src":"S1 diap. 4","imp":1,"serie":"Taxonomía de soluciones de alto nivel","n":4,"total":4},{"id":"ud1-011","ud":1,"tema":"Paradigma imperativo","q":"¿En qué se basa el paradigma procedimental u operacional?","a":"En una **secuencia computacional** ejecutada **etapa a etapa**.","src":"S1 diap. 5","imp":2},{"id":"ud1-012","ud":1,"tema":"Paradigma imperativo","q":"¿Cuál es el concepto clave del paradigma procedimental?","a":"Los **efectos de lado** (side effects): las variables están ligadas a direcciones de memoria y la ejecución las actualiza repetidamente; el **valor final** en memoria es el resultado.","src":"S1 diap. 5","imp":1,"code":"x = 1    // entrada\nx = 5    // sobrescribe la celda\nx = 10   // valor final = resultado"},{"id":"ud1-013","ud":1,"tema":"Paradigma imperativo","q":"¿En qué arquitectura se apoya el paradigma imperativo?","a":"En la **arquitectura de Von Neumann**: la CPU lee y escribe en la memoria (ciclo **fetch / execute**).","src":"S1 diap. 6","imp":1},{"id":"ud1-014","ud":1,"tema":"Paradigma imperativo","q":"Según la diapositiva, ¿cuál es la esencia del paradigma imperativo?","a":"«El **cálculo iterativo paso a paso** y la **asignación continua**.»","src":"S1 diap. 6","imp":2},{"id":"ud1-015","ud":1,"tema":"Paradigma imperativo","q":"¿Cuáles son los tres componentes vitales del paradigma imperativo?","a":"• **Celdas de memoria**\n• **Asignación**\n• **Repetición**","src":"S1 diap. 6","imp":1,"serie":"Componentes vitales del imperativo","n":1,"total":4},{"id":"ud1-016","ud":1,"tema":"Paradigma imperativo","q":"Imperativo: ¿qué son las celdas de memoria?","a":"Variables que almacenan valores (**aliasing**).","src":"S1 diap. 6","imp":2,"serie":"Componentes vitales del imperativo","n":2,"total":4},{"id":"ud1-017","ud":1,"tema":"Paradigma imperativo","q":"Imperativo: ¿qué es la asignación?","a":"Operaciones que **fuerzan el pensamiento adaptado a la máquina**.","src":"S1 diap. 6","imp":2,"serie":"Componentes vitales del imperativo","n":3,"total":4},{"id":"ud1-018","ud":1,"tema":"Paradigma imperativo","q":"Imperativo: ¿qué es la repetición?","a":"Secuencias de pasos elementales repetidos (**loops**).","src":"S1 diap. 6","imp":2,"serie":"Componentes vitales del imperativo","n":4,"total":4},{"id":"ud1-019","ud":1,"tema":"Paradigma imperativo","q":"Imperativo: ¿qué diferencia hay entre orientado a expresiones y a sentencias?","a":"• **Orientado a expresiones**: matemáticas simples.\n• **Orientado a sentencias**: adaptadas a la máquina.","src":"S1 diap. 6","imp":2,"code":"x > y                 // expresión\nif x>y then v:=true   // sentencia"},{"id":"ud1-020","ud":1,"tema":"Paradigma imperativo","q":"Según el resumen, ¿en qué se basa el imperativo? Cita ejemplos.","a":"En **instrucciones explícitas** que modifican el estado (asignaciones, bucles, estructuras de control), con variables, punteros y direcciones de memoria.\nEj.: **C, Pascal, Modula-2, Fortran**.","src":"Resumen UD1 p. 2","imp":1},{"id":"ud1-021","ud":1,"tema":"Orientación a objetos","q":"¿Cómo definen las diapositivas la orientación a objetos?","a":"Una filosofía de **componentes reutilizables** (Objetos Integrados de Software) para **modelar el mundo real**.","src":"S1 diap. 7","imp":2},{"id":"ud1-022","ud":1,"tema":"Orientación a objetos","q":"¿Qué es un objeto?","a":"Un **elemento autónomo** con nombre, **estado (atributos)** y **servicios (métodos)**.","src":"S1 diap. 7","imp":1},{"id":"ud1-023","ud":1,"tema":"Orientación a objetos","q":"¿Cuáles son los pilares de la orientación a objetos según las diapositivas?","a":"• **Tipos abstractos de datos** (clases)\n• **Herencia**\n• **Polimorfismo** y enlace dinámico","src":"S1 diap. 7","imp":1},{"id":"ud1-024","ud":1,"tema":"Orientación a objetos","q":"¿Qué enseña el «problema de la carta» sobre los objetos?","a":"El solicitante no necesita saber **cómo** ejecuta el objeto la acción, solo **qué servicios** pedirle mediante **mensajes** (p. ej., Poner_Sello() al Sobre).","src":"S1 diap. 8","imp":2},{"id":"ud1-025","ud":1,"tema":"Orientación a objetos","q":"Según el resumen, ¿qué características tiene el paradigma orientado a objetos?","a":"• Promueve modularidad y reutilización\n• Abstracción de datos con **clases y objetos**\n• Gestión automática de memoria (en algunos lenguajes)\n• **Herencia** (simple o múltiple) y **polimorfismo**","src":"Resumen UD1 p. 2","imp":2},{"id":"ud1-026","ud":1,"tema":"Orientación a objetos","q":"Cita lenguajes orientados a objetos.","a":"**C++, Java, C#, VB.NET**.","src":"Resumen UD1 p. 2","imp":1},{"id":"ud1-027","ud":1,"tema":"Orientación a objetos","q":"¿Qué es el paradigma orientado a agentes? Ejemplos.","a":"Los objetos (**agentes**) actúan **autónomamente** para alcanzar una solución global o local.\nEj.: JADE (Java Agent Development Framework), AutoGen.","src":"Resumen UD1 p. 2","imp":2},{"id":"ud1-028","ud":1,"tema":"Familia declarativa","q":"¿Cuál es el gran cambio del paradigma declarativo?","a":"Especificar **QUÉ** debe tener la solución, no los pasos: se elimina el **control de flujo** y desaparecen los **efectos de lado**.","src":"S1 diap. 9","imp":1},{"id":"ud1-029","ud":1,"tema":"Familia declarativa","q":"En el paradigma declarativo, ¿qué hacen las variables?","a":"Almacenan **valores intermedios**, pero **no actualizan** estados de información previos.","src":"S1 diap. 9","imp":2},{"id":"ud1-030","ud":1,"tema":"Familia declarativa","q":"¿Qué contraste muestran x = x + 1 e y = f(x)?","a":"• x = x + 1: el programador **muta el estado** (cómo).\n• y = f(x): el sistema resuelve una relación matemática **inmutable** (qué).","src":"S1 diap. 9","imp":1},{"id":"ud1-031","ud":1,"tema":"Familia declarativa","q":"Según el resumen, ¿qué subparadigmas incluye el declarativo?","a":"El **funcional** y el **lógico**. (Las diapositivas ponen en cambio transformación, formularios y restricciones.)","src":"Resumen UD1 p. 3","imp":2},{"id":"ud1-032","ud":1,"tema":"Familia declarativa","q":"¿En qué se basa el paradigma funcional? Ejemplos.","a":"En **funciones matemáticas puras**.\nEj.: **Haskell, Lisp, Hope**.","src":"Resumen UD1 p. 3","imp":1},{"id":"ud1-033","ud":1,"tema":"Familia declarativa","q":"¿Qué características principales tiene el paradigma funcional?","a":"• **Sin efectos secundarios** (no modifica variables externas)\n• **Inmutabilidad** y **composición funcional**","src":"Resumen UD1 p. 3","imp":2},{"id":"ud1-034","ud":1,"tema":"Familia declarativa","q":"¿En qué se basa el paradigma lógico? Ejemplo.","a":"En la lógica matemática mediante **predicados**: define **hechos y reglas** y resuelve problemas por inferencias lógicas.\nEj.: **Prolog**.","src":"Resumen UD1 p. 3","imp":1},{"id":"ud1-035","ud":1,"tema":"Transformación de estados","q":"¿En qué consiste el paradigma de transformación de estados?","a":"Unos **datos iniciales** se transforman hasta un **estado final** mediante reglas u operadores; el problema es hallar el **camino más corto** en un grafo de estados.","src":"S1 diap. 10","imp":1},{"id":"ud1-036","ud":1,"tema":"Transformación de estados","q":"¿Cuáles son las cuatro estrategias de búsqueda en grafos?","a":"• Profundidad (LIFO)\n• Amplitud\n• Backtracking\n• Mejor primero (A*)","src":"S1 diap. 11","imp":2,"serie":"Estrategias de búsqueda en grafos","n":1,"total":5},{"id":"ud1-037","ud":1,"tema":"Transformación de estados","q":"Búsqueda en profundidad (LIFO): ¿cómo explora?","a":"Explora las ramas **verticalmente** hasta el final.","src":"S1 diap. 11","imp":2,"serie":"Estrategias de búsqueda en grafos","n":2,"total":5},{"id":"ud1-038","ud":1,"tema":"Transformación de estados","q":"Búsqueda en amplitud: ¿cómo recorre el árbol?","a":"**Horizontalmente**, por **niveles**.","src":"S1 diap. 11","imp":2,"serie":"Estrategias de búsqueda en grafos","n":3,"total":5},{"id":"ud1-039","ud":1,"tema":"Transformación de estados","q":"Búsqueda: ¿qué hace el backtracking?","a":"**Retrocede** ante un **callejón sin salida**.","src":"S1 diap. 11","imp":2,"serie":"Estrategias de búsqueda en grafos","n":4,"total":5},{"id":"ud1-040","ud":1,"tema":"Transformación de estados","q":"Búsqueda: ¿qué usa la estrategia Mejor primero (A*)?","a":"Una **heurística**: **f(n) = g(n) + h(n)**.","src":"S1 diap. 11","imp":2,"serie":"Estrategias de búsqueda en grafos","n":5,"total":5},{"id":"ud1-041","ud":1,"tema":"Formularios y restricciones","q":"¿En qué se basa el paradigma de formularios?","a":"En la resolución de **sistemas de ecuaciones interdependientes**.","src":"S1 diap. 12","imp":1},{"id":"ud1-042","ud":1,"tema":"Formularios y restricciones","q":"Formularios: ¿qué significa que está «dirigido por la demanda»?","a":"Una operación **solo se ejecuta** si **todos sus operandos** están disponibles.","src":"S1 diap. 12","imp":2},{"id":"ud1-043","ud":1,"tema":"Formularios y restricciones","q":"Formularios: ¿qué es la evaluación perezosa en una hoja de cálculo?","a":"Una celda que depende de otras (F7, a partir de D3 y E3) **solo se calcula cuando se demanda**.","src":"S1 diap. 12","imp":2},{"id":"ud1-044","ud":1,"tema":"Formularios y restricciones","q":"¿De qué es núcleo el paradigma de formularios? Ejemplo típico.","a":"Del **Desarrollo de Usuario Final (EUD)**.\nEj.: hojas de cálculo como **Excel**.","src":"S1 diap. 12; Resumen UD1 p. 3","imp":2},{"id":"ud1-045","ud":1,"tema":"Formularios y restricciones","q":"¿Cómo funciona el modelado por restricciones?","a":"Las relaciones entre variables se expresan con **inecuaciones y límites**; el sistema busca **cualquier estado** que satisfaga todas las reglas.","src":"S1 diap. 13","imp":1},{"id":"ud1-046","ud":1,"tema":"Formularios y restricciones","q":"Restricciones: ¿qué objetivo típico tiene? Pon un ejemplo.","a":"**Maximizar o minimizar** recursos (**programación lineal**), buscando el punto óptimo.\nEj.: minimizar costos de transporte con un inventario limitado.","src":"S1 diap. 13","imp":2},{"id":"ud1-047","ud":1,"tema":"Formularios y restricciones","q":"Restricciones: ¿qué dominios pueden tener las variables?","a":"**Continuos, enteros, finitos o mixtos**.","src":"S1 diap. 13","imp":2},{"id":"ud1-048","ud":1,"tema":"Demostrativo y otros","q":"¿En qué consiste el enfoque demostrativo (Bottom-Up)?","a":"En vez de abstraer un modelo general (**Top-Down**), parte de **ejemplos particulares** para **inferir una regla** o comportamiento.","src":"S1 diap. 14","imp":1},{"id":"ud1-049","ud":1,"tema":"Demostrativo y otros","q":"Demostrativo: ¿qué hacen los «sistemas que infieren»?","a":"Extraen **similitudes** y **generalizan**.\nEj.: redes neuronales, algoritmos genéticos.","src":"S1 diap. 14","imp":2},{"id":"ud1-050","ud":1,"tema":"Demostrativo y otros","q":"Demostrativo: ¿qué es la programación asistida?","a":"El sistema **observa acciones repetitivas** y genera un **programa invisible**.","src":"S1 diap. 14","imp":2},{"id":"ud1-051","ud":1,"tema":"Demostrativo y otros","q":"Según el resumen, ¿qué ejemplos hay de paradigmas demostrativos/inductivos?","a":"• Redes neuronales artificiales\n• Programación genética\n• Algoritmos evolutivos\nUso frecuente en **IA** y **aprendizaje automático**.","src":"Resumen UD1 p. 3","imp":2},{"id":"ud1-052","ud":1,"tema":"Demostrativo y otros","q":"¿Qué ejemplos da el resumen del paradigma Dataflow?","a":"**Apache NiFi** y **Pentaho Data Integration**.","src":"Resumen UD1 p. 3","imp":2},{"id":"ud1-053","ud":1,"tema":"Demostrativo y otros","q":"¿Qué caracteriza al paradigma orientado a eventos?","a":"El estado del sistema lo determinan los **eventos** o sucesos que ocurren y **cómo se manejan**.\nEj.: Excel, JavaScript, C#.","src":"Resumen UD1 p. 4","imp":2},{"id":"ud1-054","ud":1,"tema":"Espectro y elección","q":"¿Qué criterio ordena el espectro de los paradigmas y qué tramos tiene?","a":"La **dependencia del orden de evaluación** (quién dicta la secuencia de control):\n• Control explícito\n• Ecuaciones / flujo\n• Especificación abstracta","src":"S1 diap. 15","imp":1,"serie":"Espectro de los paradigmas","n":1,"total":4},{"id":"ud1-055","ud":1,"tema":"Espectro y elección","q":"Espectro: ¿qué paradigmas están en el «control explícito»?","a":"Los **procedimentales** (imperativo, POO): **alto acoplamiento a efectos de lado**.","src":"S1 diap. 15","imp":1,"serie":"Espectro de los paradigmas","n":2,"total":4},{"id":"ud1-056","ud":1,"tema":"Espectro y elección","q":"Espectro: ¿qué son los seudodeclarativos?","a":"El **funcional** y el **lógico** (tramo ecuaciones / flujo): la secuencia de control está **parcialmente requerida**.","src":"S1 diap. 15","imp":1,"serie":"Espectro de los paradigmas","n":3,"total":4},{"id":"ud1-057","ud":1,"tema":"Espectro y elección","q":"Espectro: ¿qué son los declarativos puros?","a":"Las **restricciones** (especificación abstracta): el orden de evaluación es **irrelevante**.","src":"S1 diap. 15","imp":1,"serie":"Espectro de los paradigmas","n":4,"total":4},{"id":"ud1-058","ud":1,"tema":"Espectro y elección","q":"¿Hay un paradigma mejor que los demás?","a":"No. **Ningún paradigma es inherentemente mejor**: su efectividad radica en su **alineación con la naturaleza del problema**.","src":"S1 diap. 16","imp":1},{"id":"ud1-059","ud":1,"tema":"Espectro y elección","q":"¿Cuál es el paso crítico antes de trazar el plano metodológico?","a":"**Elegir la arquitectura correcta** (el paradigma). «El mapa no es el territorio, es la brújula.»","src":"S1 diap. 16","imp":2},{"id":"ud1-060","ud":1,"tema":"Estado del arte 2025–26","q":"¿Cuál es la tendencia dominante de los paradigmas en 2025–2026?","a":"El **multiparadigma pragmático**: no «FP vs OOP», sino cómo **combinarlos** según la capa y el problema.","src":"Estado del arte p. 1","imp":2},{"id":"ud1-061","ud":1,"tema":"Estado del arte 2025–26","q":"Arquitectura multiparadigma actual: ¿qué paradigma se usa en cada capa?","a":"• Dominio: **OOP** (entidades con identidad)\n• Lógica de negocio: **FP**\n• Eventos/streams: **reactiva**\n• Datos: declarativo (SQL); integración: mensajería asíncrona","src":"Estado del arte p. 3","imp":2},{"id":"ud1-062","ud":1,"tema":"Estado del arte 2025–26","q":"Estado del arte: ¿qué limitaciones se reconocen a la OOP?","a":"Acoplamiento por **herencia**, **estado mutable compartido** (concurrencia) y boilerplate. Hoy se prefiere **composición sobre herencia**.","src":"Estado del arte p. 1","imp":2},{"id":"ud1-063","ud":1,"tema":"Estado del arte 2025–26","q":"¿Cuál es el modelo mental de la programación reactiva?","a":"**Flujos de datos en el tiempo**, composición asíncrona no bloqueante y **backpressure** para evitar la saturación.","src":"Estado del arte p. 2","imp":2},{"id":"ud1-064","ud":1,"tema":"Estado del arte 2025–26","q":"¿Qué paradigmas emergentes van ligados a nuevo hardware?","a":"• **Neuromórfico** (inspirado en el cerebro)\n• **Cuántico**\n• Computación en memoria\n• «No digitales»: analógica, reservorio físico, evolution in materio","src":"Estado del arte pp. 2–3","imp":2},{"id":"ud2-001","ud":2,"tema":"Origen y enfoque","q":"¿Quién sentó la base teórica del paradigma funcional y cuándo?","a":"**Alonzo Church**, en **1934**, con el **cálculo lambda** (λ-cálculo): un modelo matemático de computación para sus estudios sobre computabilidad.\n(Las diapositivas de la UD3 dicen **1936**.)","src":"Cap. 2 p. 1; Clase UD2 ▶ 01:52","imp":1},{"id":"ud2-002","ud":2,"tema":"Origen y enfoque","q":"Procedimental frente a declarativo: ¿qué pregunta responde cada uno?","a":"• Procedimental (imperativo): **cómo** resolver el problema, paso a paso\n• Declarativo (funcional): **qué** se quiere conseguir; evalúa expresiones en vez de ejecutar comandos","src":"Clase UD2 ▶ 03:24; Cap. 2 p. 1","imp":1},{"id":"ud2-003","ud":2,"tema":"Origen y enfoque","q":"¿Por qué dominó al principio el procedimental y hoy se retoma el funcional?","a":"Los primeros computadores eran muy básicos (modelo de **von Neumann**: un procesador y acceso a memoria) y el funcional pide más hardware. Hoy hay **multinúcleo** y mucha memoria.","src":"Clase UD2 ▶ 03:24 y 04:55","imp":2},{"id":"ud2-004","ud":2,"tema":"Origen y enfoque","q":"¿De qué dos formas se suele especificar una función?","a":"**Declarativamente** (matemáticamente) o **procedimentalmente**. Se diferencian en si se especifica explícitamente la **secuencia de ejecución**.","src":"Cap. 2 p. 3–5 y 25","imp":1,"serie":"Especificación de una función","n":1,"total":3},{"id":"ud2-005","ud":2,"tema":"Origen y enfoque","q":"Especificación procedimental: ¿qué es y qué origina?","a":"Se indica una **secuencia de control**: el orden del cálculo se fija explícitamente. Ese orden impuesto origina una **sobrespecificación**, típica de las soluciones procedimentales.","src":"Cap. 2 p. 3","imp":2,"serie":"Especificación de una función","n":2,"total":3},{"id":"ud2-006","ud":2,"tema":"Origen y enfoque","q":"Especificación declarativa: ¿cómo se define la función?","a":"Como en matemáticas: una colección de **transformaciones disjuntas** (condición → expresión) **sin orden de ejecución**. Ej.: par(x) = {resto(x,2)==0 → true; resto(x,2)!=0 → false}","src":"Cap. 2 p. 4","imp":2,"serie":"Especificación de una función","n":3,"total":3},{"id":"ud2-007","ud":2,"tema":"Pilares del paradigma","q":"¿Cuáles son las características (pilares) del paradigma funcional?","a":"Transparencia referencial · composición funcional · orden superior · sin estado · polimorfismo paramétrico · evaluación diferida.\n(En clase son **5 pilares**: el 5.º une polimorfismo y evaluación diferida.)","src":"Cap. 2 p. 5; Clase UD2 ▶ 06:30","imp":1,"serie":"Características del paradigma funcional","n":1,"total":7},{"id":"ud2-008","ud":2,"tema":"Pilares del paradigma","q":"Pilar funcional: ¿qué es la transparencia referencial?","a":"Se comporta como una **función matemática** (caja negra): con la **misma entrada**, siempre la misma salida, devuelta solo por el **nombre de la función**.","src":"Cap. 2 p. 1 y 5; Clase UD2 ▶ 09:42","imp":1,"serie":"Características del paradigma funcional","n":2,"total":7},{"id":"ud2-009","ud":2,"tema":"Pilares del paradigma","q":"Pilar funcional: ¿qué es la composición funcional?","a":"El programa es una función compuesta de otras más simples: el **resultado** de una es el **argumento de entrada** de otra: z = g(f(x)).","src":"Cap. 2 p. 1 y 8; Clase UD2 ▶ 14:26","imp":1,"serie":"Características del paradigma funcional","n":3,"total":7},{"id":"ud2-010","ud":2,"tema":"Pilares del paradigma","q":"Pilar funcional: ¿qué es una función de orden superior?","a":"La que admite que sus **argumentos** y su **valor de retorno** sean otras funciones. También se llama de primera clase o funcional; si no, es de **primer orden**.","src":"Cap. 2 p. 1, 9 y 26","imp":1,"serie":"Características del paradigma funcional","n":4,"total":7},{"id":"ud2-011","ud":2,"tema":"Pilares del paradigma","q":"Pilar funcional: ¿qué significa que no existe el estado?","a":"No hay **celda de memoria** que se modifique: los resultados intermedios se guardan como **valores locales** nuevos. Nada se actualiza.","src":"Cap. 2 p. 1 y 11; Clase UD2 ▶ 18:11","imp":1,"serie":"Características del paradigma funcional","n":5,"total":7},{"id":"ud2-012","ud":2,"tema":"Pilares del paradigma","q":"Pilar funcional: ¿qué es una función polimórfica?","a":"La que puede asumir diferentes formas o **manipular tipos diferentes** de objetos. Tres tipos: sobrecarga, dinámico y paramétrico.","src":"Cap. 2 p. 1 y 12","imp":2,"serie":"Características del paradigma funcional","n":6,"total":7},{"id":"ud2-013","ud":2,"tema":"Pilares del paradigma","q":"Pilar funcional: ¿qué es la evaluación retardada o diferida?","a":"Los argumentos **no se evalúan hasta que se necesitan** («call by need»): se evalúan cuando los necesita el cuerpo de la función.","src":"Cap. 2 p. 1 y 15; Clase UD2 ▶ 24:23","imp":2,"serie":"Características del paradigma funcional","n":7,"total":7},{"id":"ud2-014","ud":2,"tema":"Transparencia referencial","q":"¿De dónde viene la gran diferencia entre función matemática e informática?","a":"De la **variable modificable**: un parámetro matemático es un valor fijo; uno informático es una **celda de memoria** que puede cambiar y producir un efecto lateral.","src":"Cap. 2 p. 5","imp":2},{"id":"ud2-015","ud":2,"tema":"Transparencia referencial","q":"¿Qué es un efecto lateral (efecto de lado)?","a":"La función **modifica o depende de algo externo** (una global, un argumento…): con la misma entrada puede dar resultados distintos. Rompe la **transparencia referencial** y dificulta depurar.","src":"Cap. 2 p. 5; Guía Lisp p. 5; Clase UD2 ▶ 12:51","imp":1,"code":"(defvar *acumulador* 0)\n(defun acumular-impuro (x) ; impura: muta un estado externo\n  (setf *acumulador* (+ *acumulador* x)))\n(defun sumar-puro (a b) (+ a b)) ; pura"},{"id":"ud2-016","ud":2,"tema":"Transparencia referencial","q":"¿En qué casos aparecen efectos laterales?","a":"• Modificar **variables globales**\n• Modificar argumentos **por referencia**\n• Variables **static** que guardan su valor entre llamadas\n• E/S o consultar el hardware o el estado del sistema","src":"Cap. 2 p. 6–7; Clase UD2 ▶ 12:51","imp":2},{"id":"ud2-017","ud":2,"tema":"Transparencia referencial","q":"Ejemplo sw: fun(2)+fun(3) da 11 y fun(3)+fun(2) da 7. ¿Qué demuestra?","a":"Que fun **no tiene transparencia referencial**: la asignación **sw = !sw** cambia una global en cada llamada y la suma deja de ser conmutativa.","src":"Cap. 2 p. 5–6; Clase UD2 ▶ 11:15","imp":2},{"id":"ud2-018","ud":2,"tema":"Transparencia referencial","q":"¿Por qué es tan importante la transparencia referencial?","a":"• Es **indispensable** para la composición de funciones\n• Permite sustituir **iguales por iguales** («valores por valores»)\n• Facilita **verificar la corrección** de los programas","src":"Cap. 2 p. 8 y 26","imp":2},{"id":"ud2-019","ud":2,"tema":"Composición y orden superior","q":"¿Qué requisito necesita la composición funcional?","a":"Que las funciones tengan **transparencia referencial**. Los imperativos también admiten suma(cuadrado(mayor(x,y))), pero solo da resultados adecuados si hay transparencia.","src":"Cap. 2 p. 8–9; Clase UD2 ▶ 14:26","imp":1},{"id":"ud2-020","ud":2,"tema":"Composición y orden superior","q":"Composición funcional: ¿cómo se plantea un problema?","a":"Como una **cadena de funciones**, no como una lista de tareas. Ej. de clase: una función selecciona los pares de una lista y otra suma ese resultado.","src":"Clase UD2 ▶ 14:26; Guía Lisp p. 7","imp":2,"code":"; la salida de mapcar alimenta a reduce\n(reduce #'+ (mapcar (lambda (x) (* x x)) '(2 3 4)))\n; → 29 (4 + 9 + 16)"},{"id":"ud2-021","ud":2,"tema":"Composición y orden superior","q":"¿Qué significa que las funciones son objetos de primera clase?","a":"Que se tratan **como cualquier dato**: se pasan como parámetros, se devuelven como resultado y se mezclan con otros datos. Da código **reutilizable y abstracto**.","src":"Cap. 2 p. 2 y 9; Clase UD2 ▶ 16:23","imp":2},{"id":"ud2-022","ud":2,"tema":"Composición y orden superior","q":"¿Sería válido utilizar un puntero en el paradigma funcional?","a":"**No**: un puntero incorpora el concepto de **estado de memoria**, que no es válido en el paradigma. En C, el orden superior se simula con punteros a función.","src":"Cap. 2 p. 10 y 26; Clase UD2 ▶ 16:23","imp":1},{"id":"ud2-023","ud":2,"tema":"Estado y recursividad","q":"Sin estado: ¿qué no se puede hacer en el paradigma funcional?","a":"• **Asignaciones destructivas**: a ← b, x = x + 1\n• **Procesos iterativos**: do, while, for, porque exigen mutar una variable de control y un acumulador","src":"Cap. 2 p. 11; Clase UD2 ▶ 18:11 y 20:00","imp":1},{"id":"ud2-024","ud":2,"tema":"Estado y recursividad","q":"Si no hay bucles, ¿cómo se itera?","a":"Con **recursividad**: la función se llama a sí misma con un problema menor (**caso general**) hasta un valor conocido que la detiene (**caso base**).","src":"Clase UD2 ▶ 20:00 y 21:33; Guía Lisp p. 5","imp":1},{"id":"ud2-025","ud":2,"tema":"Estado y recursividad","q":"Factorial: ¿en qué se diferencia la versión C++ de la funcional?","a":"C++ usa **while** y la variable total con **asignación destructiva** (total *= x; x--). La funcional es **recursiva**: n · factorial(n−1), con caso base 1.","src":"Cap. 2 p. 11","imp":2,"code":"(defun factorial (n)\n  (if (\u003c= n 0)\n      1                            ; caso base\n      (* n (factorial (- n 1)))))  ; recursivo"},{"id":"ud2-026","ud":2,"tema":"Estado y recursividad","q":"¿Cómo se lleva un contador o una posición sin mutar variables?","a":"Con un **parámetro acumulador** que viaja en cada llamada recursiva ya incrementado. En Lisp, un parámetro **&optional** con valor por defecto.","src":"Guía Lisp p. 3 y 5–6","imp":2,"code":"(defun primer-par-pos (lista &optional (pos 1))\n  (cond ((null lista) nil)\n        ((evenp (car lista)) (list (car lista) pos))\n        (t (primer-par-pos (cdr lista) (+ pos 1)))))\n(primer-par-pos '(1 3 8 7)) ; → (8 3)"},{"id":"ud2-027","ud":2,"tema":"Polimorfismo","q":"¿Cuáles son los tres tipos de polimorfismo?","a":"• **Sobrecarga** (ad hoc)\n• **Dinámico** o inclusión paramétrica\n• **Paramétrico** o genericidad","src":"Cap. 2 p. 12; Clase UD2 ▶ 22:45","imp":1,"serie":"Tipos de polimorfismo","n":1,"total":4},{"id":"ud2-028","ud":2,"tema":"Polimorfismo","q":"Polimorfismo: ¿qué es la sobrecarga?","a":"Una función con el **mismo nombre** y varias versiones según el número o tipo de argumentos: imprimir(int), imprimir(char), imprimir(int, float). **Strachey** lo llamó «ad hoc».","src":"Cap. 2 p. 12","imp":2,"serie":"Tipos de polimorfismo","n":2,"total":4},{"id":"ud2-029","ud":2,"tema":"Polimorfismo","q":"Polimorfismo: ¿qué es el polimorfismo dinámico?","a":"La función o método se determina **en ejecución** según la **clase del objeto** que recibe el mensaje. Ej.: un Empleado (subclase de Persona) se usa donde se espera una Persona.","src":"Cap. 2 p. 12–13","imp":2,"serie":"Tipos de polimorfismo","n":3,"total":4},{"id":"ud2-030","ud":2,"tema":"Polimorfismo","q":"Polimorfismo: ¿qué es el polimorfismo paramétrico?","a":"Una **plantilla** que implementa la **misma ejecución** admitiendo argumentos de **distintos tipos**. En C++, template \u003cclass T>; en Hope, variables genéricas alpha y beta.","src":"Cap. 2 p. 14 y 26","imp":1,"serie":"Tipos de polimorfismo","n":4,"total":4},{"id":"ud2-031","ud":2,"tema":"Polimorfismo","q":"¿Qué tipo de polimorfismo es natural en el paradigma funcional?","a":"El **paramétrico**: es natural en el funcional y **más forzado** en el procedimental. Ej. de clase: una función de listas sirve para enteros, decimales o palabras.","src":"Cap. 2 p. 15; Clase UD2 ▶ 23:06; Guía Lisp p. 7","imp":1,"code":"; tomar-n: primeros n elementos de cualquier lista\n(tomar-n 2 '(10 20 30 40))          ; → (10 20)\n(tomar-n 2 '(\"alfa\" \"beta\" \"gamma\")) ; → (\"alfa\" \"beta\")"},{"id":"ud2-032","ud":2,"tema":"Evaluación diferida y mónadas","q":"Evaluación ansiosa (eager): ¿qué es y qué llamada usa?","a":"Los argumentos se **evalúan antes** de pasarlos a la función: **llamada por valor** («call by value»). Es la evaluación convencional, de 1.er orden.","src":"Cap. 2 p. 15 y 26","imp":1,"serie":"Evaluación ansiosa y diferida","n":1,"total":4},{"id":"ud2-033","ud":2,"tema":"Evaluación diferida y mónadas","q":"Evaluación diferida (lazy): ¿qué es y qué llamada usa?","a":"Los argumentos se pasan **sin evaluar** y solo se evalúan cuando el cuerpo los necesita: **llamada por necesidad** («call by need»). Es de 2.º orden.","src":"Cap. 2 p. 15 y 26","imp":1,"serie":"Evaluación ansiosa y diferida","n":2,"total":4},{"id":"ud2-034","ud":2,"tema":"Evaluación diferida y mónadas","q":"Evaluación ansiosa: ¿ventaja e inconveniente?","a":"• Ventaja: **fácil de implementar** eficientemente; es rápida\n• Inconveniente: evalúa argumentos **innecesariamente** si al final no se usan","src":"Cap. 2 p. 15; Clase UD2 ▶ 24:54","imp":2,"serie":"Evaluación ansiosa y diferida","n":3,"total":4},{"id":"ud2-035","ud":2,"tema":"Evaluación diferida y mónadas","q":"Evaluación diferida: ¿ventajas e inconveniente?","a":"• Ventajas: permite **estructuras infinitas** y separa el control del cálculo (modularidad)\n• Inconveniente: implementación **más cara**, porque pasa expresiones sin evaluar","src":"Cap. 2 p. 15 y 17","imp":2,"serie":"Evaluación ansiosa y diferida","n":4,"total":4},{"id":"ud2-036","ud":2,"tema":"Evaluación diferida y mónadas","q":"Lista infinita: ¿qué da primerimpar(lista(8)) con cada evaluación?","a":"• Ansiosa: intenta construir la lista entera → **no termina**\n• Diferida: 8 es par, pide solo el siguiente → **9**","src":"Cap. 2 p. 16; Clase UD2 ▶ 25:10","imp":2},{"id":"ud2-037","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Por qué la evaluación diferida encaja mal en el paradigma procedimental?","a":"Por el **efecto lateral**: el programador pierde el control del orden de evaluación. Ej.: cuadrado(getint(f)) con f = 2, 5…: ansiosa 2*2 = 4; diferida 2*5 = 10.","src":"Cap. 2 p. 16","imp":2},{"id":"ud2-038","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Qué lenguajes funcionales tienen evaluación diferida?","a":"• **Haskell** y Lazy ML: sí\n• Hope: sí en su implementación diferida (la estándar, solo en las constructoras)\n• **Lisp**: no. ML: ansiosa","src":"Cap. 2 p. 17","imp":2},{"id":"ud2-039","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Qué es una mónada?","a":"Un **elemento encapsulado** que proporciona **características procedimentales** sin perder los beneficios del paradigma: transparencia referencial, orden superior y evaluación diferida.","src":"Cap. 2 p. 17 y 26; Clase UD2 ▶ 26:36","imp":1},{"id":"ud2-040","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Qué lenguaje incorpora las mónadas y para qué las usa?","a":"**Haskell**, modelo del paradigma funcional moderno. Las usa para la E/S (la **mónada IO**) sin perder pureza, para el estado mutable (p. ej. un parser) y para excepciones.","src":"Cap. 2 p. 17–18; Clase UD2 ▶ 26:36","imp":1},{"id":"ud2-041","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Cuál es la estructura de una mónada?","a":"Un **constructor de tipo unario** m y dos funciones: **return** (a -> m a: mete un valor en la mónada) y **>>=** (enlaza dos funciones monádicas). Cumplen 3 leyes monádicas.","src":"Cap. 2 p. 17","imp":2},{"id":"ud2-042","ud":2,"tema":"Evaluación diferida y mónadas","q":"¿Son las mónadas una característica básica de la programación funcional?","a":"**No**. Son elementos encapsulados que proporcionan características procedimentales sin perder los beneficios del paradigma funcional.","src":"Cap. 2 p. 26","imp":1},{"id":"ud2-043","ud":2,"tema":"Programa funcional y lenguajes","q":"¿Qué es un programa funcional?","a":"«Un **conjunto compuesto de funciones** que juntas definen un objetivo específico de aplicación». Ecuación: **Funciones + Estructuras de datos = Programa**.","src":"Cap. 2 p. 21","imp":1},{"id":"ud2-044","ud":2,"tema":"Programa funcional y lenguajes","q":"¿Cuáles son los elementos fundamentales de un programa funcional?","a":"• Las **funciones** (de orden superior y con transparencia referencial)\n• La **recursividad** (iteración con asignación no destructiva)\n• Las **listas**","src":"Cap. 2 p. 21 y 26","imp":1},{"id":"ud2-045","ud":2,"tema":"Programa funcional y lenguajes","q":"¿Qué tipos de datos básicos usa el paradigma funcional?","a":"• **Átomos**: números, booleanos y caracteres (28, 43.76, T, NIL, 'h')\n• **Identificadores**: nombres de variables y funciones\n• **Listas**; una cadena es una lista de caracteres","src":"Cap. 2 p. 18–19","imp":2},{"id":"ud2-046","ud":2,"tema":"Programa funcional y lenguajes","q":"¿Qué es la currificación?","a":"Tratar una función de **n argumentos** como una concatenación de n funciones de **un solo argumento**: f x y z ⇒ (((f x) y) z). [Curry, 1958]","src":"Cap. 2 p. 21","imp":2},{"id":"ud2-047","ud":2,"tema":"Programa funcional y lenguajes","q":"Lisp, Hope y Haskell: ¿cuáles nacieron para el paradigma funcional?","a":"• Lisp: **no**; el paradigma se le añadió después\n• Hope: sí, en un entorno **académico** (pocas aplicaciones reales)\n• Haskell: sí, y se usa **fuera del ámbito académico**","src":"Clase UD2 ▶ 28:11 y 1:12:44","imp":2},{"id":"ud2-048","ud":2,"tema":"Ventajas e inconvenientes","q":"¿Cuáles son las ventajas del paradigma funcional frente al imperativo?","a":"Simplicidad · posibilidad de razonamiento formal · concisión · abstracción · paralelismo.","src":"Cap. 2 p. 25–26; Clase UD2 ▶ 32:24","imp":1,"serie":"Ventajas del paradigma funcional","n":1,"total":6},{"id":"ud2-049","ud":2,"tema":"Ventajas e inconvenientes","q":"Ventaja funcional: ¿en qué consiste la simplicidad?","a":"Menos comandos: **Haskell** tiene 23 identificadores y un manual de 80 páginas; **Ada**, 62 identificadores y 200 páginas.","src":"Cap. 2 p. 25","imp":2,"serie":"Ventajas del paradigma funcional","n":2,"total":6},{"id":"ud2-050","ud":2,"tema":"Ventajas e inconvenientes","q":"Ventaja funcional: ¿qué es la posibilidad de razonamiento formal?","a":"La transparencia referencial permite el **razonamiento ecuacional**: sustituir iguales por iguales. En el imperativo hay que recurrir a la **lógica de predicados**.","src":"Cap. 2 p. 25","imp":2,"serie":"Ventajas del paradigma funcional","n":3,"total":6},{"id":"ud2-051","ud":2,"tema":"Ventajas e inconvenientes","q":"Ventaja funcional: ¿en qué consiste la concisión?","a":"La relación de líneas de código entre imperativo y funcional es de **10 a 1**. Menos código: programa más conciso y, por tanto, **más fiable**.","src":"Cap. 2 p. 25; Clase UD2 ▶ 33:55","imp":2,"serie":"Ventajas del paradigma funcional","n":4,"total":6},{"id":"ud2-052","ud":2,"tema":"Ventajas e inconvenientes","q":"Ventaja funcional: ¿en qué consiste la abstracción?","a":"Se ajusta **mejor al modelo del problema** (y peor al del computador) que el imperativo, por lo que el código es **más reutilizable**.","src":"Cap. 2 p. 25","imp":2,"serie":"Ventajas del paradigma funcional","n":5,"total":6},{"id":"ud2-053","ud":2,"tema":"Ventajas e inconvenientes","q":"Ventaja funcional: ¿por qué favorece el paralelismo?","a":"La **ausencia de efectos laterales** facilita el cálculo paralelo: es ideal para la programación **paralela y concurrente** (varios procesadores, hilos).","src":"Cap. 2 p. 25; Clase UD2 ▶ 33:55","imp":2,"serie":"Ventajas del paradigma funcional","n":6,"total":6},{"id":"ud2-054","ud":2,"tema":"Ventajas e inconvenientes","q":"¿Cuáles son los inconvenientes del paradigma funcional?","a":"Dificultad (poco intuitivo) · ineficiencia · no apropiado para la programación a gran escala.","src":"Cap. 2 p. 25","imp":1,"serie":"Inconvenientes del paradigma funcional","n":1,"total":4},{"id":"ud2-055","ud":2,"tema":"Ventajas e inconvenientes","q":"Inconveniente funcional: ¿por qué resulta difícil?","a":"Es **poco intuitivo** para quien piensa en cómo opera el computador (forma imperativa): por costumbre resolvemos con bucles. Se consigue con la **práctica**.","src":"Cap. 2 p. 25; Clase UD2 ▶ 34:56","imp":2,"serie":"Inconvenientes del paradigma funcional","n":2,"total":4},{"id":"ud2-056","ud":2,"tema":"Ventajas e inconvenientes","q":"Inconveniente funcional: ¿cuánto más lento es?","a":"Es de **3 a 5 veces más lento** en ejecución que el imperativo, y la recursividad consume **más memoria**.","src":"Cap. 2 p. 25; Clase UD2 ▶ 34:56","imp":2,"serie":"Inconvenientes del paradigma funcional","n":3,"total":4},{"id":"ud2-057","ud":2,"tema":"Ventajas e inconvenientes","q":"Inconveniente funcional: ¿sirve para la programación a gran escala?","a":"Actualmente **no es apropiado**, aunque sí es bueno para **investigar**. Haskell, Standard ML y Miranda empiezan a ser bastante eficientes, sobre todo Haskell.","src":"Cap. 2 p. 25","imp":2,"serie":"Inconvenientes del paradigma funcional","n":4,"total":4},{"id":"ud2-058","ud":2,"tema":"Lisp","q":"¿Quién creó Lisp, cuándo y dónde? ¿Qué significa su nombre?","a":"**John McCarthy**, en **1959**, en el MIT. LISP = «**List Processing**». Su estándar es Common Lisp.\n(Las diapositivas de la UD3 y la intro de Lisp dicen **1958**.)","src":"Cap. 2 p. 4 y 22","imp":1},{"id":"ud2-059","ud":2,"tema":"Lisp","q":"¿Es Lisp un lenguaje funcional puro?","a":"**No, es híbrido** (funcional y procedimental). Fue el **primero** en implementar la programación funcional, pero no nació para ella: tiene asignación destructiva (setq), bucles (loop), arrays y globales.","src":"Cap. 2 p. 22–25; Clase UD2 ▶ 30:52 y 51:22","imp":1},{"id":"ud2-060","ud":2,"tema":"Lisp","q":"Lisp: ¿qué son las S-expresiones?","a":"Expresiones **entre paréntesis** en notación **prefija o polaca**: primero el operador y luego los argumentos: (operador arg1 arg2 …).","src":"Guía Lisp p. 1; Clase UD2 ▶ 43:29","imp":2,"code":"(+ 2 3)        ; → 5\n(* 2 (+ 4 5))  ; → 18"},{"id":"ud2-061","ud":2,"tema":"Lisp","q":"Lisp: ¿para qué sirve quote (o el apóstrofe)?","a":"Lisp evalúa toda lista como **llamada a función**. quote o el apóstrofe **suprime la evaluación** y trata la lista o el símbolo como **dato literal**.","src":"Guía Lisp p. 1; Clase UD2 ▶ 45:24","imp":2,"code":"(print (+ 2 3))   ; → 5\n(print '(+ 2 3))  ; → (+ 2 3)"},{"id":"ud2-062","ud":2,"tema":"Lisp","q":"Lisp: ¿cómo se define una función con nombre?","a":"Con **defun**: nombre, lista de parámetros y cuerpo: (defun nombre (param1 param2) cuerpo).","src":"Guía Lisp p. 2; Cap. 2 p. 23–24","imp":2,"code":"(defun sumar (a b)\n  (+ a b))\n(sumar 2 3) ; → 5"},{"id":"ud2-063","ud":2,"tema":"Lisp","q":"Lisp: ¿qué diferencia hay entre if y cond?","a":"• **if**: una sola condición, con una rama verdadera y otra falsa\n• **cond**: varias ramas (predicado acción) evaluadas en orden; **(t …)** hace de else","src":"Guía Lisp p. 3–4; Clase UD2 ▶ 59:14","imp":2,"code":"(cond ((>= *nota* 19) \"Excelente\")\n      ((>= *nota* 14) \"Aprobado\")  ; ← con nota 15\n      (t \"Reprobado\"))"},{"id":"ud2-064","ud":2,"tema":"Lisp","q":"Lisp: ¿qué es una forma lambda?","a":"Una **función anónima**: se define sin ligarla a un nombre con (lambda (params) cuerpo). Muy útil con listas, p. ej. dentro de **mapcar**.","src":"Guía Lisp p. 4; Clase UD2 ▶ 1:06:21","imp":1,"code":"((lambda (base altura) (* base altura)) 10 5) ; → 50"},{"id":"ud2-065","ud":2,"tema":"Lisp","q":"Lisp: ¿qué diferencia hay entre cons y list?","a":"• **cons**: agrega un elemento al inicio de una lista existente (cabeza + cola)\n• **list**: agrupa sus argumentos en una lista nueva","src":"Guía Lisp p. 4; Cap. 2 p. 22; Clase UD2 ▶ 1:09:39","imp":2,"code":"(cons 5 '(10 20)) ; → (5 10 20)\n(list 1 2 3)      ; → (1 2 3)"},{"id":"ud2-066","ud":2,"tema":"Lisp","q":"Lisp: ¿qué es una celda cons?","a":"El par enlazado con el que se construye toda lista. Tiene dos punteros: **car** (Contents of Address part of Register) y **cdr** (Contents of Decrement part of Register).","src":"Guía Lisp p. 4–5","imp":2,"code":"; '(10 20 30) en memoria:\n; [10 | •]→[20 | •]→[30 | NIL]"},{"id":"ud2-067","ud":2,"tema":"Lisp","q":"Lisp: ¿qué devuelven car y cdr?","a":"• **car**: la cabeza, el primer elemento (sinónimo: first)\n• **cdr**: la cola, el resto de la lista (sinónimo: rest)","src":"Guía Lisp p. 4–5; Cap. 2 p. 22; Clase UD2 ▶ 1:10:40","imp":1,"code":"(car '(10 20 30)) ; → 10\n(cdr '(10 20 30)) ; → (20 30)"},{"id":"ud2-068","ud":2,"tema":"Lisp","q":"Lisp: ¿cómo se recorre una lista recursivamente?","a":"Caso base con **null** (aquí, si la cola está vacía devuelve la cabeza); caso recursivo: la cabeza (**car**) más la función aplicada a la cola (**cdr**).","src":"Cap. 2 p. 19; Guía Lisp p. 5","imp":2,"code":"(defun sumar (l)\n  (cond ((null (cdr l)) (car l))\n        (t (+ (car l) (sumar (cdr l))))))\n(sumar '(4 8 5 10)) ; → 27"},{"id":"ud2-069","ud":2,"tema":"Lisp","q":"Lisp: ¿cómo se pasa y se invoca una función como dato?","a":"Con **#'** se referencia el objeto función. **funcall** la invoca con los argumentos explícitos; **apply**, con los argumentos dentro de una lista.","src":"Guía Lisp p. 6","imp":2,"code":"(funcall #'+ 10 5)       ; → 15\n(apply #'+ '(1 2 3 4 5)) ; → 15"},{"id":"ud2-070","ud":2,"tema":"Lisp","q":"Lisp: ¿qué hacen mapcar y reduce?","a":"• **mapcar**: aplica una función a cada elemento y devuelve una lista nueva\n• **reduce**: combina la lista con una función binaria hasta un único valor","src":"Guía Lisp p. 6–7","imp":2,"code":"(mapcar (lambda (x) (* x x)) '(1 2 3 4)) ; → (1 4 9 16)\n(reduce #'+ '(1 4 9 16))                ; → 30"},{"id":"ud3-001","ud":3,"tema":"Orígenes","q":"¿Cuáles son los 4 hitos de «La evolución de la lógica pura»?","a":"• 1936: cálculo lambda\n• 1958: LISP\n• Años 70: Hope\n• 1990: Haskell\n(El libro de la UD2 dice 1934 y 1959.)","src":"S3 diap. 3","imp":1,"serie":"Evolución de la lógica pura","n":1,"total":5},{"id":"ud3-002","ud":3,"tema":"Orígenes","q":"Evolución de la lógica pura, 1936: ¿qué hito y de quién?","a":"El **cálculo lambda** de **Alonzo Church**: la base matemática fundamental.","src":"S3 diap. 3","imp":2,"serie":"Evolución de la lógica pura","n":2,"total":5},{"id":"ud3-003","ud":3,"tema":"Orígenes","q":"Evolución de la lógica pura, 1958: ¿qué aporta LISP (John McCarthy)?","a":"«El **código es dato**». Estructuras de listas y **notación prefija**.","src":"S3 diap. 3","imp":2,"serie":"Evolución de la lógica pura","n":3,"total":5},{"id":"ud3-004","ud":3,"tema":"Orígenes","q":"Evolución de la lógica pura, años 70: ¿dónde nace Hope y qué introduce?","a":"En la **Universidad de Edimburgo**. «El pionero»: introduce el **encaje de patrones** y los **tipos de datos algebraicos**.","src":"S3 diap. 3","imp":1,"serie":"Evolución de la lógica pura","n":4,"total":5},{"id":"ud3-005","ud":3,"tema":"Orígenes","q":"Evolución de la lógica pura, 1990: ¿quién crea Haskell y qué lo define?","a":"El **Comité Haskell**. Pureza estricta, **tipado estático** y **evaluación perezosa**.","src":"S3 diap. 3","imp":1,"serie":"Evolución de la lógica pura","n":5,"total":5},{"id":"ud3-006","ud":3,"tema":"Orígenes","q":"Hope y Haskell nacieron para el paradigma funcional: ¿en qué se diferencian?","a":"• Hope: entorno **académico**; pocas aplicaciones reales, hay que instalar un binario\n• Haskell: pensado para usarse **fuera** del ámbito académico","src":"Clase UD2","imp":1},{"id":"ud3-007","ud":3,"tema":"Orígenes","q":"¿Qué datos de historia de LISP añade introduccion.lisp?","a":"• 1958, John McCarthy (**MIT**)\n• Entre Fortran (1957) y COBOL (1959)\n• Basado en el cálculo lambda de Church, que fue **profesor de Alan Turing**","src":"introduccion.lisp","imp":2},{"id":"ud3-008","ud":3,"tema":"Hope","q":"¿Qué revolucionó Hope en la programación funcional?","a":"La evaluación basada en la **forma de los datos** (encaje de patrones), que elimina la necesidad de **condicionales complejos**.","src":"S3 diap. 5","imp":1,"code":"dec clasificar : forma -> texto;\n--- clasificar (circulo) \u003c= texto1;\n--- clasificar (cuadrado_con_triangulo) \u003c= texto2;"},{"id":"ud3-009","ud":3,"tema":"Hope","q":"¿Qué piezas tiene una definición de función en Hope?","a":"• dec: declara el tipo\n• ---: abre cada ecuación\n• \u003c=: separa el patrón del resultado\n• #: une los tipos de los argumentos","src":"S3 diap. 7","imp":2,"serie":"Sintaxis de Hope","n":1,"total":3,"code":"dec suma : num # num -> num;\n--- suma(a,b) \u003c= a + b;"},{"id":"ud3-010","ud":3,"tema":"Hope","q":"Sintaxis de Hope: ¿qué hace «dec»?","a":"Declara de forma **explícita** el tipo de la función (argumentos -> resultado) antes de sus ecuaciones.","src":"S3 diap. 7 y 9","imp":2,"serie":"Sintaxis de Hope","n":2,"total":3,"code":"dec fact : num -> num;"},{"id":"ud3-011","ud":3,"tema":"Hope","q":"Sintaxis de Hope: ¿qué es cada línea que empieza por «---»?","a":"Una **regla de encaje de patrones**: una ecuación por cada forma del dato. Así controla Hope el flujo, en vez de anidar if/cond como LISP.","src":"S3 diap. 7 y 9","imp":2,"serie":"Sintaxis de Hope","n":3,"total":3,"code":"--- fact 0 \u003c= 1;\n--- fact n \u003c= n * fact(n-1);"},{"id":"ud3-012","ud":3,"tema":"Hope","q":"¿Cómo define Hope un tipo de datos algebraico, como la lista?","a":"Con data y alternativas unidas por ++: una lista es nil **o** cabeza :: resto. alpha es una variable de tipo (**polimorfismo**).","src":"Standard.hop","imp":2,"code":"data list alpha == nil ++ alpha :: list alpha;"},{"id":"ud3-013","ud":3,"tema":"Sintaxis comparada","q":"El árbol de 2 + (3 * 4): ¿cómo lo escribe cada lenguaje?","a":"• LISP: **prefija** (+ 2 (* 3 4)), la función precede a los argumentos\n• Hope: **infija con tipos**, evaluación estricta clásica\n• Haskell: **infija**, «matemáticamente puro»","src":"S3 diap. 6","imp":2},{"id":"ud3-014","ud":3,"tema":"Sintaxis comparada","q":"¿Qué tres aspectos compara la «Matriz de Rosetta funcional»?","a":"• Definición de función\n• Sistema de tipado\n• Control de flujo\n(en LISP, Hope y Haskell)","src":"S3 diap. 7","imp":2,"serie":"Matriz de Rosetta","n":1,"total":4},{"id":"ud3-015","ud":3,"tema":"Sintaxis comparada","q":"Matriz de Rosetta, definición de función: ¿cómo se define suma en cada lenguaje?","a":"• LISP: defun, en notación prefija\n• Hope: dec (tipo explícito) + ecuación ---\n• Haskell: una sola ecuación; el tipo se infiere","src":"S3 diap. 7","imp":2,"serie":"Matriz de Rosetta","n":2,"total":4,"code":"(defun suma (a b) (+ a b))   ; LISP\ndec suma : num # num -> num;  ! Hope\n--- suma(a,b) \u003c= a + b;\nsuma a b = a + b              -- Haskell"},{"id":"ud3-016","ud":3,"tema":"Sintaxis comparada","q":"Matriz de Rosetta, sistema de tipado: ¿cómo es en cada lenguaje?","a":"• LISP: **dinámico** (en tiempo de ejecución)\n• Hope: **estricto y polimórfico** (declaración explícita)\n• Haskell: **estático e inferido** (matemáticamente derivado)","src":"S3 diap. 7","imp":1,"serie":"Matriz de Rosetta","n":3,"total":4},{"id":"ud3-017","ud":3,"tema":"Sintaxis comparada","q":"Matriz de Rosetta, control de flujo: ¿cómo es en cada lenguaje?","a":"• LISP: **anidación** (if, cond)\n• Hope: **encaje de patrones** (---)\n• Haskell: **encaje de patrones y guardas** (|)","src":"S3 diap. 7","imp":1,"serie":"Matriz de Rosetta","n":4,"total":4},{"id":"ud3-018","ud":3,"tema":"Capacidades","q":"¿Qué tres capacidades funcionales se comparan en LISP, Hope y Haskell?","a":"• 1: Recursividad como motor de iteración\n• 2: Deconstrucción de estructuras\n• 3: Funciones de orden superior","src":"S3 diap. 8, 10 y 12","imp":1,"serie":"Tres capacidades","n":1,"total":4},{"id":"ud3-019","ud":3,"tema":"Capacidades","q":"Capacidad 1, recursividad como motor de iteración: ¿en qué consiste?","a":"Sin bucles tradicionales, se itera **descomponiendo el problema** hasta un **caso base** (condición de parada): 3·F(2) → 2·F(1) → 1·F(0) → 1.","src":"S3 diap. 8","imp":2,"serie":"Tres capacidades","n":2,"total":4},{"id":"ud3-020","ud":3,"tema":"Capacidades","q":"Capacidad 2, deconstrucción de estructuras: ¿en qué consiste?","a":"Los datos **inmutables** no se modifican en memoria: se procesan separando la **cabeza** (primer elemento) de la **cola** (resto de la lista).","src":"S3 diap. 10","imp":2,"serie":"Tres capacidades","n":3,"total":4},{"id":"ud3-021","ud":3,"tema":"Capacidades","q":"Capacidad 3, funciones de orden superior: ¿en qué consiste?","a":"Las funciones son **ciudadanos de primera clase**: se pasan como variables o se insertan como lógica intercambiable, p. ej. una **lambda** (lógica anónima).","src":"S3 diap. 12","imp":2,"serie":"Tres capacidades","n":4,"total":4},{"id":"ud3-022","ud":3,"tema":"Capacidades","q":"Factorial: ¿cómo distingue el caso base cada lenguaje?","a":"• LISP: **condicional explícito** (if)\n• Hope: **reglas de deconstrucción** directas\n• Haskell: **enrutamiento implícito por forma**","src":"S3 diap. 9","imp":1,"code":"--- fact 0 \u003c= 1;                   ! Hope\n--- fact n \u003c= n * fact(n-1);\nfactorial 0 = 1                    -- Haskell\nfactorial n = n * factorial (n-1)"},{"id":"ud3-023","ud":3,"tema":"Capacidades","q":"Cabeza y cola de una lista: ¿cómo se separan en cada lenguaje?","a":"• LISP: funciones históricas **car** (cabeza) y **cdr** (cola)\n• Hope: operador **::** (x :: xs)\n• Haskell: operador **:** (x : xs)","src":"S3 diap. 10 y 11","imp":1,"code":"--- sumarDiez (x::xs) \u003c= (x+10) :: xs;  ! Hope\nsumarDiez (x:xs) = (x + 10) : xs       -- Haskell"},{"id":"ud3-024","ud":3,"tema":"Capacidades","q":"¿Cómo se escribe una función lambda en LISP, Hope y Haskell?","a":"• LISP: (lambda (x) (+ x 5))\n• Hope: lambda x => x+5\n• Haskell: \\x -> x + 5 (la barra invertida emula la λ)","src":"S3 diap. 13; Guía Haskell p. 2–3","imp":2,"code":"(\\base altura -> base * altura) 10 5   -- 50"},{"id":"ud3-025","ud":3,"tema":"Capacidades","q":"Map & Reduce: ¿qué ocurre con [1, 2, 3] y λx → x+5?","a":"**map** transforma: [6, 7, 8]; **reduce (+)** los combina: **21**. En LISP el map es **mapcar**; en Haskell el reduce es **foldl**.","src":"S3 diap. 13","imp":2,"code":"(reduce #'+ (mapcar (lambda (x) (+ x 5)) lista))\nreduce( +, map( lambda x => x+5, lista ) )\nfoldl (+) 0 (map (\\x -> x + 5) lista)"},{"id":"ud3-026","ud":3,"tema":"Síntesis","q":"¿Qué legado funcional aprovecha hoy el Big Data?","a":"La **inmutabilidad** de 1958 (LISP) y los **patrones** de los años 70 (Hope) garantizan la seguridad del procesamiento distribuido, p. ej. **Apache Spark**.","src":"S3 diap. 14","imp":2},{"id":"ud3-027","ud":3,"tema":"Síntesis","q":"¿Por qué map/reduce puede repartirse entre miles de servidores?","a":"Al no tener **efectos secundarios**, las evaluaciones perezosas de map/reduce se distribuyen entre nodos; **sin estado compartido** no hay colisiones.","src":"S3 diap. 14","imp":1},{"id":"ud3-028","ud":3,"tema":"Síntesis","q":"Eligiendo el dialecto funcional: ¿qué etiqueta resume cada lenguaje?","a":"• Hope: el **pionero académico**\n• LISP/Scheme: **dinámico y maleable**\n• Haskell: la **fortaleza matemática**","src":"S3 diap. 15","imp":1,"serie":"Eligiendo el dialecto funcional","n":1,"total":4},{"id":"ud3-029","ud":3,"tema":"Síntesis","q":"Hope, «el pionero académico»: ¿cómo lo describe la diapositiva?","a":"Estricto, explícito y el **inventor del encaje de patrones**. Ideal para comprender la teoría pura de **estructuras de datos**.","src":"S3 diap. 15","imp":2,"serie":"Eligiendo el dialecto funcional","n":2,"total":4},{"id":"ud3-030","ud":3,"tema":"Síntesis","q":"LISP/Scheme, «dinámico y maleable»: ¿cómo lo describe la diapositiva?","a":"**El código escribe código** (macros). El lenguaje programable supremo, impulsado por **listas**.","src":"S3 diap. 15","imp":2,"serie":"Eligiendo el dialecto funcional","n":3,"total":4},{"id":"ud3-031","ud":3,"tema":"Síntesis","q":"Haskell, «la fortaleza matemática»: ¿cómo lo describe la diapositiva?","a":"**Tipado estático seguro** y **evaluación perezosa**. Su lema: «Si compila, funciona».","src":"S3 diap. 15","imp":2,"serie":"Eligiendo el dialecto funcional","n":4,"total":4},{"id":"ud3-032","ud":3,"tema":"Síntesis","q":"Conclusión de la UD3: ¿qué nos enseña el paradigma funcional?","a":"«Más que un lenguaje, una forma de pensar»: diseñar sistemas **predecibles, inmutables y matemáticamente puros** (en Hope, LISP, Haskell o Python).","src":"S3 diap. 16","imp":2},{"id":"ud3-033","ud":3,"tema":"Haskell","q":"¿Cómo define la guía a Haskell?","a":"Lenguaje funcional **puro**, con tipado **estático fuerte e inferido** y **evaluación diferida** (perezosa). Sintaxis inspirada en el cálculo lambda y la notación matemática.","src":"Guía Haskell p. 1","imp":1},{"id":"ud3-034","ud":3,"tema":"Haskell","q":"¿Qué es la evaluación diferida o perezosa (call-by-need)?","a":"No evalúa los argumentos al invocar la función (eso hace la **ansiosa**, call-by-value): **pospone el cálculo** hasta que el resultado es estrictamente necesario.","src":"Guía Haskell p. 1","imp":1},{"id":"ud3-035","ud":3,"tema":"Haskell","q":"¿Qué ventajas da la evaluación perezosa en Haskell?","a":"• Permite **listas infinitas** sin desbordar memoria ni bucles infinitos: solo calcula lo que se pide\n• **Desacopla** la generación de datos de su consumo","src":"Guía Haskell p. 1","imp":1,"code":"enteros = [1..]                 -- lista infinita\nprimerosCinco = take 5 enteros  -- [1,2,3,4,5]"},{"id":"ud3-036","ud":3,"tema":"Haskell","q":"Haskell: ¿qué es una firma de tipo y cómo se escribe?","a":"Declara el tipo con **::** y separa argumentos y resultado con **->**. El compilador podría inferirlo, pero la convención es escribirla.","src":"Guía Haskell p. 1","imp":2,"code":"sumar :: Int -> Int -> Int\nsumar a b = a + b"},{"id":"ud3-037","ud":3,"tema":"Haskell","q":"¿Qué es la currificación (currying) en Haskell?","a":"Toda función toma formalmente **un solo argumento** a la vez y devuelve otra función hasta agotar los parámetros. Por eso la firma encadena flechas: Int -> Int -> Int.","src":"Guía Haskell p. 1 y 4","imp":1},{"id":"ud3-038","ud":3,"tema":"Haskell","q":"Trampa: ¿qué significa «::» en Hope y en Haskell?","a":"• Hope: **cons**, une cabeza y cola (x :: xs)\n• Haskell: **firma de tipo** (sumar :: Int -> Int -> Int); su cons es «:»","src":"S3 diap. 10; Guía Haskell p. 1","imp":2},{"id":"ud3-039","ud":3,"tema":"Haskell","q":"¿Cómo hace Haskell la entrada/salida sin perder la pureza?","a":"Prohíbe funciones impuras: toda E/S va **encapsulada en la mónada IO**, que modela la acción con el mundo exterior; el resto del código sigue siendo puro.","src":"Guía Haskell p. 1–2","imp":1,"code":"main :: IO ()\nmain = do\n  putStrLn \"Hola mundo desde Haskell!\"\n  print (sumar 10 5)"},{"id":"ud3-040","ud":3,"tema":"Haskell","q":"Haskell: ¿en qué se diferencian let … in y where?","a":"Ambos crean **ligaduras locales inmutables** (no hay globales mutables como defvar de LISP). let … in va antes de la expresión; where, **al final** de la función.","src":"Guía Haskell p. 2","imp":2,"code":"area1 base altura = let p = base * altura in p / 2\narea2 base altura = p / 2\n  where p = base * altura"},{"id":"ud3-041","ud":3,"tema":"Haskell","q":"Haskell: ¿qué son las guardas y a qué equivalen en LISP?","a":"Condiciones en cascada con la barra **|**; equivalen a **cond** de LISP. **otherwise** es el caso por defecto (como t en LISP).","src":"Guía Haskell p. 2","imp":2,"code":"clasificarNota nota\n  | nota >= 19 = \"Excelente\"\n  | nota >= 14 = \"Aprobado\"\n  | nota >= 11 = \"Suficiente\"\n  | otherwise  = \"Reprobado\""},{"id":"ud3-042","ud":3,"tema":"Haskell","q":"¿Cómo son las listas en Haskell?","a":"**Homogéneas** (elementos del mismo tipo), con dos constructores: **[]** (vacía; NIL en LISP, nil en Hope) y **:** (cons, añade por la cabeza).","src":"Guía Haskell p. 3","imp":2,"code":"miLista = [10, 20, 30]  -- = 10 : (20 : (30 : []))"},{"id":"ud3-043","ud":3,"tema":"Pilares en Haskell","q":"¿Cuáles son los 5 pilares del paradigma funcional en la guía de Haskell?","a":"1 Transparencia referencial y funciones puras · 2 Sin estado mutable y recursividad · 3 Orden superior · 4 Composición funcional · 5 Polimorfismo y typeclasses","src":"Guía Haskell p. 3–5","imp":1,"serie":"Pilares en Haskell","n":1,"total":6},{"id":"ud3-044","ud":3,"tema":"Pilares en Haskell","q":"P
