    }).join('');
    let fb = '';
    if (shown) {
      const right = isRight(s, id), kr = LETTERS[s.perm[id].indexOf(0)];
      const card = q.ficha ? BY_ID.get(q.ficha) : null;
      fb = '<div class="fb ' + (right ? 'ok' : 'bad') + '" id="fb"><p class="fb-h">' + (right ? ICON.check + 'Correcto' : ICON.x + (a === -1 ? 'Era la ' + kr : 'No: la correcta es la ' + kr)) + '</p>' +
        '<p>' + inline(q.why) + '</p>' +
        (card ? '<details><summary>Repasar la ficha</summary><div class="ans"><p class="q-small">' + inline(card.q) + '</p>' + fmt(card.a) + (card.code ? '<pre>' + esc(card.code) + '</pre>' : '') + '</div></details>' : '') +
        '<div class="src"><span>Fuente: ' + esc(q.src || '—') + '</span>' + (card ? '<span>Ficha ' + esc(card.id) + '</span>' : '') + '</div></div>';
    }
    let act;
    if (!sim) act = shown
      ? '<div class="qact one wrap"><button class="btn" id="qnext">' + (s.i + 1 < s.ids.length ? 'Siguiente' : 'Ver resultado') + '</button></div>'
      : '<div class="qact one wrap"><button class="btn ghost" id="qblank">No lo sé</button></div>';
    else {
      const last = s.i + 1 >= s.ids.length;
      act = '<div class="qact wrap"><button class="btn ghost" id="qprev" aria-label="Pregunta anterior"' + (s.i ? '' : ' disabled') + '>' + ICON.back + '</button>' +
        '<button class="btn' + (a === undefined && !last ? ' ghost' : '') + '" id="qnext">' + (last ? 'Terminar' : a === undefined ? 'Dejar en blanco' : 'Siguiente') + '</button></div>';
    }
    const eb = '<div class="eyebrow"><span class="udtag">UD' + q.ud + '</span>' + (sim ? '<span>Pregunta ' + (s.i + 1) + '</span>' : '<span>' + esc(q.tema) + '</span>') +
      (!sim && q.imp === 1 ? '<span class="star" title="Esencial">★ Esencial</span>' : '') + '</div>';
    const done = sim ? s.ids.filter(x => s.ans[x] !== undefined).length : s.i + (shown ? 1 : 0);
    app.innerHTML =
      '<div class="view">' +
      '<div class="studybar wrap"><button class="icon-btn" id="qquit" aria-label="' + (sim ? 'Pausar y volver al inicio' : 'Salir al inicio') + '">' + ICON.x + '</button>' +
      '<div class="prog" aria-hidden="true"><i style="width:' + (100 * done / s.ids.length).toFixed(1) + '%"></i></div>' +
      '<span class="count">' + (s.i + 1) + ' / ' + s.ids.length + '</span></div>' +
      '<div class="stage wrap"><div class="qwrap u' + q.ud + '"><div class="qcard">' + eb + '<p class="qtext">' + inline(q.q) + '</p>' + codeHTML(q.code) + '</div>' +
      '<div class="ops" role="group" aria-label="Opciones">' + ops + '</div>' + fb + '</div></div>' + act + '</div>';

    app.querySelectorAll('.op').forEach(b => b.onclick = () => pick(+b.dataset.k));
    document.getElementById('qquit').onclick = quitQuiz;
    const nx = document.getElementById('qnext'); if (nx) nx.onclick = qNext;
    const pv = document.getElementById('qprev'); if (pv) pv.onclick = qPrev;
    const bl = document.getElementById('qblank'); if (bl) bl.onclick = () => pick(-1);
  }
  function pick(k) {
    const s = tses; if (!s) return;
    const id = s.ids[s.i];
    if (s.kind === 'sim') {
      if (k < 0) return;
      if (s.ans[id] === k) delete s.ans[id]; else s.ans[id] = k;
      saveTSes(); keepStage(renderQuiz); return;
    }
    if (s.ans[id] !== undefined) return;
    s.ans[id] = k; qRecord(id, isRight(s, id)); tCommit();
    keepStage(renderQuiz);
    const fb = document.getElementById('fb');
    if (fb) fb.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
  }
  function qNext() {
    const s = tses; if (!s) return;
    if (s.kind === 'prac') {
      if (s.ans[s.ids[s.i]] === undefined) return;
      if (s.i + 1 >= s.ids.length) { finishPrac(); return; }
      s.i++; render(); return;
    }
    if (s.i + 1 >= s.ids.length) { view = 'qconfirm'; render(); return; }
    s.i++; saveTSes(); render();
  }
  function qPrev() { const s = tses; if (s && s.kind === 'sim' && s.i > 0) { s.i--; saveTSes(); render(); } }
  function quitQuiz() {
    if (tses && tses.kind === 'sim' && !tses.res) { pendingSim = tses; saveTSes(); }
    tses = null; view = 'home'; render();
  }

  // ---------- entrega ----------
  function renderConfirm() {
    const s = tses, n = s.ids.length, done = s.ids.filter(id => s.ans[id] !== undefined).length, blank = n - done;
    app.innerHTML =
      '<div class="view"><div class="scroll"><div class="done wrap">' +
      '<div><h2>Simulacro de examen</h2><h1>¿Lo entregas?</h1></div>' +
      '<div class="tiles two"><div class="tile"><b>' + done + '</b><span>respondidas</span></div><div class="tile"><b>' + blank + '</b><span>en blanco</span></div></div>' +
      '<p class="note">Cada fallo resta un tercio de acierto y lo que dejes en blanco no resta. Si en una pregunta puedes descartar al menos una opción, te compensa contestarla.</p>' +
      '<button class="btn" id="deliver">Entregar y ver la nota</button>' +
      (blank ? '<button class="btn ghost" id="toblank">' + (blank === 1 ? 'Ir a la que está en blanco' : 'Ir a la primera en blanco') + '</button>' : '') +
      '<button class="btn ghost" id="toback">Volver a la última pregunta</button>' +
      '</div></div></div>';
    document.getElementById('deliver').onclick = finishSim;
    const tb = document.getElementById('toblank');
    if (tb) tb.onclick = () => { s.i = s.ids.findIndex(id => s.ans[id] === undefined); view = 'quiz'; saveTSes(); render(); };
    document.getElementById('toback').onclick = () => { view = 'quiz'; render(); };
  }
  function finishSim() {
    const s = tses; let ok = 0, bad = 0, blank = 0; const ud = {};
    for (const id of s.ids) {
      const q = Q_BY.get(id), right = isRight(s, id), u = ud[q.ud] || (ud[q.ud] = [0, 0, 0]);
      u[2]++;
      if (s.ans[id] === undefined) blank++; else if (right) { ok++; u[0]++; } else { bad++; u[1]++; }
      qRecord(id, right);
    }
    const n = s.ids.length, nota = Math.round(Math.max(0, (ok - bad * PEN) / n * 10) * 10) / 10;
    const rec = { t: Date.now(), n, ok, bad, blank, nota, ud };
    T.sims.push(rec); T.sims = T.sims.slice(-60); tCommit();
    s.res = rec; pendingSim = null; LS.set(TSKEY, '');
    view = 'qdone'; render();
  }
  function finishPrac() {
    const s = tses, ok = s.ids.filter(id => isRight(s, id)).length;
    s.res = { ok, bad: s.ids.length - ok, n: s.ids.length };
    view = 'qdone'; render();
  }

  // ---------- resultado ----------
  function byUdHTML(ud) {
    const rows = UDS.filter(u => ud[u.ud] && ud[u.ud][2]).map(u => {
      const [ok, bad, n] = ud[u.ud], blank = n - ok - bad;
      const segs = [['s-ok', ok], ['s-bad', bad], ['', blank]].filter(x => x[1]).map(([c, k]) => '<i class="' + c + '" style="flex-grow:' + k + '"></i>').join('');
      return '<div class="byud-row u' + u.ud + '"><span class="udtag">UD' + u.ud + '</span><span class="mbar" role="img" aria-label="' + ok + ' bien, ' + bad + ' mal, ' + blank + ' en blanco">' + segs + '</span><span>' + ok + '/' + n + '</span></div>';
    }).join('');
    return '<section class="sec"><h2>Por unidades</h2><div class="byud">' + rows + '</div>' +
      '<div class="legend"><span class="l-ok">bien</span><span class="l-bad">mal</span><span class="l-blank">en blanco</span></div></section>';
  }
  function reviewHTML(s, id) {
    const q = Q_BY.get(id), a = s.ans[id], blank = a === undefined || a === -1;
    return '<div class="rv u' + q.ud + '"><p class="rv-q"><span class="udtag">UD' + q.ud + '</span>' + inline(q.q) + '</p>' + codeHTML(q.code) +
      (blank ? '<p class="rv-a blank">' + ICON.dash + '<span>En blanco</span></p>' : '<p class="rv-a bad">' + ICON.x + '<span>' + inline(q.ops[s.perm[id][a]]) + '</span></p>') +
      '<p class="rv-a ok">' + ICON.check + '<span>' + inline(q.ops[0]) + '</span></p>' +
      '<p class="rv-why">' + inline(q.why) + '</p></div>';
  }
  function renderQDone() {
    const s = tses, sim = s.kind === 'sim', r = s.res;
    const miss = s.ids.filter(id => !isRight(s, id));
    let top;
    if (sim) {
      const pass = r.nota >= PASS;
      top = '<div><h2>Simulacro · ' + esc(fecha(r.t)) + '</h2></div>' +
        '<div class="score"><b>' + nf(r.nota) + '</b><span>sobre 10</span><span class="tag ' + (pass ? 'ok' : 'bad') + '">' + (pass ? ICON.check + 'Aprobado' : ICON.x + 'Suspenso') + '</span></div>' +
        '<div class="tiles"><div class="tile ok"><b>' + r.ok + '</b><span>bien</span></div><div class="tile bad"><b>' + r.bad + '</b><span>mal</span></div><div class="tile"><b>' + r.blank + '</b><span>en blanco</span></div></div>' +
        '<p class="formula">Nota = (' + r.ok + ' − ' + r.bad + ' ÷ 3) ÷ ' + r.n + ' × 10 = ' + nf(r.nota) + '</p>' +
        verdictHTML();
    } else {
      top = '<div><h2>' + esc(s.title) + '</h2><h1>' + (miss.length ? r.ok + ' de ' + r.n + ' bien' : '¡Todas bien!') + '</h1></div>' +
        '<div class="tiles two"><div class="tile ok"><b>' + r.ok + '</b><span>bien</span></div><div class="tile bad"><b>' + r.bad + '</b><span>mal o «no lo sé»</span></div></div>';
    }
    const redoTxt = miss.length === 1 ? 'Repasar la que fallé' : 'Repasar las ' + miss.length + (sim ? ' que fallé o dejé en blanco' : ' que fallé');
    app.innerHTML =
      '<div class="view"><div class="scroll"><div class="done wrap">' + top +
      (miss.length ? '<button class="btn" id="qredo">' + redoTxt + '</button>' : '') +
      (sim ? '<button class="btn ghost" id="qagain">Otro simulacro</button>' : '') +
      '<button class="btn ghost" id="qhome">Volver al inicio</button>' +
      (sim ? byUdHTML(r.ud) : '') +
      (miss.length ? '<section class="sec"><h2>Revisión · ' + miss.length + '</h2><div class="review">' + miss.map(id => reviewHTML(s, id)).join('') + '</div></section>' : '') +
      '</div></div></div>';
    bindHist();
    const rd = document.getElementById('qredo');
    if (rd) rd.onclick = () => startPrac(shuffle(miss.slice()), 'Repaso de los fallos');
    const ag = document.getElementById('qagain'); if (ag) ag.onclick = startSim;
    document.getElementById('qhome').onclick = () => { tses = null; view = 'home'; render(); };
  }

  // ---------- sesión de estudio ----------
  function startSession(ids, title) {
    ses = { q: ids.slice(), i: 0, flipped: false, first: {}, requeued: {}, title: title, total: ids.length };
    view = 'study'; render();
  }
  function seriesDots(c) {
    let d = '';
    for (let k = 1; k <= c.total; k++) d += '<i class="' + (k < c.n ? 'on' : k === c.n ? 'on cur' : '') + '"></i>';
    return '<div class="serie"><span class="nt">' + c.n + '/' + c.total + '</span><span>' + esc(c.serie) + '</span><span class="dots" aria-hidden="true">' + d + '</span></div>';
  }
  function eyebrow(c) {
    return '<div class="eyebrow"><span class="udtag">UD' + c.ud + '</span><span>' + esc(c.tema) + '</span>' +
      (c.imp === 1 ? '<span class="star" title="Esencial">★ Esencial</span>' : '') + '</div>';
  }
  function renderStudy() {
    const id = ses.q[ses.i], c = BY_ID.get(id);
    if (!c) { ses.i++; return ses.i < ses.q.length ? renderStudy() : finish(); }
    const pct = 100 * ses.i / ses.q.length;
    const serie = c.serie && c.total > 1 ? seriesDots(c) : '';
    app.innerHTML =
      '<div class="view">' +
      '<div class="studybar wrap"><button class="icon-btn" id="quit" aria-label="Salir al inicio">' + ICON.x + '</button>' +
      '<div class="prog" aria-hidden="true"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<span class="count">' + (ses.i + 1) + ' / ' + ses.q.length + '</span></div>' +
      '<div class="stage wrap"><div class="card in u' + c.ud + (ses.flipped ? ' flipped' : '') + '" id="card" tabindex="0" role="button" aria-label="Ficha. Toca para girarla">' +
      '<div class="inner">' +
      '<div class="face front" aria-hidden="' + ses.flipped + '">' + eyebrow(c) + serie +
      '<p class="q">' + inline(c.q) + '</p><p class="tap">Intenta responder antes de girarla</p></div>' +
      '<div class="face back" aria-hidden="' + !ses.flipped + '">' + eyebrow(c) + serie +
      '<p class="q-small">' + inline(c.q) + '</p>' +
      '<div class="ans">' + fmt(c.a) + (c.code ? '<pre>' + esc(c.code) + '</pre>' : '') + '</div>' +
      '<div class="src"><span>Fuente: ' + esc(c.src || '—') + '</span><span>' + statusLabel(id) + '</span></div></div>' +
      '</div><div class="tint" id="tint"></div></div></div>' +
      actionsHTML() + '</div>';
    bindStudy();
  }
  function statusLabel(id) {
    const st = status(id);
    return { new: 'Primera vez', ok: '<span class="st-dot s-ok"></span>Te la sabías', mid: '<span class="st-dot s-mid"></span>La dudaste', bad: '<span class="st-dot s-bad"></span>La fallaste' }[st];
  }
  function actionsHTML() {
    if (!ses.flipped) return '<div class="actions one wrap"><button class="btn" id="flip">Ver respuesta</button></div>';
    return '<div class="actions wrap">' +
      '<button class="rate again" data-r="again">Otra vez<small>no me la sé</small></button>' +
      '<button class="rate hard" data-r="hard">Dudé<small>a medias</small></button>' +
      '<button class="rate good" data-r="good">Me la sé<small>bien</small></button></div>';
  }
  function flip() {
    ses.flipped = !ses.flipped;
    const card = document.getElementById('card'); if (!card) return;
    card.classList.remove('in');
    card.classList.toggle('flipped', ses.flipped);
    card.querySelector('.front').setAttribute('aria-hidden', ses.flipped);
    card.querySelector('.back').setAttribute('aria-hidden', !ses.flipped);
    const old = app.querySelector('.actions'); if (old) old.outerHTML = actionsHTML();
    bindActions();
    const st = app.querySelector('.stage'); if (st) st.scrollTop = 0;
  }
  let busy = false;
  function answer(r) {
    if (busy || !ses || !ses.flipped) return;
    busy = true;
    const id = ses.q[ses.i];
    rateCard(id, r);
    if (!(id in ses.first)) ses.first[id] = r;
    if (r === 'again' && (ses.requeued[id] || 0) < 2) {
      ses.requeued[id] = (ses.requeued[id] || 0) + 1;
      ses.q.splice(Math.min(ses.i + 5, ses.q.length), 0, id);
    }
    const card = document.getElementById('card');
    const next = () => { busy = false; ses.i++; ses.flipped = false; if (ses.i >= ses.q.length) finish(); else renderStudy(); };
    if (card && !reduced()) { card.classList.add(r === 'again' ? 'out-l' : 'out-r'); setTimeout(next, 200); } else next();
  }
  function bindActions() {
    const f = document.getElementById('flip'); if (f) f.onclick = flip;
    app.querySelectorAll('.rate').forEach(b => b.onclick = () => answer(b.dataset.r));
  }
  function bindStudy() {
    document.getElementById('quit').onclick = () => { ses = null; view = 'home'; render(); };
    bindActions();
    const card = document.getElementById('card'), tint = document.getElementById('tint');
    let sx = 0, sy = 0, dx = 0, down = false, moved = false;
    card.addEventListener('pointerdown', e => { if (e.button) return; down = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0; });
    card.addEventListener('pointermove', e => {
      if (!down) return;
      dx = e.clientX - sx; const dy = e.clientY - sy;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
      if (!ses.flipped || Math.abs(dy) > Math.abs(dx)) return;
      card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 40) + 'deg)';
      const k = Math.min(1, Math.abs(dx) / 90);
      tint.className = 'tint ' + (dx > 0 ? 'good' : 'again'); tint.textContent = dx > 0 ? 'Me la sé' : 'Otra vez'; tint.style.opacity = k;
    });
    const end = () => {
      if (!down) return; down = false;
      card.style.transform = ''; tint.style.opacity = 0;
      if (ses.flipped && Math.abs(dx) > 90) { answer(dx > 0 ? 'good' : 'again'); return; }
      if (!moved) flip();
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', () => { down = false; card.style.transform = ''; tint.style.opacity = 0; });
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    card.focus({ preventScroll: true });
  }
  document.addEventListener('keydown', e => {
    if (view === 'quiz' && tses) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.length === 1 ? Math.max('1234'.indexOf(e.key), 'abcd'.indexOf(e.key.toLowerCase())) : -1;
      if (k >= 0) { e.preventDefault(); pick(k); return; }
      if (e.key === 'Escape') { quitQuiz(); return; }
      if (e.key === 'ArrowLeft') { qPrev(); return; }
      if ((e.key === 'Enter' && e.target.tagName !== 'BUTTON') || e.key === 'ArrowRight') { e.preventDefault(); qNext(); }
      return;
    }
    if (view !== 'study' || !ses) return;
    if (e.key === 'Escape') { ses = null; view = 'home'; render(); return; }
    if (!ses.flipped) { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flip(); } return; }
    if (e.key === 'ArrowLeft' || e.key === '1') answer('again');
    else if (e.key === 'ArrowDown' || e.key === '2') answer('hard');
    else if (e.key === 'ArrowRight' || e.key === '3') answer('good');
  });
  function finish() { view = 'done'; render(); }
  function renderDone() {
    const f = ses.first, ids = Object.keys(f);
    const ok = ids.filter(i => f[i] === 'good').length, mid = ids.filter(i => f[i] === 'hard').length, bad = ids.filter(i => f[i] === 'again').length;
    const miss = ses.q.filter((id, k) => ses.q.indexOf(id) === k && f[id] && f[id] !== 'good');
    const head = miss.length === 0 ? '¡Todas a la primera!' : ok >= miss.length ? 'Buen repaso' : 'Repaso hecho';
    app.innerHTML =
      '<div class="view"><div class="scroll"><div class="done wrap">' +
      '<div><h2>' + esc(ses.title) + '</h2><h1>' + head + '</h1></div>' +
      '<div class="tiles"><div class="tile ok"><b>' + ok + '</b><span>me las sé</span></div><div class="tile mid"><b>' + mid + '</b><span>dudé</span></div><div class="tile bad"><b>' + bad + '</b><span>otra vez</span></div></div>' +
      (miss.length ? '<button class="btn" id="redo">' + (miss.length === 1 ? 'Repasar la que no sabía' : 'Repasar las ' + miss.length + ' que no sabía') + '</button>' : '') +
      '<button class="btn ghost" id="home">Volver al inicio</button>' +
      (miss.length ? '<div class="miss"><h2>Para repasar</h2><ul>' + miss.map(id => '<li>' + inline(BY_ID.get(id).q) + '</li>').join('') + '</ul></div>' : '') +
      '</div></div></div>';
    const r = document.getElementById('redo');
    if (r) r.onclick = () => startSession(miss, 'Repaso de las que no sabía');
    document.getElementById('home').onclick = () => { ses = null; view = 'home'; render(); };
  }

  // ---------- lista ----------
  function renderList() {
    const cards = pool();
    let html = '', lastUd = null, lastTema = null;
    for (const c of cards) {
      if (c.ud !== lastUd || c.tema !== lastTema) {
        html += '<h3 class="u' + c.ud + '"><span class="udtag">UD' + c.ud + '</span>' + esc(c.tema) + '</h3>';
        lastUd = c.ud; lastTema = c.tema;
      }
      const st = status(c.id);
      html += '<button class="item u' + c.ud + '" data-id="' + esc(c.id) + '"><span class="iq"><span><span class="st-dot s-' + st + '"></span>' + inline(c.q) + '</span>' +
        '<em>' + (c.serie && c.total > 1 ? c.n + '/' + c.total : '') + (c.imp === 1 ? ' ★' : '') + '</em></span>' +
        '<span class="ia"><span class="ans">' + fmt(c.a) + (c.code ? '<pre>' + esc(c.code) + '</pre>' : '') + '</span></span></button>';
    }
    app.innerHTML =
      '<div class="view"><div class="listbar wrap"><button class="icon-btn" id="lback" aria-label="Volver">' + ICON.back + '</button>' +
      '<h2>' + esc(describe()) + ' · ' + cards.length + '</h2>' +
      '<button class="link" id="hideA">' + (P.hideA ? 'Mostrar respuestas' : 'Ocultar respuestas') + '</button></div>' +
      '<div class="scroll"><div class="list wrap' + (P.hideA ? ' hide-a' : '') + '" id="listbox">' + html + '</div></div></div>';
    document.getElementById('lback').onclick = () => { view = 'home'; render(); };
    document.getElementById('hideA').onclick = () => { P.hideA = !P.hideA; savePrefs(); keepScroll(renderList); };
    app.querySelectorAll('.item').forEach(b => b.onclick = () => { if (P.hideA) b.classList.toggle('open'); });
  }

  // ---------- arranque (conserva la sesión si la página se actualiza mientras estudias) ----------
  function boot(data) {
    if (isObj(data) && isObj(data.ses) && Array.isArray(data.ses.q) && data.ses.q.every(id => BY_ID.has(id))) {
      ses = data.ses; view = data.view === 'done' ? 'done' : 'study'; ses.flipped = false;
    }
    if (isObj(data)) {
      const ts = validSes(data.tses);
      if (ts && ['quiz', 'qconfirm', 'qdone'].includes(data.view) && (data.view !== 'qdone' || ts.res)) { tses = ts; view = data.view; }
      const ps = validSes(data.pendingSim);
      if (ps && ps.kind === 'sim' && !ps.res && !tses) pendingSim = ps;
    }
    render();
    initRemote();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ ses: ses, view: view, tses: tses, pendingSim: pendingSim })); } catch (e) { /* sin hot */ } }
  if (hot && typeof hot.ready === 'function') { try { hot.ready(boot); } catch (e) { boot({}); } }
  else boot((hot && hot.data) || {});
})();
</script>
