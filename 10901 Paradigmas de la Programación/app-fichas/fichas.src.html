<style>
/* Layout: app de una pantalla; inicio desplazable con botón fijo abajo; estudio = ficha de cartulina rayada que se gira. */
:root {

  --bad: #C43F38;
  --shadow: 0 1px 2px rgba(23, 32, 43, .06), 0 10px 28px rgba(23, 32, 43, .08);
  --rate-ink: #FFFFFF;

  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;

}

    --ok: #4CC089; --mid: #E2A746; --bad: #F06F68; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px rgba(0, 0, 0, .35);

}
:root[data-theme="dark"] {

  --accent: #8EA6FF; --accent-ink: #0F141A; --rule: #B95A5A; --ruled: #212A36; --hi: #6B5A12; --hi-ink: #FFF4C4;
  --ok: #4CC089; --mid: #E2A746; --bad: #F06F68; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px rgba(0, 0, 0, .35);

/* ---------- inicio ---------- */
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  color: var(--muted); margin: 0;

.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

.global { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.big b { font-family: var(--f-display); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.big span { color: var(--muted); font-size: 15px; }
.stack { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--chip); }
.stack i { display: block; height: 100%; }
.stack .s-ok { background: var(--ok); } .stack .s-mid { background: var(--mid); } .stack .s-bad { background: var(--bad); }

.uds { display: flex; flex-direction: column; gap: 8px; }

  display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 12px; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 11px 12px; cursor: pointer;
  transition: border-color .15s, background-color .15s;
}

.ud-glyph {
  width: 46px; height: 46px; border-radius: 11px; display: grid; place-items: center; background: var(--chip);
  font-family: var(--f-mono); font-weight: 600; font-size: 17px; color: var(--ink);
}

.ud-check {

}

}

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 9px 6px; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; }

.toggle {

  border-radius: 12px; padding: 11px 14px; cursor: pointer; text-align: left; width: 100%;
}

.howto { color: var(--muted); font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 16px; }

.reset { align-self: flex-start; background: none; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.reset.armed { border-color: var(--bad); color: var(--bad); font-weight: 700; }

.dock { border-top: 1px solid var(--line); background: var(--bg); padding-block: 12px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.btn {
  border: 0; border-radius: 14px; padding: 15px 18px; font-weight: 700; font-size: 16.5px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.empty-note { grid-column: 1 / -1; margin: 0; font-size: 13.5px; color: var(--bad); }

/* ---------- estudio ---------- */
.studybar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding-block: 10px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; stroke: var(--ink); }
.prog { height: 8px; border-radius: 5px; background: var(--chip); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .25s; }
.count { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); font-weight: 700; min-width: 4.5em; text-align: right; }
.stage { flex: 1; min-height: 0; overflow-y: auto; padding-block: 6px 14px; perspective: 1400px; }
.card { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; outline: none; border-radius: 18px; cursor: pointer; }
.inner { display: grid; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2, .7, .2, 1); }
.card.flipped .inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface);
  border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); min-height: min(62vh, 520px);
  display: flex; flex-direction: column; padding: 18px 18px 16px; gap: 14px;
}
.back { transform: rotateY(180deg); }
.front {
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 33px, var(--ruled) 33px, var(--ruled) 34px);
  background-position: 0 74px; background-origin: border-box;
}
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; color: var(--muted); padding-bottom: 12px; border-bottom: 2px solid var(--rule); }
.eyebrow .udtag { font-family: var(--f-mono); font-weight: 600; color: var(--ink); }
.eyebrow .star { color: var(--mid); font-weight: 700; margin-left: auto; }
.serie { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--accent); }
.serie .dots { display: inline-flex; gap: 4px; }
.serie .dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--accent); display: block; }
.serie .dots i.on { background: var(--accent); }
.serie .dots i.cur { transform: scale(1.3); }
.serie .nt { font-family: var(--f-mono); font-size: 12.5px; background: var(--chip); color: var(--ink); padding: 2px 7px; border-radius: 6px; }
.q { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 6.2vw, 28px); line-height: 1.2; letter-spacing: -.01em; margin: 0; text-wrap: balance; flex: 1; display: flex; align-items: center; }
.tap { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.q-small { font-weight: 700; font-size: 15px; color: var(--muted); margin: 0; line-height: 1.3; }
.ans { font-size: 18px; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.ans p { margin: 0; }
.ans ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.ans li { padding-left: 18px; position: relative; }
.ans li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
mark { background: linear-gradient(transparent 38%, var(--hi) 38%, var(--hi) 92%, transparent 92%); color: inherit; padding: 0 2px; border-radius: 2px; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--chip); padding: 1px 5px; border-radius: 5px; }
pre {
  margin: 0; font-family: var(--f-mono); font-size: 14px; line-height: 1.5; background: var(--chip); border-radius: 10px;
  padding: 10px 12px; overflow-x: auto; white-space: pre; -webkit-user-select: text; user-select: text;
}
.src { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; }
.tint { position: absolute; inset: 0; border-radius: 18px; pointer-events: none; opacity: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 26px; }
.tint.good { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
.tint.again { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.card.out-r { transition: transform .22s ease-in, opacity .22s; transform: translateX(110%) rotate(6deg); opacity: 0; }
.card.out-l { transition: transform .22s ease-in, opacity .22s; transform: translateX(-110%) rotate(-6deg); opacity: 0; }
.card.in { animation: cardin .22s ease-out; }
@keyframes cardin { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.actions { padding-block: 10px 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--line); }
.actions.one { grid-template-columns: 1fr; }
.rate { border: 0; border-radius: 14px; padding: 13px 6px; font-weight: 700; font-size: 15.5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--rate-ink); }
.rate small { font-weight: 400; font-size: 11.5px; opacity: .85; }
.rate.again { background: var(--bad); } .rate.hard { background: var(--mid); } .rate.good { background: var(--ok); }

/* ---------- resumen ---------- */
.done { display: flex; flex-direction: column; gap: 18px; padding-block: 28px 24px; }
.done h1 { font-size: 30px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.tile b { font-family: var(--f-display); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
.tile span { font-size: 13px; color: var(--muted); }

.miss li { font-size: 14.5px; }
.miss ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }

.listbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.listbar h2 { font-size: 13px; }
.list { display: flex; flex-direction: column; gap: 10px; padding-block: 14px 28px; }
.list h3 { font-family: var(--f-display); font-size: 19px; font-weight: 700; margin: 14px 0 2px; letter-spacing: -.01em; }
.list h3 small { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); font-weight: 600; margin-right: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; width: 100%; }
.item .iq { font-weight: 700; font-size: 15.5px; line-height: 1.3; display: flex; gap: 8px; justify-content: space-between; }
.item .iq em { font-style: normal; font-family: var(--f-mono); font-size: 11.5px; color: var(--accent); white-space: nowrap; }
.item .ans { font-size: 15px; gap: 5px; }
.item .ans li { padding-left: 16px; }
.item pre { font-size: 13px; }
.list.hide-a .item:not(.open) .ia { display: none; }
.st-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--chip); vertical-align: 1px; }
.st-dot.s-ok { background: var(--ok); } .st-dot.s-mid { background: var(--mid); } .st-dot.s-bad { background: var(--bad); }

@media (prefers-reduced-motion: reduce) {
  .inner { transition: none; }
  .face { transition: opacity .15s; }
  .card.flipped .inner { transform: none; }
  .card .back { transform: none; opacity: 0; }
  .card.flipped .back { opacity: 1; }
  .card.flipped .front { opacity: 0; }
  .card.out-r, .card.out-l, .card.in { animation: none; transition: none; transform: none; }
  .prog i, .sw, .sw::after { transition: none; }
}
@media (min-width: 700px) {
  .q { font-size: 30px; }
}
</style>

  function stable(x) {

  let S = sanitize(parse(LS.get(KEY)));
  const DEF_PREFS = { uds: UDS.map(u => u.ud), off: [], filtro: 'todas', ess: false, orden: 'temario', hideA: false };
  let P = Object.assign({}, DEF_PREFS, isObj(parse(LS.get(PKEY))) ? parse(LS.get(PKEY)) : {});

  const savePrefs = () => LS.set(PKEY, JSON.stringify(P));

  // ---------- sincronización con la cuenta (capacidad db) ----------
  const Remote = { ref: null, status: 'local', writing: false, again: false, last: null, t: 0 };
  const SYNC_TXT = { local: ['', 'Progreso guardado en este dispositivo'], connecting: ['', 'Conectando con tu cuenta…'], ok: ['ok', 'Progreso sincronizado con tu cuenta'], error: ['err', 'Sin conexión; se guardará al volver'] };
  function syncHTML() { const m = SYNC_TXT[Remote.status]; return '<span class="sync ' + m[0] + '" id="sync-st"><i></i>' + m[1] + '</span>'; }
  function setSync(st) { Remote.status = st; const el = document.getElementById('sync-st'); if (el) el.outerHTML = syncHTML(); }
  async function initRemote() {
    if (!(window.claude && typeof window.claude.use === 'function')) return;

      const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
      if (!user || !db) return;
      const id = await user.id(); if (!id) return;
      Remote.ref = db.doc('data/users/' + id + '/fichas-paradigmas');
      setSync('connecting');
      const timer = setTimeout(() => { if (Remote.status === 'connecting') setSync('error'); }, 10000);
      Remote.ref.onSnapshot(snap => {
        if (!snap.metadata || !snap.metadata.fromCache) clearTimeout(timer);
        const remote = snap.exists ? sanitize(snap.data()) : null;
        Remote.last = remote ? stable(remote) : null;
        if (remote) {
          const m = merge(S, remote);
          if (stable(m) !== stable(S)) { S = m; LS.set(KEY, JSON.stringify(S)); if (view === 'home') render(); }
        }
        setSync('ok');
        if (stable(S) !== Remote.last && (Object.keys(S.cards).length || S.epoch)) scheduleWrite(1200);

    } catch (e) { setSync('local'); }
  }
  function scheduleWrite(ms) { if (!Remote.ref) return; clearTimeout(Remote.t); Remote.t = setTimeout(flushWrite, ms || 600); }
  async function flushWrite() {
    if (!Remote.ref) return;
    if (Remote.writing) { Remote.again = true; return; }
    const body = stable(S); if (body === Remote.last) return;

    try { await Remote.ref.set(JSON.parse(body)); Remote.last = body; setSync('ok'); }
    catch (e) { if (e && e.code === 'invalid_argument') { Remote.ref = null; setSync('local'); } else setSync('error'); }

  }
  function commit() { LS.set(KEY, JSON.stringify(S)); scheduleWrite(700); }

  // ---------- estado de cada ficha ----------
  const rec = id => S.cards[id];
  function status(id) { const e = rec(id); if (!e || !e.n) return 'new'; return e.b >= 2 ? 'ok' : e.b === 1 ? 'mid' : 'bad'; }
  function rateCard(id, r) {
    const e = Object.assign({ b: 0, n: 0, ok: 0, last: 0 }, rec(id));

  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---------- vistas ----------

  // ---------- sesión de estudio ----------
  function startSession(ids, title) {

  function seriesDots(c) {

  }

  }
  function statusLabel(id) {

  }
  function actionsHTML() {
    if (!ses.flipped) return '<div class="actions one wrap"><button class="btn" id="flip">Ver respuesta</button></div>';

      '<button class="rate again" data-r="again">Otra vez<small>no me la sé</small></button>' +
      '<button class="rate hard" data-r="hard">Dudé<small>a medias</small></button>' +

  function flip() {
    ses.flipped = !ses.flipped;

  }
  let busy = false;
  function answer(r) {
    if (busy || !ses || !ses.flipped) return;

    const id = ses.q[ses.i];
    rateCard(id, r);
    if (!(id in ses.first)) ses.first[id] = r;
    if (r === 'again' && (ses.requeued[id] || 0) < 2) {

  }
  function bindActions() {
    const f = document.getElementById('flip'); if (f) f.onclick = flip;

  function bindStudy() {
    document.getElementById('quit').onclick = () => { ses = null; view = 'home'; render(); };

      const k = Math.min(1, Math.abs(dx) / 90);

    });
    const end = () => {
      if (!down) return; down = false;
      card.style.transform = ''; tint.style.opacity = 0;

  function finish() { view = 'done'; render(); }
  function renderDone() {

    const miss = ses.q.filter((id, k) => ses.q.indexOf(id) === k && f[id] && f[id] !== 'good');

    app.innerHTML =

      '<button class="btn ghost" id="home">Volver al inicio</button>' +
      (miss.length ? '<div class="miss"><h2>Para repasar</h2><ul>' + miss.map(id => '<li>' + inline(BY_ID.get(id).q) + '</li>').join('') + '</ul></div>' : '') +
      '</div></div></div>';

  }

  // ---------- lista ----------
  function renderList() {
    const cards = pool();
    let html = '', lastUd = null, lastTema = null;
    for (const c of cards) {
      if (c.ud !== lastUd || c.tema !== lastTema) {
        html += '<h3><small>UD' + c.ud + '</small>' + esc(c.tema) + '</h3>';
        lastUd = c.ud; lastTema = c.tema;
      }
      const st = status(c.id);
      html += '<button class="item" data-id="' + esc(c.id) + '"><span class="iq"><span><span class="st-dot s-' + st + '"></span>' + inline(c.q) + '</span>' +
        '<em>' + (c.serie && c.total > 1 ? c.n + '/' + c.total : '') + (c.imp === 1 ? ' ★' : '') + '</em></span>' +

      '<div class="view"><div class="listbar wrap"><button class="icon-btn" id="lback" aria-label="Volver">' + ICON.back + '</button>' +
      '<h2>' + esc(describe()) + ' · ' + cards.length + '</h2>' +
      '<button class="link" id="hideA">' + (P.hideA ? 'Mostrar respuestas' : 'Ocultar respuestas') + '</button></div>' +
      '<div class="scroll"><div class="list wrap' + (P.hideA ? ' hide-a' : '') + '" id="listbox">' + html + '</div></div></div>';
    document.getElementById('lback').onclick = () => { view = 'home'; render(); };
    document.getElementById('hideA').onclick = () => { P.hideA = !P.hideA; savePrefs(); keepScroll(renderList); };
    app.querySelectorAll('.item').forEach(b => b.onclick = () => { if (P.hideA) b.classList.toggle('open'); });
  }

  // ---------- arranque (conserva la sesión si la página se actualiza mientras estudias) ----------
  function boot(data) {
    if (isObj(data) && isObj(data.ses) && Array.isArray(data.ses.q) && data.ses.q.every(id => BY_ID.has(id))) {
      ses = data.ses; view = data.view === 'done' ? 'done' : 'study'; ses.flipped = false;
    }
    render();
    initRemote();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ ses: ses, view: view })); } catch (e) { /* sin hot */ } }
  if (hot && typeof hot.ready === 'function') { try { hot.ready(boot); } catch (e) { boot({}); } }
  else boot((hot && hot.data) || {});
})();
</script>
